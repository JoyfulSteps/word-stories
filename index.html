a. \"But it was still nice to hear.\"\n\nMinh did not know what to say. So he said nothing, and they walked on, side by side, under the stars.", "words": 740, "new": [{"w": "divorce", "p": "n/v", "vi": "ly hôn"}, {"w": "divorced", "p": "adj", "vi": "đã ly hôn"}, {"w": "engaged", "p": "adj", "vi": "đã đính hôn"}, {"w": "engagement", "p": "n", "vi": "lễ đính hôn"}, {"w": "funeral", "p": "n", "vi": "đám tang"}, {"w": "retirement", "p": "n", "vi": "sự nghỉ hưu"}, {"w": "pregnant", "p": "adj", "vi": "mang thai"}, {"w": "bride", "p": "n", "vi": "cô dâu"}, {"w": "groom", "p": "n", "vi": "chú rể"}, {"w": "elderly", "p": "adj/n", "vi": "cao tuổi"}, {"w": "teenage", "p": "adj", "vi": "tuổi thiếu niên"}, {"w": "youth", "p": "n/adj", "vi": "tuổi trẻ"}, {"w": "flatmate", "p": "n", "vi": "bạn cùng căn hộ"}, {"w": "hostess", "p": "n", "vi": "nữ chủ nhà"}, {"w": "introduction", "p": "n", "vi": "phần giới thiệu"}, {"w": "adopt", "p": "v", "vi": "nhận con nuôi"}, {"w": "honeymoon", "p": "n", "vi": "tuần trăng mật"}, {"w": "jaw", "p": "n", "vi": "hàm"}, {"w": "fist", "p": "n", "vi": "nắm đấm"}, {"w": "spine", "p": "n", "vi": "cột sống"}, {"w": "rib", "p": "n", "vi": "xương sườn"}, {"w": "skull", "p": "n", "vi": "hộp sọ"}, {"w": "liver", "p": "n", "vi": "gan"}, {"w": "kidney", "p": "n", "vi": "thận"}, {"w": "organ", "p": "n", "vi": "cơ quan"}]}, {"id": "W20-2", "title": "A Day at the Hospital", "body": "In March, Hana started her first placement at Riverford Hospital. She invited Minh to visit on her lunch break. \"Come and see where I work,\" she said. \"But don't touch anything.\"\n\nMinh had never liked hospitals. The smell, the lights, the needles. But he wanted to see Hana. So he went.\n\nHana worked on a ward for older patients. She showed him around. In the first bed, there was an old man who had had a **stroke**. \"Part of his brain was damaged,\" Hana explained quietly. \"He can't move his left arm or leg very well. We help him with exercises.\"\n\nIn the next bed, there was a woman with **diabetes**. \"Her body can't control the sugar in her blood,\" Hana said. \"She needs medicine every day.\" Another woman was being treated for **cancer**. She was very thin, but she smiled at Minh and said, \"Are you the boyfriend? She talks about you.\"\n\nMinh looked at Hana. Hana looked at the floor.\n\nA young man had come in with an **infection** in his leg. There was a big **wound** and a dark **bruise** around it. \"It could be a virus or bacteria,\" Hana said. \"We're waiting for the test results.\" A small girl had **asthma**. She was breathing through a machine. \"Her **allergy** to cats made it worse,\" Hana said. \"She's very **allergic**.\"\n\n\"How do you remember everything?\" Minh asked.\n\n\"Practice,\" said Hana. \"And a good teacher. Look. Every disease has **symptoms**. You learn to look for them. Is the patient tired? Does he **frown** when he moves, because of pain? Does she **yawn** a lot? Does she **sneeze** or cough? Can he **swallow** and **chew** normally? You learn to watch everything.\"\n\nShe showed him a model **skeleton** in the teaching room. \"Every **limb** has bones, muscles, **nerves** and **veins**. When something goes wrong in one place, the whole body feels it. Even a small problem with your **bladder** can make you feel sick everywhere.\"\n\nMinh noticed that one of the doctors, a tall woman, was watching them. Hana saw her too and stood up straight. \"That's Dr. Adeyemi,\" she whispered. \"She's very strict.\" The doctor gave Hana a quick **glance**, then a small **wink**. Hana relaxed. \"Maybe not too strict.\"\n\nThen, suddenly, there was a scream from the corridor. Everybody turned to **stare**. Two nurses ran past with a patient on a bed. Minh saw a face he knew.\n\n\"Leo?\" he said.\n\nIt was Leo, in his football clothes, covered in mud. His face was white. Tom was running behind the bed. \"His knee!\" Tom shouted. \"He hurt his knee at football!\"\n\nMinh ran after them. Hana followed. In the emergency room, a doctor looked at Leo's knee. It was very big and red. Leo was trying not to cry. He did not **blink**. He did not want anybody to see his eyes.\n\n\"It's not broken,\" said the doctor finally. \"But he's done serious damage to the ligament inside the knee. He might need surgery.\"\n\nLeo closed his eyes. Tom held his hand. Minh stood by the door, feeling useless. He wanted to do something, but there was nothing to do. A little dog, a therapy dog that visited the hospital on Fridays, came into the room. It started to **sniff** Leo's shoes and **lick** his hand. Leo laughed a little and gave it a **scratch** behind the ears. For a moment, he forgot the pain.\n\nWhen Minh left, Hana walked him to the door. \"He'll be OK,\" she said. \"Young people heal fast.\"\n\n\"Will he play football again?\" Minh asked.\n\nHana was quiet for a moment. \"Maybe,\" she said. \"It depends. It will be a long road.\"\n\nMinh walked home slowly. He thought about the old man who had a stroke, the woman with cancer, the little girl with asthma, and now Leo. He realized how lucky he was to be healthy. He also realized something else: Hana was very good at her job. She was calm, kind and strong. He admired her a lot.\n\nMaybe, he thought, more than admired.", "words": 673, "new": [{"w": "nerve", "p": "n", "vi": "dây thần kinh"}, {"w": "vein", "p": "n", "vi": "tĩnh mạch"}, {"w": "bladder", "p": "n", "vi": "bàng quang"}, {"w": "skeleton", "p": "n/adj", "vi": "bộ xương"}, {"w": "limb", "p": "n", "vi": "chi"}, {"w": "wink", "p": "v/n", "vi": "nháy mắt"}, {"w": "blink", "p": "v/n", "vi": "chớp mắt"}, {"w": "frown", "p": "v/n", "vi": "cau mày"}, {"w": "yawn", "p": "v/n", "vi": "ngáp"}, {"w": "sneeze", "p": "v/n", "vi": "hắt hơi"}, {"w": "swallow", "p": "v", "vi": "nuốt"}, {"w": "chew", "p": "v", "vi": "nhai"}, {"w": "lick", "p": "v", "vi": "liếm"}, {"w": "scratch", "p": "v/n/adj", "vi": "gãi"}, {"w": "sniff", "p": "v/n", "vi": "hít ngửi"}, {"w": "stare", "p": "v/n", "vi": "nhìn chằm chằm"}, {"w": "glance", "p": "v/n", "vi": "liếc nhìn"}, {"w": "symptom", "p": "n", "vi": "triệu chứng"}, {"w": "infection", "p": "n", "vi": "sự nhiễm trùng"}, {"w": "allergy", "p": "n", "vi": "dị ứng"}, {"w": "allergic", "p": "adj", "vi": "bị dị ứng"}, {"w": "asthma", "p": "n", "vi": "bệnh hen suyễn"}, {"w": "cancer", "p": "n", "vi": "ung thư"}, {"w": "diabetes", "p": "n", "vi": "bệnh tiểu đường"}, {"w": "stroke", "p": "n/v", "vi": "nét; đột quỵ"}, {"w": "wound", "p": "n/v", "vi": "vết thương"}, {"w": "bruise", "p": "n/v", "vi": "vết bầm"}]}, {"id": "W20-3", "title": "Leo's Long Road", "body": "Leo needed **surgery** on his knee. The **surgeon**, a calm man with gray hair, explained everything. \"We'll repair the ligament. The operation takes two hours. After that, he'll need months of **therapy**. He can't play football for at least nine months. Maybe a year.\"\n\nLeo did not say anything. He just stared at the wall.\n\nThe operation went well. When Leo woke up, he was **dizzy** and sick. He **vomited** twice. His knee was **swollen** and **painful**. The nurse gave him a **painkiller** and an **injection** against infection. \"You'll feel better tomorrow,\" she said. \"You'll have a small **scar**, but that's all.\" The next day, Leo had a red **rash** on his arm from the tape, but it went away quickly.\n\nHe stayed in the hospital **ward** for three days. Everyone came to visit. Grandma Rose brought cake. Mia brought drawings. Minh brought comic books. Hana came during her breaks, in her nurse's uniform. \"You're my favourite patient,\" she told Leo. He smiled for the first time.\n\nWhen he went home, he had to use **crutches**. For the first week, he could not even climb the stairs. Tom carried him up like a little boy. At the hospital, Leo had seen people in a **wheelchair** and on a **stretcher**, and he knew he was lucky. But he did not feel lucky.\n\nEvery week, he went to see a **specialist**, a **therapist** named Sarah. She gave him exercises. They were boring and they hurt. \"The knee needs to **heal** slowly,\" she said. \"If you push too hard, you can hurt it again. There's no quick **cure**.\"\n\nAt home, Leo became quiet. He stopped going out. He stopped seeing his friends. He spent all day in his room playing video games. He did not want to talk to anyone. He was depressed.\n\nAnna was worried. \"He's not himself,\" she said. \"He's not eating. He's not sleeping. I think the stress is too much for him.\"\n\nTom tried to talk to him. Leo shouted at him and closed the door. Mia tried. Leo said, \"Leave me alone.\" Minh decided to try too.\n\nHe knocked on Leo's door. \"Can I come in?\"\n\n\"Whatever,\" said Leo.\n\nMinh sat on the end of the bed. Leo did not look at him. For a long time, neither of them said anything.\n\n\"I'm sorry about your knee,\" said Minh finally.\n\n\"It's not just my knee,\" said Leo. \"It's everything. Football was my life. I was going to play for a big team one day. Now I'm **disabled**. I'm useless.\"\n\n\"You're not disabled,\" said Minh. \"You're injured. There's a difference. A **disability** is forever. This is for a year.\"\n\n\"A year is forever,\" said Leo.\n\nMinh thought. \"When I came to England,\" he said, \"I felt like a **deaf** person. I couldn't understand anyone. I felt stupid. I felt stressed every day. Sometimes I cried at night. I wanted to go home.\"\n\nLeo looked at him for the first time. \"Really? You?\"\n\n\"Really. Depression is not only for old people or sick people. It can happen to anyone. But it gets better. Slowly. Like a knee.\"\n\nLeo was quiet. Then he said, \"What helped you?\"\n\n\"People,\" said Minh. \"Your family. Grandma Rose. Sam. And doing small things. One step at a time. Like your exercises. They're boring, but they work.\"\n\nThe next day, Leo did his exercises without complaining. The day after, he went downstairs for dinner. The week after, he went to watch his team play. He sat on the side of the pitch on his crutches. His teammates cheered when they saw him.\n\n\"Sarah says I'm doing well,\" he told Minh a month later. \"She says my knee is getting stronger. And my **prescription** for painkillers is finished. I don't need them anymore.\"\n\n\"That's great,\" said Minh.\n\n\"Doctors can examine you and give you a **vaccine** to prevent some diseases,\" said Leo, \"but they can't stop you from being stupid. I was stupid to give up.\"\n\n\"You weren't stupid,\" said Minh. \"You were sad. Different thing.\"\n\nLeo smiled. \"Thanks, Minh. Really.\"\n\n\"Anytime,\" said Minh. \"And Leo?\"\n\n\"Yeah?\"\n\n\"Your room smells terrible. Open a window. You could **infect** the whole house.\"\n\nLeo threw a pillow at him. Minh laughed. It was the old Leo again. Almost.", "words": 708, "new": [{"w": "scar", "p": "n", "vi": "vết sẹo"}, {"w": "rash", "p": "n", "vi": "phát ban"}, {"w": "swollen", "p": "adj", "vi": "sưng"}, {"w": "dizzy", "p": "adj", "vi": "chóng mặt"}, {"w": "vomit", "p": "v/n", "vi": "nôn"}, {"w": "prescription", "p": "n/adj", "vi": "đơn thuốc"}, {"w": "surgeon", "p": "n", "vi": "bác sĩ phẫu thuật"}, {"w": "surgery", "p": "n", "vi": "phẫu thuật"}, {"w": "specialist", "p": "n/adj", "vi": "chuyên gia"}, {"w": "therapy", "p": "n", "vi": "trị liệu"}, {"w": "therapist", "p": "n", "vi": "chuyên viên trị liệu"}, {"w": "vaccine", "p": "n", "vi": "vắc-xin (chất kích thích hệ miễn dịch tạo bảo vệ chống bệnh)"}, {"w": "injection", "p": "n", "vi": "mũi tiêm"}, {"w": "ward", "p": "n", "vi": "khu bệnh"}, {"w": "stretcher", "p": "n", "vi": "cáng"}, {"w": "crutches", "p": "n", "vi": "nạng"}, {"w": "wheelchair", "p": "n", "vi": "xe lăn"}, {"w": "disabled", "p": "adj/n", "vi": "khuyết tật"}, {"w": "disability", "p": "n", "vi": "tình trạng khuyết tật"}, {"w": "deaf", "p": "adj", "vi": "điếc"}, {"w": "cure", "p": "v/n", "vi": "thuốc chữa; chữa khỏi"}, {"w": "heal", "p": "v", "vi": "lành lại"}, {"w": "infect", "p": "v", "vi": "lây nhiễm"}, {"w": "painful", "p": "adj", "vi": "đau đớn"}, {"w": "painkiller", "p": "n", "vi": "thuốc giảm đau"}]}, {"id": "W20-4", "title": "New Looks", "body": "Leo's injury changed many things in the house. One of them was food. The therapist said Leo needed good **nutrition** to heal. \"More vegetables, more protein, fewer chips,\" she said. \"And take your **vitamins**. You've finished the **antibiotic** from the hospital, so now we help the body with good food.\"\n\nSo Anna changed the family's diet. No more pizza on Fridays. No more cake every day. \"We all eat too much sugar,\" she said. \"Tom, you too.\"\n\n\"I'm not **obese**,\" said Tom. \"I'm just big-boned.\"\n\n\"The doctor said you're overweight,\" said Anna. \"Your **figure** isn't what it was. That's the official number. Do you want me to show you the **figures**?\"\n\nTom did not want to see the figures.\n\nMia was the opposite. She was very skinny, and the doctor said she was a little **underweight**. \"You need to eat more,\" Anna told her. Mia ate more cake. \"Not cake,\" said Anna.\n\nMeanwhile, Leo was getting stronger. He went to the gym with his therapist and worked on his arms and his upper body, because he couldn't use his legs. After three months, he was very **muscular**. He looked in the mirror a lot. \"I look **gorgeous**,\" he said. Mia laughed so much she almost fell off her chair.\n\nThen Leo had an idea. \"I'm going to get a tattoo,\" he said. \"A football on my arm. Because I'll play again.\"\n\n\"Absolutely not,\" said Anna. \"Not until you're eighteen.\"\n\nMia was also changing her look. Since she started her Saturday art classes in London, she had become very **stylish**. She wore **fashionable** clothes from second-hand shops, big earrings and black boots. One day she came home with a new haircut: short, with a straight **fringe**. \"In America, they call that **bangs**,\" said Tom. Mia rolled her eyes. Before, she always wore her hair in a **ponytail**. Now she looked older, more like an artist.\n\n\"You **resemble** your grandmother when she was young,\" said Grandma Rose, looking at her. \"I had the same haircut in 1963.\"\n\nMinh, on the other hand, was not stylish at all. He wore the same jeans every day, and his hair was always a mess. Hana said he looked **scruffy**. \"A nice kind of scruffy,\" she added. But Minh decided to try. He bought a new shirt and got a haircut. After the summer, he was **tanned** from walking in the sun. His **complexion** was darker and healthier. \"You look good,\" said Hana, and Minh felt about ten feet tall.\n\nBut the new diet was not easy for everyone. Daniel's café was full of temptation. The smell of fresh bread and chocolate cake was everywhere. Some customers smoked outside the café. One old customer, a heavy smoker, coughed all the time. He had smoked a **cigarette** every hour for fifty years. \"I'm **addicted**,\" he said honestly. \"It's a terrible **addiction**. I've tried to stop twenty times. To smoke is stupid, I know.\"\n\nDaniel did not serve **alcohol** at The Blue Cup, but on Friday nights, some customers came in from the pub next door, a little **drunk**. One night, a young man was so drunk that he fell asleep at a table. Minh and Daniel had to call his friend to take him home.\n\n\"Alcohol is a kind of **poison**,\" said Hana, when Minh told her. \"In small amounts, it's OK. But too much is really **poisonous** for your liver.\"\n\nHana knew a lot about health. She also knew about **sickness** in **pregnancy**. Ben's sister was having a very difficult time, and Hana sometimes went to help her. \"She feels sick every morning,\" Hana said. \"It's normal, but it's hard.\"\n\nMinh realized that everyone around him was thinking about their bodies and their health: Leo's knee, Tom's weight, Mia's style, Ben's sister's baby. \"I think the most important thing is wellbeing,\" said Hana. \"Not just the body. The mind too. Being happy.\"\n\n\"Are you happy?\" Minh asked her.\n\nShe thought. \"Right now? Yes.\"\n\n\"Me too,\" said Minh.", "words": 660, "new": [{"w": "antibiotic", "p": "n/adj", "vi": "thuốc kháng sinh"}, {"w": "vitamin", "p": "n", "vi": "vi-ta-min"}, {"w": "nutrition", "p": "n", "vi": "dinh dưỡng"}, {"w": "obese", "p": "adj", "vi": "béo phì"}, {"w": "underweight", "p": "adj", "vi": "thiếu cân"}, {"w": "addicted", "p": "adj", "vi": "bị nghiện"}, {"w": "addiction", "p": "n", "vi": "sự nghiện"}, {"w": "cigarette", "p": "n", "vi": "điếu thuốc lá"}, {"w": "alcohol", "p": "n", "vi": "cồn"}, {"w": "drunk", "p": "adj", "vi": "say rượu"}, {"w": "sickness", "p": "n", "vi": "tình trạng ốm"}, {"w": "poison", "p": "n/v", "vi": "chất độc"}, {"w": "poisonous", "p": "adj", "vi": "có độc"}, {"w": "pregnancy", "p": "n", "vi": "thai kỳ"}, {"w": "muscular", "p": "adj", "vi": "vạm vỡ"}, {"w": "tanned", "p": "adj", "vi": "rám nắng"}, {"w": "gorgeous", "p": "adj", "vi": "rất đẹp"}, {"w": "stylish", "p": "adj", "vi": "sành điệu"}, {"w": "fashionable", "p": "adj", "vi": "hợp thời trang"}, {"w": "scruffy", "p": "adj", "vi": "luộm thuộm"}, {"w": "ponytail", "p": "n", "vi": "tóc đuôi ngựa"}, {"w": "fringe", "p": "n/v", "vi": "vùng rìa"}, {"w": "bangs", "p": "n", "vi": "tóc mái"}, {"w": "complexion", "p": "n", "vi": "nước da"}, {"w": "figure", "p": "n/v", "vi": "con số, số liệu"}, {"w": "resemble", "p": "v", "vi": "trông giống"}]}, {"id": "W20-5", "title": "The Personality Test", "body": "One rainy Sunday, Mia found a personality test in a magazine. \"Everybody has to do it,\" she said. \"It tells you what kind of person you are.\"\n\n\"That's stupid,\" said Leo. \"Tests can't tell you anything.\"\n\n\"You're so **grumpy**,\" said Mia. \"That's your result already. Grumpy.\"\n\nShe read the questions out loud, and everyone answered: Tom, Anna, Leo, Grandma Rose, Minh and Hana, who was visiting.\n\nThe first question was: \"At a party, do you talk to everyone, or do you stay with people you know?\"\n\n\"I talk to everyone,\" said Tom, showing the small **tattoo** of an anchor on his arm, from when he was nineteen. \"I even talked to the man who did this. I'm very **outgoing** and **sociable**.\"\n\n\"Too sociable,\" said Anna. \"Last Christmas, you talked to the waiter for an hour.\"\n\n\"He was **charming**,\" said Tom.\n\nThe next question: \"When you play a game, do you need to win?\"\n\n\"Yes,\" said Leo and Mia at the same time. They were both very **competitive**. Last year, they had a fight about a game of cards that lasted three days.\n\n\"I'm not competitive at all,\" said Grandma Rose. \"I just like to win.\"\n\nEveryone laughed.\n\n\"When you have a problem, do you think the future will be good or bad?\"\n\n\"Good,\" said Minh. \"I'm **optimistic**.\"\n\n\"Bad,\" said Leo. \"I'm **pessimistic**. Since my knee, anyway.\"\n\n\"You're getting better,\" said Anna. \"Be optimistic.\"\n\nThen Mia read the results. She described everyone like a teacher. \"Dad: **energetic**, **enthusiastic**, a bit **bossy**. You always want to tell everyone what to do.\"\n\n\"I'm not bossy,\" said Tom. \"I'm a leader.\"\n\n\"Mum: **reliable**, **considerate**, **mature**. You think about other people first.\"\n\n\"That's true,\" said Tom. \"She's never **unreliable**. Not once in twenty years.\"\n\n\"Leo,\" Mia went on, \"**moody**, **foolish** sometimes, a little **immature**.\"\n\n\"Hey!\" said Leo.\n\n\"But also **loyal** and **determined**. When you want something, you never stop. Like your exercises.\"\n\nLeo was quiet. That was actually nice.\n\n\"Grandma: **curious**, **cautious**, very wise. You always want to know everything, but you think before you act.\"\n\n\"I was not cautious when I was young,\" said Grandma Rose. \"I was quite **irresponsible**. Ask Margaret.\"\n\n\"Minh,\" said Mia, \"**ambitious**, **flexible**, hard-working. You want to do a lot in life, but you can change your plans when you need to.\"\n\n\"And Hana,\" said Mia. She looked at Hana and smiled. \"Kind. Calm. Patient. And very good for Minh.\"\n\n\"Mia!\" said Minh.\n\nHana laughed. \"Thank you. I think.\"\n\n\"What about you, Mia?\" asked Anna.\n\nMia looked at her own results. \"Creative. **Arrogant**,\" she read. \"What? I'm not arrogant!\"\n\n\"A little arrogant,\" said Leo. \"You won one art prize and now you think you're Picasso.\"\n\n\"At least I'm not **slender** like a stick and **grumpy** like an old man,\" said Mia.\n\n\"At least I'm not...\" Leo started.\n\n\"Children,\" said Anna. \"Enough.\"\n\nLater, when Mia and Leo were arguing about something else, Minh and Hana went for a walk by the river. \"Your family is funny,\" said Hana.\n\n\"They're not my family,\" said Minh. \"Well, they are. Kind of.\"\n\n\"Do you think the test is true?\" Hana asked. \"Am I good for you?\"\n\nMinh stopped walking. He looked at her. Her hair was in the wind and her cheeks were pink from the cold. He took a deep breath.\n\n\"Yes,\" he said. \"I think you are. Very good.\"\n\nHana smiled. \"I think you're good for me too.\"\n\nThey stood by the river for a long time. Then Hana took his hand. It was the most natural thing in the world.\n\nBack at the house, Grandma Rose was watching from the window. \"Finally,\" she said. \"I thought he'd never do it.\"", "words": 609, "new": [{"w": "tattoo", "p": "n", "vi": "hình xăm"}, {"w": "slender", "p": "adj", "vi": "thon thả"}, {"w": "ambitious", "p": "adj", "vi": "tham vọng"}, {"w": "arrogant", "p": "adj", "vi": "kiêu ngạo"}, {"w": "bossy", "p": "adj/n", "vi": "hách dịch"}, {"w": "cautious", "p": "adj", "vi": "thận trọng"}, {"w": "charming", "p": "adj", "vi": "duyên dáng"}, {"w": "competitive", "p": "adj", "vi": "cạnh tranh"}, {"w": "considerate", "p": "adj", "vi": "chu đáo"}, {"w": "curious", "p": "adj", "vi": "tò mò"}, {"w": "determined", "p": "adj", "vi": "quyết tâm"}, {"w": "energetic", "p": "adj", "vi": "năng động"}, {"w": "enthusiastic", "p": "adj", "vi": "nhiệt tình"}, {"w": "flexible", "p": "adj", "vi": "linh hoạt"}, {"w": "foolish", "p": "adj", "vi": "ngốc nghếch"}, {"w": "grumpy", "p": "adj", "vi": "cáu kỉnh"}, {"w": "loyal", "p": "adj", "vi": "trung thành"}, {"w": "mature", "p": "adj/v", "vi": "chín chắn"}, {"w": "immature", "p": "adj", "vi": "thiếu chín chắn"}, {"w": "moody", "p": "adj", "vi": "tính khí thất thường"}, {"w": "optimistic", "p": "adj", "vi": "lạc quan"}, {"w": "pessimistic", "p": "adj", "vi": "bi quan"}, {"w": "outgoing", "p": "adj", "vi": "hướng ngoại"}, {"w": "reliable", "p": "adj", "vi": "đáng tin cậy"}, {"w": "unreliable", "p": "adj", "vi": "không đáng tin"}, {"w": "irresponsible", "p": "adj", "vi": "vô trách nhiệm"}, {"w": "sociable", "p": "adj", "vi": "hòa đồng"}]}, {"id": "W21-1", "title": "The New Waiter", "body": "In April, Daniel hired a new waiter at The Blue Cup. His name was Kevin. He was twenty-five, tall and confident. At first, everyone liked him. He was funny and fast. But after a week, Minh began to see a different personality.\n\nKevin was not **punctual**. He came late almost every day. He was disorganized: he forgot orders and lost the keys. And he had a bad attitude to customers. When an old lady asked for more milk, he rolled his eyes. When a student asked a question about the menu, he said, \"Can't you read?\"\n\n\"He doesn't behave well,\" said Jess, Minh's colleague. \"He has no **manners**.\"\n\nMinh tried to be **tolerant**. \"Maybe he's having a hard time,\" he said. \"We should be **sympathetic**.\"\n\nBut Kevin was not having a hard time. He was just rude. And worse, he was **greedy**. Minh noticed that tips were going missing from the tip jar. Not a lot, just a few pounds every day. Minh did not want to believe it. But one evening, he saw Kevin take a ten-pound note from the jar and put it in his pocket.\n\nMinh did not know what to do. He felt confused. It was a strange **emotion**: anger, but also anxiety. If he told Daniel, there would be trouble. If he didn't, he would feel **ashamed**. In Vietnam, people often avoid conflict. But this was stealing from his colleagues.\n\nHe talked to Hana about it. \"You have to tell Daniel,\" she said. \"It's the right thing. Daniel trusts you. You're **trustworthy**. Kevin isn't.\"\n\nThe next day, Minh asked to talk to Daniel in the office. He explained everything, carefully and calmly. Daniel listened. His face went red. Daniel had a famous **temper**. When he was angry, he was really angry.\n\n\"I'm **furious**,\" he said. \"Not with you. With him. Thank you for telling me, Minh. That can't have been easy.\"\n\nWhen Kevin came in that afternoon, Daniel talked to him. Minh heard shouting through the door. Kevin came out with an **aggressive** face. He stopped in front of Minh. \"You told him,\" he said. \"You little...\"\n\n\"Go home, Kevin,\" said Daniel from the door. \"You don't work here anymore.\"\n\nKevin left, but he looked back at Minh with a **cruel** smile. Minh felt **disgusted**. And also a little afraid.\n\n\"Don't worry about him,\" said Jess. \"He won't come back. People like him are all talk.\"\n\nThe **confusion** of the day stayed with Minh all evening. He was **frustrated** with himself for being afraid. \"Why do I feel bad?\" he asked Grandma Rose. \"I did the right thing.\"\n\n\"Because you're a kind person,\" said Grandma Rose. \"Kind people feel bad even when they're right. That's not weakness. It's **sincere**. A **humble** person always questions himself. A cruel person never does.\"\n\n\"I don't feel humble. I feel stupid.\"\n\n\"You're not stupid. You're **emotional**. There's a difference.\" She smiled. \"And I'm very **fond** of you, so don't argue with me.\"\n\nThe next week, Daniel hired a new person: an older woman called Pat. She was practical, organized, reasonable and **thoughtful**. She was never late. She always remembered every customer's name. \"Pat is perfect,\" said Jess. \"Maybe a little **stubborn**. She won't use the new coffee machine.\"\n\n\"I've made coffee for forty years,\" said Pat. \"I don't need a machine to tell me how. That's not unreasonable.\"\n\nMinh laughed. Life at the café was back to normal. He felt **grateful** to have colleagues he could trust. He also felt **delighted** when Daniel gave him a small pay rise, for being \"the most honest person in Riverford.\"\n\nThere was no **envy** among the staff, only **frustration** about the coffee machine. That, Minh decided, was the best kind of problem.", "words": 620, "new": [{"w": "stubborn", "p": "adj", "vi": "bướng bỉnh"}, {"w": "sympathetic", "p": "adj", "vi": "thông cảm"}, {"w": "thoughtful", "p": "adj", "vi": "chu đáo"}, {"w": "tolerant", "p": "adj", "vi": "khoan dung"}, {"w": "trustworthy", "p": "adj", "vi": "đáng tin cậy"}, {"w": "aggressive", "p": "adj", "vi": "hung hăng"}, {"w": "cruel", "p": "adj", "vi": "độc ác"}, {"w": "greedy", "p": "adj", "vi": "tham lam"}, {"w": "humble", "p": "adj/v", "vi": "khiêm tốn"}, {"w": "sincere", "p": "adj", "vi": "chân thành"}, {"w": "punctual", "p": "adj", "vi": "đúng giờ"}, {"w": "manners", "p": "n", "vi": "phép lịch sự"}, {"w": "temper", "p": "n", "vi": "tính khí"}, {"w": "ashamed", "p": "adj", "vi": "xấu hổ"}, {"w": "confusion", "p": "n", "vi": "sự nhầm lẫn"}, {"w": "delighted", "p": "adj", "vi": "rất vui mừng"}, {"w": "disgusted", "p": "adj", "vi": "ghê tởm"}, {"w": "emotion", "p": "n", "vi": "cảm xúc"}, {"w": "emotional", "p": "adj", "vi": "xúc động"}, {"w": "envy", "p": "n/v", "vi": "ghen tị"}, {"w": "fond", "p": "adj/n", "vi": "yêu mến"}, {"w": "frustrated", "p": "adj", "vi": "bực bội"}, {"w": "frustration", "p": "n", "vi": "sự bực bội"}, {"w": "furious", "p": "adj", "vi": "giận dữ"}, {"w": "grateful", "p": "adj", "vi": "biết ơn"}]}, {"id": "W21-2", "title": "Bad News from Home", "body": "One morning in May, Minh got a phone call from Vietnam. It was his mother. She never called in the morning. He knew immediately that something was wrong.\n\n\"It's Grandma,\" his mother said. Her voice was shaking. \"She fell in the kitchen last night. She's in the hospital. The doctors think it's her heart.\"\n\nMinh felt **terrified**. His hands were cold. \"Is she... is she going to be OK?\"\n\n\"We don't know yet. They're doing tests.\"\n\nAfter the call, Minh sat on his bed for a long time. He felt **hopeless**. He was eleven thousand kilometers away. He could do nothing. He could not hold her hand. He could not even see her.\n\nHe felt **guilt**, too. He had not called her for two weeks. He was busy with work, with college, with Hana. He had been happy, and now he felt bad about it. He felt a deep **regret**.\n\nGrandma Rose found him in his room. She sat next to him without a word. She held his hand. Her **sympathy** helped more than words.\n\n\"I want to go home,\" Minh said. \"But the ticket is so expensive. And I have exams in two weeks.\"\n\n\"Wait for news first,\" said Grandma Rose. \"Don't **panic**. Panic never helps.\"\n\nThat day was **miserable**. Minh could not eat, could not study, could not think. He was **homesick** in a way he had never been before. Everything in England felt far away and unreal. Even the rain was **annoying**. Everything **annoyed** him: the noise of the traffic, the TV, Leo's music.\n\nIn the evening, Hana came. She brought soup. \"Eat,\" she said. \"You need energy. Your grandmother would want you to eat.\"\n\n\"How do you know?\"\n\n\"Because all grandmothers want everyone to eat. It's the same in Japan.\"\n\nMinh smiled for the first time all day.\n\nAt midnight, his phone rang again. It was Lan this time. Her voice was different. \"Minh! Grandma is OK! It's not her heart. It was low blood sugar, and she hit her head when she fell. She has to stay in the hospital for a few days, but she's OK! She's asking for you!\"\n\nMinh felt a huge **relief**. He was so **relieved** that he started to laugh and cry at the same time. Hana held him. Downstairs, Grandma Rose heard him and came up the stairs as fast as she could.\n\n\"Good news?\" she asked.\n\n\"Good news,\" said Minh. \"She's OK.\"\n\nGrandma Rose closed her eyes. \"Thank God,\" she said. \"I was more **horrified** than I wanted to show.\"\n\nThe next day, Minh had a video call with his grandmother in the hospital. She looked small and tired in the bed, with a bandage on her head. But her eyes were the same. \"Why are you crying?\" she said. \"I'm not dead yet. Don't waste your tears.\"\n\nMinh laughed. \"I'm crying because I'm **thankful**. I'm so happy you're OK.\"\n\n\"I'm happy too,\" she said. \"But I'm **irritated** with the doctors. They won't let me eat anything good. Only rice soup. Every day, rice soup.\"\n\n\"You need to listen to them, Grandma.\"\n\n\"I'm eighty-four. I don't need to listen to anybody.\" Then she smiled. \"Now tell me about this girl. Lan says she's a nurse. Is she nice?\"\n\nMinh introduced Hana on the call. Hana was nervous, but she spoke a little Vietnamese that Minh had taught her: \"Xin chào bà.\" Grandma was **amused**. She laughed so much that the nurse came to check on her.\n\n\"She has a good heart,\" Grandma said to Minh in Vietnamese. \"I can see it. Be good to her.\"\n\nAfter the call, Minh felt a quiet **joy**. It was not the excited joy of a party. It was deeper. It was the **satisfaction** of knowing that the people he loved were safe. He felt satisfied, **thrilled** and **hopeful** all at once.\n\n\"You really **adore** your grandmother,\" said Hana.\n\n\"I **admire** her,\" said Minh. \"She's the strongest person I know. She had a hard life. There was a lot of **sorrow**: the war, losing her husband, being poor. But she never asked anyone for **pity**. She just kept going.\"\n\n\"Like Grandma Rose,\" said Hana.\n\n\"Exactly like Grandma Rose.\"\n\nThat weekend, Minh studied harder than ever for his exams. He was **eager** to do well. Every time he felt tired, he thought about his grandmother in her hospital bed, eating her rice soup and telling the doctors what to do. It made him smile. It made him want to **cheer**. And it made him want to make her proud. He was not shocked anymore, not even surprised. He was just **impressed** by her, as always.", "words": 772, "new": [{"w": "guilt", "p": "n", "vi": "cảm giác tội lỗi"}, {"w": "horrified", "p": "adj", "vi": "kinh hoàng"}, {"w": "impressed", "p": "adj", "vi": "ấn tượng"}, {"w": "irritated", "p": "adj", "vi": "khó chịu"}, {"w": "joy", "p": "n", "vi": "niềm vui"}, {"w": "miserable", "p": "adj", "vi": "khổ sở"}, {"w": "panic", "p": "n/v", "vi": "hoảng loạn"}, {"w": "regret", "p": "v/n", "vi": "hối tiếc"}, {"w": "relief", "p": "n", "vi": "sự nhẹ nhõm"}, {"w": "relieved", "p": "adj", "vi": "nhẹ nhõm"}, {"w": "satisfaction", "p": "n", "vi": "sự hài lòng"}, {"w": "sympathy", "p": "n", "vi": "sự cảm thông"}, {"w": "terrified", "p": "adj", "vi": "khiếp sợ"}, {"w": "thankful", "p": "adj", "vi": "biết ơn"}, {"w": "thrilled", "p": "adj", "vi": "vô cùng phấn khích"}, {"w": "annoyed", "p": "adj", "vi": "bực mình"}, {"w": "annoying", "p": "adj", "vi": "gây khó chịu"}, {"w": "amused", "p": "adj", "vi": "thích thú"}, {"w": "eager", "p": "adj", "vi": "háo hức"}, {"w": "homesick", "p": "adj", "vi": "nhớ nhà"}, {"w": "hopeful", "p": "adj/n", "vi": "đầy hy vọng"}, {"w": "hopeless", "p": "adj", "vi": "tuyệt vọng"}, {"w": "sorrow", "p": "n", "vi": "nỗi buồn sâu sắc"}, {"w": "pity", "p": "n/v", "vi": "lòng thương cảm"}, {"w": "cheer", "p": "v/n", "vi": "cổ vũ"}, {"w": "admire", "p": "v", "vi": "ngưỡng mộ"}, {"w": "adore", "p": "v", "vi": "yêu quý"}]}, {"id": "W21-3", "title": "Kate's Wedding", "body": "Kate and Ben's wedding was in June, by the river. Everybody was invited, and everybody had the same problem: what to wear.\n\n\"I have nothing,\" said Mia, standing in front of her wardrobe full of clothes. \"Absolutely nothing.\"\n\n\"You have a hundred things,\" said Leo.\n\n\"Nothing **trendy**,\" said Mia. \"Nothing that goes with my new style.\"\n\nSo Mia and Anna went shopping. Minh went too, because he also needed an **outfit**. He had never been to an English wedding. \"What do people wear?\" he asked.\n\n\"Men wear a suit,\" said Anna. \"Maybe a **waistcoat**. Women wear a dress and **heels**. And a hat, if they're brave.\"\n\nAt the shop, Mia tried on everything. A **sleeveless** dress with **lace** at the top. A **spotted** dress with black dots. A **checked** dress that made her look like a picnic blanket. A **tight** dress that she couldn't breathe in. A **loose**, **baggy** dress that made her look like she was wearing a tent.\n\n\"This is impossible,\" said Mia. She was getting **tense**. \"Everything is wrong.\"\n\n\"Try this,\" said Anna. She held up a simple green dress made of **linen**. It was light and beautiful. Mia put it on. She looked in the mirror. She smiled.\n\n\"OK,\" she said. \"This one.\"\n\nAnna bought **tights** to go with it. \"Not **stockings**,\" said Mia. \"Stockings are for old ladies.\" Anna said nothing. She was wearing stockings.\n\nMinh was easier. He didn't want to spend too much. He found a dark blue suit in a second-hand shop. It was a little big, but Grandma Rose said she could fix it. \"I'm not **keen** on shopping,\" he said. \"I just want something that fits.\"\n\n\"You're **desperate** to leave, aren't you?\" said Mia.\n\n\"Very desperate.\"\n\nGrandma Rose sat at her old sewing machine for two evenings. She made the suit perfect. \"In my day, we made everything ourselves,\" she said. \"Every **fabric**, every **material**. **Denim** for work, **nylon** for stockings, velvet for parties. Now nobody knows how to sew.\"\n\nOn the day of the wedding, the weather was perfect. Everyone arrived at the river in their best clothes. Tom wore a gray suit and an old **overcoat**, even though it was warm. \"It's my lucky coat,\" he said. Leo wore a **casual** jacket and jeans because he still couldn't wear smart shoes with his knee. Hana wore a pale blue dress. Minh thought she looked beautiful. He did not say it. Mia said it for him: \"Minh thinks you look beautiful.\" Minh wanted to disappear.\n\nThe wedding was simple and lovely. Kate wore a white dress with a long lace veil. Ben wore a dark suit and was so nervous that his hands were shaking. Their friends read poems. Ben's sister, now with a baby in her arms, cried through the whole thing.\n\nAfter the ceremony, there was a party in a big tent by the river. The food was cooked by Daniel and Pat. Pat wore a white **apron** over her best dress and refused to sit down. \"Somebody has to make sure the food is right,\" she said.\n\nIn the evening, it started to rain a little. Hana didn't have a coat, so Minh gave her his jacket. She pulled the **hood** of her own little cardigan over her head too, but it didn't help much. They danced in the rain while everyone else watched from the tent.\n\n\"You're both crazy,\" said Mia.\n\n\"I **appreciate** the comment,\" said Minh. \"Now go away.\"\n\nLater, Grandma Rose found Minh at the edge of the tent. \"Don't let me **bother** you,\" she said. \"I just want to say one thing. I have a **concern**.\"\n\nMinh was **concerned**. \"What is it?\"\n\n\"My concern,\" she said, \"is that you might wait too long. Life is short. If you love someone, tell them. Don't be like me and Margaret.\"\n\nMinh looked at Hana, dancing with Mia in the rain. He nodded. \"I won't wait,\" he said.\n\n\"Good,\" said Grandma Rose. \"Now go and dance with her again. I'm too old to watch you stand in a corner.\"", "words": 674, "new": [{"w": "appreciate", "p": "v", "vi": "trân trọng"}, {"w": "bother", "p": "v/n/interj", "vi": "làm phiền"}, {"w": "concern", "p": "v/n", "vi": "mối lo ngại"}, {"w": "concerned", "p": "adj", "vi": "lo lắng"}, {"w": "tense", "p": "n/adj/v", "vi": "căng thẳng"}, {"w": "keen", "p": "adj/v", "vi": "hăng hái, say mê"}, {"w": "desperate", "p": "adj", "vi": "rất cần"}, {"w": "outfit", "p": "n", "vi": "bộ trang phục"}, {"w": "tights", "p": "n", "vi": "quần tất"}, {"w": "stockings", "p": "n", "vi": "tất dài"}, {"w": "heels", "p": "n", "vi": "giày cao gót"}, {"w": "overcoat", "p": "n", "vi": "áo khoác dài"}, {"w": "waistcoat", "p": "n", "vi": "áo gi lê"}, {"w": "apron", "p": "n", "vi": "tạp dề"}, {"w": "hood", "p": "n", "vi": "mũ áo"}, {"w": "lace", "p": "n", "vi": "ren"}, {"w": "casual", "p": "adj/n", "vi": "thoải mái"}, {"w": "loose", "p": "adj/v", "vi": "rộng"}, {"w": "tight", "p": "adj", "vi": "chật"}, {"w": "baggy", "p": "adj", "vi": "rộng thùng thình"}, {"w": "trendy", "p": "adj/n", "vi": "hợp thời trang"}, {"w": "spotted", "p": "adj", "vi": "có chấm"}, {"w": "checked", "p": "adj", "vi": "kẻ ô"}, {"w": "sleeveless", "p": "adj", "vi": "không tay"}, {"w": "denim", "p": "n", "vi": "vải bò"}, {"w": "nylon", "p": "n", "vi": "ni lông"}, {"w": "fabric", "p": "n", "vi": "vải"}, {"w": "material", "p": "n/adj", "vi": "chất liệu"}, {"w": "linen", "p": "n", "vi": "vải lanh"}]}, {"id": "W21-4", "title": "Looking for a Flat", "body": "In July, Minh got his exam results. They were excellent. He got a place at the university in the city, half an hour from Riverford by train. It was a big step. It also meant a big decision: he needed new **accommodation**.\n\n\"You can stay here,\" said Anna. \"This is your home.\"\n\n\"Thank you,\" said Minh. \"But the train every day is expensive. And I think it's time to be more independent.\"\n\nAnna understood. She was sad, but she understood.\n\nThat evening, Minh started to sort his clothes. He took his shirts off every **hanger** and folded them. He found the wedding suit and an old **velvet** jacket that Tom had given him. He had to **unzip** his big suitcase, which was full of winter things, and **untie** the old rope around it. In the bottom, he found a belt with a broken **buckle** and a strange **accessory** from the International Night: a paper lantern, folded flat. He smiled and kept it.\n\nSam was also moving to the city for his new job at the design firm. \"Let's share a flat,\" he said. \"Two people, half the rent.\"\n\nSo in August, they started looking. It was not easy. The city had a big problem with **housing**. There were not enough flats, and everything was expensive.\n\nThe first flat was in a tall building near the station. It was **unfurnished**: no beds, no table, nothing. \"And the rent is a thousand pounds a month,\" said Sam. \"Plus a **deposit** of two thousand.\" Minh did the maths in his head. Impossible.\n\nThe second flat was **furnished**, but it was very small and very old. There was water coming through the **skylight** in the roof. The **landlady** was an angry woman who smoked on the **doorstep**. \"I don't do **maintenance**,\" she said. \"If something breaks, you fix it.\" They left quickly.\n\nThe third place was a room in a big **detached** house with five other students. It was **spacious**, but it was dirty and noisy. Someone was playing loud music at eleven in the morning. \"No,\" said Minh and Sam together.\n\nThey were starting to lose hope. Then Hana called. \"My friend's sister is moving out of her flat,\" she said. \"It's in a **terraced** house near the university. Two bedrooms. Very **cozy**.\"\n\nThe flat was on the second floor of an old red-brick house in a quiet street. It had a narrow wooden **staircase** and old wooden **shutters** on the windows. The owner was a kind old man called Mr. Okafor. He lived on the ground floor. He was a **resident** of the street for fifty years.\n\n\"I **renovate** a little every year,\" he said. \"New kitchen last year. New bathroom this year. It's my **property**, but I want my **tenants** to be happy. Happy tenants stay longer.\"\n\nThe rent was reasonable. The flat was clean and bright. From the window, they could see a small park.\n\n\"We'll take it,\" said Sam.\n\nMr. Okafor smiled. \"Good. I knew you were good boys the moment I saw you. Mrs. Okafor says I'm a bad judge of character, but I think I'm right this time.\"\n\nMinh called the Parkers to tell them the news. Tom said, \"Do you need a **mortgage** for that? Ha ha! No, seriously, congratulations. We'll help you move.\"\n\nGrandma Rose was quiet on the phone. \"So you're leaving,\" she said.\n\n\"Only half an hour away,\" said Minh. \"I'll come every weekend. I promise.\"\n\n\"You'd better,\" said Grandma Rose. \"Otherwise I'll come and find you. And I'm very good at finding people now.\"\n\nMinh laughed. Then he looked at the official documents for the flat. His name was on the contract. His first real home in England. \"Place of **residence**,\" it said. He wrote the new address carefully.\n\nLater, he told Hana. \"My own flat. Can you believe it? Two years ago, I couldn't even buy a bus ticket.\"\n\n\"I can believe it,\" said Hana. \"You work hard. You deserve it.\"\n\n\"There's even a garden,\" he said. \"Well, a very small one. It's not an **estate**. It's about the size of a table.\"\n\n\"Then I'll bring a very small chair,\" said Hana.", "words": 691, "new": [{"w": "velvet", "p": "n", "vi": "vải nhung"}, {"w": "hanger", "p": "n", "vi": "móc áo"}, {"w": "unzip", "p": "v", "vi": "mở khóa kéo"}, {"w": "untie", "p": "v", "vi": "cởi nút"}, {"w": "buckle", "p": "n/v", "vi": "khóa thắt lưng"}, {"w": "accessory", "p": "n", "vi": "phụ kiện"}, {"w": "accommodation", "p": "n", "vi": "chỗ ở"}, {"w": "residence", "p": "n", "vi": "nơi cư trú"}, {"w": "resident", "p": "n/adj", "vi": "cư dân"}, {"w": "tenant", "p": "n", "vi": "người thuê nhà"}, {"w": "property", "p": "n", "vi": "tài sản"}, {"w": "estate", "p": "n", "vi": "điền trang"}, {"w": "housing", "p": "n", "vi": "nhà ở"}, {"w": "detached", "p": "adj", "vi": "riêng biệt"}, {"w": "terraced", "p": "adj", "vi": "liền kề"}, {"w": "furnished", "p": "adj", "vi": "có sẵn nội thất"}, {"w": "unfurnished", "p": "adj", "vi": "không có nội thất"}, {"w": "spacious", "p": "adj", "vi": "rộng rãi"}, {"w": "cozy", "p": "adj", "vi": "ấm cúng"}, {"w": "renovate", "p": "v", "vi": "cải tạo"}, {"w": "maintenance", "p": "n", "vi": "bảo trì"}, {"w": "mortgage", "p": "n/v", "vi": "thế chấp / vay mua nhà"}, {"w": "deposit", "p": "v/n", "vi": "gửi tiền"}, {"w": "landlady", "p": "n", "vi": "bà chủ cho thuê nhà"}, {"w": "doorstep", "p": "n", "vi": "bậc cửa"}, {"w": "staircase", "p": "n", "vi": "cầu thang"}, {"w": "shutter", "p": "n", "vi": "cửa chớp"}, {"w": "skylight", "p": "n", "vi": "cửa sổ mái"}]}, {"id": "W21-5", "title": "The New Flat", "body": "Moving day was in September. The Parkers came with Tom's car and a borrowed van. They brought everything Minh owned: two suitcases, a box of books, his guitar, and a lot of things from the Parkers' **loft** that Anna said he \"might need.\"\n\n\"I don't need a **hammock**,\" said Minh.\n\n\"Everybody needs a hammock,\" said Tom. \"You can put it in the garden.\"\n\n\"The garden is the size of a table.\"\n\n\"Then you can put it in the living room.\"\n\nMr. Okafor met them on the **driveway** and helped carry the boxes up the stairs. He held the **banister** carefully. \"My knees are not what they were,\" he said. Leo, who was walking normally again, said, \"Tell me about it.\"\n\nThe flat was small but nice. There was a living room, a kitchen, a bathroom and two bedrooms. The kitchen had new white **tiles** on the wall and a new **dryer** for clothes. Every **appliance** was new: the fridge, the cooker, the washing machine. \"Mr. Okafor did a good job,\" said Anna, checking everything.\n\nBut some things were old. The **plumbing** made a strange noise at night. The **heating** was slow. The old **boiler** in the bathroom took ten minutes to make hot water. \"Is the **insulation** good?\" asked Tom, knocking on the walls. \"It will be cold in winter.\"\n\n\"Here's the **thermostat**,\" said Mr. Okafor. \"Don't put it too high. Heating is expensive.\"\n\nMinh's bedroom had old **wallpaper** with small yellow flowers. It was a little old-fashioned, but he liked it. There was a wooden bed with a high **headboard**, a **dresser** with drawers for his clothes, and a small desk by the window.\n\nAnna and Mia made the bed. Anna brought a new **pillowcase**, sheets and a warm **quilt**. Mia brought a colorful **bedspread** that she had painted herself. \"Now it's your room,\" she said.\n\nIn the living room, there was an old green sofa, a **recliner** that went back when you pulled a handle, and a **footstool**. \"That's mine,\" said Sam immediately, sitting in the recliner. \"I'm the one with a real job.\"\n\nThere was also a big wooden **sideboard** for plates and glasses. Above the table, there was an old glass **chandelier**. \"It's very fancy,\" said Mia. One of the bulbs didn't work, and the **lampshade** on the floor lamp was broken, but they didn't care.\n\nGrandma Rose brought presents. She gave Minh a small china **ornament** of a bird. \"It sat on my windowsill for forty years,\" she said. \"It will bring you luck.\" She also brought a new **doormat** for the front door. It said \"WELCOME\" in big letters.\n\nAt the back of the house, in the tiny garden, there was an old wooden **shed** and a small glass **greenhouse**. \"You can grow tomatoes!\" said Grandma Rose. \"And herbs! A greenhouse is the best thing in the world.\"\n\nWhen everything was finished, they all sat in the living room and ate pizza from the boxes. It was crowded. Leo sat on the floor. Mia sat on the footstool. Grandma Rose got the recliner, and Sam had to give it up.\n\n\"It's a good flat,\" said Tom. \"Cozy. Warm. Well, it will be warm when the boiler works.\"\n\n\"Thank you,\" said Minh. \"For everything. For two years. For being my family.\"\n\nNobody said anything for a moment. Anna wiped her eyes. Tom cleared his throat. \"Come home every Sunday,\" he said. \"For lunch. That's not a request.\"\n\n\"I promise,\" said Minh.\n\nAfter they left, the flat was very quiet. Sam went to his room to work. Minh stood at the window and looked at the city lights. He felt happy, a little sad, and very grown-up.\n\nThen his phone buzzed. A message from Grandma Rose: \"Did you remember to hang the hammock?\"\n\nHe laughed. Then he went to find the hammock.", "words": 636, "new": [{"w": "loft", "p": "n", "vi": "gác mái"}, {"w": "shed", "p": "n", "vi": "nhà kho nhỏ"}, {"w": "greenhouse", "p": "n", "vi": "nhà kính"}, {"w": "driveway", "p": "n", "vi": "đường xe vào nhà"}, {"w": "plumbing", "p": "n", "vi": "hệ thống ống nước"}, {"w": "heating", "p": "n", "vi": "hệ thống sưởi"}, {"w": "insulation", "p": "n", "vi": "vật liệu cách nhiệt"}, {"w": "dresser", "p": "n", "vi": "tủ ngăn kéo"}, {"w": "sideboard", "p": "n", "vi": "tủ đựng bát đĩa"}, {"w": "headboard", "p": "n", "vi": "đầu giường"}, {"w": "footstool", "p": "n", "vi": "ghế kê chân"}, {"w": "recliner", "p": "n", "vi": "ghế ngả lưng"}, {"w": "hammock", "p": "n", "vi": "võng"}, {"w": "quilt", "p": "n", "vi": "chăn bông"}, {"w": "pillowcase", "p": "n", "vi": "vỏ gối"}, {"w": "bedspread", "p": "n", "vi": "khăn phủ giường"}, {"w": "wallpaper", "p": "n", "vi": "giấy dán tường"}, {"w": "tile", "p": "n", "vi": "viên gạch lát"}, {"w": "tiles", "p": "n", "vi": "gạch lát"}, {"w": "banister", "p": "n", "vi": "tay vịn cầu thang"}, {"w": "doormat", "p": "n", "vi": "thảm chùi chân"}, {"w": "ornament", "p": "n/v", "vi": "đồ trang trí"}, {"w": "chandelier", "p": "n", "vi": "đèn chùm"}, {"w": "lampshade", "p": "n", "vi": "chao đèn"}, {"w": "appliance", "p": "n", "vi": "thiết bị gia dụng"}, {"w": "dryer", "p": "n", "vi": "máy sấy"}, {"w": "boiler", "p": "n", "vi": "nồi đun nước"}, {"w": "thermostat", "p": "n", "vi": "bộ điều nhiệt"}]}, {"id": "W22-1", "title": "Setting Up the Kitchen", "body": "The first week in the new flat, Minh and Sam realized something important: they had nothing. They had a kitchen, but no **cutlery** except two forks from the Parkers. They had no **crockery** except three plates and one bowl. They had no pots, no pans, nothing.\n\n\"How did we live for two years?\" asked Sam.\n\n\"Other people did everything for us,\" said Minh. \"Your landlady. My English family.\"\n\nSo on Saturday, they went to a big shop on the edge of the city. They made a list. Minh wanted to cook Vietnamese food, so he needed a good knife, a big pot and a **ladle** for soup. Sam wanted to cook Spanish food, so he needed a big pan and a wooden **spatula**.\n\nThey walked down the aisle of kitchen **utensils**. There were hundreds of things. \"What's this?\" asked Minh, holding up something made of metal wires.\n\n\"A **whisk**,\" said Sam. \"For eggs and cream.\"\n\n\"And this?\"\n\n\"A **grater**. For cheese. And that's a **peeler**, for potatoes.\"\n\nThey bought a **sieve** for flour and a **colander** for pasta. Sam picked up a **corkscrew** and a bottle **opener**. \"Very important,\" he said. \"A Spanish man needs these.\" Minh found some **tongs** for the barbecue that they did not have and probably never would. They also bought a roll of kitchen **foil**, washing-up liquid, a bottle of **detergent** for the washing machine and a bottle of **bleach** for the bathroom.\n\n\"And a **duster**,\" said Minh. \"Grandma Rose said we must have a duster. And a brush and **dustpan**.\"\n\nAt home, they found the next problem. The kitchen fan, the **extractor** above the cooker, did not work. When they cooked, the whole flat filled with smoke. The fire alarm went off twice on the first night.\n\nMr. Okafor came up the stairs with his **toolbox**. He was seventy-four, but he could fix anything. He took out a **screwdriver** and opened the extractor. \"A loose **screw**,\" he said. \"Easy.\" In five minutes, it worked.\n\n\"Can you fix the shelf in my room too?\" asked Sam. \"It's falling down.\"\n\nMr. Okafor took out a **drill**, a **hammer** and some nails. He fixed the shelf. Then he fixed the door that did not close properly. Then he climbed a **ladder** to change the bulb in the hallway.\n\n\"You're amazing,\" said Minh.\n\n\"I was a builder for forty years,\" said Mr. Okafor. \"In Nigeria first, then here. I can build a house with my hands.\" He showed them his old **saw**, very old but still sharp. \"This saw is older than both of you together.\"\n\nBefore he left, he looked out of the kitchen window at the small garden. \"The garden needs water,\" he said. \"There's a **hose** in the shed. And if you hang your clothes outside, there are **pegs** in the basket.\"\n\n\"In America, they say **clothespin**,\" said Minh. Sam groaned. \"You and your American words.\"\n\nThat evening, Minh made his first real dinner in the new flat: fried rice with egg and vegetables. Sam made a Spanish omelette. They ate at their small kitchen table with their new cutlery and crockery.\n\n\"To our flat,\" said Sam, holding up a glass.\n\n\"To our flat,\" said Minh. \"And to Mr. Okafor.\"", "words": 535, "new": [{"w": "extractor", "p": "n", "vi": "máy hút"}, {"w": "cutlery", "p": "n", "vi": "dao nĩa thìa"}, {"w": "crockery", "p": "n", "vi": "bát đĩa"}, {"w": "utensil", "p": "n", "vi": "dụng cụ nhà bếp"}, {"w": "ladle", "p": "n", "vi": "muôi"}, {"w": "spatula", "p": "n", "vi": "xẻng nấu ăn"}, {"w": "whisk", "p": "n/v", "vi": "phới đánh trứng"}, {"w": "grater", "p": "n", "vi": "dụng cụ bào"}, {"w": "peeler", "p": "n", "vi": "dụng cụ gọt vỏ"}, {"w": "sieve", "p": "n", "vi": "rây"}, {"w": "colander", "p": "n", "vi": "rổ lọc"}, {"w": "corkscrew", "p": "n", "vi": "dụng cụ mở nút chai"}, {"w": "opener", "p": "n", "vi": "đồ mở nắp"}, {"w": "tongs", "p": "n", "vi": "kẹp gắp"}, {"w": "foil", "p": "n", "vi": "giấy bạc"}, {"w": "detergent", "p": "n", "vi": "chất tẩy rửa"}, {"w": "bleach", "p": "n/v", "vi": "thuốc tẩy"}, {"w": "duster", "p": "n", "vi": "khăn lau bụi"}, {"w": "dustpan", "p": "n", "vi": "hót rác"}, {"w": "peg", "p": "n", "vi": "kẹp phơi đồ"}, {"w": "clothespin", "p": "n", "vi": "kẹp quần áo"}, {"w": "hose", "p": "n", "vi": "ống nước mềm"}, {"w": "ladder", "p": "n/v", "vi": "cái thang"}, {"w": "toolbox", "p": "n", "vi": "hộp dụng cụ"}, {"w": "hammer", "p": "n/v", "vi": "búa"}, {"w": "screw", "p": "n/v", "vi": "vít"}, {"w": "screwdriver", "p": "n", "vi": "tua vít"}, {"w": "drill", "p": "n/v", "vi": "máy khoan"}, {"w": "saw", "p": "v/n", "vi": "cưa"}]}, {"id": "W22-2", "title": "The Babysitter", "body": "In October, Ben's sister, Lucy, had a problem. Her baby, Oliver, was five months old. She had to go to the hospital for an appointment, and her usual **babysitter** was ill. Her husband was working. \"Can you **babysit** for three hours?\" she asked Hana. Hana said yes, and asked Minh to help.\n\nMinh had never looked after a baby. \"What do I do?\" he asked.\n\n\"Keep him alive,\" said Hana. \"And happy, if possible.\"\n\nLucy lived in a small house. It was very organized. Everything had a place. \"I used to have a **nanny** for my first child,\" she said. \"But now I'm a **homemaker**. Or a **housewife**, as my grandmother says. I hate that word.\"\n\n\"Do you have a **housekeeper**?\" asked Minh.\n\nLucy laughed. \"I wish! No, I do all the household jobs myself.\" She gave them a list: when to feed the baby, how to change his nappy, where the toys were. \"And put him on his play **mat** after lunch. He loves it.\"\n\nThen she left. Minh and Hana looked at the baby. The baby looked at them. Then he started to cry.\n\nThe first hour was hard. Oliver did not want his milk. He did not want his toys. He did not want anything. Hana walked around with him. Minh tried to make funny faces. Nothing worked.\n\n\"Maybe the TV?\" said Minh. He looked for the **remote** control. He found it under the sofa. He turned on a children's program. Oliver stopped crying and stared at the screen.\n\n\"Ha!\" said Minh. \"Modern parenting.\"\n\nBut then the TV stopped. The **extension** cable was loose. Minh looked behind the TV. There was a mess of wires: a long **cord** for the lamp, an **adapter** for a foreign plug, and a phone charger. He had to **unplug** everything and start again. \"Every **device** in this house is connected to one socket,\" he said. \"That's dangerous.\"\n\nWhile Minh fixed the wires, Hana fed Oliver. Finally, he fell asleep. They put him in his bed very quietly.\n\nThen they noticed things that needed fixing. A kitchen cupboard door was broken. A picture had fallen off its **hook** on the wall. The gate in the garden had a broken **padlock** and a rusty **chain**. Minh found a small **kit** of tools in a drawer: a **spanner**, a **wrench**, a pair of **pliers** and some small screws. He fixed the cupboard. He hung the picture. \"Every **tool** in this house is new,\" he said. \"Nobody uses them.\"\n\n\"You're like Mr. Okafor,\" said Hana.\n\n\"I learned from my father,\" said Minh. \"He could **mend** anything. Motorbikes, radios, chairs. He said: if you can replace it, you can also fix it.\"\n\nHe found a can of paint and a **paintbrush** in the garden shed, but decided not to start painting someone else's fence.\n\nWhen Lucy came back, the baby was asleep and the house was quiet. She looked at the kitchen. \"Did you fix my cupboard?\"\n\n\"Sorry,\" said Minh. \"I hope that's OK.\"\n\n\"OK? That's wonderful! I've been asking my husband to fix it for six months!\" She laughed. \"Can you come every week?\"\n\nShe also told them she was trying to **declutter** the house. \"Too many things,\" she said. \"Baby things everywhere. I want to give away the things we don't need. And do more recycling.\" She gave Hana a bag of baby clothes for the hospital.\n\nOn the way home, they did some **errands** for Lucy: they picked up her **groceries** from the shop and dropped off a parcel at the post office. Hana was quiet. Then she said, \"You'll be a good father one day.\"\n\nMinh almost walked into a lamp post. \"That's a long way in the future,\" he said.\n\n\"I know,\" said Hana. \"I'm just saying.\"\n\nAt the flat, Sam was trying to **assemble** a new bookshelf. There were pieces of wood everywhere. \"The instructions are in Swedish,\" he said. \"And there are three screws missing.\"\n\n\"Don't worry,\" said Minh, picking up the screwdriver. \"I'm an expert now.\"\n\nLater, Mr. Okafor came up to check that they could install the shelf safely and maintain it. \"And adjust the screws every year,\" he said. \"Wood moves.\"\n\nMinh fell asleep that night thinking about babies, broken cupboards, and the strange, good feeling of being useful.", "words": 713, "new": [{"w": "spanner", "p": "n", "vi": "cờ lê"}, {"w": "wrench", "p": "n", "vi": "cờ lê"}, {"w": "pliers", "p": "n", "vi": "kìm"}, {"w": "paintbrush", "p": "n", "vi": "cọ sơn"}, {"w": "padlock", "p": "n", "vi": "ổ khóa treo"}, {"w": "chain", "p": "n/v", "vi": "sợi xích"}, {"w": "hook", "p": "n", "vi": "móc"}, {"w": "mat", "p": "n", "vi": "thảm nhỏ"}, {"w": "cord", "p": "n", "vi": "sợi dây"}, {"w": "adapter", "p": "n", "vi": "bộ chuyển đổi"}, {"w": "extension", "p": "n/adj", "vi": "phần nối dài"}, {"w": "remote", "p": "adj/n", "vi": "xa xôi"}, {"w": "device", "p": "n", "vi": "thiết bị"}, {"w": "tool", "p": "n", "vi": "dụng cụ"}, {"w": "kit", "p": "n", "vi": "bộ dụng cụ"}, {"w": "homemaker", "p": "n", "vi": "người nội trợ"}, {"w": "housekeeper", "p": "n", "vi": "người giúp việc"}, {"w": "housewife", "p": "n", "vi": "nội trợ"}, {"w": "babysitter", "p": "n", "vi": "người trông trẻ"}, {"w": "babysit", "p": "v", "vi": "trông trẻ"}, {"w": "nanny", "p": "n", "vi": "người trông trẻ"}, {"w": "errand", "p": "n", "vi": "việc vặt bên ngoài"}, {"w": "groceries", "p": "n", "vi": "thực phẩm và đồ dùng"}, {"w": "declutter", "p": "v", "vi": "dọn bớt đồ"}, {"w": "mend", "p": "v", "vi": "vá sửa"}, {"w": "assemble", "p": "v", "vi": "lắp ráp"}, {"w": "unplug", "p": "v", "vi": "rút phích cắm"}]}, {"id": "W22-3", "title": "The Dinner Party", "body": "In November, Minh and Sam decided to have their first dinner party. They invited Hana, Mia, Leo and Jess from The Blue Cup. \"Six people,\" said Sam. \"How hard can it be?\"\n\nVery hard, as it turned out.\n\nOn Saturday morning, they made a plan. Sam would make the **starter**. In America, Tom would say **appetizer**, Minh said, and Sam threw a tea towel at him. The starter was Spanish: small pieces of bread with tomato and olive oil, and a plate of ham. Minh would make the main course: a big pot of Vietnamese beef **stew** with rice. And Hana was bringing dessert.\n\nThey needed a lot of **ingredients**. Minh made a list. They went to the market and the supermarket. They came back with too many bags. There was no storage space in the kitchen. They had to stack things on the floor and organize the fridge three times.\n\nMinh had to adjust his grandmother's recipe, because it was for twelve people, not six. Then they started cooking. The kitchen became a **mess** very quickly. There was flour everywhere. Sam **spilled** a bottle of red wine **vinegar** on the floor. It left a big red **stain**. The sink began to leak. Water dripped onto the floor. \"Mr. Okafor!\" they shouted.\n\nMr. Okafor came up with his toolbox and fixed the sink in two minutes. He looked around the kitchen. \"This kitchen is **filthy**,\" he said, laughing. \"I hope you'll clean it before your guests arrive.\"\n\n\"Of course,\" said Minh. He had no idea how they would do it.\n\nThey cleaned for an hour. They washed the floor, cleaned the cooker, wiped everything. By seven o'clock, the kitchen was **spotless**. \"It's never been this clean,\" said Sam. \"Even when we moved in.\"\n\nThe guests arrived at eight. Hana brought a homemade apple pie with a beautiful golden **crust**. She had made the **pastry** herself. \"My first pie,\" she said. \"Don't laugh.\" Jess brought a bottle of wine. Mia brought flowers. Leo brought a big bag of chips. \"Because I knew you'd forget snacks,\" he said.\n\nThe dinner was a big success. The starter was delicious. The stew was perfect: rich, warm and full of flavor. Everyone wanted a second **portion**. Mia asked for the recipe. Leo ate three bowls. \"This is better than Mum's,\" he said. \"Don't tell her.\"\n\nOver dinner, they talked about food from their countries. Jess talked about English food: Sunday roast with **gravy**, and **porridge** for breakfast. \"In America, they say **oatmeal**,\" said Mia, sounding exactly like her father. Hana talked about **sushi** in Japan. Sam talked about Spanish breakfast: coffee and a **croissant**, or toast with olive oil. Leo talked about the best **kebab** shop in Riverford, open until three in the morning.\n\n\"What about Vietnamese breakfast?\" asked Jess.\n\n\"Soup,\" said Minh. \"Or sticky rice, or a **bun** with meat. In the morning, we eat big.\"\n\n\"And a salad **dressing** with fish sauce,\" said Hana. \"I tried it. It's strange, but good.\"\n\nFor dessert, they ate Hana's pie. It was a little burnt on the bottom, but nobody cared. Leo ate the last **crumb**. Then he looked in the kitchen for more food. He found a bag of **crackers**, a **bagel** from breakfast and a packet of **raisins**. He ate it all.\n\n\"How are you not fat?\" asked Jess.\n\n\"Physiotherapy,\" said Leo. \"I burn a lot of calories.\"\n\nHana said the pie **dough** was the hardest part. \"My hands were covered in flour. I didn't know that baking was so difficult.\"\n\nAt midnight, the guests went home. Minh and Sam looked at the kitchen. It was a disaster again. Plates, glasses, pots everywhere.\n\n\"Tomorrow,\" said Sam.\n\n\"Tomorrow,\" Minh agreed.\n\nThey sat on the sofa in the middle of the mess, tired and happy. \"Our first dinner party,\" said Sam. \"I think it was a success.\"\n\n\"The best,\" said Minh. \"Mostly because of Leo's chips.\"", "words": 650, "new": [{"w": "spill", "p": "v/n", "vi": "làm đổ"}, {"w": "stain", "p": "n/v", "vi": "vết bẩn"}, {"w": "mess", "p": "n", "vi": "sự bừa bộn"}, {"w": "filthy", "p": "adj", "vi": "bẩn thỉu"}, {"w": "spotless", "p": "adj", "vi": "sạch bóng"}, {"w": "appetizer", "p": "n", "vi": "món khai vị"}, {"w": "starter", "p": "n", "vi": "món khai vị"}, {"w": "portion", "p": "n", "vi": "khẩu phần"}, {"w": "ingredient", "p": "n", "vi": "nguyên liệu"}, {"w": "vinegar", "p": "n", "vi": "giấm"}, {"w": "gravy", "p": "n", "vi": "nước xốt thịt"}, {"w": "dressing", "p": "n", "vi": "nước xốt salad"}, {"w": "stew", "p": "n/v", "vi": "món hầm"}, {"w": "kebab", "p": "n", "vi": "thịt xiên nướng"}, {"w": "sushi", "p": "n", "vi": "sushi"}, {"w": "porridge", "p": "n", "vi": "cháo yến mạch"}, {"w": "oatmeal", "p": "n", "vi": "cháo yến mạch"}, {"w": "bun", "p": "n", "vi": "bánh mì tròn"}, {"w": "bagel", "p": "n", "vi": "bánh mì vòng"}, {"w": "croissant", "p": "n", "vi": "bánh sừng bò"}, {"w": "crumb", "p": "n", "vi": "vụn bánh"}, {"w": "crust", "p": "n", "vi": "vỏ bánh"}, {"w": "dough", "p": "n", "vi": "bột nhào"}, {"w": "pastry", "p": "n", "vi": "bột bánh ngọt"}, {"w": "cracker", "p": "n", "vi": "bánh quy giòn"}, {"w": "raisin", "p": "n", "vi": "nho khô"}]}, {"id": "W22-4", "title": "The Asian Supermarket", "body": "For Hana's birthday in December, Minh wanted to cook her a special dinner: a real Vietnamese feast. For that, he needed the right ingredients. So on Saturday, he took the bus to the Asian supermarket on the other side of the city.\n\nIt was like being home. The shop smelled of spices and dried fish. There was music from Hong Kong on the radio. The shelves were full of things he hadn't seen for two years.\n\nIn the fruit section, there were fruits from all over Asia. There was **papaya**, orange and soft inside. There was fresh **lychee**, his favourite, sweet and white under a red skin. And there, in a corner, was the king of fruits: a huge, spiky **durian**. Its smell was very strong. A woman next to him held her nose. \"How can anyone eat that?\" she said.\n\n\"With love,\" said Minh, and laughed. He did not buy it. He knew Sam would kill him.\n\nHe also found more ordinary fruits: a **fig**, some **apricots**, a big pink **grapefruit** and a bag of **tangerines** for Hana, because she loved them.\n\nThen he went to the vegetables. In England, there were vegetables he still didn't know. A dark red **beetroot**. A small red **radish**. Long green **courgettes**, which Americans call **zucchini**. A big purple **aubergine**, which Americans call **eggplant**. He thought about Tom and smiled. There was also **asparagus**, which was very expensive, and a **leek**, which looked like a giant spring onion.\n\nBut the most important things were the herbs and spices. He found everything. Fresh **ginger**. Small red **chili** peppers, very hot. **Lemongrass**, for the soup. **Mint** and **basil** for the spring rolls. **Parsley** was not Vietnamese, but Hana liked it, so he bought some. He also found a stick of **cinnamon** for the pho and a little bottle of **vanilla** for a dessert.\n\nAt the till, the woman looked at his basket. \"Vietnamese?\" she asked.\n\n\"Yes,\" said Minh, surprised. \"How did you know?\"\n\n\"Lemongrass, fish sauce, rice paper, mint. Only Vietnamese buy all these together.\" She smiled. \"I'm from Saigon. Who is the special dinner for?\"\n\n\"My girlfriend,\" said Minh. It was the first time he had said \"girlfriend\" out loud. It felt good.\n\n\"Lucky girl,\" said the woman. She gave him a free packet of **seasoning** for the soup. \"For good luck.\"\n\nAt home, Minh spent the whole afternoon cooking. Sam watched from the doorway. \"Is it healthy?\" he asked. \"Hana is a nurse. She'll check.\"\n\n\"Very healthy,\" said Minh. \"Lots of **protein** in the beef and tofu. Rice for **carbohydrate**. Vegetables for **fiber**. Not many **calories**.\"\n\n\"You sound like a nutrition book.\"\n\n\"Hana taught me.\"\n\nWhen Hana arrived, the flat smelled amazing. The table was covered with dishes: fresh spring rolls, beef pho, fried tofu with lemongrass, a papaya salad, and a plate of fruit. \"This is for me?\" she said. \"All of it?\"\n\n\"Happy birthday,\" said Minh.\n\nHana tried everything. She loved the spring rolls. She loved the soup. She did not love the chili, which made her cough. Sam, who was a **vegetarian** for exactly one week every year, ate only the tofu and the salad. \"It's my vegetarian week,\" he explained.\n\nAt the end, Minh brought out a small cake with a candle. Hana made a wish. \"What did you wish for?\" asked Sam.\n\n\"If I tell you, it won't come true,\" said Hana. But she looked at Minh and smiled. Minh had a good guess.", "words": 576, "new": [{"w": "fig", "p": "n", "vi": "quả sung"}, {"w": "apricot", "p": "n", "vi": "quả mơ"}, {"w": "grapefruit", "p": "n", "vi": "bưởi chùm"}, {"w": "tangerine", "p": "n", "vi": "quả quýt"}, {"w": "papaya", "p": "n", "vi": "đu đủ"}, {"w": "lychee", "p": "n", "vi": "quả vải"}, {"w": "durian", "p": "n", "vi": "sầu riêng"}, {"w": "beetroot", "p": "n", "vi": "củ dền"}, {"w": "radish", "p": "n", "vi": "củ cải"}, {"w": "zucchini", "p": "n", "vi": "bí ngòi"}, {"w": "eggplant", "p": "n", "vi": "cà tím"}, {"w": "aubergine", "p": "n", "vi": "cà tím"}, {"w": "courgette", "p": "n", "vi": "bí ngòi"}, {"w": "asparagus", "p": "n", "vi": "măng tây"}, {"w": "leek", "p": "n", "vi": "tỏi tây"}, {"w": "ginger", "p": "n", "vi": "gừng"}, {"w": "chili", "p": "n", "vi": "ớt"}, {"w": "cinnamon", "p": "n", "vi": "quế"}, {"w": "vanilla", "p": "n", "vi": "vani"}, {"w": "parsley", "p": "n", "vi": "mùi tây"}, {"w": "basil", "p": "n", "vi": "húng tây"}, {"w": "mint", "p": "n", "vi": "bạc hà"}, {"w": "lemongrass", "p": "n", "vi": "sả"}, {"w": "seasoning", "p": "n", "vi": "gia vị"}, {"w": "protein", "p": "n", "vi": "chất đạm"}, {"w": "carbohydrate", "p": "n", "vi": "tinh bột"}, {"w": "fiber", "p": "n", "vi": "chất xơ"}, {"w": "calorie", "p": "n", "vi": "ca-lo"}, {"w": "vegetarian", "p": "n/adj", "vi": "người ăn chay"}]}, {"id": "W22-5", "title": "The Food Review", "body": "In January, Minh saw an advert in the university newspaper: \"Writers wanted! Food, music, film, sport. Write a review and send it to us.\" He decided to try. He liked food, and he liked writing. Why not write about food?\n\nHis first review was about a new restaurant near the university. It was a \"healthy\" place that sold **organic** salads and **vegan** burgers. He went with Hana and Sam.\n\nThe menu was long. Everything was **organic**, **homemade** and **nutritious**. There were no **processed** foods, no **canned** vegetables, nothing **frozen**. \"It sounds perfect,\" said Hana.\n\nThe food was a different story. The vegan burger was **bland**: it had no taste at all. Sam's salad had some **raw** vegetables that were not **ripe**: the tomatoes were hard and green. One of the avocados was black and almost **rotten**. The bread was **stale**, like it was from yesterday.\n\n\"Is this **edible**?\" asked Sam, holding up a piece of bread.\n\nBut some things were very good. The sweet potato fries were **crispy** outside and soft inside. The carrot salad was **crunchy** and fresh. The mango smoothie was **creamy** and delicious. And the peaches in the fruit salad were sweet and **juicy**.\n\nThat night, Minh wrote his review. He tried to be fair. He wrote about the good things and the bad things. He tried to describe the tastes clearly. He used a lot of the words he had learned from Grandma Rose and Hana.\n\n\"Not all healthy food has to be boring,\" he wrote. \"This restaurant has a good idea and some delicious dishes. But a salad needs ripe tomatoes, and a burger needs flavor. Even vegan food can be **savory** and **filling**. Next time, more salt, please.\"\n\nHe sent it to the newspaper. To his surprise, they published it the next week. The editor wrote to him: \"Great review. Honest and funny. Can you write another one?\"\n\nMinh was delighted. For the next review, he wanted to try something different. \"Let's go somewhere unhealthy,\" said Sam. \"A real British chip shop.\"\n\nSo they went to the oldest fish and chip shop in the city. The chips were thick and **greasy**. The fish was fried in a heavy batter. It was the opposite of the organic restaurant. And it was wonderful.\n\n\"This is **junk** food,\" said Hana, eating another chip. \"But it's very good junk food.\"\n\nMinh wrote: \"Sometimes, the best food is not the healthiest. This is not food for every day. But on a cold, rainy Friday night, nothing is better.\"\n\nFor his third review, he wrote about Chinese **takeout** from a small place near the flat. He ate it at home with Sam while watching football. They had **leftovers** for breakfast the next day. \"The food is even better the next morning,\" he wrote. \"That's the sign of a good takeout.\"\n\nThen the editor asked him to write about drinks. \"The students want to know where to go out,\" she said. Minh did not drink much. But Sam knew a lot about it. They went to a bar where the menu was very long. There were **alcoholic** cocktails, beer, wine, and strong **spirits**: **whisky** from Scotland, **vodka** from Russia and Poland, and expensive French **champagne**.\n\n\"In Vietnam, we drink rice wine at festivals,\" Minh told Sam. \"It's very strong. Like vodka, but worse.\"\n\nHe wrote a careful review, with a message at the end: \"Drink responsibly. And always eat something first.\"\n\nBy the end of the year, Minh had written ten reviews. People at the university started to recognize his name. \"Are you Minh, the food guy?\" a student asked him one day.\n\n\"Yes,\" said Minh, surprised.\n\n\"Your review of the chip shop was hilarious. I go there every Friday now.\"\n\nMinh walked home with a big smile. He did not know it yet, but this was the beginning of something important. Writing was becoming more than a hobby. It was becoming a dream.", "words": 653, "new": [{"w": "vegan", "p": "n/adj", "vi": "người ăn thuần chay"}, {"w": "organic", "p": "adj", "vi": "hữu cơ"}, {"w": "raw", "p": "adj", "vi": "sống; thô"}, {"w": "ripe", "p": "adj", "vi": "chín"}, {"w": "rotten", "p": "adj", "vi": "thối"}, {"w": "stale", "p": "adj", "vi": "ôi cũ"}, {"w": "frozen", "p": "adj", "vi": "đông lạnh"}, {"w": "canned", "p": "adj", "vi": "đóng hộp"}, {"w": "processed", "p": "adj", "vi": "đã qua chế biến"}, {"w": "homemade", "p": "adj", "vi": "tự làm ở nhà"}, {"w": "junk", "p": "n/v/adj", "vi": "đồ bỏ đi"}, {"w": "takeout", "p": "n", "vi": "đồ ăn mang về"}, {"w": "leftovers", "p": "n", "vi": "thức ăn thừa"}, {"w": "nutritious", "p": "adj", "vi": "bổ dưỡng"}, {"w": "edible", "p": "adj", "vi": "ăn được"}, {"w": "crunchy", "p": "adj", "vi": "giòn"}, {"w": "crispy", "p": "adj", "vi": "giòn rụm"}, {"w": "juicy", "p": "adj", "vi": "mọng nước"}, {"w": "creamy", "p": "adj", "vi": "béo mịn"}, {"w": "greasy", "p": "adj", "vi": "nhiều dầu mỡ"}, {"w": "bland", "p": "adj", "vi": "nhạt nhẽo"}, {"w": "savory", "p": "adj/n", "vi": "có vị mặn"}, {"w": "filling", "p": "adj", "vi": "gây no"}, {"w": "alcoholic", "p": "adj", "vi": "có cồn"}, {"w": "spirits", "p": "n", "vi": "rượu mạnh"}, {"w": "whisky", "p": "n", "vi": "rượu whisky"}, {"w": "vodka", "p": "n", "vi": "rượu vodka"}, {"w": "champagne", "p": "n", "vi": "rượu sâm panh"}]}, {"id": "W23-1", "title": "The Coffee Lesson", "body": "Even after he moved to the city, Minh still worked at The Blue Cup on weekends. One Saturday, Daniel said, \"It's time you learned to make proper coffee. Not just carry it.\"\n\nHe took Minh behind the counter, to the big silver coffee machine. \"First, the **espresso**,\" Daniel said. \"It's the base of everything. Small, strong, black.\" He showed Minh how to **weigh** the coffee, press it down and run hot water through it. A dark, thick coffee came out. The **aroma** filled the café.\n\n\"Now, milk.\" Daniel used the machine to **steam** the milk until it was hot and soft. \"For a **latte**, lots of milk, a little foam. For a **cappuccino**, less milk, more foam. Then **sprinkle** a little chocolate on top.\"\n\nMinh tried. His first cappuccino looked terrible. His second was better. By the tenth, it looked almost like Daniel's.\n\n\"Not bad,\" said Daniel. \"Now make me a **decaf** latte. That's coffee with no caffeine, for people who want to sleep tonight.\"\n\n\"Why drink coffee without coffee?\" asked Minh.\n\n\"Don't ask me. I just make it.\"\n\nThe café sold more than coffee. There was a list of every **beverage** on the wall: **herbal** teas, hot chocolate, fresh orange juice, **fizzy** lemonade, **sparkling** water and apple **cider** with no alcohol. In summer, Daniel made fruit **cocktails**. He would **blend** strawberries, banana and ice, and **squeeze** a lime on top.\n\nThat week, Daniel had a big job. A company wanted **catering** for a lunch meeting: food and **refreshments** for fifty people. \"This could be good money,\" said Daniel. \"We need it.\" Minh noticed that Daniel looked worried when he said that. He didn't ask why.\n\nOn Friday night, they prepared everything. Daniel opened his old **cookbook**, full of notes and stains. \"This book belonged to my mother,\" he said. \"Every recipe in it is a winner.\"\n\nThey made sandwiches. They made a big carrot cake: Minh had to **grate** two kilos of carrots. Daniel showed him how to **spread** cream cheese on top. They made chicken for the salads. \"First, you **marinate** the chicken overnight in lemon, garlic and herbs,\" said Daniel. \"Then you **simmer** the sauce slowly for an hour.\"\n\nThey also made a Vietnamese dish, Minh's idea: summer rolls with peanut sauce. Daniel was worried. \"Will English office workers eat Vietnamese **cuisine**?\"\n\n\"Everybody loves summer rolls,\" said Minh.\n\nIn the morning, they had a problem. Daniel had forgotten to **defrost** the bread rolls. They were frozen like stones. \"**Preheat** the oven!\" Daniel shouted. They put the rolls in the oven. Minh watched them carefully. If they were **undercooked**, they would be cold inside. If they were **overcooked**, they would be hard. After eight minutes, they were perfect.\n\nAt the office, Minh worked as a **server**, carrying plates and filling cups. The office workers were polite and quiet at first. Then they tried the summer rolls. \"What are these?\" asked a man in a suit. \"They're amazing!\" In ten minutes, the summer rolls were all gone. The sandwiches were still there.\n\n\"You were right,\" said Daniel on the way home. \"I'll put them on the menu.\"\n\nThe company paid well. Daniel counted the money in the van. Then he sighed. \"It helps,\" he said. \"But it's not enough.\"\n\n\"Not enough for what?\" Minh asked.\n\nDaniel was quiet for a long time. \"I'll tell you next week,\" he said. \"It's a long story.\"", "words": 564, "new": [{"w": "cocktail", "p": "n", "vi": "đồ uống pha trộn"}, {"w": "cider", "p": "n", "vi": "nước táo ép"}, {"w": "latte", "p": "n", "vi": "cà phê sữa nóng"}, {"w": "espresso", "p": "n", "vi": "cà phê espresso"}, {"w": "cappuccino", "p": "n", "vi": "cà phê sữa bọt"}, {"w": "decaf", "p": "n/adj", "vi": "cà phê ít caffeine"}, {"w": "herbal", "p": "adj", "vi": "từ thảo mộc"}, {"w": "beverage", "p": "n", "vi": "đồ uống"}, {"w": "refreshment", "p": "n", "vi": "đồ ăn thức uống"}, {"w": "sparkling", "p": "adj", "vi": "có ga"}, {"w": "fizzy", "p": "adj", "vi": "có ga"}, {"w": "steam", "p": "v/n", "vi": "hấp"}, {"w": "blend", "p": "n/v", "vi": "xay trộn"}, {"w": "grate", "p": "v", "vi": "bào nhỏ"}, {"w": "squeeze", "p": "v", "vi": "vắt"}, {"w": "sprinkle", "p": "v", "vi": "rắc"}, {"w": "spread", "p": "v/n", "vi": "phết; lan rộng"}, {"w": "marinate", "p": "v", "vi": "ướp"}, {"w": "simmer", "p": "v/n", "vi": "ninh nhỏ lửa"}, {"w": "defrost", "p": "v", "vi": "rã đông"}, {"w": "weigh", "p": "v", "vi": "cân"}, {"w": "preheat", "p": "v", "vi": "làm nóng trước"}, {"w": "cookbook", "p": "n", "vi": "sách dạy nấu ăn"}, {"w": "cuisine", "p": "n", "vi": "nền ẩm thực"}, {"w": "aroma", "p": "n", "vi": "hương thơm"}, {"w": "overcooked", "p": "adj", "vi": "nấu quá chín"}, {"w": "undercooked", "p": "adj", "vi": "chưa chín kỹ"}, {"w": "server", "p": "n", "vi": "nhân viên phục vụ"}, {"w": "catering", "p": "n/adj", "vi": "dịch vụ ăn uống"}]}, {"id": "W23-2", "title": "Daniel's Problem", "body": "The next Saturday, after closing, Daniel sat down with Minh, Jess and Pat. He made four coffees and put them on the table. \"I have bad news,\" he said.\n\nThe building of The Blue Cup was very old. It was built in the Victorian **era**, more than a hundred and fifty years ago. Daniel did not own it. He rented it from a company. For ten years, the rent was the same. \"But the owner sold the building last year,\" said Daniel. \"The new owner wants to double the r
