 "tính khí thất thường"}, {"w": "vain", "p": "adj", "vi": "tự phụ"}]}, {"id": "W34-5", "title": "The Best Week and the Worst Week", "body": "In September, two things happened in the same week. One was the best thing in Minh's life. The other was one of the worst.\n\nOn Monday, a box arrived from London. Inside were ten copies of his book, Two Rivers. Real books, with his name on the cover. Minh opened the box with shaking hands. He held a copy. He smelled the pages. He was **ecstatic**.\n\nHana came home and found him sitting on the floor, surrounded by books. \"Is that it?\" she said. \"Your book?\"\n\n\"My book,\" said Minh. He felt **elated**, **exhilarated**, completely happy. \"It's real.\"\n\nThey celebrated with a bottle of champagne and a lot of sushi. Minh sent photos to everyone. His parents were **astonished**. His father, who couldn't read English, held the book upside down in the photo. Lan was **content** just to see her name in the thank-you page. The Parkers were **contented** and proud. Mrs. Green at the library ordered twenty copies.\n\nBut on Thursday, a message came from England. It was from Mia.\n\n\"Minh. I'm sorry. Margaret died last night. In her sleep. Grandma is **devastated**.\"\n\nMinh read it three times. He sat down. Hana came and held his hand. He couldn't speak.\n\nMargaret, the funny, kind old woman who painted rivers. Margaret, who had found her best friend after sixty years. They had had only two years together. Two years after sixty years apart.\n\nMinh called the Parkers. Anna answered. Her voice was **gloomy** and tired. \"She's not good,\" Anna said. \"Rose. She's not eating. She just sits by the window.\"\n\nMinh asked to talk to Grandma Rose. There was a long pause. Then her voice came, small and old.\n\n\"Minh,\" she said. \"Did you hear?\"\n\n\"I heard. I'm so sorry, Grandma.\"\n\n\"I keep thinking,\" she said, \"about the sixty years we wasted. All those years. Because of pride. Because of a silly argument.\" Her voice broke. \"I should have written back in 1975. I was **insecure**, and proud, and stupid.\"\n\n\"You found her again,\" said Minh. \"You had two good years. That's not nothing.\"\n\n\"It's not enough,\" said Grandma Rose. And then she cried.\n\nMinh felt helpless, eleven thousand kilometers away. He felt **dismayed** and sad. He wanted to fly to England immediately, but the funeral was in Scotland in three days, and he couldn't get a flight in time.\n\nThat night, he couldn't sleep. He felt **bewildered**: how could the best week of his life also be one of the worst? He felt guilty for being happy about his book while Grandma Rose was suffering. He also felt **apprehensive**. Grandma Rose was eighty-four. How long did she have?\n\nHana understood. \"**Grief** is strange,\" she said. \"It comes in waves. You can't control it. People **grieve** in different ways. Some cry. Some get angry. Some become **indifferent** for a while, like nothing matters.\"\n\n\"How do you know so much about it?\"\n\n\"I'm a nurse,\" said Hana. \"I see grief every week.\"\n\nThe next day, Minh did something. He wrote a letter to Grandma Rose. A real letter, on paper, like the one Margaret had sent in 1975. He wrote about Margaret: her paintings, her jokes, her smile when she saw Grandma Rose on the garden path. He wrote: \"You didn't waste sixty years. You found her. That's the end of the story that matters. Not the beginning.\"\n\nHe put a copy of his book in the envelope. On the first page, he wrote: \"For Rose and Margaret. Two rivers that met again.\"\n\nA week later, Grandma Rose called. Her voice was stronger. \"I read your letter,\" she said. \"And your book. All of it, in two days. My eyes hurt.\"\n\n\"Are you okay?\" asked Minh.\n\n\"No,\" she said honestly. \"But I'll be okay. Your book helped. And your letter. You're very **empathetic** for a young man. And very **courageous** to write about your own life like that. I'm not **humiliated** by the grandmother character, by the way. Although she's very bossy. I can't imagine who she's based on.\"\n\nMinh laughed through his tears.\n\n\"Margaret would have loved the book,\" said Grandma Rose. \"She told me once that you were **witty**, **humorous**, **diplomatic**, **dependable**, **courteous** and **frank**. She was **gracious** about everyone, but she really liked you. She said you were **versatile**: journalist, café worker, detective. That was her favourite **trait** in a person.\"\n\n\"I'm **exasperated** that I can't be there,\" said Minh.\n\n\"Don't be,\" said Grandma Rose. \"Come at Christmas. That's soon enough. And bring the girl.\"\n\nAfter the call, Minh sat by the window of their small Tokyo flat. Outside, the city was bright and busy. He thought about Margaret, about rivers, about time. Then he opened his laptop and started to write. Not a story for the Gazette. Something else. Something about two old women and a river. Maybe, one day, it would be his second book.", "words": 807, "new": [{"w": "witty", "p": "adj", "vi": "dí dỏm"}, {"w": "frank", "p": "adj/v", "vi": "thẳng thắn"}, {"w": "humorous", "p": "adj", "vi": "hài hước"}, {"w": "courageous", "p": "adj", "vi": "can đảm"}, {"w": "courteous", "p": "adj", "vi": "lịch sự"}, {"w": "gracious", "p": "adj", "vi": "nhã nhặn"}, {"w": "dependable", "p": "adj", "vi": "đáng tin cậy"}, {"w": "diplomatic", "p": "adj", "vi": "khéo léo, ngoại giao"}, {"w": "empathetic", "p": "adj", "vi": "đồng cảm"}, {"w": "versatile", "p": "adj", "vi": "đa năng"}, {"w": "trait", "p": "n", "vi": "đặc điểm tính cách"}, {"w": "apprehensive", "p": "adj", "vi": "lo sợ"}, {"w": "astonished", "p": "adj", "vi": "kinh ngạc"}, {"w": "bewildered", "p": "adj", "vi": "hoang mang"}, {"w": "content", "p": "adj/v/n", "vi": "hài lòng"}, {"w": "contented", "p": "adj", "vi": "mãn nguyện"}, {"w": "devastated", "p": "adj", "vi": "suy sụp"}, {"w": "dismayed", "p": "adj", "vi": "thất vọng lo lắng"}, {"w": "ecstatic", "p": "adj", "vi": "vui sướng tột độ"}, {"w": "elated", "p": "adj", "vi": "phấn khởi"}, {"w": "exasperated", "p": "adj", "vi": "bực tức"}, {"w": "exhilarated", "p": "adj", "vi": "phấn chấn"}, {"w": "gloomy", "p": "adj", "vi": "buồn rầu"}, {"w": "grief", "p": "n", "vi": "nỗi đau buồn"}, {"w": "grieve", "p": "v", "vi": "đau buồn"}, {"w": "humiliated", "p": "adj", "vi": "bị làm nhục"}, {"w": "indifferent", "p": "adj", "vi": "thờ ơ"}, {"w": "insecure", "p": "adj", "vi": "thiếu tự tin"}]}, {"id": "W35-1", "title": "Coming Home for Christmas", "body": "In December, Minh and Hana flew back to England for Christmas. Minh had mixed feelings. He was excited to see everyone. But he was also **uneasy**. He didn't know how Grandma Rose would be after Margaret's death.\n\nOn the long flight, he felt **weary** and **irritable**. He couldn't sleep. Hana slept on his shoulder. He watched the map on the screen: the little plane moving slowly over Russia, then Europe.\n\nAt the airport, the whole Parker family was waiting. Mia ran to them first. Leo was taller than ever. Tom and Anna hugged them both. And there, in a wheelchair at the back, was Grandma Rose.\n\nMinh was **stunned**. She looked so small. So old. In three months, she seemed to have aged ten years.\n\n\"Don't look at me like that,\" she said. \"It's only for the airport. Too much walking. I can still walk at home.\" She held out her arms. Minh knelt down and hugged her. She smelled of lavender, like always.\n\nAt home, everything was the same, and everything was different. The same kitchen, the same chairs, the same smell of Tom's cooking. But Grandma Rose's chair by the window had a new photo next to it: Margaret, by a river, laughing.\n\nThat evening, Minh sat with Grandma Rose. She talked about Margaret for a long time. Sometimes she laughed. Sometimes she was **sorrowful**. She was **nostalgic** for the old days, for the girls they had been. \"I feel **remorse**,\" she said. \"Not about the end. About the middle. All those years of **resentment**, when I could have just written a letter.\"\n\n\"You weren't **resentful** at the end,\" said Minh. \"At the end, there was only love.\"\n\nShe looked at him. \"When did you become so wise?\"\n\n\"I had a good teacher,\" said Minh.\n\nGrandma Rose smiled. \"Don't be **sentimental**. It doesn't suit you.\"\n\nLater, Anna told Minh more. After the funeral, Grandma Rose had been **distressed** and **agitated** for weeks. She couldn't sleep. She was angry at everything: the doctors, the weather, God. \"I've never seen her in such a **rage**,\" said Anna. \"Then, for a while, it was **despair**. She stopped going out. She stopped seeing friends. Then your letter came. And your book. It helped.\"\n\n\"I'm glad,\" said Minh.\n\n\"There's something else,\" said Anna. \"Something you need to know. Margaret left her something in her will. Something big. She'll tell you herself.\"\n\nMinh was **perplexed**. What could it be?\n\nBut first, there was another event. Minh's book was being launched in London, at a famous bookshop, on December twentieth. His publisher had organized a party. \"Formal **attire**,\" said the invitation. Black tie.\n\n\"What does black tie mean?\" asked Minh.\n\n\"It means a **tuxedo**,\" said Tom. \"A black suit with a bow tie. And Hana, you need a **gown**. A long dress.\"\n\nMinh felt a little **dread**. He had never worn a tuxedo. He didn't own one. They were expensive. He felt **overwhelmed** by the whole thing: a book launch, in London, with famous people. \"I'm a boy from a small town in Vietnam,\" he said. \"What do I know about tuxedos?\"\n\n\"You know enough to write a book,\" said Mia. \"You can learn to wear a **garment**.\"\n\nGrandma Rose had an idea. \"I have your grandfather's tuxedo in the loft,\" she said to Tom. \"From 1965. And a beautiful **robe** of mine, silk, that could become a gown for Hana. I'll fix them. I'm not dead yet.\"\n\nFor the first time since Margaret's death, Anna told Minh later, Grandma Rose had **enthusiasm** for something. She had **passion** in her voice again.\n\n\"Thank you,\" said Minh. He felt **gratitude** so deep he couldn't say more.\n\n\"Don't thank me,\" said Grandma Rose. \"Just don't spill wine on it. Those **garments** are older than your mother.\"\n\nThere was no **contempt** in her voice, no bitterness. Only the old Grandma Rose, coming back slowly. Minh felt **compassion** for her, and also hope. He was **wary** of being too hopeful. But it was Christmas, and she was alive, and he was home. Or one of his homes.", "words": 677, "new": [{"w": "irritable", "p": "adj", "vi": "dễ cáu"}, {"w": "nostalgic", "p": "adj", "vi": "hoài niệm"}, {"w": "overwhelmed", "p": "adj", "vi": "choáng ngợp"}, {"w": "perplexed", "p": "adj", "vi": "bối rối"}, {"w": "resentful", "p": "adj", "vi": "ấm ức"}, {"w": "resentment", "p": "n", "vi": "sự oán giận"}, {"w": "remorse", "p": "n", "vi": "sự hối hận"}, {"w": "sentimental", "p": "adj", "vi": "đa cảm"}, {"w": "stunned", "p": "adj", "vi": "sững sờ"}, {"w": "uneasy", "p": "adj", "vi": "bất an"}, {"w": "wary", "p": "adj", "vi": "cảnh giác"}, {"w": "weary", "p": "adj", "vi": "mệt mỏi"}, {"w": "agitated", "p": "adj", "vi": "kích động"}, {"w": "distressed", "p": "adj", "vi": "đau khổ"}, {"w": "compassion", "p": "n", "vi": "lòng trắc ẩn"}, {"w": "contempt", "p": "n", "vi": "sự khinh miệt"}, {"w": "despair", "p": "n/v", "vi": "sự tuyệt vọng"}, {"w": "dread", "p": "n/v", "vi": "nỗi khiếp sợ"}, {"w": "enthusiasm", "p": "n", "vi": "sự nhiệt tình"}, {"w": "gratitude", "p": "n", "vi": "lòng biết ơn"}, {"w": "passion", "p": "n", "vi": "niềm đam mê"}, {"w": "rage", "p": "n", "vi": "cơn thịnh nộ"}, {"w": "sorrowful", "p": "adj", "vi": "đau buồn"}, {"w": "attire", "p": "n", "vi": "trang phục"}, {"w": "garment", "p": "n", "vi": "quần áo"}, {"w": "garments", "p": "n", "vi": "quần áo"}, {"w": "tuxedo", "p": "n", "vi": "bộ lễ phục nam"}, {"w": "gown", "p": "n", "vi": "váy dạ hội"}, {"w": "robe", "p": "n", "vi": "áo choàng"}]}, {"id": "W35-2", "title": "The Tailor and the Will", "body": "For a week, Grandma Rose worked on the clothes. She set up her old sewing machine in the living room. Her hands were slower than before, but they were still clever.\n\nFirst, the tuxedo. Minh's grandfather had been taller and bigger. Grandma Rose had to change everything. She took in the jacket at the sides. She shortened the trousers and fixed the **hem**. She moved the buttons. She opened every **seam** and closed it again. \"A good **tailor** can make anything fit,\" she said. \"My father was a tailor. Every suit he made was **tailored** for one person only.\"\n\nShe showed Minh the **cuffs** of the shirt. \"You need **cufflinks**,\" she said. She found a pair in her jewelry box: gold, with tiny stones. \"Your grandfather's. He wore them at our wedding.\"\n\nThen Hana's gown. Grandma Rose's old robe was made of real silk, smooth and **silky** and the color of the sea. \"Not **polyester**,\" she said. \"Not **synthetic**. Real silk, from 1970. They don't make it like this anymore.\" She turned the robe into a long, beautiful dress. It was **vintage** and elegant. Hana put it on and looked in the mirror. She couldn't speak.\n\n\"And for Mia,\" said Grandma Rose, \"a **blazer**.\" She had made Mia a dark blue blazer from an old coat. Mia loved it.\n\nFor jewelry, Grandma Rose gave Hana a **brooch** shaped like a bird and a silver **pendant** on a chain. Mia wanted to wear an **anklet** with the dress. \"Absolutely not,\" said Grandma Rose. \"Ankles are not for jewelry. And proper **footwear**, please. No trainers.\"\n\nHana showed them a photo of her cousin's wedding in Japan, where the bride wore a white **headscarf** and a traditional **veil**. Grandma Rose was fascinated. \"In my day, every bride wore a veil,\" she said.\n\nOn the third day, while Grandma Rose was **knitting** a scarf for Hana in the evening, she finally told Minh about the will.\n\n\"Margaret left me her cottage,\" she said. \"In Scotland. By the river.\"\n\nMinh stared at her. \"Her house?\"\n\n\"Her house. Fiona, her daughter, has her own home in Edinburgh. She doesn't need it. Margaret wrote in her will: 'For Rose, so she can see my rivers.'\"\n\nMinh didn't know what to say.\n\n\"It's a small **dwelling**,\" said Grandma Rose. \"Two bedrooms, an old kitchen, a **conservatory** full of plants where Margaret painted. The **premises** need work. The roof is old. The **utility** bills are high, because the heating is old. Fiona says it needs to be **refurbished**. Maybe even **remodeled**. But it's mine.\"\n\n\"What will you do with it?\" asked Minh. \"Will you live there?\"\n\nGrandma Rose laughed. \"At eighty-four? Alone, in Scotland? No. But I can't sell it either. It was Margaret's. So I've been thinking.\" She put down her **knitted** scarf. \"I want it to be a place for the family. For holidays. For painting. For writers.\" She looked at him. \"For you, if you need somewhere quiet to write your next book.\"\n\nMinh felt tears in his eyes. \"Grandma...\"\n\n\"I'm a **homeowner** again,\" she said. \"I haven't owned a house since your grandfather died. Tom owns this one. I'm just a **lodger** here.\" She laughed. \"The **occupant** of the best chair.\"\n\nThat night, Minh told Hana. \"Grandma Rose wants us to use Margaret's cottage. To write. To rest.\"\n\nHana was quiet. Then she said, \"Margaret and Rose found each other by a river. Now we can stay in her house by a river. That's beautiful.\"\n\n\"It needs a lot of work,\" said Minh.\n\n\"Then we'll go and see it,\" said Hana. \"After the book launch. Before we go back to Japan.\"\n\nAnd so it was decided. After London, they would go to Scotland. The family would come too. Even Grandma Rose. \"I want to see it,\" she said. \"I want to see where she lived.\"", "words": 639, "new": [{"w": "blazer", "p": "n", "vi": "áo khoác vest"}, {"w": "cuff", "p": "n", "vi": "cổ tay áo"}, {"w": "hem", "p": "n", "vi": "gấu áo váy"}, {"w": "seam", "p": "n", "vi": "đường may"}, {"w": "knit", "p": "v/n/adj", "vi": "đan"}, {"w": "knitted", "p": "adj", "vi": "được đan"}, {"w": "silky", "p": "adj", "vi": "mượt như lụa"}, {"w": "polyester", "p": "n", "vi": "vải polyester"}, {"w": "synthetic", "p": "adj/n", "vi": "tổng hợp"}, {"w": "tailor", "p": "n/v", "vi": "thợ may"}, {"w": "tailored", "p": "adj", "vi": "được may đo"}, {"w": "vintage", "p": "adj", "vi": "cổ điển"}, {"w": "brooch", "p": "n", "vi": "trâm cài áo"}, {"w": "pendant", "p": "n", "vi": "mặt dây chuyền"}, {"w": "anklet", "p": "n", "vi": "lắc chân"}, {"w": "cufflinks", "p": "n", "vi": "khuy măng sét"}, {"w": "footwear", "p": "n", "vi": "giày dép"}, {"w": "headscarf", "p": "n", "vi": "khăn trùm đầu"}, {"w": "veil", "p": "n", "vi": "mạng che mặt"}, {"w": "dwelling", "p": "n", "vi": "nhà ở"}, {"w": "premises", "p": "n", "vi": "cơ sở nhà đất"}, {"w": "occupant", "p": "n", "vi": "người ở"}, {"w": "lodger", "p": "n", "vi": "người thuê phòng trọ"}, {"w": "homeowner", "p": "n", "vi": "chủ nhà"}, {"w": "refurbish", "p": "v", "vi": "tân trang"}, {"w": "remodel", "p": "v", "vi": "sửa sang"}, {"w": "conservatory", "p": "n", "vi": "phòng kính"}, {"w": "utility", "p": "n/adj", "vi": "tiện ích; dịch vụ công"}]}, {"id": "W35-3", "title": "The Cottage", "body": "The book launch in London was wonderful, but Minh remembered it only like a dream: lights, people, his name on a poster, a short speech he didn't remember giving. What he remembered best was afterwards. Three days later, the whole family drove to Scotland, to Margaret's cottage.\n\nIt was a small stone house by a fast, clear river, at the edge of a village. Snow was on the hills. Fiona met them with the key. \"Welcome,\" she said to Grandma Rose. \"It's yours now.\"\n\nGrandma Rose stood at the threshold for a long time before she went in.\n\nInside, the cottage was full of Margaret. Her paintings covered every wall. Her paints were still on a table in the conservatory. The **furnishings** were old but comfortable: a big sofa with faded **upholstery**, an **ottoman** to put your feet on, a tall wooden **armoire** for clothes, and an old **bureau** with many small drawers, full of letters.\n\nThe kitchen was a museum. On the shelves, there was a glass **decanter** for whisky, a **carafe** for water, a **thermos** for walks, and rows of tin **canisters** for tea, sugar and flour. On the table, there was a lace **doily** under a vase, and old **coasters** under the cups. Next to the cooker, an iron **trivet** for hot pots. \"She never threw anything away,\" said Fiona. \"Every **receptacle** in this house has something in it. Buttons, keys, old photos.\"\n\nThe bedroom upstairs had heavy velvet **drapes** on the windows, with a short **valance** at the top. Mia loved them. \"Very old-fashioned,\" she said. \"Very cool.\" In the small second bedroom, there was only a Japanese **futon** on the floor. \"Margaret visited Japan once,\" said Fiona. \"She came back and said beds were too soft.\"\n\nHana laughed. \"She was right.\"\n\nBut the house needed a lot of work. Tom and Leo went around checking everything. Some **floorboards** were broken. There were cracks in the walls. A wooden **partition** between the kitchen and the dining room was falling down. The **foundation** at the back of the house was wet. Many **fixtures** were old: the lights, the taps, the electrical **fittings**.\n\n\"It's a big job,\" said Tom. \"But possible.\"\n\nIn the shed outside, they found Margaret's late husband's tools. He had been a doctor, but he loved woodwork. There was a wooden **mallet**, a **chisel** for cutting wood, a heavy iron **crowbar**, and garden tools: a **wheelbarrow**, a **rake** and a **shovel**. \"He fixed everything himself,\" said Fiona. \"Mum said he was better with a chisel than with a stethoscope.\"\n\nLeo picked up the crowbar. \"We can start tomorrow,\" he said. \"I'll take up the broken floorboards.\"\n\n\"You?\" said Mia.\n\n\"I'm going to be a vet,\" said Leo. \"Vets need strong arms. Cows are heavy.\"\n\nThat evening, they lit a fire in the old fireplace. Grandma Rose sat in Margaret's chair by the window. Outside, the river was dark and loud. She didn't say much. She just looked at the paintings on the walls.\n\n\"Are you okay?\" Minh asked quietly.\n\n\"Yes,\" she said. \"I think I am. It's strange. I feel like she's here. Not in a sad way. In a happy way. Like she's just gone out for a walk and she'll be back soon.\"\n\nFiona brought out a box from the bureau. \"Mum left this for you too,\" she said. \"It was in the top drawer, with your name on it.\"\n\nInside the box, there were letters. Fifty letters. All addressed to Rose. All written over sixty years, but never sent.\n\n\"She wrote to you every year,\" said Fiona softly. \"On your birthday. She never sent them. She was too afraid.\"\n\nGrandma Rose held the box against her chest. She didn't open it. \"Not tonight,\" she said. \"Tonight, I just want to sit here. In her house. With my family.\"\n\nAnd they sat together by the fire, listening to the river, until very late.", "words": 650, "new": [{"w": "foundation", "p": "n", "vi": "nền móng"}, {"w": "partition", "p": "n", "vi": "vách ngăn"}, {"w": "floorboard", "p": "n", "vi": "ván sàn"}, {"w": "upholstery", "p": "n", "vi": "vật liệu bọc ghế"}, {"w": "furnishings", "p": "n", "vi": "đồ nội thất"}, {"w": "fixture", "p": "n", "vi": "thiết bị cố định"}, {"w": "fittings", "p": "n", "vi": "thiết bị lắp đặt"}, {"w": "drapes", "p": "n", "vi": "rèm cửa dày"}, {"w": "valance", "p": "n", "vi": "diềm rèm"}, {"w": "ottoman", "p": "n", "vi": "ghế đôn bọc nệm"}, {"w": "futon", "p": "n", "vi": "nệm gấp"}, {"w": "armoire", "p": "n", "vi": "tủ quần áo"}, {"w": "bureau", "p": "n", "vi": "tủ ngăn kéo"}, {"w": "receptacle", "p": "n", "vi": "đồ chứa"}, {"w": "canister", "p": "n", "vi": "hộp đựng"}, {"w": "decanter", "p": "n", "vi": "bình đựng rượu"}, {"w": "carafe", "p": "n", "vi": "bình rót nước"}, {"w": "thermos", "p": "n", "vi": "bình giữ nhiệt"}, {"w": "coaster", "p": "n", "vi": "miếng lót cốc"}, {"w": "doily", "p": "n", "vi": "khăn lót trang trí"}, {"w": "trivet", "p": "n", "vi": "đế lót nồi"}, {"w": "mallet", "p": "n", "vi": "vồ"}, {"w": "chisel", "p": "n", "vi": "đục"}, {"w": "crowbar", "p": "n", "vi": "xà beng"}, {"w": "wheelbarrow", "p": "n", "vi": "xe cút kít"}, {"w": "rake", "p": "n/v", "vi": "cào"}, {"w": "shovel", "p": "n/v", "vi": "xẻng"}]}, {"id": "W35-4", "title": "Christmas in Scotland", "body": "They decided to stay in the cottage for Christmas. It was cold and old, but it was beautiful. Everyone had a job.\n\nTom and Leo worked on the house. They used **sandpaper** to smooth the old wooden doors. They used a strong **adhesive** to fix the broken tiles. Tom used a chemical **solvent** to remove old paint from the windows. \"The **upkeep** of an old house is never finished,\" he said. \"But it's satisfying.\"\n\nMia and Fiona worked in the garden. They used a **spade** to dig and a small **trowel** to plant bulbs for spring. \"In April, there will be flowers everywhere,\" said Fiona. \"Mum's favourite season.\"\n\nAnna and Hana cleaned the house. They **sanitized** the kitchen and **disinfected** the bathroom. They **laundered** all the curtains and sheets, which hadn't been washed for months. \"Margaret was a wonderful painter,\" said Anna, \"but not a great cleaner.\"\n\nMinh and Grandma Rose had the most important job: Christmas dinner.\n\nGrandma Rose had always wanted to cook a real **gourmet** dinner. \"Not just turkey,\" she said. \"Something special. For Margaret.\" She brought her old **culinary** books and a list of recipes. Minh was her assistant again, like in the old days.\n\nThey went to the village shop. It was small, but the owner was a **gourmet** too. He sold local **delicacies**: Scottish salmon, venison, cheese and honey. He also sold strange things from all over the world. Minh found a **condiment** from Vietnam: chili sauce. \"Of course,\" said Grandma Rose. \"You can't cook without chili.\"\n\nOn Christmas Eve, they started cooking. Grandma Rose made a **marinade** for the meat with red wine, garlic and herbs. Minh made a clear beef **broth**, Vietnamese style, with ginger and star anise. \"That's very elegant,\" said Grandma Rose. \"In France, they call it **consomme**. A clear soup.\"\n\nFor the vegetables, Grandma Rose made a carrot **puree**, smooth and orange. \"Margaret loved puree,\" she said. \"She said it was food for people with no teeth. She was joking. Mostly.\"\n\nHana made a Japanese dish with **lentils** and **chickpeas**, two kinds of **legume**. \"Healthy,\" she said. \"To balance all the butter.\"\n\nThe desserts were Grandma Rose's speciality. She made a chocolate **mousse**, light and soft. She tried to make a cheese **souffle**, but it fell in the oven. \"Souffles are like men,\" she said. \"They go up and then they come down.\" Everyone laughed.\n\nShe made a lemon **sorbet**, cold and fresh, between courses. She made a warm vanilla **custard** to pour over the Christmas pudding. And she made small white **meringues** with **caramel** sauce. For the pancakes on Christmas morning, there was maple **syrup** from Canada and dark **molasses** for Tom, who liked everything sweet.\n\nThe dinner took six hours to make. When it was ready, they sat around Margaret's old table. Fiona was there too. Through the window, the river shone in the moonlight. Snow fell softly.\n\nBefore they ate, Grandma Rose stood up. She held a glass.\n\n\"To Margaret,\" she said. \"Who painted rivers and wrote letters she never sent. Who waited sixty years and was never angry. Who gave me her home. I didn't deserve her friendship. But I had it anyway.\"\n\n\"To Margaret,\" everyone said.\n\nThen Grandma Rose did something unexpected. She took one letter from the box, the first one, from 1966. She opened it. And she read it aloud.\n\n\"Dear Rose. Happy birthday. I'm sorry. I miss you. One day, I hope, we will sit by a river again and laugh about all this. Your friend always, Maggie.\"\n\nThe room was silent. Then Grandma Rose folded the letter and smiled. \"We did,\" she said. \"We did sit by a river again. And we did laugh.\"\n\nIt was the best Christmas any of them could remember.", "words": 623, "new": [{"w": "spade", "p": "n", "vi": "mai đào đất"}, {"w": "trowel", "p": "n", "vi": "bay làm vườn"}, {"w": "sandpaper", "p": "n", "vi": "giấy nhám"}, {"w": "solvent", "p": "adj/n", "vi": "dung môi"}, {"w": "adhesive", "p": "n/adj", "vi": "chất kết dính"}, {"w": "upkeep", "p": "n", "vi": "chi phí bảo dưỡng"}, {"w": "sanitize", "p": "v", "vi": "làm sạch vệ sinh"}, {"w": "disinfect", "p": "v", "vi": "khử trùng"}, {"w": "launder", "p": "v", "vi": "giặt là"}, {"w": "delicacy", "p": "n", "vi": "món ngon đặc sản"}, {"w": "gourmet", "p": "adj/n", "vi": "người sành ăn"}, {"w": "culinary", "p": "adj", "vi": "thuộc về ẩm thực"}, {"w": "condiment", "p": "n", "vi": "gia vị ăn kèm"}, {"w": "marinade", "p": "n", "vi": "nước ướp"}, {"w": "broth", "p": "n", "vi": "nước dùng"}, {"w": "consomme", "p": "n", "vi": "súp trong"}, {"w": "puree", "p": "n/v", "vi": "thức ăn nghiền nhuyễn"}, {"w": "mousse", "p": "n", "vi": "bánh mousse"}, {"w": "souffle", "p": "n", "vi": "bánh trứng phồng"}, {"w": "sorbet", "p": "n", "vi": "kem trái cây không sữa"}, {"w": "custard", "p": "n", "vi": "xốt trứng sữa"}, {"w": "meringue", "p": "n", "vi": "bánh lòng trắng trứng"}, {"w": "caramel", "p": "n", "vi": "đường thắng"}, {"w": "syrup", "p": "n", "vi": "si rô"}, {"w": "molasses", "p": "n", "vi": "mật rỉ đường"}, {"w": "legume", "p": "n", "vi": "cây họ đậu"}, {"w": "lentil", "p": "n", "vi": "đậu lăng"}, {"w": "chickpea", "p": "n", "vi": "đậu gà"}]}, {"id": "W35-5", "title": "The Food Market", "body": "On the day after Christmas, there was a winter food market in the nearest town. Minh wanted to write about it for the Gazette's food page. Hana and Mia came with him.\n\nThe market was in an old stone square, full of stalls with lights and music. It smelled of hot wine, roasting nuts and fresh bread.\n\nThe first stall sold grains. There were big bags of **oats**, for porridge, and **barley**, for soup. There was **quinoa**, a small seed from South America. \"Very fashionable,\" said the woman at the stall. \"Young people love it. Full of protein.\" There was **wholegrain** rice and **wholemeal** flour for bread. \"Better for you than white,\" she said. Mia bought a bag of oats for Grandma Rose.\n\nThe second stall sold meat. There was Scottish **venison**, deer meat, dark and strong. There was **veal**, from young cows. \"Very tender,\" said the butcher. Hana didn't buy anything. \"I'm not brave enough for venison,\" she said.\n\nThe fish stall was Minh's favourite. Scotland was famous for seafood. There were black **mussels** in a big bucket, white **scallops** in their shells, and small **clams**. There was **squid**, which Minh knew well from Vietnam. There were small silver fish: **anchovies** and **sardines**. There was **mackerel**, with blue and black stripes, and big white **cod**, the fish used for fish and chips.\n\n\"In Vietnam, we'd grill the squid with chili and lime,\" said Minh to the fisherman.\n\n\"In Scotland, we fry everything,\" said the fisherman, laughing. \"But you can grill it if you want. Just don't tell my wife.\"\n\nThe vegetable stall had winter vegetables. There were **artichokes**, which looked like green flowers, and dark green **kale**. There were **turnips**, white and purple, and **parsnips**, like white carrots. \"Parsnips are sweet when you roast them,\" said the farmer. \"Essential for Christmas dinner.\" There were small **shallots**, like little onions, and long green **scallions**. \"In America, they call those green onions,\" said Mia. \"My dad would know.\"\n\nThe last stall sold spices and herbs. It was run by an old Indian man who had lived in Scotland for fifty years. He had everything: red **saffron**, the most expensive spice in the world, \"more expensive than gold.\" There was **nutmeg**, brown and round, for Christmas cakes. There were green herbs: **oregano** for pizza, **thyme** and **rosemary** for meat. And there was fresh **coriander**.\n\n\"In America, they call this **cilantro**,\" said Mia.\n\n\"Your dad again?\" asked Hana.\n\n\"Always my dad.\"\n\nThe Indian man laughed. \"Coriander, cilantro, it doesn't matter. In Hindi, we call it dhania. Same plant, many names. Like people.\" He gave Minh a small bag for free. \"For your Vietnamese soup,\" he said. \"Coriander is good in everything.\"\n\nMinh interviewed all the stall owners. He took photos. He tried everything. By the end, he was very full.\n\nOn the way back to the cottage, Mia asked, \"What will you write?\"\n\nMinh thought. \"That food is like a map,\" he said. \"Every food came from somewhere. Quinoa from South America. Saffron from Iran. Coriander from everywhere. Venison from these hills. And all of it, in one small square in Scotland, at Christmas.\"\n\n\"That's nice,\" said Hana.\n\n\"It's a bit sentimental,\" said Mia. \"Grace will say so.\"\n\n\"Grace always says so,\" said Minh. \"Then she publishes it anyway.\"\n\nThat night, they cooked the squid, Vietnamese style, with chili and lime and the free coriander. Grandma Rose tried it. \"Spicy,\" she said, her eyes watering. \"Margaret would have hated it.\" Then she took a second piece. \"But I don't.\"", "words": 586, "new": [{"w": "quinoa", "p": "n", "vi": "hạt diêm mạch"}, {"w": "barley", "p": "n", "vi": "lúa mạch"}, {"w": "oats", "p": "n", "vi": "yến mạch"}, {"w": "wholegrain", "p": "adj", "vi": "nguyên hạt"}, {"w": "wholemeal", "p": "adj", "vi": "nguyên cám"}, {"w": "venison", "p": "n", "vi": "thịt hươu"}, {"w": "veal", "p": "n", "vi": "thịt bê"}, {"w": "mussel", "p": "n", "vi": "vẹm"}, {"w": "scallop", "p": "n", "vi": "sò điệp"}, {"w": "squid", "p": "n", "vi": "mực"}, {"w": "clam", "p": "n", "vi": "nghêu"}, {"w": "anchovy", "p": "n", "vi": "cá cơm"}, {"w": "sardine", "p": "n", "vi": "cá mòi"}, {"w": "mackerel", "p": "n", "vi": "cá thu"}, {"w": "cod", "p": "n", "vi": "cá tuyết"}, {"w": "artichoke", "p": "n", "vi": "atisô"}, {"w": "kale", "p": "n", "vi": "cải xoăn"}, {"w": "turnip", "p": "n", "vi": "củ cải tròn"}, {"w": "parsnip", "p": "n", "vi": "củ cải vàng"}, {"w": "shallot", "p": "n", "vi": "hành tím"}, {"w": "scallion", "p": "n", "vi": "hành lá"}, {"w": "saffron", "p": "n", "vi": "nhụy hoa nghệ tây"}, {"w": "nutmeg", "p": "n", "vi": "nhục đậu khấu"}, {"w": "oregano", "p": "n", "vi": "kinh giới cay"}, {"w": "thyme", "p": "n", "vi": "cỏ xạ hương"}, {"w": "rosemary", "p": "n", "vi": "hương thảo"}, {"w": "coriander", "p": "n", "vi": "rau mùi"}, {"w": "cilantro", "p": "n", "vi": "rau mùi"}]}, {"id": "W36-1", "title": "Tokyo Kitchen", "body": "Back in Tokyo, Yuko gave Minh a new job at the newspaper: a weekly food column. \"You wrote about food in England,\" she said. \"Now write about food in Japan. For foreigners who live here.\"\n\nMinh loved it. Every week, he went somewhere new: a tiny noodle shop, a fish market at four in the morning, a fancy restaurant where the meal cost more than his rent.\n\nHis first column was about an izakaya, a Japanese pub, near the train station. He went with Ben, the Australian, and Aiko, the quiet writer from Osaka. They were **starving** after work. \"I'm **famished**,\" said Ben. \"I could eat a horse.\"\n\nThe food was **appetizing** and cheap. There was grilled chicken on sticks, **succulent** and juicy. There was beef that was so **tender** it fell apart. There were small plates of vegetables, tofu and fish. Ben ate everything. \"This is **gluttony**,\" he said happily. \"And I don't care.\"\n\nThey also drank. Ben drank beer. Aiko drank **sake**, Japanese rice wine, served warm in a small cup. Minh tried it. It was strong and sweet. \"Careful,\" said Aiko. \"Sake is stronger than it tastes.\"\n\nMinh was careful. Ben was not. He tried everything on the drinks menu: Japanese whisky, **gin**, **rum** with cola, a sweet plum **liqueur** and, at the end, a glass of French **brandy**. By midnight, he was very **intoxicated**. He sang loudly on the street. The next morning, he came to work with a terrible **hangover**. \"Never again,\" he said, holding his head. \"I'm **dehydrated**. I need water. And coffee.\"\n\n\"Too much **caffeine** won't help,\" said Aiko. \"Drink water. And maybe **kombucha**. It's good for the stomach.\"\n\nBen looked at her like she was crazy. \"What's kombucha?\"\n\n\"Fermented tea. A little sour. Very healthy.\"\n\n\"I'll stick with coffee.\"\n\nMinh was not a big drinker. He usually stayed **sober**. Hana didn't drink at all; she was **teetotal**. \"In the hospital, I see too many people hurt by alcohol,\" she said. \"I'd rather have tea.\"\n\nFor his second column, Minh went to a cooking class. The teacher was a famous chef who taught Japanese and Western cooking. She showed them many techniques.\n\n\"To **saute**, you cook small pieces quickly in a hot pan with a little oil,\" she said, moving the vegetables fast. \"To **sear** meat, you cook the outside very hot, so it's brown and crispy, but the inside stays pink.\"\n\nShe showed them how to **braise** beef: cook it slowly in a little liquid, for hours, until it's soft. How to **poach** an egg: cook it gently in hot water, not boiling. How to **caramelize** onions: cook them slowly until the sugar turns them sweet and brown. How to **knead** dough for bread: push and fold it with your hands for ten minutes.\n\nAt the end, she showed them how to **garnish** a plate: a little green herb on top, a line of sauce, a few seeds. \"People eat with their eyes first,\" she said. \"If it looks beautiful, it tastes better.\"\n\nSome of the students' food was **palatable**. Some was **unpalatable**. Minh's braised beef was good, but his poached egg was a disaster. \"It looks like a cloud,\" said the chef. \"A sad cloud.\"\n\nThe chef also talked about **vegetarianism** in Japan. \"Japanese Buddhist monks have eaten vegetarian food for a thousand years,\" she said. \"Tofu, vegetables, mushrooms. Many people think Japanese food is all fish. It's not.\"\n\nShe gave them a final tip: \"A little **cumin** in a beef stew. Not Japanese, but delicious.\" Minh wrote it down.\n\nThat week, he wrote his column: \"Tokyo Kitchen: Learning to Cook, Learning to Fail.\" Readers loved it. One of them wrote: \"Thank you for the honest description of your egg. Mine look the same.\"\n\nYuko read it and almost smiled. \"Good,\" she said. \"Next week: the oldest sake brewery in Japan.\"", "words": 640, "new": [{"w": "cumin", "p": "n", "vi": "thì là Ai Cập"}, {"w": "appetizing", "p": "adj", "vi": "ngon mắt"}, {"w": "succulent", "p": "adj/n", "vi": "mọng ngon"}, {"w": "tender", "p": "adj", "vi": "mềm"}, {"w": "palatable", "p": "adj", "vi": "hợp khẩu vị"}, {"w": "unpalatable", "p": "adj", "vi": "khó ăn"}, {"w": "starving", "p": "adj", "vi": "đói lả"}, {"w": "famished", "p": "adj", "vi": "đói ngấu"}, {"w": "gluttony", "p": "n", "vi": "thói tham ăn"}, {"w": "vegetarianism", "p": "n", "vi": "chế độ ăn chay"}, {"w": "liqueur", "p": "n", "vi": "rượu mùi"}, {"w": "brandy", "p": "n", "vi": "rượu brandy"}, {"w": "rum", "p": "n", "vi": "rượu rum"}, {"w": "gin", "p": "n/v", "vi": "rượu gin"}, {"w": "sake", "p": "n", "vi": "rượu sake"}, {"w": "kombucha", "p": "n", "vi": "trà lên men"}, {"w": "caffeine", "p": "n", "vi": "caffeine"}, {"w": "dehydrated", "p": "adj", "vi": "bị mất nước"}, {"w": "hangover", "p": "n", "vi": "dư chứng sau uống rượu"}, {"w": "intoxicated", "p": "adj", "vi": "say"}, {"w": "sober", "p": "adj", "vi": "tỉnh rượu"}, {"w": "teetotal", "p": "adj", "vi": "kiêng rượu hoàn toàn"}, {"w": "saute", "p": "v", "vi": "áp chảo"}, {"w": "braise", "p": "v", "vi": "om"}, {"w": "poach", "p": "v", "vi": "chần"}, {"w": "sear", "p": "v", "vi": "áp chảo xém mặt"}, {"w": "caramelize", "p": "v", "vi": "thắng đường"}, {"w": "garnish", "p": "v/n", "vi": "trang trí món ăn"}, {"w": "knead", "p": "v", "vi": "nhào bột"}]}, {"id": "W36-2", "title": "The Sake Brewery", "body": "The sake brewery was three hours from Tokyo, in a small town in the mountains. It had been making sake for three hundred and fifty years. Minh went with a photographer.\n\nThe owner was an old man called Mr. Sato. He was the fifteenth generation of his family to run the brewery. He showed Minh around slowly, explaining everything.\n\n\"Sake is made from rice, water and a special mold,\" he said. \"We **ferment** the rice for many weeks. The mold turns the rice into sugar, and then into alcohol. It's like making bread and beer **simultaneously**. Two processes at the same time.\"\n\nHe showed Minh the big wooden tanks where the rice was **fermenting**. The air smelled sweet and sour. \"Every season is different,\" he said. \"The rice is different. The water is different. The weather is different.\"\n\nNext to the brewery, his wife had a small shop. She sold sake, but also vegetables that she **pickled** in the leftover rice from the brewery. \"Nothing is wasted,\" she said. She also made a drink by **infusing** green tea with yuzu, a Japanese citrus fruit.\n\nA famous sake **connoisseur** was visiting that day: a woman from Kyoto who had tasted thousands of sakes. With her was a French **sommelier**, an expert in wine, who was learning about sake. \"In France, we think wine is the king of **gastronomy**,\" he said. \"But sake is just as complex. Maybe more.\"\n\nMr. Sato took them to a small room at the back. It was full of old documents. \"Here is the history of our family,\" he said. He showed them the records in **chronological** order, from the oldest to the newest. \"The first record is from 1675. Every year since then, we have made sake. Three hundred and fifty **consecutive** years. No year missed.\"\n\n\"Not even during the war?\" asked Minh.\n\n\"Even during the war. We made very little. But we made it.\"\n\nHe showed them a photo from the brewery's **centennial**, its hundredth birthday, in 1775, painted on silk. And the bicentennial, and the tricentennial. \"Next year, our three hundred and fiftieth,\" he said. \"A big celebration.\"\n\n\"Your family has seen many changes,\" said Minh.\n\nMr. Sato nodded. \"Every **epoch** brings something new. The **bygone** days of the samurai. The opening of Japan to the world. The wars. Modern Tokyo. Each change felt **imminent** and terrible. Each one passed.\" He smiled. \"Changes are **transient**. Only the rice is **perpetual**.\"\n\n\"What does the future look like?\" asked Minh.\n\nMr. Sato was quiet for a moment. \"**Hitherto**, my family has always had a son or daughter to take over. My son lives in Tokyo. He works with computers. He doesn't want the brewery.\" He paused. \"For now, my nephew is the **interim** manager. But **henceforth**, I don't know.\"\n\nMinh felt a **momentary** sadness. It was the same story he had heard in Riverford: old businesses, no one to continue them.\n\n\"The **preceding** generations didn't have this problem,\" said Mr. Sato. \"But the **succeeding** generations have choices. That's good. It's just sad for old men like me.\"\n\nHe told Minh one more thing. \"The biggest threat to sake is not young people. It's the weather. Climate change. Our rice needs cool nights. The summers are getting hotter. Last year, a **meteorologist** came to talk to us. She studies **meteorology**, the science of weather. She showed us the data: higher temperatures, less **precipitation** in some months, too much in others. The rice suffers.\"\n\nMinh wrote it all down. That week, his column was not about food. It was about time: three hundred and fifty years, from **antiquity** to now, and what might come next.\n\nHe sent a copy to Mr. Sato with a **belated** thank-you letter, because he had been too busy to write sooner. Mr. Sato replied with a bottle of sake and a note: \"**Timely** or not, thank you. Come to the anniversary.\" Minh decided he would.", "words": 650, "new": [{"w": "ferment", "p": "v", "vi": "lên men"}, {"w": "pickle", "p": "v/n", "vi": "muối chua"}, {"w": "infuse", "p": "v", "vi": "ngâm chiết vị"}, {"w": "connoisseur", "p": "n", "vi": "người sành"}, {"w": "sommelier", "p": "n", "vi": "chuyên gia rượu vang"}, {"w": "gastronomy", "p": "n", "vi": "nghệ thuật ẩm thực"}, {"w": "chronological", "p": "adj", "vi": "theo thứ tự thời gian"}, {"w": "simultaneous", "p": "adj", "vi": "đồng thời"}, {"w": "simultaneously", "p": "adv", "vi": "đồng thời"}, {"w": "momentary", "p": "adj", "vi": "thoáng chốc"}, {"w": "perpetual", "p": "adj", "vi": "vĩnh viễn"}, {"w": "transient", "p": "adj", "vi": "nhất thời"}, {"w": "interim", "p": "adj/n", "vi": "tạm thời"}, {"w": "imminent", "p": "adj", "vi": "sắp xảy ra"}, {"w": "preceding", "p": "adj", "vi": "trước đó"}, {"w": "succeeding", "p": "adj", "vi": "tiếp theo"}, {"w": "consecutive", "p": "adj", "vi": "liên tiếp"}, {"w": "hitherto", "p": "adv", "vi": "cho đến nay"}, {"w": "henceforth", "p": "adv", "vi": "từ nay về sau"}, {"w": "timely", "p": "adj", "vi": "kịp thời"}, {"w": "belated", "p": "adj", "vi": "muộn màng"}, {"w": "centennial", "p": "n/adj", "vi": "kỷ niệm một trăm năm"}, {"w": "bygone", "p": "adj/n", "vi": "đã qua"}, {"w": "antiquity", "p": "n", "vi": "thời cổ đại (đặc biệt Hy Lạp–La Mã)"}, {"w": "epoch", "p": "n", "vi": "kỷ nguyên, giai đoạn lịch sử quan trọng"}, {"w": "meteorology", "p": "n", "vi": "khí tượng học"}, {"w": "meteorologist", "p": "n", "vi": "nhà khí tượng học"}, {"w": "precipitation", "p": "n", "vi": "giáng thủy"}]}, {"id": "W36-3", "title": "The Earthquake", "body": "On a Tuesday afternoon in March, Minh was at his desk in the newsroom when the floor began to move.\n\nAt first, it was gentle, like a train passing. Then it grew stronger. The desks shook. Books fell from the shelves. The lights swung from the ceiling. \"**Earthquake**!\" someone shouted. Everyone went under their desks, as they had practiced.\n\nIt lasted about a minute. To Minh, it felt like an hour. When it stopped, the office was silent. Then, slowly, people came out from under the desks.\n\n\"Is everyone okay?\" asked Yuko. Everyone was. A few things were broken. Nobody was hurt.\n\nMinh's hands were shaking. He called Hana immediately. She was at the hospital. \"I'm fine,\" she said. \"We felt it. Everyone is fine. Are you okay?\"\n\n\"I'm okay,\" said Minh. \"Just scared.\"\n\n\"Welcome to Japan,\" said Hana softly.\n\nWithin minutes, the news came in. The earthquake was strong, but its center was far out at sea. There was a **tsunami** warning for the coast. Big waves could hit the shore. Yuko sent Minh and Ben to the newsroom's TV screens to follow the reports.\n\nMinh watched the coast on the screen. He thought of Hana's family, in their small town by the sea. He called Hana again. \"Your parents?\"\n\n\"They've gone to the hills,\" said Hana. \"Everyone has. It's the rule. When the earthquake comes, you go up.\"\n\nThe tsunami was small: less than a meter. It did no real damage. Hana's family came home that evening. But Minh would never forget that hour.\n\nThat night, he wrote about it. Yuko wanted a column about how Japan prepares for disasters. Minh talked to an expert at the university, a scientist who studied natural disasters.\n\n\"Japan is an **archipelago**,\" the scientist said. \"Thousands of islands, sitting on the edge of four big pieces of the earth's surface. That's why we have so many earthquakes. And volcanoes: you can see the **crater** of Mount Fuji from Tokyo on a clear day. The last **eruption** was in 1707.\"\n\nHe talked about other disasters. A **landslide** after heavy rain, when a hillside falls down. An **avalanche** of snow in the mountains in winter. A **cyclone**, a big storm, which in this part of the world is called a typhoon.\n\nMinh thought of Vietnam. \"We have typhoons every year,\" he said. \"And floods. In the **delta** in the south, where the Mekong River meets the sea, the water comes up every year.\"\n\n\"The **delta**, the **estuary**, the **lagoons** along the coast,\" said the scientist. \"These are the most vulnerable places. Low land, near the sea. Climate change makes it worse.\"\n\nHe showed Minh a map of Japan's **terrain**: the **topography** of mountains, rivers and plains. There was a deep **gorge**, cut by a river over a million years. A narrow **ravine** in the mountains. A big river with many small **tributaries** flowing into it. A **basin** of flat land where Tokyo stood. A **wetland** near the coast, full of birds.\n\n\"Norway has **fjords**,\" he said. \"Long, narrow bays between mountains. Japan has none. But we have everything else.\"\n\nHe also talked about weather. \"Japan has every kind of weather,\" he said. \"**Sweltering** hot summers, **sultry** and humid. **Torrential** rain in June. **Frosty** winters in the north. **Balmy** springs. **Inclement** weather on the coast. Some parts are almost **arid**, with very little rain. But most of Japan is **temperate**: not too hot, not too cold.\"\n\nHe showed Minh an old **barometer** on his wall. \"My grandfather's. It measures air pressure. When the pressure falls quickly, a storm is coming. In the old days, fishermen used it to decide whether to go out.\"\n\nMinh's column was called \"Living on Shaking Ground.\" He wrote about the minute under his desk, about Hana's family running up the hill, about the scientist and his grandfather's barometer. He wrote: \"In Japan, people don't pretend disasters won't happen. They prepare. Maybe the rest of the world can learn something.\"\n\nGrace read it in England. She sent him a message: \"Glad you're alive. Good column. Don't do that again.\"\n\n\"I'll tell the earth,\" Minh wrote back.", "words": 684, "new": [{"w": "cyclone", "p": "n", "vi": "bão xoáy"}, {"w": "avalanche", "p": "n", "vi": "tuyết lở"}, {"w": "landslide", "p": "n", "vi": "sạt lở đất"}, {"w": "tsunami", "p": "n", "vi": "sóng thần"}, {"w": "earthquake", "p": "n", "vi": "động đất"}, {"w": "eruption", "p": "n", "vi": "sự phun trào"}, {"w": "sweltering", "p": "adj", "vi": "nóng ngột ngạt"}, {"w": "torrential", "p": "adj", "vi": "như trút nước"}, {"w": "inclement", "p": "adj", "vi": "khắc nghiệt"}, {"w": "balmy", "p": "adj", "vi": "ấm áp dễ chịu"}, {"w": "temperate", "p": "adj", "vi": "ôn hòa"}, {"w": "arid", "p": "adj", "vi": "khô cằn"}, {"w": "frosty", "p": "adj", "vi": "lạnh giá"}, {"w": "sultry", "p": "adj", "vi": "oi nồng"}, {"w": "barometer", "p": "n", "vi": "khí áp kế"}, {"w": "terrain", "p": "n", "vi": "địa hình"}, {"w": "topography", "p": "n", "vi": "địa hình học"}, {"w": "archipelago", "p": "n", "vi": "quần đảo"}, {"w": "estuary", "p": "n", "vi": "cửa sông"}, {"w": "delta", "p": "n", "vi": "châu thổ"}, {"w": "lagoon", "p": "n", "vi": "đầm phá"}, {"w": "fjord", "p": "n", "vi": "vịnh hẹp"}, {"w": "gorge", "p": "n", "vi": "hẻm núi"}, {"w": "ravine", "p": "n", "vi": "khe núi sâu"}, {"w": "crater", "p": "n", "vi": "miệng núi lửa"}, {"w": "tributary", "p": "n", "vi": "phụ lưu"}, {"w": "basin", "p": "n", "vi": "cái chậu"}, {"w": "wetland", "p": "n", "vi": "đất ngập nước"}]}, {"id": "W36-4", "title": "Borneo", "body": "In July, Minh got his biggest assignment yet. The newspaper wanted a story about the rainforests of Borneo, a huge island in Southeast Asia shared by Malaysia, Indonesia and Brunei. \"Go for two weeks,\" said Yuko. \"Find the story.\"\n\nThere was another surprise. Leo was coming too. He was nineteen now and studying to be a vet. His university had a summer program at a wildlife research station in Borneo. \"We'll be in the same place at the same time,\" he wrote to Minh. \"This is fate.\"\n\nThey met at the airport in Kota Kinabalu. Leo was sunburnt and excited. \"I've been here three days,\" he said. \"I've seen more animals than in my whole life.\"\n\nThe research station was deep **inland**, far from the **coastline**. To get there, they drove for six hours on a **rugged** road through **mountainous** and **hilly** land. Some areas were **lush** and green, full of trees and foliage. Other areas were **barren**: the forest had been cut down for palm oil. The land was empty and brown. \"The soil here was **fertile** once,\" said the driver. \"Now look.\"\n\nAt the station, a scientist called Dr. Lim welcomed them. She had studied the rainforest for twenty years. She took them up a tall tower above the trees. The view was **panoramic**: green forest in every direction, as far as they could see, with mist in the valleys. \"**Breathtaking**,\" said Minh.\n\n\"It is,\" said Dr. Lim. \"But it's disappearing. Borneo has lost half its forest in fifty years.\"\n\nShe explained the problems. When the trees are cut, the rain washes the soil away. This **erosion** fills the rivers with **sediment**: mud and sand. The rivers become brown and dirty. The fish die. \"Everything is connected,\" she said. \"The forest, the soil, the rivers, the sea. Even the **offshore** coral reefs suffer.\"\n\nLeo was most interested in the animals. Dr. Lim explained the different groups. \"In biology, we divide animals into groups. **Vertebrates** have a backbone: mammals, birds, fish, reptiles and **amphibians**, like frogs. **Invertebrates** have no backbone: insects, spiders, worms.\"\n\n\"And how do they eat?\" asked Leo, taking notes.\n\n\"A **carnivore** eats meat. A **herbivore** eats plants. An **omnivore** eats both, like us. Here, we have all three.\"\n\nShe showed them a **porcupine** in a cage at the station, with long sharp spines. It had been hurt by a car and was getting better. \"It's a **rodent**, like a big rat,\" she said. Leo was delighted.\n\n\"What about **primates**?\" asked Minh. \"Monkeys?\"\n\n\"You'll see,\" said Dr. Lim, smiling. \"Tomorrow.\"\n\nThat night, Minh and Leo sat outside under the stars. The forest was loud with insects and frogs.\n\n\"Can I tell you something?\" said Leo. \"Two years ago, I thought my life was over. My knee. No more football. Now look at me. I'm in Borneo, studying animals. If I hadn't hurt my knee, I'd never be here.\"\n\n\"Life is strange,\" said Minh.\n\n\"Life is great,\" said Leo.\n\nDr. Lim told them about a **marsupial** that lives in Australia, across the sea, and the **steppe** grasslands of Mongolia, and the African **savanna** with its lions and zebras, and the frozen **tundra** of the Arctic. \"Every **landmass** on earth has its own animals,\" she said. \"Borneo has some of the most special ones. And some of the most endangered.\"\n\nMinh fell asleep listening to the forest, thinking about the **shoreline** of his childhood river and the long, green island around him.", "words": 573, "new": [{"w": "tundra", "p": "n", "vi": "đài nguyên"}, {"w": "savanna", "p": "n", "vi": "thảo nguyên nhiệt đới"}, {"w": "steppe", "p": "n", "vi": "thảo nguyên khô"}, {"w": "sediment", "p": "n", "vi": "trầm tích"}, {"w": "erosion", "p": "n", "vi": "xói mòn"}, {"w": "landmass", "p": "n", "vi": "khối đất liền"}, {"w": "coastline", "p": "n", "vi": "đường bờ biển"}, {"w": "shoreline", "p": "n", "vi": "đường bờ nước"}, {"w": "inland", "p": "adv/adj", "vi": "trong đất liền"}, {"w": "offshore", "p": "adj/v", "vi": "chuyển sản xuất ra nước ngoài"}, {"w": "mountainous", "p": "adj", "vi": "nhiều núi"}, {"w": "hilly", "p": "adj", "vi": "nhiều đồi"}, {"w": "rugged", "p": "adj", "vi": "gồ ghề"}, {"w": "barren", "p": "adj", "vi": "cằn cỗi"}, {"w": "fertile", "p": "adj", "vi": "màu mỡ"}, {"w": "lush", "p": "adj/n", "vi": "tươi tốt"}, {"w": "panoramic", "p": "adj", "vi": "toàn cảnh"}, {"w": "breathtaking", "p": "adj", "vi": "ngoạn mục"}, {"w": "primate", "p": "n", "vi": "động vật linh trưởng"}, {"w": "rodent", "p": "n", "vi": "động vật gặm nhấm"}, {"w": "amphibian", "p": "n", "vi": "động vật lưỡng cư"}, {"w": "carnivore", "p": "n", "vi": "động vật ăn thịt"}, {"w": "herbivore", "p": "n", "vi": "động vật ăn cỏ"}, {"w": "omnivore", "p": "n", "vi": "động vật ăn tạp"}, {"w": "invertebrate", "p": "n", "vi": "động vật không xương sống"}, {"w": "vertebrate", "p": "n", "vi": "động vật có xương sống"}, {"w": "marsupial", "p": "n", "vi": "thú có túi"}, {"w": "porcupine", "p": "n", "vi": "nhím"}]}, {"id": "W36-5", "title": "The Orangutans", "body": "The next morning, Dr. Lim took Minh and Leo into the forest. They walked for two hours. It was hot and wet. Leeches climbed up their legs. Leo didn't care. He was too excited.\n\nThen Dr. Lim stopped and pointed up. High in the trees, there was a big orange shape. An **orangutan**. It was a mother with a baby on her back. She looked down at them with calm, intelligent eyes. Then she moved away slowly through the branches and disappeared into the thick green **foliage**.\n\nNobody said anything for a long time. \"That's the most beautiful thing I've ever seen,\" said Leo finally.\n\n\"Orangutans share ninety-seven percent of our DNA,\" said Dr. Lim. \"Like the **chimpanzee** in Africa. They're very close to us. They use tools. They teach their **offspring**. A baby stays with its mother for eight years.\"\n\n\"Why are they in danger?\" asked Minh.\n\n\"Because of us. Their forest is being cut. And because of **poachers**.\" Her face became hard. \"**Poaching** is a big problem. Poachers kill mothers and sell the babies as pets. Or they sell parts of animals for traditional medicine. It's illegal, but it happens.\"\n\nAt the research station, there was a center for orangutans rescued from **captivity**. Some had been kept as pets in small cages for years. They couldn't climb. They didn't know how to find food. \"We teach them to be wild again,\" said Dr. Lim. \"It takes years. Some never learn.\"\n\nLeo volunteered at the center for the rest of his time. He fed the young orangutans and helped clean their cages. Minh interviewed the workers and wrote everything down.\n\nThere were other animals at the center too, from all over Southeast Asia and beyond. A **sloth** that had been sold as a pet, very slow and gentle. A **lemur** from Madagascar, rescued from an illegal zoo. A **chameleon** that changed color when it was angry, and an **iguana** that sat in the sun all day. A small black **salamander** in a tank of water.\n\nDr. Lim showed them a video from her friend in Africa, where **hyenas** fought over food and a herd of **antelope** ran across the plains. A small, beautiful **gazelle** jumped high over the grass. In the Arctic, a fat **walrus** slept on the ice. In Florida, a gentle **manatee** ate sea grass. \"Every **extinction** is forever,\" said Dr. Lim. \"When a species is gone, it's gone. We can't bring it back.\"\n\nIn the forest, Leo learned about smaller creatures too. He found an **armadillo**... no, wait, armadillos live in America, not Borneo. Dr. Lim laughed when Leo said it. \"That was a pangolin,\" she said. \"Similar, but different. Also endangered.\"\n\nLeo was embarrassed. But he learned.\n\nThey saw a huge nest of **termites**, taller than Leo. They found a **cocoon** hanging from a leaf, where a **larva** was turning into a butterfly. In a river, they saw a **stingray**, flat and gray, moving slowly over the sand. In the sea near the coast, Dr. Lim explained, whales ate tiny **plankton**, the smallest living things in the ocean.\n\nLeo also learned to be careful. Some snakes in the forest were **venomous**. Their **venom** could kill a person in an hour. \"Watch where you put your hands,\" said Dr. Lim. \"Always.\"\n\nOn the last day, Leo saw something special. Two orangutans in the trees, a male and a female, sitting close together. \"It's **mating** season,\" said Dr. Lim. \"If they have a baby, it will be born in nine months. Another orangutan for the forest.\"\n\n\"That's hope,\" said Leo.\n\n\"That's hope,\" Dr. Lim agreed.\n\nThe **fauna** of Borneo, she said, was one of the richest on earth. But it needed help.\n\nOn the plane home, Leo was quiet. Then he said, \"I've decided. When I finish my studies, I'm going to work with wildlife. Here, or in Africa, or wherever they need me.\"\n\nMinh looked at him. The boy who had cried over his knee was gone. A young man was sitting next to him.\n\n\"Your dad will be proud,\" said Minh.\n\n\"Dad will be worried,\" said Leo. \"Mum will cry. Grandma will say I'm too thin. And Mia will want to paint orangutans.\"\n\n\"That's family,\" said Minh.\n\nHis article, \"The Last Forest,\" was published in Tokyo and in the Riverford Gazette at the same time. It had Leo's photos of the orangutans. Many readers wrote in. Some gave money to the rescue center. A school in Riverford adopted a baby orangutan and named her Rose.\n\nGrandma Rose was delighted. \"An orangutan named after me,\" she said. \"Finally, some respect.\"", "words": 764, "new": [{"w": "armadillo", "p": "n", "vi": "thú tatu"}, {"w": "chameleon", "p": "n", "vi": "tắc kè hoa"}, {"w": "iguana", "p": "n", "vi": "kỳ nhông"}, {"w": "salamander", "p": "n", "vi": "kỳ giông"}, {"w": "lemur", "p": "n", "vi": "vượn cáo"}, {"w": "sloth", "p": "n", "vi": "con lười"}, {"w": "orangutan", "p": "n", "vi": "đười ươi"}, {"w": "chimpanzee", "p": "n", "vi": "tinh tinh"}, {"w": "hyena", "p": "n", "vi": "linh cẩu"}, {"w": "antelope", "p": "n", "vi": "linh dương"}, {"w": "gazelle", "p": "n", "vi": "linh dương nhỏ"}, {"w": "walrus", "p": "n", "vi": "hải mã"}, {"w": "manatee", "p": "n", "vi": "lợn biển"}, {"w": "stingray", "p": "n", "vi": "cá đuối gai"}, {"w": "plankton", "p": "n", "vi": "sinh vật phù du"}, {"w": "termite", "p": "n", "vi": "mối"}, {"w": "larva", "p": "n", "vi": "ấu trùng"}, {"w": "cocoon", "p": "n/v", "vi": "cái kén"}, {"w": "fauna", "p": "n", "vi": "hệ động vật"}, {"w": "poacher", "p": "n", "vi": "kẻ săn trộm"}, {"w": "poaching", "p": "n", "vi": "săn bắn trộm"}, {"w": "captivity", "p": "n", "vi": "tình trạng nuôi nhốt"}, {"w": "extinction", "p": "n", "vi": "sự tuyệt chủng; sự tuyệt chủng (loài hoàn toàn biến mất khỏi Trái Đất)"}, {"w": "mating", "p": "n", "vi": "giao phối"}, {"w": "offspring", "p": "n", "vi": "con cái"}, {"w": "venom", "p": "n", "vi": "nọc độc"}, {"w": "venomous", "p": "adj", "vi": "có nọc độc"}, {"w": "foliage", "p": "n", "vi": "tán lá"}]}, {"id": "W37-1", "title": "The Village That Fed Itself", "body": "In September, Yuko sent Minh to a small village in the mountains north of Tokyo. \"There's a project there,\" she said. \"Young people from the city are going back to the countryside to farm. Find out why.\"\n\nThe village was surrounded by rice fields, forests and small rivers. In Japanese, this kind of landscape is called satoyama: the place where the village meets the mountain. For a thousand years, people lived here in balance with nature.\n\nA young woman called Mika met Minh at the station. She was thirty and had worked in a bank in Tokyo for eight years. Then she quit. \"I was tired of numbers,\" she said. \"I wanted to grow real things.\"\n\nShe showed him her farm. It was small, but every part of it was used. She practiced traditional **cultivation**: no chemicals, no machines except a small tractor. \"We **cultivate** rice, vegetables and fruit,\" she said. \"**Agriculture** here is very old. But we use new knowledge too.\"\n\nShe explained how plants work. \"Leaves use sunlight to make food. That's **photosynthesis**. Every green plant does it. Without it, there would be no life on earth.\" She showed him the small rice plants in water. \"Every seed must **germinate** first: it opens and sends out a root.\"\n\nNext to the rice fields, there were fruit trees. Mika kept bees. \"The bees **pollinate** the flowers,\" she said. \"They carry **pollen** from one flower to another. Without **pollination**, there's no fruit. No apples, no peaches, no plums. One in three things we eat depends on bees.\"\n\nThe forest around the village was a mix of trees. Some were **evergreen**, like the pine and the cedar, green all year. Others were **deciduous**: they lost their leaves in autumn. Some plants in her garden were **perennial**: they came back every year without being planted again. \"Lazy plants,\" said Mika. \"My favourite kind.\"\n\nShe talked about the **vegetation** of the area, the **flora** that grew wild in the forest. There were plants for medicine, plants for food, plants for tea. \"My grandmother knew every plant,\" she said. \"I'm learning from old books and old people.\"\n\nThen she talked about problems. \"Japanese **agricultural** land is dying,\" she said. \"Old farmers retire. Young people leave. Fields are empty. And where farming continues, there's **contamination** from chemicals. Fertilizers and pesticides **contaminate** the rivers. The soil suffers **degradation**: it becomes poor and thin. Water **depletion** is a problem too: farms **deplete** the underground water.\"\n\n\"Is it the same everywhere?\" asked Minh.\n\n\"Worse in some places. In parts of Africa and Asia, there's **desertification**: good land turns into desert. **Acid** rain from factories damages forests. Everything is connected. One ecosystem affects another.\"\n\nMika had a different approach. Everything on her farm was **biodegradable**. Food waste became **compost** for the fields. \"Nothing leaves the farm as rubbish,\" she said. \"It all goes back to the soil.\"\n\nShe also worked with a university professor who studied **ecology** and **horticulture**. They measured the **biodiversity** on her farm: the number of different species of plants, insects and birds. \"Three times more than on a normal farm,\" she said proudly.\n\nMinh asked about climate change. \"Farms emit a lot of gas,\" said Mika. \"Cows, machines, chemicals. But good farms can **offset** that. Trees and healthy soil take carbon from the air. We can **mitigate** the damage. Not stop it. But make it smaller.\"\n\nThat night, Minh stayed in an old farmhouse in the village. He ate rice from the field, vegetables from the garden, honey from the bees. Everything had been grown within a hundred meters.\n\n\"Is it hard?\" he asked Mika at dinner. \"This life?\"\n\n\"Very hard,\" she said. \"I earn a quarter of what I earned in the bank. I work every day. My back hurts. My hands are rough.\" She smiled. \"And I've never been happier.\"\n\nMinh wrote his story on the train back to Tokyo. He called it \"Back to the Land.\" He thought about his grandfather in Vietnam, who had farmed rice with a buffalo. Maybe the future, he thought, looked a little like the past.", "words": 679, "new": [{"w": "vegetation", "p": "n", "vi": "thảm thực vật"}, {"w": "flora", "p": "n", "vi": "hệ thực vật"}, {"w": "perennial", "p": "adj/n", "vi": "cây lâu năm"}, {"w": "evergreen", "p": "adj/n", "vi": "thường xanh"}, {"w": "deciduous", "p": "adj", "vi": "rụng lá theo mùa"}, {"w": "photosynthesis", "p": "n", "vi": "quang hợp (quá trình cây xanh chuyển ánh sáng thành năng lượng hoá học)"}, {"w": "pollen", "p": "n", "vi": "phấn hoa"}, {"w": "pollinate", "p": "v", "vi": "thụ phấn"}, {"w": "pollination", "p": "n", "vi": "sự thụ phấn"}, {"w": "germinate", "p": "v", "vi": "nảy mầm"}, {"w": "cultivate", "p": "v", "vi": "trồng trọt"}, {"w": "cultivation", "p": "n", "vi": "sự canh tác"}, {"w": "horticulture", "p": "n", "vi": "nghề làm vườn"}, {"w": "agriculture", "p": "n", "vi": "nông nghiệp"}, {"w": "agricultural", "p": "adj", "vi": "thuộc nông nghiệp"}, {"w": "biodiversity", "p": "n", "vi": "đa dạng sinh học"}, {"w": "ecology", "p": "n", "vi": "sinh thái học"}, {"w": "contamination", "p": "n", "vi": "sự ô nhiễm"}, {"w": "contaminate", "p": "v", "vi": "làm ô nhiễm"}, {"w": "degradation", "p": "n", "vi": "sự suy thoái"}, {"w": "depletion", "p": "n", "vi": "sự cạn kiệt"}, {"w": "deplete", "p": "v", "vi": "làm cạn kiệt"}, {"w": "desertification", "p": "n", "vi": "sa mạc hóa"}, {"w": "acid", "p": "n/adj", "vi": "axit"}, {"w": "biodegradable", "p": "adj", "vi": "phân hủy sinh học được"}, {"w": "compost", "p": "n/v", "vi": "phân hữu cơ"}, {"w": "offset", "p": "v/n", "vi": "bù đắp (khí thải)"}, {"w": "mitigate", "p": "v", "vi": "giảm nhẹ, giảm bớt"}]}, {"id": "W37-2", "title": "The Climate Conference", "body": "In October, there was an international climate conference in Tokyo. Thousands of scientists, politicians and journalists came from all over the world. Minh was one of the reporters.\n\nThe conference was huge and confusing. There were hundreds of talks, meetings and protests. Minh decided to focus on three questions: How bad is the problem? What can we do? Is there hope?\n\nThe first talk was frightening. A scientist from Germany showed the data. \"Some changes are now **irreversible**,\" she said. \"We can't undo them. Ice that melts in the Arctic won't come back in our lifetime. If temperatures rise more than two degrees, the results could be **catastrophic**: floods, droughts, hunger.\"\n\nShe talked about the causes. \"**Overpopulation** is part of it. More people use more resources. But the bigger problem is the **exploitation** of nature. Rich countries **exploit** forests, oceans and land. They produce **hazardous** waste and every kind of **pollutant**.\"\n\nThe second talk was more hopeful. An engineer from Iceland talked about **renewables**. \"Iceland gets almost all its energy from **geothermal** power: heat from inside the earth. And from **hydroelectric** power: energy from rivers and dams. It's possible to live without coal and oil.\"\n\nA young woman from Kenya talked about plastic. \"Most plastic is not **recyclable**,\" she said. \"We must make less. Use less. In my country, plastic bags are illegal.\"\n\n\"What's the most important thing we can do?\" a journalist asked.\n\n\"**Mitigation** and adaptation,\" said the engineer. \"Mitigation means reducing the problem: less carbon, less pollution. Adaptation means preparing for the changes that will come anyway. We need both.\"\n\nIn the evening, the conference had a special event at the Tokyo planetarium. A famous professor of **astrophysics** gave a talk about the **cosmos**. \"Look up,\" he said, as the dome above them filled with stars. \"Our planet is a tiny blue dot in a huge universe. There's no other place we know of where we can live.\"\n\nHe showed them a **nebula**, a giant cloud of gas where new stars are born, glowing red and blue. He showed them the **constellations**: groups of stars with old names, like the hunter Orion. He showed a video of a solar **eclipse**, when the moon passes in front of the sun and the sky goes dark in the middle of the day.\n\n\"Light from the sun comes in a **spectrum** of colors,\" he said. \"Red, orange, yellow, green, blue, violet. We see only a small part. There's much more we can't see.\"\n\nThen he talked about the smallest things in the universe. \"Everything is made of atoms. And atoms are made of smaller **particles**: **protons** and **neutrons** in the middle, **electrons** around them. And even smaller things, studied in **quantum** physics, which nobody fully understands.\"\n\nHe talked about **isotopes**, different forms of the same element, and **radioactive** materials that give off energy. \"This energy can light cities,\" he said. \"Or destroy them. Science is a tool. It depends on us how we use it.\"\n\nAt the end of the talk, he talked about life. \"Life on earth began with a single **organism**, very small, billions of years ago. Every living thing came from it. A chemical **catalyst** in the early oceans made the first **synthesis** of living material possible. We still don't know exactly how.\"\n\nMinh walked out of the planetarium into the cold Tokyo night. Above the city lights, he could see only a few stars. But he knew they were there.\n\nHis article combined the conference and the planetarium. \"We are small,\" he wrote. \"But we're not powerless. The same science that shows us the danger also shows us the solutions. The question is whether we'll use them in time.\"\n\nYuko read it. \"It's good,\" she said. \"A little poetic.\"\n\n\"Grace would say sentimental,\" said Minh.\n\n\"Grace is right,\" said Yuko. \"Publish it anyway.\"", "words": 636, "new": [{"w": "mitigation", "p": "n", "vi": "sự giảm thiểu"}, {"w": "overpopulation", "p": "n", "vi": "dân số quá đông"}, {"w": "exploitation", "p": "n", "vi": "sự bóc lột"}, {"w": "exploit", "p": "v/n", "vi": "bóc lột, khai thác"}, {"w": "hazardous", "p": "adj", "vi": "nguy hiểm"}, {"w": "pollutant", "p": "n", "vi": "chất gây ô nhiễm"}, {"w": "recyclable", "p": "adj", "vi": "có thể tái chế"}, {"w": "renewables", "p": "n", "vi": "năng lượng tái tạo"}, {"w": "geothermal", "p": "adj", "vi": "thuộc địa nhiệt"}, {"w": "hydroelectric", "p": "adj", "vi": "thuộc thủy điện"}, {"w": "irreversible", "p": "adj", "vi": "không thể đảo ngược"}, {"w": "catastrophic", "p": "adj", "vi": "thảm khốc"}, {"w": "astrophysics", "p": "n", "vi": "vật lý thiên văn"}, {"w": "cosmos", "p": "n", "vi": "vũ trụ"}, {"w": "nebula", "p": "n", "vi": "tinh vân"}, {"w": "constellation", "p": "n", "vi": "chòm sao"}, {"w": "eclipse", "p": "n", "vi": "hiện tượng che khuất thiên thể"}, {"w": "spectrum", "p": "n", "vi": "phổ, dải"}, {"w": "particle", "p": "n", "vi": "hạt"}, {"w": "electron", "p": "n", "vi": "điện tử"}, {"w": "proton", "p": "n", "vi": "proton"}, {"w": "neutron", "p": "n", "vi": "nơtron"}, {"w": "quantum", "p": "n", "vi": "lượng tử"}, {"w": "isotope", "p": "n", "vi": "đồng vị"}, {"w": "radioactive", "p": "adj", "vi": "có tính phóng xạ"}, {"w": "catalyst", "p": "n", "vi": "chất xúc tác"}, {"w": "synthesis", "p": "n", "vi": "sự tổng hợp"}, {"w": "organism", "p": "n", "vi": "sinh vật (bất kỳ dạng sống nào, từ vi khuẩn đến động vật phức tạp)"}]}, {"id": "W37-3", "title": "The Laboratory", "body": "In November, Minh wrote a series about scientists in Tokyo. The first was about a biology laboratory at a big university, where a young Vietnamese scientist, Dr. Nguyen Thi Thu, was leading a research team.\n\nDr. Thu was thirty-five, from Hanoi, and had studied in America and Japan. She worked on **bacteria**: tiny living things, so small you need a microscope to see them. \"A single **bacterium** is too small to see,\" she said. \"But there are more **microorganisms** in your body than human cells.\"\n\nHer team studied how bacteria change. \"Bacteria **evolve** very fast,\" she said. \"A new generation every twenty minutes. That's why they become resistant to antibiotics. It's **evolution**, happening in front of our eyes.\"\n\nShe showed Minh the lab. There were fridges full of samples, machines that read DNA, and computers everywhere. \"Every living thing has a **genome**: its complete set of genes,\" she said. \"In humans, the genes are on twenty-three pairs of **chromosomes**. When something changes in the DNA, it's called a **mutation**. Most mutations do nothing. Some are harmful. A few are useful.\"\n\nShe explained how science worked. \"We start with a theory. But a **theoretical** idea isn't enough. We need **empirical** evidence: data from the real world. So we design an **experimental** test.\"\n\nShe showed him an experiment. \"Here, we change one **variable**: the temperature. Everything else stays the same. Then we watch what happens to the bacteria. We **quantify** everything: we measure it in numbers.\"\n\n\"How do you know your results are correct?\" asked Minh.\n\n\"We **verify** them. We **replicate** the experiment many times, in different labs. If other scientists get the same result, we can **validate** it. And we **calibrate** our machines every week, so the measurements are accurate.\"\n\nShe showed him a **specimen** in a glass tube: bacteria from a hospital in Vietnam. \"These bacteria are resistant to almost every antibiotic,\" she said. \"Very dangerous. Our job is to understand why.\"\n\nShe also used computers. \"We make a **simulation**: a computer model of how the bacteria will change in the future. It helps us predict new **phenomena**.\"\n\nThen she told him about her team's big news. \"We think we've made a **breakthrough**,\" she said, her eyes bright. \"We've found a new way to attack resistant bacteria. A new kind of medicine. It's only a **prototype**, a first version. It will take ten years of testing. But it could save millions of lives.\"\n\n\"That's an amazing **innovation**,\" said Minh.\n\n\"Science is slow,\" said Dr. Thu. \"Most **innovative** ideas fail. This one might fail too. But that's the job: try, fail, try again.\"\n\nAfter the interview, they had coffee together. They spoke Vietnamese. It felt strange and good to speak his own language with a scientist in Tokyo.\n\n\"Do you miss Vietnam?\" Minh asked.\n\n\"Every day,\" said Dr. Thu. \"But Hanoi has changed so much. When I left, it was a big town. Now it's a **metropolis**. Eight million people. The **metropolitan** area is huge. It's not a single **municipality** anymore; it's a **conurbation**, many towns joined together.\"\n\n\"Tokyo is the same,\" said Minh. \"Thirty-seven million people in the whole area.\"\n\n\"The biggest city in the world,\" said Dr. Thu. \"Sometimes I think cities are like bacteria. They grow very fast, and they change everything around them.\"\n\nMinh laughed. Then he thought about it. It was a good idea for his next article.", "words": 562, "new": [{"w": "microorganism", "p": "n", "vi": "vi sinh vật"}, {"w": "bacteria", "p": "n", "vi": "vi khuẩn"}, {"w": "bacterium", "p": "n", "vi": "vi khuẩn"}, {"w": "chromosome", "p": "n", "vi": "nhiễm sắc thể"}, {"w": "genome", "p": "n", "vi": "bộ gen"}, {"w": "mutation", "p": "n", "vi": "đột biến (thay đổi vĩnh viễn trong chuỗi DNA)"}, {"w": "evolution", "p": "n", "vi": "tiến hoá (quá trình loài thay đổi qua nhiều thế hệ bằng chọn lọc tự nhiên)"}, {"w": "evolve", "p": "v", "vi": "tiến hoá, phát triển"}, {"w": "specimen", "p": "n/adj", "vi": "mẫu vật (ví dụ cá thể dùng cho nghiên cứu hoặc trưng bày)"}, {"w": "empirical", "p": "adj", "vi": "thực nghiệm (dựa trên quan sát/kinh nghiệm, không chỉ lý thuyết)"}, {"w": "theoretical", "p": "adj", "vi": "thuộc lý thuyết"}, {"w": "variable", "p": "adj/n", "vi": "biến số (yếu tố có thể thay đổi, kiểm soát, đo lường trong thí nghiệm)"}, {"w": "experimental", "p": "adj", "vi": "thuộc thực nghiệm"}, {"w": "phenomena", "p": "n", "vi": "các hiện tượng"}, {"w": "verify", "p": "v", "vi": "xác minh"}, {"w": "validate", "p": "v", "vi": "xác nhận tính đúng"}, {"w": "replicate", "p": "v", "vi": "tái lập, lặp lại (lặp lại thí nghiệm để kiểm chứng kết quả)"}, {"w": "calibrate", "p": "v", "vi": "hiệu chuẩn"}, {"w": "quantify", "p": "v", "vi": "định lượng"}, {"w": "simulation", "p": "n", "vi": "mô phỏng"}, {"w": "prototype", "p": "n", "vi": "nguyên mẫu"}, {"w": "breakthrough", "p": "n/adj", "vi": "bước đột phá; bước đột phá (phát hiện hoặc phát triển quan trọng vượt qua rào cản lớn)"}, {"w": "innovation", "p": "n", "vi": "sự đổi mới"}, {"w": "innovative", "p": "adj", "vi": "đổi mới, sáng tạo"}, {"w": "metropolis", "p": "n", "vi": "đại đô thị"}, {"w": "metropolitan", "p": "adj/n", "vi": "thuộc đô thị lớn"}, {"w": "municipality", "p": "n", "vi": "đơn vị hành chính đô thị"}, {"w": "conurbation", "p": "n", "vi": "chuỗi đô thị"}]}, {"id": "W37-4", "title": "Cities", "body": "Minh's next article was about cities. He started in Tokyo, the biggest city in the world. Then, with Yuko's permission, he traveled to Manila in the Philippines, one of the most crowded.\n\nTokyo was clean, organized and enormous. Its **urbanization** had happened very fast after the war. Today, the **sprawl** of the city reached sixty kilometers in every direction. The center was **bustling** with people day and night. Some areas were so **densely** **populated** that apartments were the size of a parking space.\n\nMinh walked along a wide **boulevard** lined with trees, and through a covered shopping **arcade** where old shops sold tea, rice crackers and kimonos. He walked down the main **thoroughfare** of Shinjuku, where three million people pass through the train station every day. Huge buildings rose on every side: towers of glass and steel, a modern **edifice** for every company.\n\nBut Tokyo had problems too. Some old neighborhoods were changing. Expensive cafés and new apartments replaced old shops. Old people who had lived there for decades had to leave because rents went up. \"It's called **gentrification**,\" said a city planner Minh interviewed. \"New money comes in. Old people go out. It's happening in every big city in the world.\"\n\nThe city used **zoning** to control what could be built where: houses here, factories there, shops in the middle. \"Without zoning, cities become chaos,\" said the planner.\n\nThen Minh flew to Manila. It was a different world. The city was **cosmopolitan** and full of energy, with people from everywhere. But it was also **overcrowded**. Next to modern towers, there were **slums**: areas where very poor people lived in small houses made of wood, metal and plastic. One huge **shantytown** was home to fifty thousand people, next to a river.\n\nMinh visited with a local journalist, Carla. \"People come from the countryside for work,\" she said. \"There aren't enough homes. So they build their own. Without water, without electricity at first. Slowly, they become neighborhoods.\"\n\nThe traffic in Manila was terrible. Every evening, the main roads were in complete **gridlock**: nothing moved for an hour. Drivers took a **detour** through small streets. A police **diversion** sent cars around an accident. A **convoy** of government cars with flashing lights pushed through.\n\nCarla showed Minh how drivers **navigate** the city. \"No one uses **navigation** apps,\" she said. \"They don't work here. You need instinct.\" Every **maneuver** was dangerous. Two motorbikes almost **collided** in front of them. A jeepney, a colorful local bus, had a **collision** with a taxi. Nobody was hurt. Everyone shouted.\n\n\"Is it always like this?\" asked Minh.\n\n\"Every day,\" said Carla, laughing. \"You get used to it.\"\n\nIn the evening, they walked along the **promenade** by Manila Bay, watching the sunset. Families sat on the sea wall. Children played. Old men fished. \"This is the best part of the city,\" said Carla. \"Everyone comes here. Rich, poor, everyone.\"\n\nMinh thought about Hanoi, about Riverford, about all the places he had lived.
