where. Minh washed every **dish** in the kitchen, and then he washed his face in the small **washbasin** in the bathroom. He was tired, but happy. It was the best night since he came to England.", "words": 509, "new": [{"w": "tap", "p": "v/n", "vi": "vòi nước"}, {"w": "faucet", "p": "n", "vi": "vòi nước (Mỹ)"}, {"w": "washbasin", "p": "n", "vi": "bồn rửa mặt"}, {"w": "heater", "p": "n", "vi": "máy sưởi"}, {"w": "fan", "p": "n/v", "vi": "quạt; người hâm mộ"}, {"w": "radiator", "p": "n", "vi": "lò sưởi"}, {"w": "fireplace", "p": "n", "vi": "lò sưởi"}, {"w": "vase", "p": "n", "vi": "lọ hoa"}, {"w": "poster", "p": "n", "vi": "áp phích"}, {"w": "frame", "p": "n/v", "vi": "khung"}, {"w": "alarm", "p": "n/v", "vi": "báo thức; chuông báo"}, {"w": "socket", "p": "n", "vi": "ổ cắm"}, {"w": "plug", "p": "n/v", "vi": "phích cắm"}, {"w": "switch", "p": "n/v", "vi": "công tắc"}, {"w": "bulb", "p": "n", "vi": "bóng đèn"}, {"w": "candle", "p": "n", "vi": "cây nến"}, {"w": "furniture", "p": "n", "vi": "đồ nội thất"}, {"w": "mug", "p": "n/v", "vi": "cái cốc"}, {"w": "saucer", "p": "n", "vi": "đĩa lót tách"}, {"w": "dish", "p": "n/v", "vi": "đĩa; món ăn"}, {"w": "dishes", "p": "n", "vi": "bát đĩa"}, {"w": "tray", "p": "n", "vi": "khay"}, {"w": "jug", "p": "n", "vi": "bình rót"}, {"w": "pot", "p": "n/v", "vi": "nồi"}, {"w": "pan", "p": "n/v/adj", "vi": "cái chảo"}, {"w": "lid", "p": "n", "vi": "nắp"}, {"w": "jar", "p": "n", "vi": "lọ, hũ"}, {"w": "tin", "p": "n", "vi": "hộp thiếc; thiếc"}]}, {"id": "W10-2", "title": "Minh Cooks Dinner", "body": "After the storm, there was water in the basement. On Sunday morning, everybody helped to clean it. Tom carried a **bucket** of dirty water up the stairs. Anna used a **mop** on the floor. Mia used a **broom** to push the water out of the door. Leo cleaned the walls with a big **sponge**. Later, when everything was dry, Grandma Rose used the **vacuum** to clean the carpets.\n\nThere was a lot of **rubbish** in the basement: old boxes, wet paper and broken things. \"Put the garbage in the black bags,\" Tom said.\n\n\"In England, we call it rubbish, and it goes in the **dustbin**,\" said Grandma Rose.\n\n\"In America, it's trash, and it goes in the trash can,\" said Tom.\n\n\"Just put it in the bin,\" said Anna. \"I don't care what you call it.\"\n\nIn the evening, Minh had a surprise for them. \"Tonight I will cook dinner,\" he said. \"Vietnamese food.\"\n\nHe made spring rolls and a big bowl of beef soup. The kitchen smelled wonderful. He gave everyone a pair of **chopsticks**. Leo held them like two pencils. Mia dropped her noodles three times. Tom gave up and used a fork. But Grandma Rose was very good. \"I learned in Hong Kong in 1970,\" she said proudly.\n\nThe soup was hot and Leo's nose started to run. Anna gave him a **tissue**. Minh put a paper **napkin** next to every bowl. After dinner, Grandma made tea in her old **teapot**, and Minh boiled more water in the **kettle**.\n\n\"This was the best dinner this year,\" Tom said. Minh felt very proud.\n\nAfter dinner, Mia had a school project. She had to make a model house. She needed a lot of things. \"Where are the **scissors**?\" she shouted. \"And the **glue**? And the **tape**?\"\n\nAnna found them in a drawer. In the same drawer, there was a lot of other stuff: some **string**, a long piece of **rope**, a small box with a **needle** and **thread**, and a **pin** with a flower on it.\n\n\"I need a light for the house,\" Mia said. Leo found a small **torch** in the cupboard.\n\n\"A **flashlight**,\" said Tom.\n\n\"A torch!\" said Grandma Rose.\n\nLeo tried it, but it did not work. \"We need a new **battery**,\" he said. Minh found one in his backpack.\n\nThen Mia wanted a real fire in her model fireplace. \"No!\" said Anna. \"No **matches**, and no **lighter**. You will burn the house down.\"\n\n\"OK, OK,\" Mia said. She used a small red light instead.\n\nAt eleven o'clock, the model was finished. It had tiny chairs, a tiny table and a tiny family. There was even a tiny person with black hair, cooking in the kitchen.\n\n\"Who is that?\" Minh asked.\n\nMia smiled. \"That's you. Every house needs a good cook.\"", "words": 464, "new": [{"w": "kettle", "p": "n", "vi": "ấm đun nước"}, {"w": "teapot", "p": "n", "vi": "ấm trà"}, {"w": "chopsticks", "p": "n", "vi": "đũa"}, {"w": "napkin", "p": "n", "vi": "khăn ăn"}, {"w": "tissue", "p": "n", "vi": "khăn giấy"}, {"w": "sponge", "p": "n", "vi": "miếng bọt biển"}, {"w": "bucket", "p": "n", "vi": "cái xô"}, {"w": "mop", "p": "n/v", "vi": "cây lau nhà; lau"}, {"w": "broom", "p": "n", "vi": "cái chổi"}, {"w": "vacuum", "p": "v/n", "vi": "hút bụi"}, {"w": "rubbish", "p": "n/v/adj/interj", "vi": "rác"}, {"w": "dustbin", "p": "n", "vi": "thùng rác (Anh)"}, {"w": "scissors", "p": "n", "vi": "cái kéo"}, {"w": "glue", "p": "n/v", "vi": "keo dán"}, {"w": "tape", "p": "n/v", "vi": "băng dính"}, {"w": "string", "p": "n", "vi": "sợi dây"}, {"w": "rope", "p": "n", "vi": "dây thừng"}, {"w": "needle", "p": "n", "vi": "cây kim"}, {"w": "thread", "p": "n", "vi": "sợi chỉ"}, {"w": "pin", "p": "n/v", "vi": "ghim; mã PIN"}, {"w": "battery", "p": "n/adj", "vi": "pin"}, {"w": "torch", "p": "n", "vi": "đèn pin (Anh)"}, {"w": "flashlight", "p": "n", "vi": "đèn pin"}, {"w": "matches", "p": "n", "vi": "diêm"}, {"w": "lighter", "p": "n", "vi": "bật lửa"}]}, {"id": "W10-3", "title": "A Parcel from Home", "body": "One morning, the doorbell rang. It was the postman with a big **parcel**. \"It's for you, Minh,\" Anna said. \"From Vietnam!\"\n\n\"In America, we say package,\" said Tom.\n\nMinh opened it on the kitchen table. His mother sent him many things. There was a packet of green tea, a plastic bag of dried mango, and a metal box of Vietnamese coffee. There was also a little wooden box. Minh opened it. It was made of dark wood, and inside there was a photo of his family.\n\nAt the bottom, there was an **envelope** with a Vietnamese **stamp** on it. Inside, his mother wrote: \"Eat well. Keep warm. Write in your **diary** every day, like your father did when he was a student.\" There was also a small **calendar** with photos of Hanoi, and a new **notebook** for his diary.\n\nMinh's mother also sent things for the family. For Grandma Rose, a basket with Vietnamese sweets. For Anna, a bottle of **perfume**. For Mia, a **lipstick** and some **makeup**. For Leo, a football shirt. For Tom, a big container of fish sauce. Tom smelled it and his face changed. \"Wow,\" he said. \"That's... strong.\"\n\nMia was very happy with her gift. She ran to the bathroom to try the lipstick. When she came back, Grandma Rose looked at her and said, \"Very pretty. But you're fifteen. A little less, please.\"\n\nThen Minh found a small bag at the bottom of the box. Inside, there was **shampoo** and **conditioner**, a **razor**, a **hairbrush**, and a **deodorant**. Minh laughed. \"My mother thinks England has no shops!\"\n\n\"Mothers are the same everywhere,\" Anna said.\n\nIn the afternoon, it was cleaning day. Every Saturday, everybody helped to tidy the house. Grandma Rose gave everyone a job, like a teacher.\n\nMinh had to **sweep** the kitchen floor. Then he had to **wipe** the table and **dust** the shelves in the living room. Leo had to **scrub** the bathroom. \"This is the worst job,\" he said. Mia had to wash the dishes, **rinse** them in clean water and put them away. Tom had to **iron** the shirts. He was very slow. Anna said, \"Tom, you **iron** like a man who is afraid of the shirts.\"\n\nGrandma Rose did the most important job. She sat in her armchair and used a soft cloth to **polish** the old silver spoons. \"This is a job for an expert,\" she said with a smile.\n\nAt the end, they had to **hang** the wet clothes in the garden. Mia's **hairdryer** was on the table, and she wanted to dry her clothes with it. \"No,\" said Anna. \"The sun is free.\"\n\nThat evening, Minh sat in his room and opened the new notebook. He began to write in his diary. \"Today a piece of Vietnam came to England,\" he wrote. \"Everybody liked it, except Tom and the fish sauce.\"", "words": 476, "new": [{"w": "shampoo", "p": "n/v", "vi": "dầu gội"}, {"w": "conditioner", "p": "n", "vi": "dầu xả"}, {"w": "razor", "p": "n/v", "vi": "dao cạo"}, {"w": "hairbrush", "p": "n", "vi": "lược chải tóc"}, {"w": "hairdryer", "p": "n", "vi": "máy sấy tóc"}, {"w": "perfume", "p": "n", "vi": "nước hoa"}, {"w": "deodorant", "p": "n", "vi": "lăn khử mùi"}, {"w": "makeup", "p": "n", "vi": "đồ trang điểm"}, {"w": "lipstick", "p": "n", "vi": "son môi"}, {"w": "diary", "p": "n", "vi": "nhật ký"}, {"w": "calendar", "p": "n", "vi": "lịch"}, {"w": "notebook", "p": "n", "vi": "quyển vở"}, {"w": "envelope", "p": "n", "vi": "phong bì"}, {"w": "stamp", "p": "n/v", "vi": "tem"}, {"w": "parcel", "p": "n", "vi": "bưu kiện"}, {"w": "sweep", "p": "v/n", "vi": "quét"}, {"w": "dust", "p": "n/v", "vi": "bụi; lau bụi"}, {"w": "iron", "p": "n/v/adj", "vi": "sắt; bàn là"}, {"w": "polish", "p": "v/n/adj", "vi": "đánh bóng"}, {"w": "wipe", "p": "v", "vi": "lau"}, {"w": "scrub", "p": "v", "vi": "cọ rửa"}, {"w": "rinse", "p": "v", "vi": "tráng, xả nước"}, {"w": "hang", "p": "v/n", "vi": "treo"}]}, {"id": "W11-1", "title": "The Market", "body": "On a cold Saturday in December, Grandma Rose took Minh to the farmers' market in the town square. \"Mia's birthday is tomorrow,\" she said. \"We are going to make her a birthday breakfast. And you are my helper.\"\n\nThe market was full of people and colors. Minh had never seen so many kinds of fruit in one place. There were fruits he knew from Vietnam, like a big brown **coconut**, a green **lime** and a yellow **melon**. But there were also fruits he did not know.\n\n\"What is this?\" he asked, holding a small brown fruit with hair on it.\n\n\"That's a **kiwi**,\" Grandma said. \"Brown and ugly outside, green and sweet inside. Like some people I know.\"\n\nThere were purple **plums**, and a big box of every kind of **berry**: red **raspberries**, dark blue **blueberries** and black ones. Minh tried a blueberry. It was **sweet**. He tried a raspberry. It was a little **sour**. Grandma bought two boxes of each.\n\nThen they went to the vegetables. Grandma checked everything carefully. She bought a **cabbage**, a **lettuce** and a **cucumber** for a salad, some **mushrooms**, a bag of **spinach**, a green **broccoli** and a white **cauliflower**. She smelled a long, green **celery** and put it in her basket. \"For soup,\" she said.\n\nNear the end of the market, there was a big orange **pumpkin** on a table. \"In America, they make pumpkin pie,\" Grandma said. \"Tom loves it. I think it tastes like a sweet potato that is confused.\"\n\nMinh laughed. He found an **avocado** and some black **olives**. \"In Vietnam, we make avocado into a sweet drink,\" he said. Grandma looked at him like he was crazy.\n\nThere was also a stall with **herbs** and **spices**. It smelled wonderful. Minh found something he knew: **garlic**. \"We use a lot of garlic in Vietnam,\" he said. He bought some fresh herbs too, because they smelled like home.\n\nNext to the herbs, there was a small food stall. A woman was selling hot **curry** with rice, and next to her, a man was selling Chinese **dumplings** and fried **tofu**. Minh bought some dumplings. They were hot and good. \"Not as good as in Hanoi,\" he said, \"but almost.\"\n\nOn the way home, they passed a bakery. In the window, there were **muffins**, colorful **cupcakes** with cream on top and a pink **donut** with a hole in the middle. \"One cupcake for the birthday girl,\" Grandma said, \"and one donut for the helper.\"\n\nThe next morning, Minh and Grandma got up very early. The kitchen was quiet and dark. They made a big birthday breakfast. Grandma made a cheese **omelet** for Tom and Anna. Minh made a stack of **pancakes**, and Grandma made **waffles** in an old waffle machine. They put the berries on top, with cream and a little sugar.\n\nAt eight o'clock, Mia came downstairs. Her hair was a mess and she was still in her pajamas. She saw the table and stopped.\n\n\"Happy birthday!\" everybody shouted.\n\nMia looked at the pancakes and the waffles and the berries and the candle on the cupcake. Then she looked at Minh and Grandma. \"You did all this?\" she said. \"For me?\"\n\n\"Minh did the pancakes,\" Grandma said. \"He cut his finger only once.\"\n\nMia laughed and hugged them both. She ate three pancakes and two waffles. Leo ate everything else. \"This is the best birthday breakfast ever,\" Mia said. \"Minh, you can live here forever.\"", "words": 573, "new": [{"w": "coconut", "p": "n", "vi": "quả dừa"}, {"w": "lime", "p": "n/v", "vi": "chanh xanh"}, {"w": "plum", "p": "n", "vi": "quả mận"}, {"w": "melon", "p": "n", "vi": "dưa"}, {"w": "kiwi", "p": "n", "vi": "quả kiwi"}, {"w": "berry", "p": "n/adj", "vi": "quả mọng"}, {"w": "raspberry", "p": "n", "vi": "quả mâm xôi"}, {"w": "blueberry", "p": "n", "vi": "quả việt quất"}, {"w": "avocado", "p": "n", "vi": "quả bơ"}, {"w": "cabbage", "p": "n", "vi": "bắp cải"}, {"w": "lettuce", "p": "n", "vi": "rau xà lách"}, {"w": "cucumber", "p": "n", "vi": "dưa chuột"}, {"w": "garlic", "p": "n", "vi": "tỏi"}, {"w": "mushroom", "p": "n/adj/v", "vi": "nấm"}, {"w": "pumpkin", "p": "n", "vi": "bí ngô"}, {"w": "spinach", "p": "n", "vi": "rau chân vịt"}, {"w": "broccoli", "p": "n", "vi": "bông cải xanh"}, {"w": "cauliflower", "p": "n", "vi": "súp lơ trắng"}, {"w": "celery", "p": "n", "vi": "cần tây"}, {"w": "olive", "p": "n", "vi": "quả ô liu"}, {"w": "herb", "p": "n", "vi": "thảo mộc"}, {"w": "spice", "p": "n/v", "vi": "gia vị"}, {"w": "curry", "p": "n", "vi": "món cà ri"}, {"w": "dumpling", "p": "n", "vi": "bánh bao, sủi cảo"}, {"w": "tofu", "p": "n", "vi": "đậu phụ"}, {"w": "omelet", "p": "n", "vi": "trứng tráng"}, {"w": "pancake", "p": "n", "vi": "bánh kếp"}, {"w": "waffle", "p": "n", "vi": "bánh quế"}, {"w": "muffin", "p": "n", "vi": "bánh muffin"}, {"w": "cupcake", "p": "n", "vi": "bánh cupcake"}, {"w": "donut", "p": "n", "vi": "bánh vòng"}, {"w": "sweet", "p": "adj/n/interj", "vi": "ngọt"}, {"w": "sour", "p": "adj", "vi": "chua"}]}, {"id": "W11-2", "title": "The Cooking Lesson", "body": "After Mia's birthday, the Parker family had a new idea. \"Minh,\" Anna said, \"can you teach us to cook a real Vietnamese meal?\"\n\n\"Of course!\" said Minh. He was happy. Finally, he could do something for them.\n\nOn Sunday afternoon, everyone came to the kitchen. Minh wrote the **recipe** on a piece of paper: pho, Vietnamese beef noodle soup. \"First, we make the soup,\" he said. \"This takes a long time.\"\n\nHe showed them how to **roast** the onions and ginger over the fire on the stove until they were black. Mia was surprised. \"You **burn** them on purpose?\" \"Yes,\" said Minh. \"It gives the soup a deep **flavor**.\"\n\nThen he put the beef bones in a big pot of water. \"Now we **boil** it,\" he said. \"Then we wait.\" He **added** spices: star anise, a stick of cinnamon and some salt. Soon the whole house smelled wonderful. Grandma Rose came in from the garden. \"What is that? It smells like a holiday,\" she said.\n\nWhile the soup cooked, Minh gave everyone a job. Leo had to **chop** the green onions. Mia had to **peel** the ginger. Tom had to cut the beef into thin **slices**. Anna had to **mix** the sauce. Grandma had to **stir** the soup slowly with a big spoon and taste it.\n\nTom wanted to help more. \"In America, we **grill** everything,\" he said. \"Can we put the beef on the barbecue?\" \"No,\" said Minh. \"In pho, the hot soup cooks the beef.\"\n\nLeo wanted to **fry** something. Minh let him fry some small spring rolls. Mia wanted to **bake** a cake, but Minh said, \"Not today. Today is soup day.\"\n\nAfter four hours, the soup was ready. Minh put rice noodles in each bowl, then the raw beef, then he **poured** the hot soup over it. The beef changed color in the **heat**. On the table, there were plates of **fresh** herbs, lime and chili.\n\n\"Try it,\" said Minh.\n\nEverybody took a **sip** of the soup. Nobody said anything. Then Tom said, \"Wow.\"\n\n\"Is it good?\" Minh asked.\n\n\"It's not good,\" said Tom. \"It's amazing. It's the **tastiest** soup I have ever had.\"\n\nGrandma Rose tried it carefully. \"It's a little **salty**,\" she said. Then she added lime. \"Now it's perfect.\"\n\nLeo put a lot of chili in his bowl. His face went red. \"It's very **spicy**!\" he shouted, and drank a whole glass of water. Mia laughed so much that she almost fell off her chair.\n\nAnna tried a piece of the ginger. \"Oh, that's **bitter**,\" she said. \"Don't eat it alone,\" Minh laughed. \"It's for the **taste** of the soup.\"\n\nAfter dinner, Tom opened a **beer**, and Anna had a glass of red **wine**. Grandma drank **mineral** water. Mia made a strawberry **smoothie**, and Leo made a chocolate **milkshake** and drank it with a **straw**, very loudly. Minh made hot **cocoa** for everyone who wanted it.\n\nThe ice cream in the freezer started to **melt** because Leo left the door open. Nobody cared.\n\n\"Minh,\" Anna said, \"you have to write all your recipes in a book. You can be a chef.\"\n\n\"Maybe,\" said Minh. \"But my grandmother is the real chef. I only know one soup.\"\n\n\"Then teach us another one next week,\" said Tom. And he took a second **loaf** of bread to eat with the rest of the soup, which was not Vietnamese at all, but nobody said anything.", "words": 568, "new": [{"w": "salty", "p": "adj", "vi": "mặn"}, {"w": "spicy", "p": "adj", "vi": "cay"}, {"w": "bitter", "p": "adj/n", "vi": "đắng"}, {"w": "fresh", "p": "adj", "vi": "tươi"}, {"w": "tasty", "p": "adj", "vi": "ngon"}, {"w": "taste", "p": "n/v", "vi": "vị"}, {"w": "flavor", "p": "n", "vi": "hương vị"}, {"w": "recipe", "p": "n", "vi": "công thức nấu ăn"}, {"w": "slice", "p": "n/v", "vi": "lát, miếng"}, {"w": "loaf", "p": "n", "vi": "ổ bánh mì"}, {"w": "beer", "p": "n", "vi": "bia"}, {"w": "wine", "p": "n", "vi": "rượu vang"}, {"w": "mineral", "p": "n/adj", "vi": "khoáng chất"}, {"w": "smoothie", "p": "n", "vi": "sinh tố"}, {"w": "milkshake", "p": "n", "vi": "sữa lắc"}, {"w": "cocoa", "p": "n", "vi": "ca cao"}, {"w": "straw", "p": "n", "vi": "ống hút"}, {"w": "sip", "p": "v/n", "vi": "nhấp, uống từng ngụm"}, {"w": "pour", "p": "v", "vi": "rót"}, {"w": "bake", "p": "v/n", "vi": "nướng (lò)"}, {"w": "boil", "p": "v", "vi": "luộc, đun sôi"}, {"w": "fry", "p": "v", "vi": "rán, chiên"}, {"w": "grill", "p": "v/n", "vi": "nướng vỉ"}, {"w": "roast", "p": "v/n/adj", "vi": "quay, nướng"}, {"w": "mix", "p": "v/n", "vi": "trộn"}, {"w": "stir", "p": "v", "vi": "khuấy"}, {"w": "chop", "p": "v", "vi": "thái, chặt"}, {"w": "peel", "p": "v/n", "vi": "gọt vỏ"}, {"w": "add", "p": "v/n", "vi": "thêm"}, {"w": "heat", "p": "n/v", "vi": "nhiệt"}, {"w": "melt", "p": "v/n", "vi": "tan chảy"}, {"w": "burn", "p": "v/n", "vi": "cháy; đốt"}]}, {"id": "W11-3", "title": "The Birthday Dinner", "body": "On the last day of December, it was Tom's fiftieth birthday. Anna made a **reservation** at the oldest restaurant in Riverford, The Old Bell. It was more than a **century** old. \"It has been here for over a hundred years,\" Anna said. \"Grandma Rose had her wedding dinner there.\"\n\nThe family arrived at seven o'clock. The restaurant was beautiful, with candles, old pictures and white tablecloths. A **waitress** came to the door. \"Good evening. Do you have a **booking**?\"\n\n\"Yes,\" Anna said. \"Parker, six people, seven o'clock.\"\n\nThe waitress **checked** her book. She looked again. Her face changed. \"I'm very sorry,\" she said. \"I have Parker for seven o'clock... next Friday.\"\n\nEverybody was quiet for a moment. Anna's face went red. \"Oh no. I'm so sorry, Tom.\"\n\nBut Tom laughed. \"It's fine! Let's try somewhere else.\"\n\nIt was New Year's Eve, and every restaurant was full. They walked and walked. Leo said, \"We can get a **takeaway**, or order a delivery pizza.\" Mia said, \"Or we can eat at the college **canteen**.\" \"It's closed,\" said Minh. \"And the **cafeteria** food is terrible.\"\n\nSuddenly, Tom stopped in front of a small, bright place with red seats and a long counter. It was an American **diner**. \"Look!\" he said. \"Burgers, milkshakes, pancakes! It's like home!\"\n\nThey went in immediately. It was warm and noisy. The waitress gave them the menu. There was no buffet and no fancy food, but there was everything Tom loved. \"Of **course**, I want the biggest burger,\" he said.\n\nThey **shared** plates of fries and onion rings. The waitress **served** a huge chocolate cake with fifty candles. Everybody sang. The food had a wonderful **smell** of grilled meat and sweet sauce. It was not fine **dining**, but it was a **feast**.\n\n\"Fifty years,\" said Grandma Rose, looking at her son. \"Five **decades**. I remember the day you were born. It was a long period of my life, and the best.\"\n\n\"What about the future, Dad?\" Mia asked. \"What do you want for the next fifty?\"\n\nTom thought. \"A **barbecue** every summer, a weekly picnic by the river on Sundays, and this family. That's all. And maybe, once or twice a year, a better restaurant booking.\"\n\nEverybody laughed, even Anna.\n\nAt the end, Tom paid the bill and asked for the **receipt**. He left a big **tip** on the table. \"In America, we always tip,\" he said. \"Fifteen or twenty percent.\" \"In England, ten percent is fine,\" said Grandma Rose. \"In Vietnam, we usually don't tip at all,\" Minh added.\n\n\"**Lately**, I've been thinking,\" Tom said on the walk home. \"This is a daily life I love. Not the big things. These small moments.\"\n\nAt midnight, the town counted down and fireworks went up over the castle. Minh thought about his family in Vietnam. **Recently**, he called them every week, but tonight he called them at midday their time... no, he did the maths: it was already morning there. They were sleeping.\n\nSo the next morning, Minh got up at **dawn**. He walked to the bridge alone to watch the **sunrise** over the river. The sky turned pink and gold. He sent a photo to his family. His mother replied immediately: \"Happy New Year! Your father says you look thin. Eat more.\"\n\nMinh smiled. Some things never change. Like the monthly money worries, the yearly birthday cake and Mum's annual message about eating more. Later that day, he walked by the river again at **dusk** and watched the sunset. He wanted to remember this day forever.", "words": 587, "new": [{"w": "smell", "p": "v/n", "vi": "ngửi; mùi"}, {"w": "serve", "p": "v/n", "vi": "phục vụ"}, {"w": "share", "p": "v/n", "vi": "chia sẻ"}, {"w": "waitress", "p": "n", "vi": "nữ bồi bàn"}, {"w": "course", "p": "n/v", "vi": "khóa học; (of course) tất nhiên"}, {"w": "tip", "p": "v/n", "vi": "tiền boa; mẹo"}, {"w": "check", "p": "v/n/interj", "vi": "kiểm tra"}, {"w": "receipt", "p": "n", "vi": "hoá đơn"}, {"w": "reservation", "p": "n", "vi": "sự đặt chỗ"}, {"w": "booking", "p": "n", "vi": "sự đặt chỗ"}, {"w": "canteen", "p": "n", "vi": "căng tin"}, {"w": "cafeteria", "p": "n", "vi": "nhà ăn tự phục vụ"}, {"w": "takeaway", "p": "n/adj", "vi": "đồ ăn mang đi"}, {"w": "barbecue", "p": "n/v", "vi": "tiệc nướng ngoài trời"}, {"w": "feast", "p": "n/v", "vi": "bữa tiệc lớn"}, {"w": "dining", "p": "n", "vi": "việc ăn uống"}, {"w": "diner", "p": "n", "vi": "quán ăn bình dân"}, {"w": "century", "p": "n", "vi": "thế kỷ"}, {"w": "decade", "p": "n", "vi": "thập kỷ"}, {"w": "dawn", "p": "n/v", "vi": "bình minh"}, {"w": "sunrise", "p": "n", "vi": "bình minh"}, {"w": "dusk", "p": "n", "vi": "chạng vạng"}, {"w": "lately", "p": "adv", "vi": "gần đây"}, {"w": "recently", "p": "adv", "vi": "gần đây"}]}, {"id": "W11-4", "title": "Snow Day", "body": "In the middle of January, the weather **forecast** on TV said: \"A big **storm** is coming. Tonight there will be strong winds, **thunder** and **lightning**, then **freezing** temperatures. Tomorrow, the roads will be **icy**. Please stay at home if you can.\"\n\nMinh had never seen a real **snowfall**. Vietnam's **climate** is warm and **humid**. In his town, there was a lot of **rainfall**, but never snow. \"Will it really snow?\" he asked Leo.\n\n\"Maybe,\" said Leo. \"The forecast is always wrong. Nowadays, English winters are just gray and wet. **Dull**, dull, dull.\"\n\nThat night, it was very **stormy**. The wind was loud and the windows shook. **During** the night, Minh woke up because of the thunder. **Meanwhile**, Grandma Rose slept like a baby. \"I have lived through eighty winters,\" she said the next morning. \"A little storm is nothing.\"\n\nIn the morning, Minh opened the curtains and stopped. Everything was white. The garden, the cars, the roofs, the trees. The whole world was covered in snow.\n\n\"It's snowing!\" he shouted. \"It's really snowing!\"\n\nMia and Leo ran to the window. School was closed. College was closed. It was a snow day.\n\nOutside, it was very cold. The temperature was minus five **degrees**. There was **frost** on the windows, white and beautiful like a drawing. The air was clear and quiet. Minh put on all his clothes: two sweaters, a coat, a hat, a scarf and Grandma's gloves. He went into the garden. The snow was soft under his feet. He held some in his hand. It was cold, wet and perfect.\n\n\"Let's make a **snowman**!\" said Mia.\n\nThey worked all morning. Leo made the body, Mia made the head, and Minh found two stones for the eyes and a carrot for the nose. Grandma Rose gave them an old hat and scarf. By lunchtime, the snowman was finished. It looked a lot like Tom. Tom was not happy about this.\n\nIn the afternoon, the weather changed again. First, there was a cold wind. Then there was **hail**, small balls of ice falling from the sky. They ran inside until it stopped. Then there was **fog**. It was so **foggy** that they could not see the end of the garden. Later, it was only **misty**, with a light grey **mist** over the river.\n\n\"English weather can change four times in one day,\" said Anna. \"That is the only thing that never changes.\"\n\n**Eventually**, near the end of the day, the sun came out for a few minutes. There was a light **breeze**, and for a moment, there was a **rainbow** over the snowy hills. Minh took a photo and sent it to his family. \"First snow in my life,\" he wrote.\n\nHis sister Lan replied immediately: \"Not fair! I want snow too!\"\n\nThe snow stayed for a **fortnight**. Every weekday, it was difficult to go to college. The buses had a delay of an hour or more, and the timetable meant nothing. Minh missed one deadline for an essay, but his teacher gave him extra time. \"Snow is a good excuse,\" she said. \"This schedule can wait.\"\n\nSince that day, Minh has loved snow. While others complain about the cold, he smiles. Till the end of that winter, he looked out every morning, hoping for more. Finally, in March, the last snow melted.\n\n\"Snow is **timeless**,\" said Grandma Rose, looking at the old snowman, now small and sad in the sun. \"It comes, it goes, and every time, it feels like the first time.\"", "words": 583, "new": [{"w": "eventually", "p": "adv", "vi": "cuối cùng"}, {"w": "meanwhile", "p": "adv", "vi": "trong khi đó"}, {"w": "during", "p": "prep", "vi": "trong suốt"}, {"w": "fortnight", "p": "n", "vi": "hai tuần"}, {"w": "timeless", "p": "adj", "vi": "vượt thời gian"}, {"w": "storm", "p": "n/v", "vi": "cơn bão"}, {"w": "stormy", "p": "adj", "vi": "có bão"}, {"w": "icy", "p": "adj", "vi": "đóng băng, lạnh giá"}, {"w": "fog", "p": "n", "vi": "sương mù"}, {"w": "foggy", "p": "adj", "vi": "có sương mù"}, {"w": "thunder", "p": "n/v", "vi": "sấm"}, {"w": "lightning", "p": "n", "vi": "tia chớp"}, {"w": "rainbow", "p": "n", "vi": "cầu vồng"}, {"w": "degree", "p": "n", "vi": "bằng cấp"}, {"w": "forecast", "p": "n/v", "vi": "dự báo"}, {"w": "freezing", "p": "adj", "vi": "lạnh cóng"}, {"w": "frost", "p": "n", "vi": "sương giá"}, {"w": "hail", "p": "n/v", "vi": "mưa đá"}, {"w": "breeze", "p": "n", "vi": "gió nhẹ"}, {"w": "mist", "p": "n", "vi": "sương mỏng"}, {"w": "misty", "p": "adj", "vi": "mờ sương"}, {"w": "humid", "p": "adj", "vi": "ẩm ướt, nồm"}, {"w": "rainfall", "p": "n", "vi": "lượng mưa"}, {"w": "snowfall", "p": "n", "vi": "lượng tuyết rơi"}, {"w": "snowman", "p": "n", "vi": "người tuyết"}, {"w": "climate", "p": "n/adj", "vi": "khí hậu"}, {"w": "dull", "p": "adj", "vi": "âm u, buồn tẻ"}]}, {"id": "W12-1", "title": "The Road to Wales", "body": "In April, the Parkers took Minh on a holiday to Wales. Tom's old friends, Gareth and Megan Jones, had a farm there, in the **west** of Britain. \"Wales is the most beautiful place in the world,\" Tom said. \"Don't tell Grandma Rose I said that. She thinks Riverford is.\"\n\nThey left early in the morning. It was a **chilly** day, but by midday the weather was **mild** and sunny. They drove through green **countryside**: fields, small villages and old stone walls. Minh looked out of the window the whole time. \"England is so green,\" he said. \"In Vietnam, the green is darker.\"\n\n\"That's because it rains here all the time,\" said Leo.\n\nIn the afternoon, they stopped on the **coast**. The ocean was gray-blue and wild. They walked along a narrow **path** on top of a high **cliff**. Far below, the waves hit the rocks. Minh looked out at the horizon, where the sea met the sky. \"If you go **south** from here, you get to France and Spain,\" Tom said. \"If you go **north**, you get to Scotland. If you go **east**, you get back home.\"\n\nThey went down to the **shore** and walked on the sand. Mia found a small **cave** in the rocks. It was dark and wet inside. \"Maybe pirates lived here,\" she said.\n\nThen they drove into the mountains. The road went up and up, then down into a deep **valley**. At the bottom of the valley, there was a small **stream** and a beautiful **waterfall**. The water fell from a high rock into a clear **pond**. Minh stood under the trees and listened. It was so quiet. \"This is real **nature**,\" he said.\n\n\"In Vietnam, do you have places like this?\" asked Mia.\n\n\"Yes,\" said Minh. \"We have mountains in the north, and a big **jungle** in some places. But it's very hot there. Not like this. Here, everything is cool and soft.\"\n\n\"I want to go to a hot place,\" said Leo. \"A **desert**. Or a **volcano**! Somewhere **boiling** hot.\"\n\n\"You can go to Iceland,\" said Anna. \"It has volcanoes and ice.\"\n\nFinally, at six o'clock, they arrived at the farm. It was a white house in the middle of green **land**, with **woods** behind it. The **ground** was wet, and there was **mud** everywhere. Mia's new shoes were brown in two minutes. \"Welcome to Wales!\" said Gareth, a big man with a red face and a bigger smile.\n\nMegan, his wife, came out of the house with a little dog. Behind them, a black and white **puppy** ran in circles, and a small gray **kitten** sat on the window and watched everybody.\n\n\"The puppy is called Storm,\" Megan said. \"The kitten is called Shadow. They are both very bad.\"\n\nMia immediately sat on the wet ground and played with the puppy. She did not care about the mud anymore.\n\nThat night, Minh stood outside and looked up. There were no city lights here. The sky was full of stars. He could see the whole **planet** turning slowly under him, out into space. Gareth came and stood next to him.\n\n\"This **soil** is good,\" Gareth said, looking at the dark fields. \"My family has farmed this land for two hundred years. The environment has changed a lot. There is less wildlife now. But the **natural** world is still here, if you look.\"\n\nMinh nodded. In the wild dark, an owl called. He thought this was going to be a special week.", "words": 578, "new": [{"w": "mild", "p": "adj/n", "vi": "nhẹ, ôn hòa"}, {"w": "chilly", "p": "adj", "vi": "se lạnh"}, {"w": "boiling", "p": "adj", "vi": "nóng như thiêu"}, {"w": "coast", "p": "n/v", "vi": "bờ biển"}, {"w": "shore", "p": "n", "vi": "bờ"}, {"w": "cliff", "p": "n", "vi": "vách đá"}, {"w": "valley", "p": "n", "vi": "thung lũng"}, {"w": "desert", "p": "n/v", "vi": "sa mạc"}, {"w": "jungle", "p": "n", "vi": "rừng rậm"}, {"w": "woods", "p": "n", "vi": "khu rừng nhỏ"}, {"w": "stream", "p": "n/v", "vi": "dòng suối"}, {"w": "waterfall", "p": "n", "vi": "thác nước"}, {"w": "pond", "p": "n", "vi": "ao"}, {"w": "cave", "p": "n/v", "vi": "hang động"}, {"w": "volcano", "p": "n", "vi": "núi lửa"}, {"w": "land", "p": "n/v", "vi": "đất liền"}, {"w": "ground", "p": "n/v/adj", "vi": "mặt đất"}, {"w": "soil", "p": "n/v", "vi": "đất"}, {"w": "mud", "p": "n", "vi": "bùn"}, {"w": "path", "p": "n", "vi": "con đường nhỏ"}, {"w": "nature", "p": "n", "vi": "thiên nhiên"}, {"w": "natural", "p": "adj/n/adv", "vi": "tự nhiên"}, {"w": "countryside", "p": "n", "vi": "nông thôn"}, {"w": "north", "p": "n/adj/adv", "vi": "phía bắc"}, {"w": "south", "p": "n/adj/adv", "vi": "phía nam"}, {"w": "east", "p": "n/adj/adv", "vi": "phía đông"}, {"w": "west", "p": "n/adj/adv", "vi": "phía tây"}, {"w": "planet", "p": "n", "vi": "hành tinh"}, {"w": "puppy", "p": "n", "vi": "chó con"}, {"w": "kitten", "p": "n", "vi": "mèo con"}]}, {"id": "W12-2", "title": "Farm Animals", "body": "On their first morning at the farm, Gareth woke everyone up at six. \"Farm work starts early,\" he said. \"Come and meet the animals.\"\n\nFirst, they went to see the **hens**. There were about thirty of them, walking around and eating. \"Every morning, we collect the eggs,\" Gareth said. Mia found nine eggs. Leo found two and dropped one.\n\nNext to the hens, there was a big white **goose** with an angry face. \"Be careful,\" Gareth said. \"**Geese** are terrible. They bite.\" The goose ran at Leo, and Leo ran away, screaming. Everybody laughed.\n\nThen they visited the **goats**. A small brown goat climbed on Minh's back and tried to eat his hair. In the next field, there was an old **donkey** called Mr. Brown. He was very slow and very friendly. Gareth gave Minh a carrot for him.\n\n\"Do you have a **camel**?\" Mia joked.\n\n\"No camels,\" Gareth said. \"But in the woods, we have a lot of wild animals. **Deer**, a **fox**, rabbits and **squirrels**. At night, sometimes a **rat** comes into the barn, and there are **bats** in the roof.\"\n\n\"Are there **wolves**?\" asked Leo.\n\n\"Not anymore. The last wolf in Britain died hundreds of years ago.\"\n\nIn the big tree near the house, there was a black **crow**, watching them. On the roof, two gray **pigeons** sat together. On the farm pond, there was a pair of white **swans**. \"Swans stay together their whole life,\" Megan said. Mia thought it was very romantic. Leo thought it was boring.\n\nLater, Megan showed them her strange collection. She had a green **parrot** in the kitchen, called Captain. Captain could say \"Hello,\" \"Good morning\" and \"Where is my tea?\" He also had a bad habit: he laughed exactly like Gareth. In the garden, there was an old **tortoise** called Speedy, who was seventy years old and very, very slow. \"He's older than me,\" Megan said.\n\n\"What's the difference between a tortoise and a **turtle**?\" asked Minh.\n\n\"A tortoise lives on land,\" said Megan. \"A turtle lives in the water, mostly.\"\n\nMinh told them about the animals in Vietnam: the small **lizards** on the walls at night, the **mosquitoes** in summer, and the big **cockroaches** in the kitchen. Mia made a face. \"I hate cockroaches,\" she said.\n\nIn the afternoon, it rained. The children stayed in the house. Gareth's old books were full of animals. There was a book about a **dinosaur** that lived in Wales millions of years ago. There was a picture of an **octopus** with eight long arms. And there was a picture of an **eagle**, a big bird with huge **wings**, flying over the mountains.\n\nAfter the rain, the garden was full of small creatures. On the path, there was a **snail** with its **shell** on its back. In the soil, there were long pink **worms**. On a flower, there was a red **ladybird** with black spots.\n\n\"In America, we call it a **ladybug**,\" Tom said from the window.\n\n\"Here we say ladybird,\" said Megan. \"Same little **beetle**, different name.\"\n\nLeo found a big black beetle and put it on Mia's arm. She screamed. The puppy, Storm, ran around in circles and waved his **tail**. Everybody was wet, dirty and happy.\n\nThat night, Mia said, \"I want to live on a farm.\"\n\n\"You hate getting up early,\" said Leo.\n\n\"I'll get up late,\" said Mia. \"The hens can wait.\"", "words": 563, "new": [{"w": "goat", "p": "n", "vi": "con dê"}, {"w": "donkey", "p": "n", "vi": "con lừa"}, {"w": "camel", "p": "n", "vi": "con lạc đà"}, {"w": "deer", "p": "n", "vi": "con hươu"}, {"w": "wolf", "p": "n", "vi": "chó sói"}, {"w": "fox", "p": "n", "vi": "con cáo"}, {"w": "squirrel", "p": "n", "vi": "con sóc"}, {"w": "rat", "p": "n", "vi": "con chuột cống"}, {"w": "bat", "p": "n/v", "vi": "con dơi; cây gậy"}, {"w": "hen", "p": "n", "vi": "gà mái"}, {"w": "goose", "p": "n", "vi": "con ngỗng"}, {"w": "geese", "p": "n", "vi": "những con ngỗng"}, {"w": "parrot", "p": "n/v", "vi": "con vẹt"}, {"w": "eagle", "p": "n", "vi": "đại bàng"}, {"w": "pigeon", "p": "n", "vi": "chim bồ câu"}, {"w": "swan", "p": "n", "vi": "thiên nga"}, {"w": "crow", "p": "n", "vi": "con quạ"}, {"w": "tortoise", "p": "n", "vi": "con rùa cạn"}, {"w": "turtle", "p": "n", "vi": "con rùa"}, {"w": "lizard", "p": "n", "vi": "con thằn lằn"}, {"w": "dinosaur", "p": "n", "vi": "khủng long"}, {"w": "octopus", "p": "n", "vi": "bạch tuộc"}, {"w": "shell", "p": "n/v/adj", "vi": "vỏ sò, vỏ"}, {"w": "mosquito", "p": "n", "vi": "con muỗi"}, {"w": "cockroach", "p": "n", "vi": "con gián"}, {"w": "worm", "p": "n", "vi": "con giun"}, {"w": "snail", "p": "n", "vi": "con ốc sên"}, {"w": "ladybird", "p": "n", "vi": "con bọ rùa (Anh)"}, {"w": "ladybug", "p": "n", "vi": "con bọ rùa"}, {"w": "beetle", "p": "n", "vi": "con bọ cánh cứng"}, {"w": "wing", "p": "n", "vi": "cánh"}, {"w": "tail", "p": "n", "vi": "đuôi"}]}, {"id": "W12-3", "title": "A Long Night in the Barn", "body": "On the third night, Gareth came into the kitchen at eleven o'clock. \"One of the cows is going to have a baby,\" he said. \"Who wants to help?\"\n\nEverybody went to the barn in their coats and boots. It was dark and warm inside, and it smelled of animals. The mother cow was lying in the straw. Gareth was calm. \"Nature knows what to do,\" he said. \"We only watch.\"\n\nThey waited for two hours. Mia fell asleep on a pile of hay. Leo played with a little **chick** that came out from under a hen. Minh asked Gareth questions about the farm.\n\n\"Is that a **bull**?\" he asked, looking at a big black animal in the next room. It had two long **horns** on its head.\n\n\"Yes. That's Bruno. He's the father,\" Gareth said. \"Don't go near him. He's not **tame**. In the old days, farmers used an **ox** to pull the plow. Now we use a tractor.\"\n\nAt one o'clock in the morning, the little **calf** was born. It was wet and brown, with long legs. After ten minutes, it tried to stand. It fell down. It tried again. On the third try, it stood up. Everybody clapped very quietly. Mia woke up and cried, \"I missed it!\" Then she saw the calf and said, \"Oh, it's beautiful.\"\n\n\"You can give it a name,\" said Gareth.\n\nMia thought. \"Minh,\" she said. \"Because it's new here, like Minh.\"\n\nMinh did not know if he should be happy about that. Everybody laughed.\n\nThe next day, they walked around the farm with Megan. The dog Storm came too. He saw a cat and started to **bark**. \"He barks at everything,\" Megan said. \"But he never **bites**.\"\n\nMegan showed them a bird's **nest** in a **bush**. Inside, there were three tiny blue eggs. On the ground, there was a black **feather**. \"From the crow,\" Megan said. \"Look at his **beak**, how strong it is.\" In a tree, they saw the crow, holding something in its **claws**.\n\nThey also saw a fox's footprints in the mud. \"Every **paw** has four toes,\" Megan said. \"The fox comes at night to **hunt** our hens. He wants a chicken dinner.\"\n\n\"Do you keep the hens in a **cage**?\" Minh asked.\n\n\"Only at night, in the henhouse. In the day, they are free.\"\n\nNear the woods, there was a field with three **ponies**. The smallest one had soft brown **fur**. Mia tried to ride it, but it did not want to move. \"This is a lazy pony,\" she said.\n\nThen they went to the fields. Gareth showed them his **crops**: **wheat**, potatoes and corn. \"Wheat makes bread,\" he said. \"Every loaf of bread in the shop started in a field like this.\"\n\nAt the edge of the field, there was an old tree. Its **trunk** was thick and gray, and its **roots** went deep into the soil. Its **branches** were full of new spring leaves. Minh touched the **bark** of the tree. It was rough and old. \"This tree is three hundred years old,\" said Gareth.\n\nIn Megan's garden, there were flowers everywhere: red and yellow **tulips**, white **lilies**, small **daisies** in the grass. \"In summer, I grow **sunflowers**,\" she said. \"They are taller than Tom.\"\n\nOn the way back, Leo stood too close to a bee. It **stung** him on the arm. \"Ow! Why do bees **sting**?\" he cried.\n\n\"Because you were in its house,\" said Megan. She put some cream on it. \"Next time, say hello first.\"\n\nThat evening, they watched a film about animals from other countries: a big black **gorilla** in Africa, a sleepy **koala** in Australia, a **polar** bear on the ice and a **seal** swimming in the cold sea. \"So many animals,\" said Mia. \"But my favorite is still baby Minh.\"\n\n\"The cow, I hope,\" said Minh.", "words": 636, "new": [{"w": "fur", "p": "n/v", "vi": "bộ lông"}, {"w": "feather", "p": "n", "vi": "lông vũ"}, {"w": "beak", "p": "n", "vi": "mỏ chim"}, {"w": "claw", "p": "n", "vi": "móng vuốt"}, {"w": "paw", "p": "n", "vi": "bàn chân thú"}, {"w": "horn", "p": "n", "vi": "sừng; còi xe"}, {"w": "nest", "p": "n", "vi": "tổ chim"}, {"w": "cage", "p": "n", "vi": "lồng"}, {"w": "tame", "p": "adj", "vi": "thuần, đã thuần hoá"}, {"w": "bark", "p": "v/n", "vi": "sủa; vỏ cây"}, {"w": "bite", "p": "v/n", "vi": "cắn"}, {"w": "hunt", "p": "v/n", "vi": "săn"}, {"w": "sting", "p": "v/n", "vi": "đốt, chích"}, {"w": "chick", "p": "n", "vi": "gà con"}, {"w": "calf", "p": "n", "vi": "con bê; bắp chân"}, {"w": "bull", "p": "n", "vi": "bò đực"}, {"w": "ox", "p": "n", "vi": "con bò đực kéo"}, {"w": "pony", "p": "n", "vi": "ngựa con"}, {"w": "gorilla", "p": "n", "vi": "khỉ đột"}, {"w": "koala", "p": "n", "vi": "gấu túi"}, {"w": "polar", "p": "adj/n", "vi": "thuộc vùng cực"}, {"w": "seal", "p": "n", "vi": "hải cẩu"}, {"w": "bush", "p": "n", "vi": "bụi cây"}, {"w": "branch", "p": "n/v", "vi": "chi nhánh; cành cây"}, {"w": "root", "p": "n/v", "vi": "rễ"}, {"w": "trunk", "p": "n", "vi": "thân cây; vòi voi"}, {"w": "crop", "p": "n/v", "vi": "cây trồng"}, {"w": "wheat", "p": "n", "vi": "lúa mì"}, {"w": "sunflower", "p": "n", "vi": "hoa hướng dương"}, {"w": "tulip", "p": "n", "vi": "hoa tulip"}, {"w": "lily", "p": "n", "vi": "hoa loa kèn"}, {"w": "daisy", "p": "n", "vi": "hoa cúc dại"}]}, {"id": "W12-4", "title": "The Scientist on the Farm", "body": "On the last day in Wales, Gareth and Megan's daughter came home from the city. Her name was Ffion. She was a **scientist**. She worked in a **laboratory** at a university, where she did research on **solar** **power**.\n\n\"So you make energy from the sun?\" asked Minh.\n\n\"Yes,\" said Ffion. \"Our lab tries to make better solar panels. We do experiments every day. Most of them fail. But sometimes we discover something new. One small discovery can change the world.\"\n\nLeo was more interested in space. \"Did you ever want to be an **astronaut**?\" he asked.\n\n\"When I was ten, yes! I wanted to fly in a **rocket** to Mars,\" Ffion said. \"Then I learned I get sick in cars. So I chose chemistry, physics and biology instead.\"\n\nAfter lunch, Ffion showed them the new solar panels on the farm roof. \"These give us electricity for the whole house,\" she said. \"We have an electric car, too. No more gas for the car. And in winter, we use less.\"\n\n\"Why is it important?\" asked Mia.\n\nFfion looked at the green hills. \"Because of **pollution**,\" she said. \"The air and the water are getting dirty. The global temperature is rising. Every year, people destroy forests and damage the planet. We need to protect nature and save energy. The result of doing nothing is terrible.\"\n\n\"But what can we do?\" asked Mia. \"We are just kids.\"\n\n\"A lot,\" Ffion said. \"**Recycle** your bottles and paper. Don't **waste** food or water. And pick up **litter**.\"\n\nSo that afternoon, they walked along the road with big bags and picked up litter: plastic bottles, cans, paper. In two hours, they had four big bags. \"People are disgusting,\" said Leo. But he worked very hard.\n\nThen Megan asked for help in the garden. There were **weeds** everywhere, between the flowers and the vegetables. \"Pull them out, roots and all,\" she said. \"Weeds grow faster than anything.\"\n\nMinh worked next to Ffion. She told him about the plants. \"Look at this **cactus**,\" she said, pointing to a small plant in a pot in the window. \"It's not from here. It's from the desert. It needs very little water. And this **bamboo** grows almost a meter a day in the right climate.\"\n\n\"We have a lot of bamboo in Vietnam,\" Minh said. \"And **palm** trees by the sea.\"\n\n\"Here we have **oak** and **pine**,\" Ffion said, pointing to the big trees on the hill. \"The oak is the king of British trees.\"\n\nMia **picked** some flowers for Grandma Rose. She was careful not to break the **stem**. \"In a week, these will **bloom**,\" Megan said, showing her a white bud. \"When it opens, each **petal** is like silk.\"\n\nIn the evening, Ffion and Minh talked about inventions. \"What is the best invention in history?\" Minh asked.\n\n\"The wheel? The machine? The computer?\" Ffion said. \"Many people say the robot is the future. But I think the best one is the light bulb. Before it, people lived half their lives in the dark. Its inventor changed everything. Thomas Edison didn't invent it alone, though. Many people helped.\"\n\n\"I want to make something useful one day too,\" Minh said.\n\n\"Then study hard,\" said Ffion. \"And keep asking questions. That's what science is. Asking questions. Like in a lab: you have a liquid, a solid, a question, and a lot of patience.\"\n\nThe next morning, they said goodbye. Gareth gave them eggs, Megan gave them cake, and Ffion gave Minh a book about **solar** energy. Little Minh the calf watched them leave.\n\n\"Come back in the summer,\" Gareth said.\n\n\"We will,\" said Mia. \"I want to see baby Minh again.\"\n\n\"The cow,\" said Minh. \"She means the cow.\"", "words": 617, "new": [{"w": "palm", "p": "n/v", "vi": "cây cọ; lòng bàn tay"}, {"w": "pine", "p": "n", "vi": "cây thông"}, {"w": "oak", "p": "n", "vi": "cây sồi"}, {"w": "bamboo", "p": "n", "vi": "cây tre"}, {"w": "cactus", "p": "n", "vi": "cây xương rồng"}, {"w": "weed", "p": "n/v", "vi": "cỏ dại"}, {"w": "pick", "p": "v/n", "vi": "chọn"}, {"w": "petal", "p": "n", "vi": "cánh hoa"}, {"w": "stem", "p": "n/v", "vi": "thân cây nhỏ, cuống"}, {"w": "bloom", "p": "v/n", "vi": "nở hoa"}, {"w": "pollution", "p": "n", "vi": "ô nhiễm"}, {"w": "litter", "p": "n/v", "vi": "rác vứt bừa"}, {"w": "recycle", "p": "v", "vi": "tái chế"}, {"w": "waste", "p": "n/v/adj", "vi": "lãng phí"}, {"w": "power", "p": "n/v/adj", "vi": "sức mạnh, điện"}, {"w": "solar", "p": "adj", "vi": "thuộc mặt trời"}, {"w": "rocket", "p": "n/v", "vi": "tăng vùn vụt"}, {"w": "astronaut", "p": "n", "vi": "phi hành gia (người được đào tạo để du hành và làm việc trong không gian)"}, {"w": "scientist", "p": "n", "vi": "nhà khoa học"}, {"w": "laboratory", "p": "n", "vi": "phòng thí nghiệm"}]}, {"id": "W13-1", "title": "A Video for Lan", "body": "Minh's sister Lan sent him a message: \"Show me your town! I want to see everything.\" So one Saturday, Minh walked around Riverford with his phone and made a video for her.\n\n\"Hello, Lan,\" he said to the camera. \"Welcome to Riverford. Let's start in the town center.\"\n\nRiverford was small, but it had a lot. In the middle, there was the market square with an old stone **fountain** and a **statue** of a man on a horse. \"Nobody knows who he is,\" Minh said. \"Grandma Rose says he was a king. Tom says he was a farmer who sold a lot of pigs.\"\n\nBehind the square, there was a big gray **cathedral** with a tall **tower**. \"It's nine hundred years old,\" Minh said. \"Older than our pagoda at home.\" Near the river, there was a war **monument** with the names of soldiers. The town also had a small **mosque** and a Hindu **temple**. \"People from many countries live here,\" Minh said.\n\nHe walked down the main street. \"In England, they say **pavement**. In America, they say **sidewalk**.\" He stopped at a busy **crossroads**. \"Here, you must use the **crossing**. Wait for the green man.\" He pointed at the cars in the narrow **lane**. \"The traffic is not bad here, but be careful. And here, they drive on the left. I almost died three times in my first week.\"\n\nHe showed her the shops. \"This is the **bakery**. They make the best bread in town. Next to it, the **butcher**. Grandma Rose buys her meat there every Saturday. Over there is the bookshop. Tom calls it a bookstore. There's also the newsagent for newspapers, and a small **kiosk** that sells coffee and flowers.\" He went into the **post** office. \"This is where I sent your birthday card.\"\n\nThen he took a bus out of the downtown area. \"In America, Tom says 'downtown,'\" he explained. \"We just say 'the center.'\" The bus went down a wide **avenue** with trees on both sides. He passed the football **stadium**, the swimming **pool** and a children's **playground** in the park. \"Leo plays football here every week.\"\n\nOn the other side of the river, there was an old **factory**. It made boats in the old days, when Riverford had a small **port**. Now it was an art center. \"Riverford isn't by the sea, but boats came up the river to the old **harbor**,\" Minh said. Further along the river was a big gray building with high walls. \"And that's the **prison**,\" he said. \"Don't worry, I'm not going there.\"\n\nFinally, he went to his **college**. \"This is where I study. It's a **college**, not a **university**. In England, college is usually for students before university, or for special courses. Next year, I hope to go to the university in the city.\"\n\nInside the college, there was a small science museum. Minh showed Lan an old **telescope**. \"With this, people looked at the stars two hundred years ago.\" Next to it, there was a **microscope**. \"And with this, they looked at very small things.\" There was also a model of a **satellite**. \"This goes around the earth and sends TV and phone signals.\"\n\nAt the end of the day, he sat by the river on a corner of the bridge. \"There's no big mall here and no big department store,\" he said. \"If you want those, you go to the city. But I like Riverford. It's small, but it has everything.\"\n\nHe sent the video. The next morning, Lan replied: \"Your town is beautiful! But where is the rice? I didn't see any rice in the video.\"\n\nMinh laughed. \"There's no rice field,\" he wrote back. \"But there's a Chinese supermarket. I'll show you next time.\"", "words": 620, "new": [{"w": "satellite", "p": "n", "vi": "vệ tinh (vật thể tự nhiên hoặc nhân tạo quay quanh thiên thể)"}, {"w": "telescope", "p": "n/v", "vi": "kính thiên văn (dụng cụ quan sát các thiên thể ở xa)"}, {"w": "microscope", "p": "n", "vi": "kính hiển vi"}, {"w": "crossroads", "p": "n", "vi": "ngã tư"}, {"w": "crossing", "p": "n", "vi": "chỗ qua đường"}, {"w": "avenue", "p": "n", "vi": "đại lộ"}, {"w": "lane", "p": "n", "vi": "làn đường"}, {"w": "sidewalk", "p": "n", "vi": "vỉa hè"}, {"w": "pavement", "p": "n", "vi": "vỉa hè (Anh)"}, {"w": "post", "p": "n/v", "vi": "đăng bài; bưu điện"}, {"w": "stadium", "p": "n", "vi": "sân vận động"}, {"w": "pool", "p": "n/v", "vi": "hồ bơi"}, {"w": "tower", "p": "n/v", "vi": "tòa tháp"}, {"w": "temple", "p": "n", "vi": "ngôi đền"}, {"w": "mosque", "p": "n", "vi": "nhà thờ Hồi giáo"}, {"w": "cathedral", "p": "n", "vi": "nhà thờ lớn"}, {"w": "monument", "p": "n", "vi": "đài tưởng niệm"}, {"w": "statue", "p": "n", "vi": "bức tượng"}, {"w": "fountain", "p": "n", "vi": "đài phun nước"}, {"w": "playground", "p": "n", "vi": "sân chơi"}, {"w": "factory", "p": "n", "vi": "nhà máy"}, {"w": "port", "p": "n/v", "vi": "cảng"}, {"w": "harbor", "p": "n", "vi": "bến cảng"}, {"w": "prison", "p": "n", "vi": "nhà tù"}, {"w": "university", "p": "n", "vi": "đại học"}, {"w": "college", "p": "n", "vi": "cao đẳng"}, {"w": "bakery", "p": "n", "vi": "tiệm bánh"}, {"w": "butcher", "p": "n", "vi": "người bán thịt"}, {"w": "kiosk", "p": "n", "vi": "ki-ốt"}]}, {"id": "W13-2", "title": "The Journey to London", "body": "In May, Minh and Sam decided to go to London for the weekend. It was Minh's first trip to the **capital**.\n\n\"How do we get there?\" Minh asked.\n\n\"Train is fast but expensive,\" Sam said. \"The coach is slow but cheap. Let's take the coach.\"\n\nThe coach left at seven in the morning from the bus station. There were about forty **passengers**, mostly students and old people. The driver said hello and the coach departed on time. It went through the **suburbs**, past houses and gardens, and then onto the **motorway**. \"In America, it's called a **highway**,\" Minh said. \"Tom taught me.\" Sam rolled his eyes. \"Tom teaches you too much American.\"\n\nOn the motorway, there were cars, a big **lorry** full of vegetables, a white **van**, and once, a **helicopter** flying low over the fields. The speed limit was seventy miles an hour. Halfway, they stopped at a service station. The driver put **petrol** in the coach. \"Diesel, actually,\" said Sam. \"Big coaches use diesel **fuel**.\"\n\nThen, near London, there was a problem. The **engine** made a strange noise. The coach slowed down and stopped at the side of the road. The driver got out and looked at the **wheels**. One **tire** was flat. \"Sorry, everyone,\" he said. \"We have to wait for help.\"\n\nThey waited for an hour. Some people were angry. An old lady told them about a crash she saw on this route last year. \"The **brakes** didn't work,\" she said. Minh did not want to hear this.\n\nFinally, a new coach came, and they arrived in London at one o'clock. The city was huge, crowded and loud. Minh held his bag close. They went down to the underground. \"In London, it's the Underground or the Tube,\" Sam said. \"In New York, it's the subway. In Paris, it's the metro.\"\n\nOn the platform, a train came every two minutes. They found a seat and went through the dark tunnels toward the center. Sam said \"towards\". \"Both are fine,\" said Minh. \"This is the oldest underground train in the world,\" Sam said. \"Over a hundred and fifty years old.\"\n\nIn the center, London was a mix of historic buildings and modern glass towers. On the streets, there were red buses, black taxis, bicycles, an electric **scooter** and a big, loud **motorcycle**. In some parts of the city, there was even a tram.\n\nIn the afternoon, they took a **ferry** on the River Thames. They went along the river, past famous buildings. Minh stood at the front of the boat. A **crew** member told them about each building. On the river, there were small boats, a **canoe** with two people in it, and a big white **yacht**. \"That belongs to a millionaire,\" said the captain of the ferry. \"Probably.\"\n\n\"Do you like **sailing**?\" Minh asked Sam.\n\n\"Yes! In Spain, my uncle has a small boat. We **sail** every summer. I want to be a **pilot** of a boat one day. Wait, is that the word?\"\n\n\"I think a pilot flies a plane,\" said Minh. \"A boat has a captain.\"\n\n\"Then I want to be a captain.\"\n\nAcross the river, opposite the ferry stop, there was a huge wheel, the London Eye. \"Tomorrow,\" said Sam. \"Tonight, we find our hostel and eat.\"\n\nThe journey was long and difficult, but Minh was happy. He was in London, the local people were busy and nobody looked at him, and for the first time, he did not feel like a foreigner. He was just another person in a big city.\n\nThere was no parking anywhere, Sam noticed. \"Good thing we didn't drive,\" he said.", "words": 602, "new": [{"w": "suburb", "p": "n", "vi": "vùng ngoại ô"}, {"w": "capital", "p": "n/adj", "vi": "vốn"}, {"w": "van", "p": "n", "vi": "xe tải nhỏ"}, {"w": "lorry", "p": "n", "vi": "xe tải (Anh)"}, {"w": "scooter", "p": "n", "vi": "xe tay ga"}, {"w": "motorcycle", "p": "n", "vi": "xe mô tô"}, {"w": "helicopter", "p": "n", "vi": "máy bay trực thăng"}, {"w": "ferry", "p": "n", "vi": "phà"}, {"w": "yacht", "p": "n", "vi": "du thuyền"}, {"w": "canoe", "p": "n", "vi": "xuồng"}, {"w": "sail", "p": "v/n", "vi": "đi thuyền buồm; cánh buồm"}, {"w": "sailing", "p": "n", "vi": "môn đua thuyền buồm"}, {"w": "passenger", "p": "n", "vi": "hành khách"}, {"w": "pilot", "p": "n/adj/v", "vi": "phi công"}, {"w": "crew", "p": "n", "vi": "phi hành đoàn, thuỷ thủ đoàn"}, {"w": "highway", "p": "n", "vi": "đường cao tốc"}, {"w": "motorway", "p": "n", "vi": "đường cao tốc (Anh)"}, {"w": "petrol", "p": "n", "vi": "xăng (Anh)"}, {"w": "fuel", "p": "n/v", "vi": "nhiên liệu"}, {"w": "engine", "p": "n", "vi": "động cơ"}, {"w": "wheel", "p": "n", "vi": "bánh xe"}, {"w": "tire", "p": "v/n", "vi": "lốp xe"}, {"w": "brake", "p": "n/v", "vi": "phanh"}]}, {"id": "W13-3", "title": "Two Days in London", "body": "Minh and Sam stayed in a cheap hostel near the station. At the reception, a young **receptionist** with green hair gave them a key. \"Room twelve. It's a double room, two beds, with a shared bathroom. Breakfast is from seven till ten.\"\n\nThe room was small, but clean. \"It's not a resort,\" Sam said. \"But for twenty pounds a night, it's perfect.\" Last year, Sam's family stayed in a **guesthouse** by the sea in Spain. The year before, they went camping at a campsite in France. \"I love to camp,\" Sam said, \"but not in a London winter.\"\n\nThe next morning, they went **sightseeing**. They bought a guidebook, but Sam said a tour with a guide was better. So they joined a free walking tour. The guide was an old man who knew everything about the city's history and **heritage**. \"London has two thousand years of culture,\" he said. \"Every street has a story.\"\n\nThere were tourists from all over the world: Americans, Chinese, Germans, Brazilians. \"Tourism is very important for London,\" the guide said. \"Millions of people come abroad to see it every year. Some come on a cruise, some on a flight with a cheap airline.\" A Japanese couple had a big camera and a lot of luggage. \"That's not luggage,\" Sam whispered. \"That's a house.\" In America, Tom says baggage, Minh remembered.\n\nThe best view was from the London Eye. From the top, they could see the whole city. \"I can see your college from here,\" joked Sam. Minh took photos for his family. \"My first big adventure,\" he wrote to Lan.\n\nAt lunch, they went to a famous market. Minh wanted to buy a **souvenir** for everyone at home. He looked at small red buses, tea towels and postcards. \"Everything is so expensive,\" he said. \"Ten pounds for a cup!\"\n\n\"You must find a **bargain**,\" Sam said. \"Look. This stall has a sale. And this one has a special offer: buy two, get one free.\"\n\nMinh bought a cup for his mother, a London Bus model for his father, a scarf for Grandma and a pen with a small Big Ben on it for Lan. The assistant in the shop asked, \"Do you want me to wrap it?\" \"Yes, please,\" said Minh.\n\nAt the **counter**, he paid by card. \"Cash or credit card?\" \"Card, please.\" \"Do you have a student card? We give a ten percent discount.\" Minh was very happy. He showed his student card and saved two pounds.\n\nIn the afternoon, they went to a big supermarket to buy food for the train home. It was very busy. There were shoppers everywhere, with **trolleys** full of food. \"In America, they call it a cart,\" said Minh. \"I know, I know,\" said Sam. \"Tom.\"\n\nThey walked down every **aisle**. Minh read every label. He found a Vietnamese brand of instant noodles. \"Look! From my country!\" There was so much choice. \"In Vietnam, we go to the market,\" he said. \"Here, everything is in plastic.\"\n\nAt the checkout, the queue was long. A woman in front of them had two trolleys. The **cashier** was very slow. She talked to every customer about the weather. \"English people love to queue,\" Sam said. \"In Spain, we don't queue. We just push.\" \"In Vietnam too,\" said Minh.\n\nWhen they finally paid, it was late. They ran to the station. \"I don't want to return,\" said Minh. \"I want to explore more.\"\n\nOn the train, he looked through his photos. He thought about foreign countries and being a foreigner. A year ago, he needed a visa and a passport to come here, and everything was strange. Now he could travel in a big foreign city with his friend, buy things, ask for directions and choose the right transport. Every vehicle in London was different: the red bus, the black cab, the Tube.\n\n\"Next year, Spain,\" said Sam. \"Bring your sun cream. We will **sunbathe** on the beach. **Sunbathing** is the national sport in Spain.\"\n\n\"Do I need a driving license to go there?\" Minh joked.\n\n\"Only a licence for eating too much,\" Sam said. \"My mother's food is dangerous.\"\n\nThe train went slowly through the dark. Minh fell asleep with his bag of souvenirs on his knees and dreamed of sunny beaches and a very **reserved** English receptionist who never smiled.", "words": 721, "new": [{"w": "sightseeing", "p": "n", "vi": "tham quan"}, {"w": "receptionist", "p": "n", "vi": "lễ tân"}, {"w": "guesthouse", "p": "n", "vi": "nhà khách"}, {"w": "reserve", "p": "v/n", "vi": "kín đáo"}, {"w": "souvenir", "p": "n", "vi": "quà lưu niệm"}, {"w": "sunbathe", "p": "v", "vi": "tắm nắng"}, {"w": "sunbathing", "p": "n", "vi": "việc tắm nắng"}, {"w": "heritage", "p": "n/adj", "vi": "di sản"}, {"w": "cashier", "p": "n", "vi": "thu ngân"}, {"w": "bargain", "p": "n/v/adj", "vi": "món hời"}, {"w": "trolley", "p": "n", "vi": "xe đẩy (Anh)"}, {"w": "aisle", "p": "n", "vi": "lối đi giữa các dãy"}, {"w": "counter", "p": "n/v/adv", "vi": "quầy"}]}, {"id": "W14-1", "title": "Money Problems", "body": "In May, Minh had a problem: money. His scholarship paid for his classes and his room at the Parkers', but he had to pay for his food, his phone and his books himself. Every month, his parents sent a little money from Vietnam. He knew it was hard for them.\n\nOne evening, he sat at the kitchen table with a calculator and a piece of paper. He wanted to make a budget. He wrote down how much he could spend each week, and how much he needed to keep as saving. The total was not good. \"I can't afford a new phone,\" he said. \"I can't even afford new shoes.\"\n\nAnna looked at his paper. \"Let me see. Bank account, phone, books, bus... What's this fee?\"\n\n\"The college library. I owe them five pounds for a late book.\"\n\n\"Students always owe something,\" Anna laughed. \"Don't worry. The sum isn't big. But you need a small job. You could earn some money on weekends.\"\n\nMinh knew she was right. But first, he had exams. The end of the year was coming, and every subject had a test. He wanted good grades. If he did not pass, he could lose his scholarship. If he got a low score, he could not go to university next year.\n\nSo he studied all the time. He went to the library every day. He used a big dictionary to check new words. On his desk, he had a ruler, a marker, a yellow highlighter, a pencil and a rubber. \"In America, it's an eraser,\" Tom said, walking past. \"I know,\" said Minh. He almost threw the rubber at him.\n\nMeanwhile, Leo also needed money. His school was going on a trip to France, and the fee was three hundred pounds. \"Can I borrow some money?\" he asked his father. \"I'll pay you back.\"\n\n\"Lend you three hundred pounds?\" Tom said. \"And how will you pay it back? With your salary as a football player?\"\n\n\"I can wash cars,\" said Leo. \"I can walk dogs. I'll do anything.\" Tom agreed to pay him a small **wage** for cleaning the garage every week.\n\nMia had her own project. There was an art competition at school, and the first prize was two hundred pounds. She needed new paints, brushes and paper. She bought everything online, because it was cheaper. When the box came, one paint was broken. She asked for a refund. The shop wanted her to exchange it instead, and she argued with them for a week.\n\nOne afternoon, Minh helped Mia's young friend Rosie, who was having trouble with maths. Rosie's mark in the last test was very low. She was eleven, and she had a pink schoolbag full of **crayons** and a pencil **sharpener** shaped like a cat. \"I'm going to fail,\" she said. \"I always fail.\"\n\n\"You won't fail,\" said Minh. \"You just need practice. Let's compare this problem with the last one.\" After an hour, she understood. The next week, she got a good grade. Her mother gave Minh a box of chocolates and a note that said, \"Thank you!\" Rosie told every classmate about her new teacher.\n\n\"You should be a teacher,\" said Anna. \"That's a valuable skill. Some people pay a lot of money for a tutor.\"\n\nThat night, Minh thought about it. He could help children with English and maths. That was something he could do. The next day, he went to the ATM, took out his last ten pounds, and bought a nice box of biscuits for the principal of Rosie's school, who agreed to put a note about him on the school board.\n\nTom laughed. \"Very good. In my day, people paid with a **cheque** for this kind of thing, but nobody uses cheques anymore. Ask them to pay to your bank account, or by debit card. And remember to pay tax if you earn a lot.\"\n\n\"I won't earn a lot,\" said Minh.\n\n\"Every millionaire starts with ten pounds,\" said Tom. \"Was the box of biscuits worth it? We'll see.\"\n\nIt was worth it. In a week, Minh had three students. His **headteacher** at college said it was a good project for his education, too. Every Saturday, he could deliver his lessons at the library during the break between his own classes. The amount of money was small, but it was his.", "words": 724, "new": [{"w": "wage", "p": "n/v", "vi": "tiền lương"}, {"w": "cheque", "p": "n", "vi": "séc (Anh)"}, {"w": "sharpener", "p": "n", "vi": "gọt bút chì"}, {"w": "crayon", "p": "n", "vi": "bút sáp màu"}, {"w": "headteacher", "p": "n", "vi": "hiệu trưởng"}]}, {"id": "W14-2", "title": "Careers Day", "body": "In June, Leo and Mia's school had a Careers Day. Parents and local people came to the school to talk about their jobs. Tom asked Minh to come too. \"You can talk about being a student abroad,\" he said. \"It's a kind of career.\"\n\nThe school hall was full of tables. Each table had a person from a different **profession**. There was an engineer who built bridges, a mechanic with dirty hands, a plumber, an electrician and a builder. There was a **carpenter** who made beautiful wooden chairs, and a **painter** who painted houses, not pictures. There was a **hairdresser** with purple hair, and next to her, an old **barber** who only cut men's hair. \"Fifty years with the same scissors,\" he said proudly.\n\nThere was a baker with free cakes, so his table was the most popular. There was a soldier in uniform, a **firefighter** with a big helmet, and a postman who had walked the same street every day for thirty years. \"In the old days, we said fireman,\" said the firefighter. \"But now many women do this job too.\"\n\nGrandma Rose's niece, Kate, was there. She was a nurse, and she talked about working in a hospital. A young woman who was a **vet** brought a little dog. All the young children went to her table.\n\nMia talked to the **cleaner** at the town hall, a kind woman from Poland. \"Many people don't think about cleaners,\" the woman said. \"But without us, every office would stop in one day.\"\n\n\"Everybody's job is important,\" Mia said.\n\n\"Tell that to my employer,\" the woman laughed.\n\nAnna had a table too, about teaching. She talked about primary schools, secondary schools, a **kindergarten** for small children, and a **nursery** for babies. \"Teaching is hard,\" she said, \"but it's never boring.\"\n\nThen it was Minh's turn. He was nervous. He stood in front of a group of sixteen-year-olds. \"I want to explain what it is like to study in a foreign country,\" he said.\n\nHe told them about Vietnam, about his school, about learning English. \"In my school in Vietnam, we had to memorize a lot. We had to repeat and copy everything the teacher said. Here, the teachers want you to think and ask questions. At first, I didn't know what to do.\"\n\n\"Did you make a lot of mistakes?\" a boy asked.\n\n\"Many,\" Minh laughed. \"Every day. One day, I said to my teacher, 'I am boring' when I wanted to say 'I am bored.' She corrected me, and the whole class laughed. But that's how you learn.\"\n\n\"Is it hard to translate from Vietnamese?\" asked a girl.\n\n\"Very hard. Some words don't exist in English. And the grammar is completely different. But I review my notes every day and revise before every exam.\"\n\nHe also talked about his subjects: English literature, history, geography and business. \"This term, I have four exams. Next semester, if I pass, I start at the university. If I get my **diploma** and the certificate in English, I can work anywhere.\"\n\nAfter his talk, the secretary of the school came to him. \"That was very good,\" she said. \"The children loved it. You should come every year.\"\n\nThen the manager of a local company came to talk to him. \"We sometimes need staff who speak Vietnamese,\" she said. \"We have a big customer in Hanoi. When you finish university, call me. Every good employee starts somewhere.\"\n\nMinh put her card in his wallet very carefully. On the way home, Mia said, \"Everyone listened to you. Even the boys at the back.\"\n\n\"I just told the truth,\" said Minh.\n\n\"That's the hardest thing,\" said Tom. \"Ask any politician.\"", "words": 612, "new": [{"w": "diploma", "p": "n", "vi": "bằng tốt nghiệp"}, {"w": "kindergarten", "p": "n", "vi": "mẫu giáo"}, {"w": "nursery", "p": "n/adj", "vi": "nhà trẻ"}, {"w": "profession", "p": "n", "vi": "nghề nghiệp"}, {"w": "carpenter", "p": "n", "vi": "thợ mộc"}, {"w": "painter", "p": "n", "vi": "thợ sơn, hoạ sĩ"}, {"w": "cleaner", "p": "n", "vi": "người dọn dẹp"}, {"w": "hairdresser", "p": "n", "vi": "thợ làm tóc"}, {"w": "barber", "p": "n", "vi": "thợ cắt tóc nam"}, {"w": "vet", "p": "n/v", "vi": "bác sĩ thú y"}, {"w": "firefighter", "p": "n", "vi": "lính cứu hoả"}]}, {"id": "W14-3", "title": "The Job Interview", "body": "At the end of June, Grandma Rose's nephew Daniel put an advertisement in the window of his café, The Blue Cup: \"Part-time staff wanted. Weekends. Apply inside.\"\n\n\"Daniel doesn't like to advertise online,\" Grandma Rose said. \"He likes a sign in the window. You should apply.\" \"Daniel needs help, and you need money.\"\n\nMinh was nervous. He had never had a real job interview. He filled in the application form carefully and wrote his signature at the bottom. He printed his CV on Tom's old printer, but the printer was broken, so he went to the college library and used the photocopier there. He made one photocopy of his student card too. He put everything in a clean folder.\n\nSam helped him plan. Sam was also looking for a job. He wanted to be a designer, and he applied to a design firm in the city. \"Look,\" he said, and showed Minh a big file of his work on his laptop. \"The company is small, but they have big clients. If they hire me, I'll work with an architect on new buildings.\"\n\n\"What do I say in an interview?\" asked Minh.\n\n\"Tell them why you want the job. Tell them what you can do. Smile. And never say anything bad about your last boss.\"\n\n\"I've never had a boss.\"\n\n\"Then that's easy.\"\n\nOn Saturday morning, Minh went to The Blue Cup. Daniel was a big man with a beard and a friendly face. He was a musician too. He played guitar on Friday nights in the café. Before he opened the café, he worked for ten years as an accountant at a bank. \"I was a banker who hated numbers,\" he laughed. \"Then I decided to retire from that life and make coffee.\"\n\nThe interview was in the small office behind the café. On the desk, there was an old computer with a big screen, a keyboard, a **stapler**, a pile of documents and, strangely, a fax machine. \"My father's,\" said Daniel. \"Nobody sends a fax anymore. But I can't throw it away.\"\n\nDaniel asked his questions. \"Why do you want to work here?\"\n\n\"Because I like people, and I like coffee,\" said Minh. \"And because I need money. My parents are not rich. I want to help them.\"\n\n\"Honest. I like that. Do you have experience?\"\n\n\"I helped my father at his shop. I can carry heavy things, I can clean, and I learn fast.\"\n\nDaniel looked at his form. \"You speak Vietnamese and English. Good. We have more and more customers from other countries. What about a little Spanish?\"\n\n\"My friend Sam is teaching me,\" said Minh. \"Hola. That's all.\"\n\nDaniel laughed. He told Minh about the business. \"We don't sell an expensive product. We sell good coffee, good cake and good service. Most of my customers are regulars. There's an old lawyer who comes every morning, a retired judge who does the crossword, a journalist and a young reporter from the Riverford Gazette, a photographer, a computer programmer who works from her smartphone all day, and a lot of students with headphones or earphones in, studying. Some colleagues from the hospital come at night.\"\n\n\"And a model,\" said a young woman from the counter. \"Don't forget the model.\" She was Daniel's other employee, Jess. \"He comes on Sundays. Everybody looks at him.\"\n\n\"And sometimes a **businesswoman** from London who sends angry messages to her team all day,\" said Daniel. \"Being unemployed is better than her job, I think.\"\n\nAt the end, Daniel stood up. \"Can you start next Saturday?\"\n\nMinh could not believe it. \"Yes! Of course!\"\n\n\"Good. You'll need a lot of energy. Saturday morning is busy. And there's live music on Fridays. Sometimes I need help with the speaker and the microphone. And please don't touch the monitor on the counter. It's for the security camera. We had a guard once, but he ate too much cake.\"\n\nThat evening, Minh sent a message to his family: \"I got a job!\" His mother replied with a hundred hearts. Sam called an hour later. \"I got the job too! A real design firm!\" Minh wrote a short report of the day in his diary.\n\nThey went to The Blue Cup to celebrate. Daniel gave them free coffee. \"Don't get used to it,\" he said. \"From next week, you pay.\"", "words": 722, "new": [{"w": "businesswoman", "p": "n", "vi": "nữ doanh nhân"}, {"w": "stapler", "p": "n", "vi": "cái dập ghim"}]}, {"id": "W15-1", "title": "The Stolen Laptop", "body": "One Saturday in July, something bad happened at The Blue Cup. A customer, a young woman who was a computer programmer, went to the toilet. She left her laptop on the table, with the charger and a cable still connected to the wall. When she came back, the laptop was gone.\n\n\"Somebody stole my laptop!\" she shouted. \"All my work is on it! My software, my program, everything!\"\n\nDaniel ran over. Minh looked around the café. Near the door, a man in a gray hoodie was walking out quickly with a bag. \"Him!\" Minh said. He ran after the man. But the thief was fast. He jumped on a bike and was gone.\n\nMinh came back without breath. \"I'm sorry,\" he said. \"I couldn't catch him.\"\n\nThe police came. A young police officer took notes. \"There's a lot of crime like this in summer,\" she said. \"They don't **rob** banks. They steal laptops and phones. Breaking the law is easy when people leave their things on the table.\"\n\n\"Can you find it?\" the woman asked.\n\n\"Do you have a program to find your laptop? Is it connected to a network?\"\n\nThe woman checked her phone. She opened an app. \"Yes! My laptop is still online! It's not offline yet. I can see it on the map. It's two streets away!\"\n\nThe police officer called her colleagues on the radio. Ten minutes later, they called back. They found the man in a park, trying to delete everything on the laptop. They brought it back. The woman almost cried. \"Thank you!\" she said to Minh. \"You saw him. You helped.\"\n\nThe next week, the story was in the Riverford Gazette. There was a short article with a big headline: \"Café worker helps catch laptop thief.\" There was even a photo of Minh, looking surprised. Daniel put it on the wall. \"You are a **celebrity** now,\" he said.\n\nMia and Leo thought it was the funniest thing ever. Mia sent the photo to everyone in her chat group. Leo wanted to upload it to the school website. Tom printed it and put it on the fridge.\n\nEven the local radio wanted to talk to him. A **presenter** called Minh and asked him to come on her programme. \"We **broadcast** every afternoon,\" she said. \"Each **episode** is short, ten minutes. Our audience loves local heroes.\"\n\nMinh was nervous. In the studio, there were microphones, screens and a lot of electronic equipment. Every **gadget** looked expensive. \"Don't worry,\" said the presenter. \"Just talk like you're talking to a friend.\"\n\n\"What did you think when you saw the thief?\" she asked.\n\n\"I didn't think,\" said Minh. \"I just ran. Maybe it's because I watch too many cartoons. In cartoons, the good guy always wins.\"\n\nThe presenter laughed. \"And in real life?\"\n\n\"In real life, he was faster than me. Technology caught him, not me. The hardware and the software did the work.\"\n\nAfter the show, Minh went home. Grandma Rose was watching a documentary about the queen. Before that, there was a quiz show and a comedy series she liked. \"Did you hear me on the radio?\" Minh asked.\n\n\"Of course,\" Grandma said. \"Everybody did. I told everyone in the street. Even Mrs. Taylor next door, who only watches the news channel. She says you're a hero. But she also says the king should have more power and the American president is too loud, and the government should make a new rule about everything, so I don't trust her opinion.\"\n\nMinh laughed. He checked his phone. He had a hundred new messages and a long text from Lan. She had seen the article. \"My brother is famous in England!\" she wrote. \"Are you meeting the prince and princess now?\"\n\n\"No,\" he wrote back. \"But I got a free cake from Daniel.\"\n\n\"That's better,\" Lan replied.\n\nThat night, Minh changed every password on his phone and his laptop. \"Just in case,\" he said. Then he went to search on the web for a better lock for his bike. He found a good website and decided to download a safety app. He did not want to be the next victim. A friend from the English club sent him a comic about a thief in a coffee shop. He laughed and saved it.\n\nHe learned something important: always watch your bag, and always keep a copy of your work. A digital copy is safer than paper. Grandma Rose, of course, still kept her photos on an old DVD and her music on a CD. \"If you click a button, it can disappear,\" she said. \"Paper doesn't disappear.\"\n\n\"Paper burns, Grandma,\" said Minh.\n\n\"Then don't play with matches,\" she said, and went back to her favourite channel, where there was never an advert, to wait for her program.\n\nBefore bed, Minh tried to connect to the café's internet to send Daniel a message, but he couldn't. He would receive Daniel's reply in the morning: \"The ad for your job worked better than I thought. Now we have a hero. Every café needs one.\"", "words": 844, "new": [{"w": "gadget", "p": "n", "vi": "đồ công nghệ nhỏ"}, {"w": "episode", "p": "n", "vi": "tập phim"}, {"w": "presenter", "p": "n", "vi": "người dẫn chương trì
