ents doing research, international students, older students coming back to study. The **faculty** of business had professors from fifteen countries.\n\nMinh's scholarship paid his **tuition** fees, but he still worked at The Blue Cup on weekends. He also wrote for the university newspaper. He was very busy. Sometimes he was too tired to **concentrate**.\n\n\"You need to rest,\" said Hana. She was back from Japan and in her final year too. \"You can't do everything.\"\n\n\"I can try,\" said Minh.\n\nThere was a lot of work. The **curriculum** was hard. The **syllabus** for each class had a long reading list. There were essays, presentations and exams. Every piece of work had an **assessment**. The professors would **assess** each student carefully. They would **evaluate** not only the answers but the thinking.\n\nMinh was worried about one thing. \"What if my English isn't good enough?\" he asked Dr. Bell. \"My classmates are English. I'm not.\"\n\n\"Your English is excellent,\" she said. \"And you have something they don't. You've lived in two cultures. That's a kind of **intelligence** they can't learn from books.\"\n\nThere was a serious talk in the first week about **plagiarism**. \"If you copy someone else's work and say it's yours, you will fail,\" said the head of the faculty. \"If you **cheat** in an exam, you will be sent home. This is a question of **discipline**.\"\n\nMinh had heard of a student who was caught cheating last year. He was not allowed to register for this year. \"It's like **detention** at school,\" said Hana. \"But much worse.\"\n\nMinh's **attendance** was perfect. He tried to attend every class, and he did. His only **absence** was one day when he had a fever. He did his revision every evening. He asked for feedback on every essay.\n\n\"You'll be fine,\" said Hana. \"You'll **qualify** with a first-class degree. I know it.\"\n\n\"How do you know?\"\n\n\"Because you never stop,\" she said. \"You're the most stubborn person I know.\"\n\nAt the end of the term, there was a graduation ceremony for last year's students. Minh watched them in their black gowns and hats, throwing their hats in the air. Next year, it would be him. He imagined his parents there, in the audience. His mother crying. His father proud. Grandma Rose shouting something embarrassing.\n\n\"Next year,\" he said to Hana.\n\n\"Next year,\" she said. \"Together. Both **graduates**.\"\n\nHe thought about what he would do after his **qualification**. A job? A master's degree? Go home to Vietnam? He did not know. But he knew he wanted to write. He wanted to tell stories. Maybe, he thought, he could enroll in a journalism course. Or find a newspaper that would take him. The enrollment for next year's courses opened in January. He had time to decide.", "words": 654, "new": [{"w": "lecture", "p": "n/v", "vi": "bài giảng"}, {"w": "seminar", "p": "n", "vi": "buổi thảo luận chuyên đề"}, {"w": "campus", "p": "n", "vi": "khuôn viên trường"}, {"w": "faculty", "p": "n", "vi": "đội ngũ giảng viên"}, {"w": "undergraduate", "p": "n", "vi": "sinh viên đại học (chưa tốt nghiệp)"}, {"w": "graduate", "p": "n/v/adj", "vi": "người tốt nghiệp"}, {"w": "postgraduate", "p": "n/adj", "vi": "sau đại học"}, {"w": "tuition", "p": "n", "vi": "học phí"}, {"w": "attendance", "p": "n", "vi": "sự chuyên cần"}, {"w": "absence", "p": "n", "vi": "sự vắng mặt"}, {"w": "curriculum", "p": "n", "vi": "chương trình giảng dạy"}, {"w": "syllabus", "p": "n", "vi": "đề cương môn học"}, {"w": "qualification", "p": "n", "vi": "bằng cấp"}, {"w": "qualify", "p": "v", "vi": "đạt đủ trình độ"}, {"w": "intelligence", "p": "n", "vi": "trí thông minh"}, {"w": "concentrate", "p": "v/n", "vi": "tập trung"}, {"w": "concentration", "p": "n", "vi": "sự tập trung"}, {"w": "assessment", "p": "n", "vi": "sự đánh giá"}, {"w": "assess", "p": "v", "vi": "đánh giá"}, {"w": "evaluate", "p": "v", "vi": "đánh giá"}, {"w": "plagiarism", "p": "n", "vi": "đạo văn"}, {"w": "cheat", "p": "v/n", "vi": "gian lận"}, {"w": "discipline", "p": "n/v", "vi": "kỷ luật"}, {"w": "detention", "p": "n", "vi": "bị phạt ở lại trường"}]}, {"id": "W27-1", "title": "The Careers Fair", "body": "In November, the university had a big careers fair. Hundreds of companies came to **recruit** students. It was the biggest **recruitment** event of the year. There were banks, technology companies, schools, hospitals and newspapers. Every final-year student went. Every **candidate** wore a suit and carried a pile of CVs.\n\nMinh went with Hana and a friend from his course, Tariq. Tariq wanted to be a teacher. \"I want to work in a **state** school, not a private one,\" he said. \"Everyone deserves a good education, not just rich kids.\"\n\nThey stopped at a table for teachers. A woman talked to Tariq about different kinds of schools. \"There are **boarding** schools, where children live at school. There are **mixed** schools for boys and girls, and single-sex schools. There are **vocational** schools that teach practical skills, like building or cooking.\"\n\n\"What's the biggest problem in schools today?\" asked Tariq.\n\n\"**Literacy** and **numeracy**,\" she said. \"Too many children leave school without good reading and maths skills. And behaviour. Some children are so difficult that schools have to **expel** them. That's never a good solution.\"\n\nTariq took a **handout** and a **worksheet** about teacher training. \"I'll apply,\" he said.\n\nHana went to the hospital table. They talked about nursing jobs and further study. \"You could do a **bachelor**'s degree in nursing, then a **master**'s in a special area,\" the woman said. \"Some nurses even do a **doctorate**. A **PhD** in nursing research.\"\n\nMinh walked around alone. He saw a table for a big bank. They wanted business graduates. The salary was high. \"Experienced staff earn a lot,\" said the man at the table. \"Of course, you start at the bottom.\" Minh took a brochure but didn't feel excited.\n\nThen he saw a small table in the corner. It said: \"The Riverford Gazette.\" There was nobody there except one woman, sitting alone with a **textbook** about journalism and a **workbook** of notes. She was about fifty, with short gray hair and sharp eyes.\n\n\"Hello,\" said Minh. \"Are you from the Gazette?\"\n\n\"I'm the editor,\" she said. \"Grace Okafor. Nobody comes to my table. Students want to work for big companies. Local newspapers are not fashionable.\"\n\n\"Okafor?\" said Minh. \"My landlord is Mr. Okafor.\"\n\nShe laughed. \"Then you live with my father. He told me about you. The Vietnamese boy who fixes things and writes food reviews.\"\n\nMinh couldn't believe it. They talked for half an hour. Grace told him about her **occupation**. \"Being a journalist is not a job,\" she said. \"It's a life. You work long hours. You're never rich. But you tell the truth, and sometimes, the truth changes things.\"\n\nShe told him that the Gazette was looking for an intern. \"Part-time, during your final year. Then maybe a contract after you graduate. Maybe. Local newspapers are struggling. Employment is not guaranteed. There's a lot of unemployment in journalism right now. Many journalists work freelance. Being a freelancer is hard.\"\n\n\"I'd like to apply,\" said Minh.\n\n\"Send me your CV,\" she said. \"Or resume, as Americans say. Two **references**. And three things you've written. I'll look at them. But I'm a hard **applicant** to please. I mean, a hard employer to please.\"\n\nThat night, Minh worked on his application. He chose three pieces: his review of the chip shop, his article about Science Week, and an article about saving The Blue Cup. He asked Dr. Bell and Daniel to write his references.\n\n\"Do you really want to work for a small local newspaper?\" asked Tariq. \"The bank pays four times more.\"\n\n\"I know,\" said Minh. \"But I want to write. And I like small places. Big things happen in small places.\"\n\nBefore he sent it, he read Grace's company page. The Gazette was a hundred years old. Two years ago, the owners wanted to close it. Grace fought to keep it open. They had to **dismiss** half the staff. Some journalists were made redundant. Others had to **resign**. The old editor's **resignation** letter was famous in Riverford. He wrote: \"I'm not leaving journalism. Journalism is leaving me.\"\n\nMinh thought about the people who were **sacked**. He thought about The Blue Cup. It was the same story: small places fighting to survive.\n\nHe sent the application. Then he waited. He was good at waiting by now.\n\nA week later, Grace called. \"Come in on Monday,\" she said. \"Let's talk properly. I don't **promote** people easily, and I don't take interns easily either. But your Blue Cup article was good. **Shift** starts at eight.\"", "words": 749, "new": [{"w": "expel", "p": "v", "vi": "đuổi học"}, {"w": "boarding", "p": "adj/n", "vi": "nội trú"}, {"w": "state", "p": "n/v/adj", "vi": "bang"}, {"w": "mixed", "p": "adj", "vi": "pha trộn"}, {"w": "vocational", "p": "adj", "vi": "hướng nghiệp"}, {"w": "literacy", "p": "n", "vi": "khả năng đọc viết"}, {"w": "numeracy", "p": "n", "vi": "khả năng tính toán"}, {"w": "bachelor", "p": "n", "vi": "cử nhân"}, {"w": "master", "p": "n/v/adj", "vi": "bậc thầy"}, {"w": "doctorate", "p": "n", "vi": "bằng tiến sĩ"}, {"w": "PhD", "p": "n", "vi": "bằng tiến sĩ"}, {"w": "textbook", "p": "n/adj", "vi": "sách giáo khoa"}, {"w": "workbook", "p": "n", "vi": "sách bài tập"}, {"w": "handout", "p": "n", "vi": "tài liệu phát tay"}, {"w": "worksheet", "p": "n", "vi": "phiếu bài tập"}, {"w": "occupation", "p": "n", "vi": "nghề nghiệp"}, {"w": "recruit", "p": "v/n", "vi": "tuyển dụng"}, {"w": "recruitment", "p": "n", "vi": "tuyển dụng"}, {"w": "candidate", "p": "n", "vi": "ứng cử viên / ứng viên"}, {"w": "applicant", "p": "n", "vi": "ứng viên / người nộp đơn"}, {"w": "reference", "p": "n/v", "vi": "tham khảo"}, {"w": "promote", "p": "v", "vi": "thúc đẩy, quảng bá"}, {"w": "resign", "p": "v", "vi": "từ chức"}, {"w": "resignation", "p": "n", "vi": "sự từ chức"}, {"w": "dismiss", "p": "v", "vi": "sa thải"}, {"w": "sack", "p": "v", "vi": "sa thải"}, {"w": "shift", "p": "v/n", "vi": "sự thay đổi; chuyển đổi"}]}, {"id": "W27-2", "title": "The Newsroom", "body": "On Monday at eight o'clock, Minh arrived at the offices of the Riverford Gazette. It was a small, old building on the main street, above a shoe shop. The newsroom had ten desks, five computers and a lot of coffee cups.\n\nGrace introduced him to the team. There was Raj, the deputy editor and Minh's **supervisor**. There was Ellie, a young reporter who had joined as a **trainee** two years ago. There was an old photographer called Bill, who had worked there for forty years. There were two other reporters and a woman who did the marketing and the sales of advertisements.\n\n\"This is our whole **workforce**,\" said Grace. \"Ten years ago, we had forty people. Now, it's us. We all do everything.\"\n\nRaj explained Minh's **duties**. \"You'll start with small stories. Local events, school news, council meetings. You'll check facts. You'll answer the phone. It's not glamorous. But every journalist starts here. I was an **apprentice** at a newspaper when I was sixteen. I made coffee for a year.\"\n\nThe workload was heavy. On his first day, Minh wrote three short stories: a cat rescued from a tree, a new bakery opening, and a council decision about parking. He worked from eight until seven. There was no overtime pay. \"Interns don't get overtime,\" said Ellie. \"Or a real **paycheck**. You get a little money and a lot of experience.\"\n\n\"What are the **perks** of the job?\" Minh joked.\n\n\"Free coffee,\" said Ellie. \"Bad coffee, but free.\"\n\nIn the afternoon, Grace sent Minh with Ellie to cover a story. Workers at a local factory were on **strike**. The factory made car parts. The workers' **union** said the company paid them too little. The company said it could not pay more. \"Sales are down,\" said the factory **executive**, a man in an expensive suit. \"Export to Europe is down. Demand is down. The **turnover** of the company has fallen by twenty percent.\"\n\nOutside the factory, the workers stood with signs. One of them was a skilled laborer who had worked there for thirty years. \"We work hard,\" he said. \"Manual work, heavy work. Our **earnings** haven't gone up for five years. The **chairman** of the company got a big bonus last year. We got nothing.\"\n\nMinh listened. He took notes. He asked careful questions. Ellie watched him. \"You're good at listening,\" she said later. \"That's the most important skill. Most people only want to talk.\"\n\nBack at the office, they wrote the story together. Grace read it. She made a lot of changes. \"Never take sides,\" she said. \"Tell both stories. The workers' story and the company's story. Let the readers decide.\"\n\nMinh learned a lot that week. He learned about local industry and commerce, the industrial past of the town and its commercial future. Every small enterprise had a story. He learned how a small organization like the Gazette worked: the administration, the management, the money. He learned that trade between countries could change a small town's life. When supply was low and demand was high, prices went up. When a big corporation closed a factory, a hundred families had no work.\n\nHe also met interesting people. A **consultant** who helped small businesses. A young **entrepreneur** who started a company selling Vietnamese-style coffee. \"I'm the **founder**,\" she said proudly. \"And the only worker.\" An expert on local history who had written five books about Riverford.\n\nOn Friday, Grace called him into her office. \"Well?\" she said. \"What do you think?\"\n\n\"It's hard,\" said Minh. \"Very hard. But I love it.\"\n\nGrace smiled for the first time all week. \"Good answer. You've done well for an intern. This internship is three months. If you're still alive at the end, we'll talk.\"\n\n\"Is that a target?\" asked Minh.\n\n\"That's my objective,\" said Grace. \"You have a lot of responsibility here. A lot of tasks. If you achieve them, that's an achievement. If not, you'll be a very well-trained coffee maker.\"\n\nOn the bus home, Minh was exhausted. But he was smiling. The workplace was small, old and noisy. The pay was terrible. But he had found something he loved. Maybe, one day, he would be unskilled at nothing and skilled at this. He wanted to import every lesson and export every story.", "words": 710, "new": [{"w": "workforce", "p": "n", "vi": "lực lượng lao động"}, {"w": "supervisor", "p": "n", "vi": "người giám sát"}, {"w": "executive", "p": "n/adj", "vi": "giám đốc điều hành"}, {"w": "chairman", "p": "n", "vi": "chủ tịch"}, {"w": "founder", "p": "n/v", "vi": "người sáng lập"}, {"w": "entrepreneur", "p": "n", "vi": "doanh nhân"}, {"w": "consultant", "p": "n", "vi": "chuyên gia tư vấn"}, {"w": "trainee", "p": "n", "vi": "người tập sự"}, {"w": "apprentice", "p": "n/v", "vi": "người học nghề"}, {"w": "duty", "p": "n/adj", "vi": "nhiệm vụ"}, {"w": "perk", "p": "n/v", "vi": "đặc quyền nhỏ"}, {"w": "paycheck", "p": "n", "vi": "tiền lương"}, {"w": "union", "p": "n", "vi": "công đoàn"}, {"w": "strike", "p": "v/n", "vi": "đình công"}, {"w": "earnings", "p": "n", "vi": "thu nhập"}, {"w": "turnover", "p": "n", "vi": "doanh số"}]}, {"id": "W27-3", "title": "The Digital Newspaper", "body": "The Riverford Gazette had a problem: fewer people bought the paper version every year. \"Young people don't buy newspapers,\" said Grace. \"They read everything on their phones. We need a better website. We need to be on social media. We need a new strategy.\"\n\nShe gave Minh a new task. \"You're young. You understand this. Help us.\"\n\nMinh was not an expert, but Sam was. Sam's design firm was small, but they had made websites for many companies. Minh asked him for help. Sam came to the office with his laptop. He looked at the Gazette's homepage and made a face.\n\n\"This looks like 2005,\" he said. \"The links don't work. You can't scroll properly on a phone. There's no touchscreen design. And look at this icon. Is that a newspaper or a sandwich?\"\n\nGrace laughed. \"That's why we need you. Our objective is simple: more readers. The paper has no shares, no rich owners, just us.\"\n\nSam made a **proposal**. He wrote it like a professional. There was an **agenda** for the first meeting. He made a presentation with a spreadsheet of costs. At the meeting, they discussed it. Minh wrote the minutes. Then they had to negotiate the price. The Gazette had very little money.\n\n\"Look,\" said Sam. \"I'll do it cheap. In return, you put my company's logo on the website. Free advertising.\"\n\n\"Deal,\" said Grace.\n\nThey started a campaign to launch the new website. They made a slogan: \"Riverford Gazette: Your Town, Your News.\" Sam designed it. Ellie became a blogger and wrote a blog about life in Riverford. Bill the photographer started a podcast where he told stories about his forty years of photos. Minh started writing a weekly column about The Blue Cup and the people who came there.\n\nThe new website was very efficient. It worked on phones, laptops and tablets. It had a simple login page. You could make a profile with a username, change your settings, and subscribe to the newsletter. Readers could leave a comment under every article. The efficiency of the system surprised Grace. \"In the old days, it took a week to change anything,\" she said. \"Now it takes a second.\"\n\nBut there were problems too. One night, a hacker tried to hack the website. Sam had to update the security. Someone put spam in the comments, hundreds of messages selling medicine. The inbox was full of strange emails with dangerous attachments. \"Never open an attachment from someone you don't know,\" said Sam. Grace said she understood. Then she opened one. Sam had to uninstall three programs from her computer.\n\nMinh learned a lot about technology. He learned about coding: Sam showed him how the code behind the website functioned. He learned how a database stored every article. He learned how to use different browsers to test the website. He learned that every sensor in a phone, the GPS that tells you where you are, the wireless connection, the Bluetooth for your headphones, all sent information. \"Your phone knows everything about you,\" said Sam. \"Every tab you open. Every time you zoom in on a photo. Where your cursor goes.\"\n\n\"That's frightening,\" said Minh.\n\n\"That's modern life,\" said Sam.\n\nThe new website was a success. In the first month, the number of readers doubled. Young people started to follow the Gazette online. Ellie's blog had a thousand followers. Bill's podcast was streaming on every app. The paper version still sold to old people, and the digital version reached everybody else.\n\nThe Gazette was no longer just a **competitor** to the big newspapers. It was a local partnership: the paper, the café, Sam's company, the town. A big agency from London called Grace. They wanted to buy advertisements. Their **agent** said: \"Your local content is very valuable. People trust local news.\"\n\nGrace was delighted. At the next **conference** of local newspapers, she gave a talk about their success. She wrote a memo to the staff afterwards: \"Thank you, everybody. Especially our intern, who brought his clever friend. Our policy from now on: digital first.\"\n\nMinh read the memo three times. Then he forwarded it to his parents in Vietnam. His father, who didn't read English, asked Lan to translate. Then he called Minh. \"Your boss says thank you to you?\" he said. \"In writing? Then you are doing well, son.\"\n\n\"I'm just an intern, Dad.\"\n\n\"An intern who gets a thank you letter,\" said his father. \"That's not just an intern.\"\n\nMinh smiled. He put his phone down. On his desk, there was a new voicemail from Grace: \"Minh. Come early tomorrow. Big story. You and Ellie. Bring your notebook.\" He wondered what it could be. He didn't have to wait long to find out. He would soon learn to operate in a real newsroom on a real case. The USB stick in his pocket held all his notes. The operating system of his old laptop was slow, but he didn't care. He was ready.", "words": 825, "new": [{"w": "agent", "p": "n", "vi": "đại lý"}, {"w": "competitor", "p": "n", "vi": "đối thủ"}, {"w": "conference", "p": "n", "vi": "hội nghị"}, {"w": "agenda", "p": "n", "vi": "chương trình họp"}, {"w": "proposal", "p": "n", "vi": "đề xuất"}]}, {"id": "W28-1", "title": "The Rumor", "body": "The big story Grace talked about began with a **rumor**. Someone wrote on social media that the town council was going to close the Riverford hospital and move it to the city. The post went viral. In one day, ten thousand people shared it. It was trending on every app. People were angry and afraid.\n\n\"Is it true?\" Grace asked at the morning meeting. \"That's our job. Find out.\"\n\nShe sent Minh and Ellie to investigate. On the way out, Minh's old laptop began to freeze, as usual. He had to restart it twice and reboot the internet router. \"Make a backup of everything,\" said Grace. \"Always.\" The Gazette had no automatic system for saving files. \"One day we'll automate it,\" she said. \"Maybe an artificial intelligence will do my job. A virtual editor. Until then, I'm the editor here.\" \"This is real **journalism**,\" she said. \"Not cats in trees. Be careful. Check everything.\"\n\nThey started with the post. It came from an **influencer** with fifty thousand followers who usually posted about fashion. She didn't say where she got the information. \"It might be fake,\" said Ellie. \"Or it might be true. We need a source.\"\n\n\"A political scandal like this could be huge,\" said Ellie. \"If it's true.\" They called the hospital. The press office said: \"No comment.\" They called the council. \"We will announce our plans later. No announcement has been made,\" said a spokesperson. That was not a no.\n\nMinh had an idea. \"Hana works at the hospital. Maybe she's heard something.\"\n\nHana had heard something. \"There's **gossip** in the staff room,\" she said. \"Everyone's worried. But nobody knows anything official.\"\n\nEllie found a document on the council website: the minutes of a meeting from last month. It was very long and boring. But on page forty, there was a short sentence: \"The committee discussed possible changes to local health services.\" That was all.\n\n\"It's not proof,\" said Grace. \"But it's something.\"\n\nThey kept working. Minh went to a public meeting of the council. A politician stood up to answer questions. The room was full of angry people. \"There are no plans to close the hospital,\" he said. \"Not at this time.\"\n\n\"Not at this time?\" said Minh, standing up. \"Does that mean in the future?\"\n\nThe politician looked uncomfortable. \"I can't comment on the future.\"\n\nThe next day, the story was in every newspaper. The big national **tabloids** had dramatic headlines: \"TOWN TO LOSE HOSPITAL!\" The serious **broadsheet** papers were more careful. On TV, a **bulletin** on the evening news had a short report. A national **columnist** wrote that small towns were being forgotten by the government.\n\nBut the Gazette did something different. Grace wrote an **editorial**. She explained what was known and what was not known. \"We don't publish rumors,\" she wrote. \"We publish facts. Here are the facts. Here are the questions. We will keep asking until we get answers.\"\n\nIt was informative, calm and clear. Readers loved it. For a small publication, it was a big moment. The website had its biggest day ever. Hundreds of new subscribers signed up. Readers, viewers of the local TV news and listeners of local radio all quoted the Gazette.\n\nSome people were angry, though. A local **critic** wrote that the Gazette was biased against the council. Others said the opposite. \"If both sides are angry with you,\" said Grace, \"you're probably doing a good job.\"\n\nThere was also a question of privacy. Ellie found the name of a nurse who said the hospital was closing. \"Do we use her name?\" asked Minh.\n\n\"No,\" said Grace firmly. \"She'll lose her job. We protect our sources. Always.\"\n\nA week later, the truth came out. The council had a plan, but not to close the hospital. They wanted to move one small department to the city. The influencer's post was exaggerated. But it wasn't completely false.\n\nAt the end of the week, Grace called Minh into her office. \"You asked the right question at that meeting,\" she said. \"'Does that mean in the future?' That one question made the whole story.\"\n\n\"I was just curious,\" said Minh.\n\n\"Curiosity is a journalist's best tool,\" said Grace. \"Never lose it.\"\n\nThat evening, Minh thought about what he had learned. In Vietnam, newspapers were controlled by the government. There was **censorship**. Journalists could not **censor** themselves completely, but they had to be careful. Here, the press was free. In a **democracy**, the press could ask questions of a minister, a member of **parliament**, even the prime minister. That freedom was important. It came with responsibility, too.\n\nHe thought about politics and society. Britain was a **democratic** country, but also a **monarchy**, with a king. America was a **republic**, with a president and a **congress** with two parts, the House and the Senate. Some countries had a **dictator**. Every system was different. But in every system, he thought, people needed the truth.\n\nHe wrote it all in his notebook. Then he wrote a new column for the next edition of the Gazette. It was called \"Questions.\" It was about why asking questions matters. The publisher of the Gazette, an old friend of Grace's, read it and said it was the best **commentary** of the year. Grace put it on the front page. That kind of coverage for an intern was unusual. Nobody, not even Grace, used the word criticism that week. It was all praise. The story was not reality TV or a sitcom. It was real.", "words": 914, "new": [{"w": "journalism", "p": "n", "vi": "nghề báo"}, {"w": "columnist", "p": "n", "vi": "người viết chuyên mục"}, {"w": "critic", "p": "n", "vi": "nhà phê bình"}, {"w": "commentary", "p": "n", "vi": "lời bình luận"}, {"w": "bulletin", "p": "n", "vi": "bản tin"}, {"w": "tabloid", "p": "adj/n", "vi": "báo lá cải (tin giật gân, khổ nhỏ)"}, {"w": "broadsheet", "p": "n", "vi": "báo khổ lớn (tin chính thống, chất lượng)"}, {"w": "gossip", "p": "n/v", "vi": "chuyện ngồi lê đôi mách"}, {"w": "rumor", "p": "n", "vi": "tin đồn"}, {"w": "influencer", "p": "n", "vi": "người có ảnh hưởng (trên mạng xã hội)"}, {"w": "censor", "p": "n/v", "vi": "kiểm duyệt"}, {"w": "censorship", "p": "n", "vi": "kiểm duyệt"}, {"w": "editorial", "p": "adj/n", "vi": "bài xã luận"}, {"w": "parliament", "p": "n", "vi": "quốc hội"}, {"w": "congress", "p": "n", "vi": "quốc hội"}, {"w": "democracy", "p": "n", "vi": "nền dân chủ"}, {"w": "democratic", "p": "adj", "vi": "(thuộc) dân chủ"}, {"w": "dictator", "p": "n", "vi": "nhà độc tài"}, {"w": "republic", "p": "n", "vi": "nước cộng hoà"}, {"w": "monarchy", "p": "n", "vi": "chế độ quân chủ"}]}, {"id": "W28-2", "title": "The Burglaries", "body": "In January, there was a wave of crime in Riverford. Five houses were broken into in two weeks. A **burglar** came at night, when people were sleeping, and took jewelry, laptops and money. The police said it was a **burglary** gang from the city.\n\nGrace sent Minh to cover the story. He interviewed the victims. One old woman cried when she talked about it. \"He took my wedding ring,\" she said. \"It's not worth much money. But my husband gave it to me fifty years ago.\"\n\nMinh felt angry. He wanted to help. But a journalist's job was to report, not to catch **criminals**.\n\nThe police were working hard. Minh talked to a detective called Inspector Shah. She explained the difference between crimes. \"A burglary is when someone breaks into a building to steal. A **robbery** is when someone uses violence or threats. Theft is the general word for stealing. A **shoplifter** steals from shops. A **pickpocket** steals from your pocket in the street.\"\n\n\"Have you had any **murders** in Riverford?\" asked Minh.\n\n\"The last **murder** was in 1987,\" said Inspector Shah. \"The **murderer** is still in prison. Riverford is a safe town. Mostly. We have some **vandalism**, young people breaking windows and painting walls. Some **shoplifting**. A few years ago, there was a case where someone tried to **kidnap** a child, but it was a misunderstanding with a father. Mostly, it's small things.\"\n\nTwo weeks later, the police made an **arrest**. A young man was caught at three in the morning, climbing through a window. They found the stolen jewelry in his car. The old woman got her ring back. Minh wrote the story.\n\nBut then there was a surprise. The young man said he was **innocent**. He said he was climbing into his girlfriend's house, not stealing. And the jewelry was not his car; it was his brother's car. The police **charged** him with burglary anyway.\n\nThere was a **trial** at the court in the city. Minh went every day for a week. He had never been to a court. It was very formal. The judge wore a wig. There was a **jury** of twelve ordinary people who would decide if the man was guilty or not.\n\nA **witness** said she saw the man in the street on the night of one of the burglaries. Another witness, the man's girlfriend, said he was with her all night. The lawyers argued. They **accused** each other of lying.\n\nMinh found it fascinating and sad. The man was young, about his age. He looked frightened. His mother sat behind him every day. She was an immigrant from Eastern Europe. She told Minh, in the corridor, that her son had made mistakes but was not a thief. \"People see a foreigner and think criminal,\" she said. \"This is **discrimination**. It's **racism**.\"\n\nMinh did not know what to believe. He wrote both sides carefully.\n\nIn the end, the jury decided that the man was guilty of two burglaries but not the others. His **punishment** was two years in prison. As a **prisoner**, he would have the chance to study and work. His mother cried in the corridor.\n\nAfter the trial, Minh talked to Grace. \"Was it unfair?\" he asked. \"Maybe he was **innocent** of some of it. Maybe people judged him because he's an immigrant.\"\n\n\"Maybe,\" said Grace. \"The courts aren't perfect. That's why we report on them. Justice needs light.\"\n\nGrace told him about the bigger problems in society: inequality between rich and poor, the **rights** of **refugees** and immigrants, homelessness in the city. \"There's more **sexism** and racism than people think,\" she said. \"And there's a **minority** of people who are **racist** and loud. But the **majority** of people are kind. Our job is to show both.\"\n\nThat evening, Minh walked past a homeless man sitting outside the train station. He had walked past him many times. Today, he stopped. He bought him a coffee and a sandwich and sat with him for ten minutes. The man's name was Pete. He had been a soldier. He had lost his job, then his house, then his family.\n\n\"Thank you,\" said Pete. \"Most people don't see me.\"\n\nMinh thought about equality, and human **rights**, and how easily anyone could fall. On the bus home, he wrote a note in his book: \"Next story: Pete.\" He knew Grace would say yes.\n\nIn the **kingdom** of Britain, which was once an empire that ruled a quarter of the world, there were still people sleeping on the street. Someone had to elect to see them. Someone had to tell their story. The government could ban a lot of things, Grace said, and **punish** a lot of people. But it couldn't ban the truth. A **vandal** could break a window; a good story could open one.", "words": 798, "new": [{"w": "kingdom", "p": "n", "vi": "vương quốc"}, {"w": "majority", "p": "n/adj", "vi": "đa số"}, {"w": "minority", "p": "n/adj", "vi": "thiểu số"},       }, 250);
      u.onstart = () => { t0 = performance.now(); };
      u.onboundary = e => {
        if (my !== token) return;
        gotBoundary = true;
        markAt(e.charIndex);
      };
      u.onend = () => {
        clearInterval(guessTimer);
        const sec = (performance.now() - t0) / 1000;
        if (!gotBoundary && sec > 2) charsPerSec = (charsPerSec + text.length / sec / rate) / 2;
        play(c + 1);
      };
      u.onerror = e => { clearInterval(guessTimer); if (my === token && e.error !== "interrupted" && e.error !== "canceled") play(c + 1); };
      speechSynthesis.speak(u);
    };
    play(0);
  }
  $("listen").onclick = () => {
    if (speaking) { stopSpeak(); return; }
    const sents = [...main.querySelectorAll(".s")];
    const last = sents.findIndex(x => x.classList.contains("last"));
    playFrom(last > 0 ? last : 0);
  };

  render();
})();
</script>
</body>
</html>
