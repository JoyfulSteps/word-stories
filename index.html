 rent. **Currently**, I pay two thousand a month. From next month, it's four thousand.\"\n\n\"That's crazy,\" said Jess.\n\n\"It's legal,\" said Daniel. \"I can't cancel the contract, and neither can he. \"The contract ends in June. If I can't pay, I have to leave.\"\n\nEveryone was quiet. \"There must be something we can do,\" said Minh.\n\n\"I've tried everything,\" said Daniel. \"I've asked the new owner to postpone the increase. He said no. I asked him to **prolong** the old contract for one year. He said no. I've even asked the bank for a loan. They said no too. And I already have some **overdue** bills.\"\n\n\"What does the new owner want to do with the building?\" asked Pat.\n\n\"Make flats. Expensive ones. **Contemporary** apartments for London people who want a weekend house.\" Daniel looked around the café. \"He says this place is **outdated**.\"\n\nMinh looked around too. The old wooden floor. The photos on the wall. The **chopstick** jar he had put on the counter for Vietnamese customers. The **former** bank counter that Daniel used for the coffee machine. \"This place isn't outdated,\" he said. \"It's history.\"\n\nPat spoke. She had worked in cafés for forty years. \"This café has been here for a long time,\" she said. \"**Previously**, before Daniel, it was a tea shop. **Formerly**, a hundred years ago, it was a bakery. It's been a meeting place for this town for most of a **millennium**, if you count the old inn that was here before.\" She was exaggerating, but only a little.\n\n\"I know,\" said Daniel. \"But history doesn't pay the rent.\"\n\nThey talked for hours. Jess suggested a temporary solution: a crowdfunding page online. Pat suggested asking the customers for help. Minh suggested a big event to raise money.\n\n\"The town loves this place,\" said Minh. \"Old people, young people, students. Grandma Rose has been coming here for her whole lifetime. We frequently get fifty customers on a Saturday. **Regularly** people say it's the best café in Riverford.\"\n\n\"People say a lot of things,\" said Daniel. \"But will they pay?\"\n\n\"Let's find out,\" said Minh.\n\nThey made a plan. **Shortly** after that night, they put a sign in the window: \"Save The Blue Cup!\" They started an online page. They asked customers to sign a letter to the new owner.\n\nThe response was instant. Almost **instantly**, a hundred people signed. Then two hundred. People who rarely spoke to anyone came to the counter and said, \"I'm sorry. What can I do?\" Even the old judge who did the crossword, who **seldom** spoke, wrote a long letter.\n\nBut the money came slowly. After a month, they had five thousand pounds. They needed at least twenty-four thousand for one year of the higher rent.\n\n\"It's a long road,\" said Daniel. \"And the duration is short. We have three months.\"\n\nMinh **constantly** thought about the café. In the interval between classes, he made posters. At night, he wrote emails. Hana helped. Sam designed a beautiful logo. \"This is the first phase,\" said Sam. \"Phase two is bigger.\"\n\n\"What's phase two?\" asked Minh.\n\n\"I don't know yet. But there will be one.\"\n\nOccasionally, Minh felt hopeless. Then he remembered something Grandma Rose said: \"Nothing is permanent. Not good times, not bad times.\" He told himself that this was just a hard moment, not a **lasting** one. And he started planning the **upcoming** event, the biggest one yet.\n\nBetween the two choices, giving up or fighting, the **latter** was the only one he could imagine. **Subsequently**, he would think of this as the moment he grew up. Not the flight to England. Not the move to the city. This. **Afterward**, nothing was quite the same, but **beforehand**, he did not know that. Something good had to come overnight. It didn't. It took months.", "words": 723, "new": [{"w": "chopstick", "p": "n", "vi": "chiếc đũa"}, {"w": "era", "p": "n", "vi": "thời đại, kỷ nguyên"}, {"w": "millennium", "p": "n", "vi": "thiên niên kỷ"}, {"w": "former", "p": "adj/n", "vi": "trước đây"}, {"w": "latter", "p": "adj/pron", "vi": "cái sau"}, {"w": "seldom", "p": "adv", "vi": "hiếm khi"}, {"w": "constantly", "p": "adv", "vi": "liên tục"}, {"w": "regularly", "p": "adv", "vi": "đều đặn"}, {"w": "instantly", "p": "adv", "vi": "ngay lập tức"}, {"w": "shortly", "p": "adv", "vi": "chẳng bao lâu"}, {"w": "currently", "p": "adv", "vi": "hiện nay"}, {"w": "formerly", "p": "adv", "vi": "trước đây"}, {"w": "previously", "p": "adv", "vi": "trước đây"}, {"w": "subsequently", "p": "adv", "vi": "sau đó"}, {"w": "afterward", "p": "adv", "vi": "sau đó"}, {"w": "beforehand", "p": "adv", "vi": "trước"}, {"w": "overdue", "p": "adj", "vi": "quá hạn"}, {"w": "prolong", "p": "v", "vi": "kéo dài"}, {"w": "lasting", "p": "adj", "vi": "lâu dài"}, {"w": "contemporary", "p": "adj/n", "vi": "đương đại"}, {"w": "upcoming", "p": "adj", "vi": "sắp tới"}, {"w": "outdated", "p": "adj", "vi": "lỗi thời"}]}, {"id": "W23-3", "title": "The Flood", "body": "In March, the weather in Riverford went crazy. It started with a light **drizzle** that lasted for three days. Then the sky became dark and **overcast**. Then came the **downpour**. It rained heavily for a whole week. The river became wide and brown and fast.\n\n\"I've never seen it like this,\" said Grandma Rose, looking out of the window. \"Not since 1968.\"\n\nThe weather forecast was terrible. A big **thunderstorm** was coming, with a **gale** from the west. On the news, they talked about the danger of a **flood**. In some places, there was even **sleet**: rain and snow at the same time.\n\nMinh was worried. He remembered the floods in his town in Vietnam. Every year, in the monsoon season, the river came up. But in Vietnam, people were ready. They had the experience. Here, nobody seemed ready.\n\nOn Friday night, the storm arrived. The wind was strong, with sudden **gusts** that shook the trees. Thunder and lightning lit up the sky. The rain fell like water from a bucket. By midnight, the river was over its banks.\n\nMinh got a call from Daniel at two in the morning. \"The café,\" Daniel said. \"The water is coming in.\"\n\nMinh took a taxi from the city. Hana came too. When they arrived, the street in front of The Blue Cup was a river. There were **puddles** as big as swimming pools. Water was coming under the door of the café. Daniel, Jess and Pat were trying to stop it with bags of sand.\n\nThey worked all night. They carried chairs, tables and boxes upstairs. They moved the coffee machine. They saved the photos from the walls. But they could not stop the water. By morning, the floor of the café was under thirty centimeters of brown water.\n\nWhen the sun came up, the rain stopped. Everything was quiet. There was a strange, clean **sunshine**. Daniel stood in the water in his café and looked around. He did not say anything.\n\n\"I'm sorry, Daniel,\" said Minh.\n\n\"It's fine,\" said Daniel. Then he sat down on the stairs and put his head in his hands.\n\nFor the next two weeks, the whole town cleaned. The weather changed again, as English weather always does. First, it was **damp** and cold. Then it was warm and **muggy**, with high **humidity**. Everything smelled of **moisture** and mud. There was **dew** on the grass every morning. The café walls were wet. Daniel had to use machines to dry them.\n\nThen, strangely, there was a short **heatwave**. In March! The temperature went up to twenty-two degrees. People sat in the **shade** of the trees, and the **sunlight** dried the streets. \"It's **scorching**,\" said Leo, wearing shorts. It was not scorching. It was just warm. But for England in March, it was a lot.\n\n\"English weather is so **changeable**,\" said Hana. \"So **unpredictable**. In Japan, the seasons are more **settled**.\"\n\n\"In Vietnam, we have **typhoons**,\" said Minh. \"Big storms, like a **hurricane** in America. And sometimes a **drought** in the dry season, with no rain for months. But we never have a **tornado** or a **blizzard**.\"\n\n\"We have everything here,\" said Grandma Rose. \"Just small. Small floods. Small storms. Small summers.\"\n\nMinh laughed, but he was thinking about Daniel. The flood had made everything worse. The café needed repairs. The insurance would pay some, but not all. And the rent was still going up in June.\n\nThat evening, he walked by the river. It was calm again, shining in the evening light. His **shadow** was long on the path. He stood and thought for a long time.\n\nThen he had an idea.", "words": 603, "new": [{"w": "drizzle", "p": "n/v", "vi": "mưa phùn"}, {"w": "downpour", "p": "n", "vi": "mưa như trút"}, {"w": "flood", "p": "v/n", "vi": "lũ"}, {"w": "drought", "p": "n", "vi": "hạn hán"}, {"w": "hurricane", "p": "n", "vi": "bão lớn"}, {"w": "typhoon", "p": "n", "vi": "bão nhiệt đới"}, {"w": "tornado", "p": "n", "vi": "lốc xoáy"}, {"w": "blizzard", "p": "n", "vi": "bão tuyết"}, {"w": "heatwave", "p": "n", "vi": "đợt nắng nóng"}, {"w": "thunderstorm", "p": "n", "vi": "giông bão"}, {"w": "gale", "p": "n", "vi": "gió mạnh"}, {"w": "gust", "p": "n", "vi": "cơn gió giật"}, {"w": "sleet", "p": "n", "vi": "mưa tuyết"}, {"w": "puddle", "p": "n", "vi": "vũng nước"}, {"w": "humidity", "p": "n", "vi": "độ ẩm"}, {"w": "moisture", "p": "n", "vi": "độ ẩm"}, {"w": "dew", "p": "n", "vi": "sương"}, {"w": "overcast", "p": "adj", "vi": "u ám"}, {"w": "sunshine", "p": "n", "vi": "ánh nắng"}, {"w": "sunlight", "p": "n", "vi": "ánh nắng"}, {"w": "shade", "p": "n/v", "vi": "bóng râm"}, {"w": "shadow", "p": "n", "vi": "bóng"}, {"w": "damp", "p": "adj", "vi": "ẩm"}, {"w": "muggy", "p": "adj", "vi": "oi bức"}, {"w": "scorching", "p": "adj", "vi": "nóng như thiêu"}, {"w": "settled", "p": "adj", "vi": "ổn định"}, {"w": "changeable", "p": "adj", "vi": "hay thay đổi"}, {"w": "unpredictable", "p": "adj", "vi": "khó dự đoán"}]}, {"id": "W23-4", "title": "Around the World in One Evening", "body": "Minh's idea was simple. \"Let's have an evening of travel stories,\" he said. \"People pay ten pounds to come. Speakers talk about places they've been. All the money goes to the café.\"\n\nDaniel was not sure. \"Who wants to listen to holiday stories?\"\n\n\"Everyone,\" said Minh. \"If they're good stories.\"\n\nSo they organized it. They called it \"Around the World in One Evening.\" They found six speakers. The café was not ready yet after the flood, so the church let them use its hall. They sold a hundred tickets in a week.\n\nThe first speaker was Ffion, the scientist from Wales. She talked about Iceland. She showed photos of a huge **glacier**, a river of ice moving slowly down a mountain. She showed an **iceberg** in a **bay**, white and blue. \"Ninety percent of an iceberg is under the water,\" she said. \"Only ten percent is on the surface.\"\n\nThe second speaker was Sam. He talked about Spain. He showed his family's village, on a dry **plateau** high above the sea, and the beautiful **scenery** of the south coast. \"On a clear day, from the **summit** of the mountain, you can see Africa,\" he said. \"Another **continent**, just across the sea.\"\n\nThe third speaker was an old customer, a retired teacher who had traveled everywhere. He talked about America. He showed photos of the Grand **Canyon**, deep and red. He talked about the wide **prairie** in the middle of the country, flat grass for thousands of kilometers. \"In the old days, millions of buffalo lived on the prairie,\" he said. He also showed a **swamp** in Florida, full of alligators, and a **marsh** with tall birds. \"Every **region** of America is different. It's not one country. It's fifty.\"\n\nThe fourth speaker was Hana. She was nervous, but she talked about Japan. She showed Mount Fuji, with snow on its **peak**, and the steep **slope** that people climb every summer. She talked about the **seasonal** changes: cherry flowers in spring, red leaves in autumn. \"In June, we have the rainy season,\" she said. \"Like a small **monsoon**.\"\n\nThen Minh talked about Vietnam. He showed the long, thin shape of the country. \"Vietnam is like an S. At the top is the north, where I'm from. In the south, there's the Mekong Delta, where the river meets the sea.\" He showed Ha Long **Bay**, with thousands of rock islands. He showed the **tropical** **rainforest** in the mountains, the beaches, and the green rice fields. He talked about the **Gulf** of Tonkin and the old French **canal** in Saigon. \"Vietnam has a long coast. We live with the sea, the **tide** and the rain.\"\n\nThe last speaker was Gareth, Ffion's father. He talked about a trip to Australia. He showed a photo of the Great Barrier **Reef**, with colorful **coral** and fish. \"The coral is dying because the water is getting too warm,\" he said seriously. He also showed a green **oasis** in the desert, like a dream in the middle of the sand, and a beautiful **meadow** of flowers in the mountains. He talked about an Australian **peninsula** and a **ridge** of red rock. \"Australia is a huge **territory**,\" he said. \"You can drive for three days and see nobody.\"\n\nAt the end, everybody clapped. People stayed for tea and cake. They talked about the places they wanted to see.\n\nWhen they counted the money, they had raised two thousand pounds. \"That's amazing,\" said Daniel. He looked tired, but happy. \"Thank you. All of you.\"\n\n\"It's not enough,\" said Minh.\n\n\"No,\" said Daniel. \"But it's something. Every pound helps.\"\n\nOn the way home, Hana held Minh's hand. \"Where do you want to go most in the world?\" she asked.\n\n\"Everywhere,\" said Minh. \"But first, I want this café to stay open.\"\n\n\"Me too,\" said Hana. \"Then everywhere. Together.\"", "words": 636, "new": [{"w": "seasonal", "p": "adj", "vi": "theo mùa"}, {"w": "tropical", "p": "adj", "vi": "nhiệt đới"}, {"w": "monsoon", "p": "n", "vi": "gió mùa"}, {"w": "rainforest", "p": "n", "vi": "rừng mưa nhiệt đới"}, {"w": "scenery", "p": "n", "vi": "phong cảnh"}, {"w": "continent", "p": "n", "vi": "châu lục"}, {"w": "region", "p": "n", "vi": "vùng, khu vực"}, {"w": "territory", "p": "n", "vi": "lãnh thổ"}, {"w": "peninsula", "p": "n", "vi": "bán đảo"}, {"w": "bay", "p": "n/v", "vi": "vịnh"}, {"w": "gulf", "p": "n", "vi": "vịnh lớn"}, {"w": "canal", "p": "n", "vi": "kênh đào"}, {"w": "glacier", "p": "n", "vi": "sông băng"}, {"w": "iceberg", "p": "n", "vi": "tảng băng trôi"}, {"w": "plateau", "p": "n/v", "vi": "đạt mức ổn định, đi ngang"}, {"w": "slope", "p": "n", "vi": "sườn dốc"}, {"w": "peak", "p": "n/adj/v", "vi": "đạt đỉnh"}, {"w": "summit", "p": "n", "vi": "đỉnh núi"}, {"w": "ridge", "p": "n", "vi": "sống núi"}, {"w": "canyon", "p": "n", "vi": "hẻm núi"}, {"w": "swamp", "p": "n", "vi": "đầm lầy"}, {"w": "marsh", "p": "n", "vi": "đầm lầy cỏ"}, {"w": "meadow", "p": "n", "vi": "đồng cỏ"}, {"w": "prairie", "p": "n", "vi": "thảo nguyên"}, {"w": "oasis", "p": "n", "vi": "ốc đảo"}, {"w": "reef", "p": "n", "vi": "rạn"}, {"w": "coral", "p": "n", "vi": "san hô"}, {"w": "tide", "p": "n", "vi": "thủy triều"}]}, {"id": "W23-5", "title": "The Highlands", "body": "In April, Margaret invited Minh and Hana to visit her in Scotland. \"Come for Easter,\" she said on the phone. \"I'll show you my rivers. And you need a break. Rose tells me you're working too hard for that café.\"\n\nThey took the train north. It was a long journey, five hours. Minh watched the landscape change. First, the **urban** areas around the city: houses, factories, roads. Then the **rural** areas: farms, villages, fields. Then, after the **border** between England and Scotland, everything became wilder. There were mountains, lakes and long empty valleys.\n\nMargaret met them at the station with Fiona. She was as funny as ever. \"You look tired,\" she said to Minh. \"Rose was right. Tomorrow, no work. Just nature.\"\n\nThe next day, Fiona drove them into the Highlands. The roads were narrow and **scenic**. They stopped at a famous **landmark**, an old castle on the **edge** of a dark lake. The water was so clear it looked like **crystal**. They could see the stones on the bottom.\n\n\"There's a famous monster in one of these lakes,\" said Fiona. \"But nobody's seen it.\"\n\n\"Is it a **reptile**?\" asked Hana. \"Like a dinosaur?\"\n\n\"Some people think so. I think it's a story for tourists.\"\n\nThey walked up a hill. At the top, the view was amazing. Mountains everywhere. A **herd** of deer was eating grass on the next hill. A **flock** of sheep moved slowly across a field below. In the sky, a big bird was flying in circles. \"A golden eagle,\" said Margaret. \"The largest **species** of bird in Scotland.\"\n\n\"Do you have a lot of animals here?\" asked Minh.\n\n\"Many. Every **creature** you can imagine. Deer, foxes, wild cats. Seals on the coast, which are **mammals**, like us. And in summer, a **swarm** of tiny flies called midges. They are the worst creature on earth. They bite everything.\"\n\nMargaret's neighbor kept bees. On the way back, they stopped to see his **hive**. He gave them a jar of heather honey. \"It's the best honey in the world,\" he said. \"Because the bees eat the heather on the mountains.\"\n\nThat evening, at Margaret's house, they looked at an old map of the world on her wall. Hana found Japan and Minh found Vietnam. \"We're so far away,\" said Hana. \"Look. Scotland is so far north. Almost at the North **Pole**.\"\n\n\"Not quite,\" said Margaret. \"But very north. The **latitude** of Edinburgh is fifty-six degrees. Your Hanoi is twenty-one. That's why our winters are so dark.\"\n\nMinh traced the line of the **equator** with his finger. \"Vietnam is in the northern **hemisphere** too,\" he said. \"But close to the middle. Hot all the time.\"\n\n\"And **longitude**?\" asked Hana.\n\n\"That's the other direction,\" said Margaret. \"East and west. Rose and I learned it in school. Our teacher said it was the most important **geographical** fact we'd ever learn. We never used it once.\"\n\nMargaret's house was full of interesting things. On a shelf, there was a piece of black **coal** from a Scottish mine where her grandfather worked. There was an old **copper** kettle and a **steel** knife from Sheffield. In a small box, there was her mother's ring, with a tiny **diamond**. \"It's not a big **gem**,\" she said. \"But it's the most valuable thing I have.\"\n\n\"What was the **source** of the river we saw today?\" Minh asked.\n\n\"Up in the mountains,\" said Margaret. \"A small spring, under a rock. Every big river starts small. Remember that.\"\n\nMinh thought about The Blue Cup. Every big thing starts small. Maybe the café could be saved, one small step at a time.\n\nOn the train home, Hana fell asleep on his shoulder. Minh looked out of the window at the **surface** of the lakes, shining in the evening sun. He felt rested and ready. It was time to go back and fight.", "words": 642, "new": [{"w": "source", "p": "n/v", "vi": "nguồn"}, {"w": "edge", "p": "n/v", "vi": "mép, rìa"}, {"w": "surface", "p": "n/v/adj", "vi": "bề mặt"}, {"w": "border", "p": "n", "vi": "biên giới"}, {"w": "landmark", "p": "n", "vi": "địa danh"}, {"w": "pole", "p": "n", "vi": "cực địa lý"}, {"w": "equator", "p": "n", "vi": "đường xích đạo"}, {"w": "hemisphere", "p": "n", "vi": "bán cầu"}, {"w": "latitude", "p": "n", "vi": "vĩ độ"}, {"w": "longitude", "p": "n", "vi": "kinh độ"}, {"w": "geographical", "p": "adj", "vi": "thuộc địa lý"}, {"w": "rural", "p": "adj", "vi": "nông thôn"}, {"w": "urban", "p": "adj", "vi": "thuộc đô thị"}, {"w": "scenic", "p": "adj", "vi": "có cảnh đẹp"}, {"w": "crystal", "p": "n", "vi": "tinh thể"}, {"w": "gem", "p": "n", "vi": "đá quý"}, {"w": "diamond", "p": "n", "vi": "kim cương"}, {"w": "copper", "p": "n", "vi": "đồng"}, {"w": "coal", "p": "n", "vi": "than đá"}, {"w": "steel", "p": "n/v", "vi": "thép"}, {"w": "creature", "p": "n", "vi": "sinh vật"}, {"w": "mammal", "p": "n", "vi": "động vật có vú"}, {"w": "reptile", "p": "n", "vi": "bò sát"}, {"w": "species", "p": "n", "vi": "loài (nhóm sinh vật có thể sinh sản với nhau)"}, {"w": "herd", "p": "n/v", "vi": "đàn"}, {"w": "flock", "p": "n/v", "vi": "đàn chim, đàn cừu"}, {"w": "swarm", "p": "n", "vi": "đàn côn trùng"}, {"w": "hive", "p": "n", "vi": "tổ ong"}]}, {"id": "W24-1", "title": "Leo's New Passion", "body": "Leo's knee was getting better, but he still could not play football. He was bored and restless. Then, one Saturday in April, his therapist suggested something. \"There's a wildlife rescue center outside town. They need volunteers. Maybe you'd like it?\"\n\nLeo went, without much hope. He came back at six o'clock, muddy and excited. \"It was amazing,\" he said at dinner. \"Did you know there's a **hedgehog** hospital there? They have forty hedgehogs!\"\n\nFrom that day, Leo went every weekend. Minh came with him once, to see what it was like.\n\nThe center was in an old farm. It took in wild animals that were hurt or lost. A woman called Jo ran it. She had worked with animals all her life. \"We put them back into their natural **habitat** when they're well,\" she said. \"That's the goal.\"\n\nLeo showed Minh around. There was an **otter** with a hurt leg, swimming in a small pool. There was a family of baby **moles**, tiny and blind, found by a farmer. There was a fox cub whose mother was killed by a car. There was a **seagull** with a broken wing, and a little **sparrow** that a cat had attacked.\n\n\"Cats are terrible **predators**,\" said Jo. \"They kill millions of birds every year. The birds are their **prey**.\"\n\nLeo was good with the animals. He was patient and gentle. He fed the baby hedgehogs with a tiny bottle. \"They sleep in a **burrow** in the wild,\" he said. \"Or under a hedge. We make them little houses from boxes.\"\n\nMinh was surprised. He had never seen Leo like this: calm, careful, interested.\n\nIn the office, Jo had pictures of animals from all over the world on the wall. \"Before this, I worked in Africa,\" she said. She showed them photos. A **cheetah**, the fastest animal on land. A **leopard** in a tree. A big gray **rhinoceros**. \"We call it a **rhino** for short,\" she said. \"There are very few left. **Hunters** kill them for their horns.\"\n\n\"That's terrible,\" said Leo.\n\n\"It is,\" said Jo. There was also a photo of a huge **hippopotamus** in a river. \"The most dangerous animal in Africa,\" said Jo. \"More dangerous than a lion.\" And a herd of African **buffalo**. \"In Vietnam, you have water **buffalo**, don't you?\" she asked Minh.\n\n\"Yes, on the farms. They pull the plough in the rice fields. My grandfather had one.\"\n\nShe had also worked in America. She showed a picture of a **jaguar** from the South American jungle, an American **bison** on the prairie, and a huge **moose** in Canada. \"A moose can be two meters tall,\" she said. There were pictures of smaller animals too: a **beaver** building a dam, a **raccoon** with its black mask, and a black and white **skunk**. \"Never make a skunk angry,\" said Jo. \"It has a terrible smell.\"\n\n\"What about birds?\" asked Leo.\n\nJo showed him a **peacock** with its beautiful tail, an **ostrich** that could run faster than a horse, and a group of pink **flamingos** standing on one leg. \"Flamingos are pink because of the food they eat,\" she said.\n\nOn the way home, Leo talked all the time. \"I want to be a vet,\" he said. \"Or work in a place like that. Or in Africa, saving rhinos.\"\n\n\"I thought you wanted to be a football player,\" said Minh.\n\nLeo was quiet. \"Maybe I can do both,\" he said. \"But this feels important. Football is fun. This is... I don't know. It means something.\"\n\nAt home, Mia was in her room with a pet **hamster** her friend had given her. It lived in a cage on her desk and ran in its wheel all night. \"Leo, look! I have an animal too,\" she said.\n\nLeo looked at the hamster for a long time. \"His cage is too small,\" he said seriously. \"He needs a bigger **den**. And more things to climb. I'll make him one.\"\n\nMia stared at him. \"Who are you, and what have you done with my brother?\"", "words": 670, "new": [{"w": "den", "p": "n", "vi": "hang thú"}, {"w": "burrow", "p": "n/v", "vi": "hang đào"}, {"w": "habitat", "p": "n", "vi": "môi trường sống (của động vật)"}, {"w": "predator", "p": "n", "vi": "động vật săn mồi (động vật săn và giết động vật khác để ăn)"}, {"w": "prey", "p": "n", "vi": "con mồi"}, {"w": "hunter", "p": "n", "vi": "thợ săn"}, {"w": "cheetah", "p": "n", "vi": "báo săn"}, {"w": "leopard", "p": "n", "vi": "báo hoa mai"}, {"w": "jaguar", "p": "n", "vi": "báo đốm Mỹ"}, {"w": "rhino", "p": "n", "vi": "tê giác"}, {"w": "rhinoceros", "p": "n", "vi": "tê giác"}, {"w": "hippopotamus", "p": "n", "vi": "hà mã"}, {"w": "buffalo", "p": "n", "vi": "trâu"}, {"w": "bison", "p": "n", "vi": "bò rừng"}, {"w": "moose", "p": "n", "vi": "nai sừng tấm"}, {"w": "hedgehog", "p": "n", "vi": "nhím gai"}, {"w": "mole", "p": "n", "vi": "chuột chũi"}, {"w": "otter", "p": "n", "vi": "rái cá"}, {"w": "beaver", "p": "n", "vi": "hải ly"}, {"w": "raccoon", "p": "n", "vi": "gấu mèo"}, {"w": "skunk", "p": "n", "vi": "chồn hôi"}, {"w": "hamster", "p": "n", "vi": "chuột hamster"}, {"w": "peacock", "p": "n", "vi": "chim công trống"}, {"w": "ostrich", "p": "n", "vi": "đà điểu"}, {"w": "flamingo", "p": "n", "vi": "hồng hạc"}, {"w": "seagull", "p": "n", "vi": "chim hải âu"}, {"w": "sparrow", "p": "n", "vi": "chim sẻ"}]}, {"id": "W24-2", "title": "Life by the River", "body": "In May, Jo asked Leo to help with a survey of the wildlife along the river in Riverford. The survey would count every animal along five kilometers of the water. \"It's important for the environment,\" said Jo. \"We need to know what lives here.\"\n\nLeo asked Minh and Hana to help. They spent a whole Saturday walking along the river with notebooks, cameras and nets.\n\nThey started early in the morning. In the trees by the water, they heard a **robin** singing. \"The robin is Britain's favourite bird,\" said Leo. \"Red breast, very brave. It follows gardeners to eat the worms.\"\n\nHigh in the sky, a **hawk** was flying in circles, looking for mice. Then something fast came down from the sky and caught a pigeon. \"A **falcon**!\" said Leo. \"The fastest bird in the world. Faster than a car.\"\n\n\"Do you have **vultures** here?\" asked Hana.\n\n\"No. Vultures live in hot countries. They eat dead animals.\"\n\nIn the river, they looked for fish. Leo had special permission to use a net. They caught a beautiful **trout**, spotted and silver. They let it go immediately. Under a rock, Hana found a long, thin **eel**. She screamed and dropped the net. \"It looks like a snake!\"\n\nIn the shallow water near the bank, there were hundreds of tiny **tadpoles**. \"In a month, they'll be frogs,\" said Leo. Then he found something else: a fat brown **toad** sitting on a stone. \"A toad has drier skin than a frog,\" he explained. \"And it walks more than it jumps.\"\n\nMinh was surprised by how much Leo knew. \"Where did you learn all this?\"\n\n\"Books,\" said Leo. \"And Jo. And YouTube.\"\n\nThere were a lot of insects by the river. A blue **dragonfly** flew over the water. A green **grasshopper** jumped in the grass. On a leaf, there was a big **caterpillar**, green with yellow spots. \"It'll become a butterfly,\" said Hana. \"Or a **moth**?\"\n\n\"A moth,\" said Leo. \"Moths fly at night. Butterflies fly in the day.\"\n\nThen a yellow and black insect flew near Minh's face. He waved his hand. \"A **wasp**,\" said Leo. \"Don't make it angry. Wasps sting.\" Then a bigger one came. \"And that's a **hornet**. Even worse.\"\n\nThey moved away quickly. On the path, they found a big brown **slug** with no shell. Hana made a face. Minh told them about the animals in Vietnam: the **centipede** with a hundred legs that hid in the bathroom, the **scorpion** his uncle found once in his shoe. \"In Vietnam, you always check your shoes,\" he said.\n\n\"In Australia too,\" said Leo. \"And America. In Florida, there are **alligators** in people's swimming pools.\"\n\n\"I'm happy to live in England,\" said Hana. \"Here, the most dangerous animal is a wasp.\"\n\n\"And a **tick**,\" said Leo. \"Small insects that bite you in long grass. And a **flea**, which lives on dogs and cats. Check your legs when you get home.\"\n\nHana checked her legs immediately.\n\nIn the afternoon, they went to a farm next to the river. The farmer had new baby animals. A wild fox **cub** watched them from the edge of the field. There was a newborn **foal**, standing on long, thin legs. There were six pink **piglets**, sleeping together in the straw.\n\nAt the end of the day, they had counted thirty-two different species. Leo was very happy. \"Jo will be pleased,\" he said.\n\nThat evening, Minh told Leo about his own memories of the sea in Vietnam. \"When I was a boy, we went to the beach once. I saw a **jellyfish** on the sand, and a **starfish** in the rocks. And at the market, people sold a dried **seahorse** as medicine. And **oysters**, very fresh, with lime.\"\n\n\"I've never seen a seahorse,\" said Leo. \"One day, I want to see everything.\"\n\n\"You will,\" said Minh. \"You have time.\"", "words": 640, "new": [{"w": "robin", "p": "n", "vi": "chim cổ đỏ"}, {"w": "vulture", "p": "n", "vi": "kền kền"}, {"w": "hawk", "p": "n", "vi": "diều hâu"}, {"w": "falcon", "p": "n", "vi": "chim ưng"}, {"w": "jellyfish", "p": "n", "vi": "sứa"}, {"w": "starfish", "p": "n", "vi": "sao biển"}, {"w": "seahorse", "p": "n", "vi": "cá ngựa"}, {"w": "oyster", "p": "n", "vi": "hàu"}, {"w": "eel", "p": "n", "vi": "cá chình"}, {"w": "trout", "p": "n", "vi": "cá hồi suối"}, {"w": "wasp", "p": "n", "vi": "ong bắp cày"}, {"w": "hornet", "p": "n", "vi": "ong vò vẽ"}, {"w": "moth", "p": "n", "vi": "bướm đêm"}, {"w": "caterpillar", "p": "n", "vi": "sâu bướm"}, {"w": "grasshopper", "p": "n", "vi": "châu chấu"}, {"w": "dragonfly", "p": "n", "vi": "chuồn chuồn"}, {"w": "flea", "p": "n", "vi": "bọ chét"}, {"w": "tick", "p": "n/v", "vi": "bọ ve"}, {"w": "scorpion", "p": "n", "vi": "bọ cạp"}, {"w": "centipede", "p": "n", "vi": "con rết"}, {"w": "slug", "p": "n", "vi": "sên trần"}, {"w": "toad", "p": "n", "vi": "con cóc"}, {"w": "alligator", "p": "n", "vi": "cá sấu Mỹ"}, {"w": "tadpole", "p": "n", "vi": "nòng nọc"}, {"w": "cub", "p": "n", "vi": "thú con"}, {"w": "foal", "p": "n", "vi": "ngựa con"}, {"w": "piglet", "p": "n", "vi": "lợn con"}]}, {"id": "W24-3", "title": "Back to the Farm", "body": "In June, Leo went back to Wales with the family to visit Gareth and Megan's farm. He had changed since last year. Last year, he complained about getting up early. This year, he was up at five every morning to help with the animals.\n\n\"What happened to him?\" Gareth asked Tom.\n\n\"He found something he loves,\" said Tom. \"It's a miracle.\"\n\nThe farm had new animals. The calf born last year, the one Mia called Minh, was now a big young cow. \"She's still the best **breed** of cow in Wales,\" said Gareth proudly. \"Welsh Black. Strong and healthy.\"\n\nGareth had a lot of **livestock**: about a hundred **cattle**, two hundred sheep and many pigs. He also had **poultry**: hens, ducks and geese. A mother duck walked past with seven little **ducklings** behind her, all in a line.\n\nThe local **veterinarian**, Dr. Pryce, came to check the animals. Leo followed her everywhere. She let him help her. She showed him how to check a cow's **hoof** for problems and how to listen to a sheep's heart. \"You're good at this,\" she said. \"You should think about veterinary school. It's hard, but you'd be good.\"\n\nLeo's face went red. \"Do you really think so?\"\n\n\"I'm not just saying it. I've been a vet for thirty years.\"\n\nIn the evening, Leo showed Minh a book about animals that Dr. Pryce had given him. It was full of pictures and facts. \"Look,\" he said. \"A fish has **fins** to swim and **gills** to breathe under water. Its body is covered in **scales**. An elephant has two long **tusks**. A lion has a big **mane** around its head. A cat has **whiskers** to feel things in the dark. A deer has **antlers**, which fall off every year and grow again. And a kangaroo has a **pouch** for its baby.\"\n\n\"You're like a walking dictionary,\" said Minh.\n\nLeo turned the page. \"Some animals **hibernate** in winter. They sleep for months. Hedgehogs, bears, bats. Other animals **migrate**. They travel thousands of kilometers to warmer countries. Birds, whales, butterflies.\"\n\nHe looked up seriously. \"But a lot of animals are **endangered** now. Some are already **extinct**, gone forever. Like the dodo. Because of people.\"\n\nThat night, they sat outside and listened to the sounds of the farm. A dog started to **growl** at something in the dark. A cat sat on Minh's lap and began to **purr**. Far away, on the hill, a fox began to **howl**. A goose **hissed** at a shadow. Insects **buzzed** in the grass. In the morning, the birds would **tweet** in the trees. \"It's like music,\" said Mia.\n\n\"In Africa, at night, you can hear a lion **roar**,\" said Leo. \"Jo told me. You can hear it eight kilometers away.\"\n\n\"How do you remember everything?\" asked Mia.\n\n\"Because I care about it,\" said Leo simply.\n\nOn the last day, Gareth talked to Tom quietly. \"Your boy has a gift with animals,\" he said. \"Some people are good with **domestic** animals, like dogs and cats. Some are good with farm animals. He's good with all of them. Don't let him waste it.\"\n\nOn the way home, Tom was quiet in the car. Then he said, \"Leo. If you want to be a vet, we'll support you. Whatever you need.\"\n\nLeo looked at his father in the mirror. \"Really? Even if I don't play football?\"\n\n\"Football is a game,\" said Tom. \"This is a life.\"\n\nLeo smiled for the rest of the journey.", "words": 578, "new": [{"w": "duckling", "p": "n", "vi": "vịt con"}, {"w": "endangered", "p": "adj", "vi": "ngôn ngữ bị đe doạ"}, {"w": "extinct", "p": "adj", "vi": "tuyệt chủng"}, {"w": "domestic", "p": "adj/n", "vi": "trong nước; gia đình"}, {"w": "poultry", "p": "n", "vi": "gia cầm"}, {"w": "livestock", "p": "n", "vi": "vật nuôi trang trại"}, {"w": "cattle", "p": "n", "vi": "gia súc họ bò"}, {"w": "breed", "p": "v/n", "vi": "giống vật nuôi"}, {"w": "veterinarian", "p": "n", "vi": "bác sĩ thú y"}, {"w": "scale", "p": "n/v", "vi": "cái cân; quy mô"}, {"w": "fin", "p": "n", "vi": "vây"}, {"w": "gill", "p": "n", "vi": "mang cá"}, {"w": "hoof", "p": "n", "vi": "móng guốc"}, {"w": "tusk", "p": "n", "vi": "ngà"}, {"w": "mane", "p": "n", "vi": "bờm"}, {"w": "whisker", "p": "n", "vi": "râu thú"}, {"w": "antler", "p": "n", "vi": "gạc"}, {"w": "pouch", "p": "n", "vi": "túi bụng"}, {"w": "hibernate", "p": "v", "vi": "ngủ đông"}, {"w": "migrate", "p": "v", "vi": "di cư"}, {"w": "roar", "p": "v/n", "vi": "gầm"}, {"w": "howl", "p": "v/n", "vi": "tru"}, {"w": "growl", "p": "v/n", "vi": "gầm gừ"}, {"w": "purr", "p": "v/n", "vi": "kêu rừ rừ"}, {"w": "hiss", "p": "v/n", "vi": "rít"}, {"w": "buzz", "p": "v/n", "vi": "tiếng vo ve"}, {"w": "tweet", "p": "v/n", "vi": "hót líu lo"}]}, {"id": "W24-4", "title": "The Plant Sale", "body": "The Blue Cup needed money, and Grandma Rose had an idea. \"A plant sale,\" she said. \"I have a garden full of plants. Everyone in this town has a garden full of plants. We sell them, and the money goes to the café.\"\n\nSo in June, they organized the biggest plant sale Riverford had ever seen. It was in the square, in front of the café. Everyone brought plants from their gardens.\n\nGrandma Rose was the expert. She knew every plant. She walked around with a notebook, writing the names and the prices. Minh followed her and learned.\n\n\"This is a rose bush,\" she said. \"Look at the **buds**. In a week, they'll **blossom**. Be careful of the **thorns**.\" She pointed at a pot of green leaves climbing up a stick. \"That's **ivy**. It grows on walls. And this is a **vine**, a grape vine. You can grow grapes in England, but they're very sour.\"\n\nMrs. Taylor from next door brought fifty pots of **ferns**. \"They grow in the shade,\" said Grandma Rose. \"They like it damp, like **moss**.\" Someone else brought a small **shrub** with red flowers and some pieces of **hedge** for garden borders.\n\nThere were also some unusual plants. A man brought an **orchid**, white and purple. \"Orchids are difficult,\" said Grandma Rose. \"They need special care.\" A Chinese woman brought a **lotus** in a bowl of water. Minh was surprised. \"In Vietnam, the lotus is our national flower,\" he said. \"It grows in muddy water, but the flower is clean and beautiful.\"\n\nThere were also young trees in pots. A small **maple** from Canada with red leaves. A **willow**, which grows by water and has long, sad branches. A **birch**, with white bark. And a **cedar**, which smelled wonderful. \"In a hundred years, this cedar will be as tall as the church,\" said Grandma Rose.\n\nMargaret came from Scotland for the sale. She brought paintings of flowers to sell. They sold quickly. \"My **botanical** paintings are more popular than my rivers,\" she laughed.\n\nGareth sent a box of vegetables from his farm. Ffion sent a note: \"I'm sorry I can't come. Use my father's vegetables wisely. Don't spend the money on **fertilizer** or **pesticide**. Grow everything naturally!\"\n\nIn the afternoon, Minh talked to an old farmer who sold apple trees. \"I have an **orchard** with three hundred apple trees,\" the farmer said. \"My family has had it for a hundred years. Every September, we **harvest** the apples and make cider.\"\n\n\"Do you use a tractor to **plough** the fields?\" asked Minh. He had learned that the British spell it \"plough.\" In America, it was \"**plow**.\"\n\n\"Of course. But in the old days, my grandfather used horses. And we **irrigate** with water from the river.\"\n\nHe told Minh about a friend who had a **vineyard** in the south of England, and another who worked on a tea **plantation** in India. \"The world is full of growers,\" he said. \"We feed everyone. But nobody thinks about us.\"\n\nA child's pet mouse escaped from her pocket and ran under the tables. It made a tiny **squeak** every time someone tried to catch it.\n\nNear the end of the day, a small **fungus** was found growing under one of the tables. A child wanted to buy it. \"Mushrooms are a kind of fungus,\" Grandma Rose told the child. \"But don't eat this one!\"\n\nAt the end of the day, they counted the money. Four thousand pounds! \"That's the most we've made,\" said Daniel. He hugged Grandma Rose. \"Thank you, Auntie Rose.\"\n\n\"Don't thank me,\" she said. \"Thank the plants. And the people of Riverford.\"\n\nThey now had eleven thousand pounds. Still not enough. But hope was growing, like the cedar in its pot.", "words": 623, "new": [{"w": "squeak", "p": "v/n", "vi": "kêu chít chít"}, {"w": "blossom", "p": "v/n", "vi": "nở hoa"}, {"w": "bud", "p": "n", "vi": "nụ"}, {"w": "thorn", "p": "n", "vi": "gai"}, {"w": "ivy", "p": "n", "vi": "thường xuân"}, {"w": "moss", "p": "n", "vi": "rêu"}, {"w": "fern", "p": "n", "vi": "dương xỉ"}, {"w": "shrub", "p": "n", "vi": "cây bụi"}, {"w": "hedge", "p": "n/v", "vi": "hàng rào cây"}, {"w": "vine", "p": "n", "vi": "cây leo"}, {"w": "orchid", "p": "n", "vi": "hoa lan"}, {"w": "lotus", "p": "n", "vi": "sen"}, {"w": "maple", "p": "n", "vi": "cây phong"}, {"w": "willow", "p": "n", "vi": "cây liễu"}, {"w": "birch", "p": "n", "vi": "cây bạch dương"}, {"w": "cedar", "p": "n", "vi": "cây tuyết tùng"}, {"w": "fungus", "p": "n", "vi": "nấm"}, {"w": "harvest", "p": "n/v", "vi": "mùa gặt"}, {"w": "plow", "p": "n/v", "vi": "cày"}, {"w": "plough", "p": "n/v", "vi": "cày"}, {"w": "irrigate", "p": "v", "vi": "tưới tiêu"}, {"w": "fertilizer", "p": "n", "vi": "phân bón"}, {"w": "pesticide", "p": "n", "vi": "thuốc trừ sâu"}, {"w": "orchard", "p": "n", "vi": "vườn cây ăn quả"}, {"w": "vineyard", "p": "n", "vi": "vườn nho"}, {"w": "plantation", "p": "n", "vi": "đồn điền"}, {"w": "botanical", "p": "adj", "vi": "thuộc thực vật học"}]}, {"id": "W24-5", "title": "The Green Café", "body": "After the flood and the plant sale, Daniel had a new idea. \"If we save The Blue Cup,\" he said, \"I want it to be better than before. Greener. More sustainable.\"\n\nHe asked Ffion for advice. She came from the university with a list. \"First, the carbon **footprint** of your café,\" she said. \"How much energy do you use? How much waste do you make? How much consumption of water?\"\n\n\"A lot,\" said Daniel honestly. \"We consume a lot of everything.\"\n\nFfion explained. \"Most energy in Britain still comes from **fossil** fuels: coal, oil and gas. They make **emissions** of carbon dioxide. That's the main cause of climate change. Renewable energy, like solar panels and wind **turbines**, is much better.\"\n\n\"Can a small café put solar panels on its roof?\"\n\n\"Yes, if the owner agrees. And there are other things. Use less plastic. Reuse cups. Compost your food waste instead of sending it to landfill.\"\n\nMinh listened carefully. He was writing an article about it for the university newspaper. Since the flood, he had become very interested in environmental problems.\n\nIn Vietnam, he told Ffion, the problems were bigger. \"In Hanoi, the air is very **polluted**. There's a lot of **smog** from motorbikes and factories. Some days, you can't see the sky. And in the countryside, there's deforestation: people cut down the forests to make farms.\"\n\n\"It's a global problem,\" said Ffion. \"Factories **pollute** rivers with toxic chemicals. **Sewage** goes into the sea. The ozone layer was damaged by chemicals in the past. Natural disasters are getting worse because of climate change. Like your flood.\"\n\n\"Do you think the flood was because of climate change?\" asked Daniel.\n\n\"Probably partly. Floods like this are more common now.\"\n\nDaniel thought for a long time. \"OK,\" he said. \"When we reopen, we go green. No plastic straws. No plastic cups. A **conservation** box for coffee grounds. Local food only.\"\n\nThey started immediately. Mia painted a sign: \"The Green Cup: Save Energy, Save the Planet.\" Leo made a compost box for the garden behind the café. Grandma Rose became the **gardener**, of course. She showed Minh how to **prune** the old roses so they would grow better, and how to **sow** seeds in spring.\n\n\"Plants teach you patience,\" she said. \"You **sow** the seeds. They **sprout**. They grow. The fruit **ripens** slowly. If you leave it too long, it **rots**. If you forget to water it, it **withers**. Life is like a garden.\"\n\nFfion wrote an article for the university **ecological** society about the café. Minh wrote one for the newspaper. People started to talk about The Blue Cup again. \"The green café that wants to survive,\" said the headline.\n\nA week later, Daniel got an email. It was from a company that made solar panels. \"We read about you,\" the email said. \"We'd like to give you free solar panels, if you stay open. It would be good for our image.\"\n\nDaniel read it three times. \"If we stay open,\" he said. \"That's the problem.\"\n\n\"Then we have to stay open,\" said Minh. \"We have to preserve this place. Conserve it. Like an endangered species.\"\n\nFfion laughed. \"An endangered café. I like that.\"\n\nThat night, Minh looked up at the stars from his flat in the city. He thought about how small the earth was in the universe, and how much we needed to protect it. He thought about all the resources we used without thinking. He thought about The Blue Cup. Small things mattered. A small café, a small garden, a small change. If enough people made small changes, maybe the world could change too.\n\nHe opened his laptop and started a new article. It was about **sustainability**, but really, it was about hope.", "words": 622, "new": [{"w": "gardener", "p": "n", "vi": "người làm vườn"}, {"w": "prune", "p": "v", "vi": "cắt tỉa"}, {"w": "wither", "p": "v", "vi": "héo"}, {"w": "ripen", "p": "v", "vi": "chín dần"}, {"w": "rot", "p": "v/n", "vi": "mục thối"}, {"w": "sow", "p": "v", "vi": "gieo"}, {"w": "sprout", "p": "v/n", "vi": "nảy mầm"}, {"w": "pollute", "p": "v", "vi": "gây ô nhiễm"}, {"w": "emission", "p": "n", "vi": "khí thải"}, {"w": "fossil", "p": "n", "vi": "hóa thạch"}, {"w": "sustainability", "p": "n", "vi": "tính bền vững"}, {"w": "conservation", "p": "n", "vi": "bảo tồn (tài nguyên)"}, {"w": "smog", "p": "n", "vi": "khói bụi"}, {"w": "sewage", "p": "n", "vi": "nước thải"}, {"w": "ecological", "p": "adj", "vi": "thuộc sinh thái"}, {"w": "turbine", "p": "n", "vi": "tua-bin"}, {"w": "footprint", "p": "n", "vi": "dấu chân môi trường"}]}, {"id": "W25-1", "title": "Science Week", "body": "In May, the university had a Science Week. The editor of the university newspaper asked Minh to write about it. \"You're good at explaining things simply,\" she said. \"Make science interesting for normal people.\"\n\nMinh was not a scientist. He studied English and business. But he said yes. Hana and Ffion helped him.\n\nOn the first day, he went to a talk about space. An astronomer, Professor Lee, talked about the galaxy. \"Our sun is one of two hundred billion stars in the Milky Way,\" she said. \"And there are billions of galaxies in the universe.\" She showed photos of a comet with a long bright tail, and a **meteor** falling through the sky at night. \"Some people call it a shooting star. It's really a small rock burning in the air.\"\n\nShe talked about an **asteroid** that hit the earth sixty-six million years ago and killed the dinosaurs. She talked about gravity, the force that keeps the moon in **orbit** around the earth. And she talked about the newest **spacecraft** that NASA was sending to Mars. \"Will people live on Mars one day?\" asked a student.\n\n\"Maybe,\" said the professor. \"But first we need a better spaceship.\"\n\n\"And are there aliens?\" someone asked. Everyone laughed. \"We have no evidence yet,\" said the professor. \"No proof. But the universe is very big. I'd be surprised if we're alone.\"\n\nAstronomy, Minh decided, was the most interesting science in the world.\n\nOn the second day, Hana took him to a biology lab. A technician showed them a sample of blood under a microscope. \"Everything living is made of **cells**,\" she said. \"Inside each cell, there's DNA, the **genetic** code. A gene is a small part of the DNA. It decides the color of your eyes, your hair, your height.\"\n\n\"So I have my grandmother's ears because of a gene?\" asked Minh.\n\n\"Exactly,\" said the technician.\n\nOn the third day, Ffion took him to the chemistry building. She showed him the periodic table. \"Every element is here,\" she said. \"Oxygen, hydrogen, nitrogen, carbon. A **molecule** is a group of atoms together. Water is two hydrogen atoms and one oxygen atom. That's its formula: H2O.\"\n\nShe showed him a simple experiment. She mixed two substances, and the mixture changed color. \"That's a chemical reaction,\" she said. \"The substances react with each other and make a new **compound**.\"\n\nThe physics department was the most exciting. A student showed them a laser, a thin red **beam** of light. Another showed how a magnet works. \"A **magnetic** field is invisible, but it's very powerful,\" he said. They built a simple electric circuit with a battery, a wire and a light bulb. Minh was very proud when the bulb lit up.\n\nA professor talked about **radiation**, the energy that comes from the sun in **rays**, and about nuclear power. \"It's clean, but people are afraid of it,\" she said. \"We need good data and careful analysis. Science is about observation: you observe, you make a hypothesis, you test it, you analyze the results, and you come to a conclusion. It's not about what you believe. It's about the evidence.\"\n\nIn the engineering building, they saw a robot arm and a tiny microchip, smaller than a fingernail. \"Every phone has thousands of these,\" said a student. The technical side of engineering was too difficult for Minh, but he understood one thing: almost everything in modern life came from science.\n\nHe also learned about pressure, **mass**, volume and density from a very enthusiastic physics student who talked for twenty minutes without stopping. \"Why does a ship float?\" the student asked. \"Density! It's all about density and measurement!\"\n\nMinh's article was published on Friday. It was called \"Science for Normal People.\" He wrote about everything he saw: the physical world, the biological world, and the stars. The editor loved it. \"This is your best work,\" she said. \"You make scientific ideas easy to understand.\"\n\n\"Because I don't understand them myself,\" said Minh. \"So I have to explain them simply.\"\n\nThe university was on the **outskirts** of the city, in a quiet district next to a big park. The science buildings were in a special zone at the back. Minh walked home through the park that evening. The stars were coming out. He looked up and thought about galaxies, cells and molecules. Everything was connected, he thought: the smallest atom and the biggest star. And somewhere in the middle, a small café in Riverford that needed saving. What was the cause of all this? He didn't know. But it was a good theory that everything mattered.", "words": 765, "new": [{"w": "orbit", "p": "n/v", "vi": "quỹ đạo; di chuyển theo quỹ đạo (đường cong thiên thể di chuyển quanh sao/hành tinh)"}, {"w": "meteor", "p": "n", "vi": "sao băng"}, {"w": "asteroid", "p": "n", "vi": "tiểu hành tinh (thiên thể đá nhỏ quay quanh Mặt Trời, chủ yếu giữa Mars và Jupiter)"}, {"w": "spacecraft", "p": "n", "vi": "tàu vũ trụ (phương tiện thiết kế để hoạt động trong không gian)"}, {"w": "molecule", "p": "n", "vi": "phân tử"}, {"w": "cell", "p": "n", "vi": "tế bào (đơn vị cấu trúc và chức năng nhỏ nhất của sinh vật)"}, {"w": "genetic", "p": "adj", "vi": "thuộc di truyền"}, {"w": "compound", "p": "n/v/adj", "vi": "khu, khuôn viên"}, {"w": "mass", "p": "adj/n/v", "vi": "khối; đám đông"}, {"w": "magnetic", "p": "adj", "vi": "có từ tính"}, {"w": "ray", "p": "n", "vi": "tia"}, {"w": "beam", "p": "n", "vi": "chùm tia"}, {"w": "radiation", "p": "n", "vi": "bức xạ"}, {"w": "outskirts", "p": "n", "vi": "ngoại ô"}]}, {"id": "W25-2", "title": "The City Council", "body": "The Blue Cup still needed thirteen thousand pounds. There were only six weeks left. Minh was thinking about it all the time. Then, one evening, Sam said something that changed everything.\n\n\"Why don't you go to the city council?\" said Sam. \"The building is very old. Maybe it's protected. Maybe the new owner can't **demolish** it or change it.\"\n\nMinh thought about it. \"Is that possible?\"\n\n\"In Spain, old buildings are protected. You can't change them without permission. Maybe it's the same here.\"\n\nThe next day, Minh went to the council offices. They were in a big gray building in the center of the city, between a tall glass **skyscraper** and an old **plaza** with a fountain. The **headquarters** of the council was busy and confusing. Minh waited for an hour. Finally, he talked to a woman in the planning office.\n\n\"I'm asking about a building in Riverford,\" he said. \"It's a café called The Blue Cup. It's very old. The new owner wants to turn it into flats. Is the building protected?\"\n\nThe woman checked her computer. \"Riverford is outside the city, but it's in our area,\" she said. \"Let me see. The building is from 1860. It's not on our list of protected buildings. But...\" She looked closer. \"Interesting. There's a note here. Somebody asked for it to be protected in 1995. The council never answered.\"\n\n\"Can we ask again?\"\n\n\"You can. But you need evidence that the building is important to the **inhabitants**. Historical photos, letters from the population, anything.\"\n\nMinh ran out of the office. He called Daniel. He called Grandma Rose. He called Pat, Jess, everyone. \"We need history,\" he said. \"Photos. Stories. Anything about the café.\"\n\nThe whole town helped. Grandma Rose found photos from the 1950s. Pat found an old menu from 1920. The old judge found a newspaper article from 1890 about the building. An old man brought a photo of his parents' wedding party in the café's **courtyard** in 1946.\n\nThe history was surprising. The building was first an inn, where travelers stopped with their horses. Then it was a bakery. During the war, it was used as a kitchen to feed people whose houses were bombed. It had always been the center of the town's life.\n\nMinh wrote a long report with all the evidence. Sam designed it beautifully. Hana and Mia collected five hundred signatures. They took it all to the council.\n\nThen they waited.\n\nWhile they waited, Minh learned a lot about the city. He took the bus everywhere. He walked through narrow **alleys** in the old town and across busy intersections in the new part. He learned where the dangerous junctions were and the big **roundabout** near the station where traffic was always **congested**. There was a long tunnel under the river, a dark **underpass** under the railway, and a new **overpass** for cars. \"Every **pedestrian** in this city needs a map,\" he said. The **congestion** was worst at five o'clock, when a crowd of workers left the offices.\n\nHe discovered new places: a **vibrant** market, a **lively** street of restaurants, a **picturesque** old church with a **cemetery** full of old trees, and a quiet **graveyard** behind it. There was a small **aquarium** where he took Hana on a date. There was a **laundromat**, or **launderette** as Grandma Rose called it, where he washed his clothes every Sunday. He passed the Japanese **consulate**, where Hana had to go for her visa, and the old Chinese **embassy** building, which was now a hotel.\n\nSome parts of the city were **shabby**, with empty shops and old buildings. Some were **deserted** at night. Near the river, there was an empty **warehouse** that was going to be a workshop for artists. There was a lot of construction everywhere: new roads, new infrastructure, new facilities. The **municipal** government was spending a lot of money on **transportation** and **amenities**.\n\nTwo weeks later, the council called. The **mayor** wanted to meet Daniel.\n\n\"The building is located in the old center of Riverford,\" she said at the meeting. \"It's situated next to the market square, and it has a long history. We've decided to give it protected status. That means the owner cannot change it without our permission. He can't make it into flats.\"\n\nDaniel could not speak. Minh shook the mayor's hand.\n\n\"There's one more thing,\" said the mayor. \"The owner can still raise the rent. Protected status doesn't stop that. But it means he can't make much money from the building in another way. Maybe he'll want to sell it. Maybe to someone who will keep the café.\"\n\nOn the way home, Daniel finally spoke. \"We did it,\" he said. \"Well, almost. We saved the building.\"\n\n\"Now we save the café,\" said Minh.", "words": 786, "new": [{"w": "skyscraper", "p": "n", "vi": "nhà chọc trời"}, {"w": "plaza", "p": "n", "vi": "quảng trường"}, {"w": "courtyard", "p": "n", "vi": "sân trong"}, {"w": "alley", "p": "n", "vi": "ngõ hẻm"}, {"w": "roundabout", "p": "n", "vi": "vòng xuyến"}, {"w": "underpass", "p": "n", "vi": "đường chui"}, {"w": "overpass", "p": "n", "vi": "cầu vượt"}, {"w": "pedestrian", "p": "n/adj", "vi": "người đi bộ"}, {"w": "inhabitant", "p": "n", "vi": "cư dân"}, {"w": "mayor", "p": "n", "vi": "thị trưởng"}, {"w": "municipal", "p": "adj/n", "vi": "thuộc thành phố"}, {"w": "amenities", "p": "n", "vi": "tiện ích"}, {"w": "aquarium", "p": "n", "vi": "thủy cung"}, {"w": "laundromat", "p": "n", "vi": "tiệm giặt tự phục vụ"}, {"w": "launderette", "p": "n", "vi": "tiệm giặt tự phục vụ"}, {"w": "cemetery", "p": "n", "vi": "nghĩa trang"}, {"w": "graveyard", "p": "n", "vi": "nghĩa địa"}, {"w": "embassy", "p": "n", "vi": "đại sứ quán"}, {"w": "consulate", "p": "n", "vi": "lãnh sự quán"}, {"w": "headquarters", "p": "n", "vi": "trụ sở chính"}, {"w": "warehouse", "p": "n/v", "vi": "nhà kho"}, {"w": "demolish", "p": "v", "vi": "phá dỡ"}, {"w": "congested", "p": "adj", "vi": "ùn tắc"}, {"w": "congestion", "p": "n", "vi": "sự ùn tắc"}, {"w": "vibrant", "p": "adj", "vi": "sống động"}, {"w": "lively", "p": "adj", "vi": "nhộn nhịp"}, {"w": "deserted", "p": "adj", "vi": "vắng tanh"}, {"w": "shabby", "p": "adj", "vi": "tồi tàn"}, {"w": "picturesque", "p": "adj", "vi": "đẹp như tranh"}, {"w": "transportation", "p": "n", "vi": "giao thông vận tải"}]}, {"id": "W25-3", "title": "Journeys", "body": "In July, Hana went home to Japan for the summer. It was the first time they would be apart for more than a week. Minh took her to the airport.\n\nThe airport was busy. There were long queues at the check-in desks. Hana's flight was delayed by an hour. Another flight to Paris was cancelled, and the passengers were angry. \"In America, they spell it canceled, with one L,\" said Minh. \"Tom taught me.\"\n\n\"You and Tom,\" said Hana, laughing.\n\nThey sat in a café near the terminal and watched the planes. A huge passenger **jet** was moving slowly toward the **runway**. A **cargo** plane was being loaded with **freight**. \"Everything you buy comes on a plane or a ship,\" said Hana. \"Did you know?\"\n\n\"Did you know that the **cockpit** of a big **aircraft** has hundreds of buttons?\" said Minh. \"I saw it on TV.\"\n\nThey talked about everything except goodbye. Then the board said: \"Tokyo. Gate 23. Boarding.\" It was time.\n\nHana's destination was Tokyo, then a connection to Osaka, then a train transfer to her small town. \"The journey is twenty hours,\" she said. \"I'll message you at every airport.\"\n\nAt the departure gate, they held each other for a long time. \"Six weeks,\" said Minh. \"That's nothing.\"\n\n\"It's forever,\" said Hana. Then she smiled. \"But it's OK. We have video calls.\"\n\nShe walked through the gate. Minh watched until she disappeared. Then he went home on the train, feeling empty.\n\nTo keep busy, he decided to learn to drive. Tom offered to teach him in the big car. \"Driving in England is easy,\" said Tom. \"Except the roundabouts. And the other drivers. And the weather.\"\n\nThe first lesson was a disaster. Minh did not know where anything was. \"This is the **steering** wheel. You **steer** with it. This is the **gear** stick. This is the **clutch** pedal, on the left. You press it when you change gear. This is the **dashboard**: speed, fuel, everything.\"\n\nMinh tried to start the car. It jumped forward and stopped. Tom said nothing. Minh tried again. It worked.\n\n\"Now **indicator**,\" said Tom. \"Show other drivers where you're going.\"\n\nMinh turned on the **windscreen** **wipers** instead. \"In America, it's the **windshield**,\" said Tom. \"But that's not important now. The indicator, Minh. The other stick.\"\n\nThey drove slowly around the town. Minh learned to **accelerate** gently, to **reverse** into a parking space and to stop at traffic lights. He did not **overtake** anyone. Everyone overtook him. On one narrow road, a farmer on a tractor overtook him.\n\n\"You're too careful,\" said Tom. \"But that's better than **speeding**.\"\n\nThey drove on the motorway once. Minh was terrified. At the end, there was a **toll** road. Tom paid. Then the car had a **breakdown**. Smoke came from under the **bonnet**. Tom opened it and looked inside. \"The engine is too hot,\" he said. \"We need water.\" They waited for an hour for help. Then a car passed with a **puncture**, its tire completely flat. \"At least we're not them,\" said Tom.\n\nThe next day, Minh went back to his old bicycle. He bought a new **pump** for the tires and fixed the **handlebar**. He decided that cycling was better: no clutch, no gears to think about, just two **pedals** and the wind. He started to commute by bike to the café on weekends. It took an hour, but he enjoyed it.\n\nOn the train, he watched other commuters: people in suits with laptops, students with headphones, tired workers going home. He sat in the same carriage every day. He started to recognize faces. He paid his **fare** with a monthly card.\n\nHana sent him photos from Japan. Her town was by the sea. She showed him the ferry, with its big **deck** where you could stand and feel the wind. She showed him a **hovercraft** that flew over the water near the harbor, and a man flying a **glider** over the mountains. In one photo, she was eating ice cream by the sea. \"Wish you were here,\" she wrote.\n\n\"Me too,\" Minh wrote back. He counted the days on his calendar. Thirty-nine more.\n\nHe turned on the **headlight** of his bike and rode home through the dark. He was tired, but happy. Every journey, he thought, has a destination. And every goodbye has a hello at the end.", "words": 722, "new": [{"w": "cockpit", "p": "n", "vi": "buồng lái"}, {"w": "deck", "p": "n", "vi": "boong tàu"}, {"w": "cargo", "p": "n", "vi": "hàng chuyên chở"}, {"w": "freight", "p": "n/v/adv", "vi": "hàng hóa vận chuyển"}, {"w": "aircraft", "p": "n", "vi": "máy bay"}, {"w": "jet", "p": "n", "vi": "máy bay phản lực"}, {"w": "glider", "p": "n", "vi": "tàu lượn"}, {"w": "hovercraft", "p": "n", "vi": "tàu đệm khí"}, {"w": "steer", "p": "v", "vi": "lái"}, {"w": "accelerate", "p": "v", "vi": "tăng tốc"}, {"w": "overtake", "p": "v", "vi": "vượt xe"}, {"w": "reverse", "p": "v/n/adj", "vi": "đảo ngược, lùi"}, {"w": "indicator", "p": "n", "vi": "đèn báo rẽ"}, {"w": "headlight", "p": "n", "vi": "đèn pha"}, {"w": "windscreen", "p": "n", "vi": "kính chắn gió"}, {"w": "windshield", "p": "n", "vi": "kính chắn gió"}, {"w": "wiper", "p": "n", "vi": "cần gạt nước"}, {"w": "bonnet", "p": "n", "vi": "nắp ca pô"}, {"w": "dashboard", "p": "n", "vi": "bảng điều khiển"}, {"w": "gear", "p": "n", "vi": "số xe"}, {"w": "clutch", "p": "n", "vi": "bộ ly hợp"}, {"w": "handlebar", "p": "n", "vi": "ghi đông"}, {"w": "pedal", "p": "n/v", "vi": "bàn đạp"}, {"w": "pump", "p": "n/v", "vi": "máy bơm"}, {"w": "breakdown", "p": "n", "vi": "sự hỏng xe"}, {"w": "puncture", "p": "n/v", "vi": "lỗ thủng lốp"}, {"w": "toll", "p": "n/v", "vi": "phí cầu đường"}, {"w": "fare", "p": "n", "vi": "tiền vé"}, {"w": "speeding", "p": "n", "vi": "chạy quá tốc độ"}, {"w": "runway", "p": "n", "vi": "đường băng"}]}, {"id": "W26-1", "title": "Spain", "body": "In August, while Hana was in Japan, Minh finally went to Spain with Sam. Sam had promised it for two years. \"Bring **sunscreen**,\" he said. \"Lots of sunscreen.\"\n\nThey planned a two-week **itinerary**. First, Madrid. Then Sam's family village in the mountains. Then the south coast. They would travel like real **backpackers**: cheap buses, cheap hostels, everything in one bag.\n\nAt the airport in Madrid, they went through **customs** and **immigration**. The officer looked at Minh's Vietnamese passport for a long time. \"Holiday?\" she asked. \"Yes,\" said Minh. \"With my friend.\" She stamped it and smiled. \"Welcome to Spain.\"\n\nThey changed some money into the local currency, euros. Sam had bought travel **insurance** for both of them. \"Just in case,\" he said. \"My uncle broke his leg in Portugal once. It cost a fortune.\"\n\nMadrid was hot, loud and beautiful. They **wandered** through the old streets for hours. They visited museums and parks and ate dinner at ten o'clock at night, like Spanish people. Every famous **attraction** was full of **sightseers** with cameras. Some streets were very **touristy**, with expensive restaurants and souvenir shops. \"Let's go somewhere real,\" said Sam. He took Minh to a small bar where only old Spanish men drank coffee. It was perfect.\n\nThe hostel in Madrid was **overbooked**. When they arrived, the receptionist said, \"I'm sorry, there's no **vacancy**. We have no **vacancies** at all. All our beds are full.\" It was not the arrival they hoped for. Sam argued with her in fast Spanish. In the end, she gave them an upgrade: a private room for the same price. \"Spanish is a useful language,\" said Sam proudly.\n\nAfter three days, they took a bus to Sam's village. The bus was old and slow. Along the road, they saw a **cyclist** climbing the mountain in the heat and a young man trying to **hitchhike**, holding a sign. A **motorist** stopped and picked him up. \"In my village, everyone hitchhikes,\" said Sam. \"Buses come twice a day.\"\n\nThe village was small and **peaceful**, on top of a hill. Sam's grandmother cried when she saw him. She hugged Minh too, as if she had known him forever. She cooked for them every day. She didn't speak English, and Minh didn't speak Spanish, but they understood each other through food and smiles.\n\nFrom the village, they went on an **excursion** into the mountains. It was a long hike, six hours of walking up and down. Sam loved trekking. They trekked through forests and along rivers. At the top, there was a view of the whole valley. \"This is better than any **luxury** hotel,\" said Minh.\n\nThen they went south, to the sea. The beaches were full of **holidaymakers** from all over Europe: Germans, Dutch, British. Minh forgot to use his sunscreen on the first day. He got a terrible **sunburn**. His back was red for a week. \"I told you,\" said Sam.\n\nOn the beach, they met an old **traveler**, a real **globetrotter**. He was seventy and had visited a hundred and twenty countries. He had been on an **expedition** to the North Pole and a long **voyage** across the Pacific on a small boat. \"The world is big,\" he said. \"But people are the same everywhere. Remember that.\"\n\nHe gave them a **brochure** for a boat trip to Morocco, just across the sea. \"Africa is only fourteen kilometers away,\" he said. \"Very **exotic**. Very different.\"\n\nThey didn't go. They didn't have enough money. \"Next time,\" said Sam.\n\nOn the last night, they sat on the beach and watched the sunset. Minh sent a photo to Hana in Japan. It was morning there. She replied: \"Beautiful! But where's your sunscreen?\"\n\n\"Everyone is worried about my sunscreen,\" said Minh.\n\n\"Because you're very red,\" said Sam.\n\nThe next morning, they flew home. Minh's suitcase was full of Spanish cheese, olive oil and a heavy jar of honey from Sam's grandmother. His head was full of new memories. And his back was still a little red.\n\nIt was the best holiday of his life. He wanted to **sightsee** more, travel more, see everything. But first, there was a café to save.", "words": 690, "new": [{"w": "hitchhike", "p": "v", "vi": "đi nhờ xe"}, {"w": "cyclist", "p": "n", "vi": "người đi xe đạp"}, {"w": "motorist", "p": "n", "vi": "người lái ô tô"}, {"w": "itinerary", "p": "n", "vi": "lịch trình"}, {"w": "sightseer", "p": "n", "vi": "khách tham quan"}, {"w": "excursion", "p": "n", "vi": "chuyến tham quan"}, {"w": "expedition", "p": "n", "vi": "chuyến thám hiểm"}, {"w": "voyage", "p": "n", "vi": "chuyến hải hành"}, {"w": "brochure", "p": "n", "vi": "tập quảng cáo"}, {"w": "attraction", "p": "n", "vi": "điểm thu hút"}, {"w": "exotic", "p": "adj", "vi": "lạ từ phương xa"}, {"w": "peaceful", "p": "adj", "vi": "yên bình"}, {"w": "touristy", "p": "adj", "vi": "quá nhiều khách du lịch"}, {"w": "backpacker", "p": "n", "vi": "người du lịch ba lô"}, {"w": "traveler", "p": "n", "vi": "người đi du lịch"}, {"w": "holidaymaker", "p": "n", "vi": "người đi nghỉ"}, {"w": "globetrotter", "p": "n", "vi": "người chu du thế giới"}, {"w": "customs", "p": "n", "vi": "hải quan"}, {"w": "immigration", "p": "n", "vi": "sự nhập cư"}, {"w": "insurance", "p": "n/adj", "vi": "bảo hiểm"}, {"w": "luxury", "p": "n/adj", "vi": "sự sang trọng"}, {"w": "vacancy", "p": "n", "vi": "phòng trống"}, {"w": "vacancies", "p": "n", "vi": "phòng còn trống"}, {"w": "overbooked", "p": "adj", "vi": "nhận đặt quá chỗ"}, {"w": "sightsee", "p": "v", "vi": "tham quan"}, {"w": "wander", "p": "v", "vi": "đi lang thang"}, {"w": "sunscreen", "p": "n", "vi": "kem chống nắng"}, {"w": "sunburn", "p": "n", "vi": "cháy nắng"}]}, {"id": "W26-2", "title": "The Big Offer", "body": "When Minh came back from Spain, there was news. The new owner of The Blue Cup building had called Daniel. \"Since the building is protected,\" he said, \"I can't make flats. So I want to sell it. To you, if you want. Half a million pounds.\"\n\n\"Half a million,\" Daniel repeated at the staff meeting. \"I have twelve thousand.\"\n\nEveryone was quiet. Then Pat said, \"Well. That's a start.\"\n\nThey made a plan. They needed money, but they also needed the café to make more money. The building was damaged after the flood. The coffee machine was **faulty**. The fridge was **damaged**. Even the electric **outlet** in the kitchen was broken. \"The coffee machine still has a **warranty**,\" said Daniel. \"Two more months. The company has to give us a replacement.\" But when he called the company, they said the flood was not part of their **guarantee**. Daniel made a **complaint**. It took three weeks, but finally they agreed to repair it.\n\nMinh and Mia were given a special job: buy everything the café needed to reopen. They had a small budget. \"Find the cheapest prices,\" said Daniel. \"Good quality, but **affordable**.\"\n\nSo they went shopping. At first, they went to an expensive **boutique** for kitchen things in the city. Everything was **overpriced**. \"Forty pounds for a teapot?\" said Mia. \"Too **pricey**.\"\n\nThen they tried a big **retailer** on the edge of town. It was cheaper, but the things were not good quality. \"This packaging is nicer than the product,\" said Minh.\n\nFinally, Pat told them about a **wholesale** market. \"Wholesale is for businesses,\" she said. \"You buy in big amounts, so it's cheaper than **retail**.\"\n\nThe wholesale market was huge. There were hundreds of **stalls** and **vendors** selling everything: cups, plates, chairs, tables, coffee, tea, sugar. Mia loved it. She **browsed** for hours. She found beautiful secondhand chairs from an old hotel. She bought them very cheaply. \"I **haggled**,\" she said proudly. \"He wanted two hundred. I paid one hundred and twenty.\"\n\n\"Where did you learn to haggle?\" asked Minh.\n\n\"From Grandma Rose. She haggles at the supermarket.\"\n\nThey also found a **catalog** of coffee from small farms. \"We could buy coffee from Vietnam,\" said Minh. \"Directly from the farmers. It's cheaper, and the farmers get more money.\"\n\nThey checked the stock and the availability. The Vietnamese coffee was available in big amounts. Minh called the company. He used his Vietnamese. They gave him a special deal: ten percent off the first order. \"Because you're Vietnamese,\" said the woman. \"We like to help.\"\n\nAt the end of the day, they had spent their budget carefully. They had the **invoice** for every purchase. They had **vouchers** from the market for next time and **coupons** for free delivery.\n\nBack at the café, Daniel looked at everything. He was impressed. \"You two should work in business,\" he said.\n\n\"Mia should,\" said Minh. \"She's a good haggler.\"\n\nThat evening, Daniel sat with his accounts. He looked at the income and the **expenses** for the last year. The numbers were not good. \"Our biggest **expense** is the rent,\" he said. \"If we buy the building, there's no more rent. But we'd need a loan. A big one. And the monthly payment would be almost as high as the rent.\"\n\n\"But at the end, you'd own it,\" said Pat. \"That's the difference. Rent is gone forever. A loan is an investment.\"\n\nDaniel thought. \"Maybe we could do a loyalty card,\" he said. \"Get more regular customers. Every tenth coffee free. A **promotion** to bring people back.\"\n\n\"And a monthly **installment** plan for the community,\" said Mia. \"People pay a little every month to support the café.\"\n\n\"That's not a bad idea,\" said Daniel.\n\nThe consumer is king, Minh remembered from his business class. But in Riverford, maybe the community was king. And the community loved The Blue Cup. He went home and started to write a plan.", "words": 652, "new": [{"w": "retailer", "p": "n", "vi": "nhà bán lẻ"}, {"w": "retail", "p": "n/v/adv/adj", "vi": "bán lẻ"}, {"w": "wholesale", "p": "adj/n/adv", "vi": "bán buôn / bán sỉ"}, {"w": "outlet", "p": "n", "vi": "ổ cắm điện"}, {"w": "boutique", "p": "n/adj", "vi": "cửa hàng thời trang"}, {"w": "stall", "p": "n", "vi": "quầy hàng"}, {"w": "vendor", "p": "n", "vi": "người bán hàng"}, {"w": "catalog", "p": "n", "vi": "danh mục sản phẩm"}, {"w": "voucher", "p": "n", "vi": "phiếu mua hàng"}, {"w": "coupon", "p": "n", "vi": "phiếu giảm giá"}, {"w": "guarantee", "p": "n/v", "vi": "sự bảo đảm"}, {"w": "warranty", "p": "n", "vi": "bảo hành"}, {"w": "faulty", "p": "adj", "vi": "bị lỗi"}, {"w": "damaged", "p": "adj", "vi": "bị hư hỏng"}, {"w": "complaint", "p": "n", "vi": "lời phàn nàn"}, {"w": "browse", "p": "v/n", "vi": "xem hàng"}, {"w": "haggle", "p": "v", "vi": "mặc cả"}, {"w": "overpriced", "p": "adj", "vi": "quá đắt"}, {"w": "affordable", "p": "adj", "vi": "vừa túi tiền"}, {"w": "pricey", "p": "adj", "vi": "đắt"}, {"w": "promotion", "p": "n", "vi": "sự thăng chức"}, {"w": "installment", "p": "n", "vi": "khoản trả góp"}, {"w": "invoice", "p": "n/v", "vi": "hóa đơn"}, {"w": "expense", "p": "n/v", "vi": "chi phí"}, {"w": "expenses", "p": "n", "vi": "chi phí"}]}, {"id": "W26-3", "title": "Saving The Blue Cup", "body": "Minh's plan was simple, but big. \"Community shares,\" he said. \"We sell shares in the café to the people of Riverford. Each share costs a hundred pounds. If a thousand people buy one share each, that's a hundred thousand pounds. Then we get a bank **loan** for the rest.\"\n\nDaniel was not sure. \"It's a terrible investment,\" he said. \"Who would invest in a small café?\"\n\n\"The people who love it,\" said Minh. \"It's not about profit. It's about keeping something important.\"\n\nHe had learned about community businesses in his finance class. He had written an **essay** about it. In some English villages, people bought the local pub or shop together, so it would not close. \"It's an economic model,\" he said. \"But also a social one.\"\n\nThey made a website. Sam designed it. They wrote a **statement**: \"The Blue Cup has been the heart of Riverford for over a hundred and fifty years. Help us keep it open. Become an owner.\"\n\nThe response was amazing. In the first week, two hundred people bought shares. Some bought one. Some bought ten. A student bought half a share, with two friends. An old man who had lived in Riverford all his life gave his whole **pension** for a month. \"I'm not wealthy,\" he said. \"But this place is my life.\"\n\nGrandma Rose bought twenty shares with her **savings**. \"I don't need money in the bank,\" she said. \"I need my café.\" Tom and Anna bought ten. Mia used her prize money. Leo gave his **allowance**. Even Lan in Vietnam sent five pounds, and Minh's parents sent a hundred. It was a lot of money for them. Minh almost cried.\n\nMargaret sent a big **donation** from Scotland. \"Don't make it a share,\" she wrote. \"I want to **donate**. For Rose. For our river.\"\n\nBut it was still not enough. After a month, they had one hundred and sixty thousand pounds. They needed a bank loan for the rest. Daniel went to three banks. Two said no. One manager said people could withdraw their money at any time, and that was a risk. \"Small cafés are a risk,\" they said. \"Many go **bankrupt**. The economy is bad. **Inflation** is high. The interest rate is high.\"\n\nThen, one day, a man came into the café. He was the young model who came on Sundays, the one everyone looked at. He sat down with Daniel.\n\n\"I've been coming here for three years,\" he said. \"I like it. I'd like to help.\" He explained that he was not only a model. He was also an **investor**. His family was very rich. His grandfather was a **millionaire**; his uncle was a **billionaire**. \"I have a **fund** for small community businesses. I can give you a loan with a very low rate. Or I can invest.\"\n\nDaniel could not speak. Minh had to talk for him.\n\nThe man's **funding** made it possible. The bank agreed to the final loan, because now there was enough money. In October, Daniel signed the papers. He was the owner of the building, with five hundred community shareholders.\n\n\"I'm in **debt** for twenty years,\" he said, laughing and crying at the same time. \"But it's my debt. And it's our café.\"\n\nThe town had a party in the square. Everyone came. Daniel made a speech. \"A year ago, I thought we were finished,\" he said. \"I was almost broke. Now, thanks to all of you, The Blue Cup will stay. Not for me. For all of you. For the next hundred and fifty years.\"\n\nLater, the man who invested sat with Minh. \"Why did you do it?\" Minh asked him. \"There's no real profit for you. Maybe even a loss.\"\n\n\"Money isn't the only kind of wealth,\" the man said. \"My family has a **fortune**, but we've never had a place like this. This town has something I can't buy. Plus, I like the summer rolls.\"\n\nMinh laughed. That night, he started his **dissertation** for his final year at university. He decided the topic: \"Community Ownership and Local Business: A Case Study.\" His **thesis** was simple: when people work together, they can save the things they love. His professor said it was a good **academic** topic. \"You have the best data in the world,\" she said. \"You were there.\"\n\nThe withdrawal of the old owner, the transaction, the balance in the account at the end: he wrote it all down for his **coursework**. His **assignment** for the week was done, but this was more than an assignment. It was a story he would never forget. Poverty and **expenditure** and financial fear had nearly closed the café. Hope had saved it.", "words": 778, "new": [{"w": "expenditure", "p": "n", "vi": "chi tiêu"}, {"w": "loan", "p": "n/v", "vi": "khoản vay"}, {"w": "debt", "p": "n", "vi": "nợ"}, {"w": "investor", "p": "n", "vi": "nhà đầu tư"}, {"w": "inflation", "p": "n", "vi": "lạm phát"}, {"w": "bankrupt", "p": "adj/n/v", "vi": "phá sản"}, {"w": "statement", "p": "n/adj/v", "vi": "lời tuyên bố"}, {"w": "pension", "p": "n", "vi": "lương hưu"}, {"w": "allowance", "p": "n", "vi": "tiền tiêu vặt"}, {"w": "donation", "p": "n", "vi": "khoản quyên góp"}, {"w": "donate", "p": "v", "vi": "quyên góp"}, {"w": "fortune", "p": "n", "vi": "gia tài"}, {"w": "millionaire", "p": "n", "vi": "triệu phú"}, {"w": "billionaire", "p": "n", "vi": "tỷ phú"}, {"w": "fund", "p": "n/v", "vi": "quỹ; tài trợ"}, {"w": "funding", "p": "n", "vi": "nguồn tiền"}, {"w": "savings", "p": "n", "vi": "tiền tiết kiệm"}, {"w": "academic", "p": "adj/n", "vi": "thuộc học thuật"}, {"w": "assignment", "p": "n", "vi": "bài tập"}, {"w": "essay", "p": "n/v", "vi": "bài luận"}, {"w": "coursework", "p": "n", "vi": "bài tập khóa học"}, {"w": "thesis", "p": "n", "vi": "luận văn"}, {"w": "dissertation", "p": "n", "vi": "luận án"}]}, {"id": "W26-4", "title": "Final Year", "body": "In September, Minh started his final year at university. It was the most important year. If he did well, he would graduate with a good degree. If not, everything he had worked for would be in danger.\n\nOn the first day, he went to a **lecture** about international business. The **lecturer** was a young man who spoke very fast. Three hundred **undergraduate** students sat in a huge room. Minh took notes as fast as he could. After an hour, his hand hurt.\n\nThe next day, he had a small **seminar** with ten students and a professor. They discussed a case study about a company in Japan. Everybody had to speak. Minh was nervous, but he spoke. The professor nodded. \"Good point, Minh.\"\n\nHe also had a weekly tutorial with his tutor, Dr. Bell, who helped him with his dissertation. Dr. Bell was strict but kind. \"Your **concentration** is good,\" she said. \"But your writing needs more focus. Don't try to say everything. Say one thing well.\"\n\nThe **campus** was big and beautiful in autumn. The trees were red and gold. Students sat on the grass between classes. There were students from everywhere: **postgraduate** stud
