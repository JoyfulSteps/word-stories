Every city had a rich part and a poor part. Every city had a place where everyone came together.\n\nBack in Tokyo, he talked to the city planner again. \"Can big cities be fair?\" he asked.\n\n\"They can be better,\" she said. \"Good public transport. Affordable homes. Parks for everyone. A good police **precinct** in every **borough**. But a plan can **derail** easily. Politics, money, corruption. It's hard.\"\n\nHis article, \"A Tale of Two Cities,\" was published on both sides of the world. In Riverford, Grace put it next to a story about the new houses in the town. \"Big city problems, small town problems,\" she wrote. \"Same problems, different size.\"", "words": 605, "new": [{"w": "urbanization", "p": "n", "vi": "đô thị hóa"}, {"w": "gentrification", "p": "n", "vi": "tái thiết khu vực (đẩy cư dân cũ đi)"}, {"w": "sprawl", "p": "v/n", "vi": "sự mở rộng tràn lan"}, {"w": "slum", "p": "n/v", "vi": "khu ổ chuột / khu định cư không chính thức"}, {"w": "shantytown", "p": "n", "vi": "khu nhà ổ chuột"}, {"w": "thoroughfare", "p": "n", "vi": "đường giao thông chính"}, {"w": "boulevard", "p": "n", "vi": "đại lộ"}, {"w": "promenade", "p": "n", "vi": "đường dạo ven biển"}, {"w": "arcade", "p": "n", "vi": "hành lang mua sắm"}, {"w": "precinct", "p": "n", "vi": "khu vực cảnh sát"}, {"w": "borough", "p": "n", "vi": "quận"}, {"w": "cosmopolitan", "p": "adj/n", "vi": "quốc tế / đa văn hoá"}, {"w": "bustling", "p": "adj", "vi": "nhộn nhịp"}, {"w": "densely", "p": "adv", "vi": "dày đặc"}, {"w": "populated", "p": "adj", "vi": "có dân cư"}, {"w": "overcrowded", "p": "adj", "vi": "quá đông đúc"}, {"w": "zoning", "p": "n", "vi": "quy hoạch phân khu"}, {"w": "edifice", "p": "n", "vi": "công trình đồ sộ"}, {"w": "gridlock", "p": "n/v", "vi": "tắc nghẽn hoàn toàn / kẹt cứng"}, {"w": "detour", "p": "n", "vi": "đường vòng"}, {"w": "diversion", "p": "n", "vi": "đường vòng"}, {"w": "convoy", "p": "n", "vi": "đoàn xe"}, {"w": "navigate", "p": "v", "vi": "điều hướng"}, {"w": "navigation", "p": "n", "vi": "sự định hướng"}, {"w": "maneuver", "p": "n/v", "vi": "thao tác điều khiển"}, {"w": "collide", "p": "v", "vi": "va chạm"}, {"w": "collision", "p": "n", "vi": "vụ va chạm"}, {"w": "derail", "p": "v", "vi": "làm chệch hướng"}]}, {"id": "W37-5", "title": "Hana Meets Vietnam", "body": "In February, Minh took Hana to Vietnam for Tet, the Lunar New Year. It was her first time. Minh was nervous. Hana was more nervous. \"What if your family doesn't like me?\" she said.\n\n\"They already like you,\" said Minh. \"My grandmother met you on video. She says you have a good heart.\"\n\n\"Video is different,\" said Hana.\n\nThey didn't fly directly. There was a **layover** of six hours in Taipei. They walked around the airport, ate noodles, and slept on the chairs. \"A **stopover** in Taiwan,\" said Minh. \"Like a mini holiday.\"\n\n\"It's not a holiday,\" said Hana. \"It's an airport.\"\n\nWhen they finally landed in Hanoi, it was raining and cold. They **disembarked** and walked through the **transit** area to passport control. Minh's whole family was waiting outside: his parents, Lan, and his grandmother, who was eighty-seven now and walked with a stick.\n\nMinh's mother hugged Hana first. Then his father shook her hand, very formally. Then Lan screamed and hugged her too. Then Minh's grandmother took Hana's face in her hands, like she always did with Minh, and looked at her for a long time.\n\n\"Good,\" she said in Vietnamese. \"Strong face. Kind eyes.\"\n\nHana didn't understand the words, but she understood the meaning. She bowed and said, \"Xin chào bà,\" and Minh's grandmother laughed.\n\nThe family had arranged everything. Minh's uncle drove them in his car. \"Like a **chauffeur**,\" said Lan. \"We're very **chauffeured** today. Very fancy.\"\n\nOver the next week, Hana experienced Vietnamese **hospitality**. Everyone wanted to feed her. Everyone wanted to meet her. Neighbors came to the house with gifts. The family took her to the market, the temple, the river. She tried every food. She loved most of it. She didn't love the durian.\n\nFor three days, they took a **getaway** to the mountains in the north, near the Chinese border. It was an area famous for **ecotourism**: beautiful, **unspoiled** nature, small villages, rice terraces on the hills. They stayed in a simple **lodging** in a village, a wooden house on stilts. There was no hotel **concierge**, just a kind old woman who made them breakfast.\n\nThey met people from ethnic minority groups who had lived in these mountains for centuries. In the past, some groups were **nomadic**: they moved with their animals from place to place. A few **nomads** still moved with the seasons. They also met an **itinerant** trader who walked from village to village selling cloth.\n\nOn the last day, they went to an old pagoda on top of a mountain. Hundreds of people were climbing the long stairs. \"It's a **pilgrimage**,\" Minh explained. \"At Tet, people visit temples to pray for luck in the new year.\"\n\nAt the top, Hana and Minh lit incense together. Minh prayed for his family. Hana prayed too. When they finished, she asked him what he prayed for.\n\n\"For my family,\" he said. \"And for us. What about you?\"\n\n\"For your grandmother's health,\" said Hana. \"And something else. I'll tell you later.\"\n\nOn the way home, they took the old train from the mountains. It was pulled by an old **locomotive**, slow and loud. It crossed a high **viaduct** over a deep valley. Hana held Minh's hand very tightly. Later, on the highway back to Hanoi, they passed a big **interchange** where many roads met, and drove along a wide **carriageway** full of motorbikes. Minh's uncle talked about **carpooling** to save money. \"In Hanoi, everyone **carpools**,\" he said. \"Five people on one motorbike.\"\n\nWhen they got back to Hanoi, Lan asked Hana what she thought of Vietnam.\n\n\"I think,\" said Hana slowly, \"I have **wanderlust** now. I want to see everything.\"\n\n\"Next time, a **staycation**,\" said Minh. \"We stay home and do nothing.\"\n\n\"Never,\" said Hana. \"We **embark** on the next adventure.\"\n\nOn the last night, Minh's grandmother called Minh into her room. She gave him a small box. Inside was a jade ring.\n\n\"It was my mother's,\" she said. \"Give it to her. When you're ready.\"\n\nMinh looked at the ring for a long time. \"How did you know?\"\n\n\"I'm old,\" said his grandmother. \"Old people know everything.\"\n\nNobody **hijacked** their plans and no boat **capsized** on the river, as Lan had joked might happen. It was a perfect trip.", "words": 708, "new": [{"w": "capsize", "p": "v", "vi": "lật thuyền"}, {"w": "hijack", "p": "v", "vi": "cướp phương tiện"}, {"w": "chauffeur", "p": "n", "vi": "tài xế riêng"}, {"w": "chauffeured", "p": "adj", "vi": "có tài xế riêng"}, {"w": "locomotive", "p": "n", "vi": "đầu máy xe lửa"}, {"w": "carriageway", "p": "n", "vi": "phần đường xe chạy"}, {"w": "interchange", "p": "n/v", "vi": "nút giao"}, {"w": "viaduct", "p": "n", "vi": "cầu cạn"}, {"w": "carpool", "p": "n/v", "vi": "đi chung xe"}, {"w": "carpooling", "p": "n", "vi": "việc đi chung xe"}, {"w": "getaway", "p": "n", "vi": "kỳ nghỉ ngắn"}, {"w": "staycation", "p": "n", "vi": "kỳ nghỉ tại nhà"}, {"w": "hospitality", "p": "n", "vi": "lòng hiếu khách"}, {"w": "concierge", "p": "n", "vi": "nhân viên hỗ trợ khách"}, {"w": "lodging", "p": "n", "vi": "chỗ trọ"}, {"w": "ecotourism", "p": "n", "vi": "du lịch sinh thái"}, {"w": "wanderlust", "p": "n", "vi": "niềm khao khát du lịch"}, {"w": "unspoiled", "p": "adj", "vi": "còn hoang sơ"}, {"w": "itinerant", "p": "adj/n", "vi": "lưu động"}, {"w": "nomad", "p": "n", "vi": "người du mục"}, {"w": "nomadic", "p": "adj", "vi": "du mục"}, {"w": "pilgrimage", "p": "n", "vi": "cuộc hành hương"}, {"w": "transit", "p": "n/v", "vi": "sự vận chuyển"}, {"w": "layover", "p": "n", "vi": "thời gian quá cảnh"}, {"w": "stopover", "p": "n", "vi": "chặng dừng"}, {"w": "embark", "p": "v", "vi": "bắt đầu chuyến đi"}, {"w": "disembark", "p": "v", "vi": "xuống tàu xe"}]}, {"id": "W38-1", "title": "Buy, Buy, Buy", "body": "In March, Yuko asked Minh to write about shopping. \"Tokyo is a shopping city,\" she said. \"But is that good? Write about **consumerism**.\"\n\nMinh started in the biggest shopping area in Tokyo. On a Saturday, millions of people were there. Every shop was full. People carried bags and bags of things: clothes, shoes, electronics, cosmetics. Many of them looked happy. Some looked tired.\n\nHe interviewed shoppers. A young woman showed him her bags. \"I didn't plan to buy anything,\" she said. \"It was an **impulse**. I saw a sale and I couldn't stop.\" She laughed. \"I **splurged**. Three hundred dollars on clothes I don't need.\"\n\nAn older man was more careful. \"I'm **frugal**,\" he said. \"I buy only what I need. My parents grew up after the war, when there was nothing. They taught me to be **thrifty**.\" He showed Minh a small notebook where he wrote every yen he spent.\n\nMinh talked to a shop manager. She explained how prices work. \"We buy the **merchandise** from the factory, then we add a **markup**: usually two or three times the price. Then, when we want to sell old stock, we do a **markdown**. A **clearance** sale at the end of the season. Fifty, sixty, seventy percent off.\"\n\n\"So the normal price is too high?\" asked Minh.\n\nThe manager smiled. \"Some people would say **exorbitant**. But we have rent, staff, everything. And people pay.\"\n\nMinh also visited a market where people sold **counterfeit** goods: fake designer bags, fake watches, fake sneakers. \"Ten percent of the real price,\" said the seller, a young man. \"Nobody can tell the difference.\" The police raided the market every few months, but it always came back.\n\nHe talked to an economics professor about it. \"Japan was very **materialistic** in the 1980s,\" she said. \"People bought everything. Expensive cars, expensive watches, an **extravagant** life. Then the economy crashed. There was a long **recession**. Many people became careful with money. Now, the young generation is different. Many prefer experiences to things.\"\n\nShe explained more. \"A country's economy is like a family's. If you spend more than you earn, you have a **deficit**. If you earn more than you spend, you have a **surplus**. Japan's government has a big deficit. But Japanese families save a lot.\"\n\nAt the same time, Minh had his own money news. The Blue Cup in Riverford had its yearly shareholders' meeting. Minh had bought one share, as a **shareholder**, and he joined by video. Daniel explained the numbers.\n\n\"This year, our revenue was up twenty percent,\" he said. \"After paying all the bills, the loan, the staff, we made a small profit. So for the first time, we can pay a **dividend** to our shareholders. Two pounds per share.\"\n\nEveryone cheered. Two pounds was nothing. But it was something.\n\nDaniel showed the accounts. \"Our **assets**: the building, the equipment, the money in the bank. Our **liabilities**: the bank loan, which we'll pay for fifteen more years. Our **equity**: the difference, which belongs to all of you.\"\n\n\"Is it a good **asset**?\" asked an old shareholder. \"Better than a government **bond**?\"\n\n\"No,\" said Daniel honestly. \"A bond pays more. But a bond doesn't make you coffee.\"\n\nEveryone laughed. Grandma Rose, who had twenty shares, said she would use her forty pounds to buy cake for everyone.\n\nThere was one more thing. Daniel had ordered new coffee from Vietnam, from the farmers Minh had found. But the shipment was stuck in **quarantine** at the port. \"Customs is checking everything,\" he said. \"Plants, food, coffee. Two weeks. Then it's ours.\"\n\nHe also had a subscription idea: customers could pay a monthly fee for a coffee every day. \"Like a phone subscription. And if you sign up for a year, you get a **rebate**: one month free.\"\n\nMinh wrote his article. He called it \"Things.\" He wrote about the woman with her bags, the frugal man with his notebook, the counterfeit market, and the small café in England that paid its shareholders two pounds. \"Maybe the question isn't how much we buy,\" he wrote. \"Maybe it's what we buy, and why. A **commodity** is just a thing. A café is a place. A place is worth more.\"\n\nYuko read it. \"It's a little philosophical,\" she said.\n\n\"Is that bad?\"\n\n\"No,\" she said. \"It's Saturday. People need philosophy on Saturday.\"", "words": 721, "new": [{"w": "quarantine", "p": "n/v", "vi": "cách ly kiểm dịch"}, {"w": "merchandise", "p": "n/v", "vi": "hàng hóa"}, {"w": "commodity", "p": "n", "vi": "hàng hoá / nguyên liệu thô"}, {"w": "consumerism", "p": "n", "vi": "chủ nghĩa tiêu dùng"}, {"w": "materialistic", "p": "adj", "vi": "coi trọng vật chất"}, {"w": "impulse", "p": "n", "vi": "sự thôi thúc"}, {"w": "splurge", "p": "v/n", "vi": "chi tiêu mạnh tay"}, {"w": "extravagant", "p": "adj", "vi": "xa hoa"}, {"w": "frugal", "p": "adj", "vi": "tiết kiệm"}, {"w": "thrifty", "p": "adj", "vi": "tằn tiện"}, {"w": "markup", "p": "n", "vi": "phần cộng thêm giá"}, {"w": "markdown", "p": "n", "vi": "mức giảm giá"}, {"w": "clearance", "p": "n", "vi": "sự cho phép"}, {"w": "rebate", "p": "n", "vi": "khoản hoàn tiền"}, {"w": "exorbitant", "p": "adj", "vi": "quá đắt"}, {"w": "counterfeit", "p": "adj/n", "vi": "giả mạo"}, {"w": "asset", "p": "n", "vi": "tài sản"}, {"w": "liability", "p": "n", "vi": "nợ phải trả"}, {"w": "dividend", "p": "n", "vi": "cổ tức"}, {"w": "equity", "p": "n", "vi": "sự công bằng"}, {"w": "shareholder", "p": "n", "vi": "cổ đông"}, {"w": "bond", "p": "n/v", "vi": "trái phiếu; mối liên kết; gắn kết"}, {"w": "recession", "p": "n", "vi": "suy thoái kinh tế"}, {"w": "deficit", "p": "n", "vi": "thâm hụt"}, {"w": "surplus", "p": "n/adj", "vi": "phần dư"}]}, {"id": "W38-2", "title": "The Fraud", "body": "In April, a big scandal hit Tokyo. A famous company that sold investment products had collapsed. Thousands of people had lost their money. The company was **insolvent**: it had no money left to pay anyone. The police said the managers had committed **fraud**.\n\nYuko gave the story to Minh and Min-ji, the persistent Korean reporter. \"Follow the money,\" she said.\n\nThe story was complicated. The company had promised **lucrative** investments: twenty percent profit every year. \"Too good to be true,\" said an expert. \"And it was.\"\n\nThe managers had **embezzled** money from their customers. They used it for luxury cars, houses and holidays. They also moved money through companies in other countries to hide it. \"That's money **laundering**,\" said a police officer. \"Making dirty money look clean.\"\n\nMinh and Min-ji interviewed victims. It was hard. An old couple had lost their savings. They had been **affluent** once; they owned a nice house. Now they were **impoverished**. \"We trusted them,\" said the woman. \"They were so friendly. So professional.\" Another man was completely **destitute**. He had lost his house and lived in a small room. \"I borrowed money to invest,\" he said. \"I used my house as **collateral**. Now the bank has it.\"\n\nThe victims were all **creditors** now: the company owed them money. But there was nothing to pay them with. \"The **debtor** has no money,\" said a lawyer. \"The creditors will get almost nothing back.\"\n\nThe scandal had big effects. The government talked about new rules. There was a debate about **fiscal** policy, government spending and taxes, and **monetary** policy, interest rates and money. Some politicians wanted a **subsidy** for the victims. Others said the government couldn't **subsidize** bad investments. One politician wanted a new **levy** on investment companies. Another talked about **tariffs** on foreign goods, which had nothing to do with the story.\n\n\"Politicians always talk about what they want to talk about,\" said Min-ji.\n\nAfter two weeks, Minh was tired. The story made him sad. Japan was **prosperous**, one of the richest countries in the world. But **prosperity** didn't protect everyone. Even in a rich country, people could lose everything.\n\nThat weekend, he needed something happy. He called his sister Lan in Vietnam. She was eighteen now, in her last year of high school. She was bright, ambitious and very busy.\n\n\"How's school?\" he asked.\n\n\"Exhausting,\" she said. \"Exams, exams, exams. In Vietnam, every subject is **compulsory**. Maths, literature, English, history, science, everything. In England, Mia says students can choose. They have **optional** subjects. **Electives**. Here, nothing is optional. Everything is **mandatory**.\"\n\n\"What about **extracurricular** activities?\" asked Minh. \"Clubs, sports?\"\n\n\"I'm in the English club and the debate club. And I teach poor kids English on Sundays. My teacher says I'm good at it. She says my **pedagogical** skills are natural. That I could be a teacher.\"\n\n\"Do you want to be a teacher?\"\n\nLan was quiet for a moment. \"I want to study **pedagogy**. The science of teaching. Abroad. Like you.\"\n\nMinh was surprised. And very proud. \"Where?\"\n\n\"Japan,\" said Lan. \"Or England. I'm applying for scholarships. Will you help me?\"\n\n\"Of course,\" said Minh. \"Of course I will.\"\n\nAfter the call, he felt better. The world had fraud and greed. But it also had seventeen-year-olds teaching poor kids English on Sundays. He had an **overdraft** on his bank account that month, from too many trips, but he didn't care. That night, he started to research scholarships for Lan.", "words": 573, "new": [{"w": "fiscal", "p": "adj", "vi": "thuộc tài khóa"}, {"w": "monetary", "p": "adj", "vi": "thuộc tiền tệ"}, {"w": "subsidy", "p": "n", "vi": "khoản trợ cấp"}, {"w": "subsidize", "p": "v", "vi": "trợ giá"}, {"w": "tariff", "p": "n", "vi": "thuế quan"}, {"w": "levy", "p": "n/v", "vi": "thuế phụ thu"}, {"w": "overdraft", "p": "n", "vi": "khoản thấu chi"}, {"w": "collateral", "p": "n", "vi": "tài sản thế chấp"}, {"w": "creditor", "p": "n", "vi": "chủ nợ"}, {"w": "debtor", "p": "n", "vi": "con nợ"}, {"w": "lucrative", "p": "adj", "vi": "sinh lợi"}, {"w": "prosperous", "p": "adj", "vi": "thịnh vượng"}, {"w": "prosperity", "p": "n", "vi": "sự thịnh vượng"}, {"w": "affluent", "p": "adj", "vi": "giàu có"}, {"w": "impoverished", "p": "adj", "vi": "nghèo khó"}, {"w": "destitute", "p": "adj", "vi": "cùng quẫn"}, {"w": "insolvent", "p": "adj", "vi": "mất khả năng thanh toán"}, {"w": "embezzle", "p": "v", "vi": "tham ô"}, {"w": "fraud", "p": "n", "vi": "lừa đảo"}, {"w": "laundering", "p": "n", "vi": "rửa tiền"}, {"w": "pedagogy", "p": "n", "vi": "sư phạm"}, {"w": "pedagogical", "p": "adj", "vi": "thuộc phương pháp giảng dạy"}, {"w": "compulsory", "p": "adj", "vi": "bắt buộc"}, {"w": "mandatory", "p": "adj", "vi": "bắt buộc"}, {"w": "optional", "p": "adj", "vi": "tuỳ chọn"}, {"w": "elective", "p": "adj/n", "vi": "môn tự chọn"}, {"w": "extracurricular", "p": "adj", "vi": "ngoại khóa"}]}, {"id": "W38-3", "title": "Lan's Application", "body": "For two months, Minh helped Lan with her scholarship applications. It reminded him of his own application, five years ago. Ms. Huong had helped him then. Now he was helping his sister.\n\nLan wanted to study education at a university in Tokyo. The university had a special program for international students. It was a famous university, **accredited** in many countries. Its **accreditation** meant that its degrees were respected everywhere.\n\nThe application was long. Lan needed to show her **proficiency** in English with a test score. She was already very **proficient**; her English was better than Minh's had been at her age. She also needed to take an **aptitude** test, a test of her natural ability.\n\n\"Why do they need all this?\" asked Lan. \"My grades are good.\"\n\n\"They want to see how you think,\" said Minh. \"Not just what you know. Japanese universities like **analytical** students. Students who can solve problems.\"\n\nLan was worried about one thing. \"In Vietnam, we learn by **rote**,\" she said. \"We memorize everything. The teacher talks, we write, we memorize, we repeat. I'm good at that. But am I good at thinking?\"\n\n\"You're very good at thinking,\" said Minh. \"You just haven't had the chance to show it.\"\n\nMinh asked his friend Dr. Thu, the Vietnamese scientist, for advice. She was a **scholar** now, with many **scholarly** articles. She had also been on the university's selection committee.\n\n\"The **dean** of the education faculty is very interested in students who want to improve their own countries,\" she said. \"Tell her about your Sunday classes. That's more important than grades.\"\n\nLan wrote an essay about her Sunday students. One of them was a boy who couldn't read well. The teachers at his school said he was lazy. Lan noticed that he mixed up letters: b and d, p and q. She researched it online. \"I think he has **dyslexia**,\" she wrote. \"A difference in how the brain reads. It's not about intelligence. **Dyslexic** children are often very bright. They just need a different way to learn.\"\n\nShe found a **remedial** reading program online, free, and used it with him. After six months, he could read. \"He's actually **gifted** at maths,\" she wrote. \"Nobody knew, because he couldn't read the questions.\"\n\n\"That's the essay,\" said Minh, when he read it. \"That's it.\"\n\nLan sent everything in May. Then she waited. Minh knew that feeling well.\n\nWhile they waited, Minh learned more about Japanese **tertiary** education: universities and colleges after high school. The head of a university, the **chancellor**, was usually a famous professor. **Alumni**, former students, gave money and helped new students. One famous **alumnus** of Lan's chosen university was a Nobel Prize winner.\n\n\"What happens if I get in?\" asked Lan. \"Can I **matriculate** in September?\"\n\n\"If you get the scholarship, yes. You'd start in September.\"\n\nIn June, the email came. Lan opened it during a video call with Minh, his parents and their grandmother all watching.\n\nShe read it. She read it again. Then she screamed.\n\n\"Full scholarship!\" she shouted. \"Tuition, housing, everything! And a small **remuneration** for teaching assistant work. They pay me to help teach!\"\n\nTheir mother cried. Their father stood up and walked around the room. Their grandmother said, \"Two children abroad. Who will take care of me?\" But she was smiling.\n\nMinh felt so proud he couldn't speak. His little sister, the one who listened at the door during his interview. The one who wrote \"Hello, England\" on his T-shirt.\n\n\"You'll be in Tokyo,\" he said finally. \"In the same city as me.\"\n\n\"I know!\" said Lan. \"You'll have to take care of me!\"\n\n\"Hana will take care of you,\" said Minh. \"I'll just buy you dinner.\"\n\nThat night, he thought about **vocation**: the feeling that you are meant to do something. Lan had found hers: teaching. It was not only a **livelihood**, a way to earn money. It was a calling. The **compensation** was small. The **incentive** was not money. It was the boy who learned to read.\n\nHe wrote to Ms. Huong, his old English teacher in Vietnam. \"My sister is following the path you showed me,\" he wrote. \"Thank you. You changed two lives.\" Ms. Huong replied the next day: \"That's the best **appraisal** a teacher can get.\" He thought she was an **intellectual** in the best sense: someone who used her mind to help others.", "words": 727, "new": [{"w": "tertiary", "p": "adj", "vi": "bậc đại học"}, {"w": "alumni", "p": "n", "vi": "cựu sinh viên"}, {"w": "alumnus", "p": "n", "vi": "nam cựu sinh viên"}, {"w": "dean", "p": "n", "vi": "trưởng khoa"}, {"w": "chancellor", "p": "n", "vi": "lãnh đạo đại học"}, {"w": "accreditation", "p": "n", "vi": "sự công nhận chất lượng"}, {"w": "accredited", "p": "adj", "vi": "được kiểm định"}, {"w": "matriculate", "p": "v", "vi": "nhập học đại học"}, {"w": "aptitude", "p": "n", "vi": "năng khiếu"}, {"w": "proficiency", "p": "n", "vi": "trình độ thành thạo"}, {"w": "proficient", "p": "adj", "vi": "thành thạo"}, {"w": "rote", "p": "n", "vi": "sự học thuộc máy móc"}, {"w": "analytical", "p": "adj", "vi": "có tính phân tích"}, {"w": "intellectual", "p": "adj/n", "vi": "thuộc trí tuệ"}, {"w": "scholar", "p": "n", "vi": "học giả"}, {"w": "scholarly", "p": "adj", "vi": "có tính học thuật"}, {"w": "remedial", "p": "adj", "vi": "phụ đạo"}, {"w": "gifted", "p": "adj", "vi": "có năng khiếu"}, {"w": "dyslexia", "p": "n", "vi": "chứng khó đọc"}, {"w": "dyslexic", "p": "adj/n", "vi": "mắc chứng khó đọc"}, {"w": "vocation", "p": "n", "vi": "thiên hướng nghề nghiệp"}, {"w": "livelihood", "p": "n", "vi": "sinh kế"}, {"w": "remuneration", "p": "n", "vi": "thù lao / lương thưởng (bao gồm tất cả)"}, {"w": "compensation", "p": "n", "vi": "tiền bù đắp"}, {"w": "incentive", "p": "n", "vi": "động lực, khuyến khích"}, {"w": "appraisal", "p": "n", "vi": "sự đánh giá"}]}, {"id": "W38-4", "title": "Burnout", "body": "In July, Hana stopped sleeping.\n\nIt started slowly. She worked longer and longer hours at the hospital. There were not enough nurses, so she took extra shifts. She came home at midnight and left at six. She ate standing up. She checked her phone in bed for messages from work.\n\n\"You're a **workaholic**,\" said Minh one night.\n\n\"I'm not,\" said Hana. \"I'm needed. There's a difference.\"\n\nBut one morning, she couldn't get out of bed. She wasn't sick. She was just empty. She cried for an hour and didn't know why.\n\nMinh called the hospital and said she was ill. Then he called Dr. Tanaka, her boss. Dr. Tanaka came to their flat that afternoon. He talked to Hana for a long time.\n\n\"It's **burnout**,\" he said to Minh afterwards. \"Very common in nurses. Too much work, too much stress, for too long. The body and the mind say: stop.\"\n\nHana took a month off. At first, she felt guilty. \"My colleagues are working so hard. And I'm here, doing nothing.\"\n\n\"You're not doing nothing,\" said Minh. \"You're healing.\"\n\nDuring that month, they talked a lot about work. Minh realized he had the same problem, in a smaller way. He worked all the time too: at the newspaper, on his second book, on Lan's applications. He couldn't multitask anymore; he was doing too many things and none of them well.\n\nThey talked to friends about their jobs. Everybody had problems.\n\nBen, the Australian journalist, had been told his job might disappear. The newspaper was **downsizing**: cutting staff to save money. \"Twenty people will be made redundant,\" he said. \"**Redundancy** is a polite word for being fired. A layoff.\"\n\nAiko, the quiet writer, had decided to **telecommute**: work from home three days a week. \"The company agreed to **flexitime**,\" she said. \"I start at ten and finish at six. It's much better.\"\n\nMin-ji had been approached by a **headhunter**, a person who finds workers for other companies. \"A big American company wants to **headhunt** me,\" she said. \"Double the salary. But I'd have to move to New York.\"\n\nPierre, the old French journalist, was on **probation** at his new job: his first three months were a test. \"At sixty-two, after a twenty-year **tenure** at my old paper,\" he said. \"Ridiculous. But that's the job market now.\"\n\nYuko talked about how the newspaper was changing. \"Many companies now **outsource** work,\" she said. \"They pay other companies, often in other countries, to do jobs cheaply. **Clerical** work, **administrative** work. Even some writing.\" She shook her head. \"I worry about the future.\"\n\nMinh asked Yuko about her own career. She was the most **competent** editor he had ever worked with, after Grace. \"How do you avoid burnout?\" he asked.\n\n\"I **delegate**,\" she said. \"I can't do everything myself. I give tasks to other people. And I have a **mentor**: an old editor I call every month. She tells me when I'm working too hard.\"\n\n\"Do you think I could have a mentor?\"\n\n\"You have one,\" said Yuko. \"Grace. You call her every week.\"\n\nMinh realized she was right.\n\nHe called Grace that night. He told her about Hana and about his own exhaustion. Grace listened. Then she said, \"You know what I learned in thirty years of journalism? Work is not a **hierarchy** where you climb to the top and then rest. There's no top. The work never ends. So you have to rest along the way.\"\n\n\"How?\"\n\n\"Choose what matters. Say no to the rest. Spend time with the people you love. Your **productivity** will go up, not down.\" She paused. \"And Minh? Marry that girl before she gets tired of you.\"\n\nMinh laughed. But he thought about it all night.\n\nAfter a month, Hana went back to work. But things were different. She worked normal hours. She said no to extra shifts. In the **negotiation** with her boss, she asked for one day off every week, guaranteed. Dr. Tanaka agreed. \"Your **competence** is more important than your hours,\" he said. \"A tired nurse makes mistakes.\"\n\nHana was happier. So was Minh. They started walking in the park every Sunday morning, without phones. They cooked dinner together. They talked about the future.\n\n\"I think we've learned something,\" said Hana one Sunday.\n\n\"What?\"\n\n\"That every **stakeholder** in our life matters: you, me, our families, our jobs. But we come first. Not the job.\"\n\n\"You sound like a business book,\" said Minh.\n\n\"I've been reading your **entrepreneurial** books,\" said Hana. \"Too much **managerial** language. I'm going back to novels.\"\n\nMinh laughed. He realized that his old **subordinate** role, always the junior, the intern, the student, was changing. He was becoming someone people asked for advice. It was strange. And a little scary. They had learned to collaborate, at home and at work, and their collaboration felt stronger than ever. **Mentoring** others, he decided, would be his next step.", "words": 813, "new": [{"w": "probation", "p": "n", "vi": "thời gian thử việc"}, {"w": "tenure", "p": "n", "vi": "nhiệm kỳ"}, {"w": "workaholic", "p": "n", "vi": "người nghiện công việc"}, {"w": "burnout", "p": "n", "vi": "kiệt sức"}, {"w": "delegate", "p": "n/v", "vi": "đại biểu"}, {"w": "negotiation", "p": "n", "vi": "cuộc đàm phán"}, {"w": "outsource", "p": "v", "vi": "thuê ngoài"}, {"w": "telecommute", "p": "v", "vi": "làm việc từ xa"}, {"w": "flexitime", "p": "n", "vi": "giờ làm linh hoạt"}, {"w": "headhunt", "p": "v", "vi": "săn nhân tài"}, {"w": "headhunter", "p": "n", "vi": "người săn nhân tài"}, {"w": "downsizing", "p": "n", "vi": "việc thu hẹp quy mô"}, {"w": "redundancy", "p": "n", "vi": "sự dư thừa nhân sự / cắt giảm nhân sự"}, {"w": "entrepreneurial", "p": "adj", "vi": "thuộc kinh doanh khởi nghiệp"}, {"w": "managerial", "p": "adj", "vi": "thuộc quản lý"}, {"w": "administrative", "p": "adj", "vi": "thuộc hành chính"}, {"w": "clerical", "p": "adj", "vi": "văn phòng, thư ký"}, {"w": "subordinate", "p": "adj/n/v", "vi": "cấp dưới"}, {"w": "hierarchy", "p": "n", "vi": "hệ thống cấp bậc"}, {"w": "mentor", "p": "n/v", "vi": "người cố vấn"}, {"w": "productivity", "p": "n", "vi": "năng suất"}, {"w": "competence", "p": "n", "vi": "năng lực"}, {"w": "competent", "p": "adj", "vi": "có năng lực"}, {"w": "stakeholder", "p": "n", "vi": "bên liên quan"}]}, {"id": "W38-5", "title": "The Takeover", "body": "In September, Lan arrived in Tokyo. Minh and Hana met her at the airport. She was carrying two huge suitcases and a bag of food from their mother. \"Mum says Japanese food isn't real food,\" she said. \"Don't tell Hana.\"\n\n\"I can hear you,\" said Hana, laughing.\n\nThe same week, there was big news at Minh's newspaper. The paper was being bought by a huge **conglomerate**, a company that owned TV channels, magazines, hotels and a chain of convenience stores. It was not a merger of equals; it was an **acquisition**. The newspaper would become a **subsidiary** of the big company.\n\nYuko called a **briefing** for all the staff. Everyone was worried. \"What does this mean for us?\" asked Ben.\n\n\"I don't know yet,\" said Yuko honestly. \"The new owners have sent a **memorandum**. They say they want to 'create **synergy**' between the newspaper and their TV channels. They want to use our stories on their websites. They talk about '**leverage**' and 'growth.'\"\n\n\"That means they'll cut jobs,\" said Pierre.\n\n\"Maybe,\" said Yuko. \"They've hired auditors to do an audit of our accounts. They'll look at everything.\"\n\nOver the next weeks, the newspaper changed. New managers came. They talked about **benchmarks**, projections and a quota of articles per week. Every story needed to be \"efficient.\" Every reporter had to write more, faster.\n\n\"It's a factory now,\" said Ben.\n\nThe new managers also wanted the newspaper to work with the conglomerate's other businesses. A story about a new restaurant? Mention that it was a **franchise** of the company's hotel chain. A story about shopping? Mention the convenience stores. \"That's not journalism,\" said Yuko. \"That's advertising.\"\n\nThere were also new rules. A new **regulatory** department checked **compliance** with company **regulations**. Every story had to be approved by three people. The **bureaucracy** was terrible. \"It used to take one hour to publish a story,\" said Min-ji. \"Now it takes one day. Everything is so **bureaucratic**.\"\n\nMinh wrote a story about a new startup in Tokyo, a small company making cheap solar panels. It was an exciting **venture**: two young engineers with a great idea. But the new managers didn't like it. \"One of our companies is a supplier of solar panels,\" they said. \"This startup is a competitor. Don't write about them.\"\n\nMinh couldn't believe it. He went to Yuko. \"They're telling me what not to write,\" he said. \"That's censorship.\"\n\nYuko was quiet for a long time. Then she said, \"I know. I'm fighting it. But I don't know if I'll win.\"\n\nTwo weeks later, Yuko resigned. She wrote a short letter to the staff. \"I can't work for a newspaper that serves a company instead of its readers,\" she wrote. \"I'm sorry. I'll be starting something new. If any of you want to join me, call me.\"\n\nMinh called her that night. \"What are you starting?\"\n\n\"A small independent news website,\" she said. \"No big owners. No advertising from big companies. Readers pay a small subscription. It's a risk. The **feasibility** isn't certain. We'll need **liquidity**: enough cash to survive the first year. But I think there's a **consensus** among good journalists that something like this is needed.\"\n\n\"I'm in,\" said Minh.\n\n\"Think about it first,\" said Yuko. \"It's less money. Less security.\"\n\n\"I don't need to think,\" said Minh. \"I've done this before. I helped save a café with five hundred shareholders. I can help start a newspaper.\"\n\nSo Minh left the big newspaper too. So did Ben, Min-ji and Aiko. Pierre stayed; he was too old to start again, he said. But he promised to write for them sometimes.\n\nYuko's new website was small. It had no **logistics** department, no **procurement** office, no distributor or **wholesaler** for paper copies. Just six journalists, six laptops and one algorithm that Ben built to send the stories to readers. But it was free. Not free to read, free to write.\n\n\"It's like the Gazette,\" Minh told Grace on the phone. \"Small, independent, poor.\"\n\n\"It sounds perfect,\" said Grace. \"Every **monopoly** needs someone to fight it. Make sure you write something I can steal for Riverford.\"\n\nLan, who had been in Tokyo for one month, watched all of this with wide eyes. \"Is your job always this dramatic?\" she asked.\n\n\"Sometimes,\" said Minh. \"Welcome to Tokyo.\"", "words": 713, "new": [{"w": "acquisition", "p": "n", "vi": "sự mua lại"}, {"w": "subsidiary", "p": "adj/n", "vi": "công ty con"}, {"w": "conglomerate", "p": "n", "vi": "tập đoàn đa ngành"}, {"w": "monopoly", "p": "n", "vi": "độc quyền"}, {"w": "franchise", "p": "n/v", "vi": "nhượng quyền thương mại"}, {"w": "venture", "p": "n/v", "vi": "dự án kinh doanh"}, {"w": "liquidity", "p": "n", "vi": "tính thanh khoản"}, {"w": "logistics", "p": "n", "vi": "hậu cần / logistics"}, {"w": "procurement", "p": "n", "vi": "mua sắm, thu mua"}, {"w": "wholesaler", "p": "n", "vi": "nhà bán buôn"}, {"w": "benchmark", "p": "n/adj/v", "vi": "mốc chuẩn"}, {"w": "compliance", "p": "n", "vi": "sự tuân thủ"}, {"w": "regulation", "p": "n/adj", "vi": "quy định"}, {"w": "regulatory", "p": "adj", "vi": "thuộc quản lý quy định"}, {"w": "bureaucracy", "p": "n", "vi": "bộ máy hành chính"}, {"w": "bureaucratic", "p": "adj", "vi": "quan liêu"}, {"w": "memorandum", "p": "n", "vi": "bản ghi nhớ"}, {"w": "briefing", "p": "n", "vi": "buổi phổ biến thông tin"}, {"w": "consensus", "p": "n", "vi": "sự đồng thuận"}, {"w": "feasibility", "p": "n", "vi": "tính khả thi"}, {"w": "leverage", "p": "n/v", "vi": "đòn bẩy"}, {"w": "synergy", "p": "n", "vi": "hiệu quả phối hợp"}]}, {"id": "W39-1", "title": "The Attack", "body": "Yuko's new website was called Open Tokyo. In its first month, it had five thousand subscribers. In its second month, ten thousand. People liked its honest, careful stories. Then, in the third month, someone attacked it.\n\nIt happened at night. Ben, who did all the technology, got a message at three in the morning: the website was down. When he checked, he found malware: a dangerous program that someone had put on their server. It was sending readers to fake pages and stealing their passwords.\n\n\"It's cybercrime,\" said Ben the next morning. His eyes were red. \"Someone broke through our firewall. Our cybersecurity was too weak.\"\n\n\"Who would do this?\" asked Minh.\n\n\"Someone who doesn't like our stories,\" said Yuko.\n\nBen worked for three days without sleep. He had to troubleshoot the whole system. He found a bug in the website's code: a small mistake that let the attackers in. He had to debug everything. He configured a new server with a better configuration. He made sure all the readers' information was encrypted: turned into secret code that nobody could read. \"Strong encryption,\" he said. \"Now even if they get in, they can't read anything.\"\n\nMinh didn't understand most of it. Ben tried to explain. \"The old system was obsolete. Ten years old. It wasn't compatible with modern security. The compatibility problems made it weak. Plus, our broadband was cheap and slow. Not enough bandwidth to stop the attack.\"\n\nThey bought a new computer with a faster processor. Ben talked about **semiconductors**, silicon chips, gigabytes and megabytes. He connected new **peripheral** devices: a bigger screen, a backup drive. He made a new interface for the website: simpler, cleaner, with better resolution for photos, every pixel sharp. \"In the old **analog** days,\" he said, \"you couldn't hack a newspaper. You'd have to steal the paper.\"\n\nThere was a small glitch when they restarted, but Ben fixed it in an hour.\n\nMeanwhile, Minh wrote a story about the attack. He was careful. He didn't know who had done it. He couldn't accuse anyone without proof. \"That would be **libel**,\" said Yuko. \"Writing something false that damages someone's reputation. They could take us to court. And saying it out loud is **slander**. Both are **defamation**.\"\n\nSome big newspapers didn't care about these rules. A **mainstream** TV channel reported that \"a foreign government\" had attacked Open Tokyo, without any evidence. It was pure **sensationalism**: making a story more exciting than it really was. \"That's how misinformation spreads,\" said Yuko. \"One channel says it, another repeats it. Soon everyone believes it.\"\n\n\"And disinformation is worse,\" said Min-ji. \"That's false information spread on purpose. **Propaganda**.\"\n\nThe attack became a big story. A famous TV **anchor** wanted to interview Yuko on the evening news. **Paparazzi** waited outside their small office, taking photos. A foreign **correspondent** from the BBC called Minh. \"Can you give us an **exclusive**?\" he asked. \"A **scoop**?\"\n\n\"No,\" said Minh. \"Everyone gets the same facts.\"\n\nYuko agreed. \"Our job is **objectivity**,\" she said. \"We report the facts. We're not **subjective**, not emotional. We're **impartial**. We don't take sides. Even when we're the victim.\"\n\nIn the end, the police found the attackers: a small group paid by a company that Open Tokyo had criticized in a story about pollution. The company had wanted to stop the story. Instead, the attack made the story famous. Ten thousand new subscribers joined in a week.\n\n\"They wanted to silence us,\" said Yuko. \"They made us louder.\"\n\nMinh wrote a final column about it. He wrote about bias, about truth, and about the importance of independent journalism. \"In a world of **sensational** headlines and fake stories,\" he wrote, \"the most radical thing a newspaper can do is to be boring and correct.\" Grace shared it on the Gazette's website with one comment: \"Exactly.\"\n\nBen slept for two days after that. When he woke up, he had a message from Yuko: a pay rise and a new title. Chief of Technology. \"I'm the chief of one person,\" he said. \"Myself.\" But he was smiling. The future of news, he said, was automation, robotics, maybe nanotechnology and biotechnology one day. \"But the stories will still need people.\"", "words": 696, "new": [{"w": "peripheral", "p": "adj/n", "vi": "thiết bị ngoại vi"}, {"w": "semiconductor", "p": "n", "vi": "chất bán dẫn"}, {"w": "analog", "p": "adj", "vi": "tương tự"}, {"w": "propaganda", "p": "n", "vi": "tuyên truyền"}, {"w": "sensationalism", "p": "n", "vi": "lối đưa tin giật gân / phóng đại"}, {"w": "sensational", "p": "adj", "vi": "giật gân"}, {"w": "objectivity", "p": "n", "vi": "tính khách quan"}, {"w": "subjective", "p": "adj", "vi": "chủ quan"}, {"w": "impartial", "p": "adj", "vi": "công bằng"}, {"w": "mainstream", "p": "adj/n/v", "vi": "chính thống phổ biến"}, {"w": "correspondent", "p": "n", "vi": "phóng viên thường trú"}, {"w": "anchor", "p": "n/v", "vi": "người dẫn bản tin"}, {"w": "paparazzi", "p": "n", "vi": "thợ săn ảnh"}, {"w": "exclusive", "p": "adj/n", "vi": "độc quyền"}, {"w": "scoop", "p": "n", "vi": "tin độc quyền"}, {"w": "libel", "p": "n", "vi": "sự phỉ báng bằng văn bản"}, {"w": "slander", "p": "n/v", "vi": "sự vu khống bằng lời"}, {"w": "defamation", "p": "n", "vi": "sự phỉ báng"}]}, {"id": "W39-2", "title": "The Summit", "body": "In November, there was a big international summit in Tokyo. Leaders from twenty countries came to talk about trade, climate and security. Open Tokyo was small, but Yuko got Minh a press pass.\n\nOpen Tokyo had a small **circulation**, nothing like the big papers, and no TV **ratings** or **airtime** at all. But Yuko said that didn't matter. The summit was very formal. There were presidents, prime ministers and kings. Every **diplomat** had a team of advisors. Security was everywhere. Minh sat in a big room with five hundred journalists, waiting for news.\n\nOn the first day, the leaders signed a **treaty** about climate change. Each country promised to cut emissions. \"It's a good start,\" said an expert. \"But treaties need **legislation**: each country's **legislative** body, its parliament, must make it law. That's the hard part.\"\n\nOn the second day, they discussed a conflict in another part of the world. Some countries wanted **sanctions** against a country that had invaded its neighbor: no trade, no money, nothing. Others said **diplomacy** was better: talking, not punishing.\n\nMinh interviewed many people. A Swiss expert explained different political systems. \"Some countries are democracies,\" she said. \"Others have an **authoritarian** **regime**: one leader or one party controls everything. The most extreme is **totalitarian**: the government controls not only politics but every part of life. What people read, say, even think.\"\n\nShe talked about **sovereignty**: the right of a country to govern itself. \"Every **sovereign** state wants to make its own decisions. But in a connected world, decisions affect everyone. That's the tension.\"\n\nShe also explained how democracy works in different places. \"In America, there's a **federal** system: the central government and fifty states share power. The **constitution** protects people's rights. Some questions go to the Supreme Court as **constitutional** questions. In Britain, there's no written constitution at all.\"\n\nMinh was interested in elections. \"Japan's system is a **coalition**,\" she explained. \"Usually, two or more parties work together to make a government. The opposition parties criticize them. Each **constituency** elects one person to parliament. The whole **electorate**, every voter, chooses on a **ballot** paper.\"\n\n\"What about a **referendum**?\" asked Minh.\n\n\"That's when the whole country votes on one question. Like Britain and Europe. Very powerful. Very dangerous. It can divide a country for years.\"\n\nOn the third day, Minh found a different kind of story. A journalist from the Philippines, Carla, the woman who had shown him Manila, was at the summit. She told him about a scandal. \"A government official in my country has been taking **bribes**,\" she said. \"Money from companies who want contracts. It's **bribery**. **Corruption**. And he's here, at the summit, smiling for the cameras.\"\n\n\"Can you prove it?\" asked Minh.\n\n\"I'm trying,\" said Carla. \"He's very powerful. People are afraid. In some countries, **corrupt** officials are protected. In others, journalists who report on them disappear.\"\n\nShe also told him about **smuggling**: people who **smuggled** goods across borders without paying taxes. \"Cigarettes, phones, even people,\" she said. \"It's connected to the corruption. The official lets the smugglers pass.\"\n\nMinh helped Carla check some documents. They found a link between the official and a company that had won a big contract. It was not enough to publish yet. But it was a start.\n\nAt the end of the summit, the leaders made speeches about **governance**, transparency and trust. \"We are committed to fighting corruption,\" said one of them. Carla, sitting next to Minh, laughed quietly.\n\n\"The **ministry** of finance in my country says the same thing every year,\" she said. \"Nothing changes.\"\n\n\"Maybe this time,\" said Minh.\n\n\"Maybe,\" said Carla. \"If journalists keep asking.\"\n\nThat night, Minh wrote about the summit. Not the official speeches, but the real story: the gap between what leaders say and what they do. Yuko published it with the headline: \"Words and Actions.\" It was shared all over Asia. Carla's story about the corrupt official came out three months later. He was arrested a week after that.", "words": 660, "new": [{"w": "circulation", "p": "n", "vi": "số lượng phát hành / lưu hành"}, {"w": "ratings", "p": "n", "vi": "chỉ số người xem"}, {"w": "airtime", "p": "n", "vi": "thời lượng phát sóng"}, {"w": "legislation", "p": "n", "vi": "pháp luật, luật pháp"}, {"w": "legislative", "p": "adj", "vi": "thuộc lập pháp"}, {"w": "constitution", "p": "n", "vi": "hiến pháp"}, {"w": "constitutional", "p": "adj/n", "vi": "thuộc hiến pháp"}, {"w": "sovereignty", "p": "n", "vi": "chủ quyền"}, {"w": "sovereign", "p": "n/adj", "vi": "có chủ quyền"}, {"w": "federal", "p": "adj", "vi": "liên bang"}, {"w": "regime", "p": "n", "vi": "chế độ"}, {"w": "authoritarian", "p": "adj/n", "vi": "độc đoán"}, {"w": "totalitarian", "p": "adj", "vi": "toàn trị"}, {"w": "diplomacy", "p": "n", "vi": "ngoại giao"}, {"w": "diplomat", "p": "n", "vi": "nhà ngoại giao"}, {"w": "treaty", "p": "n", "vi": "hiệp ước"}, {"w": "sanction", "p": "n/v", "vi": "sự cho phép chính thức"}, {"w": "sanctions", "p": "n", "vi": "lệnh trừng phạt"}, {"w": "referendum", "p": "n", "vi": "cuộc trưng cầu dân ý"}, {"w": "ballot", "p": "n/v", "vi": "lá phiếu"}, {"w": "electorate", "p": "n", "vi": "toàn thể cử tri"}, {"w": "constituency", "p": "n", "vi": "khu vực bầu cử"}, {"w": "coalition", "p": "n", "vi": "liên minh"}, {"w": "ministry", "p": "n", "vi": "bộ (chính phủ)"}, {"w": "governance", "p": "n", "vi": "quản trị, cách điều hành"}, {"w": "corruption", "p": "n", "vi": "tham nhũng"}, {"w": "corrupt", "p": "adj/v", "vi": "tham nhũng"}, {"w": "bribe", "p": "v/n", "vi": "tiền hối lộ"}, {"w": "bribery", "p": "n", "vi": "hối lộ"}, {"w": "smuggle", "p": "v", "vi": "buôn lậu"}]}, {"id": "W39-3", "title": "The Workers", "body": "In January, Minh got a message from a stranger. It was in Vietnamese. \"Please help us. We are Vietnamese workers in Japan. We are being treated badly. Nobody listens.\"\n\nMinh met the writer, a young man called Tuan, like his old friend. He was twenty-four and worked in a factory in a small town north of Tokyo. He had come to Japan on a work program, hoping to earn money for his family. But the reality was different.\n\n\"The agency in Vietnam took eight thousand dollars from my family,\" he said. \"They promised a good job. When I came, they took my passport. I work fourteen hours a day. They pay me half of what they promised. If I complain, they say they will **deport** me.\"\n\nMinh felt sick. He had heard stories like this before. But hearing it from a person, in his own language, was different.\n\nHe investigated for two months with Min-ji. They talked to thirty workers from Vietnam, Indonesia and the Philippines. They found a pattern. Some agencies were involved in human **trafficking**: moving people across borders and forcing them to work. Some were also involved in **smuggling** workers into the country illegally.\n\nThey found a lawyer who helped workers. She explained the law. \"Taking someone's passport is an **offense**. Forcing someone to work is a **felony**: a serious crime. Paying less than the minimum wage is a **misdemeanor**: a smaller crime, but still a crime. The problem is that the workers are afraid. If they complain, they might lose their visa. **Deportation** is their biggest fear.\"\n\n\"Can they ask for **asylum**?\" asked Minh.\n\n\"Asylum is for people escaping danger in their own country. These workers aren't refugees. They're migrant workers. They're **marginalized**: on the edge of society, without power or protection. Many **minorities** in Japan face this.\"\n\nThe lawyer had taken a case to court. The **plaintiff** was a group of Indonesian workers. The **defendant** was the factory owner. Minh went to the trial.\n\nThe **prosecutor** for the state presented the evidence. It was strong. The **prosecution** showed documents, photos and messages. The workers spoke about their experience. The factory owner said he didn't know what the agency was doing.\n\nAfter two weeks, the judge gave the **verdict**. The factory owner was **convicted** of forcing people to work and stealing wages. His **conviction** was big news in Japan. He was taken into **custody** immediately. \"Five years in prison,\" said the lawyer. \"No **parole** for at least three.\"\n\n\"Will that stop others?\" asked Minh.\n\n\"It's a **deterrent**,\" she said. \"It shows other **offenders** that they can be punished. But one case isn't enough. The system needs to change.\"\n\nNot everyone was happy. A week later, the agency boss was acquitted in a separate trial. To **acquit** someone means the court says they are not guilty. The court said there wasn't enough evidence. He walked out free. The police had **detained** him for a month, but now he was gone. \"The **prosecuted** don't always pay,\" said the lawyer. \"That's the hard truth.\"\n\nMinh's story was published in Japanese and Vietnamese. It caused a big reaction in both countries. In Vietnam, the government promised to investigate the agencies. In Japan, an **activist** group started a campaign for workers' rights.\n\nTuan, the young worker, got a new job with a fair company. He sent Minh a photo: him and his friends, smiling, at a small Vietnamese restaurant in Tokyo. \"Thank you, brother,\" he wrote.\n\nThe story made Minh think about **integration**. Japan was becoming more **multicultural**. More people of different **ethnicity** lived there: Vietnamese, Filipino, Brazilian, Nepalese. \"But integration is slow,\" said the activist. \"There's still **segregation**: foreigners live in separate areas, work separate jobs. **Ethnic** minorities don't have the same opportunities.\"\n\nMinh thought about his own life. He had been a foreigner in England and now in Japan. But he had been lucky: a scholarship, a good family, good friends. Tuan had none of that. The difference between them was luck. Nothing else.", "words": 665, "new": [{"w": "smuggling", "p": "n", "vi": "hoạt động buôn lậu"}, {"w": "trafficking", "p": "n", "vi": "buôn lậu"}, {"w": "prosecute", "p": "v", "vi": "truy tố"}, {"w": "prosecution", "p": "n", "vi": "bên truy tố; sự truy tố"}, {"w": "prosecutor", "p": "n", "vi": "công tố viên"}, {"w": "defendant", "p": "n", "vi": "bị cáo"}, {"w": "plaintiff", "p": "n", "vi": "nguyên đơn"}, {"w": "verdict", "p": "n", "vi": "phán quyết"}, {"w": "acquit", "p": "v", "vi": "tuyên trắng án"}, {"w": "convict", "p": "v/n", "vi": "kết tội"}, {"w": "conviction", "p": "n", "vi": "bản án kết tội"}, {"w": "parole", "p": "n/v", "vi": "tha có điều kiện (ra tù sớm)"}, {"w": "custody", "p": "n", "vi": "sự giam giữ"}, {"w": "detain", "p": "v", "vi": "tạm giữ"}, {"w": "offense", "p": "n", "vi": "hành vi phạm pháp"}, {"w": "offender", "p": "n", "vi": "người phạm tội"}, {"w": "felony", "p": "n", "vi": "trọng tội"}, {"w": "misdemeanor", "p": "n", "vi": "khinh tội"}, {"w": "deterrent", "p": "n/adj", "vi": "biện pháp răn đe"}, {"w": "marginalized", "p": "adj", "vi": "bị gạt ra ngoài lề"}, {"w": "minorities", "p": "n", "vi": "các nhóm thiểu số"}, {"w": "asylum", "p": "n", "vi": "sự tị nạn"}, {"w": "deport", "p": "v", "vi": "trục xuất"}, {"w": "deportation", "p": "n", "vi": "sự trục xuất"}, {"w": "integration", "p": "n", "vi": "sự hòa nhập"}, {"w": "multicultural", "p": "adj", "vi": "đa văn hoá"}, {"w": "ethnicity", "p": "n", "vi": "sắc tộc"}, {"w": "ethnic", "p": "adj/n", "vi": "thuộc dân tộc"}, {"w": "segregation", "p": "n", "vi": "sự phân biệt cách ly"}, {"w": "activist", "p": "n", "vi": "nhà hoạt động"}]}, {"id": "W39-4", "title": "Small Fights, Big Fights", "body": "In February, Minh did a series called \"People Who Fight.\" It was about **activism**: people who work to change things.\n\nHis first interview was with the activist from the workers' story, a Japanese woman called Keiko. She had spent thirty years in **advocacy** for migrant workers. \"I **advocate** for people who have no voice,\" she said. \"I'm not a politician. I'm not rich. I'm **grassroots**: I work from the bottom, with ordinary people.\"\n\nShe worked for a **nonprofit** organization. It didn't make money. It survived on donations and **philanthropy** from a few rich people who cared. \"Some rich people buy yachts,\" she said. \"Some give money to help others. I'm grateful for the second kind.\"\n\nHis second interview was with Hana's friend, a doctor who worked for a **humanitarian** organization. She had worked in war zones for ten years. She had seen terrible things: **warfare**, refugee camps, an **insurgency** where **militant** groups attacked villages. In one country, she had seen evidence of **genocide**: the killing of a whole ethnic group.\n\n\"How do you keep going?\" asked Minh.\n\n\"Every **ceasefire** gives hope,\" she said. \"Even for a week. Even for a day. In that time, we can bring food and medicine. One day of peace can save a thousand lives.\"\n\nHis third interview was different. Grace had sent him a story from Riverford. Riverford Football Club was in trouble. The team was at the bottom of its league. If they lost the last three games, they would face **relegation**: they would be **relegated** to a lower league. Their main **sponsor** had just left, and without **sponsorship**, the club might close.\n\nLeo, home from university, was helping. He was playing for the team again: not as a professional, but as an amateur. His knee was fine. \"We're the **underdog**,\" he said on a video call. \"Everyone thinks we'll lose. But we're not finished.\"\n\nMinh wrote about it from Tokyo, using Leo's information. The team's first game was against the strongest team in the league, an **unbeaten** team that was **undefeated** all season. A **contender** for the championship. Nobody expected Riverford to win.\n\nThey won one-nil. Leo scored.\n\nThe second game was a draw. The third game was the last of the season. If they won, they would stay in the league. If they lost, they would go down.\n\nMinh watched the match live on his laptop at four in the morning in Tokyo. Hana watched with him, half asleep. Lan came over too, with snacks.\n\nIt was a hard game. The other team was fast and strong. Riverford's players showed amazing **endurance**: they ran for ninety minutes without stopping. Leo showed incredible **agility**, turning and twisting past players. With ten minutes left, it was one-one. Minh's **adrenaline** was so high he couldn't sit down.\n\nThen, in the last minute, Leo got the ball. He ran. He shot. Goal!\n\nMinh screamed so loudly that the neighbor knocked on the wall. Hana woke up completely. Lan threw snacks in the air.\n\nRiverford had made an amazing comeback. They stayed in the league. The other team, the one they beat, faced **elimination** from the cup competition too. \"We eliminated them twice in one season,\" said Leo, laughing.\n\nThere was one more surprise. After the game, a new sponsor offered to support the club: The Blue Cup. Daniel had organized the shareholders to vote. \"Five hundred people own a football club sponsor now,\" said Grace. \"Only in Riverford.\"\n\nThere was one sad note in the story. Another player in the league had been caught **doping**: taking **steroids** to make himself stronger. He was **disqualified** for two years. \"That's not sport,\" said Leo. \"That's cheating.\"\n\nMinh wrote the story and sent it to Grace. \"Can you **spectate** at the next match for me?\" he asked.\n\n\"I hate football,\" said Grace. \"But for you, I'll go.\"\n\nMinh's series ended with Leo's story. He wrote: \"People fight in many ways. Some fight wars. Some fight for justice. Some fight for a small football club in a small English town. In the end, every fight is the same: you don't give up. Even in the **qualifier** rounds of life, when nobody's watching.\"", "words": 692, "new": [{"w": "activism", "p": "n", "vi": "hoạt động vận động xã hội"}, {"w": "advocacy", "p": "n", "vi": "sự vận động ủng hộ"}, {"w": "advocate", "p": "v/n", "vi": "ủng hộ, người ủng hộ"}, {"w": "grassroots", "p": "n/adj", "vi": "quần chúng cơ sở"}, {"w": "humanitarian", "p": "adj", "vi": "nhân đạo"}, {"w": "philanthropy", "p": "n", "vi": "hoạt động từ thiện"}, {"w": "nonprofit", "p": "adj/n", "vi": "phi lợi nhuận"}, {"w": "insurgency", "p": "n", "vi": "cuộc nổi dậy"}, {"w": "ceasefire", "p": "n", "vi": "lệnh ngừng bắn"}, {"w": "genocide", "p": "n", "vi": "tội diệt chủng"}, {"w": "warfare", "p": "n", "vi": "chiến tranh"}, {"w": "militant", "p": "adj/n", "vi": "hiếu chiến"}, {"w": "endurance", "p": "n/adj", "vi": "sức bền"}, {"w": "agility", "p": "n", "vi": "sự nhanh nhẹn"}, {"w": "adrenaline", "p": "n", "vi": "hoóc môn adrenaline"}, {"w": "contender", "p": "n", "vi": "ứng viên tranh chức vô địch"}, {"w": "underdog", "p": "n", "vi": "đối thủ bị đánh giá yếu"}, {"w": "qualifier", "p": "n", "vi": "vòng loại"}, {"w": "elimination", "p": "n", "vi": "sự loại bỏ"}, {"w": "relegate", "p": "v", "vi": "làm xuống hạng"}, {"w": "relegation", "p": "n", "vi": "sự xuống hạng"}, {"w": "sponsorship", "p": "n", "vi": "sự tài trợ"}, {"w": "sponsor", "p": "v/n", "vi": "nhà tài trợ"}, {"w": "doping", "p": "n", "vi": "sử dụng chất cấm"}, {"w": "steroid", "p": "n", "vi": "chất steroid"}, {"w": "disqualify", "p": "v", "vi": "loại khỏi cuộc thi"}, {"w": "unbeaten", "p": "adj", "vi": "chưa bị đánh bại"}, {"w": "undefeated", "p": "adj", "vi": "bất bại"}, {"w": "spectate", "p": "v", "vi": "xem thi đấu"}]}, {"id": "W40-1", "title": "A Night of Music", "body": "In April, Hana had a day off, and Minh wanted to do something special. He had the jade ring from his grandmother in a small box in his drawer. He had carried it for a year. He was waiting for the right moment.\n\n\"Let's go to a concert,\" he said. \"Classical music. Something different.\"\n\nHana was surprised. \"You don't like classical music.\"\n\n\"I'm a **novice**,\" said Minh. \"But I want to learn.\"\n\nLan, who was an **avid** music fan, helped him choose. She was an **aficionado** of classical music; she had played the piano since she was six. \"Go to the **symphony** concert on Saturday,\" she said. \"There's a **concerto** for violin. The soloist is a **virtuoso**: one of the best violinists in the world.\"\n\nAt the entrance, there was a **podium** where the conductor would stand. Lan said she only played piano **recreationally** now, for fun. The concert hall was beautiful: wood everywhere, perfect **acoustic** design, so that every sound was clear without any **amplifier** or speakers. Two thousand people sat in silence.\n\nThe orchestra played three pieces. First, a short **sonata** for piano. Then the violin concerto. The soloist was a young Korean woman. When she played, nobody moved. Her music was fast, then slow, then sad, then joyful. Minh didn't understand all of it. But he felt it.\n\nIn the second half, a singer performed an **aria** from an Italian opera. Her voice was so powerful that Minh felt it in his chest. Then a small **ensemble**, a **quartet** of two violins, a viola and a cello, played a quiet piece from the **Baroque** period, three hundred years old.\n\nAfterwards, they walked through the park. Hana was quiet and happy. \"That was beautiful,\" she said. \"I haven't felt so relaxed in months. I needed to **unwind**.\"\n\n\"Music **rejuvenates** you,\" said Minh. \"Lan says so.\"\n\n\"Lan is right,\" said Hana. \"We should **indulge** ourselves more often. A little **indulgence** is good.\"\n\nThey walked slowly, in a **leisurely** way, under the cherry trees. The flowers were falling like snow.\n\nThe next day, they went to an art museum. There was a big exhibition about the history of European art. They started with the **Renaissance**: beautiful paintings of people and gods from five hundred years ago. Then the **Baroque**: dramatic paintings with dark backgrounds and bright light. Then **Impressionism**: soft paintings of gardens and rivers, made with small dots of color. \"This reminds me of Margaret's paintings,\" said Minh.\n\nThen **surrealism**: strange paintings of melting clocks and floating faces. Hana laughed. \"This one looks like my dreams after a night shift.\"\n\nIn the last room, there was an art teacher talking to students about **aesthetic** values: what makes something beautiful. \"Beauty is not just in the object,\" she said. \"It's in the eye of the person looking.\"\n\nMinh thought about that. Then he thought about Hana.\n\nThere was also a dance performance in the museum's garden. A famous **choreographer** had created the **choreography** for twenty dancers. Part of it was planned; part was **improvisation**. The dancers **improvised** some movements, responding to the wind and the falling flowers.\n\n\"How do they know what to do?\" asked Minh.\n\n\"They have a **repertoire**,\" said Hana. \"A collection of movements they know. Then they choose. Like conversation.\"\n\nMinh had the ring in his pocket the whole weekend. He didn't use it. The moment wasn't right. Not yet.\n\nOn Sunday night, Lan asked, \"Did you do it?\"\n\n\"Do what?\" said Minh.\n\n\"You know what. The ring. Grandma told me.\"\n\nMinh groaned. \"Is there anyone Grandma didn't tell?\"\n\n\"No,\" said Lan. \"Everyone in Vietnam knows. Hurry up.\"", "words": 601, "new": [{"w": "podium", "p": "n", "vi": "bục nhận giải"}, {"w": "avid", "p": "adj", "vi": "say mê"}, {"w": "aficionado", "p": "n", "vi": "người sành sỏi đam mê"}, {"w": "novice", "p": "n", "vi": "người mới tập"}, {"w": "recreationally", "p": "adv", "vi": "để giải trí"}, {"w": "unwind", "p": "v", "vi": "thư giãn"}, {"w": "rejuvenate", "p": "v", "vi": "làm trẻ khỏe lại"}, {"w": "indulge", "p": "v", "vi": "tự chiều chuộng"}, {"w": "indulgence", "p": "n", "vi": "sự nuông chiều bản thân"}, {"w": "leisurely", "p": "adj", "vi": "thong thả"}, {"w": "symphony", "p": "n", "vi": "bản giao hưởng"}, {"w": "concerto", "p": "n", "vi": "bản hòa tấu"}, {"w": "sonata", "p": "n", "vi": "bản sonata"}, {"w": "aria", "p": "n", "vi": "khúc hát đơn opera"}, {"w": "ensemble", "p": "n", "vi": "nhóm hòa tấu"}, {"w": "quartet", "p": "n", "vi": "nhóm tứ tấu"}, {"w": "virtuoso", "p": "n", "vi": "nghệ sĩ bậc thầy"}, {"w": "acoustic", "p": "adj/n", "vi": "không khuếch đại điện"}, {"w": "amplifier", "p": "n", "vi": "bộ khuếch đại"}, {"w": "improvise", "p": "v", "vi": "ứng tác"}, {"w": "improvisation", "p": "n", "vi": "sự ứng tác"}, {"w": "choreography", "p": "n", "vi": "biên đạo múa"}, {"w": "choreographer", "p": "n", "vi": "biên đạo múa"}, {"w": "repertoire", "p": "n", "vi": "vốn tiết mục"}, {"w": "renaissance", "p": "n/adj", "vi": "thời kỳ Phục hưng (thế kỷ 14–17)"}, {"w": "baroque", "p": "adj/n", "vi": "phong cách Baroque"}, {"w": "impressionism", "p": "n", "vi": "trường phái ấn tượng"}, {"w": "surrealism", "p": "n", "vi": "trường phái siêu thực"}, {"w": "aesthetic", "p": "adj/n", "vi": "thẩm mỹ"}]}, {"id": "W40-2", "title": "Mia in Tokyo", "body": "In May, Mia came to Tokyo. She had an exhibition at a small gallery. A Japanese curator had seen her work online and invited her.\n\nMia was twenty now, in her second year at art school in London. Her style had changed. She still painted, but she also made **installations**: big works that filled a whole room. For Tokyo, she made a room full of hanging paper lanterns, each one painted with a different face from Riverford.\n\nMinh and Hana helped her set it up. It took three days. \"Art is hard work,\" said Mia, standing on a ladder. \"People think we just sit and wait for inspiration.\"\n\nThe gallery also showed other kinds of art. There was a **mural**, a huge painting on a wall, by a young Japanese artist. There was a **mosaic** made of tiny pieces of colored glass. There were **ceramics**: bowls and cups made by a ninety-year-old potter. And there was a photo of an old **fresco** from an Italian church, a painting made on wet plaster six hundred years ago.\n\n\"Every art form has its own **aesthetics**,\" said the curator. \"Its own rules of beauty.\"\n\nOn the opening night, many people came. A Japanese film director was there. He liked Mia's work so much that he asked her to help with his next film. \"I'm making an **adaptation** of a famous novel,\" he said. \"I need someone to design the visual world. The **cinematography** is very important. Every scene must be **cinematic**, like a painting.\"\n\nHe told them about the story. \"The **protagonist** is a young woman who travels to a foreign country. The **antagonist** is her own fear. There's no villain. The **narrative** is very quiet.\"\n\n\"That sounds like Minh's book,\" said Mia.\n\nThe director had read Minh's book in Japanese translation. \"It was **acclaimed** here,\" he said. \"**Critically**, it was very successful. Your **prose** is simple but beautiful.\"\n\nMinh was surprised. He didn't know his book had been translated into Japanese.\n\n\"Your publisher didn't tell you?\" said the director. \"It came out last month.\"\n\nThe next day, Minh found his book in a big bookshop in Shinjuku. It was on a table with other new books. The cover was different: a painting of two rivers meeting. In the **foreword**, a famous Japanese writer had written an introduction. Minh couldn't read it, so Hana translated.\n\n\"'This book is about belonging,'\" Hana read. \"'The author writes like a poet. His sentences are like **verse**. He uses **metaphors** and **similes** sparingly but well. There is **irony**, but also great warmth.'\"\n\nMinh felt strange. People he had never met were reading his words.\n\nThat week, he also got an email from Diana, his agent. \"A publisher wants to include one of your short stories in an **anthology**,\" she wrote. \"A collection of stories by young writers from Asia. And they want to know: is your second book finished? Send me the **manuscript**.\"\n\nHis second book was almost finished. It was about Grandma Rose and Margaret. It was not a **memoir**, a true story, but it was close. He had changed the names and some events. Some critics would call it a kind of **allegory**: a story with a deeper meaning about friendship and forgiveness.\n\n\"What about poetry?\" asked Mia. \"Have you ever written poems?\"\n\n\"Once,\" said Minh. \"In England, at the library. It was terrible. Every **stanza** was too long. I couldn't make anything **rhyme**.\"\n\n\"Poetry doesn't have to rhyme,\" said Mia.\n\n\"Mine didn't have to be terrible either,\" said Minh. \"But it was.\"\n\nMia laughed. Then she said, \"Write a **satire** next. About the conglomerate that bought your newspaper.\"\n\n\"That's a good idea,\" said Minh. He wrote it down.\n\nMia's exhibition was a success. Every lantern was sold. The film director hired her for his film. She was going to spend the summer in Tokyo.\n\n\"Two Parkers in Japan,\" said Hana. \"And two Nguyens. Riverford is moving east.\"", "words": 653, "new": [{"w": "aesthetics", "p": "n", "vi": "mỹ học"}, {"w": "mural", "p": "n", "vi": "tranh tường"}, {"w": "fresco", "p": "n", "vi": "bích họa"}, {"w": "mosaic", "p": "n/adj", "vi": "tranh khảm"}, {"w": "ceramics", "p": "n", "vi": "đồ gốm"}, {"w": "installation", "p": "n", "vi": "tác phẩm sắp đặt"}, {"w": "cinematography", "p": "n", "vi": "nghệ thuật quay phim"}, {"w": "cinematic", "p": "adj", "vi": "thuộc điện ảnh"}, {"w": "protagonist", "p": "n", "vi": "nhân vật chính"}, {"w": "antagonist", "p": "n", "vi": "nhân vật đối kháng"}, {"w": "narrative", "p": "n/adj", "vi": "câu chuyện, lối kể"}, {"w": "adaptation", "p": "n", "vi": "sự thích nghi (quá trình hoặc kết quả trở nên phù hợp hơn với môi trường)"}, {"w": "acclaim", "p": "n/v", "vi": "sự ca ngợi"}, {"w": "acclaimed", "p": "adj", "vi": "được đánh giá cao"}, {"w": "critically", "p": "adv", "vi": "theo giới phê bình"}, {"w": "anthology", "p": "n", "vi": "tuyển tập"}, {"w": "manuscript", "p": "n", "vi": "bản thảo, văn bản cổ viết tay"}, {"w": "memoir", "p": "n", "vi": "hồi ký"}, {"w": "prose", "p": "n", "vi": "văn xuôi"}, {"w": "verse", "p": "n", "vi": "thơ"}, {"w": "stanza", "p": "n", "vi": "khổ thơ"}, {"w": "rhyme", "p": "n/v", "vi": "vần"}, {"w": "metaphor", "p": "n", "vi": "phép ẩn dụ"}, {"w": "simile", "p": "n", "vi": "phép so sánh"}, {"w": "irony", "p": "n", "vi": "sự mỉa mai"}, {"w": "satire", "p": "n", "vi": "văn châm biếm"}, {"w": "allegory", "p": "n", "vi": "truyện ngụ ý"}, {"w": "foreword", "p": "n", "vi": "lời giới thiệu"}]}, {"id": "W40-3", "title": "The Festival of Lights", "body": "In August, Lan's university had a summer program about Japanese culture. Lan was studying **linguistics**, the science of language, as part of her education degree. She invited Minh, Hana and Mia to her class one day.\n\nThe professor was talking about language and meaning. \"Every word has a **literal** meaning and a **figurative** meaning,\" he said. \"When you say 'it's raining cats and dogs,' you don't mean it literally. It's figurative. An idiom.\"\n\nHe talked about **etymology**: where words come from. \"The English word 'tsunami' comes from Japanese. 'Karaoke' too. And 'emoji.' Languages borrow from each other.\"\n\nHe talked about **colloquial** language, the informal language people use every day, and **jargon**, the special language of a profession. \"Doctors have medical jargon. Lawyers have legal jargon. Journalists have their own jargon too,\" he said, looking at Minh.\n\nHe also talked about **rhetoric**: the art of speaking and writing to persuade people. \"A politician who is **articulate** and **eloquent** can **articulate** an idea so beautifully that people believe it, even if it's wrong. A **rhetorical** question is a question you don't expect an answer to. Like: 'Who doesn't love their mother?'\"\n\n\"What about **ambiguity**?\" asked Lan.\n\n\"An **ambiguous** sentence has two meanings,\" said the professor. \"'I saw a man with a telescope.' Did I have the telescope? Or did the man? Good writers avoid ambiguity. Poets love it.\"\n\nHe also talked about **connotation**: the feelings a word carries. \"'Home' and 'house' have the same meaning. But 'home' has a warm connotation. 'House' is just a building.\" And **discourse**: how people use language in real situations. \"**Linguistic** study is not just grammar. It's how people actually communicate.\"\n\nLan showed them her textbook. It had a long **preface** by the author, a **prologue** with a story about a child learning to speak, and an **epilogue** at the end. At the back, there was a **glossary** of difficult words, a **bibliography** of other books, and an **appendix** with exercises. Every page had a **footnote**. \"Academic books,\" said Mia. \"So many extra parts.\"\n\nMinh was fascinated. He had spent years thinking about language, but never so clearly.\n\nThat evening, they went to a summer festival: Obon, the festival of the ancestors. In Japanese tradition, the spirits of the dead return home for three days in August. Families visit graves, clean them and light lanterns to guide the spirits home.\n\nThe town was full of **festivities**: food stalls, music, dancing. People wore light summer kimonos. Children played games. It was festive and happy.\n\nBut there was also a **solemn** part. At the temple, there was a **commemoration** for those who had died that year. A monk read prayers. People bowed in silence. The temple was **sacred**: you took off your shoes and spoke quietly.\n\nHana explained the beliefs. \"In Shinto, there are many gods, many **deities**,\" she said. \"A god of the sea, of rice, of mountains. In Buddhism, there's the Buddha. Many Japanese people follow both.\"\n\n\"In Vietnam, too,\" said Lan. \"We honor our ancestors. Every house has an altar.\"\n\nMia, who had never seen anything like this, was quiet. \"In England, we don't really have this,\" she said. \"We remember the dead on Remembrance Day, but that's for soldiers. Nothing for grandmothers.\"\n\nAt the end of the night, everyone went to the river. They put small paper lanterns on the water, each with a candle inside. Thousands of lanterns floated slowly downstream, glowing in the dark.\n\nMia put a lantern on the water for Margaret. Minh put one for his grandfather. Hana put one for her grandfather. Lan put one for nobody in particular. \"For everyone,\" she said.\n\nThey stood together and watched the lights float away. Mia was crying. \"It's so beautiful,\" she said. \"I want to paint this.\"\n\n\"You will,\" said Minh.\n\nLater, walking home, Hana took Minh's hand. \"Do you believe the spirits really come back?\" she asked.\n\nMinh thought about Margaret, about Grandma Rose's letters, about his grandmother's stories. \"I don't know,\" he said. \"But I think love comes back. In some form.\"\n\nHana squeezed his hand. Minh felt the ring box in his pocket. Not tonight, he thought. Soon.", "words": 689, "new": [{"w": "preface", "p": "n", "vi": "lời tựa"}, {"w": "epilogue", "p": "n", "vi": "phần kết"}, {"w": "prologue", "p": "n", "vi": "phần mở đầu"}, {"w": "glossary", "p": "n", "vi": "bảng thuật ngữ"}, {"w": "bibliography", "p": "n", "vi": "danh mục tài liệu tham khảo"}, {"w": "footnote", "p": "n", "vi": "chú thích cuối trang"}, {"w": "appendix", "p": "n", "vi": "phụ lục"}, {"w": "linguistics", "p": "n", "vi": "ngôn ngữ học"}, {"w": "linguistic", "p": "adj", "vi": "thuộc ngôn ngữ học"}, {"w": "etymology", "p": "n", "vi": "từ nguyên học"}, {"w": "colloquial", "p": "adj", "vi": "mang tính khẩu ngữ"}, {"w": "jargon", "p": "n", "vi": "thuật ngữ chuyên ngành"}, {"w": "articulate", "p": "adj/v", "vi": "(adj.) lưu loát, rõ ràng; (v.) diễn đạt rõ ràng"}, {"w": "eloquent", "p": "adj", "vi": "hùng hồn"}, {"w": "rhetoric", "p": "n", "vi": "thuật hùng biện / tu từ"}, {"w": "rhetorical", "p": "adj", "vi": "mang tính tu từ"}, {"w": "discourse", "p": "n/v", "vi": "diễn ngôn"}, {"w": "connotation", "p": "n", "vi": "nghĩa liên tưởng"}, {"w": "ambiguity", "p": "n", "vi": "sự mơ hồ / tính đa nghĩa"}, {"w": "ambiguous", "p": "adj", "vi": "mơ hồ"}, {"w": "literal", "p": "adj", "vi": "theo nghĩa đen"}, {"w": "figurative", "p": "adj", "vi": "mang nghĩa bóng"}, {"w": "commemoration", "p": "n", "vi": "lễ tưởng niệm"}, {"w": "festivity", "p": "n", "vi": "không khí lễ hội"}, {"w": "festivities", "p": "n", "vi": "hoạt động lễ hội"}, {"w": "solemn", "p": "adj", "vi": "trang nghiêm"}, {"w": "sacred", "p": "adj", "vi": "thiêng liêng"}, {"w": "deity", "p": "n", "vi": "vị thần"}]}, {"id": "W40-4", "title": "The Question", "body": "In October, Open Tokyo had its first birthday. Yuko organized a **gala**: a big party in a hotel ballroom. It was not an **extravaganza**: the website was still small and poor. But it was a real celebration. All the journalists came, with their families. Readers came. Even some famous writers came.\n\nMinh decided this was the moment.\n\nHe had planned it carefully. Lan knew. Mia knew. Yuko knew, because he needed her help. Hana did not know.\n\nThe evening started with speeches. Yuko talked about the first year. \"We started with six people and six laptops,\" she said. \"Now we have fifty thousand subscribers. This is not a **jubilee**, not a big anniversary. It's just one year. But it's our year.\"\n\nThen Ben gave a funny speech about the cyber attack. Min-ji talked about the workers' story. Aiko said one sentence: \"Thank you for reading.\" It was the most anyone had heard her say in public.\n\nThen Yuko said, \"Minh, would you like to say something?\"\n\nMinh stood up. His legs were shaking. He walked to the front. He looked at the crowd: his colleagues, his friends, Lan, Mia, and Hana, sitting at the front table in a blue dress.\n\n\"I'm an **expat**,\" he said. \"An **expatriate**. I left my **homeland** six years ago. I've lived in England and Japan. People ask me: where do you belong? Which country is your **motherland**?\"\n\nHe paused. \"I love Vietnam. I'm proud of it. But I'm not very **patriotic**, not in a flag-waving way. **Patriotism** can be beautiful. **Nationalism** can be dangerous. For me, home is not a country.\"\n\nHe looked at Hana. \"Home is a person.\"\n\nThe room went quiet. Hana's eyes went wide.\n\nMinh walked to her table. He took the small box out of his pocket. He knelt down. Some people believe marriage is **divine**, blessed by God; Minh had read a little **theology** at university. For him, it was simpler. It was a very old ritual, a very old **rite**, but his hands were shaking like it was the first time anyone had ever done it.\n\n\"Hana,\" he said. \"Will you marry me?\"\n\nHana put her hands over her mouth. She was crying. The whole room was holding its breath.\n\n\"Yes,\" she said. \"Yes, of course. Yes.\"\n\nThe room exploded. People clapped and cheered. Lan screamed. Mia cried. Ben shouted, \"Finally!\" Yuko, who never smiled, was smiling.\n\nMinh put the jade ring on Hana's finger. It fit perfectly.\n\nLater, they called everyone. Minh's parents in Vietnam: his mother cried for ten minutes. Hana's parents in Japan: her father said, \"Good. Finally.\" The Parkers in England: Grandma Rose said, \"I told you so, three years ago.\" Grace said, \"Congratulations. Don't let it affect your work.\"\n\nThey talked about the wedding. Where? Vietnam, Japan or England? \"All three,\" said Hana. \"A small ceremony in each country.\"\n\n\"That's very **multinational**,\" said Minh.\n\n\"We're a multinational family,\" said Hana.\n\nAt the party, people talked about their own stories of **emigration**. Ben, from Australia, said
