d told him to follow his heart. His heart was in Riverford.\n\nHis first big story was about the old bridge. The bridge over the river was two hundred years old. After the flood, engineers said it was not safe. The council wanted to build a new one. Some people wanted to repair the old one. There was a big argument.\n\nGrace sent Minh to investigate. \"Find out the facts,\" she said. \"Numbers, not opinions.\"\n\nMinh met the engineer in charge, a calm woman called Dr. Shah. She showed him the old bridge up close. \"Look at the stone,\" she said. \"It's very old. Some of it is **fragile** now. Water has got in. In winter, it freezes and breaks the stone.\"\n\nShe explained the plans for the new bridge. \"We'll use steel and **aluminum** for the main structure. It's light but **sturdy**. The surface will be **waterproof**, so the water can't get in. It will be very **durable**: it should last a hundred years.\"\n\n\"And the old bridge?\" asked Minh.\n\n\"We could repair it,\" said Dr. Shah. \"But it would cost **roughly** twice as much. Old stone is **delicate**. You need special workers. It's not a **rigid** structure; it moves a little. That's both good and bad.\"\n\nMinh asked her to calculate the costs exactly. She showed him a spreadsheet. \"A new bridge: four million pounds, approximate. Repairing the old one: eight million. That's a ratio of one to two. And the repair would have a maximum life of fifty years. The new bridge would have a minimum life of a hundred.\"\n\n\"Can you estimate how many people use the bridge?\" asked Minh.\n\n\"About ten thousand a day,\" she said. \"Precisely, nine thousand eight hundred and forty, according to our last count. A considerable number. A significant proportion of the town.\"\n\nMinh wrote down every digit. He even wrote the weight of a tiny sample of stone dust, in milligrams. He was careful with the decimal points. He didn't want to make a mistake. \"One wrong number and the story is wrong,\" Grace always said. \"And numerous readers will write to tell you.\"\n\nHe also talked to people who wanted to save the old bridge. An old woman showed him a **bronze** plaque on the side: \"Built 1823.\" \"My grandmother walked over this bridge,\" she said. \"And her grandmother. You can't buy history.\"\n\nAn artist who lived by the river showed him the old **lead** pipes under the bridge and the **wax** seals the old builders had used. \"They were craftsmen,\" he said. \"Look at the **ceramic** tiles on the walls of the little house at the end. Real **porcelain**. Hand-painted.\"\n\nA child showed him something else: under the bridge, there was a family of ducks with **fluffy** yellow babies. \"If they build a new bridge, where will the ducks go?\" she asked. Minh wrote that down too.\n\nHe spent a whole day on the bridge. The stones were **bumpy** and **slippery** with moss. Some parts were **sticky** with old paint. A **hairy** dog walked past with its **furry** owner. Minh laughed at himself for thinking that. The **shiny** new information sign was already covered in **fuzzy** green moss. Even the **foam** on the water under the bridge seemed to have an opinion.\n\nHe wrote the story carefully. He gave the calculations, the depth of the river, the breadth of the bridge, the capacity of the new design, the costs. He gave both sides. He used every number correctly: millions, **fractions**, percentages. He wrote about the old woman and the ducks.\n\nGrace read it. She checked every number. She found one mistake: he wrote \"millimeter\" instead of \"centimeter\" for the cracks in the stone. The cracks were countless, but they were measured in centimeters, not millimeters. \"Small mistake,\" she said. \"Big difference. Fix it.\"\n\nHe fixed it. The story was on the front page. The council read it. In the end, they made a compromise: they would build a new bridge for cars and keep the old bridge for people on foot. And they would build a special home for the ducks.\n\n\"Your first big story,\" said Grace. \"And you saved some ducks. Not bad for a first month.\"\n\n\"How many ducks?\" asked Leo, when Minh told the family.\n\n\"Eleven,\" said Minh. \"It's an odd number. And I counted them precisely.\"", "words": 749, "new": [{"w": "ceramic", "p": "n/adj", "vi": "bằng gốm"}, {"w": "porcelain", "p": "n", "vi": "sứ"}, {"w": "aluminum", "p": "n", "vi": "nhôm"}, {"w": "bronze", "p": "n/adj", "vi": "đồng; huy chương đồng"}, {"w": "lead", "p": "v/n/adj", "vi": "dẫn dắt"}, {"w": "wax", "p": "n/v", "vi": "sáp"}, {"w": "foam", "p": "n", "vi": "mút"}, {"w": "rigid", "p": "adj", "vi": "cứng nhắc"}, {"w": "fragile", "p": "adj", "vi": "dễ vỡ"}, {"w": "delicate", "p": "adj", "vi": "dễ vỡ"}, {"w": "sturdy", "p": "adj", "vi": "chắc chắn"}, {"w": "durable", "p": "adj", "vi": "bền"}, {"w": "waterproof", "p": "adj/v/n", "vi": "chống nước"}, {"w": "shiny", "p": "adj", "vi": "sáng bóng"}, {"w": "sticky", "p": "adj/n", "vi": "dính"}, {"w": "slippery", "p": "adj", "vi": "trơn"}, {"w": "fluffy", "p": "adj", "vi": "bông xốp"}, {"w": "furry", "p": "adj/n", "vi": "có lông mềm"}, {"w": "hairy", "p": "adj", "vi": "nhiều lông"}, {"w": "bumpy", "p": "adj", "vi": "gồ ghề"}, {"w": "fuzzy", "p": "adj", "vi": "có lông tơ"}, {"w": "fraction", "p": "n", "vi": "phần nhỏ, một phần"}, {"w": "roughly", "p": "adv", "vi": "khoảng, đại khái"}]}, {"id": "W31-1", "title": "The Numbers", "body": "In September, the government published new statistics about every town in England. Grace gave Minh the job of writing about Riverford. \"Numbers tell stories,\" she said. \"Find the story.\"\n\nMinh spent two days with the data. He made a graph and a diagram for each topic. He also did his own small survey: he asked a hundred people in the market square five questions. Then he wrote his article. It was like a puzzle. Every statistic was a piece.\n\nThe first piece was population. Twenty years ago, Riverford had twelve thousand people. Now it had fifteen thousand. \"There has been a steady increase,\" Minh wrote. \"The population has grown steadily, by about one percent a year. **Whereas** many small towns have lost people, Riverford has grown.\"\n\nThe second piece was age. The number of young people had declined. The number of people over seventy had grown **sharply**. \"The town is getting older,\" Minh wrote. \"**Nevertheless**, young families are starting to move here from the city, because houses are cheaper.\"\n\nThe third piece was housing. Here, the numbers changed **dramatically**. Ten years ago, an average house in Riverford cost one hundred and fifty thousand pounds. Now it cost three hundred thousand. \"House prices have doubled,\" Minh wrote. \"Moreover, rents have risen **rapidly**. Therefore, many young people cannot afford to live in the town where they grew up.\"\n\nHe showed a line on the graph that went up and down. \"Prices **fluctuated** between 2008 and 2012, then rose again. They have not been **stable** since.\" The growth was not gradual. Prices did not rise gradually; they jumped. It was fast.\n\nThe fourth piece was work. Unemployment had fallen. In ten years, it had almost **halved**, from eight percent to four point five. \"This is good news,\" he wrote. \"Furthermore, new businesses have opened, including cafés, shops and two small technology companies.\"\n\nThe fifth piece was the environment. The amount of rubbish going to landfill had decreased by thirty percent, thanks to more recycling. The reduction in car journeys was smaller. \"**Hence**,\" he wrote, \"Riverford still has work to do.\"\n\nGrace read it carefully. She made many changes. \"Too many numbers in one sentence,\" she said. \"Readers will get lost. One number, one idea. **Regardless** of how interesting the data is, keep it simple.\"\n\nMinh rewrote it. Then she read it again. \"Better. But where's the human story? Numbers are cold. You need a face.\"\n\nSo Minh went back to the market square. He found a young woman called Chloe who worked at the bakery. She was twenty-six and still lived with her parents. \"I can't afford a flat in Riverford,\" she said. \"I'd have to move to the city, **amid** all the traffic and noise. But this is my home. My family is here. My friends are here.\"\n\nHe also found an old man, **amongst** the regular customers at The Blue Cup, who had lived in Riverford for eighty years. \"The town has changed **beyond** recognition,\" he said. \"When I was young, everybody knew everybody. Now, half the faces are new. That's not bad. It's just different.\"\n\nMinh put these two faces **alongside** the numbers. **Underneath** each graph, he wrote one sentence from a real person. **Whilst** the numbers showed the big picture, the people showed what it meant.\n\n\"**Regarding** the housing crisis,\" he wrote at the end, \"the council says it is building two hundred new homes. **Concerning** the price of those homes, it has not yet said. Thus the big question remains: who will be able to live in Riverford in twenty years?\"\n\nGrace read the final version. \"Good,\" she said. \"This is real journalism. Numbers with a heart. **Nonetheless**, you used 'moreover' three times. Nobody says 'moreover' in real life.\"\n\n\"My IELTS teacher said it was a good linking word,\" said Minh.\n\n\"Your IELTS teacher isn't my editor,\" said Grace. But she was smiling.\n\nThe article was shared widely. The council invited Minh to a meeting about housing. \"We read your article,\" said the mayor. \"A tonne of people did. Or a ton, if you're American. **Whereby** I mean: a lot.\" He laughed at his own joke. Nobody else did. The new homes plan was changed after that, **whereby** a third of the homes would be affordable for young people. A small victory, measured in cubic meters of concrete and a lot of words.", "words": 724, "new": [{"w": "halve", "p": "v", "vi": "chia đôi"}, {"w": "sharply", "p": "adv", "vi": "đột ngột"}, {"w": "dramatically", "p": "adv", "vi": "đột ngột, mạnh mẽ"}, {"w": "rapidly", "p": "adv", "vi": "một cách nhanh chóng"}, {"w": "stable", "p": "adj/n/v", "vi": "ổn định"}, {"w": "fluctuate", "p": "v", "vi": "dao động"}, {"w": "whereas", "p": "conj", "vi": "trong khi (đối lập)"}, {"w": "whereby", "p": "adv", "vi": "nhờ đó"}, {"w": "nevertheless", "p": "adv", "vi": "tuy nhiên, dù vậy"}, {"w": "nonetheless", "p": "adv", "vi": "tuy nhiên"}, {"w": "hence", "p": "adv", "vi": "vì thế"}, {"w": "regardless", "p": "adv", "vi": "bất chấp"}, {"w": "whilst", "p": "conj", "vi": "trong khi"}, {"w": "amid", "p": "prep", "vi": "giữa"}, {"w": "amongst", "p": "prep", "vi": "ở giữa"}, {"w": "alongside", "p": "prep", "vi": "bên cạnh"}, {"w": "underneath", "p": "prep/adv", "vi": "bên dưới"}, {"w": "beyond", "p": "prep", "vi": "ở phía bên kia"}, {"w": "regarding", "p": "prep", "vi": "liên quan đến"}, {"w": "concerning", "p": "prep/adj", "vi": "liên quan đến"}]}, {"id": "W31-2", "title": "The Appeal", "body": "In October, Minh got a surprising phone call. It was the mother of the young man from the burglary trial, Andrei. \"My son is making an **appeal**,\" she said. \"He has new evidence. Please come. Nobody else will listen.\"\n\nMinh talked to Grace. \"We reported the trial,\" she said. \"If there's new evidence, we should report that too. Go. But be careful. Don't take sides.\"\n\nMinh visited Andrei in prison. It was a strange, cold place. Andrei looked thinner and older. \"I admit I made mistakes,\" he said. \"I took things from two houses. I **deserve** my punishment for that. But the other three burglaries, it wasn't me. People **blame** me because it's easy. I'm the foreigner.\"\n\n\"What's the new evidence?\" asked Minh.\n\n\"A camera,\" said Andrei. \"A neighbor's door camera. On the night of one of the burglaries, it shows the real burglar. It's not me. It's someone taller, older. My lawyer found it last month. The police never checked.\"\n\nMinh was not easily **convinced**. \"Why didn't your lawyer find it before?\"\n\n\"He didn't look. He thought I was guilty. Everyone did.\"\n\nMinh went to see the lawyer, a new one, a young woman called Ms. Clarke. She showed him the video. It was not very clear. But the man in it was **barely** visible in the dark: tall, in a black coat. Andrei was short.\n\n\"Is this enough to win the appeal?\" asked Minh.\n\n\"**Provided** the judge accepts it, yes,\" said Ms. Clarke. \"**Supposing** the judge thinks the video isn't clear enough, then no. It's a challenge. But we have to attempt it.\"\n\nMinh wrote a careful story. He didn't claim that Andrei was innocent. He didn't **criticize** the police. He just explained the new evidence. Considering the facts, he let the readers think for themselves.\n\nSome readers were angry. \"Why are you defending a criminal?\" one wrote. \"He **boasts** about being innocent, but he admitted to two burglaries!\" Another wrote: \"Thank you for expressing the other side. Everybody **deserves** a fair trial.\"\n\nThe appeal was in December. Minh went. Andrei's mother sat in the front row, holding a small cross. The judge watched the video three times. She asked many questions. The police officer who had led the investigation had to confirm that they never checked the door camera. \"An honest mistake,\" he said. \"We were very busy.\"\n\nThe judge thought for a long time. Then she made her decision. Andrei was guilty of two burglaries, excluding the other three. His punishment was reduced to one year. He had **scarcely** two months left to serve.\n\nOutside the court, Andrei's mother hugged Minh. She was crying. \"Thank you,\" she said. \"You listened.\"\n\n\"I didn't do anything,\" said Minh. \"The lawyer did.\"\n\n\"You wrote the story. After that, people started to look at us differently. Apart from my son's lawyer, nobody else cared.\"\n\nAndrei came out of prison in February. He came to The Blue Cup to see Minh. He was quiet and nervous. \"I want to start again,\" he said. \"Find work. Be normal. But it's hard. When people see 'prison' on your CV, they disappear.\"\n\nDaniel was listening. He was quiet for a moment. \"I needed someone to help in the kitchen,\" he said. \"Washing dishes, mostly. It's not exciting. But it's a job. **Providing** you work hard, you can stay.\"\n\nAndrei couldn't speak. Then he said, \"Why? Why would you trust me?\"\n\n\"Because somebody once was willing to **forgive** me for a stupid mistake,\" said Daniel. \"A long time ago. Everybody needs one person to encourage them. Following that, it's up to you.\"\n\nAndrei started work the next Monday. He was quiet, hard-working and always on time. After a month, Pat said he was the best dishwasher she had ever had. After three months, Daniel let him handle the cooking on Sundays.\n\nMinh wrote about it a year later, including both men's stories, in a story called \"Second Chances.\" He combined Andrei's story with Pete's. Both had fallen. Both were getting up. \"**Aside** from luck,\" he wrote, \"the thing that generates change is people. One person who sees you. One person who doesn't look away.\"\n\nGrace put it on the front page. The story attracted more letters than anything the Gazette had published that year. Even the angry reader wrote again. \"I was wrong,\" he wrote. \"**Lest** we forget: we're all human.\" Later, Grace talked to Minh about it. \"Some readers approved of your story and some didn't,\" she said. \"You won't gain everyone's approval. Don't try. A good story can expand, extend into people's lives and change them. Nobody can deny that. But never attach yourself to one side, and never let your feelings **explode** on the page. Our job is to determine what exists, what the story really contains, what it consists of. Sometimes we challenge what everyone thinks. Sometimes we bend a little, to listen. It was Andrei versus the state, but really it was about people.\"\n\n\"Is that hard for you?\" Minh asked. \"To stay neutral?\"\n\n\"For **oneself**, it's always hard,\" said Grace. \"That's why we do it together.\"", "words": 847, "new": [{"w": "aside", "p": "adv", "vi": "sang một bên"}, {"w": "provided", "p": "v/conj", "vi": "miễn là"}, {"w": "providing", "p": "conj", "vi": "miễn là"}, {"w": "supposing", "p": "conj", "vi": "giả sử"}, {"w": "lest", "p": "conj", "vi": "kẻo"}, {"w": "scarcely", "p": "adv", "vi": "hầu như không"}, {"w": "barely", "p": "adv", "vi": "vừa đủ, hầu như không"}, {"w": "oneself", "p": "pron", "vi": "bản thân"}, {"w": "appeal", "p": "n/v", "vi": "kháng cáo"}, {"w": "blame", "p": "v/n", "vi": "đổ lỗi"}, {"w": "boast", "p": "v/n", "vi": "khoe khoang"}, {"w": "convince", "p": "v", "vi": "thuyết phục"}, {"w": "criticize", "p": "v", "vi": "phê bình"}, {"w": "deserve", "p": "v", "vi": "xứng đáng"}, {"w": "explode", "p": "v", "vi": "phát nổ"}, {"w": "forgive", "p": "v", "vi": "tha thứ"}]}, {"id": "W31-3", "title": "The Contract", "body": "In March, Minh got an anonymous email. It said: \"Look at the council's contract for the new bridge. Ask who owns the building company.\" There was no name. Nothing else.\n\nMinh showed it to Grace. \"Anonymous tips are dangerous,\" she said. \"Sometimes they're true. Sometimes someone wants revenge. We investigate, but we don't publish until we're sure.\"\n\nMinh and Ellie started to dig. The council had given the contract for the new bridge to a company called Riverstone Building. The contract was worth four million pounds. Minh looked at the company's documents online. He wanted to identify the owners. At first, nothing looked strange.\n\nThen Ellie noticed something. One of the owners of Riverstone had the same surname as a member of the council: a man called Mr. Hughes, who was on the committee that chose the company. \"It could be a coincidence,\" said Ellie. \"Hughes is a common name.\"\n\n\"Or it could be his brother,\" said Minh.\n\nThey checked. It was his brother.\n\nThis did not necessarily mean anything illegal. But council members were required to tell the council if a family member was involved in a contract. Mr. Hughes had not told anyone. \"It implies that something is wrong,\" said Grace. \"It doesn't prove it. We need more.\"\n\nMinh and Ellie spent three weeks investigating. They talked to other building companies. Two of them said their offers were cheaper than Riverstone's, but they were rejected. They talked to a former worker at Riverstone, who **insisted** on staying anonymous. \"Everyone knew the contract was theirs before it was announced,\" he said. \"Mr. Hughes managed everything.\"\n\nThey also obtained the committee's meeting notes. Mr. Hughes had persuaded the other members to choose Riverstone. He said Riverstone had better experience. But Riverstone had never built a bridge before.\n\nGrace read everything. \"It's enough,\" she said. \"But we must be fair. We have to ask Mr. Hughes for his side. He has the right to reply.\"\n\nMinh called Mr. Hughes. He was polite at first. Then, when Minh explained the story, he became angry. \"This is lies,\" he said. \"If you publish this, I'll take you to court. I'll destroy your little newspaper.\" He threatened to call his lawyer.\n\nMinh was scared. His hands were shaking when he put the phone down. \"He threatened us,\" he told Grace.\n\n\"Of course he did,\" said Grace calmly. \"Guilty people always do. That's not a reason to stop. It's a reason to be careful. Check everything twice. Then three times.\"\n\nThey checked everything three times. Their lawyer checked it too. Then, on a Thursday in April, the Gazette published the story: \"Councillor Failed to Declare Brother's Company in Bridge Contract.\"\n\nThe reaction was immediate. The council suspended Mr. Hughes while it investigated. The national newspapers picked up the story. Minh's name was on every article. He got hundreds of messages, some kind, some angry.\n\nA month later, the council's investigation revealed more. Mr. Hughes had helped his brother win three other contracts. He was forced to resign. The bridge contract was given to a different company, with more experience and a lower price. The town saved half a million pounds.\n\nGrace took the whole team out for dinner. \"To Minh and Ellie,\" she said. \"Who survived threats, angry phone calls and three weeks of boring documents.\"\n\n\"I'm still scared of his lawyer,\" said Minh.\n\n\"His lawyer never called,\" said Grace. \"Lawyers don't call when the story is true.\"\n\nLater, Minh reflected on what he had learned. Journalism was not about being a hero. It was about **struggling** through boring details until you found the truth. It was about respecting the facts, separating what you know from what you **suspect**. It was about being bold but also accurate. And sometimes, you had to **tolerate** fear.\n\nHe wrote it all in a brief note in his diary. \"Absolute truth is rare,\" he wrote. \"But adequate truth, appropriate truth, is possible. Work hard enough, and the apparent becomes clear.\"\n\nThen he went to sleep, and for the first time in three weeks, he slept well.\n\nThe next day, Grace sat with him in her office. \"Let me tell you what this job is,\" she said. \"Things occur every day in this town, and most of them nobody notices. Our job is to select the stories that matter and provide the facts. Not to impress anyone. Not to pretend we know more than we do. Never predict the end of a story before you know it. Never ignore a fact because it doesn't suit you, and never remove one because someone powerful asks you to.\"\n\n\"Powerful people will try to influence you,\" she went on. \"They'll try to limit what you write. Some will expect you to **obey** them. You must oppose that, politely but firmly. People rely on us. They trust us to represent the truth, not one side. That trust is the only thing we **possess**.\"\n\n\"Did you intend to become an editor?\" Minh asked.\n\nGrace laughed. \"No. I tend to interrupt people too much. A good reporter listens.\" Then she was serious again. \"When you're tired and you want to settle for an easy answer, remind yourself: the easy answer rarely helps you solve anything. The alternative is to suffer later, when you're wrong. It's acceptable to be slow. It's not acceptable to be wrong.\"\n\nShe proposed a new rule for the newsroom: before any big story was released, two people had to check it. Her broad smile indicated she was proud of him. \"Journalism can transform a town,\" she said. \"Advanced technology, big budgets, none of that matters. Can you justify every word you wrote?\"\n\n\"Yes,\" said Minh.\n\n\"Then you can sleep. Your story will remain true tomorrow. That should satisfy anyone.\"", "words": 957, "new": [{"w": "insist", "p": "v", "vi": "khăng khăng"}, {"w": "obey", "p": "v", "vi": "tuân theo"}, {"w": "possess", "p": "v", "vi": "sở hữu"}, {"w": "struggle", "p": "v/n", "vi": "vật lộn"}, {"w": "suspect", "p": "v/n/adj", "vi": "nghi ngờ"}, {"w": "tolerate", "p": "v", "vi": "chịu đựng"}]}, {"id": "W32-1", "title": "A Hundred Years", "body": "In May, the Riverford Gazette was a hundred years old. For the special edition, Grace asked Minh to write a profile of the newspaper's history. \"And no, you can't write about me,\" she said.\n\nMinh wrote about her anyway. He just didn't tell her.\n\nHe started with the **historical** facts. The paper was started in 1925 by a schoolteacher who wanted the town to have \"a decent, honest newspaper.\" For the entire century, it had come out every week, even during the war, when paper was short and half the staff were soldiers. \"It was never rich,\" said Bill, the old photographer. \"But it was always **faithful** to the town.\"\n\nThen he wrote about Grace. He interviewed everyone who worked with her. They all said the same things, in different words.\n\n\"She's tough,\" said Raj. \"**Fierce**, sometimes. But fair. She's the most capable editor I've ever worked with. She can do everything: write, edit, design, sell advertisements. And she's consistent. She treats a councillor and a cleaner exactly the same.\"\n\n\"She's **genuine**,\" said Ellie. \"What you see is what you get. There's no hidden Grace. If she's angry, you know. If she's happy, you know. Well, you rarely know if she's happy. But you know.\"\n\nMinh also talked to people outside the newspaper. The mayor said Grace was \"a constant critical voice,\" which was not entirely a compliment. A businessman said she was \"**hostile** to local business.\" A teacher said she was \"essential to democracy in this town.\" Opinions were multiple and complex. But one thing was evident: everyone had an opinion about Grace.\n\nThen he talked to Grace's father, his landlord, Mr. Okafor. Mr. Okafor told him the story Grace never told anyone.\n\nGrace came to England from Nigeria when she was eight. Her family had very little money. At school, other children were cruel. \"They called her names,\" said Mr. Okafor. \"**Intense**, every day. But she never cried at school. She cried at home, and then she studied. She read every newspaper in the library. She said: one day, I'll write the news, and I'll write it fairly. For everyone.\"\n\nShe became a journalist at twenty-two. It was challenging: she was a young Black woman in a world of old white men. Some editors were **hostile**. Some were **liberal** and kind. She worked for distant big newspapers in London for twenty years. Then, at forty-five, she came back to Riverford to run the little Gazette. \"Everyone thought she was crazy,\" said Mr. Okafor. \"Leaving London for this? But she said: small towns need good journalism most.\"\n\nTwo years ago, the owners wanted to close the paper. Grace fought. It was an exhausted, confusing time. She convinced a local businessman to buy it. She cut her own salary in half. \"The **mere** idea of Riverford without a newspaper made her sick,\" said her father. \"She has strong **moral** ideas. Right is right. Wrong is wrong.\"\n\nMinh asked Mr. Okafor one more question. \"Is she happy?\"\n\nMr. Okafor thought. \"She's fortunate,\" he said. \"She does what she loves. That's rare. Happiness is a different question. Maybe you should ask her.\"\n\nMinh wrote the profile. It was detailed and honest. He showed the good and the complicated sides of Grace. He was not **neutral**, exactly, but he tried to be fair. He wrote that some people found her difficult. He also wrote about the eight-year-old girl who cried at home and studied.\n\nHe gave it to Raj, not Grace. Raj read it and was silent for a long time. \"Put it in,\" he said. \"I'll take the responsibility.\"\n\nWhen the special edition came out, Grace read the profile in her office. She closed the door. She didn't come out for an hour.\n\nWhen she came out, her eyes were red. She walked to Minh's desk. Everyone in the newsroom held their breath.\n\n\"That was **inevitable**, I suppose,\" she said. \"Somebody was going to write it one day. I'm glad it was you.\" She paused. \"It was **outstanding**. Thank you.\"\n\nThen she went back into her office and closed the door again.\n\n\"I think she liked it,\" Ellie whispered.\n\n\"I think she did,\" said Minh. He felt an incredible, immediate joy, almost **identical** to the day his scholarship letter came. Most stories become invisible the day after they're published. This one did not. People talked about it for weeks. Raj said it was effective because it was logical and honest, not excessive or sentimental.\n\nAfter that, the respect between Minh and Grace was mutual. They still had occasional arguments. But both were conscious of the dense history behind every page, and both knew that the existing problem, how to keep the paper alive, was crucial. It was not convenient for either of them, but it was definite: they were a team. Even the internal politics of the office became more civil. The initial shock passed, and whatever their individual feelings, nobody thought the profile had been **harmful**. Grace even framed it, though she hung it in the toilet, \"where it can't make me proud in public.\"", "words": 843, "new": [{"w": "faithful", "p": "adj/n", "vi": "trung thành"}, {"w": "fierce", "p": "adj", "vi": "dữ tợn"}, {"w": "genuine", "p": "adj", "vi": "thật, chân thật"}, {"w": "harmful", "p": "adj", "vi": "có hại"}, {"w": "historical", "p": "adj", "vi": "thuộc về lịch sử"}, {"w": "hostile", "p": "adj", "vi": "thù địch"}, {"w": "identical", "p": "adj", "vi": "giống hệt"}, {"w": "inevitable", "p": "adj", "vi": "không thể tránh khỏi"}, {"w": "intense", "p": "adj", "vi": "dữ dội, mãnh liệt"}, {"w": "liberal", "p": "adj/n", "vi": "cởi mở"}, {"w": "mere", "p": "adj", "vi": "chỉ là"}, {"w": "moral", "p": "adj/n", "vi": "đạo đức"}, {"w": "neutral", "p": "adj/n", "vi": "trung lập"}, {"w": "outstanding", "p": "adj", "vi": "xuất sắc"}]}, {"id": "W32-2", "title": "The Night Shift", "body": "Hana worked night shifts at the hospital once a week. They were long and hard. One night in June, she came to Minh's flat at seven in the morning, still in her uniform. She sat on the sofa and didn't say anything.\n\n\"Bad night?\" asked Minh.\n\n\"The worst,\" she said.\n\nHe made her tea and sat next to her. Slowly, she told him.\n\nAt two in the morning, an ambulance brought in an old man. He was vulnerable: eighty-nine, living alone, with no family nearby. He had fallen at home and lay on the floor for a day before a neighbor found him. His condition was severe. He was cold, confused and very weak.\n\n\"The doctor said it was urgent,\" said Hana. \"We had to work fast. His heart was unlikely to survive the night.\"\n\nHana stayed with him. She did everything specific to his care: checked his heart, gave him fluids, kept him warm. But mostly, she held his hand. He couldn't speak much. His hand was cold and **stiff**. But at one point, he opened his eyes and looked at her. \"Are you an angel?\" he asked.\n\n\"No,\" said Hana. \"I'm a nurse.\"\n\n\"Same thing,\" he said, and closed his eyes.\n\nHis name was Arthur. He had been a teacher for forty years. In his wallet, there was a photo of his wife, who had died ten years ago, and a **precious** letter from a former student, thanking him for changing her life.\n\n\"He was so alone,\" said Hana. \"Nobody came. Nobody called. A whole life, and at the end, only me.\"\n\n\"But you were there,\" said Minh. \"That matters.\"\n\nHana shook her head. \"It's not sufficient. Hospitals are sophisticated now. We have **superb** machines, **superior** medicine. But we don't have time. Vital things, like sitting with someone, holding their hand, we can't always do. There are too few nurses. The overall problem is substantial. It's a universal problem, in every country.\"\n\nArthur did not die that night. In the morning, he was still alive. Weak, but alive. The doctor was surprised. \"Remarkable,\" he said. \"His heart is stronger than we thought.\"\n\n\"Maybe he didn't want to leave while someone was holding his hand,\" said Hana.\n\nMinh thought about it for a long time. Then he had an idea. \"Can I write about him?\" he asked. \"Not his name. Not private things. Just the story. Old people alone. Nurses with no time.\"\n\nHana was **reluctant** at first. Patient privacy was important. But Arthur, when he was stronger, said yes. \"Write it,\" he said. \"Make people think. Maybe it'll help the next one.\"\n\nMinh wrote the story carefully. He wanted it to be **precise**, **thorough** and relevant. He talked to doctors, nurses and social workers. He found the visual data: graphs showing how many old people lived alone in Riverford. The numbers were vast: one in three people over eighty. He found a charity that organized voluntary visitors for lonely old people. They needed help.\n\nThe story was **straightforward**, but it had a **profound** effect. It was the most **prominent** story on the Gazette's website for two weeks. People called the charity to volunteer. A hundred people signed up in a month. Several of them were young students. \"I never thought about it before,\" one said. \"It's such a **subtle** problem. You don't see it. Old people are silent. They don't complain.\"\n\nArthur got a visitor every day after that. A young woman who studied history visited him on Mondays. They talked about the past. A retired man visited on Wednesdays. They played chess. A particular family visited every Sunday with their children. Arthur, who had no family, suddenly had many.\n\nWhen he finally went home, the volunteers organized a secure system so someone checked on him every day. Hana visited him too, on her days off.\n\n\"You made a **tremendous** difference,\" she told Minh.\n\n\"No,\" said Minh. \"You did. I just wrote it down.\"\n\n\"We both did,\" said Hana. \"That's the ultimate team.\"\n\nArthur sent them both a card. Inside, in shaky handwriting, he wrote: \"To my angel and my reporter. Thank you for seeing me. Your unique friend, Arthur.\"\n\nIt was valid proof, Minh thought, that small things still matter. The potential for kindness is everywhere, even in a busy, suspicious world. Arthur's memories of his prior life as a teacher were still **vivid**, and now he had a productive new life too, full of chess and history. \"I feel privileged,\" he told Hana. \"At eighty-nine, I have more friends than I had at thirty.\" Hana became very protective of him. On the upper floor of the hospital, where the oldest patients slept, the nurses put up a sign with the charity's number, visible to every visitor. It was a **rational**, simple idea. Arthur said it made him feel like a **tough** old man again.", "words": 808, "new": [{"w": "precious", "p": "adj", "vi": "quý giá"}, {"w": "precise", "p": "adj", "vi": "chính xác"}, {"w": "profound", "p": "adj", "vi": "sâu sắc"}, {"w": "prominent", "p": "adj", "vi": "nổi bật"}, {"w": "rational", "p": "adj", "vi": "hợp lý"}, {"w": "reluctant", "p": "adj", "vi": "miễn cưỡng"}, {"w": "stiff", "p": "adj", "vi": "cứng đờ"}, {"w": "straightforward", "p": "adj", "vi": "đơn giản, dễ hiểu"}, {"w": "subtle", "p": "adj", "vi": "tinh tế"}, {"w": "superb", "p": "adj", "vi": "tuyệt hảo"}, {"w": "superior", "p": "adj/n", "vi": "cao cấp hơn"}, {"w": "thorough", "p": "adj", "vi": "kỹ lưỡng"}, {"w": "tough", "p": "adj/n", "vi": "dai; khó khăn"}, {"w": "tremendous", "p": "adj", "vi": "to lớn"}, {"w": "vivid", "p": "adj", "vi": "sống động"}]}, {"id": "W32-3", "title": "The Letter from London", "body": "In August, Minh finished his novel. It had taken him a year and a half. Three hundred pages. He called it Two Rivers.\n\nMrs. Green, the librarian, read it first. \"It's good,\" she said. \"It's genuinely good. Now you need an agent.\"\n\n\"What's an agent?\"\n\n\"A person who sells your book to a publisher. Basically, you can't get published without one. Send it to ten agents. Hopefully, one will like it.\"\n\nMinh sent it to ten agents in London. Then he waited. He was used to waiting by now.\n\nThe first answer came after two weeks. \"Thank you for sending us your book. Unfortunately, it is not right for us.\" The second answer was almost identical. The third was briefly polite: \"Not for us.\" The fourth agent never answered at all. **Apparently**, that was normal.\n\nMinh was disappointed. \"It's literally the same answer every time,\" he said to Hana. \"They don't even say why.\"\n\n\"They get hundreds of books every week,\" said Hana. \"They can't personally answer everyone. Don't take it personally.\"\n\n\"How can I not take it personally? It's my book. It's my life.\"\n\nThen, in October, a letter came. Not an email. A real letter, on thick paper. It was from an agent called Diana Ross. \"No relation to the singer,\" she wrote at the top, which made Minh laugh.\n\nHe read it in the kitchen, standing up.\n\n\"Dear Minh,\n\n**Frankly**, I wasn't going to read your book. I read the first page **accidentally**, because it was on top of a pile. Then I read the second page **deliberately**. Then I read the whole thing in one night.\n\nIt's exceptionally good. **Indeed**, it's one of the best first novels I've read this year. The voice of Long, your narrator, is incredibly fresh. You write simply and directly, but effectively. The scenes with the English grandmother are highly moving. I cried twice, which rarely happens to me.\n\nIt isn't perfect. Some chapters are relatively slow. The middle part mostly needs work. And admittedly, the ending is a little too happy. **Ideally**, I'd like you to make some changes. Specifically: shorten chapters 8 to 12, and make the ending more honest.\n\nAdditionally, I want to say: this book is increasingly important. More and more people live between two cultures. Your book speaks equally to them and to the people who welcome them.\n\nI'd like to represent you. Please call me.\n\nSincerely,\nDiana Ross\"\n\nMinh read it three times. Then he sat down on the floor, because his legs were shaking.\n\nSam came into the kitchen. \"What's wrong? Are you sick?\"\n\n\"An agent,\" said Minh. \"An agent wants my book.\"\n\nSam shouted so loudly that Mr. Okafor came up the stairs to check if they were OK.\n\nThat evening, Minh called Diana. She spoke fast and strongly. \"Make the changes accordingly,\" she said. \"Take three months. Presumably you have a job, so do it at night. Then we'll send it to publishers. Consequently, if it sells, you'll be a published author. Naturally, I can't promise anything. Publishing is strictly a business. But I fully believe in this book.\"\n\n\"Why?\" asked Minh. \"Why my book?\"\n\n\"Because it's **purely** honest,\" said Diana. \"You didn't try to be clever. You tried to be true. That's notably rare.\"\n\nAfter the call, Minh called his parents in Vietnam. It was five in the morning there. His mother answered, half asleep. \"What's wrong? Are you sick?\"\n\n\"Nothing's wrong, Mum. Someone wants to sell my book.\"\n\nThere was a pause. Then his mother woke up entirely. \"Your book? The book about us?\"\n\n\"Partly about us,\" said Minh. \"It's originally about us. But it's fiction.\"\n\n\"Does the grandmother have my mother-in-law's temper?\"\n\n\"A little.\"\n\nHis mother laughed. \"Then it's necessarily a good book,\" she said.\n\nOver the next three months, Minh rewrote the book thoroughly. He worked every night after work. It was hard, but it went smoothly most of the time. He cut chapters largely in the middle. He made the ending less happy and more honest. Initially, he hated the changes. Then he readily saw that Diana was right. The new version was sufficiently better. It was newly alive.\n\n\"**Evidently**, you're a real writer now,\" said Grace, when he told her. \"Don't quit your day job. Reportedly, writers earn less than journalists. And journalists earn virtually nothing.\"\n\n\"I won't quit,\" said Minh. \"I love my day job.\"\n\n\"Good answer,\" said Grace. And it was, officially, the truth. He was primarily a journalist, he decided. Writing books was merely a second dream. A **weird** dream, maybe, for a boy from a small Vietnamese town. But a worthwhile one.\n\n\"Is it worthy of all this work?\" Hana asked him one night, when he was still writing at two in the morning.\n\n\"Absolutely,\" he said.\n\nShe said she was willing to read every new version, even the bad ones. In a world of widespread bad news, it was the happiest month of his life.", "words": 822, "new": [{"w": "weird", "p": "adj", "vi": "kỳ lạ"}, {"w": "accidentally", "p": "adv", "vi": "vô tình"}, {"w": "apparently", "p": "adv", "vi": "hình như"}, {"w": "deliberately", "p": "adv", "vi": "cố ý"}, {"w": "evidently", "p": "adv", "vi": "rõ ràng"}, {"w": "frankly", "p": "adv", "vi": "nói thẳng"}, {"w": "ideally", "p": "adv", "vi": "lý tưởng nhất"}, {"w": "indeed", "p": "adv", "vi": "quả thật"}, {"w": "purely", "p": "adv", "vi": "hoàn toàn, chỉ"}]}, {"id": "W33-1", "title": "The Great Debate", "body": "In November, there was a big **dispute** in Riverford. A company wanted to build five hundred new houses on the fields north of the town. Some people loved the idea. Some people hated it. The debate was everywhere: in the shops, in the pubs, at The Blue Cup.\n\nThe council decided to hold a public meeting. They asked the Gazette to organize it. Grace asked Minh to lead the discussion. \"You're **wholly** neutral,\" she said. \"You're not from here. Nobody can say you're on one side.\"\n\n\"Supposedly neutral,\" said Minh. \"I live in the city now. And I love this town.\"\n\n\"Then be **thoroughly** fair,\" said Grace. \"That's all I ask.\"\n\nThe meeting was in the town hall. Four hundred people came. The **atmosphere** was tense. Minh stood at the front with a microphone. His hands were shaking. He had never spoken in front of so many people.\n\n\"Thank you for coming,\" he said. \"Tonight, we'll hear from both sides. Everyone will have a chance to speak. Please respect each other. This is a debate, not a war.\"\n\nThe first speaker was from the building company. He explained the concept. \"The town has a housing **crisis**,\" he said. \"Young people can't find homes. Our development will provide five hundred houses, a school and a park. It will have a positive impact on the economy. It's a major contribution to the town's future.\"\n\nThe second speaker was a farmer whose family had owned the fields for two hundred years. He spoke with strong emotion. \"These fields are part of our identity,\" he said. \"They're part of what Riverford is. Once they're gone, they're gone forever. What about the consequence for nature? For the river? For the floods?\"\n\nPeople clapped for both. Minh noticed something interesting about one aspect of the evening: the argument was not really about houses. It was about who controlled the future of the town.\n\nThen the public spoke. A young mother said she needed a home. An old man said the town would lose its characteristic small-town feeling. A teenager said she wanted more things to do. A scientist from the university, Ffion, spoke about awareness of flooding. \"In comparison with other towns, Riverford has a higher flood risk,\" she said. \"Building on those fields could make floods worse. That's a serious factor.\"\n\nThe emphasis of the debate changed after that. People wanted an explanation from the company. \"What will you do about floods?\" asked someone. The company man did not have a good answer. His confidence disappeared. \"We'll look into it,\" he said.\n\nMinh tried to keep control. Twice, people started shouting. Once, an old man and a young man almost started a fight. Minh stepped between them. \"Please,\" he said. \"We're all neighbors. Let's listen.\"\n\n**Surprisingly**, it worked. The room went quiet.\n\nAt the end, Minh summarized the main points. \"There's clearly a need for homes,\" he said. \"There's also a need to protect nature and prevent floods. The question is: can we find an approach that does both?\"\n\nAn old woman stood up. It was Grandma Rose. \"Build smaller,\" she said. \"Fewer houses. Better houses. Away from the river. Put the park where the floods come. Water can go into a park. It can't go into a house.\"\n\nThere was a long silence. Then people began to clap. Even the company man nodded slowly. \"That's... actually a good idea,\" he said.\n\nThe meeting ended without an agreement, but with an improvement in understanding. Ultimately, the council asked the company to change its plans. Six months later, a new plan came: three hundred houses, a big park on the flood land, and a promise to build flood defences first. It got approval from the council and **virtually** everyone in the town.\n\nAfter the meeting, Grace found Minh. \"You had guidance from no one tonight,\" she said. \"And you did well. That takes ability.\"\n\n\"I was **utterly** terrified,\" said Minh.\n\n\"Good,\" said Grace. \"**Undoubtedly**, that's why you were careful. Fearless people make bad moderators.\"\n\nMinh walked home with the encouragement of Grace's words in his head. He thought about the existence of a small town, its independence, its desire to stay itself while still growing. He thought about how every circumstance has two sides, and how the failure to listen causes most problems. The basis of a good community, he decided, was simple: people who talk, and people who listen.\n\nHe wrote his impression of the evening for the Gazette. It was widely read. One reader wrote: \"This is how democracy should work.\" Another wrote: \"Too much talking. Just build the houses.\" Minh smiled. You can't please everyone. But you can give everyone access to the conversation. That was the advance, he thought: not the houses, but the talking. The whole affair taught him something about authority, too: it comes not from shouting, but from assistance, from helping people hear each other. His **curiosity** about people had grown into something like a career. It had, temporarily at least, made him the most-discussed journalist in Riverford. The expectation now was that he would do it again. It was in a new category of work for him: not just reporting, but bringing people together. The contrast with his first week in England, when he couldn't even order a coffee, was huge. His **desire** to help the town had found a shape.", "words": 893, "new": [{"w": "surprisingly", "p": "adv", "vi": "đáng ngạc nhiên"}, {"w": "thoroughly", "p": "adv", "vi": "kỹ lưỡng"}, {"w": "undoubtedly", "p": "adv", "vi": "chắc chắn"}, {"w": "utterly", "p": "adv", "vi": "hoàn toàn"}, {"w": "virtually", "p": "adv", "vi": "gần như"}, {"w": "wholly", "p": "adv", "vi": "hoàn toàn"}, {"w": "atmosphere", "p": "n", "vi": "khí quyển, bầu khí quyển (lớp khí bao quanh hành tinh)"}, {"w": "crisis", "p": "n", "vi": "cuộc khủng hoảng"}, {"w": "curiosity", "p": "n", "vi": "sự tò mò"}, {"w": "desire", "p": "v/n", "vi": "mong muốn"}, {"w": "dispute", "p": "n/v", "vi": "tranh chấp"}]}, {"id": "W33-2", "title": "The Offer", "body": "In January, Hana got an email that changed everything. A big hospital in Tokyo offered her a job. It was a special program for young nurses, training in intensive care. Two years. Good money. A great **prospect** for her career.\n\nShe told Minh at dinner. He was quiet for a long time.\n\n\"It's an amazing opportunity,\" he said finally. \"You should take it.\"\n\n\"Should I?\" said Hana. \"What about us?\"\n\nThat was the question. They had been together for two years. Minh had a job he loved in England. His novel was going to publishers. Hana's family was in Japan. Her parents were getting older. She felt an **obligation** to be closer to them. But she also loved Minh, and she loved England.\n\nThe next weeks were full of **tension**. They talked about it every night. They had their first real argument. Minh said something unkind. Hana said something worse. Then they both apologized. \"We're both tired,\" said Hana. \"This is too big.\"\n\nMinh went to Grandma Rose for advice. She was eighty-three now, slower, but her mind was as sharp as ever. She was famous in the family for her **wisdom**.\n\n\"Tell me the whole story,\" she said. He told her. She listened, with her eyes closed.\n\n\"What's your priority?\" she asked when he finished. \"Not your preference. Your priority. What matters most?\"\n\nMinh thought. \"Her,\" he said. \"Hana. Her happiness.\"\n\n\"Then you already know the answer,\" said Grandma Rose. \"Love is not a scheme to keep someone close. It's not about **revenge** or winning arguments. Sometimes it's about **sacrifice**. You let them go, and you trust that they'll come back.\"\n\n\"What if she doesn't come back?\"\n\n\"Then it wasn't meant to be. But I think she will.\" Grandma Rose opened her eyes. \"Look at Margaret and me. Sixty years apart. We still came back to each other. Real love has a tendency to find its way home.\"\n\nMinh also talked to his own grandmother in Vietnam, on a video call. Her perspective was different. \"In my day, a woman followed her husband,\" she said. \"Times change. Now, sometimes a man follows a woman. Or they find a third way. Don't be old-fashioned. Be clever.\"\n\n\"A third way?\" said Minh.\n\n\"There's always a third way,\" she said. \"Look for it.\"\n\nHe thought about it for days. Then he had an idea. He went to see Grace.\n\n\"I have a strange request,\" he said. \"Could I work for the Gazette from Japan? Part of the time? I could write about Japanese towns, compare them with Riverford. A series. 'Two Small Towns.' And I could finish my second book.\"\n\nGrace looked at him for a long time. \"That's a very unusual initiative,\" she said. \"We're a local paper. Our **mission** is Riverford.\"\n\n\"But Riverford has many Japanese and Asian residents,\" said Minh. \"And readers loved the stories about Spain and Scotland. It would give a new range to the paper. A wider scope.\"\n\nGrace thought. \"It's not the usual procedure,\" she said. \"There would be restrictions. You'd have to come back for important stories. And there's a shortage of money, as always.\"\n\n\"I understand.\"\n\n\"Let me think about it.\"\n\nTwo days later, she called him. \"One year,\" she said. \"Not two. One. Then we see. That's my response. Take it or leave it.\"\n\nMinh took it.\n\nThat evening, he told Hana. She was silent. Then she started to cry. \"You'd do that? For me?\"\n\n\"For us,\" said Minh. \"It's not a **sacrifice**. It's a possibility. A new version of our life.\"\n\n\"What about your **reputation** here? Your status at the Gazette?\"\n\n\"Grace says my reputation will survive. And she says Japan is a good instance of a place where small towns are dying, like Riverford. It's a real story.\"\n\nHana laughed through her tears. \"You always find a story.\"\n\n\"It's my motivation,\" said Minh. \"Stories, and you.\"\n\nThe next morning, she accepted the job in Tokyo. They would leave together in April.\n\nWhen Minh told the Parkers, the outcome was mixed. Mia cried. Leo said, \"Finally, I get your room when you visit.\" Anna said she was happy for them. Tom said he would miss his American-English student. Grandma Rose just smiled. \"I told you,\" she said. \"Always a third way.\"\n\nThat night, Minh thought about the significance of it all. Two years ago, he had been a lonely student. Now he was leaving England, not because he had to, but because he wanted to follow someone he loved. It was a **quest** for happiness, and maybe for a new kind of home. He felt recognition that this was a turning point. The philosophy of his life, he realized, was simple: say yes to life. He had a new reflection on his English years: they were not a waiting room, but a real life.\n\nHis **involvement** with the Gazette would continue, from far away. Grace sent him a long email of rules: a sequence of deadlines, a technique for working across time zones, a layout for his column. It ended with a compliment, which was rare from her: \"You've earned it. Don't waste it.\" It was a reward, and a symbol of trust. His **judgment** had been right. Grace had a **manner** that hid her kindness, but her logic was always fair. The relation between them had become something like family.\n\nThe **welfare** of the people he loved was the only principle that mattered. There was no threat in change, only a requirement to be brave. He had a weakness for worrying, but a variety of people had taught him that worry was just a phenomenon, like weather. It passes. He had an insight that night that he would keep forever: home is not a place. It's the people who are waiting for you.\n\nHis intention was clear now. He fell asleep with a smile.", "words": 974, "new": [{"w": "involvement", "p": "n", "vi": "sự tham gia"}, {"w": "judgment", "p": "n", "vi": "sự phán đoán"}, {"w": "manner", "p": "n", "vi": "cách thức; thái độ"}, {"w": "mission", "p": "n", "vi": "sứ mệnh"}, {"w": "obligation", "p": "n", "vi": "nghĩa vụ"}, {"w": "prospect", "p": "n/v", "vi": "triển vọng"}, {"w": "quest", "p": "n", "vi": "cuộc tìm kiếm"}, {"w": "reputation", "p": "n", "vi": "danh tiếng"}, {"w": "revenge", "p": "n", "vi": "sự trả thù"}, {"w": "sacrifice", "p": "v/n", "vi": "hy sinh"}, {"w": "tension", "p": "n", "vi": "sự căng thẳng"}, {"w": "welfare", "p": "n", "vi": "phúc lợi"}, {"w": "wisdom", "p": "n", "vi": "sự khôn ngoan"}]}, {"id": "W33-3", "title": "Goodbye, Riverford", "body": "The last month in England was busy. There was so much to do: pack, say goodbye, finish stories. And there was one more surprise. Diana, Minh's agent, called. \"A publisher wants your book,\" she said. \"Two Rivers will be published next spring. As a real book, and an e-book. Congratulations.\"\n\nMinh could not speak. When he finally could, he called everyone. His parents. The Parkers. Hana. Mrs. Green at the library, who screamed so loudly that the whole library heard.\n\nThe Parkers had a goodbye party for Minh and Hana. The whole town seemed to come. Daniel closed The Blue Cup for the night and made it a private party. Pat made a **sugar-free** cake for Grandma Rose and a normal one for everyone else. Tom grilled steaks, too **well-done** as always.\n\nMargaret came from Scotland, **well-dressed** in a blue suit. Gareth and Megan came from Wales with Ffion. Mr. Okafor came with his whole family, including Grace, who arrived late and said she was \"only staying ten minutes.\" She stayed until midnight.\n\nThere were speeches. Daniel spoke first. \"When Minh first came to my café, he couldn't make a cappuccino,\" he said. \"Now he can make a cappuccino, save a café, find a lost friend and write a book. I want to declare him an honorary citizen of Riverford.\"\n\nEveryone cheered.\n\nThen Grace spoke. She was not good at speeches. \"I'll be brief,\" she said. \"When Minh came to my table at the careers fair, I assumed he was lost. My first perception was: another student who'll quit in a week. That assumption was wrong. My **instinct** is usually right. This time, my intuition failed. I **confess** I was wrong. He's the best young journalist I've worked with.\" She paused. \"I don't usually praise people. Please don't tell anyone.\"\n\nThen it was Grandma Rose's turn. She stood up slowly with her stick. The room went quiet.\n\n\"I'm an old woman,\" she said. \"I've seen a lot of people come and go. But this boy...\" She stopped. Her voice was shaking. \"This boy gave me back my best friend. He gave this family a fourth child. He gave this town a voice. And now he's going to Japan with a lovely girl, and I'm too old to go with them.\" She looked at Minh. \"Come back. That's all. Come back, and bring stories.\"\n\nMinh could not speak. He just hugged her. Everyone was crying, even Leo, who said he had something in his eye.\n\nAt the end of the night, Leo told everyone his own news. His football team had won the **quarter-final** and the **semi-final** of the county cup. The final was next week. \"You'll miss it,\" he said to Minh. \"But I'll send you a video. Even the warm-up.\"\n\nMia showed him a present: a painting of The Blue Cup, with everyone inside. \"So you don't forget us,\" she said.\n\n\"I could never forget you,\" said Minh.\n\nThe next week, Minh and Hana went to the airport. They checked their bags. They walked past the **duty-free** shops full of perfume and whisky. They sat at the gate.\n\nMinh looked out at the planes. He thought about the boy who had arrived four years ago with a heavy suitcase and Lan's T-shirt. That boy couldn't buy a bus ticket. He had a lot of **old-fashioned** notions about England from films. He thought everyone drank tea and wore hats.\n\nSo much had changed. He had lived in an old house with an English family, then in a **semi-detached** house turned into flats, above Mr. Okafor. He had eaten **fast-food** with Sam at two in the morning and fancy dinners with Grace. He had stayed in a **run-down** hostel in London and a brand-new hotel in Madrid, with an **en-suite** bathroom that felt like a palace. He had bought second-hand clothes, sold-out concert tickets and out-of-stock books. He had visited a **self-service** laundromat every Sunday. He had interviewed a **middle-aged** self-employed builder, a girl from a **single-sex** school and the owner of an **eco-friendly** café, which was really The Blue Cup. He had learned to keep his notes **up-to-date** and to remember every log-in and password.\n\n\"What are you thinking?\" asked Hana.\n\n\"That I've changed,\" said Minh. \"Some people would remark that I'm more English now. I don't know. My viewpoint is different. My reasoning is different. I think in two languages.\"\n\n\"Is that good or bad?\"\n\nMinh thought. \"Good,\" he concluded. \"Two languages, two homes, two families. Not an all-inclusive holiday. A real life.\"\n\nHana took his hand. \"I want to clarify one thing,\" she said. \"Japan is not forever. We'll come back. To Riverford, to Vietnam, everywhere. Agreed?\"\n\n\"Agreed,\" said Minh. \"I'll notify the Parkers.\"\n\nShe laughed. \"You sound like a newspaper.\"\n\nThe announcement came: their flight was boarding. Minh stood up. He had no motive except love, and no plan except to see where it led. He didn't want to **insult** the past by being sad. He wanted to emphasize the good. He took one last look at England through the window.\n\n\"Goodbye, Riverford,\" he said quietly. \"Thank you.\"\n\nThen he got on the plane and flew east, toward the sun.", "words": 863, "new": [{"w": "insult", "p": "n/v", "vi": "lời xúc phạm"}, {"w": "confess", "p": "v", "vi": "thú nhận"}, {"w": "instinct", "p": "n", "vi": "bản năng"}, {"w": "well-dressed", "p": "adj", "vi": "ăn mặc đẹp"}, {"w": "middle-aged", "p": "adj", "vi": "trung niên"}, {"w": "old-fashioned", "p": "adj", "vi": "lỗi thời"}, {"w": "semi-detached", "p": "adj", "vi": "nhà chung một vách"}, {"w": "fast-food", "p": "adj", "vi": "thức ăn nhanh"}, {"w": "sugar-free", "p": "adj", "vi": "không đường"}, {"w": "well-done", "p": "adj", "vi": "chín kỹ"}, {"w": "self-service", "p": "adj/n", "vi": "tự phục vụ"}, {"w": "up-to-date", "p": "adj", "vi": "cập nhật mới nhất"}, {"w": "eco-friendly", "p": "adj", "vi": "thân thiện với môi trường"}, {"w": "run-down", "p": "adj", "vi": "xuống cấp"}, {"w": "en-suite", "p": "adj/adv", "vi": "khép kín"}, {"w": "duty-free", "p": "adj/adv", "vi": "miễn thuế"}, {"w": "single-sex", "p": "adj", "vi": "một giới"}, {"w": "semi-final", "p": "n", "vi": "trận bán kết"}, {"w": "quarter-final", "p": "n", "vi": "trận tứ kết"}]}, {"id": "W34-1", "title": "Hana's Family", "body": "In April, Minh and Hana arrived in Japan. Before they moved into their small flat in Tokyo, they went to visit Hana's family in her hometown by the sea. Minh was very nervous. Meeting the parents of your girlfriend is hard in any country. In Japan, he had heard, it was harder.\n\nHana's family was big. There were her parents, her grandmother, two **siblings** (an older brother and a younger sister), her brother's **spouse**, and their two small children: a **toddler** who had just learned to walk and an **infant** of six months. There were also aunts, uncles, cousins and many people Minh thought were family but who were actually just **acquaintances** from the town.\n\nHana's grandmother was a **widow**. Her husband had died the year before. She was small and quiet, but everyone listened when she spoke. Minh bowed very low when he met her. She looked at him for a long time. Then she said something in Japanese. Everyone laughed.\n\n\"What did she say?\" Minh whispered.\n\n\"She said you're too thin,\" said Hana. \"Like all grandmothers.\"\n\nMinh relaxed a little.\n\nOn the first evening, Hana's father showed Minh the family altar. There were photos of their **ancestors**, going back four generations. \"We are the **descendants** of fishermen,\" said her father. Hana translated. \"My great-grandfather was an **orphan**. He had no family. He built this house with his own hands. Everything we have, we **inherited** from him.\"\n\nThe grandfather who died last year had left the house to Hana's father, the oldest son. He was the **heir**. \"In Japan, **kinship** is very important,\" Hana explained later. \"Family is everything. Your **upbringing** is about duty to your family.\"\n\n\"Same in Vietnam,\" said Minh.\n\nHana's father asked Minh many questions. About his family, his job, his plans. Minh answered carefully. Then Hana's father asked: \"Is your father a **widower**? I heard your grandmother lives with your family.\"\n\n\"No, my father's father died. My grandmother lives with us.\"\n\n\"Ah. Good. A family that takes care of old people is a good family.\"\n\nMinh felt that he had passed a test.\n\nThe next day, Hana's father took Minh to an onsen, a Japanese hot spring bath. In Japan, people bathe together, without clothes, in hot natural water. Minh had never done this. He was very embarrassed. He tried to cover every part of his body: his **thighs**, his **torso**, his **buttocks**. Hana's father laughed and said something.\n\nLater, Hana translated: \"He said, 'Relax. We all have the same body.'\"\n\nIn the hot water, Hana's father became friendlier. He showed Minh a long scar on his **forearm**. \"From a fishing boat, thirty years ago,\" he said. Minh showed him the scar on his own knee, from falling off his father's motorbike as a child. They didn't have many words in common, but they laughed. With his **eyelids** half closed in the steam, Hana's father talked about Hana: when she was a child, her **adolescence**, her decision to go to England. \"We were worried,\" he said. \"She was a girl in a foreign country. Alone. But she came back strong. Now a woman. **Adulthood** suits her.\"\n\n\"She's the strongest person I know,\" said Minh.\n\nHana's father nodded. \"And now she brings home a Vietnamese boy,\" he said. \"Life is strange.\"\n\nOn the last night, the family had a big dinner. Hana's younger sister, who was sixteen, a typical **adolescent**, asked Minh a lot of questions about England. Her **peers** at school were all jealous, she said, because her sister had a foreign boyfriend. Minh was a **companion** for all the children; he played with the toddler all evening.\n\nAt the end of dinner, Hana's grandmother said something to Hana. Hana went red.\n\n\"What did she say?\" asked Minh.\n\n\"She asked if you're my **fiance**,\" said Hana. \"I said no. Not yet.\"\n\n\"Not yet?\" said Minh.\n\nHana looked at him. \"Not yet,\" she said again, and smiled.\n\nMinh learned that night that Hana's aunt was a **stepmother** to two children from her husband's first marriage: a **stepson** and a **stepdaughter**. And Hana's cousin had a **stepfather** who was American. \"Japanese families are more complicated than people think,\" Hana said. \"Just like everyone else's.\"", "words": 697, "new": [{"w": "sibling", "p": "n", "vi": "anh chị em ruột"}, {"w": "spouse", "p": "n", "vi": "vợ hoặc chồng"}, {"w": "ancestor", "p": "n", "vi": "tổ tiên"}, {"w": "descendant", "p": "n", "vi": "hậu duệ"}, {"w": "toddler", "p": "n", "vi": "trẻ mới biết đi"}, {"w": "infant", "p": "n/adj", "vi": "trẻ sơ sinh"}, {"w": "orphan", "p": "n/v", "vi": "trẻ mồ côi"}, {"w": "widow", "p": "n", "vi": "góa phụ"}, {"w": "widower", "p": "n", "vi": "người đàn ông góa vợ"}, {"w": "acquaintance", "p": "n", "vi": "người quen"}, {"w": "upbringing", "p": "n", "vi": "sự nuôi dạy"}, {"w": "adulthood", "p": "n", "vi": "tuổi trưởng thành"}, {"w": "adolescence", "p": "n", "vi": "tuổi vị thành niên"}, {"w": "adolescent", "p": "n/adj", "vi": "thanh thiếu niên"}, {"w": "peer", "p": "v/n", "vi": "bạn cùng lứa"}, {"w": "companion", "p": "n", "vi": "bạn đồng hành"}, {"w": "fiance", "p": "n", "vi": "hôn phu"}, {"w": "stepmother", "p": "n", "vi": "mẹ kế"}, {"w": "stepfather", "p": "n", "vi": "cha dượng"}, {"w": "stepson", "p": "n", "vi": "con trai riêng của vợ chồng"}, {"w": "stepdaughter", "p": "n", "vi": "con gái riêng của vợ chồng"}, {"w": "kinship", "p": "n", "vi": "mối quan hệ họ hàng"}, {"w": "inherit", "p": "v", "vi": "thừa kế"}, {"w": "heir", "p": "n", "vi": "người thừa kế"}, {"w": "forearm", "p": "n", "vi": "cẳng tay"}, {"w": "thigh", "p": "n", "vi": "đùi"}, {"w": "buttocks", "p": "n", "vi": "mông"}, {"w": "torso", "p": "n", "vi": "thân mình"}, {"w": "eyelid", "p": "n", "vi": "mí mắt"}]}, {"id": "W34-2", "title": "Sick in Tokyo", "body": "In May, there was a flu **epidemic** in Tokyo. Thousands of people were sick. On the train, everyone wore masks. \"Not a **pandemic**,\" said Hana. \"Just a bad flu season. But it's very **contagious**. Be careful.\"\n\nMinh was not careful enough. One morning, he woke up with a terrible headache. It was not a normal headache. It was a **migraine**: one side of his head was full of pain, and the light hurt his eyes. He felt **nausea**, a sick feeling in his stomach. He was so cold that he started to **shiver**. His hands began to **tremble**.\n\nHana was at work. She called him at lunch. \"Take your **pulse**,\" she said. \"Put two fingers on your wrist. Count for fifteen seconds.\"\n\nMinh counted. \"Twenty-eight,\" he said.\n\n\"Times four is a hundred and twelve. That's fast. You have a fever. I'm coming home.\"\n\nHana came home with medicine and soup. She looked at him like a nurse, not a girlfriend. She checked his throat with a light. \"Your **tonsils** are red and big,\" she said. \"And your **gums** look pale. Open wider.\" She checked his **nostrils**. \"Your nose is blocked. **Inhale** slowly. **Exhale**. Again.\"\n\n\"Are you my nurse or my girlfriend?\" asked Minh weakly.\n\n\"Both,\" said Hana. \"Today, mostly nurse.\"\n\nThe next day, he was worse. Hana took him to a clinic. The doctor was a calm old man. He made a diagnosis quickly. \"Influenza,\" he said. \"**Acute**, not **chronic**. It will pass in a week. Rest, water, medicine.\"\n\nMinh asked about the **fatigue**. He had been tired for weeks, even before the flu. \"And I can't sleep. Every night, I lie awake for hours.\"\n\nThe doctor asked more questions. \"**Insomnia** is common for people who move countries,\" he said. \"New place, new language, new job. Your body is confused. Your **hormones**, your sleep. And your **immune** system is weaker when you're stressed. That's why you got sick.\"\n\nHe diagnosed Minh with stress and flu. \"The flu, I can treat. The stress, you must treat yourself.\"\n\nHana was quiet on the way home. \"I didn't know you were stressed,\" she said. \"Why didn't you tell me?\"\n\nMinh didn't know what to say. The truth was, Japan was harder than he expected. He didn't speak the language. Everything was different: the trains, the food, the rules. He couldn't read the signs. In England, he had built a life. Here, he was starting again. And Hana was busy at the hospital, working twelve-hour shifts.\n\n\"I didn't want to worry you,\" he said. \"You're so busy.\"\n\n\"That's not how this works,\" said Hana. \"We tell each other things. Even bad things. Especially bad things.\"\n\nMinh stayed in bed for a week. He couldn't eat much. His **digestion** was terrible; his **intestines** hurt. He couldn't **digest** anything except rice soup. \"Just like my grandmother in the hospital,\" he joked. Hana didn't laugh.\n\nBut slowly, he got better. His **immunity** came back. He started sleeping again. And he made a decision. \"I'm going to learn Japanese properly,\" he said. \"Not just 'thank you' and 'excuse me.' Real Japanese.\"\n\n\"Good,\" said Hana. \"I'll find you a teacher.\"\n\nHana also told him about her own week at the hospital. A man had come in with a **fracture** in his leg after falling down the stairs. A girl had a **sprain** in her ankle from basketball. An old woman had a problem with an **artery** in her heart; she needed surgery. \"Every day is different,\" Hana said. \"That's what I love.\"\n\n\"Does anyone ever just have a cold?\" asked Minh.\n\n\"You,\" said Hana. \"You're my only cold patient. And the worst one. You complained more than the man with the fracture.\"\n\nMinh laughed, and then coughed, and then laughed again. Even the dog next door seemed to cover its nose with its paw when he walked past. His mouth was dry, with no **saliva**, from the medicine. But he was alive, and he had a plan.", "words": 658, "new": [{"w": "nostril", "p": "n", "vi": "lỗ mũi"}, {"w": "gum", "p": "n", "vi": "lợi"}, {"w": "tonsil", "p": "n", "vi": "amiđan"}, {"w": "intestine", "p": "n", "vi": "ruột"}, {"w": "artery", "p": "n", "vi": "động mạch"}, {"w": "pulse", "p": "n", "vi": "mạch đập"}, {"w": "saliva", "p": "n", "vi": "nước bọt"}, {"w": "hormone", "p": "n", "vi": "hoóc môn"}, {"w": "digest", "p": "v", "vi": "tiêu hóa"}, {"w": "digestion", "p": "n", "vi": "sự tiêu hóa"}, {"w": "inhale", "p": "v", "vi": "hít vào"}, {"w": "exhale", "p": "v", "vi": "thở ra"}, {"w": "shiver", "p": "v/n", "vi": "run vì lạnh"}, {"w": "tremble", "p": "v", "vi": "run rẩy"}, {"w": "chronic", "p": "adj", "vi": "mãn tính"}, {"w": "acute", "p": "adj/n", "vi": "cấp tính"}, {"w": "contagious", "p": "adj", "vi": "dễ lây"}, {"w": "epidemic", "p": "n/adj", "vi": "dịch bệnh"}, {"w": "pandemic", "p": "adj/n", "vi": "đại dịch"}, {"w": "immune", "p": "adj", "vi": "miễn dịch"}, {"w": "immunity", "p": "n", "vi": "miễn dịch"}, {"w": "fatigue", "p": "n/v", "vi": "sự mệt mỏi"}, {"w": "insomnia", "p": "n", "vi": "chứng mất ngủ"}, {"w": "nausea", "p": "n", "vi": "buồn nôn"}, {"w": "migraine", "p": "n", "vi": "chứng đau nửa đầu"}, {"w": "fracture", "p": "n/v", "vi": "gãy xương"}, {"w": "sprain", "p": "n/v", "vi": "bong gân"}]}, {"id": "W34-3", "title": "The Intensive Care Unit", "body": "In June, Minh wrote his first article for the Gazette from Japan. Grace wanted something personal. \"Write about Hana's work,\" she suggested. \"People in Riverford remember her. And our hospital has the same problems.\"\n\nHana got permission for Minh to visit her hospital, a huge modern building in the center of Tokyo. She worked in intensive care, with the sickest patients.\n\nA senior **physician**, Dr. Tanaka, showed Minh around. \"Here, we treat people after major operations,\" he said. \"Heart surgery. Organ **transplants**. Accidents. Some patients come with a **syndrome** we don't fully understand, or a rare **disorder** of the blood.\"\n\nHe showed Minh a patient, an old man who had received a new kidney the week before. \"His **recovery** is good,\" said Dr. Tanaka. \"But we must watch for **inflammation** and infection. The body sometimes fights a new organ.\"\n\nAnother patient was a young man who had taken an **overdose** of medicine by mistake. \"Too big a **dose**,\" said Dr. Tanaka. \"Very dangerous. We saved him, but only just.\"\n\nMinh watched Hana work. She moved quickly and calmly. She gave a patient medicine through a tube. She checked machines. She talked softly to a woman who was waking up after an operation. \"The **anesthetic** makes them confused,\" she explained. \"They don't know where they are. I tell them: you're safe.\"\n\nLater, Minh met other members of the team. A **pharmacist** who checked every medicine. A **paramedic** who brought patients in by ambulance. A physiotherapist who helped with **rehabilitation**, teaching people to walk again after long illness.\n\n\"The hardest part,\" said Hana, \"is when patients have a **relapse**. They get better, they go home, then they come back sicker. It breaks your heart.\"\n\nMinh asked Dr. Tanaka about health problems in Japan. \"We live long,\" the doctor said. \"But we have new problems. **Obesity** is rising, especially in young people. Fast food, no exercise. In poorer countries, the problem is the opposite: **malnutrition**. Not enough food. And everywhere, **hygiene** and **sanitation** are important. Clean water and clean hands save more lives than doctors.\"\n\n\"What's the best **remedy** for staying healthy?\" asked Minh.\n\nDr. Tanaka laughed. \"Sleep, vegetables, walking, and friends. **Wellness** is not only the body. Most **ailments** start with stress.\"\n\nMinh thought about his own flu.\n\nHe also noticed how different the patients looked. In the waiting room, there was a **plump**, cheerful grandmother with a **chubby** baby. A **stocky** construction worker with a broken hand. A **petite** woman, very small, who turned out to be a famous dancer. She was **graceful** even in a hospital gown. Next to her, a tall young man was very **clumsy**; he knocked over a cup of water twice.\n\n\"People think hospital patients are **unattractive**,\" said Hana. \"Sick, gray, tired. But look. Everyone here has a story. Everyone is beautiful in some way.\"\n\nOne patient was especially **striking**: an old woman with white hair and bright eyes, who was ninety-five and recovering from heart surgery. She asked Minh where he was from. When he said Vietnam, she smiled. \"I visited Saigon in 1960,\" she said in English. \"Beautiful city. Beautiful people.\"\n\nMinh wrote his article that night. He called it \"The Quiet Heroes.\" He compared Hana's hospital in Tokyo with the hospital in Riverford. Different countries, different languages. The same problems: too few nurses, too many patients, and people who worked too hard because they cared.\n\nGrace published it on the front page. Hundreds of readers commented. One of them was Kate, Grandma Rose's niece, the nurse in Riverford. \"Thank you,\" she wrote. \"For seeing us.\" There was also a comment from Arthur, the old man Hana had cared for. \"My angel has gone to Japan,\" he wrote. \"Lucky Japan.\"\n\nHana read the comments and cried. \"I miss Riverford,\" she said.\n\n\"Me too,\" said Minh. \"But we'll go back.\"\n\n\"Yes,\" said Hana. \"We'll go back. But first, we work.\"", "words": 644, "new": [{"w": "inflammation", "p": "n", "vi": "viêm"}, {"w": "disorder", "p": "n", "vi": "chứng rối loạn"}, {"w": "syndrome", "p": "n", "vi": "hội chứng"}, {"w": "rehabilitation", "p": "n", "vi": "phục hồi chức năng"}, {"w": "transplant", "p": "v/n", "vi": "ca cấy ghép"}, {"w": "anesthetic", "p": "n", "vi": "thuốc gây tê mê"}, {"w": "paramedic", "p": "n", "vi": "nhân viên cấp cứu"}, {"w": "pharmacist", "p": "n", "vi": "dược sĩ"}, {"w": "physician", "p": "n", "vi": "bác sĩ"}, {"w": "recovery", "p": "n", "vi": "sự phục hồi"}, {"w": "relapse", "p": "v/n", "vi": "tái phát"}, {"w": "remedy", "p": "n/v", "vi": "khắc phục, biện pháp"}, {"w": "overdose", "p": "n", "vi": "sự dùng quá liều"}, {"w": "dose", "p": "n", "vi": "liều thuốc"}, {"w": "hygiene", "p": "n", "vi": "vệ sinh"}, {"w": "sanitation", "p": "n", "vi": "vệ sinh môi trường"}, {"w": "obesity", "p": "n", "vi": "béo phì"}, {"w": "malnutrition", "p": "n", "vi": "suy dinh dưỡng"}, {"w": "wellness", "p": "n", "vi": "sức khoẻ tốt"}, {"w": "ailment", "p": "n", "vi": "bệnh nhẹ"}, {"w": "plump", "p": "adj", "vi": "mũm mĩm"}, {"w": "chubby", "p": "adj", "vi": "mập mạp"}, {"w": "stocky", "p": "adj", "vi": "chắc nịch"}, {"w": "petite", "p": "adj", "vi": "nhỏ nhắn"}, {"w": "unattractive", "p": "adj", "vi": "kém hấp dẫn"}, {"w": "striking", "p": "adj", "vi": "nổi bật"}, {"w": "graceful", "p": "adj", "vi": "duyên dáng"}, {"w": "clumsy", "p": "adj", "vi": "vụng về"}]}, {"id": "W34-4", "title": "The Newsroom in Tokyo", "body": "To earn more money, Minh got a part-time job at an English-language newspaper in Tokyo. It was much bigger than the Gazette. There were a hundred journalists from twenty countries. The newsroom was loud, fast and full of interesting people.\n\nHis new editor was a woman called Yuko. She was **meticulous**: she checked every word, every comma, every fact. She was also very **decisive**. \"Yes. No. Do it again,\" she said, in three seconds. Minh liked her immediately. She reminded him of Grace.\n\nThe other journalists were very different from each other.\n\nThere was Ben, an Australian **extrovert** who talked to everyone all day. He was very **extroverted**, but also **impulsive**: he once flew to Okinawa for a story without telling anyone. There was Aiko, an **introvert** from Osaka, who said almost nothing but wrote beautifully. \"She's **introverted**, but she's not shy,\" Ben explained. \"She just prefers to listen.\"\n\nThere was an old French journalist, Pierre, who was very **eccentric**. He wore a red scarf every day, even in summer, and talked to his plants. He was also the most **passionate** journalist in the office. When he talked about politics, his face went red and his hands flew everywhere.\n\nThere was a young American, Josh, who was very **naive**. He believed everything people told him. \"He's **gullible**,\" said Ben. \"Last week, I told him Mount Fuji was for sale. He tried to write a story about it.\"\n\nThere was a Korean journalist, Min-ji, who was **assertive** and **persistent**. When she wanted an interview, she called every day until the person said yes. \"She's **resilient**,\" said Yuko. \"She's been rejected a thousand times. She never gives up.\"\n\nAnd there was a British man, Rupert, who was **vain**. He looked in the mirror every hour and checked his **hairstyle**. He had a **pierced** ear, a gold earring, and a big smile with a **dimple** in each cheek. \"The **piercing** was a mistake from university,\" he said. \"But I keep it. It's part of my look.\" He was also **temperamental**: happy one minute, angry the next. And **obstinate**: he never admitted he was wrong.\n\nMinh tried to understand everyone. He was naturally **tactful** and diplomatic. When Rupert and Pierre argued about politics, Minh stayed out of it. When Josh made a mistake, Minh helped him fix it quietly. \"You're very **compassionate**,\" said Aiko one day. It was the longest sentence she had ever said to him.\n\nYuko noticed too. \"You're **conscientious**,\" she said. \"And **diligent**. You work hard and you care about getting it right. That's rare.\"\n\n\"Thank you,\" said Minh. \"But I'm also **indecisive**. I take too long to choose.\"\n\n\"Better slow and right than fast and wrong,\" said Yuko. \"Ask Ben.\"\n\nBen, who had once published a story with the wrong country's name, laughed. \"**Spontaneous**,\" he said. \"I'm not wrong. I'm spontaneous.\"\n\nIn the first month, Minh learned a lot. He learned that the Tokyo newspaper worked very differently from the Gazette. Everything was faster. Stories came from the government, from big companies, from all over Asia. He wrote about trade, tourism and culture. But his favourite stories were still the small ones: an old man who had fixed bicycles in the same shop for sixty years, a school with only three students on a small island.\n\nHe also noticed something about his own **posture**. In England, he sat back in his chair. In Japan, everyone sat straight. After a month, he sat straight too. \"You're becoming Japanese,\" said Hana.\n\n\"I'm becoming confused,\" said Minh. \"Too many cultures in one person.\"\n\n\"That's not confusion,\" said Hana. \"That's richness.\"", "words": 597, "new": [{"w": "hairstyle", "p": "n", "vi": "kiểu tóc"}, {"w": "dimple", "p": "n", "vi": "lúm đồng tiền"}, {"w": "pierced", "p": "adj", "vi": "được xỏ lỗ"}, {"w": "piercing", "p": "n", "vi": "lỗ xỏ khuyên"}, {"w": "posture", "p": "n/v", "vi": "tư thế"}, {"w": "assertive", "p": "adj", "vi": "quyết đoán"}, {"w": "compassionate", "p": "adj", "vi": "giàu lòng trắc ẩn"}, {"w": "conscientious", "p": "adj", "vi": "tận tâm"}, {"w": "decisive", "p": "adj", "vi": "quyết đoán (hành động)"}, {"w": "indecisive", "p": "adj", "vi": "thiếu quyết đoán"}, {"w": "diligent", "p": "adj", "vi": "siêng năng"}, {"w": "eccentric", "p": "adj", "vi": "lập dị"}, {"w": "gullible", "p": "adj", "vi": "cả tin"}, {"w": "impulsive", "p": "adj", "vi": "bốc đồng"}, {"w": "introvert", "p": "n", "vi": "người hướng nội"}, {"w": "extrovert", "p": "n/adj", "vi": "người hướng ngoại"}, {"w": "introverted", "p": "adj", "vi": "hướng nội"}, {"w": "extroverted", "p": "adj", "vi": "hướng ngoại"}, {"w": "meticulous", "p": "adj", "vi": "tỉ mỉ"}, {"w": "naive", "p": "adj", "vi": "ngây thơ"}, {"w": "obstinate", "p": "adj", "vi": "ngoan cố"}, {"w": "passionate", "p": "adj", "vi": "đam mê"}, {"w": "persistent", "p": "adj", "vi": "kiên trì"}, {"w": "resilient", "p": "adj", "vi": "kiên cường"}, {"w": "spontaneous", "p": "adj", "vi": "tự phát"}, {"w": "tactful", "p": "adj", "vi": "tế nhị"}, {"w": "temperamental", "p": "adj", "vi":
