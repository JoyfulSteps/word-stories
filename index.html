audio, cutting long silences but keeping the laughter. Sometimes, in the surrounding quiet of the studio, late at night, he thought about whether he should quit. Then a letter would come from an unknown listener, and he would keep going.\n\nMinh was surprised by the success. Successfully making a podcast, he decided, depends on one thing: being honest. He thought about his first week in England, when he felt **naked** and lost, with no words. Now he had a microphone and a whole town listening.\n\nThe next week, they recorded a live episode in the old town hall, a building with beautiful architecture and wooden walls the colour of honey, with visitors in the audience. People were attached to the show now. Afterwards, at closing time, Minh walked home by the river. The lights of the town were burning gold on the water. It was a beautiful sight.", "words": 1097, "new": [{"w": "marine", "p": "adj/n", "vi": "thuộc biển"}, {"w": "gang", "p": "n", "vi": "băng nhóm"}, {"w": "angel", "p": "n", "vi": "thiên thần"}, {"w": "naked", "p": "adj", "vi": "trần truồng"}]}, {"id": "W44-1", "title": "Riverford Talks, Episode 4: What We Remember", "body": "Minh: Welcome to Riverford Talks. Today's episode is about a difficult subject. In the market square, there's a statue of a man on a horse. For years, nobody knew who he was. Last month, a historian found out. My guests are that historian, Dr. Helen Ward, back again, and Dr. Kwame Mensah, a professor of **psychology** who studies how communities remember the past. Welcome.\n\nHelen: Thank you.\n\nKwame: Glad to be here.\n\nMinh: Helen, who is the man on the horse?\n\nHelen: His name was Sir Edward Blake. He lived in the 1700s. He was a rich merchant, and he gave the town a lot of money: the school, the church roof, the first bridge. That's why they made the statue. But I found documents that show where his money came from. He owned ships that carried enslaved Africans to the Caribbean. He was a **slave** trader.\n\nMinh: That must have been a shock.\n\nHelen: It was. I was digging through old papers in the library for months. I found his business records, his letters, the passage of every ship. It's all there. Hundreds of people, sold like a **possession**.\n\nMinh: How has the town reacted?\n\nHelen: Strongly. The Gazette did a poll. About half the people want the statue removed. The other half want it to stay, with a sign explaining the history. Critics on both sides are very angry.\n\nMinh: Kwame, why is this so emotional?\n\nKwame: Because history is not only about the past. It's about identity. When people learn something terrible about a hero, it threatens their sense of who they are. That's a psychological reaction. People feel attacked. Some deny it. Some feel guilty. Some feel angry.\n\nMinh: How should a town handle something like this?\n\nKwame: Carefully. With honesty, and with input from everyone. Especially the people whose ancestors were hurt. In Riverford, there are families whose great-great-grandparents came from Africa or the Caribbean. Their voices matter most.\n\nMinh: Some people say: why judge people from the past by today's rules?\n\nHelen: I understand that argument. But even in the 1700s, many people knew slavery was wrong. There were protests in England. So it's not just modern rules. It was wrong then too.\n\nKwame: And remembering is not the same as punishing. We can't punish Sir Edward. He's dead. But we can choose who we celebrate. A statue says: this person is a hero. Is he?\n\nMinh: What would you do with the statue?\n\nHelen: Personally, I'd move it to a museum, with the full story. Then put something new in the square. Maybe a statue of someone the whole town can be proud of.\n\nKwame: I'd ask the community. Gather people together. Let them talk. The **ruling** should come from the people, not from a council meeting.\n\nMinh: Let's talk about something wider. Kwame, how does memory work in a community?\n\nKwame: It's a fascinating area. Communities remember selectively. We keep the stories that make us look good. We forget the ones that don't. It's commonly called \"collective memory.\" But forgetting has a cost. The truth always comes back, often at a bad timing. Like now.\n\nMinh: Can a town overcome a painful history?\n\nKwame: Yes. It's possible to **relate** to the past without being destroyed by it. Germany is an example. After the war, Germans had to examine their history honestly. It took decades. But it made the country stronger. A full examination of the past brings unity.\n\nMinh: Last question. What can ordinary people do?\n\nHelen: Learn. Read the history. Come to the library. I'm giving free talks every Saturday.\n\nKwame: Listen. Especially to people whose experience is different from yours. Don't let your **favour** for a familiar story stop you from hearing a new one.\n\nMinh: Helen and Kwame, thank you.\n\nAfter the episode, the town decided to hold a public meeting. It was **occupied** by more than five hundred people, the biggest meeting in Riverford's history. People shared their stories. An elderly woman, whose daddy had come from Jamaica in the 1950s, spoke about growing up in Riverford. \"We helped rebuild this country after the war,\" she said. \"But nobody ever made a statue of us.\"\n\nIn the end, the council voted to move Sir Edward's statue to the museum. In its place, they planned a new statue: a woman holding a child, looking at the river. It would represent everyone who came to Riverford looking for **shelter** and a better life. The poll showed that sixty percent of viewers of the local TV news agreed.\n\nThe episode was the most commented on Minh had ever made. Some listeners were angry. One said Minh was a foreigner and had no right to talk about British history. Minh answered calmly in his next episode: \"I'm an immigrant. So are many people in this town. History belongs to everyone who lives with it.\"\n\nGrace said it was the bravest thing the Gazette had published in years. Minh didn't feel brave. He felt like he had done his job.\n\nHana noticed something. Minh had slept badly all week. \"You care a lot,\" she said. \"That's your strength and your weakness.\"\n\n\"I know,\" said Minh. \"I'm learning to handle it.\"\n\nThe pace of the debate was fast and hard, but Minh kept a log of every message. He began to realise how much the town cared. Some colleagues said he should take a break; he preferred to keep going. \"I'm learning about handling difficult stories,\" he told Hana.\n\nSmall, good things happened too. An elementary school invited him to give an **oral** history talk. A telephone operator called to say his grandmother had been one of the first immigrants in Riverford. A local **manufacturer** offered free benches for the new square, and the arrangement was made in a day. A historical **sword**-fighting club offered to perform at the unveiling; Minh politely suggested that swords were not the right message. A quiet man **slipped** a note under the Gazette's door: his family had worked on Sir Edward's ships, and he wanted to help. Even a spy novelist from the next village wrote: \"Better plot than my books.\"\n\nThe restrictions on public events were relaxed for the unveiling. Minh felt a swing in people's thinking, from the outer edges of the town to its center. Ease would come later. \"A town's survival depends on honest stories,\" he wrote in his notebook. \"Its destruction comes from lies. These are the characteristics of a good community: listen, learn, don't be afraid of the truth. Feeding people the truth is harder than feeding them nice stories, but greatly more important. Nobody's lifestyle is threatened by a new statue.\" The usage of the word \"we\" was changing in Riverford. More people meant everyone when they said it. At the school, the children asked him to submit his own story to their class book. He did.", "words": 1146, "new": [{"w": "possession", "p": "n", "vi": "tài sản"}, {"w": "sword", "p": "n", "vi": "thanh kiếm"}, {"w": "occupied", "p": "adj", "vi": "đã có người"}, {"w": "favour", "p": "n/v", "vi": "ân huệ"}, {"w": "psychology", "p": "n", "vi": "tâm lý học"}, {"w": "slave", "p": "n/v", "vi": "nô lệ"}, {"w": "ruling", "p": "n/adj", "vi": "phán quyết"}, {"w": "slip", "p": "v/n", "vi": "trượt chân"}, {"w": "oral", "p": "adj/n", "vi": "bằng miệng"}, {"w": "shelter", "p": "n/v", "vi": "nơi trú ẩn"}, {"w": "relate", "p": "v", "vi": "đồng cảm"}, {"w": "manufacturer", "p": "n", "vi": "nhà sản xuất"}]}, {"id": "W44-2", "title": "Riverford Talks, Episode 5: Children and Screens", "body": "Minh: Welcome to Riverford Talks. This week: children and technology. How much screen time is too much? My guests are Lan Nguyen, my sister, who is training to be a teacher in Tokyo and is visiting England, and Mark Davis, a father of three and an instructor at the local swimming pool. Welcome.\n\nLan: Thank you, brother. Hello, everyone.\n\nMark: Hi.\n\nMinh: Mark, let's start with you. How much time do your children spend on screens?\n\nMark: Too much. My three kids are siblings, but they're totally different. My oldest, who's fourteen, is on his phone all day. My middle one plays video games. My youngest watches cartoons. It's disappointing, honestly. When I was a kid, I played outside all day.\n\nMinh: Have you tried to limit it?\n\nMark: I've tried everything. Rules, timers, taking the electronics away. They resist. They argue. It's a constant negotiation. Actually, it's like real **negotiations**: I offer one hour, they ask for three, we agree on two.\n\nLan: That's very normal. In my training, we learn that children need clear limits, but also reasons. If you just say \"no,\" they fight back. If you explain why, they're more motivated to follow the rules.\n\nMinh: Lan, what does the research say?\n\nLan: It's mixed. Some screen time is fine, even good. Educational apps can help with mathematics and reading. My students love a mathematical game where they solve problems to find hidden treasure. But too much is bad. It affects sleep, attention and mood. Children who spend all day indoors miss exercise and friends.\n\nMark: My son says his friends are online. He talks to them all the time.\n\nLan: That's true for many kids. But online friendship is partial. It's not a substitute for real friendship. Children need to see faces, play together, share space.\n\nMinh: Mark, you teach swimming. Do you notice changes in children?\n\nMark: Yes. Kids are less fit. Some are **severely** unfit. They get tired quickly. Their motor skills are weaker. And some are scared of new things: water, heights, getting dirty. I think it's because they spend so much time in safe, indoor places.\n\nLan: There's research on that too. Children need some risk. Climbing trees, exploring, falling down and getting up. It builds confidence.\n\nMinh: What about food? Do screens affect how children eat?\n\nMark: Definitely. My kids eat in front of the TV. They don't notice how much they eat. Snacks, crisps, sweets. Too many calories. And the adverts on screen are always for unhealthy food, full of sugar and unnecessary **ingredients**. Even cheese in a **spray** can! And they're **resistant** to anything green.\n\nLan: Advertising to children is a big issue. Some countries have strict rules. In some places, adverts for unhealthy food are banned before nine p.m.\n\nMinh: Do you think we're too worried? Every generation complains about new technology.\n\nLan: That's a good point. When books became popular, people worried that children read too much. When television arrived, the same. Maybe we're repeating history backwards.\n\nMark: Maybe. But this feels different. Phones are always with us. You can't turn them off.\n\nMinh: Practical advice for parents. What would you say?\n\nLan: Be a good example. If parents are on their phones all the time, children will copy. Create phone-free times: meals, bedtime. And go outside together.\n\nMark: I'd say: don't feel guilty. Every parent struggles. Do your best. And get your kids into a sport. It doesn't matter which one.\n\nMinh: Lan and Mark, thank you.\n\nAfter the recording, Lan stayed in Riverford for a week. She had never been there before. She was travelling around Britain during her university holiday, and Riverford was her first stop. Minh showed her everything: the Parkers' house, The Blue Cup, the river, the castle.\n\nLan met Grandma Rose, who was delighted. \"Finally! Minh's sister! The famous Lan who wrote on his T-shirt!\" Lan laughed so much she almost cried.\n\nThe episode got a lot of publicity. It was shared nationwide. A big electronics company asked to sponsor the next episode. Grace firmly said no. \"We don't take money from the people we report on,\" she said. \"Not even indirect money.\"\n\nOne listener sent an interesting **clue** about the history episode: a box of old papers in her loft that mentioned Sir Edward's tobacco and sugar trade, and the **slavery** behind it. Helen Ward was excited. \"This is a treasure,\" she said. \"**Partially** burned, but readable.\" It confirmed what she had found. She sent a confirmation to the council.\n\nAnother listener, a dairy farmer from the **coastal** villages, wrote that he had invented a game for his children: one hour of screens for one hour of helping on the farm. \"Mixing work and play,\" he wrote. \"My kids hate it. But they're fit.\"\n\nLan said the episode taught her something too. \"In Vietnam, parents are very strict about studying but not about screens,\" she said. \"Maybe I'll write my thesis about this.\"\n\n\"You should,\" said Minh.\n\nThere was one more **revised** plan. Hana, who had listened, suggested a follow-up about sleep. \"Doctors are worried,\" she said. \"Children aren't sleeping enough. Phone light at night is a big problem. Separation from the phone at bedtime is essential.\" She sent a curve chart showing sleep hours falling over ten years.\n\nMinh added it to his list. The list was getting long. There were so many questions. That was a good problem to have, Grace said. A provider of good questions would never be out of work.\n\nEven the pricing of the Gazette's membership changed: more buyers, so a lower price. And a visitor from London, a defender of free podcasts, came to argue that nobody should pay for news. They had a good debate on the next episode. The instruction from Grace was simple: let him talk, then ask good questions. Minh did. The man left with a membership card. He was not mentally prepared to lose that argument, he said, but he was glad he did. Medication for a bad mood, he joked, was a good conversation.\n\nOn his last day, Lan stood on the bridge and watched the sun **shine** on the river. \"I understand now,\" she said. \"Why you love this place.\"\n\n\"Why?\"\n\n\"Because it's small enough to know everyone, and big enough to surprise you.\"\n\nThe limitations of a small town, Minh thought, were also its gifts. And the excitement of exploration was not only in far places. Sometimes, it was at home.", "words": 1078, "new": [{"w": "negotiations", "p": "n", "vi": "cuộc đàm phán"}, {"w": "slavery", "p": "n", "vi": "chế độ nô lệ"}, {"w": "coastal", "p": "adj", "vi": "ven biển"}, {"w": "partially", "p": "adv", "vi": "một phần"}, {"w": "clue", "p": "n/v", "vi": "manh mối"}, {"w": "spray", "p": "n/v", "vi": "xịt"}, {"w": "shine", "p": "v/n", "vi": "chiếu sáng"}, {"w": "ingredients", "p": "n", "vi": "nguyên liệu"}, {"w": "revised", "p": "adj", "vi": "đã chỉnh sửa"}, {"w": "severely", "p": "adv", "vi": "nghiêm trọng"}, {"w": "resistant", "p": "adj", "vi": "có khả năng chống chịu"}]}, {"id": "W44-3", "title": "Riverford Talks, Episode 6: Fakes and Treasures", "body": "Minh: Welcome to Riverford Talks. Today, something different: fakes and treasures. My guests are Dr. Sophie Clarke, a historian and expert in underwater archaeology, and Detective Inspector Shah from Riverford police, who investigates art and antique crime. Welcome.\n\nSophie: Thanks for having me.\n\nInspector Shah: Hello again, Minh.\n\nMinh: Sophie, you study things under the sea. Tell us about your work.\n\nSophie: I'm an underwater archaeologist. I study shipwrecks: ships that sank hundreds or thousands of years ago. We use special equipment, sometimes a small **submarine**, to find them and study them. We do mapping of the sea floor. The ocean is the biggest museum in the world. Most of **mankind**'s history at sea is still down there.\n\nMinh: What's the most exciting thing you've found?\n\nSophie: A Roman ship off the coast of Italy. It was carrying wine, olive oil and glass. Two thousand years old. And on the same dive, we found what looked like a **tomb**: a stone box with gold jewelry inside. Probably a rich woman's things. It was remarkably well preserved.\n\nMinh: What happens to the things you find?\n\nSophie: They go to museums. That's the law. But there's a big problem: thieves. Some people dive to old wrecks and take things illegally. Then they sell them to a collector for a lot of money.\n\nMinh: Inspector Shah, is this a problem in Britain?\n\nInspector Shah: Absolutely. Not just underwater. Antiques, paintings, coins. There's a huge illegal market. And now there's a new problem: fakes. People make copies of old objects and sell them as real.\n\nMinh: How do they do it?\n\nInspector Shah: It's very clever. Some fakers are artists. They use old materials: old wood, old **textile**, old paper. They make things look old with chemicals. Some even copy a famous maker's **trademark** perfectly. It can take an expert weeks to tell the difference.\n\nSophie: I once saw a \"Viking sword\" that was made in a garage in 2015. It was beautiful. It was also completely fake.\n\nMinh: How do you catch them?\n\nInspector Shah: Science, mostly. We test the materials. Paperwork too: real antiques have a history. Who owned them, where they were bought. Fakes usually have no history, or a fake one. And now there's a cyber side: fakes are sold online. Scam websites, fake auctions. People send money and receive nothing, or a fake.\n\nMinh: Have you had cases in Riverford?\n\nInspector Shah: Last year, an old man in the town was sold a \"Roman coin\" for five thousand pounds. It was worth five pence. The seller disappeared. We traced him through his phone notifications and bank records. He's in prison now.\n\nMinh: How can ordinary people protect themselves?\n\nInspector Shah: If something seems too good to be true, it probably is. Get an expert to look. And never buy from someone who pressures you to decide quickly.\n\nSophie: And ask where it came from. A real object has a story.\n\nMinh: Sophie, why does all this matter? Why should ordinary people care about old pots and coins?\n\nSophie: Because they tell us who we are. Every object is a message from the past. When thieves take something, or fakers make a false one, they steal history from all of us. That's unacceptable.\n\nMinh: Some people say archaeology is **pointless**. Just old things.\n\nSophie: I understand. But imagine if someone took all your family photos and sold them. That's what happens when history disappears. It's a kind of disappearance of memory.\n\nMinh: Last question. What's your dream discovery?\n\nSophie: A ship from the Bronze Age, untouched, with its whole cargo. That would change everything we know.\n\nInspector Shah: Mine is simpler. One year with no art crime in Riverford.\n\nMinh: Sophie and Inspector Shah, thank you.\n\nAfter the recording, Inspector Shah stayed for a coffee at The Blue Cup. She told Minh something interesting. \"The fake Roman coin case had a strange ending,\" she said. \"The old man who bought it wasn't angry. He said the coin made him happy for a month. He kept it. He calls it his memorable mistake.\"\n\nMinh laughed. \"That's a good **humour**.\"\n\n\"He's a good man,\" said Inspector Shah. \"**Overly** trusting. But good.\"\n\nMinh also met Sophie's partner, a historian of old maps, and an observer from the local museum who wanted to rebuild an old shipwreck exhibition. The museum was in a portable building next to the castle while the old one was being repaired. Builders would **occupy** the old building for a year. \"It's not ideal,\" said the observer. \"But visitors still come. It's surprisingly enjoyable.\"\n\nThe episode was popular with children. A school asked Sophie to give a talk. She brought a model submarine and an underwater camera. The children were amazed. One boy said he wanted to be an underwater archaeologist \"or a pirate.\" Sophie said both were fine.\n\nHana listened to the episode at home. \"I didn't know there were so many fakes,\" she said.\n\n\"Neither did I,\" said Minh. \"It makes you think. How much of what we see is real?\"\n\n\"Our wedding was real,\" said Hana. \"Three times.\"\n\nMinh laughed. There was no **jealousy** in his heart, no sadness; only a quiet happiness. The surroundings of their new home, a small flat above the bakery, were simple, but they were theirs. They lived in a quiet neighbourhood at the top of a **steep** street. They had a **shuttle** bus to the hospital for Hana, a short walk to the studio for Minh. Their newborn plants on the windowsill were growing.\n\nLife had remained unchanged for a while, comfortably so. The pros were many. The cons, few: the bakery smell at five in the morning, and the borrowing of their sugar by the neighbors. Everything was noticeable, every small detail. Minh had a meditation app, but he didn't need it. He had the river.\n\nHe also noticed a module about local history being added to the school curriculum. It was unclear if the podcast had caused it. But Helen Ward said, with a wink, that it might have. \"Geographic and historical knowledge, united at last,\" she said. \"Even if only in one small town.\" She told Minh she was going to manufacture a series of history cards for children, with stories from the podcast. It was not a big business. But it was a start.\n\nIn the salon next door, the hairdresser
