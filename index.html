"}, {"w": "celebrity", "p": "n", "vi": "người nổi tiếng"}, {"w": "broadcast", "p": "v/n/adj", "vi": "phát sóng"}, {"w": "rob", "p": "v/n", "vi": "cướp"}]}, {"id": "W15-2", "title": "The Charity Run", "body": "In July, the college organized a big **charity** event: a sports day and a run around the town. All the money went to a local hospital for children. Everyone in the community was invited. Many students wanted to volunteer.\n\n\"I'm going to run,\" said Minh. \"Five kilometers.\"\n\n\"You?\" said Leo. \"You get tired walking up the stairs.\"\n\n\"I've been jogging every morning for a month,\" said Minh. \"I'm ready.\"\n\nBefore the run, there was a big sports festival in the park. It was like a small Olympics. There were tables for every sport and every club. Minh walked around with Sam and saw everything.\n\nAt one table, students were playing badminton. At another, there was golf, with a small hole in the grass. There was **hockey**, with sticks and a small ball, and **rugby**, which looked like American football without helmets. \"Rugby players are crazy,\" said Sam. \"Very strong, very crazy.\"\n\nThere was also **cricket**. An old man explained the rules to Minh for twenty minutes. Minh understood nothing. \"Don't worry,\" said the man. \"Nobody understands cricket. Even the English. We just like the tea breaks.\"\n\nThere was a **boxing** ring, with a sign that said \"No real fighting!\" There was a **cycling** club, a **skating** club, a **surfing** club (without a sea) and a climbing wall. A group of women were doing **yoga** on the grass, very slowly and calmly. Next to them, some children were doing **karate** and **judo**, shouting very loudly. A girl from the **gymnastics** club did a flip in the air.\n\nThe skiing and diving clubs had videos only. \"We don't have snow or a deep pool,\" said a student. \"So we just show you how fun it is.\"\n\nThere was even a fishing club by the river, and a man selling tickets for an athletics competition in August. \"Next year, you can run a marathon,\" he said to Minh. Minh laughed.\n\nAt the end of the path, there was a small **protest**. About twenty people stood with signs. \"Save our park!\" they shouted. The council wanted to build houses here. \"The park is public, not private!\" said one woman. \"We are citizens! We vote! At the next election, we will remember this!\" Some people stopped to listen. Others walked past.\n\n\"In England, people protest about everything,\" said Sam. \"In Spain too. It's healthy.\"\n\n\"In Vietnam, it's different,\" said Minh. He didn't say more.\n\nAt noon, the run started. Two hundred people stood at the starting line, under a big flag. Some wore funny clothes. One man was dressed like a king, another like a soldier from an old war, and a woman was dressed as a giant banana. There was a national champion from the army running too, and a local woman who won a championship last year.\n\nMinh started too fast. After two kilometers, he was tired. After three, his legs hurt. After four, he wanted to stop. But people along the road shouted, \"Come on! You can do it!\" Mia and Leo were there, holding a sign: \"Go Minh! Don't die!\"\n\nHe did not stop. He finished in thirty-five minutes. He was number 154 out of 200. \"I didn't compete to win,\" he said, falling on the grass. \"I competed to finish.\"\n\n\"You were faster than the banana,\" said Leo. \"That's something.\"\n\nThe charity made five thousand pounds for the children's hospital. There were people from many nations: international students, families, old people, children. For one day, the whole town was one community. Even the people at the protest came to the finish line to clap. The police watched for safety, but there was no danger. It was a day of peace and fun, and nobody needed to go to jail, not even the man dressed as a robber.", "words": 625, "new": [{"w": "protest", "p": "n/v", "vi": "cuộc biểu tình"}, {"w": "charity", "p": "n", "vi": "tổ chức từ thiện"}, {"w": "hockey", "p": "n", "vi": "khúc côn cầu"}, {"w": "rugby", "p": "n", "vi": "bóng bầu dục"}, {"w": "cricket", "p": "n", "vi": "môn cricket; con dế"}, {"w": "boxing", "p": "n", "vi": "quyền anh"}, {"w": "cycling", "p": "n", "vi": "đạp xe"}, {"w": "skating", "p": "n", "vi": "trượt băng"}, {"w": "surfing", "p": "n", "vi": "lướt sóng"}, {"w": "yoga", "p": "n", "vi": "yoga"}, {"w": "karate", "p": "n", "vi": "võ karate"}, {"w": "judo", "p": "n", "vi": "võ judo"}, {"w": "gymnastics", "p": "n", "vi": "thể dục dụng cụ"}]}, {"id": "W15-3", "title": "The Final", "body": "Leo's football team was in the final of the summer **tournament**. It was the biggest match of the year. If they won, each player got a gold **medal**, and the team got a big cup.\n\nThe whole family came to watch. Even Grandma Rose came, with a blanket and a flask of tea. \"I've been a supporter of this team for seventy years,\" she said. \"I watched Tom play here when he was a boy. He was terrible.\"\n\nThe **pitch** was green and wet after the rain. Next to it, there was a tennis court and a running track. Some children were playing tennis with old **rackets** and a broken net. The two teams came out. The **referee** blew his whistle. The game started.\n\nLeo's **trainer**, Mr. Hughes, was a tall man with a loud voice. \"Run, Leo! Run!\" he shouted. Leo ran. He was fast and sporty. After his accident earlier in the year, he had done a lot of training and fitness work. His leg was strong again.\n\nThe other team was very good. At half time, Leo's team was losing one-nil. In the changing room, Mr. Hughes talked to the players. \"Don't be losers,\" he said. \"I don't care if we lose. I care if we give up. Play for your teammates. Play for each other.\"\n\nIn the second half, Leo's team played better. After sixty minutes, Leo got the ball. He ran past two players and kicked it hard. Goal! The supporters went crazy. Grandma Rose stood up and shouted, \"That's my grandson!\" She dropped her tea.\n\nFive minutes before the end, the other team scored again. Two-one. Leo's head went down. But in the last minute, his best friend, Jamal, scored with his head. Two-two!\n\nThen there were penalties. Leo was the last player. If he scored, his team would win. If he missed, they would lose. He stood in front of the ball. Behind the goal, a little boy on a bike, in a big blue helmet, held his breath. Everyone was quiet. Mia closed her eyes. Leo ran and kicked.\n\nGoal!\n\n\"We beat them!\" Leo shouted. \"We're the winners!\" The whole team jumped on him. The referee laughed. Tom hugged Anna. Minh shouted so loudly that he lost his voice.\n\nThat evening, there was a party at the football club. Leo showed everyone his medal. He wore it all night, even in bed. \"I'm going to keep it forever,\" he said. \"It's the start of my collection. I'm going to collect a medal every year.\"\n\nAt the party, Minh talked to Mr. Hughes. \"What do you do in your **spare** time?\" Minh asked. \"Football too?\"\n\n\"No!\" Mr. Hughes laughed. \"In my **leisure** time, I do **sewing** and **knitting**. My wife taught me. It's very **relaxing**. After shouting at boys all week, I need something quiet.\"\n\nMinh was surprised. In England, people had a lot of hobbies. Grandma Rose liked gardening, chess and playing cards. Anna liked painting and drawing. Tom liked photography and cooking, especially **baking** bread on Sundays. Mia liked dancing and singing. Leo liked football and, more and more, hiking and walking in the hills.\n\n\"What about you?\" Mr. Hughes asked. \"What are your interests?\"\n\n\"I don't know,\" said Minh. \"I study and work. I don't have much time for any activity.\"\n\n\"You need an **interest** outside work,\" said Mr. Hughes. \"Something for you. Join a club. Collect something. Life is more **exciting** with a hobby.\"\n\nThe next week, Minh got an invitation from Sam. \"Come to my photography club. We walk around town and take pictures.\" Minh decided to go to the next meeting. Then, maybe, a cooking club. Or chess with Grandma Rose. He would invite her to teach him.\n\nLeo's medal stayed on the kitchen wall for a long time. Every time Minh saw it, he remembered the final, the rain, the tea on the grass and Grandma Rose shouting, \"That's my grandson!\"", "words": 655, "new": [{"w": "tournament", "p": "n", "vi": "giải đấu"}, {"w": "medal", "p": "n", "vi": "huy chương"}, {"w": "trainer", "p": "n", "vi": "huấn luyện viên"}, {"w": "referee", "p": "n/v", "vi": "trọng tài"}, {"w": "pitch", "p": "n", "vi": "sân thi đấu"}, {"w": "racket", "p": "n", "vi": "vợt"}, {"w": "sewing", "p": "n", "vi": "may vá"}, {"w": "knitting", "p": "n", "vi": "đan len"}, {"w": "baking", "p": "n", "vi": "làm bánh"}, {"w": "leisure", "p": "n", "vi": "thời gian rảnh"}, {"w": "spare", "p": "adj/v/n", "vi": "dự phòng"}, {"w": "interest", "p": "n/v", "vi": "sự quan tâm"}, {"w": "relaxing", "p": "adj", "vi": "thư giãn"}, {"w": "exciting", "p": "adj", "vi": "hấp dẫn, sôi động"}]}, {"id": "W16-1", "title": "The Arts Festival", "body": "Every August, Riverford had an arts festival. For one week, the whole town was full of music, art and entertainment. There were shows in the streets, in the park and in every café. \"This is the best week of the year,\" said Mia. \"Everybody comes out.\"\n\nOn the first day, a **circus** came to the park. It was a small circus, with no animals, only people. There were jugglers, a man on a high rope and a **magician** who did magic tricks with cards. He took a coin from Leo's ear. Leo checked his ear for ten minutes. \"How did he do it?\" he asked. \"That's not a joke. That's real magic.\"\n\nGrandma Rose laughed. \"It's for **amusement**, Leo. Don't think too much.\"\n\nIn the evening, there was music everywhere. On the main stage, there was an **orchestra** playing classical music. In the cathedral, a **choir** sang old songs. In a pub, a man played **folk** music on a violin and a woman played the **flute**. At The Blue Cup, Daniel played guitar with his band: a drummer, a man on **saxophone** and a young woman on **trumpet**. They played jazz and pop, and some old songs from Daniel's favourite album. Minh worked all night, carrying cups and cakes.\n\n\"I love this tune,\" said Jess, Minh's colleague. \"The **melody** is so beautiful.\"\n\n\"I like the **rhythm**,\" said Minh. \"It makes me want to dance. But I can't dance.\"\n\nAt the end of the night, a group of young people did rap on the street. Minh did not understand the lyrics. They were too fast.\n\nThe next day, Mia had big news. There was an art **exhibition** at the town gallery, and one of her paintings was in it. It was a portrait of Grandma Rose. \"She looks like a queen,\" said Tom, proudly. Next to it, there was a landscape of the hills in Wales and a strange **sculpture** made of old bicycles. There was also a room of black and white photographs. Each photograph showed a face from Riverford.\n\nIn the evening, the theater showed different films. There was a **horror** film, a thriller, a **romance** and a comedy. There was also an animation for children. Mia and her friends wanted to see the horror film. Leo wanted the comedy. Anna and Tom chose the romantic film. \"Of course,\" said Leo.\n\nAfter the film, Anna met the director and the producer. \"I loved the last scene,\" Anna said. \"The main character was wonderful. Who played the role?\" The director pointed to a young actress, who smiled and said thank you.\n\nOn the last night, there was a big performance on the stage in the square: a little ballet, a little opera and songs from a famous musical. Everyone with a talent could perform. A boy did a magic show. A girl sang. An old man read a poem.\n\nMinh did not perform, but he went to a poetry evening at the library. The librarian, Mrs. Green, organized it. A local author read from her new novel. A poet read a sad poem about the river. \"Poetry is like music without instruments,\" the poet said.\n\nAfterwards, Mrs. Green talked to Minh. \"You're the boy from Vietnam who reads a lot,\" she said. \"Are you writing anything?\"\n\n\"I'm trying,\" Minh said. \"Just short stories. But my grammar is not good. And my vocabulary is small. And my spelling...\"\n\n\"Don't worry about grammar,\" she said. \"Every writer makes mistakes. Write one sentence. Then write a paragraph. Then a chapter. One day, you'll have a book with your name on the title page.\"\n\n\"Fiction? About what?\"\n\n\"About whatever you know. About a boy who comes to a small English town. About his pronunciation problems and his funny English family.\" She smiled. \"It sounds like a good story to me.\"\n\nMinh thought about that all the way home. A book. His book. Why not?", "words": 650, "new": [{"w": "circus", "p": "n", "vi": "rạp xiếc"}, {"w": "amusement", "p": "n", "vi": "sự thích thú"}, {"w": "magician", "p": "n", "vi": "ảo thuật gia"}, {"w": "flute", "p": "n", "vi": "sáo"}, {"w": "trumpet", "p": "n", "vi": "kèn trumpet"}, {"w": "saxophone", "p": "n", "vi": "kèn saxophone"}, {"w": "orchestra", "p": "n", "vi": "dàn nhạc"}, {"w": "choir", "p": "n", "vi": "dàn hợp xướng"}, {"w": "folk", "p": "n/adj", "vi": "dân gian"}, {"w": "melody", "p": "n", "vi": "giai điệu"}, {"w": "rhythm", "p": "n", "vi": "nhịp điệu"}, {"w": "sculpture", "p": "n", "vi": "điêu khắc / tác phẩm điêu khắc"}, {"w": "exhibition", "p": "n", "vi": "triển lãm"}, {"w": "horror", "p": "n/adj", "vi": "kinh dị"}, {"w": "romance", "p": "n/v/adj", "vi": "chuyện tình lãng mạn"}]}, {"id": "W16-2", "title": "International Night", "body": "In September, the start of Minh's second year, the college held an International Night. Students from every country showed their culture, their food and their traditions. \"Minh, you must do a table for Vietnam,\" said his teacher. \"Wear something traditional.\"\n\nMinh asked his mother to send him an áo dài, the long Vietnamese **costume** for special days, and some red paper **lanterns**. \"In Vietnam, we celebrate the Mid-Autumn Festival with lanterns,\" he explained to the people at his table. \"Children walk in a **parade** in the street at night, with lanterns of every color. It is a beautiful custom.\"\n\nThe hall was full of tables, flags, balloons and decorations. Students decorated their tables with pictures, food and music. It was like a **carnival**. Sam, as the host for the night, walked around with a microphone.\n\nAt the next table, a Scottish student named Callum wore a kilt. \"**Scotland** is not England,\" he said seriously. \"Don't call me English. My **nationality** is British, but I'm **Scottish** first.\" Next to him was a girl from **Ireland**. She talked about St. Patrick's Day and green clothes.\n\nAn American student, Jake, talked about **Halloween**. \"In October, children wear a **costume** and a mask and go from house to house asking for sweets.\" Then he talked about **Thanksgiving**. \"In November, the whole family eats a big dinner with turkey. We say thank you for everything.\" Tom came that evening and stood at Jake's table for an hour, eating pumpkin pie and talking about home.\n\nA French girl talked about **Valentine**'s Day in Paris. \"It's very romantic,\" she said. \"In my opinion, the most romantic day of the year.\" Leo, who was with Tom, said, \"It's the most boring day of the year.\" The French girl gave him a chocolate heart. He ate it immediately.\n\nThere was a table about religion too. A **Muslim** student from Pakistan told people about Ramadan and showed them a beautiful **prayer** mat. A **Buddhist** student from Thailand explained how people pray in the temples and give food to the monks. A **Christian** student from Nigeria talked about Christmas and Easter in her country. \"In every religion, there are **holy** days,\" the teacher said. \"Different gods, different ceremonies, but the same hope for peace.\"\n\nThere was even a wedding **ceremony** from India, acted by the students, with music and beautiful clothes. Everybody clapped.\n\nMinh's table was very popular. Next to it, a student who worked as a translator had a table about languages. \"Translation is not just changing words,\" she said. \"You must understand the meaning. Every language has a different way to describe the world.\" She had a pile of books: a biography of a famous Vietnamese poet, an autobiography of a Japanese chef, and a novel with a beautiful cover that she helped publish in English. Minh had a long conversation with her about his own accent. They wanted to discuss more, so they agreed to meet for a longer discussion and a description of her job next week. People loved the lanterns and the spring rolls. Many people asked him questions about **Asia**. \"Is Vietnam near China?\" \"Do people eat with chopsticks?\" \"Is it hot all year?\" An old man asked, \"Is it true that **Asian** students study more than **European** students?\"\n\n\"I don't know,\" Minh laughed. \"Maybe. But European students have more fun.\"\n\nSome students talked about **Africa**. A Kenyan girl said, \"People think **Africa** is one country. It's not! It has more than fifty countries. Every **African** country is different.\" Minh thought it was the same for Asia. People often thought **Europe** was the center of the world, too.\n\nAt the end of the night, there was a big celebration. The students from every country went outside. They lit their lanterns and walked together by the river. Then there were fireworks over the castle, red, green, gold and silver. Everybody watched the firework show together.\n\n\"This is like a family,\" said Sam. \"All these countries, one night.\"\n\nMinh looked at the lanterns on the water. He thought of his mother. He sent her a photo. \"Happy Mid-Autumn, Mum,\" he wrote. \"I'm wearing the áo dài.\" It was nearly their anniversary of his leaving home: one year since he left Vietnam. Was he a guest here now, or a resident? He did not know. Maybe both.\n\nHis mother replied: \"You look handsome. But you need to eat more.\"", "words": 733, "new": [{"w": "ceremony", "p": "n", "vi": "buổi lễ"}, {"w": "carnival", "p": "n", "vi": "lễ hội đường phố"}, {"w": "parade", "p": "n/v", "vi": "cuộc diễu hành"}, {"w": "costume", "p": "n", "vi": "trang phục hoá trang"}, {"w": "Halloween", "p": "n", "vi": "lễ Halloween"}, {"w": "Thanksgiving", "p": "n", "vi": "lễ Tạ ơn"}, {"w": "Valentine", "p": "n", "vi": "người yêu ngày Valentine"}, {"w": "prayer", "p": "n", "vi": "lời cầu nguyện"}, {"w": "holy", "p": "adj", "vi": "thiêng liêng"}, {"w": "Christian", "p": "adj/n", "vi": "người theo đạo Thiên Chúa"}, {"w": "Buddhist", "p": "adj/n", "vi": "Phật tử"}, {"w": "Muslim", "p": "adj/n", "vi": "người Hồi giáo"}, {"w": "lantern", "p": "n", "vi": "đèn lồng"}, {"w": "nationality", "p": "n", "vi": "quốc tịch"}, {"w": "Asia", "p": "n", "vi": "châu Á"}, {"w": "Asian", "p": "adj/n", "vi": "người châu Á"}, {"w": "Europe", "p": "n", "vi": "châu Âu"}, {"w": "European", "p": "adj/n", "vi": "người châu Âu"}, {"w": "Africa", "p": "n", "vi": "châu Phi"}, {"w": "African", "p": "adj/n", "vi": "người châu Phi"}, {"w": "Scotland", "p": "n", "vi": "Xcốt-len"}, {"w": "Scottish", "p": "adj", "vi": "người Xcốt-len"}, {"w": "Ireland", "p": "n", "vi": "Ai-len"}]}, {"id": "W16-3", "title": "The Food Tables", "body": "The best part of International Night was the food. Every table had food from its country, and everybody could try everything. Minh, Sam and Hana walked around with paper plates and big appetites.\n\nHana was a new student from Japan. She studied nursing and lived in the same building as Sam. She was quiet, but she had a great laugh. Minh liked her laugh very much. He did not tell anyone.\n\n\"Let's try everything,\" said Sam. \"From A to Z.\"\n\nThey started at the **Welsh** table. A student from **Wales** gave them Welsh cakes, small and sweet. \"Wales has its own language,\" she said. \"Welsh. Most people speak English too, but we love our language.\" Minh remembered Gareth and Megan's farm and smiled.\n\nNext to Wales was an **Irish** table with brown bread and butter. Then **Greece**: a **Greek** student made a salad with cheese and olives. \"In **Greek**, 'hello' is 'yassas,'\" she said. A **Turkish** student gave them sweet coffee in tiny cups. An **Egyptian** student told them about the pyramids in **Egypt** and gave them a kind of bean soup.\n\nThe next row was Europe. There were two students from **Portugal**, who spoke **Portuguese** with the Brazilian girl from the English club. A tall **Dutch** man from the **Netherlands** gave them cheese and talked about bicycles. \"In the Netherlands, there are more bikes than people,\" he said.\n\nFrom the north of Europe, there was a **Swedish** girl from **Sweden** who made cinnamon buns, and a **Norwegian** boy from **Norway** with very cold fish. Minh did not like the fish. A student from **Poland** made dumplings. \"Polish dumplings are the best,\" he said. Minh said Vietnamese dumplings were the best. They argued happily.\n\nA **Swiss** girl from **Switzerland** gave everyone chocolate. \"Swiss chocolate is the best in the world,\" she said. Nobody argued with that.\n\nSam went to the **Argentina** table. An **Argentinian** student was cooking beef on a small grill. \"In Argentina, we eat beef every day,\" he said. Sam ate three pieces.\n\nThen they went to the Southeast Asian tables. Minh felt at home. There was a student from **Singapore** with chicken rice, a **Malaysian** girl from **Malaysia** with curry, and an **Indonesian** boy from **Indonesia** with fried rice. A **Filipino** student from the **Philippines** made a sweet purple ice cream. A **Cambodian** student from **Cambodia** and a student from **Laos** shared a table. The **Lao** student made a spicy salad. \"Laos and Cambodia are Vietnam's neighbors,\" Minh told Hana. \"Our food is similar, but each country has its own taste.\"\n\nAt the last table, a student from Saudi Arabia served dates and coffee. He wrote everybody's name in **Arabic**. \"This is your name,\" he said, giving Minh a beautiful piece of paper. \"**Arab** coffee is strong, so be careful.\" Hana's name looked like a flower.\n\nAfter an hour, they were very full. They sat on the stairs outside. \"I think I ate twenty countries,\" said Sam.\n\n\"I like this,\" Hana said quietly. \"In Japan, we don't have many foreigners. Here, everybody is from somewhere else.\"\n\n\"In Riverford, everyone is a foreigner,\" said Minh. \"Even the English, sometimes.\"\n\nHana laughed her great laugh. Minh decided that International Night was the best night of the year.", "words": 538, "new": [{"w": "Irish", "p": "adj/n", "vi": "người Ai-len"}, {"w": "Wales", "p": "n", "vi": "xứ Wales"}, {"w": "Welsh", "p": "adj/n", "vi": "người xứ Wales"}, {"w": "Egypt", "p": "n", "vi": "Ai Cập"}, {"w": "Egyptian", "p": "adj/n", "vi": "người Ai Cập"}, {"w": "Greece", "p": "n", "vi": "Hy Lạp"}, {"w": "Greek", "p": "adj/n", "vi": "người Hy Lạp, tiếng Hy Lạp"}, {"w": "Turkish", "p": "adj/n", "vi": "người Thổ Nhĩ Kỳ"}, {"w": "Portugal", "p": "n", "vi": "Bồ Đào Nha"}, {"w": "Portuguese", "p": "adj/n", "vi": "tiếng Bồ Đào Nha"}, {"w": "Netherlands", "p": "n", "vi": "Hà Lan"}, {"w": "Dutch", "p": "adj/n", "vi": "người Hà Lan"}, {"w": "Sweden", "p": "n", "vi": "Thuỵ Điển"}, {"w": "Swedish", "p": "adj/n", "vi": "người Thuỵ Điển"}, {"w": "Norway", "p": "n", "vi": "Na Uy"}, {"w": "Norwegian", "p": "adj/n", "vi": "người Na Uy"}, {"w": "Poland", "p": "n", "vi": "Ba Lan"}, {"w": "Switzerland", "p": "n", "vi": "Thuỵ Sĩ"}, {"w": "Swiss", "p": "adj/n", "vi": "người Thuỵ Sĩ"}, {"w": "Argentina", "p": "n", "vi": "Ác-hen-ti-na"}, {"w": "Argentinian", "p": "adj/n", "vi": "người Ác-hen-ti-na"}, {"w": "Singapore", "p": "n", "vi": "Xin-ga-po"}, {"w": "Malaysia", "p": "n", "vi": "Ma-lai-xi-a"}, {"w": "Malaysian", "p": "adj/n", "vi": "người Ma-lai-xi-a"}, {"w": "Indonesia", "p": "n", "vi": "In-đô-nê-xi-a"}, {"w": "Indonesian", "p": "adj/n", "vi": "người In-đô-nê-xi-a"}, {"w": "Philippines", "p": "n", "vi": "Phi-líp-pin"}, {"w": "Filipino", "p": "adj/n", "vi": "người Phi-líp-pin"}, {"w": "Cambodia", "p": "n", "vi": "Cam-pu-chia"}, {"w": "Cambodian", "p": "adj/n", "vi": "người Cam-pu-chia"}, {"w": "Laos", "p": "n", "vi": "Lào"}, {"w": "Lao", "p": "adj/n", "vi": "người Lào, tiếng Lào"}, {"w": "Arabic", "p": "n/adj", "vi": "tiếng Ả Rập"}, {"w": "Arab", "p": "n/adj", "vi": "người Ả Rập"}]}, {"id": "W17-1", "title": "Mia's Painting", "body": "In October, Mia entered a national art competition. The theme was \"One World.\" \"I want to paint a picture with every country in it,\" she said. \"Every flag, every color.\"\n\nMinh helped her find information. They sat at the kitchen table with her laptop and looked at flags from all over the world.\n\n\"Look at **Israel**,\" said Mia. \"White and blue, with a star. And **Iran** has green, white and red.\" She asked Minh, \"Do you know any **Israeli** or **Iranian** people?\"\n\n\"There's an **Iranian** doctor at the hospital, Kate says,\" said Minh. \"And an **Israeli** student in my class.\"\n\nThey looked at more flags. **Pakistan**: green with a white moon. **Nigeria**: green, white, green. **Kenya**: black, red and green, with a shield in the middle. \"The **Kenyan** flag is my favourite,\" said Mia. \"It's so strong.\"\n\nAt the English club, Minh had met a **Pakistani** boy and a **Nigerian** girl. The **Nigerian** girl loved music. The **Pakistani** boy loved cricket and talked about it all the time.\n\nThen they looked at South America. **Peru** had red and white stripes. **Chile** had a white star on blue. **Colombia** was yellow, blue and red. \"In the English club, there's a **Peruvian** girl, a **Chilean** man and a **Colombian** boy,\" said Minh. \"They argue about football all the time.\"\n\nMia started to paint. Her painting was huge, as big as a door. In the middle, there was the earth, round and blue. Around it, there were hands of every color, holding each other. And around the hands, there were flags, small and **colorful**.\n\n\"Every flag is a different shape,\" she said. \"Most are a rectangle. But look at Nepal. It's two triangles.\" She painted some flags as **ovals**, to make the picture more interesting.\n\nMinh watched her work. She used a thick brush for the big areas and a very narrow one for the details. In one place, she painted tiny dots. In another place, she painted **stripes**, like the American flag. Her T-shirt was **striped** too, black and white, and covered in paint.\n\n\"How do you make the sky look so deep?\" Minh asked.\n\n\"I use many layers,\" said Mia. \"Dark blue, then lighter blue, then a **pale** blue on top. And see this **spot**? I leave it white, for light.\"\n\nShe showed him a **pattern** in the hands: small lines, like fingerprints. \"Every person is different,\" she said. \"Every hand has its own pattern.\"\n\nSome parts of the painting were **smooth**, like glass. Other parts were **rough**, with thick paint you could touch. The paper at the edges was wide and white, like a frame.\n\nAfter three weeks, the painting was finished. The whole family stood in front of it. Nobody said anything for a minute.\n\n\"Mia,\" said Anna finally, \"it's beautiful.\"\n\n\"It's very good,\" said Tom. \"Honestly. I'm not just saying that because I'm your father.\"\n\nGrandma Rose looked at it for a long time. \"In my day,\" she said quietly, \"the world was at war. Countries hated each other. This picture is what we hoped for.\" She touched the frame. \"You have a gift, Mia.\"\n\nMia's face went red. She sent the painting to the competition. Now she had to wait two months for the result. \"Waiting is the worst part,\" she said.\n\n\"I know,\" said Minh. He remembered waiting for his scholarship. \"But good things are worth waiting for.\"", "words": 562, "new": [{"w": "Israel", "p": "n", "vi": "I-xra-en"}, {"w": "Israeli", "p": "adj/n", "vi": "người I-xra-en"}, {"w": "Iran", "p": "n", "vi": "I-ran"}, {"w": "Iranian", "p": "adj/n", "vi": "người I-ran"}, {"w": "Pakistan", "p": "n", "vi": "Pa-ki-xtan"}, {"w": "Pakistani", "p": "adj/n", "vi": "người Pa-ki-xtan"}, {"w": "Nigeria", "p": "n", "vi": "Ni-giê-ri-a"}, {"w": "Nigerian", "p": "adj/n", "vi": "người Ni-giê-ri-a"}, {"w": "Kenya", "p": "n", "vi": "Kê-ni-a"}, {"w": "Kenyan", "p": "adj/n", "vi": "người Kê-ni-a"}, {"w": "Peru", "p": "n", "vi": "Pê-ru"}, {"w": "Peruvian", "p": "adj/n", "vi": "người Pê-ru"}, {"w": "Chile", "p": "n", "vi": "Chi-lê"}, {"w": "Chilean", "p": "adj/n", "vi": "người Chi-lê"}, {"w": "Colombia", "p": "n", "vi": "Cô-lôm-bi-a"}, {"w": "Colombian", "p": "adj/n", "vi": "người Cô-lôm-bi-a"}, {"w": "colorful", "p": "adj", "vi": "sặc sỡ"}, {"w": "pale", "p": "adj", "vi": "nhợt nhạt, nhạt"}, {"w": "oval", "p": "adj/n", "vi": "hình bầu dục"}, {"w": "spot", "p": "n/v/adj", "vi": "vết; chỗ"}, {"w": "stripe", "p": "n", "vi": "sọc"}, {"w": "striped", "p": "adj", "vi": "có sọc"}, {"w": "pattern", "p": "n/adj/v", "vi": "họa tiết; mẫu"}, {"w": "smooth", "p": "adj", "vi": "mịn, nhẵn"}, {"w": "rough", "p": "adj/v/n/adv", "vi": "gồ ghề"}]}, {"id": "W17-2", "title": "Quiz Night", "body": "Every Thursday, The Blue Cup had a quiz night. Teams of four answered questions about everything: history, science, music, sport. The winning team got a free dinner. Minh's team was Minh, Sam, Hana and, surprisingly, Grandma Rose.\n\n\"I know a lot of useless things,\" Grandma Rose said. \"Eighty years of useless things.\"\n\nDaniel was the quiz master. \"Round one: numbers,\" he said. \"Question one. How many is a dozen?\"\n\n\"Twelve,\" Grandma Rose said immediately.\n\n\"Question two. How many people live on Earth? About eight thousand... million... or billion?\"\n\n\"Eight billion,\" said Hana.\n\n\"Question three. What is seven times eight?\"\n\n\"Fifty-six,\" said Minh. He was good at maths. \"Easy. In Vietnam, we learn to multiply, divide, subtract and add very fast. Plus, minus, times, equal: we can do it all in our heads.\"\n\nThe questions got harder. \"What is the average length of an adult's foot? About twenty-five centimeters, two meters or ten inches?\"\n\n\"Ten inches is about twenty-five centimeters,\" said Sam. \"So both!\" Daniel gave them half a point.\n\n\"How far is it from London to Paris? Three hundred kilometers, or three hundred miles?\"\n\n\"It's approximately three hundred and forty kilometers,\" said Grandma Rose. \"Nearly two hundred and twenty miles. I went there on my honeymoon.\" The team looked at her. \"What? I had a life before you were born.\"\n\nRound two was about food. \"How many grams in a kilogram?\"\n\n\"A thousand,\" said Hana.\n\n\"How many **ounces** in a pound?\"\n\nNobody knew. Grandma Rose thought. \"Sixteen,\" she said. \"I've been baking with ounces for seventy years.\"\n\n\"In America, how much milk is in a **gallon**? About four **liters** or ten liters?\"\n\n\"Four,\" said Sam. \"Exactly three point seven eight five. My uncle lives in America.\"\n\n\"How many kilo bags of rice are in a ton? Ten, a hundred or a thousand?\" A thousand, said Hana. Ten percent of the room said a hundred. \"Is the river in Riverford deep or shallow?\" \"Shallow in summer,\" said Grandma Rose, \"and deep in winter. And it has sharp rocks.\"\n\nRound three was about records. \"What is the biggest animal ever? Is it a **giant** dinosaur, or the blue whale?\"\n\n\"The whale,\" said Minh. \"It's **enormous**. Bigger than any dinosaur.\" He knew because of the museum trip with his family when he was thirteen.\n\n\"What's the **tiniest** country in the world?\"\n\n\"Vatican City,\" said Grandma Rose. \"Very **tiny**. Very holy.\"\n\n\"Which country is **huge**, but has one of the smallest percentages of people per square kilometer? Australia or Canada?\"\n\nThey argued. In the end, they said Canada. It was wrong. \"Australia has fewer people per square kilometer,\" said Daniel. \"But only a little.\"\n\nAt the end of four rounds, Daniel counted the points. \"In fifth place, The Science Boys. In fourth place, The Old Bell Ladies. In third place, the Hospital Team. In second place...\" He waited. \"The Quiz Kings, with thirty-two points. And the winner, with thirty-three points... Team Grandma!\"\n\nEveryone clapped. Grandma Rose stood up and bowed. \"Thank you, thank you. Plenty of experience, that's the secret.\"\n\nThe free dinner was a big pizza. They ate together. \"This is the sixth time I've done a quiz,\" said Hana, \"and the first time I've won.\"\n\n\"It's my twentieth time,\" said Sam. \"Or twelfth. I don't know. But it's the first time I've won, too.\"\n\n\"I've done several hundred quizzes,\" said Grandma Rose. \"This might be my hundredth win. Or my seventh. Or my eighth, or ninth, or tenth. I lose count.\"\n\nMinh looked at his team: a Spanish designer, a Japanese nurse, an eighty-year-old English grandmother and a Vietnamese student. Not enough for a football team, but enough for a quiz. It was a strange team, but a good one. A pair of old friends at the next table bought them drinks. \"Next week,\" said Grandma Rose, \"we'll triple our points.\"\n\n\"Not least because you know everything,\" said Sam.\n\n\"At least I know the distance from here to the bar,\" said Grandma Rose. \"And it's too far. Minh, would you be a dear?\"\n\nThere was always a quantity of cake left at the end, so they took some home. Hana said it was the best cake she had ever eaten, though it was only a medium one. The width of the smile on Minh's face, Sam said, was large. Very large. \"You need to measure it,\" said Sam. Minh threw a piece of cake at him.", "words": 734, "new": [{"w": "huge", "p": "adj", "vi": "khổng lồ"}, {"w": "tiny", "p": "adj", "vi": "nhỏ xíu"}, {"w": "giant", "p": "n/adj", "vi": "người khổng lồ"}, {"w": "enormous", "p": "adj", "vi": "khổng lồ"}, {"w": "ounce", "p": "n", "vi": "ao-xơ"}, {"w": "liter", "p": "n", "vi": "lít"}, {"w": "gallon", "p": "n", "vi": "ga-lông"}]}, {"id": "W17-3", "title": "The Box Under the Bed", "body": "One rainy afternoon in November, Grandma Rose fell asleep in her chair. Mia went into her room to find a blanket for her. Under the bed, she saw a small wooden box that she had never seen before.\n\nShe brought it to Minh. \"Should we open it?\" she asked.\n\n\"No,\" said Minh. \"It's not ours. It's hers.\"\n\n\"I know. But **whatever** is in it, Grandma never talks about it. Aren't you curious?\"\n\nMinh was curious himself. But he said, \"We ought to ask her first.\"\n\n\"Hi, Grandma,\" said Mia when Grandma Rose woke up. \"Look what we found. It was **beneath** your bed. We didn't open it. Thanks to Minh, we waited.\" She showed her the box. Grandma Rose went quiet. She held the box in her lap for a long time. Neither Mia nor Minh said anything.\n\n\"Wow,\" she said finally, very quietly. \"OK. I haven't opened this for sixty years. Since then, I've opened every other box in this house, but not this one. I used to keep it on a shelf, among my books. Then I put it below the bed, out of sight. \"I used to look at it every day. Then I stopped. I didn't dare. Unless you're ready, some things are better closed.\"\n\nShe opened it. Inside, there were old letters, a photograph and a dried flower. The photograph showed two young women, laughing, standing beside a river. One was Grandma Rose. The other had dark hair and a big smile.\n\n\"Who is she?\" asked Mia.\n\n\"Her name was Margaret,\" said Grandma Rose. \"She was more than a friend. She was like a sister to me. Such a friend you meet only once. \"She was my best friend. We did everything together. We went to school together, we worked together, and we were going to go to London together. We had big plans. Then something happened. We had a terrible argument. I said things I shouldn't have said. She left Riverford, and I never saw her again.\"\n\n\"What was the argument about?\" asked Minh.\n\n\"It doesn't matter now,\" Grandma Rose said. \"It was about a young man, of course. Isn't it always? We were both silly. She was angry with me, and I was angry with her. We turned against each other. Either of us could have said sorry. Neither did. \"Although... it mattered so much then. Isn't that strange?\"\n\n\"Did you try to find her?\" asked Mia.\n\n\"No. I was too proud. I blamed her, not myself. I told everyone it was her fault, except my mother. And then it was too late. Throughout my life, I thought about her. Besides your grandfather, she was the person I missed most. She wrote to me once, many years later. This letter.\" She took out an envelope. \"But I never answered. I didn't know whether she was still angry. I didn't know what to say.\"\n\nMia looked at Minh. Minh looked at Mia. They had the same idea.\n\n\"Grandma,\" said Mia slowly, \"what if we try to find her? Somewhere, she might still be alive. People can find anyone on the internet.\"\n\n\"She'd be eighty,\" said Grandma Rose. \"If she's alive at all.\"\n\n\"So are you,\" said Mia. \"People find old friends every day. Online, via social media, anywhere. Last year, a woman found her sister after seventy years. It was on the news. Some people look everywhere and find nothing. Others find someone quickly. But nobody finds anyone if they don't look. Grandma, nowhere is too far now.\" \"And you're very alive.\"\n\nGrandma Rose laughed despite herself. \"Oh, Mia. **Whoever** taught you to argue like that?\"\n\n\"You did,\" said Mia.\n\nGrandma Rose looked at the photograph again. Then, though her hands were shaking, she gave the letter to Minh. \"Read it,\" she said. \"My eyes are too old. The address is on the back.\"\n\nThe letter was from 1975. Margaret wrote that she lived in Scotland now, near Edinburgh. She was married and had two children. \"I think of you **whenever** I see a river,\" she wrote. \"**Wherever** I go, I remember our plans. Please write to me. I'm sorry for everything.\"\n\nThere was a short silence. Everyone was thinking.\n\n\"She said sorry,\" said Grandma Rose quietly. \"And I never answered. Fifty years.\"\n\n\"It's not too late,\" said Minh. \"However long it has been, she said sorry. She did it herself. It's your turn now. We'll help. We'll do it ourselves, the three of us. Leave it to us. Search engines work very fast, faster than letters. One search per day, if you like.\" \"We can look for her. Mia and I can search online. Someone must know something.\"\n\n\"And if you find her,\" said Grandma Rose, \"what then?\"\n\n\"Then you can say sorry too,\" said Mia. \"Or just hello. Or just 'bye, I'm fine, and I'm sorry.' Whatever you feel. It doesn't need to be perfect. Within one letter, you can say it all. As Mum says, people forgive themselves last. You can't change the past, but you can write onto a new page.\"\n\nGrandma Rose put the photograph back in the box. She looked out of the window at the rain. \"All right,\" she said. \"Search. But don't tell anyone else. Not Tom, not Anna, not anyone. This is between us. Promise?\"\n\n\"We promise,\" they said. \"Don't worry yourselves,\" Grandma said. \"I'm only an old woman with an old box. The box itself is nothing.\" Upon that, she went upstairs.\n\nThat night, Minh and Mia sat in the kitchen with the laptop. They searched for Margaret's name. There were hundreds of results. Some were too young. Some were in America. Some were in Australia. Nothing looked right.\n\n\"This is impossible,\" said Mia. \"There are so many Margarets.\"\n\n\"Not impossible,\" said Minh. \"Just difficult. We'll try again tomorrow, and the day after, and the day after that. Something will appear. It always does.\"\n\nAbove them, in her room, Grandma Rose lay awake, looking at the ceiling, thinking about a river, a summer and a friend she had lost a lifetime ago.", "words": 1007, "new": [{"w": "whatever", "p": "pron/det", "vi": "bất cứ cái gì"}, {"w": "whoever", "p": "pron", "vi": "bất cứ ai"}, {"w": "wherever", "p": "conj/adv", "vi": "bất cứ đâu"}, {"w": "whenever", "p": "conj/adv", "vi": "bất cứ khi nào"}, {"w": "beneath", "p": "prep/adv", "vi": "bên dưới"}]}, {"id": "W18-1", "title": "The Search", "body": "For two weeks, Minh and Mia searched for Margaret every evening. They did not tell anyone. They had promised Grandma Rose. \"Hey, what are you two doing?\" Leo asked one night. \"Homework,\" said Mia. \"Yeah, right,\" said Leo. But he did not ask again.\n\nIt was harder than they expected. They tried everything. They searched for Margaret's name with \"Edinburgh.\" They looked at old newspapers online. They tried to guess her married name. \"I can't imagine how people did this before the internet,\" said Mia.\n\n\"They wrote letters,\" said Minh. \"And waited.\"\n\nIt did not help that Leo kept trying to enter the kitchen to see what they were doing, and the old laptop needed someone to fix it every ten minutes. Once, Mia almost hit the screen. \"Don't kill it,\" said Minh. \"We need it.\" Mia began to complain about everything: the slow internet, the bad websites, the strange design of old newspaper pages. \"It all depends on luck,\" she said. Minh did not disagree. They did not allow themselves to give up, though. Slowly, a picture began to appear and develop, and Mia started to become more hopeful.\n\n\"**Oops**,\" said Mia suddenly. She had dropped her cup of tea on the keyboard. \"**Ouch**! It's hot!\" Minh quickly took the laptop away. Fortunately, it was fine.\n\nAfter many hours, Minh noticed something. In the letter, Margaret mentioned that her husband was a doctor called James. \"Let's include that in the search,\" he said. \"A doctor called James, near Edinburgh, married to a Margaret.\"\n\nThey found an old article from a Scottish newspaper. It was about a doctor who retired after forty years in a small town near Edinburgh. His name was Dr. James Campbell. In the photo, he stood next to his wife. She was older, of course, but she had the same big smile as the girl in Grandma Rose's photograph.\n\n\"It's her,\" Mia whispered. \"It's really her. I believe it's her.\"\n\n\"We can't be sure,\" said Minh. \"We need more information.\"\n\nThey continued to search. The doctor died ten years ago. But they found a website for an art group in the same town. One of the members was Margaret Campbell, eighty-one years old. She painted landscapes of rivers. \"Rivers,\" said Mia. \"She paints rivers. Grandma said Margaret thought of her whenever she saw a river.\"\n\nThey looked at each other. They had to decide what to do. \"Do we tell Grandma now?\" asked Mia.\n\n\"I think we should prepare first,\" said Minh. \"What if we're wrong? What if she doesn't want to hear from Grandma? We don't want to hurt anyone.\"\n\n\"You think too much,\" said Mia. \"Sometimes you just have to knock on the door.\"\n\n\"And sometimes, the door belongs to someone who doesn't want visitors.\"\n\nThey argued, then agreed. They would arrange things carefully. First, they would write to the art group and introduce themselves. They would not give too much detail. They would just ask: \"Did Margaret Campbell grow up in Riverford?\"\n\nMia wrote the email. Minh helped improve it. \"Don't attack the subject too fast,\" he said. \"Be polite. Inform them, don't push.\"\n\nThey read it ten times. Then Mia pressed \"Send.\"\n\n\"Now what?\" she asked.\n\n\"Now we wait,\" said Minh. \"Again.\"\n\nFor a week, nothing happened. Mia checked her email every hour. She tried to avoid thinking about it, but she couldn't. \"Maybe they think we're bad people,\" she said. \"Maybe we should create a new email. Or call them. Or go to Scotland ourselves and find her house.\"\n\n\"Don't mind the silence,\" said Minh. \"People are busy. Old people don't check email every day. I prefer to wait.\"\n\nThen, on Friday, Mia ran into Minh's room without knocking. She held up her phone. \"She replied! Not the art group. Margaret's daughter! She says, 'Yes, my mother grew up in Riverford. Why do you ask?'\"\n\nMinh read the email three times. He could not believe it. \"It's her,\" he said. \"It really is her.\"\n\nMia sat down on his bed. \"Now we have to tell Grandma,\" she said. \"Does it matter that we did all this without asking her again?\"\n\n\"She said search,\" said Minh. \"We searched. We didn't lie. We didn't hide anything.\" He thought for a moment. \"But I hope she's ready. You can't escape your past forever. But sometimes the past is hard to fight. Even if you dream about something, when it really happens, it can be frightening.\"\n\nDownstairs, they could hear Grandma Rose laughing with Tom in the kitchen. She had no idea. Mia took a deep breath. \"Let's go,\" she said. \"Before I lose my courage.\"\n\nThey went downstairs together. Whatever happened next, they decided, they would follow Grandma Rose's wishes. It was her story, not theirs. If she wanted to build a bridge to the past, they would help. If not, they would accept it.", "words": 811, "new": [{"w": "oops", "p": "interj", "vi": "ôi, ối"}, {"w": "ouch", "p": "interj", "vi": "ui da"}]}, {"id": "W18-2", "title": "Good News, Big News", "body": "Mia and Minh did not get the chance to tell Grandma Rose that evening. When they walked into the kitchen, Anna was standing by the table with a letter in her hand and a strange face.\n\n\"Mia,\" she said. \"This came for you. It's from the art competition.\"\n\nMia took the letter. Her hands were shaking. \"I can't,\" she said. \"You read it.\"\n\nAnna opened the envelope. She read it silently. Then her eyes went wide. \"Mia,\" she said. \"You won. You won first prize. In the whole country!\"\n\nThere was a moment of silence. Then the kitchen exploded. Mia shouted. Leo shouted. Tom picked Mia up and spun her around. Grandma Rose clapped her hands. Minh laughed so much that he had to sit down.\n\n\"**Brilliant**!\" said Tom. \"Absolutely brilliant! My daughter, the artist!\"\n\nThe letter said more. Mia's painting would be shown in a gallery in London, the National Children's Gallery. There was a ceremony in December. The prize was five hundred pounds and an art course for a year. \"The judges found the painting powerful and full of hope,\" the letter said. \"It shows an excellent understanding of color and an original idea.\"\n\n\"I'm not even awake,\" said Mia. \"Is this actual, real life? I wasn't aware I had a chance. I'm not certain I can believe it. It's so common for good artists to lose.\" She looked anxious and happy at the same time.\n\n\"I don't understand,\" said Mia. \"There were thousands of paintings. Why mine?\"\n\n\"Because it's good,\" said Grandma Rose simply. \"Accept it. Don't refuse a gift.\"\n\nTom wanted to know every exact detail. \"What did they say about the colors? Did you produce it in one week or three? Will they repair the corner that got damaged in the post?\" He started to wonder whether he should recommend Mia to a professional gallery. Anna told him to reduce his excitement a little. \"She's fifteen,\" she said. \"Let her enjoy it. Treat her like a normal girl tonight.\" Leo said he would need someone to **rescue** him from all the art talk.\n\nThat night, there was a celebration. Tom ordered pizza from the place that was able to deliver on Fridays, and Daniel came with a cake. Even Sam and Hana came. Mia was the center of attention, and for once, she did not seem to mind.\n\nLater, when everyone was gone, Mia and Minh sat with Grandma Rose in the living room. \"Grandma,\" said Mia, \"we have something to tell you too.\"\n\nGrandma Rose looked at them. \"It's about Margaret, isn't it?\"\n\nMia nodded. Minh explained everything carefully. The article, the doctor, the art group, the email. Grandma Rose listened without a word. When he finished, she was quiet for a long time.\n\n\"She paints rivers,\" she said finally.\n\n\"Yes,\" said Mia.\n\n\"She's alive.\"\n\n\"Yes. Her daughter's name is Fiona. She's waiting for a reply. She doesn't know why we asked.\"\n\nGrandma Rose touched the photograph on the table. \"I don't know if I can do this,\" she said. \"I'm afraid. What if she has forgotten me? What if she doesn't want to see me? What if I can't recognize her?\"\n\n\"Then at least you will know,\" said Minh gently. \"You're unable to change the past, but you can still reach out. Pull the door, don't wait for it to open. In my culture, we have an ancient saying: the basic thing is to try. If you try, you can succeed. If you're absent, you can't.\" \"Not knowing is worse.\"\n\nGrandma Rose looked at him. \"You're very wise for a boy of twenty,\" she said. \"Who taught you that?\"\n\n\"My grandmother,\" said Minh. \"She always said: the hardest door is the one you don't push.\"\n\nGrandma Rose laughed softly. \"Your grandmother sounds like a very active woman. And very direct. Is that a cultural thing, from the **eastern** side of the world?\"\n\n\"Maybe,\" said Minh. \"Or maybe it's just grandmothers. The current generation of grandmothers is very strong.\"\n\nGrandma Rose laughed again. \"Is she available for a video call one day? I'd like to complete my education.\" \"Then I'd like to meet your grandmother.\"\n\nShe stood up slowly and went to the window. Outside, the moon was rising over the river. \"All right,\" she said. \"Write to Fiona. Tell her who I am. Tell her I'm sorry. And tell her I'd like to talk to her mother, if she agrees. I won't push. If Margaret says no, I'll understand.\"\n\n\"We promise to do it carefully,\" said Mia.\n\n\"I know you will,\" said Grandma Rose. Then she turned around. Her eyes were wet, but she was smiling. \"Two pieces of good news in one day. My granddaughter is a famous artist, and my oldest friend is alive. I suppose that's what you call a good day.\"\n\nMinh wrote the email that night. He tried to make it sound right: not too formal, not too informal. He read it to Mia. She suggested a few changes. Then he sent it.\n\n\"Do you think she'll reply?\" asked Mia.\n\n\"I trust she will,\" said Minh. \"I can't prove it. But I have a feeling.\"\n\nThe next morning, Fiona replied. \"My mother read your email five times,\" she wrote. \"Then she cried. Then she said: 'Tell Rose I've been waiting for fifty years. The central question of my life is answered. I can raise a glass to the past now.' She'd love to talk. Can we arrange a video call?\"\n\nMia screamed and woke up the whole house. Leo shouted, \"What's happening now? Did you win another prize?\"\n\n\"Better,\" said Mia. \"Much better.\"", "words": 935, "new": [{"w": "rescue", "p": "v/n", "vi": "cứu"}, {"w": "brilliant", "p": "adj", "vi": "xuất sắc"}, {"w": "eastern", "p": "adj", "vi": "phía đông"}]}, {"id": "W18-3", "title": "The Call", "body": "The video call was on a Sunday afternoon. Grandma Rose wore her best blouse and her pearl earrings. She fixed her hair three times. \"I look like an old woman,\" she said.\n\n\"You are an old woman,\" said Mia. \"A beautiful old woman.\"\n\nMinh set up the laptop on the kitchen table. He checked the internet connection. Everything was ready. At three o'clock exactly, the call came.\n\nOn the screen, there was a small woman with white hair and bright eyes. Behind her, on the wall, there were paintings of rivers. She looked at the screen. Grandma Rose looked at the screen. For a long moment, neither said anything.\n\nMargaret looked very ordinary at first: an **ordinary** old lady in an ordinary room. Then she smiled, and she was the girl in the photo again.\n\nThen Margaret said, \"Rose. Rosie. Is it really you?\"\n\n\"It's me, Maggie,\" said Grandma Rose. Her voice was shaking. \"It's really me.\"\n\nMia and Minh quietly left the room. They sat in the hallway and tried not to listen. But the house was small, and the walls were thin.\n\nThe two old women talked for two hours. At first, it was strange and formal. They talked about simple things: the weather, their health, their children. Margaret had a slight medical problem with her heart, but it was nothing serious, she said. She lived alone now, and she was very independent. Her life was quiet but social: she painted with her art group and helped at a local school. Grandma Rose said her own life was ideal too, with her family. Each heard the familiar voice of the other, older now but the same.\n\nMargaret said she was born in the northern part of Riverford, and Rose in the southern part. \"The river was between us even then,\" she joked. Then, slowly, they began to talk about the past. They laughed about school, about a teacher they both hated, about a dance in 1962 when Margaret fell over in the middle of the floor. Then they talked about the argument.\n\n\"I was so angry,\" said Grandma Rose. \"And so stupid. I said terrible things. I've felt guilty for sixty years.\"\n\n\"So was I,\" said Margaret. \"We were young. Everything seemed so important then. Now, I can't even remember his name.\"\n\nThey both laughed. It was the laugh of two girls by a river, a long time ago.\n\n\"It's obvious now,\" said Margaret. \"It was never really about him. We were afraid of losing each other, so we pushed each other away first.\"\n\n\"That's true,\" said Grandma Rose. \"And then we did lose each other. The worst possible result.\"\n\n\"Not anymore,\" said Margaret. \"It's not too late. It's never impossible. We're likely to have ten more years, if we're lucky. Let's not waste them.\" She was always positive, never negative, Grandma Rose remembered. That was her original character.\n\nWhen the call finished, Grandma Rose came into the hallway. She looked different. Younger, somehow. \"She wants to meet,\" she said. \"In person. She's coming to Riverford next month. Her daughter will drive her.\"\n\nMia jumped up and hugged her. \"That's fantastic, Grandma!\"\n\n\"It's strange,\" said Grandma Rose. \"We talked as if no time had passed. As if we saw each other last week. She hasn't changed. She's still funny, still kind, still a little crazy.\"\n\n\"Like you,\" said Mia.\n\n\"Like me,\" Grandma Rose agreed.\n\nThat evening, Grandma Rose finally told Tom and Anna the whole story. Tom was surprised. \"Mum, you never told me any of this! I didn't even know you had a best friend called Margaret.\"\n\n\"There were many things I never told you,\" said Grandma Rose. \"It was a secret. A personal thing. But I'm tired of secrets now.\"\n\nAnna looked at Mia and Minh. \"Was it legal to search for someone like that? Nothing illegal?\"\n\n\"Totally legal,\" said Mia. \"Everything was public. Old newspapers, an official website. It was standard research, like a professional detective. We didn't do anything extra. We were proper and polite. Minh made sure.\"\n\n\"A recent article and a previous email,\" said Minh. \"That's all. It wasn't necessary to do anything more.\"\n\nAnna looked at Mia and Minh again. \"And you two did all this? On your own?\"\n\n\"It was Minh's idea to be careful,\" said Mia. \"I wanted to go to Scotland and knock on every door.\"\n\n\"It was Mia's idea to search,\" said Minh. \"I just helped.\"\n\n\"You're both responsible,\" said Tom. \"In the best way.\" He smiled. \"Thank you. For my mother.\"\n\nThat night, Minh lay in bed and thought about friendship. He thought about Tuan in Vietnam, about Sam, about Hana. He thought about how easy it is to lose people, and how hard it is to find them again. He decided he would never let an argument become sixty years of silence. It was simple, really. Pick up the phone. Say sorry. It's not always easy, but it's always possible.\n\nHe picked up his phone and sent a message to Tuan: \"Hey. I miss you. How are you?\"\n\nTuan replied in a minute: \"Finally! I thought you forgot me, Mr. England. Call me!\"\n\nMinh laughed and called him. They talked until two in the morning, about everything and nothing, just like the old days by the river.\n\nThe next day, Grandma Rose seemed completely different. She was cheerful and active. She cleaned the whole house, which was not her job. She sang in the garden. Her mental health, Anna said, was better than it had been in years. \"It's like she put down a heavy bag,\" said Anna. \"She was carrying it for sixty years, and now it's gone.\"\n\nMargaret was coming in a month. Everybody in the house was excited. But nobody was more excited than Grandma Rose. \"I need a new dress,\" she said. \"Something formal. No, something informal. No... something pleasant and simple. Something normal. Something perfect.\"\n\n\"Grandma,\" said Mia, \"she's seen you in the worst clothes of your life. On the phone, you were wearing your old cardigan.\"\n\n\"Exactly,\" said Grandma Rose. \"So this time, I want to look my best.\" It was a successful, powerful day in general. It was the rare, pure kind of happiness that Minh had not seen in her before. The main thing, he thought, is that she is happy. It was not a major event for the world. It was a minor one. But for this family, it was the most important thing that year. It was regular life, but golden.", "words": 1085, "new": [{"w": "ordinary", "p": "adj", "vi": "bình thường"}]}, {"id": "W19-1", "title": "Two Old Friends", "body": "Margaret arrived in Riverford on a cold, bright Saturday in November. Her daughter Fiona drove her from Scotland. It was a long journey, but Margaret said she did not mind. \"I've waited sixty years,\" she said. \"Eight hours in a car is nothing.\"\n\nGrandma Rose waited at the window all morning. She was unusually quiet. She sat, then stood, then sat again. \"Honestly, Mum,\" said Tom, \"you're making me nervous. Normally you're the calmest person in this house.\" Grandma Rose had changed her dress twice. Neither was suitable, she said. One was too formal, the other too old. She slept badly the night before.\n\n\"Then go outside,\" said Grandma Rose. \"I'm not leaving this window.\"\n\nAt eleven o'clock, a car stopped in front of the house. Grandma Rose stood up slowly. She walked to the door carefully, holding the wall. Minh wanted to help her, but Anna gently held his arm. \"Let her,\" she whispered. \"This is hers.\"\n\nFiona opened the car door. A small woman with white hair got out. She was using a stick. She looked at the house. Then she saw Grandma Rose standing in the doorway.\n\nFor a moment, everything was completely still. Then Margaret dropped her stick and walked forward, quite fast for an eighty-one-year-old. Grandma Rose came down the steps. In the middle of the garden path, they met, and they held each other for a long, long time.\n\nNobody said anything. Mia was crying quietly. Even Leo, who generally pretended he did not have feelings, turned away and wiped his eyes. Tom put his arm around Anna.\n\n\"You haven't changed,\" said Margaret finally.\n\n\"Liar,\" said Grandma Rose. \"I'm a hundred years older.\"\n\n\"Well, so am I,\" said Margaret. \"That's fairly fair, anyway. Surely we're allowed to be old now.\"\n\nThey both laughed, and suddenly the sad moment was over.\n\nThe whole day was wonderful. They had lunch indoors, because it was too cold to eat outdoors. Margaret was funny and clever. She told stories about Grandma Rose as a girl that nobody had ever heard. \"Rose was terribly naughty at school,\" she said. \"She once put a frog in the teacher's bag. Obviously, she didn't get caught. She never got caught.\"\n\n\"Mum!\" said Tom. \"You always told me you were a perfect student!\"\n\n\"I was perfectly naughty,\" said Grandma Rose happily.\n\nIn the afternoon, the two old friends walked slowly along the river, the same river where the photograph was taken. Minh and Mia followed at a distance. They did not want to disturb them, but Fiona asked them to stay close, just in case.\n\n\"Mum talks about Rose quite often,\" Fiona said to Minh. \"Particularly when she paints. She always said that her best memories were here, by this river. I didn't really understand. Now I do.\"\n\n\"It's strange,\" said Minh. \"They were apart for sixty years. But they seem like they never stopped being friends.\"\n\n\"Some friendships are like that,\" said Fiona. \"In the western part of Scotland, where my father was from, they say a good friend is like a good river: it always comes back to the sea. \"You simply put them on a shelf. Then, years later, you take them down, and they're exactly as you left them.\"\n\nAt the bridge, Grandma Rose and Margaret stopped. They looked at the water. Minh could hardly hear what they said. Then Margaret took something from her bag: a small painting. She gave it to Grandma Rose. It was a picture of two girls by a river, laughing. Grandma Rose held it carefully against her chest.\n\n\"I painted it many years ago,\" Margaret said. \"Possibly thirty years ago. I always hoped I could give it to you. Luckily, I didn't throw it away.\"\n\nGrandma Rose said nothing. She just held Margaret's hand. Nicely. Gently. Like a sister.\n\nThat evening, Margaret and Fiona stayed for dinner. Everyone talked loudly and laughed. Tom told terrible jokes. Leo ate too much. Mia showed Margaret her prize-winning painting on her phone. Margaret looked at it seriously, for a long time. \"This is truly good,\" she said. \"Extremely good. You have a real talent, Mia. Especially the colors. Keep painting, whatever happens.\"\n\nMia went red. \"Thank you,\" she said. \"That means a lot. From a real painter.\"\n\n\"I'm just a hobby painter,\" said Margaret. \"But I know talent when I see it. Certainly, you'll go far.\"\n\nWhen it was time to leave, Margaret promised to come back in the spring. \"Actually, why don't you come to Scotland instead?\" she said to Grandma Rose. \"I'll show you my rivers.\"\n\n\"I'd definitely like that,\" said Grandma Rose. \"Very much.\"\n\nFiona drove away slowly. Grandma Rose stood at the gate and waved until the car disappeared. Then she came inside, sat down in her usual chair, and closed her eyes.\n\n\"Are you tired, Mum?\" asked Tom.\n\n\"Yes,\" she said. \"Totally tired. But it's a good tired. The best kind.\" She opened her eyes and looked at Minh and Mia. \"Thank you,\" she said. \"Both of you. You gave me back something I thought I'd lost forever.\"\n\nMinh did not know what to say. So he simply smiled. Sometimes, he thought, that was the right answer. Instead of words, a smile.\n\nFortunately, it had been a perfect day. Unfortunately, it was over. But anyway, there would be more days like this, Minh thought. Possibly many more, if they were lucky. It was probably the happiest day he had seen in this house. Rather than going ahead to the next thing, he wanted to stay in this moment a little longer, so he did not move backward or forward. He sat with the family, quietly, safely, happily, while the rain fell heavily outside. Otherwise, he might forget it. And he wanted to remember it properly, clearly, correctly, easily, for the whole of his life.\n\nHe went to bed late, slightly sad and completely happy. It had been a typical English day in every way, with a sudden rain, a whole family, various cups of tea, useless jokes and useful hugs. Mainly, though, it had been a day about love. That, he thought sadly and happily at the same time, was what really mattered. Particularly at the end.", "words": 1036, "new": []}, {"id": "W19-2", "title": "The Ceremony", "body": "In December, the whole family went to London for Mia's prize ceremony at the National Children's Gallery. Margaret even came from Scotland. \"I wouldn't miss it for the world,\" she said.\n\nThe gallery was huge and beautiful. The event was very formal. There were important people in suits and dresses, photographers, and a TV camera. Mia was nervous. She wore a dark blue dress and her hair was up. \"I look like a different person,\" she said. \"I don't like it.\"\n\n\"You look like an artist,\" said Grandma Rose. \"That's the purpose of the dress.\"\n\nMia's painting was on the main wall. It was the first thing people saw when they came in. A lot of people stood in front of it. They talked about the colors, the image of the earth, the hands. One man said, \"It's a powerful message about freedom and peace.\" A woman said, \"The quality is remarkable for a fifteen-year-old.\"\n\nMia had to give a short speech. She had written it many times. She had practiced it in front of the mirror, in front of Minh, in front of the cat. But now, with all these people, she forgot everything.\n\nShe stood at the microphone. She looked at the paper in her hand. Then she put it in her pocket.\n\n\"Hello,\" she said. \"I'm Mia. I'm fifteen. I don't know what to say, so I'll just tell the truth.\"\n\nThe room was quiet.\n\n\"When I started this painting, my aim was simple. I wanted to show the whole world in one picture. But it was very difficult. My first idea was bad. My second idea was worse. I almost gave up. The process was slow, and I didn't make much progress. My brother says I shouted at the paint a lot.\"\n\nPeople laughed. Leo waved.\n\n\"Then something changed. This year, a student from Vietnam came to live with my family. His name is Minh.\" She pointed. Minh's face went red. \"I learned a lot from him. Not about painting. About people. About how every person has a different memory, a different experience, a different way of seeing. But underneath, we have the same feelings. The same habits, even. We all love our families. We all miss home. We all want to belong somewhere.\"\n\nShe looked at Grandma Rose and Margaret, sitting together in the front row.\n\n\"And this year, I also learned that it's never too late to fix your mistakes. My grandmother found her best friend after sixty years. That's the real opportunity in life: not to be perfect, but to try again.\"\n\n\"So this painting is not really mine. It's for everyone in my family, and everyone who helped me. Thank you.\"\n\nThere was a short silence. Then everyone clapped. Some people stood up. Grandma Rose was crying. Margaret was crying. Tom was crying, which surprised everyone.\n\nAfter the ceremony, a woman from an art school came to talk to Mia. She was the head of a famous school in London. \"We'd like to offer you a place on our young artists' program,\" she said. \"It's for talented students. Classes on Saturdays. It would be a great benefit to your development.\"\n\nMia looked at her parents. Tom and Anna looked at each other. It was a big decision. London was far. There were risks, costs and difficulties. But there were also many advantages.\n\n\"We'll think about it,\" said Anna. \"Thank you very much.\"\n\nOn the train home, the family discussed it. Tom was worried about the effect on Mia's schoolwork. \"School is important,\" he said. \"What about her other subjects? Her level in maths isn't great.\"\n\n\"But Dad,\" said Mia, \"this is my dream. It's the best opportunity of my life.\"\n\nGrandma Rose spoke for the first time. \"Tom,\" she said, \"when you were sixteen, you wanted to play the guitar in a band. I said no. I said it wasn't a real job. Do you remember?\"\n\nTom was quiet. \"I remember.\"\n\n\"Do you regret it?\"\n\nHe was quiet for a long time. \"Sometimes,\" he said.\n\n\"Don't make the same mistake with her,\" said Grandma Rose. \"Give her the freedom to try. If it doesn't work, then at least she tried. That's the only solution I know.\"\n\nTom looked at Mia. Then he smiled. \"OK,\" he said. \"One year. If your grades stay good.\"\n\nMia screamed and hugged him. The other passengers looked at them. Leo pretended not to know them.\n\n\"What's your opinion, Minh?\" asked Anna.\n\nMinh thought. \"My advice? Every choice has an advantage and a disadvantage. The difference is what you do with it. If it fails, it's nobody's fault. Mia has the skill. And the school has a special feature: they teach young people. I think she should go.\"\n\nMinh watched out of the window at the dark fields. He thought about his own family. His decision to come to England was also a risk. But it was the best decision of his life. Every difficulty had been worth it. Every method he tried, every list of new words, every step forward. There had been bad luck and good luck. There had been noise and silence. Sometimes he had been sadly homesick; sometimes he had laughed happily. Some days it rained heavily, and he arrived at college wet. But he had always arrived safely. And mostly, there had been pleasure. A good position to be in, he thought. With a lot of hard work and a little bit of luck, maybe that was the real knowledge you needed in life. Not facts, not information. Just a sense of what matters.\n\nThe situation was simple: he was happy. And that was enough. He did not need an issue to fight about or any group to belong to. He had this.\n\nHe took out his notebook and wrote one sentence about the day. It was the beginning of the first chapter of his book. The base of everything. He wrote it with care and attention, putting all his effort into the detail. Then he closed the notebook and smiled. It was a small action. But some actions change everything. As for Mia's condition (nervous, happy, exhausted), she slept the whole way home. That was the only contact anyone had with her until the next morning. It was, everybody agreed later, the best event of the year and her best behavior ever.", "words": 1060, "new": []}, {"id": "W19-3", "title": "Going Home for Tet", "body": "In January, Minh got a big surprise. Daniel gave him a bonus at work. \"You're the most **hard-working** person here,\" he said. \"Go home for your New Year. You deserve it.\" Tom and Anna helped him find a **half-price** ticket. In February, for Tet, the Vietnamese Lunar New Year, Minh was going home for the first time in a year and a half.\n\nThe night before he left, he could not sleep. He packed and unpacked his suitcase three times. He had presents for everyone: English tea and biscuits for Grandma, a Riverford football shirt for Dad, a scarf for Mum, and a book for Lan. It was a **non-fiction** book about famous women scientists. \"She'll love it,\" said Mia, who helped him choose.\n\nAt the airport, the **check-in** queue was long. Minh's bag was heavy. \"It's two kilos over,\" said the woman at the desk. Minh took out a jar of Grandma Rose's homemade jam and gave it to Mia. \"Problem solved,\" said Mia, and put it in her bag.\n\nEveryone came to say goodbye: Tom, Anna, Mia, Leo, Grandma Rose, and Sam and Hana. \"Only three weeks,\" said Minh. \"I'll be back soon.\" Tom gave him some advice: \"Don't argue with your mother about food. You'll lose.\" Grandma Rose warned him about the cold when he came back. Anna advised him to sleep on the plane. Sam made one suggestion: \"Bring me some Vietnamese coffee.\"\n\nHana gave him a small envelope. \"Open it on the plane,\" she said. She looked a little shy. Leo noticed and grinned. Minh pretended not to see him.\n\nOn the plane, Minh opened Hana's envelope. Inside, there was a card. She had drawn a little plane flying over a river. Inside, she wrote: \"Safe journey. I'll miss our coffee breaks. Come back soon. Hana.\" Minh read it ten times. He began to **realize** something. Maybe it was more than friendship. He did not want to mention it to anyone yet. He had some doubt, and he needed time to consider it. Was it just a kind **gesture** from a friend, or a signal of something more? He did not know the truth. He decided to respond with a message when he landed. The topic was too big for now. Then he put it carefully in his passport.\n\nThe **take-off** was smooth. He watched England get smaller and smaller under the clouds. The flight was long. He watched two films, ate three meals, and slept a little. The plane had Wi-Fi, so he sent messages to everyone. When the plane landed in Hanoi, it was hot, humid and loud. It smelled of motorbikes, street food and flowers. It smelled of home.\n\nHis whole family was waiting at the airport. Lan was tall now, almost as tall as Mum. She ran to him and almost knocked him over. Mum cried. Dad held his shoulders and looked at him. \"You look different,\" he said. \"Older. More serious.\"\n\n\"Mum says I'm too thin,\" said Minh.\n\n\"She's right,\" said Dad. \"But you look well.\"\n\nGrandma was waiting at home. She was smaller and slower than before, but her eyes were the same. \"Come here,\" she said, and held his face in her soft hands, just like on the day he left. \"Let me look at you.\" She looked for a long time. \"Good,\" she said finally. \"You're still my Minh.\"\n\nThe house was full of Tet decorations: red and gold everywhere, a peach tree with pink flowers, and a table full of food. The next week was the happiest of his life. He ate everything. He visited every relative. He met Tuan, who was now studying at a university in Hanoi and playing **hip-hop** in a new band. They went to a football match together. They arrived late, just after **kick-off**, and at **half-time**, Tuan's team was losing three-nil. \"Some things never change,\" said Minh.\n\nTuan was **easy-going** as always. \"Who cares?\" he said. \"Let's eat.\"\n\nMinh told everyone about England. He explained the English school system, the structure of his course, and the value of his job. He talked about the support of the Parkers. \"Without them, my success would be impossible,\" he said. He did not talk about the trouble with money or the hard days. Mum would worry. He told them about the Parkers, about The Blue Cup, about Margaret and Grandma Rose. He showed them photos on his phone. Lan wanted to know everything about Mia. Mum wanted to know if he ate enough. Dad wanted to know about the motorbikes in England. Grandma wanted to know about Grandma Rose.\n\n\"She sounds like a good woman,\" she said. \"Tell her thank you. For taking care of you.\"\n\n\"She says she wants to meet you,\" said Minh. \"On a video call.\"\n\n\"Then we will,\" said Grandma. \"Two old women, one on each side of the world. Why not?\"\n\nBefore he left, Mum took him for a **check-up** at the doctor's. \"Just to make sure,\" she said. The doctor said he was healthy, but he needed to eat more vegetables. Mum looked at him with an \"I told you so\" face.\n\nLan asked him a question on his last night. \"Is there a girl in England?\" she asked. \"Mia told me there's a **good-looking** Japanese girl called Hana.\"\n\nMinh's face went red. \"Mia talks too much,\" he said.\n\n\"So there is!\" said Lan, delighted.\n\n\"Maybe,\" said Minh. \"I don't know. Maybe.\" Then he whispered, \"Don't tell Mum.\"\n\n\"I won't,\" Lan whispered back. Then she shouted, \"MUM! Minh has a girlfriend!\" Minh had to apologize to his mother for an hour for not telling her first.\n\nOn his last day, he did the **check-out** at the small hotel where he had stayed one night in Hanoi with Tuan. Then he went to the airport. Saying goodbye was hard again, but not as hard as the first time. Now he knew he would come back. And he knew that, on the other side of the world, another family was waiting for him too. Two families, two homes. He was lucky.\n\nOn the plane, he thought about his part-time job, his studies, his friends, and maybe a full-time job one day. He thought about a girl with a great laugh who drew little planes on cards. And he smiled all the way back to England.", "words": 1056, "new": [{"w": "realize", "p": "v", "vi": "nhận ra"}, {"w": "gesture", "p": "n/v", "vi": "cử chỉ"}, {"w": "check-up", "p": "n", "vi": "buổi khám tổng quát"}, {"w": "good-looking", "p": "adj", "vi": "ưa nhìn"}, {"w": "hard-working", "p": "adj", "vi": "chăm chỉ"}, {"w": "easy-going", "p": "adj", "vi": "dễ tính"}, {"w": "take-off", "p": "n", "vi": "lúc cất cánh"}, {"w": "check-in", "p": "n", "vi": "làm thủ tục nhận phòng"}, {"w": "check-out", "p": "n", "vi": "trả phòng"}, {"w": "half-price", "p": "adj/adv", "vi": "nửa giá"}, {"w": "kick-off", "p": "n", "vi": "giờ giao bóng"}, {"w": "half-time", "p": "n", "vi": "giờ nghỉ giữa hiệp"}, {"w": "hip-hop", "p": "n", "vi": "nhạc hip-hop"}, {"w": "non-fiction", "p": "n", "vi": "sách phi hư cấu"}]}, {"id": "W20-1", "title": "The Engagement Party", "body": "When Minh came back from Vietnam, there was big news. Grandma Rose's niece Kate, the nurse, was **engaged**. Her boyfriend, Ben, had asked her to marry him on Valentine's Day. \"On one knee, in the rain, in front of the hospital,\" Kate said. \"Very romantic and very wet.\"\n\nThere was an **engagement** party at the Parkers' house. Anna was the **hostess**. She cooked for two days. The house was full of people of every generation: babies, children, **teenage** cousins, young couples and **elderly** relatives.\n\nMinh brought Hana. It was the first time she came to the house. He was nervous. He made a short **introduction**: \"Everyone, this is Hana. She's a friend from college.\" Leo said, \"A friend? Just a friend?\" Minh wanted to kill him.\n\nHana was a little shy at first, but soon she was talking to everyone. Grandma Rose liked her immediately. \"She's a nurse? Good. A nurse is useful. Marry her.\"\n\n\"Grandma!\" said Minh. His face was on fire.\n\nKate and Ben told everyone about their plans. The wedding was in June. Kate would be the **bride**, of course, and Ben the **groom**. They wanted a small wedding by the river and a **honeymoon** in Greece. Kate showed everyone her ring.\n\nGrandma Rose talked about her own marriage. \"Fifty years with your grandfather,\" she said to Tom. \"We had good times and hard times. But we never thought about **divorce**. Not once. Well, maybe once. In 1974.\"\n\nEveryone laughed. One of the elderly aunts said she was **divorced** twice and happier now than ever. Another said her husband was finally enjoying his **retirement**. \"He's retired, and I'm tired,\" she said. \"He's at home all day now.\"\n\nBen's sister was **pregnant**. Her baby was coming in May. Her husband talked about the future. \"We want two children,\" he said. \"And maybe one day we will **adopt** a child too. There are so many children who need a home.\"\n\nA teenage boy, Ben's cousin, was very quiet. He was Hana's **flatmate**'s brother, it turned out. The world was small. Ben's own roommate at university was there too, telling embarrassing stories about Ben's **youth**. \"He couldn't cook anything. He ate cereal for two years.\"\n\nNot everyone at the party was happy. An old uncle of Ben's had just come from a **funeral**. His oldest friend had died. \"That's the strange thing about life,\" he said quietly to Minh. \"A funeral in the morning and a party in the evening. Sad and happy in one day.\"\n\nMinh thought about his childhood in Vietnam, his grandmother, the old men who told stories. Some of them were gone now. \"That's how life is,\" he said. \"Everything together.\"\n\nLater, Minh found Hana in the corner of the living room with a book. \"Are you studying? At a party?\"\n\n\"Sorry,\" she said. \"I have an anatomy exam on Monday. I have to learn every bone and every **organ** in the body.\"\n\n\"Let me help,\" said Minh. \"Ask me.\"\n\nShe opened the book. \"What's this bone?\" She pointed to a picture of the head.\n\n\"The **skull**,\" said Minh. \"Easy.\"\n\n\"And this?\" She touched her face, under her mouth.\n\n\"The **jaw**.\"\n\n\"Good. And these?\" She pointed to the long bones around her chest.\n\n\"The **ribs**. And the **spine** in the back. I know these from Grandma Rose's yoga.\"\n\n\"Now the organs. This is the **liver**. And these two, at the back, are the **kidneys**.\"\n\nThen Leo came in. He made a **fist** and pretended to hit Minh on the arm. \"Are you two studying bones at a party? You're the most boring couple in the world.\"\n\n\"We're not a couple,\" said Minh and Hana at the same time. Then they looked at each other and laughed.\n\nThe owner of the house next door complained about the noise at eleven o'clock. Anna apologized. Kate and Ben danced in the kitchen. The relationship between them, Minh thought, was easy and warm. They seemed to fit together.\n\nWhen the party was over, Minh walked Hana home. It was cold and quiet. \"Your English family is wonderful,\" she said. \"I felt very welcome.\"\n\n\"They liked you,\" said Minh. \"Especially Grandma Rose.\"\n\n\"She told me to marry you,\" Hana said, smiling.\n\n\"She tells everyone to marry everyone,\" said Minh quickly.\n\n\"I know,\" said Han
