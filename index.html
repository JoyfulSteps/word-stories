his grandparents had **emigrated** from Greece after the war. \"They were **emigrants** with nothing,\" he said. \"Now there are fifty of us.\" A **Scandinavian** journalist from Norway said her family was from all over **Scandinavia**: Swedish, Danish, Finnish. A photographer said he was from the **Balkan** region, from Serbia. A woman from Mexico said she was proudly Hispanic and **Latin** American, and her husband was from the **Caribbean**, from Jamaica.\n\n\"We're all from somewhere,\" said Yuko. \"And we're all here.\"\n\nThere was one more surprise. At midnight, there was a small **procession**: Lan and Mia came in carrying a cake shaped like a heart, with candles. Behind them, the whole Open Tokyo team carried a sign: \"Congratulations, Minh and Hana!\"\n\n\"When did you plan this?\" Minh asked Lan.\n\n\"An hour ago,\" said Lan. \"We're journalists. We work fast.\"\n\nIt was the most beautiful night of Minh's life. Not a **pageant**, not a royal **inauguration**, just a small party in a hotel, with people he loved. That was enough. He thought of his grandmother in Vietnam, and of the **ancestral** altar in her house, and of all the **ceremonial** moments that had led here. He hoped she would feel it, somehow, eleven thousand kilometers away: this happy **observance** of an old tradition.\n\nAnd somehow, he thought, she probably did.", "words": 719, "new": [{"w": "divine", "p": "adj", "vi": "thuộc thần linh"}, {"w": "theology", "p": "n", "vi": "thần học"}, {"w": "ancestral", "p": "adj", "vi": "thuộc tổ tiên"}, {"w": "rite", "p": "n", "vi": "nghi lễ"}, {"w": "ceremonial", "p": "adj/n", "vi": "thuộc nghi lễ"}, {"w": "inauguration", "p": "n", "vi": "lễ nhậm chức"}, {"w": "jubilee", "p": "n", "vi": "lễ kỷ niệm lớn"}, {"w": "procession", "p": "n", "vi": "đoàn diễu hành"}, {"w": "pageant", "p": "n", "vi": "cuộc trình diễn lớn"}, {"w": "gala", "p": "n", "vi": "buổi dạ tiệc"}, {"w": "extravaganza", "p": "n", "vi": "màn trình diễn hoành tráng"}, {"w": "observance", "p": "n", "vi": "sự cử hành"}, {"w": "multinational", "p": "adj/n", "vi": "(tập đoàn) đa quốc gia"}, {"w": "expatriate", "p": "n/adj/v", "vi": "người sống ở nước ngoài"}, {"w": "expat", "p": "n", "vi": "người sống ở nước ngoài"}, {"w": "emigrate", "p": "v", "vi": "di cư ra nước ngoài"}, {"w": "emigrant", "p": "n", "vi": "người di cư"}, {"w": "emigration", "p": "n", "vi": "sự di cư"}, {"w": "homeland", "p": "n", "vi": "quê hương"}, {"w": "motherland", "p": "n", "vi": "quê mẹ"}, {"w": "patriotic", "p": "adj", "vi": "yêu nước"}, {"w": "patriotism", "p": "n", "vi": "lòng yêu nước"}, {"w": "nationalism", "p": "n", "vi": "chủ nghĩa dân tộc"}, {"w": "Scandinavia", "p": "n", "vi": "vùng Scandinavia"}, {"w": "Scandinavian", "p": "adj/n", "vi": "thuộc Scandinavia"}, {"w": "Balkan", "p": "adj", "vi": "thuộc Balkan"}, {"w": "Caribbean", "p": "n/adj", "vi": "vùng Caribe"}, {"w": "Latin", "p": "n/adj", "vi": "tiếng Latinh"}]}, {"id": "W40-5", "title": "Designing a Wedding", "body": "The wedding planning started immediately. Mia, who was staying in Tokyo all summer, made herself the official designer. \"You can't trust Minh with design,\" she told Hana. \"He wears the same shirt every day.\"\n\n\"That's not true,\" said Minh. \"I have three shirts.\"\n\nFirst, the invitations. Mia wanted something special. She made a sample on thick, **matte** paper, not **glossy**. \"Glossy paper looks cheap,\" she said. On the front, there was a **circular** design: two rivers meeting in a perfect circle. Around the edge, there was an **intricate** pattern of cherry flowers and lotus flowers. \"Japan and Vietnam,\" she said. \"And a small English rose in the middle.\"\n\nHana loved it. \"It's beautiful. But it's very **ornate**. Maybe simpler?\"\n\nMia made a second version. Simpler, cleaner, **symmetrical**: exactly the same on both sides. Then a third version, **asymmetrical**, with the rivers coming from different sides. They chose the third. \"Life isn't symmetrical,\" said Hana.\n\nThen the decorations. Mia wanted lanterns, like at the Obon festival. She bought paper lanterns in different shapes: **spherical** like balls, **cylindrical** like tubes, and **rectangular** like boxes. Some were **translucent**, so light came through softly. Others were **opaque**, with no light through them, but painted with gold. \"The mix is important,\" she said. \"Light and dark. Like a painting.\"\n\nFor the tables, she found old Japanese plates with a **hexagon** shape, six sides. The cake would be on a small **octagon** table, eight sides. \"Every shape is a different **polygon**,\" said Lan, who had been helping. \"Did you know that?\"\n\n\"I'm an artist,\" said Mia. \"I know shapes.\"\n\nThey visited a jewelry maker to make wedding rings. Hana already had the jade ring for the engagement. For the wedding, they wanted simple rings. The jeweler showed them different metals. Some were bright and **metallic**. Others were softer. One was **iridescent**, changing color in the light, like the inside of a shell.\n\n\"Gold is very **malleable**,\" the jeweler explained. \"You can shape it easily. Silver is a little harder. Some metals are **brittle**; they break if you bend them. A ring must be strong.\"\n\nHe showed them how he made a ring. First, he drew the **contour** of the design on paper. Then he melted the metal and poured it into a mold. Then he polished it until its **texture** was perfect: smooth, not **coarse**. The finished rings were simple and beautiful.\n\nMinh's ring was a little different. Inside, the jeweler engraved a tiny **elliptical** shape: an oval, like a river stone. \"For your two rivers,\" the jeweler said. He had read Minh's book.\n\nThen there was the dress. Hana wanted to wear a traditional Japanese kimono for the Japan ceremony, a Vietnamese áo dài for the Vietnam ceremony, and a simple white dress for England. \"Three dresses for three weddings,\" she said. \"My mother will be happy. My bank account won't.\"\n\nMia designed the English dress. It was simple but elegant: soft silk, with a small **triangular** pattern on the back. \"Grandma Rose will make it,\" said Mia. \"She insists.\"\n\n\"She's eighty-five,\" said Hana.\n\n\"She says she'll make it if it's the last thing she does,\" said Mia. \"Which, she says, it won't be, because she wants to see your children first.\"\n\nHana went red. Minh laughed.\n\nThe last thing was the location in England. Grandma Rose offered Margaret's cottage in Scotland. \"By the river,\" she said on a video call. \"Where else? Margaret would want it.\"\n\nThey looked at photos of the cottage again. The stone walls were **porous**, old stone that held water, so the house was always a little damp. The garden was **compact**, small but beautiful. In spring, it would be full of flowers.\n\n\"It's perfect,\" said Hana. \"A wedding by a river.\"\n\n\"Our friend from Mexico at the party said a **Hispanic** wedding lasts all night,\" said Lan. \"With dancing until morning.\"\n\n\"Three weddings,\" said Minh. \"Three rivers. Tokyo, Hanoi, Scotland.\"\n\n\"Your life is a book,\" said Mia. \"You know that, right?\"\n\n\"I know,\" said Minh. \"I'm writing it.\"\n\nThe rope that held the lanterns at the engagement party had been **elastic**, stretching and stretching. Like his life, Minh thought. It stretched to fit everything.", "words": 696, "new": [{"w": "Hispanic", "p": "adj/n", "vi": "thuộc văn hóa nói tiếng Tây"}, {"w": "translucent", "p": "adj", "vi": "trong mờ"}, {"w": "opaque", "p": "adj", "vi": "không xuyên sáng"}, {"w": "iridescent", "p": "adj", "vi": "óng ánh đổi màu"}, {"w": "metallic", "p": "adj", "vi": "có ánh kim"}, {"w": "matte", "p": "adj", "vi": "mờ lì"}, {"w": "glossy", "p": "adj", "vi": "bóng láng"}, {"w": "symmetrical", "p": "adj", "vi": "đối xứng"}, {"w": "asymmetrical", "p": "adj", "vi": "bất đối xứng"}, {"w": "spherical", "p": "adj", "vi": "hình cầu"}, {"w": "cylindrical", "p": "adj", "vi": "hình trụ"}, {"w": "rectangular", "p": "adj", "vi": "hình chữ nhật"}, {"w": "triangular", "p": "adj", "vi": "hình tam giác"}, {"w": "circular", "p": "adj/n", "vi": "hình tròn"}, {"w": "elliptical", "p": "adj", "vi": "hình elip"}, {"w": "hexagon", "p": "n", "vi": "hình lục giác"}, {"w": "octagon", "p": "n", "vi": "hình bát giác"}, {"w": "polygon", "p": "n", "vi": "hình đa giác"}, {"w": "contour", "p": "n", "vi": "đường nét"}, {"w": "texture", "p": "n", "vi": "kết cấu bề mặt"}, {"w": "coarse", "p": "adj", "vi": "thô"}, {"w": "brittle", "p": "adj", "vi": "giòn dễ gãy"}, {"w": "malleable", "p": "adj", "vi": "dễ uốn nắn"}, {"w": "elastic", "p": "adj/n", "vi": "co giãn"}, {"w": "porous", "p": "adj", "vi": "xốp"}, {"w": "compact", "p": "adj/n/v", "vi": "nhỏ gọn"}, {"w": "intricate", "p": "adj", "vi": "phức tạp, tinh xảo"}, {"w": "ornate", "p": "adj", "vi": "trang trí cầu kỳ"}]}, {"id": "W41-1", "title": "The Shrinking Country", "body": "In November, Yuko asked Minh to write a data story. \"Japan's population is getting smaller,\" she said. \"Every year. Find the numbers. Then find the people.\"\n\nMinh spent a week with the data. Some of it was quantitative: numerical data, statistics, charts. Some was qualitative: interviews, opinions, stories. He needed both.\n\nThe numbers were shocking. Japan's population had reached its peak in 2008, at about 128 million. Since then, it had begun to **dwindle**. Every year, it fell by more than half a million people. \"The **cumulative** effect over fifteen years is huge,\" Minh wrote. \"Japan has lost more people than live in some whole countries.\"\n\nThe birth rate had **plummeted**. In the 1970s, Japanese women had about two children each, on average. Now, the figure was about 1.2. \"This is not a **marginal** change,\" an expert told him. \"The **magnitude** of it is enormous.\"\n\nAt the same time, the number of old people had **soared**. One in three Japanese people was over sixty-five. The number of people over a hundred had grown **exponentially**: from a few hundred in the 1960s to almost a hundred thousand today. \"The growth has been **exponential**,\" said the expert. \"Doubling, and doubling again.\"\n\nMinh made a chart. He showed the **aggregate** population, the total, falling slowly. He showed the number of children falling fast and the number of old people rising fast. The change was not proportional. The difference between the two lines was **disproportionate**: there were not enough young people to care for the old.\n\nHe looked at regional data too. In Tokyo, the population was stable, even growing **marginally**. But in the countryside, villages were emptying. In some areas, the population had **plunged** by half in thirty years. \"Tokyo is like a magnet,\" said the expert. \"It pulls everyone in.\"\n\nHe learned some statistical words for his article. \"The **median** age in Japan is forty-nine,\" he wrote. \"That means half the people are older, half are younger. The **mode**, the most common age, is in the early seventies.\" He explained **percentiles**, **variance** and standard **deviation** in a short box for readers who liked numbers.\n\nHe also looked at the economy. \"Every **quarterly** report shows the same thing,\" said an economist. \"Fewer workers. Less growth. The costs of caring for old people **escalate** every year. The government publishes a **biannual** report, twice a year, and each one is worse than the last.\"\n\nSome numbers had changed **substantially**; others very little. The **fluctuation** in the birth rate from year to year was **negligible**: tiny changes, but always down. There had been one small **surge** in births after a big government campaign, but it didn't last.\n\nThen Minh went to find the people. He visited a village in the mountains where the school had closed. There was only one child left: a seven-year-old boy who took a bus for an hour to a school in the next town. \"**Notwithstanding** the problems,\" said the village head, \"we love this place. We won't leave.\"\n\nHe visited a nursing home where robots helped carry patients. \"There are not enough human workers,\" said the manager. \"So we use robots. **Thereby** we can care for more people.\" She showed him a robot that looked like a teddy bear. It could lift an old woman from her bed. \"The robots have problems **therein**,\" she said, smiling. \"They don't tell jokes.\"\n\nHe met a young couple who had just had a baby. \"Everyone tells us we're heroes,\" said the father, laughing. \"Our parents, our neighbors, even strangers. One baby, and suddenly we're famous.\"\n\nHis article ended with a question. \"**Thereafter**, what?\" he wrote. \"What happens to a country when the young are few and the old are a **multitude**? Japan is the first to face this question. It won't be the last. Korea, China, Italy, Germany, even Vietnam will follow.\"\n\nYuko read it. \"Very good,\" she said. \"Clear numbers, real people. You've learned a lot.\"\n\n\"From you,\" said Minh.\n\n\"From everyone,\" said Yuko. \"That's how it works.\" **Whereupon**, as was her habit, she returned to her desk without another word.", "words": 675, "new": [{"w": "aggregate", "p": "n/adj", "vi": "tổng cộng"}, {"w": "cumulative", "p": "adj", "vi": "tích lũy"}, {"w": "disproportionate", "p": "adj", "vi": "không tương xứng"}, {"w": "magnitude", "p": "n", "vi": "tầm cỡ"}, {"w": "multitude", "p": "n", "vi": "vô số"}, {"w": "marginal", "p": "adj/n", "vi": "biên, cận biên, không đáng kể"}, {"w": "marginally", "p": "adv", "vi": "đôi chút"}, {"w": "negligible", "p": "adj", "vi": "không đáng kể"}, {"w": "substantially", "p": "adv", "vi": "đáng kể"}, {"w": "exponential", "p": "adj", "vi": "theo cấp số nhân"}, {"w": "exponentially", "p": "adv", "vi": "theo cấp số nhân"}, {"w": "plummet", "p": "v/n", "vi": "giảm mạnh, lao dốc"}, {"w": "soar", "p": "v", "vi": "tăng mạnh, tăng vọt"}, {"w": "surge", "p": "n/v", "vi": "tăng vọt, đợt tăng mạnh"}, {"w": "plunge", "p": "v/n", "vi": "lao xuống, sụt mạnh"}, {"w": "dwindle", "p": "v", "vi": "thu hẹp, teo dần"}, {"w": "escalate", "p": "v", "vi": "leo thang, gia tăng"}, {"w": "fluctuation", "p": "n", "vi": "sự dao động"}, {"w": "variance", "p": "n", "vi": "phương sai"}, {"w": "deviation", "p": "n", "vi": "độ lệch"}, {"w": "median", "p": "n/adj", "vi": "trung vị"}, {"w": "mode", "p": "n", "vi": "mốt thống kê"}, {"w": "percentile", "p": "n", "vi": "phân vị phần trăm"}, {"w": "quarterly", "p": "adj/n/adv", "vi": "hằng quý"}, {"w": "biannual", "p": "adj", "vi": "hai lần mỗi năm"}, {"w": "notwithstanding", "p": "prep", "vi": "bất chấp, mặc dù"}, {"w": "thereby", "p": "adv", "vi": "qua đó"}, {"w": "therein", "p": "adv", "vi": "trong đó"}, {"w": "thereafter", "p": "adv", "vi": "sau đó"}, {"w": "whereupon", "p": "conj", "vi": "ngay sau đó"}]}, {"id": "W41-2", "title": "The Report", "body": "In December, the Japanese government published a report about foreign workers. It was the result of the investigation that started with Minh's story about the Vietnamese workers. Yuko gave it to Minh. \"Read it all,\" she said. \"All three hundred pages. Then tell our readers what it really says.\"\n\nIt took Minh three days. The report was long and difficult. It **comprised** ten chapters, each one about a different problem. The language was formal and complicated. Some sentences were a hundred words long.\n\nThe first chapter **acknowledged** the problem. \"The government **acknowledges** that some foreign workers have been treated unfairly,\" it said. That was new. Before, the government had denied everything.\n\nThe report attributed the problems to several causes. Agencies in other countries charged too much money. Some Japanese companies failed to **comply** with the law. The system for checking companies was weak. \"**Insofar** as the law exists,\" the report said, \"it has not always been followed.\"\n\nThe report also included numbers. The government had compiled data from a thousand workplaces. Of these, about a third had broken at least one rule. \"This **constitutes** a serious failure,\" the report said.\n\nThen came the recommendations. The government would allocate more money for inspections. It would assign more inspectors to factories. It would alter the rules so that workers could change jobs if they were treated badly. Companies that broke the rules would have to **compensate** the workers. \"These changes will **commence** next April,\" the report said.\n\nMinh read carefully. Some parts were good. But some parts **contradicted** each other. In chapter three, the report said the problem was \"limited to a small number of companies.\" In chapter seven, it said \"a third of workplaces\" had problems. Those two statements didn't fit together.\n\nHe also noticed what the report didn't say. It didn't **condemn** any specific company. It didn't **confront** the question of why the government had ignored the problem for so long. \"It's what's missing that matters,\" said Yuko. \"Read between the lines. What can you **deduce**?\"\n\nMinh thought. \"They want to show they're doing something,\" he said. \"But they don't want to blame anyone. Especially not themselves.\"\n\n\"Exactly,\" said Yuko. \"Write that. But carefully.\"\n\nHe wrote his article. He tried to convey both the good and the bad. He demonstrated, with examples, where the report was strong and where it was weak. He **depicted** the lives of workers like Tuan, who had contributed to the story. He wanted readers to **conceive** what it was like to be a foreign worker in Japan.\n\nHe interviewed Keiko, the activist. On the parts **pertaining** to workers' rights, she was cautiously positive. \"It's a step forward,\" she said. \"**Albeit** a small one. The government has finally **abandoned** its old position that there was no problem. **Inasmuch** as that's progress, I welcome it.\"\n\n\"Will it change things?\" asked Minh.\n\n\"Workers will have to adapt to the new system,\" she said. \"And companies will have to **accommodate** the new rules. Some will try to avoid them. We must **anticipate** that. The danger is that conditions **deteriorate** again when people stop paying attention. Our job is to **consolidate** the progress. Make sure it doesn't disappear.\"\n\nShe also **asserted** something important. \"Workers don't just need rules. They need respect. They come here to work, to **accumulate** savings, to **acquire** skills, to attain a better life for their families. They contribute to this country. They should be treated as people, not machines.\"\n\nMinh used her words to end his article. Yuko read it and made one change. \"You wrote 'shocking' three times,\" she said. \"Once is enough. Contemplate your adjectives.\"\n\nThe article was widely shared. The government didn't reply. But two weeks later, a minister gave a speech. \"We will not **cease** our efforts until every worker is safe,\" he said. Minh noticed that he used three sentences from the article. \"They're reading us,\" said Yuko, satisfied. \"That's how you know you're doing your job.\" Nobody, she added, should **deviate** from the facts. Not the government, and not the press. You **derive** your power only from accuracy.", "words": 678, "new": [{"w": "insofar", "p": "adv", "vi": "trong chừng mực"}, {"w": "albeit", "p": "conj", "vi": "mặc dù"}, {"w": "inasmuch", "p": "adv", "vi": "trong chừng mực"}, {"w": "pertaining", "p": "v", "vi": "liên quan"}, {"w": "abandon", "p": "v/n", "vi": "bỏ rơi"}, {"w": "accommodate", "p": "v", "vi": "chứa, cung cấp chỗ ở"}, {"w": "accumulate", "p": "v", "vi": "tích lũy"}, {"w": "acknowledge", "p": "v", "vi": "thừa nhận, công nhận"}, {"w": "acquire", "p": "v", "vi": "tiếp thu, đạt được"}, {"w": "anticipate", "p": "v", "vi": "dự đoán"}, {"w": "assert", "p": "v", "vi": "khẳng định, tuyên bố"}, {"w": "cease", "p": "v/n", "vi": "ngừng"}, {"w": "commence", "p": "v", "vi": "bắt đầu"}, {"w": "compensate", "p": "v", "vi": "bù đắp, đền bù"}, {"w": "comply", "p": "v", "vi": "tuân thủ"}, {"w": "comprise", "p": "v", "vi": "bao gồm, chiếm"}, {"w": "conceive", "p": "v", "vi": "hình dung ra"}, {"w": "condemn", "p": "v", "vi": "lên án"}, {"w": "confront", "p": "v", "vi": "đối mặt"}, {"w": "consolidate", "p": "v", "vi": "củng cố"}, {"w": "constitute", "p": "v", "vi": "cấu thành, tạo nên"}, {"w": "contradict", "p": "v", "vi": "mâu thuẫn với"}, {"w": "deduce", "p": "v", "vi": "suy luận"}, {"w": "depict", "p": "v", "vi": "miêu tả"}, {"w": "derive", "p": "v", "vi": "thu được từ"}, {"w": "deteriorate", "p": "v", "vi": "xuống cấp"}, {"w": "deviate", "p": "v", "vi": "lệch khỏi"}]}, {"id": "W41-3", "title": "Lan's Classroom", "body": "In January, Lan began her teaching practice. For three months, she would teach English at a primary school in Tokyo, under the supervision of an experienced teacher. Minh went to watch her class one day, for an article about education.\n\nThe school was small and old. The children were eight years old, curious and loud. Lan stood at the front of the classroom, nervous but smiling.\n\nHer supervisor, Mrs. Ito, had taught for thirty years. She told Minh her philosophy. \"A teacher's job is not to fill children with information,\" she said. \"It's to **foster** their curiosity. To **nurture** their love of learning. If you **impose** too many rules, or **obstruct** their questions, you **inhibit** their creativity. If you **neglect** them, they lose interest. Balance is everything.\"\n\nLan's lesson was about animals. She didn't use a textbook. She used pictures, songs and a game. She **incorporated** movement into the lesson: the children had to act like the animals. Twenty eight-year-olds pretended to be elephants, snakes and monkeys. The noise was incredible.\n\n\"Is this normal?\" Minh whispered to Mrs. Ito.\n\n\"It's excellent,\" said Mrs. Ito. \"She **integrates** play and learning. Children learn best when they move.\"\n\nBut not everything went well. One boy, Kenji, didn't join in. He sat at the back with his arms crossed. Lan tried to include him, but he refused. \"He's always like this,\" whispered a girl. \"He doesn't like English.\"\n\nAfter class, Lan was worried. \"What should I do about Kenji?\" she asked Mrs. Ito.\n\n\"Don't **exaggerate** the problem,\" said Mrs. Ito. \"But don't **disregard** it either. Try to understand him first. What **hinders** him? What does he like?\"\n\nLan talked to Kenji's mother. She learned that Kenji's father worked abroad, in America, and Kenji hadn't seen him for a year. \"He thinks English took his father away,\" his mother said quietly. \"His interest in school has started to **diminish**.\"\n\nLan thought about it for a week. Then she had an idea. She asked Kenji to help her with a special project: making a video message in English for his father. Kenji was suspicious at first. But slowly, he began to participate. He learned words. He practiced sentences. At the end of two weeks, he made a video: \"Hello, Dad. I miss you. I love you. Come home soon.\"\n\nHis father replied with a video of his own. Kenji watched it ten times. After that, he was the first to raise his hand in English class.\n\nMinh wrote about it. He wanted to highlight what good teaching looks like. \"A good teacher doesn't just implement a plan,\" he wrote. \"She **perceives** each child as a person. She **distinguishes** between a child who can't learn and a child who won't learn, and she understands why.\"\n\nHe also wrote about problems in the education system. Mrs. Ito had a lot to say. \"The government wants to **modify** the curriculum every five years,\" she said. \"New ideas **emerge**, they **dominate** for a while, then disappear. Teachers can't keep up. And classes are too big. We want to **minimize** class sizes, but there's no money.\"\n\nShe talked about how the system could **discriminate** against some children. \"Children who are different, foreign children, children with learning problems, are sometimes left behind. We must **intervene** early. Not wait until it's too late.\"\n\nShe also warned about the media. \"Newspapers **distort** education stories,\" she said. \"They **portray** teachers as lazy or bad. They **manipulate** statistics to make schools look terrible. You must be careful, young man.\"\n\n\"I'll try,\" said Minh.\n\nHis article was called \"The Boy Who Hated English.\" It illustrated the power of one good teacher to change one child's life. Mrs. Ito read it and sent him a message: \"You didn't **exceed** the truth. Thank you.\" And Lan, after reading it, said, \"You made me sound better than I am.\" \"No,\" said Minh. \"I made you sound exactly as good as you are.\"\n\nLan's teaching practice **persisted** for two more months. Mrs. Ito said she had never seen a student teacher enhance a class so much. \"She will establish herself as an excellent teacher,\" she wrote in her report. \"She facilitates learning naturally. I want to ensure she gets a good job.\" The final report would exclude nothing; it was honest. Kenji initiated an English club at the school, with three friends. A small thing, but it would formulate his future.\n\nMinh noticed something else. In everything Lan did, the idea of fairness seemed to **precede** everything else. Maybe that was the real lesson to **elaborate** on: good teachers make every child feel seen. That **induces** them to learn.", "words": 768, "new": [{"w": "diminish", "p": "v", "vi": "suy giảm, thu nhỏ"}, {"w": "discriminate", "p": "v", "vi": "phân biệt đối xử"}, {"w": "disregard", "p": "v/n", "vi": "phớt lờ"}, {"w": "distinguish", "p": "v", "vi": "phân biệt"}, {"w": "distort", "p": "v", "vi": "làm méo mó"}, {"w": "dominate", "p": "v", "vi": "chi phối, thống trị"}, {"w": "elaborate", "p": "v", "vi": "giải thích chi tiết"}, {"w": "emerge", "p": "v", "vi": "nổi lên, xuất hiện"}, {"w": "exaggerate", "p": "v", "vi": "phóng đại"}, {"w": "exceed", "p": "v", "vi": "vượt quá"}, {"w": "foster", "p": "v/adj", "vi": "nuôi dưỡng"}, {"w": "hinder", "p": "v", "vi": "cản trở"}, {"w": "impose", "p": "v", "vi": "áp đặt"}, {"w": "incorporate", "p": "v", "vi": "kết hợp, tích hợp"}, {"w": "induce", "p": "v", "vi": "gây ra"}, {"w": "inhibit", "p": "v", "vi": "kìm hãm"}, {"w": "integrate", "p": "v", "vi": "tích hợp"}, {"w": "intervene", "p": "v", "vi": "can thiệp"}, {"w": "manipulate", "p": "v", "vi": "thao túng"}, {"w": "minimize", "p": "v", "vi": "giảm thiểu"}, {"w": "modify", "p": "v", "vi": "điều chỉnh"}, {"w": "neglect", "p": "v/n", "vi": "bỏ bê"}, {"w": "nurture", "p": "v/n", "vi": "nuôi dưỡng"}, {"w": "obstruct", "p": "v", "vi": "cản trở"}, {"w": "perceive", "p": "v", "vi": "nhận thức, xem là"}, {"w": "persist", "p": "v", "vi": "kiên trì, tiếp diễn"}, {"w": "portray", "p": "v", "vi": "phác họa, mô tả"}, {"w": "precede", "p": "v", "vi": "diễn ra trước"}]}, {"id": "W41-4", "title": "The Second Book", "body": "In March, Minh's second book was published. It was called Letters by the River. It was about two old women, best friends, who lost each other for sixty years and found each other again. It was Grandma Rose and Margaret's story, changed a little, with different names.\n\nBefore it was published, Minh asked Grandma Rose for permission. She read the manuscript in two days. Then she called him. \"It's **authentic**,\" she said. \"It's true, even where it's not true. You understand that, don't you? Fiction can be truer than facts.\"\n\n\"Are you sure you're okay with it?\"\n\n\"I'm eighty-six,\" she said. \"I don't have time to be private. Publish it.\"\n\nThe book came out in England first, then in Japan and Vietnam. This time, it was reviewed by many newspapers. Some reviews were good. Some were not.\n\nA famous critic in London wrote: \"Letters by the River is a **compelling** story, **concise** and beautifully written. The author has a **coherent** vision of friendship and forgiveness. His style is **conventional** but never boring. The characters are **credible**, the emotions real. A **comprehensive** portrait of two lives.\"\n\nAnother critic was more **cynical**: \"A sweet, sentimental book. The ending is **dubious**: would two women really forgive each other so easily after sixty years? The **deliberate** simplicity of the prose is sometimes charming, sometimes **bizarre**. A pleasant read, but not great literature.\"\n\nMinh read both reviews. The first made him happy. The second made him angry. Then it made him think.\n\n\"Is the critic right?\" he asked Hana. \"Is it too simple?\"\n\n\"Some people like simple,\" said Hana. \"Some people like complicated. You can't please everyone.\"\n\n\"But is the ending **feasible**? Would people really forgive like that?\"\n\nHana thought. \"Grandma Rose did,\" she said. \"So yes.\"\n\nThe book sold well. Not like a bestseller, but well. Readers wrote to Minh from many countries. A woman in Australia wrote that she had read it and then called her sister, after twenty years of silence. A man in Canada wrote that he had found his old school friend online. \"Your book gave me courage,\" he wrote.\n\nThose letters meant more to Minh than any review.\n\nHis publisher wanted him to do a book tour: London, Tokyo, Hanoi. \"You're **eligible** for a prize,\" said Diana, his agent. \"A prize for young writers. The **eminent** novelist who leads the judges loved the book.\"\n\nMinh was nervous about the tour. He had to speak in public, answer questions, sign books. \"What if they ask difficult questions?\" he said.\n\n\"Be honest,\" said Diana. \"Readers can tell when you're **explicit** and when you're hiding something.\"\n\nIn London, at a big bookshop, a young woman asked a difficult question. \"Your books are both about your own life. Can you write about anything else? Or is your imagination limited?\"\n\nThe room was quiet. Minh thought for a moment. \"Every writer writes about what they know,\" he said. \"But you're right. I want to try something different next. I want to write about people who are not like me. That's harder. But writers should **pursue** hard things.\"\n\nPeople clapped. Diana gave him a thumbs-up from the back.\n\nIn Tokyo, the book was popular with young people. In Hanoi, his old teacher, Ms. Huong, came to the reading. She sat in the front row and cried the whole time. Afterwards, she hugged him. \"I always knew,\" she said. \"When, not if.\"\n\nThe prize was announced in June. Minh didn't win. A **diverse** group of five writers was on the shortlist, and the winner was a young writer from Nigeria with a **dynamic**, brilliant novel. Minh read it and agreed it was better.\n\n\"Are you disappointed?\" asked Hana.\n\n\"A little,\" said Minh. \"But I'm learning. My writing is **erratic**: some chapters good, some weak. I need to **reinforce** what works. **Retain** the honesty. **Sustain** the energy. **Prioritize** the story over the style. And **utilize** what I learn from reading better books.\"\n\n\"You sound like a teacher,\" said Hana.\n\n\"I've been watching Lan,\" said Minh.\n\nThere was **ample** advice from everyone. Grace said: \"Don't let reviews **undermine** you. Bad reviews are part of the job. You must **withstand** them.\" Grandma Rose said: \"**Abundant** praise is bad for you. One cynic is healthy.\" Yuko said nothing, but she bought five copies.\n\nNot all criticism was fair. One reviewer called the book \"**arbitrary**\" without explaining why. Another said Minh was \"not really English, so he can't write about English people.\" That was not criticism; that was prejudice. Minh ignored it. Some **adverse** comments are worth reading, he decided. Some are not. And no law can **prohibit** a person from writing about the people he loves.", "words": 776, "new": [{"w": "prioritize", "p": "v", "vi": "ưu tiên"}, {"w": "prohibit", "p": "v", "vi": "cấm"}, {"w": "pursue", "p": "v", "vi": "theo đuổi"}, {"w": "reinforce", "p": "v", "vi": "củng cố"}, {"w": "retain", "p": "v", "vi": "giữ lại"}, {"w": "sustain", "p": "v/n", "vi": "duy trì, chịu đựng"}, {"w": "undermine", "p": "v", "vi": "làm suy yếu"}, {"w": "utilize", "p": "v", "vi": "sử dụng"}, {"w": "withstand", "p": "v", "vi": "chịu đựng"}, {"w": "abundant", "p": "adj", "vi": "dồi dào"}, {"w": "adverse", "p": "adj", "vi": "bất lợi, xấu"}, {"w": "ample", "p": "adj", "vi": "dư dả"}, {"w": "arbitrary", "p": "adj", "vi": "tùy tiện"}, {"w": "authentic", "p": "adj", "vi": "chính hiệu"}, {"w": "bizarre", "p": "adj", "vi": "kỳ quái"}, {"w": "coherent", "p": "adj", "vi": "mạch lạc"}, {"w": "compelling", "p": "adj", "vi": "thuyết phục, có sức nặng"}, {"w": "comprehensive", "p": "adj/n", "vi": "toàn diện"}, {"w": "concise", "p": "adj", "vi": "súc tích"}, {"w": "conventional", "p": "adj", "vi": "thông thường"}, {"w": "credible", "p": "adj", "vi": "đáng tin"}, {"w": "cynical", "p": "adj", "vi": "hoài nghi động cơ"}, {"w": "deliberate", "p": "adj/v", "vi": "cố ý"}, {"w": "diverse", "p": "adj", "vi": "đa dạng"}, {"w": "dubious", "p": "adj", "vi": "đáng ngờ"}, {"w": "dynamic", "p": "adj/n", "vi": "năng động"}, {"w": "eligible", "p": "adj", "vi": "đủ điều kiện"}, {"w": "eminent", "p": "adj", "vi": "lỗi lạc"}, {"w": "erratic", "p": "adj", "vi": "thất thường"}, {"w": "explicit", "p": "adj", "vi": "rõ ràng trực tiếp"}, {"w": "feasible", "p": "adj", "vi": "khả thi"}]}, {"id": "W42-1", "title": "The Future of Open Tokyo", "body": "In July, Open Tokyo had a crisis. The money was running out. Subscribers paid every month, but it was **inadequate**: not enough to pay six journalists, the office and the servers. \"We have three months of money left,\" said Yuko at a meeting. \"Then we close.\"\n\nEverybody was quiet. Ben looked at his laptop. Aiko looked at the floor. Min-ji looked angry.\n\n\"So what do we do?\" asked Minh.\n\nThey discussed every option. Ben suggested advertising. \"**Incompatible** with our mission,\" said Yuko immediately. \"If big companies pay us, we can't write about them honestly.\" Min-ji suggested asking a rich person for money. \"Too risky,\" said Yuko. \"Even a **legitimate** investor might want to control us.\"\n\n\"Then it's **futile**,\" said Ben. \"We can't survive without money, and we can't take money from anyone.\"\n\n\"It's not futile,\" said Minh. \"It's difficult. That's different.\"\n\nYuko looked at him. \"Go on.\"\n\nMinh had been thinking about it for weeks. \"In Riverford, we saved a café with five hundred shareholders,\" he said. \"Ordinary people, each paying a little. What if our readers became owners? Not just subscribers. Members. They'd pay more, but they'd have a vote. They'd decide what kind of journalism they want.\"\n\nThere was a long silence.\n\n\"It's **plausible**,\" said Yuko slowly. \"Some newspapers in Europe do this. Readers own them.\"\n\n\"It's a **hypothetical** idea,\" said Min-ji. \"Will Japanese readers do it? Japanese people are **sceptical** of new things.\"\n\n\"**Skeptical**,\" said Ben, who was Australian. \"With a K.\"\n\n\"Both are correct,\" said Aiko quietly. Everyone turned to look at her. It was the first time she had spoken in a meeting for a month.\n\nThey decided to try. It was **imperative** to act fast. Minh wrote a **pragmatic** plan: clear, simple, realistic. Members would pay three thousand yen a month. They would get a vote at a yearly meeting. They would get a small magazine every month. And they would get the knowledge that they owned their news.\n\nThe plan was **robust**, but the first week was hard. Only two hundred people joined. \"It's not enough,\" said Ben. \"We need two thousand.\"\n\nThen something happened. A **notorious** politician, a man famous for scandals, attacked Open Tokyo in a speech. He called them \"**irrelevant** troublemakers\" and \"a small website nobody reads.\" The speech went viral. It was **overwhelming**: thousands of people shared it, most of them angry at the politician.\n\nThe next day, five hundred people joined. The day after, a thousand. By the end of the month, they had three thousand members.\n\n\"We should thank him,\" said Ben, laughing. \"He's our best salesman.\"\n\nYuko was more serious. \"The **paramount** thing now is to deserve this trust,\" she said. \"These people believe in us. We must not disappoint them.\"\n\nMinh learned something important from the crisis. Good journalism was **indispensable** to democracy, but it was also fragile. It needed support. Not from governments, not from big companies, but from ordinary people. \"The **inherent** problem with news,\" he wrote in a column, \"is that good journalism is expensive and bad journalism is cheap. The solution is not **rudimentary**. But it's simple: if you want good news, pay for it.\"\n\nHis column was widely shared. A famous writer, a **prolific** author of fifty books, wrote to support them. A professor said it was the most **intrinsic** question of modern media. Even the **predominant** newspaper in Japan wrote an article about the \"member model.\"\n\nOpen Tokyo survived. More than that: it grew. By the end of the year, it had ten thousand members. \"**Scarce** money, plenty of trust,\" said Yuko. \"I'll take that.\"\n\nThere was one **implicit** lesson in all this, Minh thought. Nobody said it, but everyone understood: people care about the truth more than we think. You just have to ask them. It was not a **mundane** lesson. Nor was it **obscure**. It was the most important thing he had learned in Japan. Talent is **innate** for some, he thought, but trust has to be earned. And the editor's rule, as **lenient** as she was strict, was always the same: the facts are not **prevalent**; they are rare. Protect them.", "words": 685, "new": [{"w": "futile", "p": "adj", "vi": "vô ích"}, {"w": "hypothetical", "p": "adj", "vi": "mang tính giả định"}, {"w": "imperative", "p": "adj/n", "vi": "cấp thiết"}, {"w": "implicit", "p": "adj", "vi": "ngầm hiểu"}, {"w": "inadequate", "p": "adj", "vi": "không đầy đủ"}, {"w": "incompatible", "p": "adj", "vi": "không tương thích"}, {"w": "indispensable", "p": "adj", "vi": "không thể thiếu"}, {"w": "inherent", "p": "adj", "vi": "vốn có"}, {"w": "innate", "p": "adj", "vi": "bẩm sinh"}, {"w": "intrinsic", "p": "adj", "vi": "nội tại"}, {"w": "irrelevant", "p": "adj", "vi": "không liên quan"}, {"w": "legitimate", "p": "adj/v", "vi": "hợp pháp, chính đáng"}, {"w": "lenient", "p": "adj", "vi": "khoan hồng"}, {"w": "mundane", "p": "adj", "vi": "tẻ nhạt thường ngày"}, {"w": "notorious", "p": "adj", "vi": "khét tiếng"}, {"w": "obscure", "p": "adj/v", "vi": "ít người biết"}, {"w": "overwhelming", "p": "adj", "vi": "choáng ngợp"}, {"w": "paramount", "p": "adj", "vi": "tối thượng, quan trọng nhất"}, {"w": "plausible", "p": "adj", "vi": "hợp lý, có vẻ đúng (nhưng chưa chắc)"}, {"w": "pragmatic", "p": "adj", "vi": "thực dụng, thiết thực, thực tế"}, {"w": "predominant", "p": "adj", "vi": "chiếm ưu thế"}, {"w": "prevalent", "p": "adj", "vi": "phổ biến"}, {"w": "prolific", "p": "adj", "vi": "sáng tác nhiều"}, {"w": "robust", "p": "adj", "vi": "mạnh mẽ, bền chắc"}, {"w": "rudimentary", "p": "adj", "vi": "sơ đẳng"}, {"w": "scarce", "p": "adj/adv", "vi": "khan hiếm"}, {"w": "sceptical", "p": "adj", "vi": "hoài nghi"}, {"w": "skeptical", "p": "adj", "vi": "hoài nghi"}]}, {"id": "W42-2", "title": "The First Wedding", "body": "In September, Minh and Hana got married in Japan. It was the first of three weddings.\n\nThe Japanese wedding was traditional. It took place at a Shinto shrine in Hana's hometown, by the sea. Only family attended the ceremony: Hana's family and Minh's parents and Lan, who had come from Vietnam and Tokyo.\n\nMinh's parents were nervous. They didn't speak Japanese. They didn't know the customs. \"What if we do something wrong?\" said his mother. \"What if we embarrass you?\"\n\n\"You won't,\" said Minh. \"Hana's family will help.\"\n\nAnd they did. Hana's mother took Minh's mother by the hand and showed her everything. She explained each step with gestures and a little English. By the end, the two mothers were laughing together like old friends.\n\nThe ceremony was **profoundly** beautiful. It was quiet and slow, full of meaning. Hana wore a white kimono and a large white hood. Minh wore a black kimono. A priest performed the rituals. They drank sake from three small cups, three sips each. \"It's for the **unprecedented** joining of two families,\" Hana explained later. \"Well, not unprecedented. But special.\"\n\nMinh had expected the ceremony to be **superficially** formal, a performance, and he had not wanted to worry **unduly** about it. But it was not. **Seemingly** simple actions had deep meaning. Every movement was careful and **intrinsically** meaningful. Every sip was a promise.\n\nAfter the ceremony, there was a party at a restaurant by the harbor. Here, things were more relaxed. Hana's father gave a speech. He was not usually emotional. But he **vividly** described Hana as a little girl: stubborn, curious, always asking questions. \"When she went to England, I was afraid,\" he said. \"When she came back with a Vietnamese man, I was more afraid. But now I see. She chose well.\"\n\nHana cried. Minh cried. Both mothers cried.\n\nThen Minh's father gave a speech in Vietnamese. Lan translated into Japanese. He spoke **explicitly** about his feelings, which was very unusual for him. \"Six years ago, my son left home with one suitcase,\" he said. \"I was proud and sad. Today, I am **wholeheartedly** happy. He has found a home. Not in England, not in Japan, not in Vietnam. In a person.\"\n\nThe party went on until late. There was a lot of food: sushi, tempura, grilled fish. Lan sang a Vietnamese song. Hana's younger sister sang a Japanese one. Then everyone tried karaoke, which was **invariably** terrible and **inevitably** funny.\n\nAt one point, Minh **inadvertently** knocked a glass of beer onto Hana's father. Everyone went silent. Minh's face went red. Then Hana's father started to laugh. \"Now you're really family,\" he said. \"In my family, everyone spills beer on me.\"\n\nThe weather was **volatile** that evening: one minute sunny, the next minute raining, then sunny again. \"It's lucky,\" said Hana's grandmother. \"Rain at a wedding means a long marriage.\"\n\n\"In Vietnam, too,\" said Minh's mother, through Lan. \"And in England,\" said Minh, \"it rains at every wedding, so every marriage is long.\"\n\nThere was one **stringent** rule at the Japanese wedding: no phones during the ceremony. Lan, who usually filmed everything, had to put hers away. Afterwards, she complained. \"I have no photos! It's the most important day, and I have nothing!\"\n\n\"You have your memory,\" said her mother. \"That's better.\"\n\n\"Memories don't have filters,\" said Lan.\n\nBy the end of the night, Minh was exhausted but happy. The wedding had been **vastly** more emotional than he expected. He had thought of it as a formality. **Conversely**, it was the most important day of his life so far.\n\n\"How do you feel?\" Hana asked, as they walked by the sea at midnight.\n\n\"Married,\" said Minh. \"**Significantly** married.\"\n\nHana laughed. \"Two more weddings to go.\"\n\n\"**Arguably**, one is enough,\" said Minh.\n\n\"Tell that to your mother,\" said Hana. \"And Grandma Rose.\"\n\nMinh **implicitly** understood: there was no escape. Three weddings it would be. The day had been **predominantly** happy, but it was not **trivial**. It was not **tedious** either, even the long ceremony. Its meaning was **tangible**: he could feel it, like the ring on his finger. Love, he thought, was not **ubiquitous** or easy. You had to choose it, again and again, with **vigorous** effort. But it was **viable**. **Subsequent** days would prove it.", "words": 711, "new": [{"w": "stringent", "p": "adj", "vi": "nghiêm ngặt"}, {"w": "subsequent", "p": "adj", "vi": "tiếp theo, sau đó"}, {"w": "superficial", "p": "adj", "vi": "hời hợt, bề ngoài"}, {"w": "tangible", "p": "adj/n", "vi": "hữu hình"}, {"w": "tedious", "p": "adj", "vi": "tẻ nhạt"}, {"w": "trivial", "p": "adj", "vi": "tầm thường"}, {"w": "ubiquitous", "p": "adj", "vi": "có mặt khắp nơi"}, {"w": "unprecedented", "p": "adj", "vi": "chưa từng có tiền lệ"}, {"w": "viable", "p": "adj", "vi": "khả thi, có thể thực hiện được"}, {"w": "vigorous", "p": "adj", "vi": "mạnh mẽ"}, {"w": "volatile", "p": "adj", "vi": "dễ biến động"}, {"w": "arguably", "p": "adv", "vi": "có thể cho rằng, được cho là"}, {"w": "conversely", "p": "adv", "vi": "ngược lại"}, {"w": "explicitly", "p": "adv", "vi": "một cách rõ ràng"}, {"w": "implicitly", "p": "adv", "vi": "một cách ngầm định"}, {"w": "inevitably", "p": "adv", "vi": "không thể tránh khỏi"}, {"w": "invariably", "p": "adv", "vi": "luôn luôn"}, {"w": "predominantly", "p": "adv", "vi": "chủ yếu"}, {"w": "profoundly", "p": "adv", "vi": "sâu sắc"}, {"w": "seemingly", "p": "adv", "vi": "có vẻ"}, {"w": "significantly", "p": "adv", "vi": "đáng kể"}, {"w": "superficially", "p": "adv", "vi": "về bề ngoài"}, {"w": "unduly", "p": "adv", "vi": "quá mức"}, {"w": "vastly", "p": "adv", "vi": "rất nhiều"}, {"w": "vividly", "p": "adv", "vi": "một cách sống động"}, {"w": "wholeheartedly", "p": "adv", "vi": "hết lòng"}, {"w": "inadvertently", "p": "adv", "vi": "vô tình"}, {"w": "intrinsically", "p": "adv", "vi": "về bản chất"}]}, {"id": "W42-3", "title": "The Second Wedding", "body": "In November, they had their second wedding in Vietnam. It was very different from the Japanese one. If the Japanese wedding was quiet and simple, the Vietnamese wedding was loud and enormous.\n\nMinh's mother had invited three hundred people. \"Three hundred?\" said Minh. \"We don't know three hundred people!\"\n\n\"I know three hundred people,\" said his mother. \"That's enough.\"\n\nThe wedding was **ostensibly** a family event. In reality, it was a neighborhood festival. Minh's mother **purportedly** had a plan for everything. The planning was full of **controversy**. Minh's mother wanted a big traditional wedding. Hana's parents, who had flown to Vietnam, were overwhelmed. Minh's grandmother had her own opinions about everything. There was a constant **dilemma**: whose traditions to follow?\n\nThey had to make a **compromise**. Minh's mother made a **concession**: the wedding would be big, but it would include some Japanese elements. Hana's parents made a concession too: they would wear Vietnamese clothes for the ceremony. \"It's not about **dominance**,\" said Minh **unequivocally**. \"It's about respect. Both families are important.\"\n\nThere was also a **discrepancy** between the plans and the budget. Minh's mother wanted a big hall, a band and a ten-course meal. The money was not enough. \"We have **constraints**,\" said Minh's father. \"We're not rich.\"\n\n\"Then we'll cook ourselves,\" said Minh's mother. And she did. With fifty neighbors and relatives, she cooked for three days.\n\nThe wedding started early in the morning with a traditional ceremony at the house. Minh's family went to Hana's \"house,\" a hotel room in Hanoi, to ask for permission to marry her. They brought gifts in red boxes: tea, fruit, cakes, and betel leaves, a traditional symbol of marriage. Hana's parents, who had learned their part, accepted the gifts.\n\nHana wore a red áo dài. Minh wore a blue one. Hana's mother cried when she saw her daughter in Vietnamese clothes. \"She looks like she was born here,\" she said.\n\nThen there was the ceremony at the family altar. Minh and Hana bowed to Minh's ancestors. They lit incense. Minh's grandmother, now eighty-nine, blessed them. Her hands were shaking, but her voice was strong.\n\n\"I have lived through war, hunger and **adversity**,\" she said. \"I have seen this family survive everything. Today, I see a new beginning. A family that connects two countries. This is my **endeavor** completed: to see my grandson happy.\"\n\nMinh couldn't speak. He just held her hands.\n\nThe party was in a big tent in the street. The whole neighborhood came. There was music, dancing and a lot of food. Uncle Hai, as always, drank too much and gave a speech that nobody understood. Tuan, Minh's old friend, played with his band. They were terrible, and everyone loved them.\n\nHana's father sat next to Minh's father. They didn't speak the same language. But by the end of the night, they had a rapport: they were drinking rice wine together and laughing at jokes neither understood. \"There's a strange **analogy** between our fathers,\" said Hana. \"Both quiet, both stubborn, both secretly emotional.\"\n\nThe wedding showed the **diversity** of the families: Vietnamese grandmothers, Japanese cousins, a Spanish best man (Sam had flown in), an English cousin (Mia, of course). But underneath the **complexity**, there was something simple. Everyone wanted the same thing: for Minh and Hana to be happy.\n\nThere was one more surprise. Ms. Huong, Minh's old English teacher, came with a gift. It was a framed copy of his first essay, the one he wrote at sixteen about wanting to see the world. \"I kept it,\" she said. \"I knew one day you'd want to see it.\"\n\nMinh read it. His English had been terrible. But the essence was there: a boy who wanted something more.\n\n\"The **criteria** for success are not money or fame,\" Ms. Huong said. \"They're **commitment**, **autonomy**, **accountability**, kindness. You have all of them.\"\n\nAt the end of the night, Minh and Hana sat on the roof of the house, where Minh had sat as a boy, watching the river. The party was still going downstairs. The **anticipation** of the third wedding, in Scotland, was already in the air.\n\n\"Are you happy?\" Hana asked.\n\n\"I'm in **equilibrium**,\" said Minh. \"Balanced. Everything is where it should be.\"\n\n\"That's a very academic answer,\" said Hana.\n\n\"I've been reading too many reports,\" said Minh. \"But yes. I'm happy. There's an **abundance** of happiness. Too much to measure.\"\n\nHis mother's **disposition**, everyone agreed, had never been sunnier. And the **credibility** of her claim to know three hundred people was confirmed: three hundred and twelve came. Hana said Minh's family had a strange **coherence**, a single entity: noisy, warm and impossible to say no to. There was no **deficiency** of love anywhere. It was a **criterion** Minh would use for the rest of his life.", "words": 797, "new": [{"w": "ostensibly", "p": "adv", "vi": "bề ngoài có vẻ"}, {"w": "purportedly", "p": "adv", "vi": "được cho là"}, {"w": "unequivocally", "p": "adv", "vi": "dứt khoát rõ ràng"}, {"w": "abundance", "p": "n", "vi": "sự phong phú"}, {"w": "accountability", "p": "n", "vi": "trách nhiệm giải trình"}, {"w": "adversity", "p": "n", "vi": "nghịch cảnh"}, {"w": "analogy", "p": "n", "vi": "sự tương đồng"}, {"w": "anticipation", "p": "n", "vi": "sự mong đợi"}, {"w": "autonomy", "p": "n", "vi": "quyền tự chủ"}, {"w": "coherence", "p": "n", "vi": "sự mạch lạc"}, {"w": "commitment", "p": "n", "vi": "sự cam kết"}, {"w": "complexity", "p": "n", "vi": "sự phức tạp"}, {"w": "compromise", "p": "n/v", "vi": "sự thỏa hiệp"}, {"w": "concession", "p": "n", "vi": "sự nhượng bộ"}, {"w": "constraint", "p": "n", "vi": "sự ràng buộc"}, {"w": "controversy", "p": "n", "vi": "tranh cãi"}, {"w": "credibility", "p": "n", "vi": "độ tin cậy"}, {"w": "criterion", "p": "n", "vi": "tiêu chí"}, {"w": "criteria", "p": "n", "vi": "tiêu chí"}, {"w": "deficiency", "p": "n", "vi": "sự thiếu hụt"}, {"w": "dilemma", "p": "n", "vi": "tình huống tiến thoái lưỡng nan"}, {"w": "discrepancy", "p": "n", "vi": "sự khác biệt"}, {"w": "disposition", "p": "n", "vi": "tính khí"}, {"w": "diversity", "p": "n", "vi": "sự đa dạng"}, {"w": "dominance", "p": "n", "vi": "sự thống trị"}, {"w": "endeavor", "p": "n/v", "vi": "sự nỗ lực"}, {"w": "equilibrium", "p": "n", "vi": "trạng thái cân bằng"}]}, {"id": "W42-4", "title": "The Third Wedding", "body": "In April, they had their third wedding, in Scotland, at Margaret's cottage by the river.\n\nIt was small: only thirty people. The Parkers, of course. Grace from the Gazette. Daniel and Pat from The Blue Cup. Sam and his new girlfriend. Fiona, Margaret's daughter. Gareth, Megan and Ffion from Wales. Lan and Minh's parents flew from Vietnam; Hana's parents flew from Japan. It was the first time both families had been in England.\n\nGrandma Rose had made Hana's dress, as she had promised. It was white silk, simple and beautiful. She was eighty-seven now and her eyes were weak, so Mia had helped with the small stitches. But the design, the cutting and the sewing were all Grandma Rose's.\n\n\"It's my legacy,\" she said. \"My last dress. The best one.\"\n\nThe ceremony was in the garden, by the river. The spring flowers were out: the bulbs that Mia and Fiona had planted three years ago, red and yellow and white. A local registrar performed the ceremony. It was short and simple.\n\nThen there were speeches.\n\nTom spoke first, as the \"English father.\" He was funny and emotional at the same time. \"When Minh came to our house, I tried to teach him American English,\" he said. \"He learned British English instead, to annoy me. That's when I knew he'd be family.\"\n\nMia spoke next. She showed a painting she had made: two rivers meeting, with faces from every chapter of Minh's life. \"There's no **stereotype** for a family,\" she said. \"No single framework. You build it yourself.\"\n\nThen Grace spoke. She was not good at speeches, she said, but she would try. \"I've worked with many young journalists,\" she said. \"Most have talent. Few have **integrity**. Minh has both. His **stance** on truth has never changed, even under **scrutiny**, even when it was hard. I'm proud to have been his editor. I'm prouder to be his friend.\"\n\nThen Grandma Rose stood up. Everyone went quiet. She held Leo's arm for balance.\n\n\"I want to talk about rivers,\" she said. \"This river ran past my friend Margaret's house for forty years. She painted it every day. She wrote me letters by it, letters she never sent. She was waiting for me.\"\n\nHer voice shook. She stopped, then continued.\n\n\"We lost each other for sixty years because of a **misconception**: we thought pride was more important than love. That's the **paradox** of youth: you think you have all the time in the world, so you waste it. Minh and Mia found her for me. They gave me two years with my best friend before she died. That was the greatest gift of my life.\"\n\nShe looked at Minh and Hana.\n\n\"The **essence**, the **premise** of a good marriage is simple. Talk. Forgive. Never let an argument last longer than a day. And never, ever let pride win. That's my **rationale**. That's all I know.\"\n\nNobody had dry eyes. Even Grace was wiping hers.\n\nAfter the speeches, there was a **dialogue** between the two families in three languages. Lan translated between Vietnamese and English. Hana translated between Japanese and English. Sometimes they made mistakes, and everyone laughed. The **implication** of all this, Minh thought, was clear: love was the only language everyone understood.\n\nMinh and Hana walked down to the river alone for a moment. The water was fast and clear in the spring sunshine.\n\n\"Three weddings,\" said Hana. \"Three countries. Three rivers.\"\n\n\"The **transition** from one life to the next,\" said Minh. \"That's what this feels like. A new chapter.\"\n\n\"What's next?\" asked Hana.\n\nMinh had been thinking about it for months. He had a scenario in his head, a plan. But he didn't want to **speculate**. Not yet.\n\n\"Let's talk tomorrow,\" he said. \"Today, let's just be here.\"\n\nThey stood by the river for a long time. Behind them, the party continued: music, laughter, Leo telling everyone about orangutans, Mia painting the guests, Grandma Rose sitting in Margaret's chair with a glass of whisky, smiling.\n\nThere was a mechanism to happiness, Minh thought: people, place, time. And a **momentum**: once it started, it kept going. He didn't want to analyze it. He wanted to live it.\n\nThere was no **speculation** about whether the day had been perfect. It had been. Everyone could **infer** that from Grandma Rose's face. The **inference** was easy. And her **ideology**, if she had one, was simple: love first, pride never. It would be the ethics of their marriage too. They had both learned that **vulnerability** was not weakness. Grandma Rose's **inclination** was to keep everything short, but this day she let it run long. There was a **provision** of cake for everyone, as there always is in a Grandma Rose **paradigm**. No **prerequisite** for joy except showing up. And the **validity** of the day, Grace said, didn't need checking. It was **persuasive** on its own.", "words": 809, "new": [{"w": "essence", "p": "n", "vi": "bản chất"}, {"w": "ideology", "p": "n", "vi": "hệ tư tưởng"}, {"w": "implication", "p": "n", "vi": "hàm ý"}, {"w": "inclination", "p": "n", "vi": "thiên hướng"}, {"w": "integrity", "p": "n", "vi": "chính trực"}, {"w": "misconception", "p": "n", "vi": "quan niệm sai"}, {"w": "momentum", "p": "n", "vi": "đà"}, {"w": "paradigm", "p": "n", "vi": "mô hình"}, {"w": "paradox", "p": "n", "vi": "nghịch lý"}, {"w": "premise", "p": "n", "vi": "tiền đề"}, {"w": "prerequisite", "p": "n", "vi": "điều kiện tiên quyết"}, {"w": "provision", "p": "n/v", "vi": "sự cung cấp"}, {"w": "rationale", "p": "n", "vi": "cơ sở lý luận"}, {"w": "scrutiny", "p": "n", "vi": "sự xem xét kỹ"}, {"w": "stance", "p": "n", "vi": "lập trường"}, {"w": "stereotype", "p": "n", "vi": "khuôn mẫu định kiến"}, {"w": "transition", "p": "n/v", "vi": "sự chuyển đổi"}, {"w": "validity", "p": "n", "vi": "tính hợp lệ, độ giá trị (mức độ nghiên cứu đo đúng cái cần đo)"}, {"w": "vulnerability", "p": "n", "vi": "tính dễ tổn thương"}, {"w": "persuasive", "p": "adj", "vi": "thuyết phục"}, {"w": "dialogue", "p": "n", "vi": "đối thoại"}, {"w": "speculate", "p": "v", "vi": "suy đoán"}, {"w": "speculation", "p": "n", "vi": "sự suy đoán"}, {"w": "infer", "p": "v", "vi": "suy ra"}, {"w": "inference", "p": "n", "vi": "sự suy luận"}]}, {"id": "W42-5", "title": "The Decision", "body": "The day after the wedding, Minh and Hana sat in Margaret's conservatory with cups of tea. Outside, it was raining. The river was loud.\n\n\"So,\" said Hana. \"What's next? You said you had a plan.\"\n\nMinh had been thinking about it for months. He had to **comprehend** his own feelings first. Now he was ready.\n\n\"I want to come back to England,\" he said. \"To Riverford.\"\n\nHana didn't look surprised. \"Why?\"\n\n\"I love Japan,\" said Minh. \"And Open Tokyo will be fine without me now. But I keep thinking about Riverford. Grace is getting older. The Gazette needs new ideas. And I have an idea.\"\n\n\"Go on.\"\n\n\"A podcast,\" said Minh. \"Called Riverford Talks. Every week, I'd interview someone. People from the town, experts, ordinary people. About big questions: education, the environment, crime, technology, health. Like the IELTS topics we studied years ago.\" He laughed. \"But real. Real people, real conversations.\"\n\n\"You'd be the host?\"\n\n\"I'd be the host. And Grace would help. And the Gazette would publish the best conversations as articles.\"\n\nHana thought about it. \"What about my job?\"\n\n\"There are hospitals in England. Kate says Riverford Hospital needs nurses. You could even work with Dr. Adeyemi again.\"\n\nHana was quiet for a long time. Minh waited. He didn't want to **presume** anything. This had to be her decision too.\n\n\"I'll miss Japan,\" she said finally. \"My parents. My friends. The food.\" She paused. \"But I've missed England too. The rain. The Parkers. Even the bad coffee.\" She smiled. \"And I want our children to know Grandma Rose.\"\n\nMinh almost dropped his tea. \"Our children?\"\n\n\"Not yet,\" said Hana, laughing. \"But one day. **Cognitive** development is better in children who grow up with grandparents. I read it in a study.\"\n\n\"Is that true?\"\n\n\"Probably,\" said Hana. \"It's not **irrational**, anyway.\"\n\nThey called Grace that evening. Minh explained his idea. It was a little **verbose**; he was nervous. Grace listened without interrupting. Then she said, \"Yes.\"\n\n\"Yes?\"\n\n\"Yes. I've been thinking about something similar. Podcasts are **cutting-edge**. Every newspaper wants one. And you have the voice for it. You have **empathy**, **tact** and a good sense of **nuance**. People like talking to you. You build **rapport** quickly.\"\n\n\"Thank you,\" said Minh.\n\n\"Don't thank me yet,\" said Grace. \"You'll need to be **self-confident** but not **self-centered**. You'll interview people who disagree with each other. You'll need to **mediate** like a **mediator**, let both sides talk, and never take sides. When someone says something false, you'll need to **refute** it politely. When they **rebut** you, you'll need to listen. Sometimes you'll need to **concede** a point. You'll need to **reiterate** questions people try to avoid. And when someone **alludes** to something or **insinuates** something without saying it, you'll need to ask them to say it clearly.\"\n\n\"That's a lot,\" said Minh.\n\n\"That's journalism,\" said Grace. \"Welcome back.\"\n\nAfter the call, Minh and Hana went for a walk by the river. The rain had stopped. Everything smelled fresh and green.\n\n\"Are you scared?\" asked Hana.\n\n\"A little,\" said Minh. \"It's a new thing. **State-of-the-art** equipment, a new kind of storytelling. I've never done it.\"\n\n\"You've never done anything before you did it,\" said Hana. \"That's how everything starts.\"\n\nMinh laughed. \"That's very wise.\"\n\n\"Grandma Rose said it,\" said Hana. \"At the wedding. I'm just repeating.\"\n\nOver the next month, they planned everything. Minh talked to Sam about designing the podcast. Sam had a whole studio now: \"Very **avant-garde**,\" he said. They talked about **e-commerce** for merchandise, **e-learning** programs for students, a **fuel-efficient** electric van to record outside. Sam suggested that the first episode be about the history of Riverford, from the **Anglo-Saxon** village to today.\n\n\"No,\" said Minh. \"The first episode is about something more important.\"\n\n\"What?\"\n\n\"Rivers,\" said Minh. \"Why towns are built by rivers. Why people meet by rivers. And why they come back.\"\n\nSam laughed. \"Of course it is.\"\n\nIn June, Minh and Hana moved back to England. Their **comprehension** of the word \"home\" had changed completely. Home was not one place. It was many places, connected by people. And for now, it was a small town by a river, with an old castle on a hill, where a family was waiting for them at the station.", "words": 708, "new": [{"w": "presume", "p": "v", "vi": "cho rằng"}, {"w": "comprehend", "p": "v", "vi": "hiểu thấu"}, {"w": "comprehension", "p": "n", "vi": "khả năng hiểu"}, {"w": "cognitive", "p": "adj", "vi": "thuộc nhận thức"}, {"w": "irrational", "p": "adj", "vi": "phi lý"}, {"w": "verbose", "p": "adj", "vi": "dài dòng"}, {"w": "nuance", "p": "n", "vi": "sắc thái / điểm tinh tế"}, {"w": "rapport", "p": "n", "vi": "mối quan hệ hoà hợp / sự đồng cảm"}, {"w": "empathy", "p": "n", "vi": "sự đồng cảm / thấu cảm"}, {"w": "tact", "p": "n", "vi": "sự tế nhị"}, {"w": "mediate", "p": "v", "vi": "hòa giải"}, {"w": "mediator", "p": "n", "vi": "người hòa giải"}, {"w": "refute", "p": "v", "vi": "bác bỏ"}, {"w": "rebut", "p": "v", "vi": "phản bác"}, {"w": "concede", "p": "v", "vi": "thừa nhận, nhượng bộ"}, {"w": "reiterate", "p": "v", "vi": "nhắc lại"}, {"w": "allude", "p": "v", "vi": "ám chỉ"}, {"w": "insinuate", "p": "v", "vi": "ám chỉ"}, {"w": "self-confident", "p": "adj", "vi": "tự tin"}, {"w": "self-centered", "p": "adj", "vi": "chỉ biết bản thân"}, {"w": "fuel-efficient", "p": "adj", "vi": "tiết kiệm nhiên liệu"}, {"w": "e-commerce", "p": "n", "vi": "thương mại điện tử"}, {"w": "e-learning", "p": "n", "vi": "học trực tuyến"}, {"w": "cutting-edge", "p": "adj", "vi": "tiên tiến nhất"}, {"w": "state-of-the-art", "p": "adj", "vi": "hiện đại nhất"}, {"w": "avant-garde", "p": "adj/n", "vi": "tiên phong"}, {"w": "Anglo-Saxon", "p": "n/adj", "vi": "thuộc người Anglo Saxon"}]}, {"id": "W43-1", "title": "Riverford Talks, Episode 1: Rivers", "body": "This is the first episode of Minh's podcast, Riverford Talks. Each episode is a conversation about a big question. This is a shortened version, published in the Riverford Gazette.\n\nMinh: Hello, and welcome to Riverford Talks. I'm Minh. For the next year, every week, I'll be talking to people about questions that matter. Today, our first episode is about rivers. My guest is Dr. Helen Ward, a historian who has written five books about Riverford. Welcome.\n\nHelen: Thank you. I'm delighted to be here.\n\nMinh: Let's start with a simple question. Why is Riverford here? Why did people build a town on this spot?\n\nHelen: Because of the river, of course. Most people thought it was simple, but it's based on many things. According to the oldest records, people were living here more than two thousand years ago. Archaeologists have found the remains of a small village near the old bridge. They discovered tools, pots and even a sword. The finding was announced in the 1990s and received a national award.\n\nMinh: Why did they choose this place?\n\nHelen: A river means water, food and transport. In the past, it also meant **defense**. The river was a natural wall. That's why the castle was built on the hill: to protect the crossing. The castle was royal for many years. A king stayed there in 1215.\n\nMinh: I didn't know that.\n\nHelen: Most people don't. The castle's presence shaped the whole town. Its **presence** is the reason the market grew. People came to sell to the soldiers. Buying and selling made the town bigger and bigger.\n\nMinh: In my own background, in Vietnam, my town was also built by a river. It flooded every year.\n\nHelen: Floods are part of the story everywhere. Here, too. The flood five years ago, which you wrote about, was the worst in fifty years. But compared to floods in the past, it was small. In 1872, the water was two miles wide. A photographer took a famous shot of it. Hundreds of people lost their homes.\n\nMinh: In the mid 1800s, didn't the factory employees live right by the water?\n\nHelen: Yes. They cannot have had much choice.\n\nMinh: Why do people stay, then? If the river is dangerous?\n\nHelen: That's the interesting thing. I've been writing about it for years. People don't leave. They think the beauty and the benefits are worth the risk. And there's an emotional part, too. A river becomes part of your sense of self. Your identity. People who grow up by a river often feel lost without one.\n\nMinh: I understand that. When I was a child, playing by the river was my favourite thing. When I was in Tokyo, I lived near a river. I decided I couldn't live without one.\n\nHelen: Exactly. There's a lot of thinking about this in psychology. Water calms people. Studies show that people who live near water report lower stress. Even the sound of water, **hearing** it through a window, can help you sleep.\n\nMinh: Let's talk about the river today. What are the problems?\n\nHelen: Pollution, mostly. Farm chemicals, sewage, drugs from people's medicine. Many fish species have gone. The river's health is limited. There's also a lack of investment. The council has a small unit that looks after the river, but it has only three workers.\n\nMinh: Who should take leadership on this?\n\nHelen: Everyone. The council, the government, farmers, ordinary people. Senior politicians talk about it but don't act. We need leaders with real skills, not just speeches.\n\nMinh: What's the best option, in your opinion?\n\nHelen: Education. If children understand the river, they'll protect it. My chief hope is that every school takes children to the river at least once a year. Show them the fish, the birds, the history. Taking them there is better than any book.\n\nMinh: Last question. If you could change one thing about Riverford, what would it be?\n\nHelen: I'd bring people closer to the river. For a long time, the town turned its back on it. Factories, roads, car parks. I'd like more paths, more parks, more places where people can stick their feet in the water on a hot day.\n\nMinh: That sounds perfect. Dr. Helen Ward, thank you.\n\nHelen: Thank you. And welcome home, Minh.\n\nAfter the recording, Minh sat in the studio for a long time. The first episode was done. Grace, who had been holding her breath in the next room, came in. \"Not bad,\" she said. \"Too long. But not bad.\" From Grace, that was a five-star review. The details of the episode were later published in the Gazette, related articles appeared in two national newspapers, and an officer from the Environment Agency called the next day. A female student from the university wrote that she wanted to study river history. Minh had started something.", "words": 806, "new": [{"w": "defense", "p": "n", "vi": "phòng thủ"}, {"w": "hearing", "p": "n/adj", "vi": "thính giác"}, {"w": "presence", "p": "n", "vi": "sự có mặt"}]}, {"id": "W43-2", "title": "Riverford Talks, Episode 2: Work", "body": "Minh: Welcome to Riverford Talks. This week's question: why do we work? And how is work changing? My guests are Daniel Hughes, owner of The Blue Cup café, and Dr. Priya Shah, an economist at the university. Welcome to both of you.\n\nDaniel: Thanks for having us.\n\nPriya: Happy to be here.\n\nMinh: Daniel, you left a job in a bank to open a café. Why?\n\nDaniel: Shame, honestly. Not shame about the bank. Shame about myself. I was making good money, but I hated every day. I felt it was a **shame** to waste my life. My dad's words inspired me: \"Do what you love, or love what you do.\" So I quit.\n\nMinh: And do you love it?\n\nDaniel: Most days. Not the days when the coffee machine breaks. But I'm **inspired** by the people. Every morning, the same faces. A café is a small community.\n\nMinh: Priya, is Daniel typical? Are more people leaving big jobs for small ones?\n\nPriya: It's not typical, but it's growing. After the pandemic, many people thought about their lives. They asked: what is the importance of my work? Is it worth the stress? **Typically**, people only change jobs for money. Now, many change for meaning.\n\nMinh: What else is changing?\n\nPriya: Technology, mostly. Robots and computers are doing more jobs. In manufacturing, for example, factories need fewer workers than before. In **mining**, machines do the dangerous work. Even in offices, software does many tasks. Some jobs will disappear. New ones will appear.\n\nMinh: Should people be worried?\n\nPriya: Somewhat. There will be some **resistance** to change, as there always is. In history, every new technology met resistance. But in the end, more jobs were created than lost. The question is whether people can learn new skills fast enough.\n\nDaniel: Can a robot make coffee?\n\nPriya: It can. But can it remember your name and ask about your daughter? That's the difference.\n\nDaniel: Good. I'm safe then.\n\nMinh: Let's talk about different ways of working. Daniel, your café is owned by its customers. A **joint** ownership. How does that work?\n\nDaniel: Five hundred people own shares. We have a meeting once a year. They vote on big decisions. It's a combination of a business and a club. Some people thought it would be a **massive** problem: too many owners, too many opinions. But it works. Mostly.\n\nPriya: That's actually a growing model. Co-operatives, joint ownership, employee-owned businesses. Unlike traditional companies, the profits stay in the community.\n\nMinh: What about people who work alone? Freelancers, solo workers?\n\nPriya: Their number is growing fast. The good side is freedom. The bad side is risk. No fixed salary, no sick pay. Depending on the job, it can be wonderful or terrible.\n\nMinh: Daniel, what's the best thing about running a small business?\n\nDaniel: Freedom. And the **serving**. I mean, the moment of serving someone something good. A good **serving** of cake, a warm cup. It sounds random, but it makes me happy.\n\nMinh: And the worst?\n\nDaniel: Paperwork. Taxes. Requirements from the council. Every year, more rules. And the warning letters, if you make a small error.\n\nPriya: That's every small business owner's favourite complaint.\n\nMinh: Last question to both. What's your advice to young people starting work?\n\nPriya: Learn to learn. The skills you need will change. The ability to learn new ones is the most valuable thing.\n\nDaniel: Find work that matters to you. And be kind to the people you work with. Good relations at work make everything easier. Info and money are important. But people are more important.\n\nMinh: Daniel and Priya, thank you.\n\nAfter the episode, The Blue Cup got many new customers. People came in and said, \"I heard you on the podcast.\" Daniel put up a sign: \"As heard on Riverford Talks.\" Minh said it was the first time anyone had used his name in an advertisement. \"Get used to it,\" said Daniel.\n\nThe café's special **offering** that week was a \"podcast cake\": chocolate and coffee combined in one. It sold out by noon. Nearby shops asked to sponsor the next episode. Even the mayor, who was elected on a promise to support local business, came in for a slice. Daniel's bell over the door rang all day.\n\nThat night, after closing, Daniel sat with Minh. \"People want to talk about real things,\" he said. \"Not just celebrities and football. That's the hole you're filling.\" He laughed. \"Max one episode a week, though. My kitchen can't take more cake.\"\n\nTwo weeks later, the university introduced a public session on the future of work. It was intended for students, but it was open to all citizens. People from the arts, from shops and from the old factories came. The flow of ideas was amazing. One old factory worker talked about the origin of the town's industry: for a hundred years, Riverford made goods for the whole country, until the factory closed. \"It was a blow to the town,\" he said. \"But we survived.\" Minh thought the evening was an object lesson in what a town could do when people talked. At the ending, everyone stood up, and the motion of three hundred chairs sounded like thunder.", "words": 868, "new": [{"w": "massive", "p": "adj/n", "vi": "đồ sộ"}, {"w": "joint", "p": "adj/n/v", "vi": "chung"}, {"w": "inspired", "p": "adj", "vi": "được truyền cảm hứng"}, {"w": "serving", "p": "adj/n", "vi": "phần ăn"}, {"w": "typically", "p": "adv", "vi": "thường thì"}, {"w": "offering", "p": "n", "vi": "sản phẩm cung cấp"}, {"w": "mining", "p": "n", "vi": "khai thác mỏ"}, {"w": "resistance", "p": "n", "vi": "sự kháng cự"}, {"w": "shame", "p": "n/v/interj", "vi": "sự xấu hổ; điều đáng tiếc"}]}, {"id": "W43-3", "title": "Riverford Talks, Episode 3: Happiness", "body": "Minh: Welcome to Riverford Talks. Today's question is a big one: what makes people happy? My guests are Rose Parker, who is eighty-seven and has lived in Riverford all her life, and Leo Parker, her grandson, who is twenty-two and studies to be a vet. Welcome.\n\nRose: Thank you, dear. I've never been on a podcast. Is it like the radio?\n\nMinh: Exactly like the radio. But people listen whenever they want.\n\nRose: How modern.\n\nLeo: Hi, everyone.\n\nMinh: Rose, let's start with you. What is happiness, in your opinion?\n\nRose: Oh, that's simple. Happiness is people. Family, friends, the people you love. Not money, not things. I've had a lot of money and very little money in my life, and I was happiest with very little.\n\nMinh: Leo, do young people agree?\n\nLeo: Partly. My generation thinks a lot about happiness. Maybe too much. There's a lot of pressure. On social media, everyone looks happy all the time. It creates expectations. You see everyone's perfect life and you think: why isn't mine like that?\n\nRose: In my day, we didn't have that. We had a telephone in the hall, and you could only use it for three minutes.\n\nLeo: That sounds terrible, Grandma.\n\nRose: It was wonderful. Nobody could reach you. Silence was normal.\n\nMinh: Leo, you had a hard time a few years ago. Your knee injury. Can you talk about that?\n\nLeo: Sure. When I hurt my knee, I thought my life was over. Football was everything. I was deeply unhappy. I felt anger, sadness, everything. I stopped seeing people. I was in shock, really. It took a long time to understand that I could be happy without football.\n\nMinh: What helped?\n\nLeo: People. My family. Minh, actually. And finding something new. I found animals. Volunteering at a wildlife center. It gave me comfort. A new purpose.\n\nRose: He was a different boy after that. He came home every Saturday covered in mud and smiling.\n\nMinh: Rose, you also had a difficult experience. Losing your friend Margaret for sixty years.\n\nRose: Yes. That was my own stupid fault. We had an argument when we were young, and I was too proud to say sorry. The consequences lasted sixty years. But then I found her again, thanks to you and Mia. We had two years together before she died. Those two years made me happier than the sixty before.\n\nMinh: What did you learn from that?\n\nRose: That pride is a killer. It kills happiness. And that it's never too late. Even at eighty-two, you can fix something.\n\nMinh: Scientists have studied happiness a lot. Leo, you study science. What do they say?\n\nLeo: The research is interesting. Studies show that participants who have strong relationships live longer and report more happiness. Money matters, but only up to a point. Once you have enough for food, a home and safety, more money doesn't help much. Economics calls it diminishing returns.\n\nRose: I could have told them that for free.\n\nMinh: What about everyday happiness? Small things?\n\nLeo: Those matter a lot. Exercise, nature, sleep. A walk outside. Hunting for a nice view. Even laughing at a silly joke or a trick a dog does.\n\nRose: Tea. Don't forget tea. And a good chair by the window.\n\nMinh: Last question. If you could tell young people one thing, what would it be?\n\nRose: Say sorry quickly. Say thank you often. And go outside. Don't sit in front of a screen all day.\n\nLeo: Find what you love, and don't worry if it changes. My dream changed. My life is better because of it.\n\nMinh: Rose and Leo Parker, thank you.\n\nThis episode became the most popular of the first season. Thousands of people listened. Many wrote to Rose. One woman wrote: \"I called my sister after listening. We hadn't spoken for ten years.\" Rose kept every letter in a box. \"Like Margaret,\" she said.\n\nThe response was worldwide. A **marine** biologist in Australia wrote that she had spent her life saving whales but had forgotten to call her own brother. A young man in the city wrote that he had left a **gang** and was trying to change his life; the episode had helped him. A mother wrote that her son, who had been ill for a year with strange symptoms, cried when he heard Leo's story. \"You were an **angel** to us,\" she wrote to Leo. Leo went red when Minh read it out.\n\nNot everyone liked it. One listener said Rose's advice about phones was old-fashioned and could do harm to young people who need their friends online. Rose replied: \"Yes. I'm old. Thank you for noticing.\" The incident made the episode even more popular. It rose to the top rank of British podcasts for a week.\n\nSoon, everyone wanted to be on the show. The owner of the small theatre wanted an episode about the arts. A group of junior doctors wanted one about the hospital. Someone wanted to talk about the old railway line, and someone else about a new smoking ban by the river. A school asked Minh to judge a writing contest. The format was simple, one question and two guests, but it seemed to capture something people needed.\n\nGrace was pleased. The Gazette started a podcast membership club, and two thousand supporters joined in a month. \"Your rating is higher than the BBC's local shows,\" she said. \"Don't let it go to your head.\" Daniel joked that he wanted shared ownership of the show, since half the episodes were recorded in his café.\n\nMinh tried not to chase numbers. He wanted the output to stay honest. He spent hours editing the
