<script>
const STORIES = [{"id": "W01-1", "title": "Little Minh", "body": "Before England, before college, Minh was a small boy in a small town in Vietnam. This is where his story starts.\n\nWhen Minh was six, his teacher asked the children in his class, \"Who is in your family?\" Minh stood up. He was a thin boy with black hair, big eyes and a big smile.\n\n\"My name is Nguyen Van Minh,\" he said. \"Nguyen is my surname. In Vietnam, the surname comes first. I live with my mother, my father, my little sister, and my grandmother.\"\n\nHis father and mother met at a wedding and were married when they were young. Mum was a good wife, and Dad was a good husband. They were good parents too, and Minh never doubted that each parent loved him. His father was a quiet man with strong arms and hands. He fixed motorbikes all day. His mother was a teacher at the girls' school. In English, some people say mom, some say mum, and some say mother. Minh just said \"Mẹ.\" And for his father, \"Bố.\" Dad.\n\nMinh's mother loved her son and her daughter the same. Every night she gave them a hug and a kiss on the head. The baby of the family was Lan, Minh's sister. When she was born, she was very small, with no teeth and very little hair. Minh looked at her face and her tiny fingers. \"She is so small,\" he said. \"Is she really a person?\"\n\n\"Yes,\" his grandmother laughed. \"She is a person, and you are her big brother now. A brother takes care of his sister.\"\n\nHis grandmother lived with them. Her husband, Minh's grandfather, died before Minh was born. Grandma had a soft face, white hair and very old skin. She had only a few teeth left, but she ate everything. Every evening she told stories about men and women from long ago, about kings and dragons. Minh sat on the floor with his back against her knee and listened.\n\nOn Minh's seventh birthday, many people came to visit. His aunt and uncle came from the city with his cousin, Hoa. Hoa was a girl of the same age, and she was his best friend. They played in the yard all day and fell asleep on the same bed.\n\nAt dinner, Grandpa's old friend, Mr. Ba, came too. He was the oldest man Minh knew. \"How old are you now, Minh?\" he asked.\n\n\"Seven,\" Minh said.\n\n\"Seven! A good age. Let me look at you.\" Mr. Ba held Minh's face in his hands. He looked at his eyes, his nose, his ears and his mouth. \"You have your grandfather's face,\" he said. \"And his big ears!\" Everybody laughed. Minh put out his tongue, and his mother hit his leg softly. \"Be polite,\" she said.\n\nLater, Minh had a pain in his stomach because he ate too much cake. His mother put her hand on his stomach and sang an old song. Her lips were close to his ear. Slowly the pain went away.\n\n\"Mum, do grandparents love their children's children more than their own sons and daughters?\" Minh asked.\n\nHis mother smiled. \"A grandparent's heart is very big,\" she said. \"There is space for everybody.\"\n\nMinh closed his eyes. His small body was tired. His feet were cold, his neck was warm, and his heart was full. He did not know that, one day, he was going to live very far away from this family he loved.", "words": 575, "new": []}, {"id": "W01-2", "title": "The Day Minh Was Sick", "body": "When Minh was eight, he was sick for a whole week. It started on a hot afternoon. He came home from school tired and thirsty. He drank a lot of cold water, but he did not feel well. In the night, he was hot, then cold, then hot again. His head hurt and his whole body had a pain.\n\nIn the morning, his mother looked at him. \"You are ill,\" she said. \"No school today.\"\n\nMinh was happy for one second. Then he felt sick again.\n\nHis father took him to the doctor on his motorbike. The doctor was a tall woman with short, dark hair. She was kind and friendly. She looked at his eyes and listened to his heart. \"It's not bad,\" she said. \"Some medicine, a lot of rest and a lot of sleep. He will be fine.\"\n\nAt home, Minh was bored. He was not hungry, and he did not want to play. His little sister Lan came to his bed. She was four, with curly hair and a funny face. She was very excited, because Minh was at home in the day.\n\n\"Are you going to the hospital?\" she asked. She looked a little scared.\n\n\"No,\" Minh said. \"I'm not very sick.\"\n\n\"Is the medicine in your blood now? Is it in your bones? Is it in your brain?\"\n\n\"I don't know,\" Minh laughed. \"You ask too many questions.\"\n\nIn the afternoon, his friend Tuan came to visit. Tuan was a big boy, a little fat, with a round face. Minh was small and thin next to him. Tuan always said, \"I'm handsome and you're ugly,\" but it was a joke. They were best friends. He was the funniest boy in the class, but he was lazy at school. His mother said he was clever but lazy. Tuan brought some old comic books. They read them together, and they laughed so much that Grandma came in.\n\n\"Shh!\" she said. \"A sick boy needs rest, not jokes.\"\n\nBut she was not angry. She was glad to see him smile.\n\nThe next day, a nurse from the town came to give Minh some more medicine. She was young and pretty, with long, straight, fair hair. It was almost blond. That was unusual in Vietnam. She had a nice, quiet voice. \"Are you afraid of me?\" she asked with a smile. Minh was afraid of her needle, but he said no. Lan stood at the door and watched. She did not cry, but she held Grandma's hand very hard.\n\n\"You are very polite,\" the nurse said to Minh after the needle. \"And very brave.\"\n\nWhen the nurse left, Lan said, \"She is beautiful. Is she a princess?\"\n\n\"No,\" Minh said. \"She is a nurse. Nurses are better than princesses. They help people.\"\n\nOn the sixth day, Minh felt healthy again. He was hungry for everything: rice, soup, fruit. His mother cooked his favorite food. \"Thank you for taking care of me,\" he said. His mother looked a little sad and tired, but happy.\n\n\"That's what mothers do,\" she said. \"I'm sorry you were sick, but I'm glad you're well now.\"\n\nMinh went back to school. His teacher said, \"Welcome back! We missed you.\" Tuan said, \"I didn't. Now you're back, I have to work again.\" Everybody laughed. Minh liked school. He liked his friends. And he decided that, one day, he wanted to help people, like the doctor and the nurse.\n\nHe did not like the needle, though. He still hated needles when he was nineteen, sitting in a doctor's office in England.", "words": 595, "new": []}, {"id": "W02-1", "title": "The Old House", "body": "Minh's house was old and small, but he loved it. His cousin Hoa lived in an apartment in the city, but Minh preferred a real house. It was a narrow house in the middle of the town, between a shop and a cafe. Downstairs there was a kitchen, a bathroom with a toilet and a shower but no bath, and a front room with a sofa, a table and a television. Everybody called it the TV. Upstairs there were two bedrooms. Minh shared a room with his sister Lan, and Grandma slept in the small room next to it.\n\nThere was no garage, so Dad kept his motorbike inside the house at night. There was no real garden either, only a small yard with a gate and a few plants. On the flat roof, Mum dried the clothes in the sun: shirts, trousers, a dress, a skirt, socks, and Dad's work jeans.\n\nIn the bedroom, there were two beds, a desk with a lamp, a small shelf for books, a cupboard for clothes and one chair. On the wall, there was a picture of a mountain and a clock that was always ten minutes late. There was one window. From the window, Minh could see the street and the river.\n\nEvery morning, Minh put on his school clothes: a white shirt, dark pants and black shoes. In summer, he wore shorts. In winter, it was sometimes cold in the north of Vietnam, so he wore a coat, a hat and a **sweater** that Grandma made for him. The sweater was red and a little too big. \"You will grow,\" Grandma said. He wore it for five years.\n\nDad wore a cap and old boots for work. Mum wore glasses when she read, and a watch that was a present from Dad. She always carried a big bag with her students' books inside.\n\nOne rainy night, when Minh was ten, the river came up. The water came under the door and onto the floor of the house. \"Everybody upstairs!\" Dad shouted. Outside, the street was a river now. They carried everything they could: the TV, the computer, the radio, the phone, a box of photos, and the chairs. Minh carried his school bag and his sister's shoes. The water was cold and dirty, and it covered the bottom of the stairs.\n\nThey sat on the beds upstairs and listened to the rain. There was no light, because the electricity was off. Lan was scared. Minh put his jacket around her. \"It's okay,\" he said. \"The house is strong. It's old, but it's strong.\"\n\nIn the morning, the water went down. The kitchen was a mess. The table was wet, the cupboard door was broken, and Mum's mirror in the bathroom had mud on it. The shower did not work for a week. But nobody was hurt.\n\nEverybody on the street helped to clean. People washed the walls and the floors, and they dried the books in the sun. In the evening, Mum made tea for all the neighbors, and everyone drank from her best cup and from old glasses and bowls.\n\n\"Why do we live next to the river?\" Minh asked his father.\n\n\"Because the river is our home,\" Dad said. \"It gives us water, fish and a beautiful view. Sometimes it is angry. But it is still home.\"\n\nYears later, when Minh saw the river in England from Sam's window, he thought about his old house and that long night upstairs.", "words": 581, "new": [{"w": "sweater", "p": "n", "vi": "áo len"}]}, {"id": "W02-2", "title": "A Busy Morning", "body": "Every school day in Minh's house started the same way. At six o'clock, Mum came into the bedroom and opened the window. \"Wake up! Get up!\" she said. Minh did not want to get up. Lan did not want to get up. But Mum always won.\n\nFirst, Minh went to the bathroom. He took his **toothbrush** and put on some **toothpaste**. He brushed his teeth, washed his face with soap and dried it on a towel. Then he took a comb and tried to make his hair look clean and neat. It never worked. His hair always stood up like a brush.\n\nThen he went to the kitchen. Grandma was already there. She liked to cook breakfast for everybody. Usually it was rice or noodles, but sometimes it was bread with butter and cheese, because Dad liked it. Mum drank her coffee from her big glass. Grandma cut the bread with a big knife. Dad ate quickly from a bowl with a spoon. Lan played with her fork and her plate and did not eat.\n\n\"Eat your food, Lan,\" Mum said. \"Stop playing.\"\n\n\"I'm not hungry,\" Lan said. \"I want to play with my toy.\"\n\n\"Toys are for after school. Eat.\"\n\nAfter breakfast, Minh put his things in his bag: his books, a pen, two pencils, some paper, his ball for football at lunch, and a bottle of water. Mum gave him some money for lunch. \"Don't buy sweets with it,\" she said. Minh did not say anything.\n\n\"Bring your coat, it's cold,\" Mum said. \"And close the window.\" Minh shut the window. Then the family went out. Dad took his key and opened the door. He drove the motorbike out of the house. Mum sat behind Dad with Lan between them. Minh walked to school with Tuan, because it was near.\n\nOn the way, there was a small shop that sold everything: cards, umbrellas, a cheap camera, paper for letters, tickets for the bus. Minh and Tuan always stopped to look. The old man in the shop let them stand and read the comic books. He did not make them buy anything. \"Read, read,\" he said. \"Reading is good for children.\"\n\nAt school, Minh liked to read, write and study. He did not like to sit still. In class, he listened, but he wanted to run outside. At lunch, the boys played football in the yard until the bell rang.\n\nAfter school, Minh had to work. He helped Dad at the motorbike shop. He carried tools, gave Dad what he needed and cleaned the bikes with an old towel. Sometimes Dad let him use the tools himself. \"One day you can make your own motorbike,\" Dad said.\n\nAt home, Minh had to finish his homework before dinner. Then he had to wash the dishes. Then he could watch TV. Then Mum said, \"Bed!\" and the day was finished.\n\n\"Every day is the same,\" Minh said to Grandma one evening.\n\nGrandma took a photo from the shelf. It was an old photo of Grandpa as a young man, standing next to a ship. \"Your grandfather said the same thing when he was a boy,\" she said. \"Then he went to sea and saw the world. Wait and see. Your life will not always be the same.\"\n\nMinh looked at the photo for a long time.", "words": 555, "new": [{"w": "toothbrush", "p": "n", "vi": "bàn chải đánh răng"}, {"w": "toothpaste", "p": "n", "vi": "kem đánh răng"}]}, {"id": "W03-1", "title": "Grandma's Kitchen", "body": "Grandma's kitchen was the heart of the house. Every day, she cooked breakfast, lunch and dinner for the whole family. Minh loved to sit on a small chair next to her and watch.\n\nIn the morning, she made rice soup or noodles. Sometimes Dad wanted an egg and some bread with milk. \"Strange food,\" Grandma said, but she made it for him anyway.\n\nFor lunch and dinner, there was always rice, and then meat or fish, and vegetables. Grandma bought everything at the market early in the morning: chicken, pork, beef, fresh fish from the river, potatoes, carrots, onions, beans, peas, corn and tomatoes. She did not like the supermarket. \"Supermarket vegetables have no taste,\" she said.\n\nMinh's job was to help. He washed the vegetables and cut the beans. Once, he cut his finger with the knife and cried. Grandma put his finger in cold water and gave him a piece of candy. \"A good cook always cuts a finger once,\" she said. \"Now you are a real cook.\"\n\nGrandma also loved fruit. On the kitchen table, there was always a big bowl of fruit: bananas, oranges, a lemon or two, a pear, an apple, a peach, cherries in summer, and grapes. In the hot season, there was mango, pineapple and watermelon. Minh's favorite was mango. Lan's favorite was strawberry, but strawberries were expensive, so she only had them on her birthday.\n\nWhen Minh was twelve, his cousin Hoa visited from the city. She was different now. She talked about Western food: pizza, pasta, hamburgers, burgers with cheese, sandwiches, salad. \"In the city, we eat pizza every Friday,\" she said.\n\nGrandma did not know what pizza was. So one weekend, Minh and Hoa decided to make a pizza for the family. They had no oven, so they cooked it in a big pan. They put tomato, cheese and chicken on top. It was not very good. The bottom was black and the cheese was strange. But Grandma ate a big piece and said, \"Delicious. Now I know pizza. Tomorrow I will cook real food again.\"\n\nEverybody laughed.\n\nOn special days, the family ate at a restaurant or a small cafe by the river. Minh liked the cafe best. He drank orange juice or lemonade, and Dad drank coffee or tea. Lan wanted cola or soda, but Mum said no. \"Water is better,\" she said. \"Too much sugar is bad for your teeth.\"\n\nFor a snack after school, Minh liked a sweet **biscuit** or a cookie with ice in his drink. Grandma did not like sweets very much. \"In my time, we had no chocolate, no cake, no candy,\" she said. \"We had fruit and salt and rice, and we were happy.\"\n\n\"Were you really happy?\" Minh asked.\n\nGrandma thought for a moment. \"Yes,\" she said. \"But I also wanted chocolate.\"\n\nYears later, in England, Minh ate many meals. He ate fish and chips, roast beef, English breakfast and Tom's terrible pizza. But no meal was as good as a bowl of Grandma's soup, eaten next to her in that small, hot kitchen.", "words": 513, "new": [{"w": "biscuit", "p": "n", "vi": "bánh quy (Anh)"}]}, {"id": "W03-2", "title": "Mum's Calendar", "body": "Mum had a big calendar on the kitchen wall. It showed every day, every week and every month of the year. On it, she wrote everything: birthdays, school holidays, doctor's visits and the date of every test.\n\n\"Without my calendar, this family would stop,\" she always said. \"I can't remember what happened yesterday, and I don't know what happens today!\"\n\nEvery evening, she looked at it and told everyone the plan for tomorrow. \"On Monday, Minh has an English test. On Tuesday, Lan goes to the doctor at a quarter past three. On Wednesday afternoon, Grandma visits her friend. Thursday is a normal day. On Friday evening, we eat at Uncle Hai's restaurant. On Saturday morning, everybody cleans the house. And Sunday is for rest. The weekend is short, so plan it well.\"\n\nMinh did not always listen. He was usually thinking about football.\n\nTheir life went in seasons. In spring, in March and April, the weather was warm and wet. In May and June, it was hot, and the summer holiday started. July and August were the hottest months, with big storms. In September, school started again. October and November were the best months: cool, dry and beautiful. Some people call this season autumn, and Americans call it fall. December, January and February were winter, and in the north of Vietnam, it could be very cold.\n\nMinh was always late. He woke up late, he left the house late, and he arrived at school late. Mum always said, \"Early is on time. On time is late. Late is not okay.\"\n\nOne night, when Minh was fifteen, he went to a friend's house to play computer games. He said, \"I'll be home at nine o'clock.\" Then he forgot about the time. At ten, he thought, \"Just one more game.\" At eleven, he thought, \"Soon.\" At midnight, he looked at his phone. There were twelve messages from his mother.\n\nHe ran home. Mum was sitting in the kitchen. She did not shout. She only looked at the clock. It was half past twelve.\n\n\"I said nine,\" Minh said quietly. \"I'm sorry. I forgot the time.\"\n\n\"An hour late is a problem,\" Mum said. \"Three hours late is a very big problem. I thought something bad happened to you.\"\n\nThat week, Minh could not go out in the evening. Every evening at eight, he sat at home and did his homework. He was angry for a minute, then for a day, then he understood.\n\nThe next Sunday, Mum gave him a present. It was a small watch. \"Now you have no excuse,\" she said.\n\nFrom that day, Minh was often on time. Not always, but often. Sometimes he was even early. Mum noticed. \"Two years ago, you were never on time,\" she said. \"Now look at you!\"\n\nMany years later, Minh's first day in England began with a flight that left at noon. He was at the airport four hours before. He sent his mother a photo of the clock. She replied with three hearts.\n\nEven today, in England, when Minh thinks about that kitchen calendar, he smiles. Before, he hated it. Now he has a calendar too, and he writes everything on it. Tonight, he has dinner with the Parkers at seven, and he will be there at five to seven, every second on time. He will think of Mum.\n\nHis waiter friend at the cafe always says, \"You are the only customer who pays the bill before he orders from the menu.\" Minh just smiles. \"My mother taught me,\" he says.", "words": 591, "new": []}, {"id": "W04-1", "title": "The School Trip", "body": "When Minh was eleven, his class went on a school trip to the city zoo. It was the most exciting day of the year. The last school trip was two years ago, to a park with a small hill, and everybody wanted to go again. The night before, Minh checked the weather on TV. \"Tomorrow will be sunny and warm,\" the weather man said. \"No rain, no wind.\" Minh was very happy.\n\nBut in the morning, the sky was gray and cloudy. By eight o'clock, it was windy and cool. By nine, there was rain. It was a rainy day after all. \"At least it isn't snow,\" the teacher said. In their town, it never snowed. Minh only saw snowy places on TV. The children sat on the bus, wet and sad. \"The weather man was wrong,\" Tuan said.\n\nThen, after an hour, the rain stopped. The clouds went away and the sun came out. Everything was wet and green: the trees, the grass, the flowers. The air smelled clean. Soon the roads were dry again. Even the field next to the road looked beautiful.\n\nAt the zoo, they saw many animals. First, they saw the big ones: an elephant, a lion and a tiger. The tiger walked up and down behind the glass. \"It looks angry,\" Lan's friend said. Then they saw a bear, sleeping on a rock, and a monkey that took a girl's hat.\n\nNext, there were animals from other parts of the world. There was a tall **giraffe** with a very long neck. It ate the leaves at the top of a tree. There was a **zebra** with black and white lines. Tuan said, \"Is it a white horse with black lines, or a black horse with white lines?\" Nobody knew.\n\nThere was a **kangaroo** from Australia. It jumped very high. And there was a black and white **panda** from China, eating plants and sitting like a fat old man. Everybody loved the panda. It did nothing at all, but all the children watched it for twenty minutes.\n\nMinh's favorite place was the small house for little animals. There was a snake on a stone and a frog in the sand, a spider in a glass box, and a beautiful room full of flowers and **butterflies**. A yellow **butterfly** sat on Minh's hand. He stood very still. \"Don't move,\" the teacher said quietly. After a few seconds, it flew away.\n\n\"What is it?\" Minh asked. \"Is it a kind of **insect**?\"\n\n\"Yes,\" said the teacher. \"A butterfly is an insect, like a bee. Insects have six legs.\"\n\nIn the afternoon, they visited a small farm next to the zoo. There was a cow, a pig, some sheep, a duck and a family of rabbits. A small mouse ran across the floor, and three girls screamed. \"Mice are more afraid of you than you are of them,\" said the farmer.\n\nAt the end of the day, the teacher showed them a video about the sea. There were sandy beaches, islands and a smart gray **dolphin** that could jump through a ring. \"This is the world,\" she said. \"The earth is very big. There are mountains, forests, rivers, lakes and seas. And everywhere there are animals.\"\n\nOn the bus home, the moon was already in the sky. Minh looked out of the window at the first star. He thought about the giraffe and the panda and the dolphin. They lived so far away. \"One day,\" he thought, \"I want to see the world.\"\n\nAt home, the family dog and cat were waiting for him. He told them about his day. The cat was not interested. The dog was. Outside, a small bird sang in the tree. \"Dogs are the best pets,\" Minh decided.", "words": 625, "new": [{"w": "insect", "p": "n", "vi": "côn trùng"}, {"w": "butterfly", "p": "n/v/adj", "vi": "con bướm"}, {"w": "giraffe", "p": "n", "vi": "hươu cao cổ"}, {"w": "zebra", "p": "n", "vi": "ngựa vằn"}, {"w": "kangaroo", "p": "n", "vi": "chuột túi"}, {"w": "panda", "p": "n", "vi": "gấu trúc"}, {"w": "dolphin", "p": "n", "vi": "cá heo"}]}, {"id": "W04-2", "title": "The Trip to the City", "body": "One summer, when Minh was thirteen, Dad decided to take the family to the big city for a weekend. They took the bus from their town early in the morning. It was hot, and the sun **rose** over the fields as they left the village.\n\nThe city was huge. There were cars, motorbikes, taxis, trucks and bicycles everywhere. People drove fast and nobody stopped. A train went over a bridge, and a plane flew low over the buildings on its way to the airport. Lan had never been close to an airplane. Near the river, there was even a big ship. Lan held Mum's hand very hard. \"Is the city always this loud?\" she asked.\n\nThey stayed in a small hotel near the station. From the window, they could see a big square, a church, a bank, a cinema and a big supermarket. There was also an old school and a tall office building. Dad had a map, but he still could not find the way. \"Turn left,\" said Mum. \"No, right,\" said Dad. In the end, they asked a man in a shop.\n\nOn the first day, they visited a museum. Minh thought it was boring, but then they went into a room about the sea. It was full of things about the animals of the ocean. There was a model of a huge **whale**, as long as a bus. There was a **shark** with terrible teeth, and next to it, a **crocodile** that looked like a long, dirty rock. \"Crocodiles live in rivers,\" Dad said. \"Some are as long as a boat.\"\n\nThere was a big, round **hippo** and a group of **penguins**, standing together like little men in black and white. \"Penguins are birds, but they can't **fly**,\" the guide said. \"They swim instead.\"\n\nIn the next room, there was an **owl** with very big eyes. \"The owl is awake at night and sleeps in the day,\" the guide said. \"It can turn its head almost all the way around.\"\n\nLan was not interested in the owl. She was looking at a small glass box. Inside, there were hundreds of **ants**, carrying tiny pieces of **leaf** through little roads in the sand. \"They are working so hard,\" she said. \"Like Dad.\"\n\nEverybody laughed.\n\nOn the second day, they went to the market and walked down a long street with shops on both sides. Mum bought a new bag in a big department store. A boy rode past on a bike with a dog in a basket. Dad bought a science book for Minh from a big library sale. Minh did not want a science book. He wanted a football shirt. But later, he read the book on the bus, and it was very interesting. It was about fire, air and water, and how plants grow from a seed.\n\nIn the evening, they took a boat ride on the lake in the center of the city. The water was green and quiet. Old trees stood on the side, and their **leaves** touched the water. Lan fell asleep on Mum's legs. A small **fly** sat on Dad's nose, and he did not notice.\n\n\"Do you like the city?\" Dad asked Minh.\n\nMinh thought. \"I like it,\" he said. \"But it is very far from the river and the town. It is very busy. I think I like our place better. Here, I feel very small.\"\n\n\"The world is big,\" Dad said. \"Our place is small. But we can go anywhere, and come back.\"\n\nOn the bus home, Minh looked out at the dark fields and the lights of the villages. He thought about the whale and the penguins. He knew one thing now. He wanted to see more of this big world.", "words": 623, "new": [{"w": "whale", "p": "n", "vi": "cá voi"}, {"w": "shark", "p": "n", "vi": "cá mập"}, {"w": "crocodile", "p": "n", "vi": "cá sấu"}, {"w": "hippo", "p": "n", "vi": "hà mã"}, {"w": "penguin", "p": "n", "vi": "chim cánh cụt"}, {"w": "owl", "p": "n", "vi": "con cú"}, {"w": "fly", "p": "v/n", "vi": "bay; con ruồi"}, {"w": "ant", "p": "n", "vi": "con kiến"}, {"w": "leaf", "p": "n", "vi": "chiếc lá"}, {"w": "leaves", "p": "n", "vi": "lá cây"}, {"w": "rose", "p": "v/n/adj", "vi": "tăng lên"}]}, {"id": "W05-1", "title": "What Do You Want to Be?", "body": "When Minh was sixteen, his English teacher, Ms. Huong, asked the class a question. \"What job do you want in the future? Answer in English, please.\"\n\nThe classroom went quiet. Ms. Huong was a strict teacher, but she was the best teacher in the school. She wrote the question on the board in big letters.\n\nOne girl wanted to be a singer. Another wanted to be a dancer, an actor or an actress. A boy whose family had a market stall said, \"I want to sell clothes, every size and every color.\" One boy wanted to be a football player. Tuan wanted to be a chef. \"Because I love food,\" he said, and the class laughed. Another boy said, \"A businessman. I want to be rich.\" A girl wanted to be a writer or an artist, and a quiet boy said, \"A policeman, like my father.\" Someone else said \"police officer\" is better English, and Ms. Huong agreed.\n\nThen it was Minh's turn. \"I don't know,\" he said. \"Maybe a driver. Or a farmer. Or a worker in a factory, like my uncle.\"\n\n\"That's not an answer,\" Ms. Huong said. \"What do you love?\"\n\nMinh thought. \"I like English,\" he said. \"And I like learning about other countries.\"\n\nAfter the lesson, Ms. Huong asked him to stay. \"Minh, you are a good student,\" she said. \"Your English is the best in the class. Did you know there are scholarships to study abroad? Some are in England.\"\n\n\"England?\" Minh said. \"But that is very expensive. My family is not rich. We are not poor, but we are not rich.\"\n\n\"A scholarship means the college pays,\" she said. \"You need very good marks in every test and every exam. You need good maths, too, not only English. And you need to speak English very well.\"\n\nThat evening, Minh looked on the internet. He watched a video about a college in a small English town. He read the news about Vietnamese students in England. He read about the cost: thousands of pounds a year. In euros or dollars, the price was just as big. One pound was more than thirty thousand Vietnamese dong. For one coffee in London, you needed three pounds and some cents. Minh's eyes went wide.\n\nMinh looked at the few coins in his pocket. \"I want to travel, but even a cheap trip is expensive,\" he said to Dad. \"The suitcase, the passport, the plane...\"\n\nDad was quiet. Then he said, \"You need it, so we will find the money. Don't think about the cost. Think about your homework.\"\n\nFrom that day, Minh changed. He studied every night. He learned ten new English words every day. He asked Ms. Huong to teach him how to spell difficult words, and he read the English newspaper and English magazines at the library. When he was tired, he swam in the river or played a game on his mobile phone for ten minutes, then he started again. He did not take a vacation that summer.\n\nMs. Huong gave him extra lessons on Saturdays. She did not want any money. \"You are my best **pupil**,\" she said. \"When you go to England, send me an email.\"\n\n\"If I go,\" Minh said.\n\n\"When you go,\" she said. \"Not if.\"\n\nMany years later, Minh still remembered that meeting with Ms. Huong in the empty classroom. She was not his boss or his mother, but she changed his life. Art, music, history, sport: Minh liked all his classes. But only one teacher asked him what he loved.", "words": 591, "new": [{"w": "pupil", "p": "n", "vi": "học sinh"}]}, {"id": "W05-2", "title": "Tuan's Band", "body": "Minh's best friend Tuan had a new hobby. He wanted to start a band. \"We will be famous,\" he said. \"We will play concerts all over the country.\"\n\n\"But you can't sing,\" Minh said.\n\n\"I can learn. And you can play the guitar.\"\n\n\"I can't play the guitar either.\"\n\n\"You can learn too,\" Tuan said. \"It's fun!\"\n\nSo they started a band with two other boys from school. One boy played the drums, and a girl played the piano. Later, another girl joined with her violin. They were a team now. Their goal was simple: to play one real show. They practiced every Saturday in Tuan's garage. They were very loud. The neighbors were not happy.\n\nMinh was busy with his studies, but he enjoyed the band. It was his free time. He played the guitar badly, and he wrote songs in English. \"English songs are cool,\" Tuan said. \"Everybody likes American songs.\"\n\nIn December, the school had a big party for Christmas. There was a show in the school theater. Each class could do something: a dance, a song, a story, a film. Tuan's band decided to play two songs.\n\nBefore the show, Tuan was nervous. \"What if we lose? What if they don't like us?\"\n\n\"It's not a race or a football match,\" Minh said. \"Nobody wins or loses. Just have fun.\"\n\nOn the night, the theater was full. There were teachers, parents and students. A boy from another class did a magic show. Two girls did a Korean dance. A group of younger children showed how they draw and paint, and their favorite pictures. Some older students showed a short movie.\n\nThen it was the band's turn. Tuan stood at the front. Minh's hands were shaking. The first song was okay. The second song was terrible. Tuan forgot the words, and Minh played the wrong notes. But then something funny happened. Tuan started to dance. He jumped, he kicked his legs and he threw his hat to the people. A girl in the front tried to catch it. Everybody laughed and stood up and danced too. At the end, they clapped and shouted, \"More! More!\"\n\n\"We won!\" Tuan said.\n\n\"It's not a competition,\" Minh said, but he was smiling.\n\nAfter the show, Ms. Huong talked to them. She was with a young American teacher, Mr. Jake, who was in Vietnam for a year. Mr. Jake laughed and said, \"Great show, guys! In America, we have big parties at Christmas too. And in spring, we celebrate **Easter**, with chocolate eggs.\"\n\nHe told them about sports in America: baseball, basketball, volleyball, and football. \"But American football is different from your football,\" he said. \"You call it soccer in America.\"\n\n\"In England, they say football,\" Ms. Huong said.\n\n\"Do you like sport?\" Minh asked.\n\n\"I love it! In winter, I like to **skate** and ski. In summer, I like tennis, running and swimming. I go to the gym every day to keep fit.\"\n\nMinh liked Mr. Jake. He spoke very fast, but he always explained everything. He talked about American festivals and weddings, and about the page of a magazine where his photo was once. Minh wanted to speak English like him one day.\n\nOn the way home, Tuan said, \"Tonight was the best night of my life. Better than a gift, better than a present from Santa.\"\n\nMinh agreed. He did not know it yet, but it was also one of his last Christmases in Vietnam for a long time. He played with a doll for his little sister and flew a kite with her the next week, but his head was already full of other countries and another language.\n\nHe decided to ask Mr. Jake one question the next day: \"Can you help me practice for a scholarship interview?\" He was ready to tell the world what he wanted. He even wrote it down, like a puzzle he wanted to solve.", "words": 653, "new": [{"w": "skate", "p": "v/n", "vi": "trượt băng, trượt patin"}, {"w": "Easter", "p": "n", "vi": "lễ Phục sinh"}]}, {"id": "W06-1", "title": "The English Club", "body": "To practice English, Minh joined an online English club. Every Sunday evening, students from many countries met on a video call. It was the first time Minh talked to people from all over the world.\n\nThere was Yuki from Japan, who spoke Japanese and was learning English and Chinese. There was Carlos from Mexico, who spoke Spanish, and Ana from Brazil, who was Brazilian and spoke Portuguese. There was an Indian boy from India and a Thai girl from Thailand. There was a Korean student from Korea, Ji-woo, who loved Korean music, and an Italian girl from Italy, Giulia, who talked about Italian food all the time. Carlos said Mexican food was better. Yuki had a friend in China.\n\nThe teacher of the club was a **Canadian** woman named Sarah. She lived in Canada, but she was born in England. Her mother was British, from Britain, and her father was French. She also spoke German, a little Russian and a little Chinese. \"I am a mix of many countries,\" she said.\n\n\"Where do you want to go, Minh?\" Sarah asked in the first meeting.\n\n\"England,\" Minh said. \"Or Australia. I want to study in an English-speaking country. I like British English. And maybe one day, I want to visit Germany, Spain and France too.\"\n\n\"Good choice,\" Sarah said. \"Many Vietnamese students go to England or Australia. I have some Australian friends. They say the Australian accent is the best. But my British mother says the British accent is the best!\"\n\nEvery week, they played games to learn English. One game was about colors. Sarah showed a picture and they had to say every color they could see: red, blue, yellow, black, white, brown, pink, purple, gray or grey (both are fine, Sarah said), gold and silver. Another game was about shapes. \"A circle is round. A line is straight. What shape is the moon?\"\n\n\"Round!\" said Carlos. \"But sometimes it is a little line.\"\n\nAnother game was about numbers. \"Count from one to a hundred as fast as you can!\" Minh came first. Yuki came second. Ji-woo came third. Carlos came last, but he did not care. \"In Mexico, we are never in a hurry,\" he said.\n\nThey also learned words like many, much, more, most, some, any, all, every, few, little and a lot. \"How many brothers do you have?\" \"How much time do you need?\" \"Do you have any questions?\" Minh wrote them all in his notebook.\n\nSarah gave them some advice. \"Each language is a new door,\" she said. \"Some of you will travel to other countries. Both your languages, your own and English, are important. Never forget your own language.\"\n\nAfter a few months, Minh had friends all over the world. He wrote messages to Yuki in Japan and Carlos in Mexico. He learned a lot about other cultures. In Japan, people take off their shoes at home, like in Vietnam. In Mexico, people eat late at night. In Brazil, everybody loves football, even more than in Vietnam. In Russia, it is very, very cold in winter.\n\n\"Vietnam is a small country,\" Minh told his mother one evening. \"But the world is very big. And it is full of new people.\"\n\n\"Don't forget to come back,\" his mother said.\n\nMinh laughed. \"Mum, I haven't even left yet.\"\n\nBut in his heart, he was already a little bit far away.", "words": 563, "new": [{"w": "Canadian", "p": "adj/n", "vi": "người Ca-na-đa"}]}, {"id": "W06-2", "title": "The Interview", "body": "In the spring of his last year at school, Minh got an email. It said: \"Dear Minh, thank you for your application. We would like to invite you to an interview for the scholarship.\" Minh read it three times. Then he ran downstairs to show his mother.\n\n\"An interview! With whom?\" she asked.\n\n\"With a teacher from the college in England. On a video call. Next Friday.\"\n\nFor a week, Minh practiced every day. He wanted to do it all by himself, but Mr. Jake helped him. \"These are the questions that they usually ask,\" he said, and gave Minh a list. \"Learn them, or practice them with another person.\" \"They will ask about you, your family, your school and your plans,\" he said. \"Speak slowly. Smile. And if you don't understand a question, ask them to say it again.\"\n\nOn Friday, Minh sat at his desk in front of the computer. His mother was in the kitchen. His father was at his shop, but he called three times to say, \"Good luck.\" He turned off his phone. Lan was told to stay quiet. She sat outside the door with her ear on it.\n\nThe interview started. On the screen, there was a woman with short gray hair and kind eyes. \"Hello, Minh. My name is Dr. Wilson. How are you?\"\n\n\"I'm fine, thank you. And you?\"\n\n\"Very well. Tell me about yourself.\"\n\nMinh took a deep breath. \"My name is Minh. I am from a small town in the north of Vietnam. I live with my parents, my sister and my grandmother. My father fixes motorbikes, and my mother is a teacher. They work very hard for us. Their dream is for my sister and me to have a good education.\"\n\n\"Which subject do you want to study?\"\n\n\"English and business, if I can.\"\n\n\"Why do you want to study in England?\"\n\n\"Because I love English, and I want to learn about the world. If I study in England, I can learn about other people and other ideas. When I finish, I want to come back and help my town.\"\n\n\"What do you do in your free time?\"\n\n\"I play the guitar in a band with my friends. Our band is very bad, but we have fun. I also go to an English club online. It has students from many countries.\"\n\nDr. Wilson smiled. \"And what is the most difficult thing about English, for you?\"\n\nMinh thought. \"The small words,\" he said. \"In, on, at, to, from, by, about, over, under, between... In Vietnamese, it is different. I always say 'in Monday' and not 'on Monday.' And 'he' and 'she' and 'it'... In Vietnamese we don't use them the same way. I mix up him and her, and his and hers.\"\n\nDr. Wilson laughed. \"Count yourself lucky. Those words are difficult for everybody. Even English children make mistakes with them.\"\n\nThen she asked some harder questions. Why this college? Where do you see yourself in five years? What is a problem in your town, and how can you help with it? Minh did his best. Sometimes he did not know a word, so he explained it with other words. Once, he did not understand a question, so he asked her to say it again, like Mr. Jake said.\n\nAt the end, she said, \"Thank you, Minh. We will write to you in two months. Do you have any questions for us?\"\n\n\"Yes,\" Minh said. \"Whose idea was the scholarship? And what is the town like? Is the college famous for its English classes? Is it near the sea?\"\n\n\"It's a small town by a river, with an old castle on a hill. It's quiet and green. I think you'll like it. If you come.\"\n\nAfter the call, Minh sat still for a long time. Then he opened the door. Lan fell into the room. \"Did you hear everything?\" he asked.\n\n\"Yes,\" she said. \"You said 'by a river' and 'on Monday.' Mr. Jake would be proud of you.\"\n\nMinh laughed. Then he went to tell his mother, who was waiting behind the kitchen door, and his grandmother, who was praying for him by the window, between her two favorite plants. Without them, he thought, none of this was possible. \"This is not mine,\" he said to his mother. \"It's yours and Dad's and Grandma's. It's ours. I didn't do it myself. When Lan and Grandma ask whose dream this is, I will say it is theirs too.\" Up and down, in and out, his heart did not stop all evening.", "words": 761, "new": []}, {"id": "W07-1", "title": "The Letter", "body": "After the interview, Minh had to wait two months. Those were the longest two months of his life.\n\nAt first, he tried to forget about it. He went to school, he played in the band, he helped his father at the shop. But every day, he checked his email. Morning, afternoon, evening. Nothing.\n\n\"Can I stop thinking about it?\" he asked Grandma. \"I want to forget, but I can't.\"\n\n\"You can't forget something you hope for,\" Grandma said. \"Hope is like a cat. It stays in the house, even if you don't call it.\"\n\n\"Shall I make you some tea?\" she also asked. \"Yes, please,\" Minh said. Tea was the only thing that helped.\n\nTuan was not very helpful. \"Maybe they lost your email. Maybe they chose another person. Maybe the college is closed.\" Minh threw a pillow at him. \"No,\" he said. \"Too many maybes. Let me hope a little.\"\n\nThen the exams came. The final exams were very difficult. For a month, Minh did nothing but study. He did not see his friends. He did not play the guitar. The house was quiet, because everybody knew: Minh must study. His mother said, \"You should rest a little.\" His father said, \"You must eat.\" Grandma said, \"You might like some soup.\" Minh said, \"I will, later,\" but he did not move from his desk.\n\nSome questions were easy. Some were hard. In the maths exam, Minh made a mistake and wrote the wrong answer. He knew it when he left the room. \"Is it true or false that I failed?\" he asked Tuan. \"False,\" Tuan said. \"One wrong answer is not the end of the world.\"\n\nAfter the exams, Minh was empty. \"I am so tired,\" he said. \"I have been a student for twelve years, and being a student is hard work. Does it ever end?\" His father laughed. \"It never ends. Your father has to learn something new every day too. Keep going.\" He slept for two days. Then he woke up and checked his email again. Still nothing. His hope was high in the morning and low at night. His mood went up and down like a fast, slow, fast song.\n\n\"You need to change something,\" his mother said. \"Go out. See your friends. Stay busy.\"\n\nSo he went to the river with Tuan. They walked around the old market first, to find a quick snack. It was great to be outside. They sat under a tree and talked about everything: girls, football, life. \"I'll miss you if you go,\" Tuan said quietly. \"Who will listen to my terrible songs?\"\n\n\"I'll still listen, on the phone,\" Minh said. \"And maybe I won't go at all.\"\n\n\"Even if they say no,\" Tuan said, \"you can begin again next year. It doesn't mean the end.\" It was an interesting idea: for once, Tuan was right.\n\nThen, one morning in June, Minh's phone made a sound. He looked at it. An email from the college. His hands were shaking. He could not open it. \"Mum!\" he called. \"Mum, come here!\"\n\nHis mother came running from the kitchen. Dad came from the shop. Grandma came slowly from her room. Lan came from the bathroom with toothpaste on her face.\n\nMinh opened the email. He read the first line. Then he read it again. He turned the phone so they could see.\n\n\"Dear Minh, we are very happy to tell you...\"\n\nFor a moment, nobody said anything. Then Lan screamed. Mum started to cry. Dad hugged him so hard that he could not breathe. Grandma sat down on a chair and said, \"I knew it. I knew it.\"\n\n\"Full scholarship,\" Minh said. \"They pay for everything. Classes, books, everything. I start in September. I arrive in England at the end of August.\"\n\nThat night, the whole street knew. Neighbors came with food and drinks. Ms. Huong came and hugged him. \"I told you,\" she said. \"When, not if.\" Even Mr. Ba, now very old, came with his stick. \"Your grandfather would be proud,\" he said.\n\nMinh tried to remember everything about that night: every face, every word, every sound. He understood something important. He was leaving, but this place would always be his. He hoped he would never forget it. He was sure he would not.\n\nLate at night, the house was full of empty glasses. Minh was alone on the roof, looking at the river. He could hear the water in the dark. \"I'm going,\" he said to it, very softly. \"But I'll come back. I promise.\"\n\nAnd somewhere in the dark, a fish jumped, as if to say: we will see.", "words": 772, "new": []}, {"id": "W07-2", "title": "Goodbye", "body": "The last week before England was the busiest week of Minh's life. There were so many things to do. He needed a new passport photo, a bank card, warm clothes and a special bag for his laptop. His suitcase was on the bedroom floor, open and empty, for days.\n\n\"What do I take?\" he asked his mother. \"I don't know what is important. Packing is the worst job. It's boring, and it's worse than homework.\"\n\nHis mother was ready. She had a list. Of course she had a list. Every problem in her life had a list. It was the best idea she ever had, she said. \"Clothes for cold weather. Medicine. Photos of the family. A piece of home.\" She gave him a small bag of tea and a little wooden box. \"For when you miss us,\" she said. \"For example, on your first cold night. That's the reason I'm giving it to you. Put it at the bottom of the bag.\"\n\nThe suitcase was heavy. Very heavy. \"Is it a suitcase or a car?\" Dad said, lifting it. \"Maybe you should take less.\"\n\n\"Maybe,\" Minh said. But he took everything anyway. Each part of the suitcase had its own type of thing, all sorts of things: clothes at one end, books at the other, and quite a lot of food in the middle.\n\nOn the last evening, the family had a special dinner. Grandma cooked all of Minh's favorite food. Everything was perfect. The fish was lovely, the soup was wonderful, the rice was soft. Nobody ate very much.\n\nLan was quiet all evening. Usually she was the loudest and most noisy person in the house. Tonight, she did not say a word. After dinner, Minh found her alone at the top of the stairs.\n\n\"What's wrong?\" he asked.\n\n\"Nothing,\" she said. Then: \"You're going away. Who will help me with my English homework?\"\n\n\"I'll call you. Every week. I promise.\"\n\n\"It's not the same,\" she said. \"It's different on the phone.\"\n\nMinh sat down next to her. \"Listen,\" he said. \"You're strong. You're not weak. You're the smartest, funniest person I know. Maybe even better than me. One day, maybe you will go somewhere too.\"\n\nShe almost smiled. \"Really?\"\n\n\"Really. Perhaps we will go together.\"\n\nIn the morning, the whole family went to the airport. Uncle Hai drove them in his truck. At the airport, there were hundreds of people. Some were happy. Some were crying. It was busy, loud and a little terrible.\n\nDad did not say much. He just held Minh's shoulder. \"Be safe,\" he said. \"Big cities can be dangerous at night. That's my only point.\" \"Work hard. And if it's too difficult, you can always come home. There's no shame in that.\"\n\nMum gave him a big hug. \"Are you sure you have your passport? Your ticket? Your money? Your phone?\"\n\n\"Yes, Mum. Yes. Yes. Yes.\"\n\nGrandma held his face in her soft hands. \"You were a little boy just yesterday,\" she said. \"Now you are a man. Go. See the world. Then come back and tell me about it.\"\n\nThen it was time. Minh walked away from them, slowly at first, then quickly. At the side of the gate, he turned around one last time. They were still there, at the front of the crowd, in the middle of all those strangers. Mum, Dad, Grandma, and Lan, waving and waving.\n\nHe waved back. \"Goodbye,\" he said. \"Thank you. Please take care.\"\n\nHe was famous in his town now, a popular boy with a special scholarship. But here, he was just a young man alone with a heavy bag. He felt like a real adult for the first time, and also like a very small boy.\n\nOn the plane, he looked at the T-shirt he was wearing. Lan gave it to him that morning. On the back, in big letters, she wrote in English: \"Hello, England. This is my brother. Be nice to him.\"\n\nMinh laughed out loud. Then he cried a little. Then he slept. When he woke up, the plane was already over the sea, on its way to a small town by a river, with an old castle on a hill, where a family he did not know yet was waiting for him at the station.", "words": 716, "new": []}, {"id": "W08-1", "title": "A New Family", "body": "Minh was nineteen when he left Vietnam to study in a small town in England. He was not a kid anymore, but he did not really feel like an adult. For one year, he was going to live with the Parker family as a guest.\n\nAt the station, a lady and a gentleman were waiting for him. \"Are you Minh?\" the gentleman asked.\n\n\"Yes, sir,\" Minh said.\n\nThe man laughed. \"Please don't call me sir or Mister Parker. I'm Tom. And this is my wife, Anna.\"\n\nAnna smiled. \"And nobody calls me madam here. Welcome!\"\n\nIn the car, Tom told him about everybody in the house. Tom was American, and Anna was English. They were a happy couple. They got married twenty years ago, in America, and then they moved to England. They had twins, Leo and Mia. The twins were teenagers now, fifteen years old. Leo was born ten minutes before Mia, so he always said, \"I'm the big brother.\" Leo had a girlfriend at school. Mia said she did not want a boyfriend. \"Boys are boring,\" she said.\n\nTom's mother, Grandma Rose, lived with them too. Her husband died many years ago. \"My father is dead, but my mother is very much alive,\" Tom said. \"She is eighty, and she is busier than all of us.\" Grandma Rose had five grandchildren. Leo was her only grandson, and Mia was her favorite granddaughter. \"But she says that to every grandchild,\" Anna laughed.\n\nGrandma Rose also had a lot of relatives in the town. Her **nephew** owned a small café, and her **niece** was a nurse at the hospital. Tom's business partner, Mr. Lee, was also their neighbor. \"So you will meet a lot of people,\" Tom said. \"Don't worry. Here, nobody is a stranger for long.\"\n\nWhen they arrived, somebody opened the door before they knocked. It was Grandma Rose. She was small and thin, with white hair. She put her hands on Minh's shoulders and kissed him on the **cheek**. \"Now you are a member of this family,\" she said. Minh felt warm inside. He missed his parents, but this was a good start.\n\nThe next morning, at seven o'clock, Minh looked out of the window. Grandma Rose was in the garden, doing her morning exercise. She saw him and waved. \"Come down! Anybody can do this!\"\n\nSo Minh went outside. \"First, hands on your **hips**,\" Grandma said. \"Now turn your **waist** to the left, and to the right. Good! Lift your **chin**. Open your **chest** and breathe.\"\n\nThen she showed him more. \"Make circles with your wrist. Bend your **elbow**. Stand on your toes... now on your **heels**.\" Minh lost his balance and almost fell. Grandma Rose laughed.\n\n\"Be careful with your **ankle**,\" she said. \"Last year I hurt my ankle, and I could not walk for a month.\"\n\nAt the end, she held up her hand and showed him her **nails**. They were painted bright pink. Then she gave him a thumbs-up with her thumb. \"You are not bad for a single day,\" she said. \"Same time tomorrow?\"\n\nMinh smiled and nodded. He did not have a choice, and he did not want one.", "words": 528, "new": [{"w": "nephew", "p": "n", "vi": "cháu trai (con anh chị em)"}, {"w": "niece", "p": "n", "vi": "cháu gái (con anh chị em)"}, {"w": "elbow", "p": "n", "vi": "khuỷu tay"}, {"w": "nail", "p": "n", "vi": "móng tay"}, {"w": "ankle", "p": "n", "vi": "mắt cá chân"}, {"w": "heel", "p": "n", "vi": "gót chân"}, {"w": "chest", "p": "n", "vi": "ngực"}, {"w": "hip", "p": "n", "vi": "hông"}, {"w": "waist", "p": "n", "vi": "eo"}, {"w": "chin", "p": "n/v", "vi": "cằm"}, {"w": "cheek", "p": "n", "vi": "má"}]}, {"id": "W08-2", "title": "A Bad Week", "body": "In his second week in England, Minh got sick. On Monday, his throat was sore and he had a headache. On Tuesday, he had a fever and a bad cough. His whole body had an ache, even his muscles. When he tried to speak, his voice was very small.\n\nAnna put her hand on his **forehead**. \"You're hot,\" she said. She checked his temperature. It was 38.5. \"I think it's the flu. Everybody at Leo's school has it.\"\n\n\"Is it a serious illness?\" Minh asked.\n\n\"No, it's not a dangerous disease. But you need to rest. Stay in bed, drink a lot of water, and take these.\" She tore open a box of pills. \"One tablet every six hours.\"\n\nTom came in with a cup of tea. \"In America, we go to the drugstore for medicine,\" he said.\n\n\"In England, we say chemist,\" Grandma Rose said from the door. \"Or pharmacy,\" Anna added. Minh was too tired to learn three words for one shop.\n\nOn Wednesday, Minh was still sick, so Anna made an appointment at the clinic. The doctor was a tall man with a big grey **beard** and a **mustache**. He had thick black **eyebrows** that went up and down when he talked. He listened to Minh's **lungs**. \"Take a deep breath,\" he said. \"Now breathe out slowly.\" Minh tried, but he started to cough. The doctor nodded. \"Your lungs are OK. It's just the flu. Rest for a few days and you will be fine.\"\n\nThere were many patients in the waiting room. A little boy had a toothache, and his mother was looking for a dentist. A girl had a stomachache. An old man had an earache. Minh felt lucky. His problem was small.\n\nThen, on the way home, something bad happened. Leo was riding his bike home from football, and he had an accident. A car turned without looking. Leo fell off his bike and hit the road. Somebody called an ambulance. It was not a big emergency, but Leo had an injury on his arm and his leg. Anna's face went white. \"Is he badly injured?\" she asked on the phone. Her hands were shaking.\n\nAt the hospital, the nurse cleaned Leo's leg and put a bandage on it. She put a small plaster on his face. \"He doesn't need an operation,\" she said. \"He was very lucky.\"\n\nAt home that night, Leo lay on the couch. He tried to look brave, but there was a little tear in his eye. Mia gave him ice cream. \"This is medicine too,\" she said.\n\nGrandma Rose talked to everybody about health. \"Too much sugar is unhealthy,\" she said. \"You all need a better diet and more exercise.\" Then she ate a piece of chocolate cake.\n\nWhen Minh finally felt better, he looked in the mirror. His face was pale, and there was sweat on his forehead. Even his **eyelashes** looked tired. But he smiled. \"Next time, I'll be more careful,\" he thought. \"I'll wear a coat.\"\n\nMia waved to him from the door. \"Hey, sick boy! Do you want some ice cream too?\"", "words": 516, "new": [{"w": "forehead", "p": "n", "vi": "trán"}, {"w": "eyebrow", "p": "n", "vi": "lông mày"}, {"w": "eyelash", "p": "n", "vi": "lông mi"}, {"w": "beard", "p": "n", "vi": "râu"}, {"w": "mustache", "p": "n", "vi": "ria mép"}, {"w": "lung", "p": "n", "vi": "phổi"}]}, {"id": "W08-3", "title": "A Letter to Mom", "body": "After two weeks, Leo began to recover. His arm was not broken, and the treatment at the hospital worked well. His leg did not bleed anymore. Minh was also well again, so he sat down and wrote a long email to his mother in Vietnam.\n\n> Dear Mom,\n\n> Don't worry, I am fine now. I was sick, but I didn't faint or anything. Let me tell you about my new family.\n\n> Tom is tall and a little overweight, because he loves pizza. He is going bald, so he always wears a hat. He doesn't care about his looks. His shirts are very **plain**, and his room is untidy. But he is honest, cheerful and very generous. He is always helpful when I have a problem.\n\n> Anna is slim and **elegant**. She cares about her appearance and always looks smart. Her desk is very neat. She is a teacher, so she is a little strict, but she is fair. She is calm and **sensible**. When there is a problem, she thinks first and then acts.\n\n> Grandma Rose is the oldest, but in many ways she is the youngest! She has a lot of **wrinkles**, and her hands are **wrinkled** too, but her eyes are bright. She is very **wise**. When I am sad, she says something small, and I feel better. She is gentle, but she is also brave. Last year she went up a mountain!\n\n> The twins are fifteen. They are the same height, but they are very different.\n\n> Mia has **wavy** red hair and **freckles** on her nose. She is cute, but don't tell her I said that! She is very talented. She plays the piano and draws beautiful pictures. She is confident and not shy at all. But she is **impatient**. When the bus is late, she gets angry. Her room is messy, with clothes everywhere.\n\n> Leo is quiet and **sensitive**. He is a little shy with new people, and he worries about his weight because he wants to be a football player. He is not stupid, but he can be careless with his homework. When he was little, he was very naughty, Grandma says.\n\n> Some people in the town are rude to foreigners, but most are very kind. Mia says the boys at school think she is attractive, but she says those boys are silly. Tom says she is crazy about drawing and has no time for boys.\n\n> Yesterday, Leo was a bit selfish and ate all the cake. Mia was angry. But Grandma Rose said, \"Life is too short to be serious about cake.\" Everybody laughed, even Mia.\n\n> I think I am lucky, Mom. Please don't work too hard. Give my love to Dad.\n\n> Your son,\n> Minh\n\nMinh read the email again before he sent it. He thought about his own family. His mother was like Anna, he thought, and his father was a bit like Tom. Then he pressed \"Send\" and went downstairs. Somebody was making pancakes.", "words": 491, "new": [{"w": "wavy", "p": "adj", "vi": "gợn sóng"}, {"w": "freckles", "p": "n", "vi": "tàn nhang"}, {"w": "wrinkle", "p": "n/v", "vi": "nếp nhăn"}, {"w": "wrinkled", "p": "adj", "vi": "nhăn nheo"}, {"w": "elegant", "p": "adj", "vi": "thanh lịch"}, {"w": "plain", "p": "adj/n/adv", "vi": "đơn giản; trơn"}, {"w": "impatient", "p": "adj", "vi": "thiếu kiên nhẫn"}, {"w": "sensible", "p": "adj", "vi": "biết điều, hợp lý"}, {"w": "sensitive", "p": "adj", "vi": "nhạy cảm"}, {"w": "wise", "p": "adj", "vi": "khôn ngoan"}]}, {"id": "W09-1", "title": "The First Day", "body": "On Monday, Minh started college. The night before, he could not sleep. He was nervous and a little worried. \"What if nobody talks to me?\" he asked Mia.\n\n\"Don't worry,\" she said. \"You're friendly. People will like you.\"\n\nIn the morning, he took off his **pajamas** and put on jeans and a **hoodie**. He looked in the mirror. He felt uncomfortable. \"Is this OK?\" he asked.\n\nTom looked at him. \"In America, students wear sneakers and a hoodie every day. You look fine.\"\n\n\"In England, we say trainers, not sneakers,\" said Grandma Rose. She was sitting in her **slippers** with a cup of tea. \"And you need a scarf and gloves. It's cold.\"\n\nSo Minh wore a scarf, a **cardigan** from Grandma, a coat, and one glove. He could not find the other glove.\n\nAt college, there was a big surprise. In his first class, the teacher asked everybody to stand up and talk about their country. Minh's face went red. He was **embarrassed**, and his voice was shaking. But when he finished, the class clapped. One student, a tall boy from Spain, said, \"That was amazing. I want to visit Vietnam!\" His name was Sam. Minh was surprised and pleased. Suddenly he did not feel lonely.\n\nAfter class, Sam and Minh had lunch together. Sam was very bright. He was intelligent and creative. He studied design. But he was also modest. He never talked about his good grades.\n\nIn the afternoon, it started to rain. Minh had no **raincoat**. He was wet and cold, and his mood went down. \"What an awful day,\" he thought. \"What horrible weather.\" But Sam was laughing in the rain. \"In Spain, rain is lucky!\" he said. Their laughter made Minh feel better.\n\nOn Saturday, Mia took Minh shopping for winter clothes. They went to a big shop. Minh tried on a **vest** and some **underwear**, because he did not bring enough from Vietnam. Mia tried on a blouse and a belt. In the shop window, there was a man's suit with a red tie. \"You need that for parties,\" Mia said.\n\n\"No, I'm a student,\" Minh said. \"I am not interested in suits.\"\n\nNear the door, they saw summer clothes: **sandals** and a **swimsuit**, on sale. \"Who buys a swimsuit in November?\" Minh asked. Mia laughed.\n\nThen Mia saw her friend Chloe. Chloe was with Leo's girlfriend. They talked and laughed, and Minh waited. Mia came back looking unhappy.\n\n\"What's wrong? You look upset,\" Minh said.\n\n\"Chloe has a new phone. I wish I had one,\" Mia said. \"I'm a bit **jealous**. My phone is old.\"\n\n\"Are you mad at her?\"\n\n\"No, not cross. Just disappointed in myself, I think. It's a silly feeling.\"\n\nOn the way home, a big dog ran out and barked at them. Mia was **frightened**. She held Minh's arm. For a moment she showed real fear. Then she laughed. \"That was unlucky,\" she said. \"First Chloe, then a dog!\"\n\nAt home, Leo was wearing his football **uniform**. He was proud. He was back in the team. \"Look,\" he said. \"I'm not worried about my leg anymore.\" Everyone felt relaxed and comfortable. It was a good end to a long week.", "words": 532, "new": [{"w": "jealous", "p": "adj", "vi": "ghen tị"}, {"w": "embarrassed", "p": "adj", "vi": "ngượng ngùng"}, {"w": "frightened", "p": "adj", "vi": "hoảng sợ"}, {"w": "sandals", "p": "n", "vi": "dép quai hậu, xăng-đan"}, {"w": "slippers", "p": "n", "vi": "dép đi trong nhà"}, {"w": "pajamas", "p": "n", "vi": "đồ ngủ"}, {"w": "uniform", "p": "n/adj", "vi": "đồng phục"}, {"w": "raincoat", "p": "n", "vi": "áo mưa"}, {"w": "swimsuit", "p": "n", "vi": "đồ bơi"}, {"w": "underwear", "p": "n", "vi": "đồ lót"}, {"w": "vest", "p": "n", "vi": "áo gi-lê, áo ba lỗ"}, {"w": "hoodie", "p": "n", "vi": "áo hoodie"}, {"w": "cardigan", "p": "n", "vi": "áo len cài khuy"}]}, {"id": "W09-2", "title": "The Box in the Attic", "body": "One rainy Sunday, Grandma Rose said, \"Minh, can you help me? I need a box from the **attic**.\"\n\nThe house was old and big. Downstairs there was a long **hall** with photos on the walls. Upstairs, a narrow **hallway** went past all the bedrooms. At the end of it, there was a small door and some steps up to the attic. Under the house, there was a dark **basement**, and Tom kept wine in an old **cellar** there. \"This house is like a hotel,\" Minh said. \"It even has a **corridor**.\"\n\nThe attic was dusty and full of boxes. Minh found the right one and carried it down to the **lounge**. Mia came to look.\n\nGrandma Rose opened the box slowly. Inside, there were old clothes and many small things. First, she took out a blue **jumper**. \"I wore this when I was twenty,\" she said. \"It's pure **wool**. My mother made it.\" It had big white **buttons** and a small **pocket** on the front.\n\nThen she took out a dress. It was made of **silk**, soft and shiny. It had a high **collar** and long **sleeves**. \"This was my best dress,\" Grandma said. \"In 1965, it was the height of **fashion**.\" Mia held it up. \"Grandma, this is beautiful. You had great **style**!\"\n\nThere was also a **leather** jacket with a **zip**. \"In America we say **zipper**,\" said Tom from the door. \"We know, Dad,\" said Mia.\n\nAt the bottom of the box, they found a small **handbag** and an old **purse**. Inside the purse was a little box. And inside that box was **jewelry**: a gold **necklace**, two pearl **earrings**, a silver **bracelet**, and a **ring**.\n\nGrandma Rose went quiet. She took the ring and held it in her hand. \"My husband gave me this ring,\" she said softly. \"I lost it thirty years ago. I looked for it everywhere. And it was in my purse, in the attic, all this time.\"\n\nShe put the ring on her finger. There was a tear in her eye, but she was smiling.\n\n\"Tell us the story,\" Mia said.\n\n\"Well,\" said Grandma, \"it was summer. I was on the beach in a **cotton** dress and **sunglasses**. Your grandfather came to me, very nervous, and he dropped his **wallet** in the sand. All his money went everywhere. I helped him pick it up, and we laughed. A year later, we were married.\"\n\nMia was quiet. Then she said, \"That's the best story I've ever heard.\"\n\nLater, Minh went upstairs. He started to **undress** for bed. He put his jeans on the chair and his **backpack** on the floor. He thought about Grandma's ring, and about his own grandmother in Vietnam. Then he picked up his phone and called her.", "words": 456, "new": [{"w": "jumper", "p": "n", "vi": "áo len (Anh)"}, {"w": "button", "p": "n/v", "vi": "cúc áo; nút bấm"}, {"w": "pocket", "p": "n", "vi": "túi áo, túi quần"}, {"w": "zip", "p": "n/v", "vi": "khoá kéo (Anh)"}, {"w": "zipper", "p": "n", "vi": "khoá kéo"}, {"w": "collar", "p": "n/v", "vi": "cổ áo"}, {"w": "sleeve", "p": "n", "vi": "tay áo"}, {"w": "wallet", "p": "n", "vi": "ví"}, {"w": "purse", "p": "n", "vi": "ví nữ"}, {"w": "handbag", "p": "n", "vi": "túi xách tay"}, {"w": "backpack", "p": "n", "vi": "ba lô"}, {"w": "jewelry", "p": "n", "vi": "đồ trang sức"}, {"w": "ring", "p": "n/v", "vi": "nhẫn; reo, gọi"}, {"w": "necklace", "p": "n", "vi": "vòng cổ"}, {"w": "earring", "p": "n", "vi": "khuyên tai"}, {"w": "bracelet", "p": "n", "vi": "vòng tay"}, {"w": "sunglasses", "p": "n", "vi": "kính râm"}, {"w": "cotton", "p": "n", "vi": "vải cotton"}, {"w": "wool", "p": "n", "vi": "len"}, {"w": "leather", "p": "n", "vi": "da thuộc"}, {"w": "silk", "p": "n", "vi": "lụa"}, {"w": "fashion", "p": "n/v", "vi": "thời trang"}, {"w": "style", "p": "n/v", "vi": "phong cách"}, {"w": "undress", "p": "v", "vi": "cởi quần áo"}, {"w": "hall", "p": "n", "vi": "sảnh; hội trường"}, {"w": "hallway", "p": "n", "vi": "hành lang"}, {"w": "corridor", "p": "n", "vi": "hành lang"}, {"w": "lounge", "p": "n", "vi": "phòng khách, sảnh chờ"}, {"w": "cellar", "p": "n", "vi": "hầm chứa"}, {"w": "basement", "p": "n", "vi": "tầng hầm"}, {"w": "attic", "p": "n", "vi": "gác mái"}]}, {"id": "W09-3", "title": "Sam Needs a Home", "body": "Sam, Minh's friend from college, had a problem. He lived in a small room in a student block, but it was noisy and expensive. \"I need a new place,\" he said. \"Can you help me look?\"\n\nSo on Saturday, they walked around the town together. First, they looked at a flat on the fourth floor of an old building. There was no **lift**. \"In America we call it an **elevator**,\" Minh said. \"Tom taught me.\" They walked up the stairs. The flat was small, and there was a big brown spot on the **ceiling**. \"I think water comes in when it rains,\" said Sam. \"No, thank you.\"\n\nNext, they saw a little **cottage** at the edge of town. It was very pretty. It had a red door with a **doorbell**, a small **porch** with a chair, and a **chimney** on the roof. There was a wooden **fence** around the yard, and a green **lawn** in front. \"It's like a picture,\" Minh said. But the **rent** was too high. \"I'm a student, not a king,\" Sam said.\n\nThe third place was a **studio** flat near the college. It had one room, a tiny kitchen and a **balcony**. From the balcony, you could see the whole **neighborhood**: the park, the river, and the old **castle** on the hill. The **landlord** was a friendly old man named Mr. Patel. He showed them the **entrance** and the fire exit. He gave Sam a key. \"This key is for the front door. You have to **lock** the door every night, and you **unlock** it with this key in the morning. It's a bit old, so be patient.\"\n\nThere was already some furniture: an old **armchair**, a **couch**, and a small **bookcase**. \"And from the **terrace** on the roof, you can watch the sunset,\" said Mr. Patel.\n\nSam smiled. \"I'll take it.\"\n\nThey walked home through the town. On the way, Sam told Minh about his family's summer house in Spain. \"It's not a **villa**. It's more like a **hut** by the sea. No electricity, just a **tent** in the garden for my cousins, and a small cabin for my grandmother. But I love it.\"\n\nMinh told him about his town in Vietnam. \"My house is very different,\" he said. \"We have a lot of **steps** up to the front door, because of the floods.\"\n\nThey passed the castle. It was nine hundred years old. \"Did a king live there?\" Minh asked.\n\n\"No,\" said Sam. \"Kings live in a **palace**. A castle is for war.\"\n\nAt home, Minh wrote Sam's new address in his phone: *Flat 2, 14 River Street*. Then he asked Tom a question. \"Tom, what does 'address' mean in this sentence? 'The college will address the problem.'\"\n\n\"It means they will deal with it,\" Tom said. \"Same word, different meaning. English is crazy.\"", "words": 468, "new": [{"w": "balcony", "p": "n", "vi": "ban công"}, {"w": "ceiling", "p": "n", "vi": "trần nhà"}, {"w": "chimney", "p": "n", "vi": "ống khói"}, {"w": "fence", "p": "n", "vi": "hàng rào"}, {"w": "lawn", "p": "n", "vi": "bãi cỏ"}, {"w": "lift", "p": "v/n", "vi": "nâng"}, {"w": "elevator", "p": "n", "vi": "thang máy"}, {"w": "steps", "p": "n", "vi": "bậc thềm"}, {"w": "entrance", "p": "n/v", "vi": "lối vào"}, {"w": "cottage", "p": "n", "vi": "nhà tranh"}, {"w": "villa", "p": "n", "vi": "biệt thự"}, {"w": "palace", "p": "n", "vi": "cung điện"}, {"w": "castle", "p": "n/v", "vi": "lâu đài"}, {"w": "tent", "p": "n", "vi": "lều"}, {"w": "hut", "p": "n", "vi": "túp lều"}, {"w": "neighborhood", "p": "n", "vi": "khu phố"}, {"w": "landlord", "p": "n", "vi": "chủ nhà"}, {"w": "rent", "p": "n/v", "vi": "tiền thuê nhà; thuê"}, {"w": "lock", "p": "n/v", "vi": "khoá"}, {"w": "unlock", "p": "v", "vi": "mở khoá"}, {"w": "doorbell", "p": "n", "vi": "chuông cửa"}, {"w": "porch", "p": "n", "vi": "hiên nhà"}, {"w": "terrace", "p": "n", "vi": "sân hiên"}, {"w": "studio", "p": "n", "vi": "căn hộ một phòng; xưởng"}, {"w": "armchair", "p": "n", "vi": "ghế bành"}, {"w": "couch", "p": "n", "vi": "ghế dài"}, {"w": "bookcase", "p": "n", "vi": "tủ sách"}]}, {"id": "W09-4", "title": "Moving Day", "body": "Sam moved into his new studio on a cold Saturday. Minh and Leo came to help. The room was empty except for the old armchair and the couch. \"I need everything,\" Sam said. \"A bed, a table... everything.\"\n\nThey went to a second-hand furniture shop. It was big and full of old things. Sam bought a **mattress** for his bed, a **bookshelf** for his books, and a **wardrobe** for his clothes. \"I don't need a **closet**,\" he said. \"The wardrobe is enough.\" He also found a small kitchen **cabinet** with a **drawer** for forks and knives.\n\n\"You need something on the floor,\" Leo said. \"It's cold.\" So Sam bought a big **carpet** for the room and a small **rug** for the bathroom.\n\nThere was only one window, and it had no **curtains**. \"I can't sleep in the light,\" Sam said. He bought a long blue **curtain**. The shop also had a **blind** for the kitchen window. \"One curtain is enough for me,\" said Sam. \"I'm poor.\"\n\nThen Minh's phone rang. It was Anna. \"If you're at the second-hand shop, can you look for a baby's bed? My sister is having a baby next month.\"\n\n\"Do you mean a **crib**?\" asked Minh.\n\n\"Yes. Or in England we say a **cot**,\" Anna said.\n\nThey found a white wooden crib. It was perfect. Leo also saw a **bunk** bed. \"I always wanted a bunk bed when I was a kid,\" he said. \"Mia and I wanted to sleep on the top bunk.\"\n\nBack in the studio, they carried everything up. Sam put a **sheet** on the mattress and a warm **blanket** on top. His mother sent him a **duvet** from Spain, and he put two **pillows** on the bed. On the old couch, he put a red **cushion**. \"Now it feels like home,\" he said.\n\nIn the kitchen, there was not much. There was an old **fridge** and a very small **freezer** for ice. There was an old **cooker** too. \"Is that a **stove** or an **oven**?\" asked Leo.\n\n\"Both,\" said Sam. \"You cook on the top, and you bake in the bottom.\"\n\n\"In America, they call a fridge a **refrigerator**,\" Minh said. \"It's the same thing, but a longer word.\"\n\nThere was no **microwave** and no **dishwasher**. \"So I wash everything in the **sink**,\" Sam said. \"It's good exercise.\"\n\nAt the end of the day, they were very tired. There were only two chairs, so Leo sat on a **stool** and Minh sat on an old wooden **bench** by the window. They ate pizza from the box. Outside, it started to snow.\n\n\"Thank you, guys,\" Sam said. \"This is the best room in the world.\"\n\nMinh looked around. The room was small and the furniture was old, but it was warm and full of laughter. He agreed.", "words": 465, "new": [{"w": "bookshelf", "p": "n", "vi": "giá sách"}, {"w": "drawer", "p": "n", "vi": "ngăn kéo"}, {"w": "wardrobe", "p": "n", "vi": "tủ quần áo"}, {"w": "closet", "p": "n", "vi": "tủ âm tường"}, {"w": "cabinet", "p": "n", "vi": "tủ, tủ bếp"}, {"w": "carpet", "p": "n", "vi": "thảm trải sàn"}, {"w": "rug", "p": "n", "vi": "tấm thảm nhỏ"}, {"w": "curtain", "p": "n", "vi": "rèm cửa"}, {"w": "curtains", "p": "n", "vi": "rèm cửa"}, {"w": "blind", "p": "n/adj", "vi": "mành cửa; mù"}, {"w": "pillow", "p": "n", "vi": "gối"}, {"w": "cushion", "p": "n/v", "vi": "gối tựa, nệm"}, {"w": "blanket", "p": "n", "vi": "chăn"}, {"w": "sheet", "p": "n/v", "vi": "tờ giấy; tấm ga"}, {"w": "duvet", "p": "n", "vi": "chăn lông"}, {"w": "mattress", "p": "n", "vi": "nệm"}, {"w": "stool", "p": "n", "vi": "ghế đẩu"}, {"w": "bench", "p": "n", "vi": "ghế băng"}, {"w": "bunk", "p": "n", "vi": "giường tầng"}, {"w": "crib", "p": "n", "vi": "nôi, cũi trẻ em"}, {"w": "cot", "p": "n", "vi": "cũi trẻ em (Anh)"}, {"w": "fridge", "p": "n/v", "vi": "tủ lạnh"}, {"w": "refrigerator", "p": "n", "vi": "tủ lạnh"}, {"w": "freezer", "p": "n", "vi": "tủ đông"}, {"w": "cooker", "p": "n", "vi": "bếp nấu (Anh)"}, {"w": "stove", "p": "n", "vi": "bếp lò"}, {"w": "oven", "p": "n", "vi": "lò nướng"}, {"w": "microwave", "p": "n/v", "vi": "lò vi sóng"}, {"w": "dishwasher", "p": "n", "vi": "máy rửa bát"}, {"w": "sink", "p": "v/n", "vi": "bồn rửa; chìm"}]}, {"id": "W10-1", "title": "The Night the Lights Went Out", "body": "In December, a big storm came. The wind was very strong, and the rain hit the windows all evening. At eight o'clock, there was a loud noise, and suddenly all the lights went out. The TV went off. The **heater** stopped. The whole house was dark.\n\n\"Don't worry,\" said Tom. \"Where are the **candles**?\"\n\nAnna found some candles in a kitchen drawer. She put them on the table in old **jars** and a small glass **vase**. The room looked beautiful in the yellow light.\n\nTom tried the light **switch**. Nothing. He checked the **bulb** in the lamp. It was fine. He took out the **plug** and put it in another **socket**. Nothing. \"It's not our house,\" he said. \"It's the whole street.\"\n\nThe house got cold quickly. In Vietnam, Minh had a **fan** in his room to stay cool, not a heater. Now he wanted a heater more than anything. \"The **radiators** are getting cold,\" Mia said.\n\n\"Then we use the old way,\" said Grandma Rose. She went to the **fireplace** in the living room. Nobody used it anymore. Above it, there was an old **poster** of London and a family photo in a gold **frame**. Grandma Rose put some wood in the fireplace and lit a fire. Soon the room was warm.\n\n\"Now, tea,\" said Grandma Rose. But there was no electricity for the kettle. So she filled a big **pot** with water from the **tap**.\n\n\"We call it a **faucet** in America,\" said Tom.\n\n\"Not in my house,\" Grandma said. She put a **lid** on the pot and hung it over the fire, like in the old days.\n\nWhile the water got hot, Anna found some food. There was no light in the kitchen, so she brought a **tray** with everything on it: bread, cheese, a **tin** of fish, and a **jug** of milk. Leo found an old **pan** and tried to cook eggs on the fire. The first egg fell into the fire. Everybody laughed.\n\nWhen the tea was ready, Grandma Rose made it the English way. She gave Minh a cup on a small **saucer**. \"A real cup, not a **mug**,\" she said. \"This is a special night.\"\n\nThey sat around the fire and told stories. Tom told them about the big storm in America when he was a boy. Grandma told them about the war. Minh told them about the rainy season in Vietnam. \"Sometimes the water comes into the house,\" he said, \"and we put all the **furniture** up high.\"\n\nAt midnight, the lights came back on. The TV started talking, and the heater made a noise. \"Oh no,\" said Mia. \"I liked it better in the dark.\"\n\nThen the fire **alarm** in the hall started to beep, because of the smoke from the fireplace. Tom ran to stop it.\n\nThe next morning, there were dirty **dishes** every
