ts doing research, international students, older students coming back to study. The **faculty** of business had professors from fifteen countries.\n\nMinh's scholarship paid his **tuition** fees, but he still worked at The Blue Cup on weekends. He also wrote for the university newspaper. He was very busy. Sometimes he was too tired to **concentrate**.\n\n\"You need to rest,\" said Hana. She was back from Japan and in her final year too. \"You can't do everything.\"\n\n\"I can try,\" said Minh.\n\nThere was a lot of work. The **curriculum** was hard. The **syllabus** for each class had a long reading list. There were essays, presentations and exams. Every piece of work had an **assessment**. The professors would **assess** each student carefully. They would **evaluate** not only the answers but the thinking.\n\nMinh was worried about one thing. \"What if my English isn't good enough?\" he asked Dr. Bell. \"My classmates are English. I'm not.\"\n\n\"Your English is excellent,\" she said. \"And you have something they don't. You've lived in two cultures. That's a kind of **intelligence** they can't learn from books.\"\n\nThere was a serious talk in the first week about **plagiarism**. \"If you copy someone else's work and say it's yours, you will fail,\" said the head of the faculty. \"If you **cheat** in an exam, you will be sent home. This is a question of **discipline**.\"\n\nMinh had heard of a student who was caught cheating last year. He was not allowed to register for this year. \"It's like **detention** at school,\" said Hana. \"But much worse.\"\n\nMinh's **attendance** was perfect. He tried to attend every class, and he did. His only **absence** was one day when he had a fever. He did his revision every evening. He asked for feedback on every essay.\n\n\"You'll be fine,\" said Hana. \"You'll **qualify** with a first-class degree. I know it.\"\n\n\"How do you know?\"\n\n\"Because you never stop,\" she said. \"You're the most stubborn person I know.\"\n\nAt the end of the term, there was a graduation ceremony for last year's students. Minh watched them in their black gowns and hats, throwing their hats in the air. Next year, it would be him. He imagined his parents there, in the audience. His mother crying. His father proud. Grandma Rose shouting something embarrassing.\n\n\"Next year,\" he said to Hana.\n\n\"Next year,\" she said. \"Together. Both **graduates**.\"\n\nHe thought about what he would do after his **qualification**. A job? A master's degree? Go home to Vietnam? He did not know. But he knew he wanted to write. He wanted to tell stories. Maybe, he thought, he could enroll in a journalism course. Or find a newspaper that would take him. The enrollment for next year's courses opened in January. He had time to decide.", "words": 654, "new": [{"w": "lecture", "p": "n/v", "vi": "bài giảng"}, {"w": "seminar", "p": "n", "vi": "buổi thảo luận chuyên đề"}, {"w": "campus", "p": "n", "vi": "khuôn viên trường"}, {"w": "faculty", "p": "n", "vi": "đội ngũ giảng viên"}, {"w": "undergraduate", "p": "n", "vi": "sinh viên đại học (chưa tốt nghiệp)"}, {"w": "graduate", "p": "n/v/adj", "vi": "người tốt nghiệp"}, {"w": "postgraduate", "p": "n/adj", "vi": "sau đại học"}, {"w": "tuition", "p": "n", "vi": "học phí"}, {"w": "attendance", "p": "n", "vi": "sự chuyên cần"}, {"w": "absence", "p": "n", "vi": "sự vắng mặt"}, {"w": "curriculum", "p": "n", "vi": "chương trình giảng dạy"}, {"w": "syllabus", "p": "n", "vi": "đề cương môn học"}, {"w": "qualification", "p": "n", "vi": "bằng cấp"}, {"w": "qualify", "p": "v", "vi": "đạt đủ trình độ"}, {"w": "intelligence", "p": "n", "vi": "trí thông minh"}, {"w": "concentrate", "p": "v/n", "vi": "tập trung"}, {"w": "concentration", "p": "n", "vi": "sự tập trung"}, {"w": "assessment", "p": "n", "vi": "sự đánh giá"}, {"w": "assess", "p": "v", "vi": "đánh giá"}, {"w": "evaluate", "p": "v", "vi": "đánh giá"}, {"w": "plagiarism", "p": "n", "vi": "đạo văn"}, {"w": "cheat", "p": "v/n", "vi": "gian lận"}, {"w": "discipline", "p": "n/v", "vi": "kỷ luật"}, {"w": "detention", "p": "n", "vi": "bị phạt ở lại trường"}]}, {"id": "W27-1", "title": "The Careers Fair", "body": "In November, the university had a big careers fair. Hundreds of companies came to **recruit** students. It was the biggest **recruitment** event of the year. There were banks, technology companies, schools, hospitals and newspapers. Every final-year student went. Every **candidate** wore a suit and carried a pile of CVs.\n\nMinh went with Hana and a friend from his course, Tariq. Tariq wanted to be a teacher. \"I want to work in a **state** school, not a private one,\" he said. \"Everyone deserves a good education, not just rich kids.\"\n\nThey stopped at a table for teachers. A woman talked to Tariq about different kinds of schools. \"There are **boarding** schools, where children live at school. There are **mixed** schools for boys and girls, and single-sex schools. There are **vocational** schools that teach practical skills, like building or cooking.\"\n\n\"What's the biggest problem in schools today?\" asked Tariq.\n\n\"**Literacy** and **numeracy**,\" she said. \"Too many children leave school without good reading and maths skills. And behaviour. Some children are so difficult that schools have to **expel** them. That's never a good solution.\"\n\nTariq took a **handout** and a **worksheet** about teacher training. \"I'll apply,\" he said.\n\nHana went to the hospital table. They talked about nursing jobs and further study. \"You could do a **bachelor**'s degree in nursing, then a **master**'s in a special area,\" the woman said. \"Some nurses even do a **doctorate**. A **PhD** in nursing research.\"\n\nMinh walked around alone. He saw a table for a big bank. They wanted business graduates. The salary was high. \"Experienced staff earn a lot,\" said the man at the table. \"Of course, you start at the bottom.\" Minh took a brochure but didn't feel excited.\n\nThen he saw a small table in the corner. It said: \"The Riverford Gazette.\" There was nobody there except one woman, sitting alone with a **textbook** about journalism and a **workbook** of notes. She was about fifty, with short gray hair and sharp eyes.\n\n\"Hello,\" said Minh. \"Are you from the Gazette?\"\n\n\"I'm the editor,\" she said. \"Grace Okafor. Nobody comes to my table. Students want to work for big companies. Local newspapers are not fashionable.\"\n\n\"Okafor?\" said Minh. \"My landlord is Mr. Okafor.\"\n\nShe laughed. \"Then you live with my father. He told me about you. The Vietnamese boy who fixes things and writes food reviews.\"\n\nMinh couldn't believe it. They talked for half an hour. Grace told him about her **occupation**. \"Being a journalist is not a job,\" she said. \"It's a life. You work long hours. You're never rich. But you tell the truth, and sometimes, the truth changes things.\"\n\nShe told him that the Gazette was looking for an intern. \"Part-time, during your final year. Then maybe a contract after you graduate. Maybe. Local newspapers are struggling. Employment is not guaranteed. There's a lot of unemployment in journalism right now. Many journalists work freelance. Being a freelancer is hard.\"\n\n\"I'd like to apply,\" said Minh.\n\n\"Send me your CV,\" she said. \"Or resume, as Americans say. Two **references**. And three things you've written. I'll look at them. But I'm a hard **applicant** to please. I mean, a hard employer to please.\"\n\nThat night, Minh worked on his application. He chose three pieces: his review of the chip shop, his article about Science Week, and an article about saving The Blue Cup. He asked Dr. Bell and Daniel to write his references.\n\n\"Do you really want to work for a small local newspaper?\" asked Tariq. \"The bank pays four times more.\"\n\n\"I know,\" said Minh. \"But I want to write. And I like small places. Big things happen in small places.\"\n\nBefore he sent it, he read Grace's company page. The Gazette was a hundred years old. Two years ago, the owners wanted to close it. Grace fought to keep it open. They had to **dismiss** half the staff. Some journalists were made redundant. Others had to **resign**. The old editor's **resignation** letter was famous in Riverford. He wrote: \"I'm not leaving journalism. Journalism is leaving me.\"\n\nMinh thought about the people who were **sacked**. He thought about The Blue Cup. It was the same story: small places fighting to survive.\n\nHe sent the application. Then he waited. He was good at waiting by now.\n\nA week later, Grace called. \"Come in on Monday,\" she said. \"Let's talk properly. I don't **promote** people easily, and I don't take interns easily either. But your Blue Cup article was good. **Shift** starts at eight.\"", "words": 749, "new": [{"w": "expel", "p": "v", "vi": "đuổi học"}, {"w": "boarding", "p": "adj/n", "vi": "nội trú"}, {"w": "state", "p": "n/v/adj", "vi": "bang"}, {"w": "mixed", "p": "adj", "vi": "pha trộn"}, {"w": "vocational", "p": "adj", "vi": "hướng nghiệp"}, {"w": "literacy", "p": "n", "vi": "khả năng đọc viết"}, {"w": "numeracy", "p": "n", "vi": "khả năng tính toán"}, {"w": "bachelor", "p": "n", "vi": "cử nhân"}, {"w": "master", "p": "n/v/adj", "vi": "bậc thầy"}, {"w": "doctorate", "p": "n", "vi": "bằng tiến sĩ"}, {"w": "PhD", "p": "n", "vi": "bằng tiến sĩ"}, {"w": "textbook", "p": "n/adj", "vi": "sách giáo khoa"}, {"w": "workbook", "p": "n", "vi": "sách bài tập"}, {"w": "handout", "p": "n", "vi": "tài liệu phát tay"}, {"w": "worksheet", "p": "n", "vi": "phiếu bài tập"}, {"w": "occupation", "p": "n", "vi": "nghề nghiệp"}, {"w": "recruit", "p": "v/n", "vi": "tuyển dụng"}, {"w": "recruitment", "p": "n", "vi": "tuyển dụng"}, {"w": "candidate", "p": "n", "vi": "ứng cử viên / ứng viên"}, {"w": "applicant", "p": "n", "vi": "ứng viên / người nộp đơn"}, {"w": "reference", "p": "n/v", "vi": "tham khảo"}, {"w": "promote", "p": "v", "vi": "thúc đẩy, quảng bá"}, {"w": "resign", "p": "v", "vi": "từ chức"}, {"w": "resignation", "p": "n", "vi": "sự từ chức"}, {"w": "dismiss", "p": "v", "vi": "sa thải"}, {"w": "sack", "p": "v", "vi": "sa thải"}, {"w": "shift", "p": "v/n", "vi": "sự thay đổi; chuyển đổi"}]}, {"id": "W27-2", "title": "The Newsroom", "body": "On Monday at eight o'clock, Minh arrived at the offices of the Riverford Gazette. It was a small, old building on the main street, above a shoe shop. The newsroom had ten desks, five computers and a lot of coffee cups.\n\nGrace introduced him to the team. There was Raj, the deputy editor and Minh's **supervisor**. There was Ellie, a young reporter who had joined as a **trainee** two years ago. There was an old photographer called Bill, who had worked there for forty years. There were two other reporters and a woman who did the marketing and the sales of advertisements.\n\n\"This is our whole **workforce**,\" said Grace. \"Ten years ago, we had forty people. Now, it's us. We all do everything.\"\n\nRaj explained Minh's **duties**. \"You'll start with small stories. Local events, school news, council meetings. You'll check facts. You'll answer the phone. It's not glamorous. But every journalist starts here. I was an **apprentice** at a newspaper when I was sixteen. I made coffee for a year.\"\n\nThe workload was heavy. On his first day, Minh wrote three short stories: a cat rescued from a tree, a new bakery opening, and a council decision about parking. He worked from eight until seven. There was no overtime pay. \"Interns don't get overtime,\" said Ellie. \"Or a real **paycheck**. You get a little money and a lot of experience.\"\n\n\"What are the **perks** of the job?\" Minh joked.\n\n\"Free coffee,\" said Ellie. \"Bad coffee, but free.\"\n\nIn the afternoon, Grace sent Minh with Ellie to cover a story. Workers at a local factory were on **strike**. The factory made car parts. The workers' **union** said the company paid them too little. The company said it could not pay more. \"Sales are down,\" said the factory **executive**, a man in an expensive suit. \"Export to Europe is down. Demand is down. The **turnover** of the company has fallen by twenty percent.\"\n\nOutside the factory, the workers stood with signs. One of them was a skilled laborer who had worked there for thirty years. \"We work hard,\" he said. \"Manual work, heavy work. Our **earnings** haven't gone up for five years. The **chairman** of the company got a big bonus last year. We got nothing.\"\n\nMinh listened. He took notes. He asked careful questions. Ellie watched him. \"You're good at listening,\" she said later. \"That's the most important skill. Most people only want to talk.\"\n\nBack at the office, they wrote the story together. Grace read it. She made a lot of changes. \"Never take sides,\" she said. \"Tell both stories. The workers' story and the company's story. Let the readers decide.\"\n\nMinh learned a lot that week. He learned about local industry and commerce, the industrial past of the town and its commercial future. Every small enterprise had a story. He learned how a small organization like the Gazette worked: the administration, the management, the money. He learned that trade between countries could change a small town's life. When supply was low and demand was high, prices went up. When a big corporation closed a factory, a hundred families had no work.\n\nHe also met interesting people. A **consultant** who helped small businesses. A young **entrepreneur** who started a company selling Vietnamese-style coffee. \"I'm the **founder**,\" she said proudly. \"And the only worker.\" An expert on local history who had written five books about Riverford.\n\nOn Friday, Grace called him into her office. \"Well?\" she said. \"What do you think?\"\n\n\"It's hard,\" said Minh. \"Very hard. But I love it.\"\n\nGrace smiled for the first time all week. \"Good answer. You've done well for an intern. This internship is three months. If you're still alive at the end, we'll talk.\"\n\n\"Is that a target?\" asked Minh.\n\n\"That's my objective,\" said Grace. \"You have a lot of responsibility here. A lot of tasks. If you achieve them, that's an achievement. If not, you'll be a very well-trained coffee maker.\"\n\nOn the bus home, Minh was exhausted. But he was smiling. The workplace was small, old and noisy. The pay was terrible. But he had found something he loved. Maybe, one day, he would be unskilled at nothing and skilled at this. He wanted to import every lesson and export every story.", "words": 710, "new": [{"w": "workforce", "p": "n", "vi": "lực lượng lao động"}, {"w": "supervisor", "p": "n", "vi": "người giám sát"}, {"w": "executive", "p": "n/adj", "vi": "giám đốc điều hành"}, {"w": "chairman", "p": "n", "vi": "chủ tịch"}, {"w": "founder", "p": "n/v", "vi": "người sáng lập"}, {"w": "entrepreneur", "p": "n", "vi": "doanh nhân"}, {"w": "consultant", "p": "n", "vi": "chuyên gia tư vấn"}, {"w": "trainee", "p": "n", "vi": "người tập sự"}, {"w": "apprentice", "p": "n/v", "vi": "người học nghề"}, {"w": "duty", "p": "n/adj", "vi": "nhiệm vụ"}, {"w": "perk", "p": "n/v", "vi": "đặc quyền nhỏ"}, {"w": "paycheck", "p": "n", "vi": "tiền lương"}, {"w": "union", "p": "n", "vi": "công đoàn"}, {"w": "strike", "p": "v/n", "vi": "đình công"}, {"w": "earnings", "p": "n", "vi": "thu nhập"}, {"w": "turnover", "p": "n", "vi": "doanh số"}]}, {"id": "W27-3", "title": "The Digital Newspaper", "body": "The Riverford Gazette had a problem: fewer people bought the paper version every year. \"Young people don't buy newspapers,\" said Grace. \"They read everything on their phones. We need a better website. We need to be on social media. We need a new strategy.\"\n\nShe gave Minh a new task. \"You're young. You understand this. Help us.\"\n\nMinh was not an expert, but Sam was. Sam's design firm was small, but they had made websites for many companies. Minh asked him for help. Sam came to the office with his laptop. He looked at the Gazette's homepage and made a face.\n\n\"This looks like 2005,\" he said. \"The links don't work. You can't scroll properly on a phone. There's no touchscreen design. And look at this icon. Is that a newspaper or a sandwich?\"\n\nGrace laughed. \"That's why we need you. Our objective is simple: more readers. The paper has no shares, no rich owners, just us.\"\n\nSam made a **proposal**. He wrote it like a professional. There was an **agenda** for the first meeting. He made a presentation with a spreadsheet of costs. At the meeting, they discussed it. Minh wrote the minutes. Then they had to negotiate the price. The Gazette had very little money.\n\n\"Look,\" said Sam. \"I'll do it cheap. In return, you put my company's logo on the website. Free advertising.\"\n\n\"Deal,\" said Grace.\n\nThey started a campaign to launch the new website. They made a slogan: \"Riverford Gazette: Your Town, Your News.\" Sam designed it. Ellie became a blogger and wrote a blog about life in Riverford. Bill the photographer started a podcast where he told stories about his forty years of photos. Minh started writing a weekly column about The Blue Cup and the people who came there.\n\nThe new website was very efficient. It worked on phones, laptops and tablets. It had a simple login page. You could make a profile with a username, change your settings, and subscribe to the newsletter. Readers could leave a comment under every article. The efficiency of the system surprised Grace. \"In the old days, it took a week to change anything,\" she said. \"Now it takes a second.\"\n\nBut there were problems too. One night, a hacker tried to hack the website. Sam had to update the security. Someone put spam in the comments, hundreds of messages selling medicine. The inbox was full of strange emails with dangerous attachments. \"Never open an attachment from someone you don't know,\" said Sam. Grace said she understood. Then she opened one. Sam had to uninstall three programs from her computer.\n\nMinh learned a lot about technology. He learned about coding: Sam showed him how the code behind the website functioned. He learned how a database stored every article. He learned how to use different browsers to test the website. He learned that every sensor in a phone, the GPS that tells you where you are, the wireless connection, the Bluetooth for your headphones, all sent information. \"Your phone knows everything about you,\" said Sam. \"Every tab you open. Every time you zoom in on a photo. Where your cursor goes.\"\n\n\"That's frightening,\" said Minh.\n\n\"That's modern life,\" said Sam.\n\nThe new website was a success. In the first month, the number of readers doubled. Young people started to follow the Gazette online. Ellie's blog had a thousand followers. Bill's podcast was streaming on every app. The paper version still sold to old people, and the digital version reached everybody else.\n\nThe Gazette was no longer just a **competitor** to the big newspapers. It was a local partnership: the paper, the café, Sam's company, the town. A big agency from London called Grace. They wanted to buy advertisements. Their **agent** said: \"Your local content is very valuable. People trust local news.\"\n\nGrace was delighted. At the next **conference** of local newspapers, she gave a talk about their success. She wrote a memo to the staff afterwards: \"Thank you, everybody. Especially our intern, who brought his clever friend. Our policy from now on: digital first.\"\n\nMinh read the memo three times. Then he forwarded it to his parents in Vietnam. His father, who didn't read English, asked Lan to translate. Then he called Minh. \"Your boss says thank you to you?\" he said. \"In writing? Then you are doing well, son.\"\n\n\"I'm just an intern, Dad.\"\n\n\"An intern who gets a thank you letter,\" said his father. \"That's not just an intern.\"\n\nMinh smiled. He put his phone down. On his desk, there was a new voicemail from Grace: \"Minh. Come early tomorrow. Big story. You and Ellie. Bring your notebook.\" He wondered what it could be. He didn't have to wait long to find out. He would soon learn to operate in a real newsroom on a real case. The USB stick in his pocket held all his notes. The operating system of his old laptop was slow, but he didn't care. He was ready.", "words": 825, "new": [{"w": "agent", "p": "n", "vi": "đại lý"}, {"w": "competitor", "p": "n", "vi": "đối thủ"}, {"w": "conference", "p": "n", "vi": "hội nghị"}, {"w": "agenda", "p": "n", "vi": "chương trình họp"}, {"w": "proposal", "p": "n", "vi": "đề xuất"}]}, {"id": "W28-1", "title": "The Rumor", "body": "The big story Grace talked about began with a **rumor**. Someone wrote on social media that the town council was going to close the Riverford hospital and move it to the city. The post went viral. In one day, ten thousand people shared it. It was trending on every app. People were angry and afraid.\n\n\"Is it true?\" Grace asked at the morning meeting. \"That's our job. Find out.\"\n\nShe sent Minh and Ellie to investigate. On the way out, Minh's old laptop began to freeze, as usual. He had to restart it twice and reboot the internet router. \"Make a backup of everything,\" said Grace. \"Always.\" The Gazette had no automatic system for saving files. \"One day we'll automate it,\" she said. \"Maybe an artificial intelligence will do my job. A virtual editor. Until then, I'm the editor here.\" \"This is real **journalism**,\" she said. \"Not cats in trees. Be careful. Check everything.\"\n\nThey started with the post. It came from an **influencer** with fifty thousand followers who usually posted about fashion. She didn't say where she got the information. \"It might be fake,\" said Ellie. \"Or it might be true. We need a source.\"\n\n\"A political scandal like this could be huge,\" said Ellie. \"If it's true.\" They called the hospital. The press office said: \"No comment.\" They called the council. \"We will announce our plans later. No announcement has been made,\" said a spokesperson. That was not a no.\n\nMinh had an idea. \"Hana works at the hospital. Maybe she's heard something.\"\n\nHana had heard something. \"There's **gossip** in the staff room,\" she said. \"Everyone's worried. But nobody knows anything official.\"\n\nEllie found a document on the council website: the minutes of a meeting from last month. It was very long and boring. But on page forty, there was a short sentence: \"The committee discussed possible changes to local health services.\" That was all.\n\n\"It's not proof,\" said Grace. \"But it's something.\"\n\nThey kept working. Minh went to a public meeting of the council. A politician stood up to answer questions. The room was full of angry people. \"There are no plans to close the hospital,\" he said. \"Not at this time.\"\n\n\"Not at this time?\" said Minh, standing up. \"Does that mean in the future?\"\n\nThe politician looked uncomfortable. \"I can't comment on the future.\"\n\nThe next day, the story was in every newspaper. The big national **tabloids** had dramatic headlines: \"TOWN TO LOSE HOSPITAL!\" The serious **broadsheet** papers were more careful. On TV, a **bulletin** on the evening news had a short report. A national **columnist** wrote that small towns were being forgotten by the government.\n\nBut the Gazette did something different. Grace wrote an **editorial**. She explained what was known and what was not known. \"We don't publish rumors,\" she wrote. \"We publish facts. Here are the facts. Here are the questions. We will keep asking until we get answers.\"\n\nIt was informative, calm and clear. Readers loved it. For a small publication, it was a big moment. The website had its biggest day ever. Hundreds of new subscribers signed up. Readers, viewers of the local TV news and listeners of local radio all quoted the Gazette.\n\nSome people were angry, though. A local **critic** wrote that the Gazette was biased against the council. Others said the opposite. \"If both sides are angry with you,\" said Grace, \"you're probably doing a good job.\"\n\nThere was also a question of privacy. Ellie found the name of a nurse who said the hospital was closing. \"Do we use her name?\" asked Minh.\n\n\"No,\" said Grace firmly. \"She'll lose her job. We protect our sources. Always.\"\n\nA week later, the truth came out. The council had a plan, but not to close the hospital. They wanted to move one small department to the city. The influencer's post was exaggerated. But it wasn't completely false.\n\nAt the end of the week, Grace called Minh into her office. \"You asked the right question at that meeting,\" she said. \"'Does that mean in the future?' That one question made the whole story.\"\n\n\"I was just curious,\" said Minh.\n\n\"Curiosity is a journalist's best tool,\" said Grace. \"Never lose it.\"\n\nThat evening, Minh thought about what he had learned. In Vietnam, newspapers were controlled by the government. There was **censorship**. Journalists could not **censor** themselves completely, but they had to be careful. Here, the press was free. In a **democracy**, the press could ask questions of a minister, a member of **parliament**, even the prime minister. That freedom was important. It came with responsibility, too.\n\nHe thought about politics and society. Britain was a **democratic** country, but also a **monarchy**, with a king. America was a **republic**, with a president and a **congress** with two parts, the House and the Senate. Some countries had a **dictator**. Every system was different. But in every system, he thought, people needed the truth.\n\nHe wrote it all in his notebook. Then he wrote a new column for the next edition of the Gazette. It was called \"Questions.\" It was about why asking questions matters. The publisher of the Gazette, an old friend of Grace's, read it and said it was the best **commentary** of the year. Grace put it on the front page. That kind of coverage for an intern was unusual. Nobody, not even Grace, used the word criticism that week. It was all praise. The story was not reality TV or a sitcom. It was real.", "words": 914, "new": [{"w": "journalism", "p": "n", "vi": "nghề báo"}, {"w": "columnist", "p": "n", "vi": "người viết chuyên mục"}, {"w": "critic", "p": "n", "vi": "nhà phê bình"}, {"w": "commentary", "p": "n", "vi": "lời bình luận"}, {"w": "bulletin", "p": "n", "vi": "bản tin"}, {"w": "tabloid", "p": "adj/n", "vi": "báo lá cải (tin giật gân, khổ nhỏ)"}, {"w": "broadsheet", "p": "n", "vi": "báo khổ lớn (tin chính thống, chất lượng)"}, {"w": "gossip", "p": "n/v", "vi": "chuyện ngồi lê đôi mách"}, {"w": "rumor", "p": "n", "vi": "tin đồn"}, {"w": "influencer", "p": "n", "vi": "người có ảnh hưởng (trên mạng xã hội)"}, {"w": "censor", "p": "n/v", "vi": "kiểm duyệt"}, {"w": "censorship", "p": "n", "vi": "kiểm duyệt"}, {"w": "editorial", "p": "adj/n", "vi": "bài xã luận"}, {"w": "parliament", "p": "n", "vi": "quốc hội"}, {"w": "congress", "p": "n", "vi": "quốc hội"}, {"w": "democracy", "p": "n", "vi": "nền dân chủ"}, {"w": "democratic", "p": "adj", "vi": "(thuộc) dân chủ"}, {"w": "dictator", "p": "n", "vi": "nhà độc tài"}, {"w": "republic", "p": "n", "vi": "nước cộng hoà"}, {"w": "monarchy", "p": "n", "vi": "chế độ quân chủ"}]}, {"id": "W28-2", "title": "The Burglaries", "body": "In January, there was a wave of crime in Riverford. Five houses were broken into in two weeks. A **burglar** came at night, when people were sleeping, and took jewelry, laptops and money. The police said it was a **burglary** gang from the city.\n\nGrace sent Minh to cover the story. He interviewed the victims. One old woman cried when she talked about it. \"He took my wedding ring,\" she said. \"It's not worth much money. But my husband gave it to me fifty years ago.\"\n\nMinh felt angry. He wanted to help. But a journalist's job was to report, not to catch **criminals**.\n\nThe police were working hard. Minh talked to a detective called Inspector Shah. She explained the difference between crimes. \"A burglary is when someone breaks into a building to steal. A **robbery** is when someone uses violence or threats. Theft is the general word for stealing. A **shoplifter** steals from shops. A **pickpocket** steals from your pocket in the street.\"\n\n\"Have you had any **murders** in Riverford?\" asked Minh.\n\n\"The last **murder** was in 1987,\" said Inspector Shah. \"The **murderer** is still in prison. Riverford is a safe town. Mostly. We have some **vandalism**, young people breaking windows and painting walls. Some **shoplifting**. A few years ago, there was a case where someone tried to **kidnap** a child, but it was a misunderstanding with a father. Mostly, it's small things.\"\n\nTwo weeks later, the police made an **arrest**. A young man was caught at three in the morning, climbing through a window. They found the stolen jewelry in his car. The old woman got her ring back. Minh wrote the story.\n\nBut then there was a surprise. The young man said he was **innocent**. He said he was climbing into his girlfriend's house, not stealing. And the jewelry was not his car; it was his brother's car. The police **charged** him with burglary anyway.\n\nThere was a **trial** at the court in the city. Minh went every day for a week. He had never been to a court. It was very formal. The judge wore a wig. There was a **jury** of twelve ordinary people who would decide if the man was guilty or not.\n\nA **witness** said she saw the man in the street on the night of one of the burglaries. Another witness, the man's girlfriend, said he was with her all night. The lawyers argued. They **accused** each other of lying.\n\nMinh found it fascinating and sad. The man was young, about his age. He looked frightened. His mother sat behind him every day. She was an immigrant from Eastern Europe. She told Minh, in the corridor, that her son had made mistakes but was not a thief. \"People see a foreigner and think criminal,\" she said. \"This is **discrimination**. It's **racism**.\"\n\nMinh did not know what to believe. He wrote both sides carefully.\n\nIn the end, the jury decided that the man was guilty of two burglaries but not the others. His **punishment** was two years in prison. As a **prisoner**, he would have the chance to study and work. His mother cried in the corridor.\n\nAfter the trial, Minh talked to Grace. \"Was it unfair?\" he asked. \"Maybe he was **innocent** of some of it. Maybe people judged him because he's an immigrant.\"\n\n\"Maybe,\" said Grace. \"The courts aren't perfect. That's why we report on them. Justice needs light.\"\n\nGrace told him about the bigger problems in society: inequality between rich and poor, the **rights** of **refugees** and immigrants, homelessness in the city. \"There's more **sexism** and racism than people think,\" she said. \"And there's a **minority** of people who are **racist** and loud. But the **majority** of people are kind. Our job is to show both.\"\n\nThat evening, Minh walked past a homeless man sitting outside the train station. He had walked past him many times. Today, he stopped. He bought him a coffee and a sandwich and sat with him for ten minutes. The man's name was Pete. He had been a soldier. He had lost his job, then his house, then his family.\n\n\"Thank you,\" said Pete. \"Most people don't see me.\"\n\nMinh thought about equality, and human **rights**, and how easily anyone could fall. On the bus home, he wrote a note in his book: \"Next story: Pete.\" He knew Grace would say yes.\n\nIn the **kingdom** of Britain, which was once an empire that ruled a quarter of the world, there were still people sleeping on the street. Someone had to elect to see them. Someone had to tell their story. The government could ban a lot of things, Grace said, and **punish** a lot of people. But it couldn't ban the truth. A **vandal** could break a window; a good story could open one.", "words": 798, "new": [{"w": "kingdom", "p": "n", "vi": "vương quốc"}, {"w": "majority", "p": "n/adj", "vi": "đa số"}, {"w": "minority", "p": "n/adj", "vi": "thiểu số"}, {"w": "rights", "p": "n", "vi": "quyền"}, {"w": "discrimination", "p": "n", "vi": "sự phân biệt đối xử"}, {"w": "racism", "p": "n", "vi": "chủ nghĩa phân biệt chủng tộc"}, {"w": "racist", "p": "adj/n", "vi": "phân biệt chủng tộc"}, {"w": "sexism", "p": "n", "vi": "sự phân biệt giới tính"}, {"w": "refugee", "p": "n", "vi": "người tị nạn"}, {"w": "criminal", "p": "n/adj", "vi": "kẻ phạm tội"}, {"w": "burglar", "p": "n", "vi": "kẻ trộm đột nhập"}, {"w": "burglary", "p": "n", "vi": "đột nhập (vào toà nhà để trộm)"}, {"w": "robbery", "p": "n", "vi": "cướp (dùng vũ lực hoặc đe doạ)"}, {"w": "murder", "p": "n/v", "vi": "vụ giết người"}, {"w": "murderer", "p": "n", "vi": "kẻ giết người"}, {"w": "kidnap", "p": "v", "vi": "bắt cóc"}, {"w": "vandal", "p": "n/adj", "vi": "kẻ phá hoại"}, {"w": "vandalism", "p": "n", "vi": "phá hoại tài sản"}, {"w": "shoplifting", "p": "n", "vi": "trộm đồ trong cửa hàng"}, {"w": "shoplifter", "p": "n", "vi": "kẻ trộm trong cửa hàng"}, {"w": "pickpocket", "p": "n", "vi": "kẻ móc túi"}, {"w": "arrest", "p": "v/n", "vi": "bắt giữ"}, {"w": "charge", "p": "v/n", "vi": "tính phí"}, {"w": "accuse", "p": "v", "vi": "buộc tội"}, {"w": "innocent", "p": "adj/n", "vi": "vô tội"}, {"w": "trial", "p": "n/v", "vi": "phiên toà"}, {"w": "jury", "p": "n", "vi": "bồi thẩm đoàn"}, {"w": "witness", "p": "n/v", "vi": "nhân chứng"}, {"w": "punish", "p": "v", "vi": "trừng phạt"}, {"w": "punishment", "p": "n", "vi": "hình phạt"}, {"w": "prisoner", "p": "n", "vi": "tù nhân"}]}, {"id": "W28-3", "title": "Remembrance", "body": "In November, Minh wrote a story about Pete, the homeless man. Grace published it. It was very popular. A local charity read it and found Pete a room in a hostel. Pete came to the Gazette office to say thank you. He was wearing a red paper flower on his coat: a poppy.\n\n\"It's for Remembrance Day,\" he explained. \"We remember the soldiers who died in wars.\"\n\nPete had been in the **military** for twelve years. First in the army, then in the **navy**. He had served in conflicts in the Middle East. \"I saw **violence** you can't imagine,\" he said quietly. \"**Violent** things. Friends died. When I came home, I couldn't sleep. I couldn't work. That's how I ended up on the street.\"\n\nHe told Minh about the war. The enemy, the **allies**, the **troops**. He talked about a **battle** where his **squad** was attacked and three men died. \"Every **weapon** you see in films, I've held,\" he said. \"A **gun** is heavy. Not just in your hands.\"\n\nMinh did not know what to say. He thought of his grandmother's stories about the war in Vietnam. Every country had its wars. Every war had its victims.\n\nFor Remembrance Day, the town had a ceremony at the war monument. Minh went with the Parkers. Grandma Rose wore her late husband's medals. \"He fought in Korea,\" she said. \"He never talked about it.\"\n\nAt eleven o'clock, everybody was silent for two minutes. Even the birds seemed quiet. Minh thought about all the soldiers who had died: British, Vietnamese, everyone. Old men in their uniforms stood very straight. A young soldier played a sad song on a trumpet.\n\nAfter the ceremony, there was a small **demonstration** at the edge of the square. A group of young people held signs against war. \"No more **invasions**!\" they shouted. \"Stop the bombs!\" Some old people were angry. They thought it was disrespectful. A police officer stood nearby, just in case. But there was no **riot**, only shouting.\n\nMinh talked to both sides. One of the protesters said, \"We respect the soldiers. We just don't want new wars. Every country that **invades** another creates new **terrorism**, new **terrorists**, new victims.\"\n\nAn old soldier said, \"I understand. I don't like war either. But sometimes you have to fight. My father fought against an **invasion** in 1940.\"\n\nMinh wrote both stories. Grace was pleased. \"Good,\" she said. \"No easy answers. That's life.\"\n\nThe next week, there was happier news. Leo was playing football again. After a year, his knee was strong. His first match back was on Saturday. Minh went to write about it for the sports page.\n\nIt was a local league match. The **opponents** were Leo's old **rivals**, a team from the next town. The **squad** was nervous. Leo was more nervous. He had only played **amateur** football, but he was an athletic, natural sportsman. \"I don't care if we lose,\" he said. \"I just want to play.\"\n\nIn the first half, Leo was careful. He was afraid of his knee. Then, slowly, he became more confident. He began to **sprint** down the side of the pitch like a real **sprinter**. He learned to **dribble** past players again. He made a strong **tackle**. A player kicked his leg and the referee gave a **foul**. Leo got up. He was fine.\n\nIn the second half, the ball came to him in the air. He hit it before it touched the ground, a perfect **volley**. It **bounced** once and went into the goal. Victory! The record score for the season was two-nil. Their defeat of the old rivals was the best news of the year. There was even a penalty at the end, and Leo's friend Jamal scored it.\n\nAfter the match, Minh interviewed Leo. \"How do you feel?\"\n\n\"Amazing,\" said Leo. \"My **workout** every day for a year was worth it. All those boring exercises.\" He looked at his knee. \"And I've learned I don't need to be a professional athlete. I can play for fun and study to be a vet. I can do both.\"\n\nMinh wrote the story. The headline was: \"Leo Parker: The Comeback.\" Grace put it on the back page with a big photo. Leo bought ten copies. \"One for every wall in the house,\" he said.\n\nSome things are forbidden in journalism, things the law and good sense forbid, Grace told Minh later: lying, stealing stories, hurting innocent people. But some things are permitted, even encouraged. Like writing about people you love, with honesty. \"Just tell me first next time,\" she said. \"That's my permission rule.\" Pete came to the match too. He shook Leo's hand. Two survivors, Minh thought. Two kinds of comeback. One religious woman at the match said it was a small miracle. The sportswoman who coached the girls' team said it was hard work. Both were right. When the players began to **shoot** practice balls again, and the last runner finished his final **lap**, Minh turned off his recorder.", "words": 830, "new": [{"w": "terrorism", "p": "n", "vi": "chủ nghĩa khủng bố"}, {"w": "terrorist", "p": "n", "vi": "kẻ khủng bố"}, {"w": "violence", "p": "n", "vi": "bạo lực"}, {"w": "violent", "p": "adj", "vi": "bạo lực"}, {"w": "weapon", "p": "n", "vi": "vũ khí"}, {"w": "gun", "p": "n", "vi": "súng"}, {"w": "demonstration", "p": "n", "vi": "cuộc biểu tình"}, {"w": "riot", "p": "n/v", "vi": "cuộc bạo loạn"}, {"w": "ally", "p": "n", "vi": "đồng minh"}, {"w": "troops", "p": "n", "vi": "quân lính"}, {"w": "military", "p": "adj/n", "vi": "quân sự"}, {"w": "navy", "p": "n", "vi": "hải quân"}, {"w": "battle", "p": "n", "vi": "trận chiến"}, {"w": "invade", "p": "v", "vi": "xâm lược"}, {"w": "invasion", "p": "n", "vi": "cuộc xâm lược"}, {"w": "amateur", "p": "adj/n", "vi": "nghiệp dư"}, {"w": "opponent", "p": "n", "vi": "người phản đối"}, {"w": "rival", "p": "n/v/adj", "vi": "đối thủ"}, {"w": "squad", "p": "n", "vi": "đội tuyển"}, {"w": "lap", "p": "n", "vi": "vòng đua"}, {"w": "foul", "p": "n/v", "vi": "lỗi phạm luật"}, {"w": "tackle", "p": "v/n", "vi": "xử lý, đối phó"}, {"w": "shoot", "p": "v/n/interj", "vi": "bắn; sút"}, {"w": "dribble", "p": "v", "vi": "dẫn bóng"}, {"w": "volley", "p": "n/v", "vi": "đánh bóng trên không"}, {"w": "bounce", "p": "v/n", "vi": "nảy"}, {"w": "sprint", "p": "v/n", "vi": "chạy nước rút"}, {"w": "sprinter", "p": "n", "vi": "vận động viên chạy ngắn"}, {"w": "workout", "p": "n", "vi": "buổi tập luyện"}]}, {"id": "W29-1", "title": "Try Everything", "body": "In February, Grace had an idea for a new series in the Gazette. \"Minh, you're going to try a different hobby every week for two months,\" she said. \"And write about it. We'll call it 'Minh Tries Everything.'\"\n\n\"Everything?\" said Minh.\n\n\"Everything,\" said Grace. \"Readers will love watching you fail.\"\n\nWeek one was sport. Minh went to the sports center. The first class was **archery**. He had a bow and arrows. The target was twenty meters away. His first arrow went into the grass. His second arrow went into the wall. \"Good **stamina**,\" said the teacher kindly. \"Bad aim.\"\n\nThen he tried **fencing**, fighting with thin swords. He wore a white suit and a mask with metal **equipment**. His opponent was a twelve-year-old girl. She beat him in thirty seconds. Then **wrestling**: he lasted ten seconds. Then **weightlifting**: he could not lift the bar. \"You need more strength,\" said the coach. \"And less Vietnamese coffee.\"\n\nWeek two was water sports. He tried **rowing** on the river with the university club. Eight people in one long boat, all pulling together. It was hard but beautiful. Then **canoeing**, alone, which was easier until he fell in. He did not try **scuba** diving because the river was too cold. \"Next summer,\" he promised.\n\nWeek three was extreme sports. Leo taught him to ride a **skateboard** in the park. He fell eleven times. A little boy laughed at him. Mia filmed everything for the website. \"This is gold,\" she said. Sam told him about a **snowboard** holiday in France, and a friend who did a **triathlon**: swimming, cycling and running, one after another. \"No,\" said Minh. \"Never.\" And **mountaineering**? Climbing real mountains with ropes? \"Absolutely never.\"\n\nAt the end of every sports class, Minh learned to **stretch** his muscles, so he would not hurt himself. He still hurt everywhere.\n\nWeek four, he watched a professional cricket match as a **spectator**, to understand the game. An old **umpire** in a white coat stood in the middle and made decisions. Every few minutes, he blew his **whistle**... no, wait. Cricket umpires don't use a whistle. They use their fingers. Minh learned this the hard way when he wrote it in his first draft and an angry reader corrected him. At the end, the winning team lifted a silver **trophy**. Minh understood nothing about the game, but he understood the sportsmanship: both teams shook hands and had tea together.\n\nWeek five was **crafts**. He went to a **pottery** class and tried to make a bowl. It looked like a hat. He tried **origami**, Japanese paper folding. Hana taught him to make a paper bird. His bird looked like a fish. \"It's a fish-bird,\" said Hana generously.\n\nWeek six was quiet **handicraft** at Grandma Rose's house. She taught him **embroidery**, sewing pictures on cloth, and **crochet**, making things from wool with a small hook. \"In my day, every girl learned these,\" she said. \"Now, nobody.\" Minh made a small crochet square. Grandma Rose put it on her wall. \"Your first **craft**,\" she said. \"I'm proud.\"\n\nWeek seven was games. He did a **jigsaw** puzzle with a thousand pieces, which took three days. He did the **crossword** in the newspaper with the old judge from The Blue Cup. He learned **sudoku**, the number puzzle. It was too easy for him. \"Maths again,\" he said.\n\nWeek eight was **nightlife**. Mia and Sam took him to **karaoke**. He sang a Vietnamese song, very badly. Everyone clapped anyway. Then Sam wanted to go to a **nightclub**. The music was so loud that Minh couldn't hear his own thoughts. He went home at midnight. \"I'm too old for this,\" he said. He was twenty-two.\n\nHis articles were very popular. People stopped him in the street. \"You're the man who fell off the skateboard!\" they said. Grace was delighted. \"Your best series yet,\" she said.\n\n\"What's the lesson?\" she asked, for the final article.\n\nMinh thought. \"Every **pastime** looks easy until you try it,\" he wrote. \"But trying is the fun part. You don't need to be good. You just need to start.\"", "words": 679, "new": [{"w": "stretch", "p": "v/n", "vi": "duỗi"}, {"w": "stamina", "p": "n", "vi": "thể lực / sức chịu đựng"}, {"w": "spectator", "p": "n", "vi": "khán giả"}, {"w": "umpire", "p": "n", "vi": "trọng tài"}, {"w": "whistle", "p": "v/n", "vi": "huýt sáo"}, {"w": "trophy", "p": "n", "vi": "cúp vô địch"}, {"w": "equipment", "p": "n", "vi": "thiết bị"}, {"w": "skateboard", "p": "n/v", "vi": "ván trượt"}, {"w": "snowboard", "p": "n/v", "vi": "ván trượt tuyết"}, {"w": "scuba", "p": "n", "vi": "bình thở lặn"}, {"w": "archery", "p": "n", "vi": "môn bắn cung"}, {"w": "fencing", "p": "n", "vi": "môn đấu kiếm"}, {"w": "wrestling", "p": "n", "vi": "môn đấu vật"}, {"w": "weightlifting", "p": "n", "vi": "môn cử tạ"}, {"w": "rowing", "p": "n", "vi": "môn chèo thuyền"}, {"w": "canoeing", "p": "n", "vi": "chèo xuồng"}, {"w": "mountaineering", "p": "n", "vi": "môn leo núi"}, {"w": "triathlon", "p": "n", "vi": "ba môn phối hợp"}, {"w": "pastime", "p": "n", "vi": "trò tiêu khiển"}, {"w": "craft", "p": "n/v/adj", "vi": "nghề thủ công"}, {"w": "crafts", "p": "n", "vi": "thủ công"}, {"w": "handicraft", "p": "n", "vi": "nghề thủ công"}, {"w": "pottery", "p": "n", "vi": "đồ gốm"}, {"w": "origami", "p": "n", "vi": "nghệ thuật gấp giấy"}, {"w": "embroidery", "p": "n", "vi": "thêu"}, {"w": "crochet", "p": "n/v", "vi": "móc len"}, {"w": "jigsaw", "p": "n", "vi": "trò ghép hình"}, {"w": "crossword", "p": "n", "vi": "ô chữ"}, {"w": "sudoku", "p": "n", "vi": "trò sudoku"}, {"w": "karaoke", "p": "n", "vi": "hát karaoke"}, {"w": "nightlife", "p": "n", "vi": "hoạt động giải trí đêm"}, {"w": "nightclub", "p": "n", "vi": "hộp đêm"}]}, {"id": "W29-2", "title": "The Gig", "body": "In March, The Blue Cup finally reopened after the flood repairs. Daniel wanted a big celebration. \"A night of music,\" he said. \"Everyone who can play, plays.\"\n\nDaniel's own band would play, of course. Daniel was the **guitarist** and the **vocalist**. His friend Mike was the **drummer**. A new member, a young woman called Priya, was a **pianist**. And there was a **violinist**, an old man who used to play in an orchestra.\n\n\"I want you to write about it,\" Grace told Minh. \"From the inside. The **rehearsals**, the preparations, everything.\"\n\nSo Minh went to every **rehearsal**. They **rehearsed** in the café after closing time, three nights a week. It was not easy. The drummer was always too loud. The pianist was always too fast. The violinist was always late. Daniel shouted a lot.\n\n\"Is it always like this?\" Minh asked Priya.\n\n\"Always,\" she said. \"Musicians are **enthusiasts**. We all love music so much that we argue about every note.\"\n\nPriya was also a **composer**. She **composed** her own songs. She played one for Minh, a beautiful, sad piece. \"It's about my grandmother,\" she said. \"She came from India in 1970.\" Minh asked about her **composition**. \"I write the melody first,\" she said. \"Then the **harmony**. Then the words.\"\n\nThe old violinist had been a **soloist** in a big orchestra in London. He had played with a famous **conductor**. \"I played on the **soundtrack** for three films,\" he said proudly. \"One was a hit. It went to number one in the chart.\" He had a recording of it on his phone. He played it for everyone at least five times.\n\nOn the night of the **gig**, the café was full. People stood outside in the street, looking through the windows. There were families, students, old people. Everyone who had bought a share in the café was there.\n\nThe band played for two hours. They played old songs and new songs, fast songs and slow songs. At first, they were nervous. Then they relaxed. The music was warm and **amusing**. Daniel told funny stories between songs. People laughed and sang along.\n\nHalfway through, Daniel stopped. \"I want to say thank you,\" he said. \"A year ago, this café almost closed. Now it belongs to you. All of you. So this song is for you.\"\n\nThey played a song that Priya had written about The Blue Cup. It was about a small café by a river, and the people who loved it. Grandma Rose cried. Pat cried. Even Daniel cried a little.\n\nMinh looked around the room. Everyone was different. There were **gamers** who usually spent all night online. There were **birdwatching** **hobbyists** from the nature club. There was a woman who made a **scrapbook** of every event in Riverford. There was a man who called himself a coffee **addict** and drank five cups a day. And there were Hana, Sam, Mia, Leo, Tom and Anna. Music made them all one.\n\nAfter the concert, people stayed to talk and **socialize**. Leo talked to the birdwatchers about rare birds. Mia talked to Priya about art and music. Sam talked to everyone about his new company. Hana and Minh sat in the corner, holding hands.\n\n\"This is my favourite kind of **outing**,\" said Hana. \"Not **clubbing**. Not expensive restaurants. Just friends and music.\"\n\n\"Mine too,\" said Minh.\n\nMinh wrote his article that night. He wrote about **recreation** and community, about the power of music to **entertain**, to **amuse**, to bring people together. He wrote about **blogging** and **gaming**, the modern hobbies that keep people at home, and about **recreational** activities that bring them out. \"We spend our lives alone with our screens,\" he wrote. \"We need nights like this. Nights when we remember we're not alone.\"\n\nGrace read it the next morning. \"It's good,\" she said. \"It's very good. It's a little bit sentimental.\"\n\n\"Is that bad?\"\n\n\"Not this time,\" said Grace. \"This time, it's right.\"", "words": 651, "new": [{"w": "clubbing", "p": "n", "vi": "đi hộp đêm"}, {"w": "birdwatching", "p": "n", "vi": "ngắm chim"}, {"w": "scrapbook", "p": "n", "vi": "sổ lưu niệm"}, {"w": "blogging", "p": "n", "vi": "viết blog"}, {"w": "gaming", "p": "n", "vi": "chơi trò chơi điện tử"}, {"w": "gamer", "p": "n", "vi": "game thủ"}, {"w": "outing", "p": "n", "vi": "chuyến đi chơi"}, {"w": "socialize", "p": "v", "vi": "giao lưu"}, {"w": "entertain", "p": "v", "vi": "làm vui"}, {"w": "amuse", "p": "v", "vi": "làm thích thú"}, {"w": "amusing", "p": "adj", "vi": "vui nhộn"}, {"w": "recreation", "p": "n", "vi": "sự giải trí"}, {"w": "recreational", "p": "adj", "vi": "thuộc giải trí"}, {"w": "enthusiast", "p": "n", "vi": "người đam mê"}, {"w": "addict", "p": "n", "vi": "người nghiện"}, {"w": "hobbyist", "p": "n", "vi": "người chơi theo sở thích"}, {"w": "composer", "p": "n", "vi": "nhà soạn nhạc"}, {"w": "compose", "p": "v", "vi": "sáng tác"}, {"w": "composition", "p": "n", "vi": "thành phần"}, {"w": "conductor", "p": "n", "vi": "nhạc trưởng"}, {"w": "soloist", "p": "n", "vi": "nghệ sĩ độc tấu"}, {"w": "vocalist", "p": "n", "vi": "ca sĩ"}, {"w": "guitarist", "p": "n", "vi": "người chơi ghi ta"}, {"w": "pianist", "p": "n", "vi": "nghệ sĩ dương cầm"}, {"w": "drummer", "p": "n", "vi": "tay trống"}, {"w": "violinist", "p": "n", "vi": "nghệ sĩ vĩ cầm"}, {"w": "rehearse", "p": "v", "vi": "tập dượt"}, {"w": "rehearsal", "p": "n", "vi": "buổi tập dượt"}, {"w": "gig", "p": "n/v", "vi": "buổi diễn nhạc"}, {"w": "soundtrack", "p": "n", "vi": "nhạc phim"}, {"w": "harmony", "p": "n", "vi": "sự hòa thuận"}]}, {"id": "W29-3", "title": "The Film Premiere", "body": "In April, Mia and Sam had a big project. They had made a short film together. Mia painted the backgrounds and Sam did the animation. It was about a girl who could walk into paintings. The **plot** was simple: the girl walks into a famous **masterpiece** and meets the painter.\n\nThey entered it in a student film festival in London. It was chosen for the final. There was a **premiere**, the first public showing, at a real cinema. The whole family went.\n\nBefore the premiere, Minh interviewed them for the Gazette. \"How did you start?\" he asked.\n\n\"With a **sketch**,\" said Mia. She showed him a drawing in her notebook. \"Just a girl and a painting. Then I made a **watercolor**. Then a big painting on **canvas**.\"\n\n\"Then I wrote the **script**,\" said Sam. \"Well, the **screenplay**. It's the same thing for a film. Then we found the **cast**: the actors who did the voices.\"\n\nThe **cast** was small: Mia's friend from art school, an old actor from the Riverford theater, and Leo, who did the voice of a dog. \"It's my best role,\" said Leo.\n\n\"What **genre** is it?\" asked Minh. \"Comedy? **Drama**? **Tragedy**?\"\n\n\"A bit of everything,\" said Mia. \"It's funny and **dramatic**. There's a **tragic** moment in the middle, when the girl almost can't get out of the painting. But it ends happily.\"\n\nThey showed Minh the **trailer**, a one-minute version with music. It was beautiful. \"It looks like a **blockbuster**,\" he said.\n\n\"It cost three hundred pounds,\" said Sam. \"So, not quite.\"\n\nOn the night of the premiere, the cinema was full. There were ten films in the final. Mia and Sam's film was number seven. The family sat together. Grandma Rose had her best hat. Margaret came from Scotland again.\n\nThe films were very different. One was abstract, just colors and shapes. One was very **realistic**, about a family in a poor city. One was a foreign film with **subtitles**. Another was **dubbed** into English, with voices that didn't match the mouths. One was by a young **comedian** who made the whole room laugh.\n\nThen it was their film. The room went dark. The music began, a single soft piano **chord**. On the screen, a girl stood in front of a painting. Then she stepped into it.\n\nFor eight minutes, nobody moved. The colors were amazing. The animation was smooth. Leo's dog voice made everyone laugh. In the dramatic moment, when the girl was trapped, Grandma Rose held Margaret's hand. At the end, when the girl came out of the painting with a gift from the painter, there was silence.\n\nThen the **applause** began. It was loud and long. People **applauded** for a full minute. Some people stood up. Someone shouted, \"**Encore**!\" even though it was a film and they couldn't play it again. Mia was crying. Sam looked like he couldn't breathe.\n\nThey didn't win first prize. They won second. But a **curator** from a big art gallery talked to Mia afterwards. \"I'd like to **exhibit** some of your paintings from the film,\" she said. \"We could **display** them next to the film, in a small exhibition.\"\n\nA famous **playwright**, who wrote plays for the theater, talked to Sam. \"Your story is lovely,\" he said. \"Have you thought about a **sequel**?\"\n\nAt the party after, a **sculptor** talked about art with Grandma Rose. A **craftsman** who made film sets talked with Leo about dogs. A well-known **entertainer** from TV asked for a photo with Mia. \"Your **artwork** is beautiful,\" he said.\n\nOn the train home, Mia slept on Anna's shoulder. Sam looked out of the window, smiling. Minh wrote his article on his phone. He called it \"Two Riverford Artists Step Into the Spotlight.\" He wanted to capture everything: the dark cinema, the bright screen, the sound of the applause.\n\n\"Do you think you'll make more films?\" Minh asked Sam.\n\n\"Definitely,\" said Sam. \"Next time, a full-length film. With a proper budget.\"\n\n\"Three hundred and fifty pounds?\"\n\n\"At least.\"", "words": 665, "new": [{"w": "chord", "p": "n", "vi": "hợp âm"}, {"w": "genre", "p": "n/adj", "vi": "thể loại"}, {"w": "sculptor", "p": "n", "vi": "nhà điêu khắc"}, {"w": "canvas", "p": "n", "vi": "vải vẽ"}, {"w": "sketch", "p": "n/v", "vi": "bản phác họa"}, {"w": "watercolor", "p": "n", "vi": "màu nước"}, {"w": "realistic", "p": "adj", "vi": "thực tế"}, {"w": "masterpiece", "p": "n", "vi": "kiệt tác"}, {"w": "artwork", "p": "n", "vi": "tác phẩm nghệ thuật"}, {"w": "craftsman", "p": "n", "vi": "thợ thủ công"}, {"w": "exhibit", "p": "v/n", "vi": "trưng bày"}, {"w": "display", "p": "v/n", "vi": "trưng bày"}, {"w": "curator", "p": "n", "vi": "người phụ trách bảo tàng"}, {"w": "script", "p": "n/v", "vi": "kịch bản"}, {"w": "screenplay", "p": "n", "vi": "kịch bản phim"}, {"w": "plot", "p": "n", "vi": "cốt truyện"}, {"w": "cast", "p": "n/v", "vi": "dàn diễn viên"}, {"w": "sequel", "p": "n", "vi": "phần tiếp theo"}, {"w": "premiere", "p": "n", "vi": "buổi công chiếu đầu"}, {"w": "trailer", "p": "n", "vi": "đoạn giới thiệu phim"}, {"w": "blockbuster", "p": "n", "vi": "phim bom tấn"}, {"w": "subtitles", "p": "n", "vi": "phụ đề"}, {"w": "dubbed", "p": "adj", "vi": "được lồng tiếng"}, {"w": "drama", "p": "n", "vi": "phim chính kịch"}, {"w": "dramatic", "p": "adj", "vi": "kịch tính"}, {"w": "tragedy", "p": "n", "vi": "bi kịch"}, {"w": "tragic", "p": "adj", "vi": "bi thảm"}, {"w": "comedian", "p": "n", "vi": "diễn viên hài"}, {"w": "playwright", "p": "n", "vi": "nhà viết kịch"}, {"w": "entertainer", "p": "n", "vi": "nghệ sĩ biểu diễn"}, {"w": "applause", "p": "n", "vi": "tiếng vỗ tay"}, {"w": "applaud", "p": "v", "vi": "vỗ tay tán thưởng"}, {"w": "encore", "p": "n", "vi": "tiết mục diễn thêm"}]}, {"id": "W29-4", "title": "Minh's Book", "body": "Minh had always wanted to write a book. Since the poetry night with Mrs. Green, the librarian, the idea had stayed with him. In May, after his final exams, he finally started.\n\nIt was a novel about a Vietnamese boy who goes to live with an English family. \"So it's about you,\" said Hana.\n\n\"It's fiction,\" said Minh. \"The boy is called Long, not Minh. And the family is different.\"\n\n\"How different?\"\n\n\"The grandmother is called Iris, not Rose.\"\n\nHana laughed.\n\nHe went to see Mrs. Green at the library for advice. She was delighted. \"Every good writer writes about what they know,\" she said. \"The question is: what's your theme? What is the book really about?\"\n\nMinh thought. \"Belonging,\" he said. \"Finding a home in two places.\"\n\n\"Good. Now, who is your **narrator**? Who tells the story?\"\n\n\"Long tells it himself. In the first person. 'I.'\"\n\n\"And who is your **hero**? And is there a **heroine**?\"\n\n\"Long is the hero. And there's a girl... a heroine. She's a nurse.\"\n\nMrs. Green smiled. \"And who is your **villain**?\"\n\nMinh thought. \"There's no real villain. Just difficulties. Language, homesickness, loneliness. Maybe a rude waiter.\"\n\n\"Interesting. Not every story needs a villain. Some of the best classic novels don't have one.\"\n\nShe gave him books to read. A **mystery** with a **detective** who solved crimes in a small English village. A **fantasy** about a boy wizard, which was a famous bestseller. Some **literary** novels that had won big prizes. Some in **paperback**, some in **hardback**. \"Read like a writer,\" she said. \"Notice how they do it.\"\n\nMinh read everything. He made notes. He copied an extract from each book that he liked. He wrote down a quotation from a famous writer, a quote he loved: \"Write the book you want to read.\" He also learned to write a summary of each chapter before he wrote it, to summarize his ideas.\n\nHis biggest problem was language. English was not his native language. He was fluent now, but his fluency was not perfect. Sometimes he didn't know the right expression. Sometimes he used slang in the wrong place. Sometimes his **punctuation** was wrong: a comma in the wrong place, a missing apostrophe, a **hyphen** where there shouldn't be one.\n\nHana helped him. Grace helped him. Even Grandma Rose read his chapters and wrote notes in the margins. \"Too many adjectives,\" she wrote. \"And 'very' is a lazy word.\"\n\nHe also used his **bilingual** skills. Some parts of the book were in Vietnamese, with English translations. Some characters spoke English with Vietnamese grammar. Long's grandmother spoke in the **dialect** of his village. He had to define some Vietnamese words for English readers, with a definition at the bottom of the page.\n\nHe thought a lot about language. Every language had different sounds: different vowels and consonants, different numbers of syllables. Vietnamese words had one syllable; English words could have five. Every language had its own idioms, strange phrases that didn't make sense if you translated them word by word. \"It's raining cats and dogs,\" Tom liked to say. In Vietnamese, there was no such idiom. Minh had to find a synonym for everything. He even made a list of abbreviations that confused him: ASAP, FYI, BTW.\n\nHis **imagination** grew with every chapter. He wrote at night, after work. He wrote on the train. He wrote in the café on Sunday mornings. It was hard, but it was the best kind of hard.\n\n\"Where do you get your **inspiration**?\" Hana asked one evening.\n\n\"From everything,\" said Minh. \"From you. From the Parkers. From my family in Vietnam. Everything I've seen **inspires** me.\"\n\n\"That sounds **imaginative**,\" said Hana. \"But also tiring.\"\n\n\"It is,\" said Minh. \"But I want to finish it. I want my parents to hold it one day.\"\n\nBy June, he had written ten chapters. A hundred pages. Mrs. Green read them. \"It's good,\" she said. \"Really good. You have **creativity** and heart. Keep going. Don't think about **fame** or money. Just write the best book you can.\"\n\n\"Do you think anyone will read it?\"\n\n\"I will,\" said Mrs. Green. \"And I'll ask you for an **autograph**. Now go and write chapter eleven.\"\n\nA reviewer might be harsh one day, Minh thought, but it didn't matter now. He walked home, already thinking about the next sentence.", "words": 721, "new": [{"w": "autograph", "p": "n", "vi": "chữ ký lưu niệm"}, {"w": "fame", "p": "n", "vi": "danh tiếng"}, {"w": "creativity", "p": "n", "vi": "sáng tạo, tính sáng tạo"}, {"w": "imagination", "p": "n", "vi": "trí tưởng tượng"}, {"w": "imaginative", "p": "adj", "vi": "giàu trí tưởng tượng"}, {"w": "inspire", "p": "v", "vi": "truyền cảm hứng"}, {"w": "inspiration", "p": "n", "vi": "cảm hứng"}, {"w": "literary", "p": "adj", "vi": "thuộc văn chương"}, {"w": "narrator", "p": "n", "vi": "người kể chuyện"}, {"w": "hero", "p": "n", "vi": "nam nhân vật chính"}, {"w": "heroine", "p": "n", "vi": "nữ nhân vật chính"}, {"w": "villain", "p": "n", "vi": "nhân vật phản diện"}, {"w": "mystery", "p": "n", "vi": "truyện bí ẩn"}, {"w": "detective", "p": "n", "vi": "thám tử"}, {"w": "fantasy", "p": "n", "vi": "truyện kỳ ảo"}, {"w": "paperback", "p": "n", "vi": "sách bìa mềm"}, {"w": "hardback", "p": "n", "vi": "sách bìa cứng"}, {"w": "bilingual", "p": "adj/n", "vi": "song ngữ"}, {"w": "dialect", "p": "n", "vi": "phương ngữ / tiếng địa phương"}, {"w": "punctuation", "p": "n", "vi": "dấu câu"}, {"w": "hyphen", "p": "n", "vi": "dấu gạch nối"}]}, {"id": "W30-1", "title": "The Reunion", "body": "In July, Minh graduated. And for the **occasion**, his parents came to England. It was their first time **overseas**. They had never been on a plane before.\n\nMinh waited at the airport for two hours. When he saw them come through the doors, he could not speak. His mother looked smaller than he remembered. His father looked older. They were carrying three huge bags of food. \"Because English food is bad,\" his mother said, before she even said hello. Then she cried and held him for a long time.\n\nIt was a **reunion** Minh would never forget.\n\nThe Parkers organized a big **gathering** to welcome them. Everyone came: Grandma Rose, Margaret, Daniel, Pat, Sam, Hana, Mr. Okafor, Grace from the Gazette. Anna cooked a huge **banquet**. Minh's mother cooked too, in Anna's kitchen, and the two mothers argued happily about salt.\n\nMinh had to interpret for his parents. They spoke very little English. Tom spoke no Vietnamese. \"I'm the interpreter,\" Minh said. \"It's not just words. It's the intonation too: how you say things. It's harder than translating. You have to do it immediately.\" But sometimes no communication was needed. Tom and Minh's father went into the garage together to look at an old motorbike. They came out an hour later, covered in oil and laughing. They had no common language, but they could communicate perfectly.\n\nGrandma Rose and Minh's mother had a long conversation, with Minh in the middle. They talked about their sons, their husbands, their lives. Grandma Rose was moved. \"Tell her she has a wonderful son,\" she said. Minh's mother answered: \"Tell her she was his English mother. Thank you.\"\n\nMinh's mother was very **superstitious**. She brought a red envelope for Minh with lucky money. She said nobody should cut their hair before the graduation. She checked the **lunar** calendar for the best day. \"In Vietnam, we follow the **zodiac**,\" she explained to Anna. \"Minh was born in the Year of the Dragon. That's why he's brave.\" Anna was fascinated by the **superstition**.\n\nTom raised his glass. \"**Cheers**!\" he said. \"Congratulations to Minh!\" In Vietnamese, they said \"Một, hai, ba, dzô!\" Everyone tried to say it. Nobody could.\n\nThe graduation ceremony was at the university's great hall the next day. Minh wore a black gown and a strange square hat. His parents sat in the front row. When his name was called, he walked across the stage. The professor shook his hand and congratulated him. His mother cried. His father stood up and clapped. Grandma Rose shouted, \"That's our boy!\"\n\nThere was a short **ritual** at the start: a **priest** said a prayer for the students. A Buddhist **monk** from the city's temple was also there, and a Catholic **nun** who taught at the university. \"The university welcomes every faith and every belief,\" said the speaker. At the end, everyone stood for the national **anthem**. Minh's father stood very straight, though he didn't know the words.\n\nAfter the ceremony, Minh's parents wanted to see something **spiritual**. Minh took them to the cathedral, where a guide told them about a **saint** buried there eight hundred years ago. \"**Pilgrims** used to walk here from all over England to **worship**,\" she said. Minh's mother lit a candle. \"For Grandma,\" she said. \"For a **blessing**.\"\n\nThen they visited a war **memorial** by the river. Minh's father read the names silently. \"Every country has these,\" he said. \"Every country loses its sons.\" In Vietnam, too, families **mourned** for years after the war. Minh's grandmother had worn black for a year after her husband died. \"**Mourning** is love with nowhere to go,\" his father said quietly.\n\nGrandma Rose, who was with them, told them the **legend** of the river: a story about a princess who turned into water to save her people. \"Every place has its **myths**,\" she said. \"This river has many.\" Minh's father told her about the Vietnamese legend of the dragon and the fairy, the parents of all Vietnamese people. \"We're all children of a dragon,\" he said. Grandma Rose said she always knew Minh was special.\n\nThat night, Minh's parents asked him a difficult question. \"Will you come home now?\" his mother asked. \"You have your degree. Your job in England is finished.\"\n\nMinh did not know what to say. Grace had offered him a job at the Gazette. Hana was staying in England to work at the hospital. And the Parkers were his family too. But his real family was in Vietnam.\n\n\"I don't know, Mum,\" he said honestly. \"I need time to think.\"\n\nHis father put a hand on his shoulder. \"We didn't come here to take you home,\" he said. \"We came to **commemorate** your success. Whatever you decide, we'll **bless** it. You're a man now. It's your life.\"\n\nLater, Minh learned that his father had asked Tom many questions about British **citizenship**, visas and work. His father had already started to accept that his son might stay. It was the most **festive** week of Minh's life. It was also the most confusing.", "words": 839, "new": [{"w": "spiritual", "p": "adj", "vi": "thuộc tâm linh"}, {"w": "ritual", "p": "n", "vi": "nghi thức"}, {"w": "worship", "p": "v/n", "vi": "thờ phượng"}, {"w": "saint", "p": "n", "vi": "vị thánh"}, {"w": "priest", "p": "n", "vi": "linh mục"}, {"w": "monk", "p": "n", "vi": "tu sĩ nam"}, {"w": "nun", "p": "n", "vi": "nữ tu"}, {"w": "pilgrim", "p": "n", "vi": "người hành hương"}, {"w": "festive", "p": "adj", "vi": "mang không khí lễ hội"}, {"w": "occasion", "p": "n/v", "vi": "dịp"}, {"w": "reunion", "p": "n", "vi": "cuộc đoàn tụ"}, {"w": "gathering", "p": "n", "vi": "buổi tụ họp"}, {"w": "banquet", "p": "n", "vi": "tiệc lớn"}, {"w": "cheers", "p": "interj", "vi": "chúc mừng"}, {"w": "commemorate", "p": "v", "vi": "tưởng niệm"}, {"w": "memorial", "p": "n/adj", "vi": "đài tưởng niệm"}, {"w": "mourn", "p": "v", "vi": "thương tiếc"}, {"w": "mourning", "p": "n", "vi": "sự để tang"}, {"w": "legend", "p": "n", "vi": "truyền thuyết"}, {"w": "myth", "p": "n", "vi": "thần thoại"}, {"w": "superstition", "p": "n", "vi": "sự mê tín"}, {"w": "superstitious", "p": "adj", "vi": "mê tín"}, {"w": "blessing", "p": "n", "vi": "lời chúc phúc"}, {"w": "bless", "p": "v", "vi": "ban phúc"}, {"w": "lunar", "p": "adj", "vi": "thuộc mặt trăng"}, {"w": "zodiac", "p": "n", "vi": "hoàng đạo"}, {"w": "overseas", "p": "adj/adv", "vi": "ở nước ngoài"}, {"w": "citizenship", "p": "n", "vi": "quốc tịch"}, {"w": "anthem", "p": "n", "vi": "quốc ca"}]}, {"id": "W30-2", "title": "Students of the World", "body": "At the graduation party, Minh's parents met students from all over the world. His mother kept a list in her notebook. \"So many countries,\" she said. \"I want to remember them all.\"\n\nThere was a girl from **Finland**, who spoke **Finnish** and wore no coat even when it was cold. \"In Finland, this is summer,\" she said. There was a boy from **Denmark** who taught Minh's father to say \"cheers\" in **Danish**. There was a **Belgian** girl from **Belgium** who brought chocolate for everyone, and an **Austrian** student from **Austria** who played the piano at the party.\n\nThere was a quiet **Hungarian** student from **Hungary** who studied engineering, and a **Czech** student who said **Czech** beer was the best in the world. There was a **Ukrainian** student from **Ukraine** who had come to England as a refugee during the war. She studied medicine, like Hana. \"One day I'll go home and help rebuild my country,\" she said.\n\nFrom the Middle East, there was a **Saudi** student, very polite, and an **Iraqi** student from **Iraq** who studied architecture. There was a young man from **Afghanistan** who had walked across five countries to reach England when he was fifteen. Minh's mother listened to his story and held his hand. She did not understand the words, but she understood.\n\nThere were students from Asia, too. A girl from **Bangladesh** who wanted to be a doctor. A boy from **Myanmar** who studied business with Minh. A **Mongolian** student from **Mongolia** who said his family lived in a tent on the grassland and had three hundred horses. \"Like a cowboy,\" said Leo, impressed. A student from **Nepal**, who had climbed half of Everest with his father, a mountain guide.\n\nAnd there were students from the Caribbean and Africa. A **Cuban** student from **Cuba** taught everyone to dance salsa. A **Jamaican** student from **Jamaica** played music on a big speaker. Minh's father tried to dance. Everyone laughed, including him.\n\nMinh's mother asked Minh to show her where all these countries were. So he took out his phone and opened a map. He showed her **Antarctica** at the bottom of the world, covered in ice. He showed her the **Arctic** at the top. \"Penguins live in Antarctica,\" he said. \"Polar bears in the Arctic. They never meet.\"\n\nHe showed her the oceans. The **Atlantic**, between Europe and America. The **Pacific**, the biggest ocean, between Asia and America. \"Vietnam is on the Pacific,\" he said. \"England is on the Atlantic. That's why it's so far.\"\n\n\"And the **Mediterranean**?\" asked Sam, who was listening. \"That's my sea. In Spain. The most beautiful sea in the world.\"\n\n\"Everyone says their sea is the most beautiful,\" said Hana.\n\nNext to the Mediterranean, Minh showed his mother **Morocco**, the African country where Sam almost went last summer. \"Next time,\" Sam said again.\n\nMinh's father was amazed. \"When I was young, I knew only Vietnam, China, Russia, America and France,\" he said. \"Because of the wars. Now my son has friends from fifty countries.\"\n\n\"Is that good?\" asked Minh's mother.\n\nMinh's father thought. \"Yes,\" he said. \"Very good. If everyone had friends from fifty countries, there would be no more wars.\"\n\nAt the end of the party, all the students stood together for a photo. Fifty faces from fifty countries, all smiling. Minh's mother took the photo with her phone. \"This is going on my wall at home,\" she said. \"Next to the photo of Ho Chi Minh and the photo of your grandfather.\"\n\n\"That's a big honor,\" said Minh.\n\n\"It's a big photo,\" said his mother. \"Many people in it.\"", "words": 598, "new": [{"w": "Antarctica", "p": "n", "vi": "châu Nam Cực"}, {"w": "Arctic", "p": "n/adj", "vi": "Bắc Cực"}, {"w": "Atlantic", "p": "n/adj", "vi": "Đại Tây Dương"}, {"w": "Pacific", "p": "n/adj", "vi": "Thái Bình Dương"}, {"w": "Mediterranean", "p": "n/adj", "vi": "Địa Trung Hải"}, {"w": "Belgium", "p": "n", "vi": "nước Bỉ"}, {"w": "Belgian", "p": "adj/n", "vi": "thuộc Bỉ"}, {"w": "Denmark", "p": "n", "vi": "nước Đan Mạch"}, {"w": "Danish", "p": "adj/n", "vi": "tiếng Đan Mạch"}, {"w": "Finland", "p": "n", "vi": "nước Phần Lan"}, {"w": "Finnish", "p": "adj/n", "vi": "tiếng Phần Lan"}, {"w": "Austria", "p": "n", "vi": "nước Áo"}, {"w": "Austrian", "p": "adj/n", "vi": "thuộc Áo"}, {"w": "Hungary", "p": "n", "vi": "nước Hungary"}, {"w": "Hungarian", "p": "adj/n", "vi": "tiếng Hungary"}, {"w": "Ukraine", "p": "n", "vi": "nước Ukraine"}, {"w": "Ukrainian", "p": "adj/n", "vi": "thuộc Ukraine"}, {"w": "Czech", "p": "adj/n", "vi": "tiếng Séc"}, {"w": "Saudi", "p": "adj/n", "vi": "thuộc Ả Rập Xê Út"}, {"w": "Iraq", "p": "n", "vi": "nước Iraq"}, {"w": "Iraqi", "p": "adj/n", "vi": "thuộc Iraq"}, {"w": "Afghanistan", "p": "n", "vi": "nước Afghanistan"}, {"w": "Bangladesh", "p": "n", "vi": "nước Bangladesh"}, {"w": "Myanmar", "p": "n", "vi": "nước Myanmar"}, {"w": "Mongolia", "p": "n", "vi": "nước Mông Cổ"}, {"w": "Mongolian", "p": "adj/n", "vi": "thuộc Mông Cổ"}, {"w": "Nepal", "p": "n", "vi": "nước Nepal"}, {"w": "Cuba", "p": "n", "vi": "nước Cuba"}, {"w": "Cuban", "p": "adj/n", "vi": "thuộc Cuba"}, {"w": "Jamaica", "p": "n", "vi": "nước Jamaica"}, {"w": "Jamaican", "p": "adj/n", "vi": "thuộc Jamaica"}, {"w": "Morocco", "p": "n", "vi": "nước Ma Rốc"}]}, {"id": "W30-3", "title": "The Gift", "body": "Before his parents went home, Minh wanted to give them a special gift. Something to remember England. Something to remember the Parkers. He asked Mia for help.\n\n\"Let's make it ourselves,\" said Mia. \"Something artistic.\"\n\nMia had friends at art school who made beautiful things: a **Moroccan** girl who made lamps, and an **Ethiopian** boy from **Ethiopia** who made wooden bowls. A **Ghanaian** student from **Ghana** made colorful cloth. Mia wanted to make something like them.\n\nThey decided to make a model of The Blue Cup, the café that had saved Minh's life in England, and that Minh had helped to save. Mia was the artist. Minh was the helper. They worked in Mia's room for three evenings.\n\nFirst, they made the shape of the building out of **cardboard**. The walls were vertical and the roof was a **pyramid**. Mia drew the outline of each window very carefully, in thin **parallel** lines. The door had a **curved** top. There was a small round window above it, a perfect circle. \"Check every angle,\" said Mia. \"If one angle is wrong, the whole house falls over.\"\n\nThey painted the walls to look like **brick**, a dark **maroon** red with lines between each brick. The front steps looked like **concrete**. Mia painted the floor inside like **marble**, white with gray lines. \"The real café doesn't have a marble floor,\" said Minh. \"It's wood.\" \"It's art,\" said Mia. \"Not a photograph.\"\n\nThe windows were made of **transparent** plastic, so you could see inside. Inside, Mia made tiny tables from **clay**, tiny chairs and a tiny coffee machine. She painted the coffee machine **silvery**, so it looked like metal. On one table, there were tiny cups shaped like little **cylinders**. On another, a tiny cake shaped like a **cone**. There was even a tiny **cube** of sugar, the size of a grain of rice.\n\nOutside, Mia made the river from a piece of blue-green fabric. \"What color is this?\" asked Minh. \"**Turquoise**,\" said Mia. \"Between blue and green. Like the sea in Spain.\"\n\nMia was very serious about colors. Every color had a name. \"This isn't brown, it's **beige**. This isn't purple, it's **violet**. This isn't red, it's **crimson**, darker. And that's **scarlet**, brighter. And Grandma Rose's coat in the model is **khaki**, like an army coat.\" Minh had never known there were so many colors.\n\nThe figures were the hardest part. Mia made tiny people from clay: Daniel behind the counter, Pat with her apron, Grandma Rose with her hat, and Minh at a table with a notebook. Each figure was the size of a finger. She painted their faces with a brush that had three hairs. Every **tone** of skin, every color of hair, was perfect.\n\nThe tree outside the café was **hollow**, made from a cardboard tube, with real moss on top. The street lamp was a small **sphere** of white plastic on a stick. A **diagonal** line of tiny flowers ran from the door to the street. The roof had horizontal lines for the tiles.\n\n\"How do you know how to do all this?\" Minh asked.\n\n\"Art school,\" said Mia. \"And YouTube. And a lot of mistakes.\"\n\nOn the last night, they gave it to Minh's parents. It was in a box with a glass top. The dimensions were small: thirty centimeters wide, twenty high. But it was perfect.\n\nMinh's mother looked at it for a long time. She found the tiny Minh at the table. She touched the glass above him. \"This is where my son lived,\" she said in Vietnamese. \"In this little café.\"\n\n\"Tell her I made it with love,\" said Mia.\n\nMinh translated. His mother hugged Mia. Then she took off her jade bracelet, the one she had worn for twenty years, and put it on Mia's wrist. \"For you,\" she said in English. It was one of the few English sentences she knew.\n\nMia cried. Minh cried. His father pretended to look at the ceiling.\n\nThe next day, his parents flew home. The model was in his mother's hand luggage. She did not let anyone touch it. \"It's more important than the food,\" she said. That was a very big thing for her to say.", "words": 699, "new": [{"w": "Moroccan", "p": "adj/n", "vi": "thuộc Ma Rốc"}, {"w": "Ethiopia", "p": "n", "vi": "nước Ethiopia"}, {"w": "Ethiopian", "p": "adj/n", "vi": "thuộc Ethiopia"}, {"w": "Ghana", "p": "n", "vi": "nước Ghana"}, {"w": "Ghanaian", "p": "adj/n", "vi": "thuộc Ghana"}, {"w": "beige", "p": "n/adj", "vi": "màu be"}, {"w": "turquoise", "p": "n/adj", "vi": "màu xanh ngọc"}, {"w": "violet", "p": "adj/n", "vi": "màu tím"}, {"w": "maroon", "p": "n/adj", "vi": "màu nâu đỏ"}, {"w": "crimson", "p": "n/adj", "vi": "màu đỏ thẫm"}, {"w": "scarlet", "p": "n/adj", "vi": "màu đỏ tươi"}, {"w": "khaki", "p": "n/adj", "vi": "màu kaki"}, {"w": "silvery", "p": "adj", "vi": "óng ánh bạc"}, {"w": "tone", "p": "n/v", "vi": "giọng điệu"}, {"w": "transparent", "p": "adj", "vi": "trong suốt"}, {"w": "hollow", "p": "adj", "vi": "rỗng"}, {"w": "curved", "p": "adj", "vi": "cong"}, {"w": "diagonal", "p": "adj/n", "vi": "chéo"}, {"w": "parallel", "p": "adj/n/v/adv", "vi": "song song"}, {"w": "cube", "p": "n", "vi": "hình lập phương"}, {"w": "sphere", "p": "n", "vi": "hình cầu"}, {"w": "cylinder", "p": "n", "vi": "hình trụ"}, {"w": "pyramid", "p": "n", "vi": "hình chóp"}, {"w": "cone", "p": "n", "vi": "hình nón"}, {"w": "cardboard", "p": "n", "vi": "bìa cứng"}, {"w": "concrete", "p": "n", "vi": "bê tông"}, {"w": "brick", "p": "n/v", "vi": "gạch"}, {"w": "marble", "p": "n", "vi": "đá cẩm thạch"}, {"w": "clay", "p": "n", "vi": "đất sét"}]}, {"id": "W30-4", "title": "The Bridge", "body": "In August, Minh started his first real job: junior reporter at the Riverford Gazette. He had decided to stay in England, at least for a while. His parents ha
